子，化着淡妆的五官端正，用漂亮来形容也不为过。","我摸了摸仙台同学的脸。如果她醒着可能会生气，怪我这样会弄花她的妆，但现在她什么都不会说。我滑动指尖，在她的嘴角停下。","这手指曾碰过她的唇。","也曾碰过她的口中。","比脸颊还柔软的舌头触感又再度复苏。","我想起仙台同学用湿润的舌头舔舐我流出的血那件事。她的舌头压在传来阵阵刺痛的伤口上，非常温暖。我的伤口当然不会因为仙台同学舔过就不痛了。可是她遵照我的命令，吸吮并咽下我的血，脸上露出了不太好看的表情，让我觉得相当愉快。","虽然伤口被她咬的时候，那股痛楚实在是太过强烈，让我这愉快的心情马上就消失了。","我的手指从嘴角滑过，来到嘴唇中央。","柔软得像棉花糖。","我轻轻地按了几下她的嘴唇。","仙台同学没有反应。","「你说点话啊。」","我想听听她的声音。","想听她反驳我的声音。","我现在听不到平常那个会阻止我的声音，所以没办法停下手上的动作。","从嘴唇到下颚。","然后再往下。","我的手指抚过脖子，来到锁骨，可是仙台同学还是没有要醒来的样子。如果我的手指再往下一点，就能直接碰触到她叫我不可以留下吻痕的位置。我犹豫了一下，让手指在锁骨上顺着骨头往肩膀滑过去，当我的手掌正好按在衬衫下面的内衣肩带上时，她的体温变得更高了。","仙台同学明明差不多该醒了，却一动也不动。","我看着她的脖子。","她叫我不能留下吻痕的另一个位置。","我无法挪开自己的目光。","我挪开放在她肩上的手。我没有解开她衬衫的扣子，把脸凑进她的脖子后，一股或许是洗发精味道的甜甜香气扑鼻而来。","我不是第一次闻到这股香味。","仙台同学有来的日子，晚上枕头都会散发出同样的香气。","我把脸贴得更近后，那股香气也变得越来越明显。我的心跳微微加速。","在耳朵稍微下面一点的位置。","我用嘴唇轻轻碰触，心跳声在脑中回荡着。我像是想要忽略那些「噗通」、「噗通」的声音，用力把嘴唇压了上去。我轻轻咬下，柔软的触感传来，我连忙抬起头，往后退开。","我擦拭嘴唇。","用力地擦。","在我拼命擦拭，像是要把刚刚的事情抹去，当作从未发生过时，有人拉了拉我的衬衫。","「你在做什么？」","我听到这有些迷茫的声音后往旁边一看，只见仙台同学微微张开了眼睛。","「没什么。」","我没好气地回答。","「啊，你一定是想做色色的事情吧？」","我觉得她没有发现。","仙台同学睡着了。","她这才醒来，不知道我刚刚做了些什么。","——应该是这样才对。","「才没有。」","听到仙台同学带笑的语气，我清楚地回答道。","「你的脸很红喔。」","仙台同学这么说，把手伸了过来。","我的脸颊没有发烫。","尽管心脏还有点吵，但是我的脸八成不红。","她的手碰到我的脸颊。比平常更温暖的手心令我反射性的往后退。","咚！","「好痛。」","回荡在房里的，是我撞到背的声音。我忘了我身后就是墙壁。不过撞了这一下的冲击，反而让我的心脏平静了下来。","「你说我脸红是骗我的吧。」","我出口抱怨趴着的仙台同学。","「你居然没上当啊。」","「别说这个了，你为什么睡着了啊？」","我轻轻踢开仙台同学的脚，因为她违背了我要她继续念书的命令而责怪她。","「我看你睡着之后就觉得好困，回过神来才发现自己睡着了。现在几点？」","被她这一问，我看了看时钟，确实过了一段不算短的时间。","「快八点了。」","「我还想再睡一下。」","「起来啦。」","我又踹了仙台同学的脚一下。她这才慢吞吞地起身，露出原本被她压在背后的现代国文课本。","「仙台同学。」","「嗯？怎么了？」","「折到了。」","我拿起刚才被仙台同学压在身下的课本给她看。应该是被她的背给压过的封面上，出现了一条干净俐落的折痕。","「啊～对不起。因为我念到一半就睡着了。真的很对不起。」","仙台同学一脸歉疚地向我道歉。","「没关系啦，反正只是课本，无所谓。」","课本能保持原样当然是最好，但折到了也无所谓，反正也只会用一年。不过仙台同学好像很在意。","我听到她又说了声：「对不起。」","「反正马上就用不到了。」","我小心翼翼地把折到的地方压平回去，将课本放到枕头上。","我没那么喜欢念书，也没什么动力准备大考。无论课本有没有折到，我都不打算积极运用它。","「下次我会补偿你的。」","在课本上压出折痕的犯人很歉疚地说道。","「就说没关系了。」","我不知道她打算要做什么，但说要补偿我什么的，感觉也有点麻烦。课本根本不值得她特地补偿我。","比起那种事，我还比较在意我跟仙台同学之间的距离。我的房间很宽敞，可是床铺没有房间那么大，所以我们靠得非常近。可以的话，我希望能跟她再保持一点距离。","「可是折到的毕竟是封面啊，还是会很在意吧。」","跟我不一样，仙台同学似乎很在意折到的课本，有些不满地说道。","因为背后就是墙壁而不能再退后的我，只能稍稍往旁边移动。","「我不在意。」","「就算宫城你不在意，我还是会在意，所以我会补偿你。」","一旦我们的对话陷入这种各说各话的状态，仙台同学基本上是不会让步的。她跟我一样，会想要说服对方接受自己的意见。而且因为她的个性比我原本想像的更守道义，所以她应该是真心想要补偿我，也多半会付诸实行。","「你想做什么都行，不用太认真。」","不过就是课本封面，为此浪费时间争论也很没意义，所以我结束了这个话题。","「那就这么办。」","我不知道仙台同学打算怎么办，但她也简单地用一句话作结，然后轻轻踢了一下我的脚。","「那宫城，我们接下来要做什么？」","「不做什么。你要吃过晚餐再回去的话，我就去准备。」","「要不要吃晚餐喔？」","仙台同学带着看起来不像是在认真思考的表情「嗯～」了一声，接着像是突然想到一样，动手扣上了一颗扣子。","我已经在这个房间里看她解开衬衫的第二颗扣子看过好几次了，然而这是我第一次看到她重新扣上那颗扣子。","她不同于以往的行为让我僵住了。","——她果然发现了。","不对。","我摸仙台同学的脖子时，她还在睡。","所以她应该没有发现才对。","既然如此，她为什么要在这时候扣上衬衫的扣子？","我的心脏好痛，像是被人给揪住了一样。","早知道就不要做那种事了。","因为仙台同学不是我的朋友，更不是情人。","那不是我该对睡着的仙台同学做的事情。","如果是在她醒着的时候那样做就好了。如果是在我命令仙台同学不准动的情况下，就算我做出那种行为，也不会被追究。我也搞不清楚自己刚刚为什么会做出那种事。","「宫城，你的眉头皱得很夸张喔。」","仙台同学指了指我的脸。","「你的表情超严肃的耶。要不要照照镜子？」","「不，不用了。」","比起照镜子，我更想逃离这里。不过我也不能突然走出房间。","「你今天不叫我做吗？」","仙台同学一副什么都不知道的样子，一边举起双手伸展身体，一边问我。","「叫你做什么？」","「叫我舔你。」","「不要。」","今天不适合做那种事。","「这样啊。」","明明是她自己开口问的，仙台同学却兴趣缺缺地回答，接着摸了摸我的脚。她从我没穿袜子的脚尖一路摸到了脚踝。在我因为她温柔地抚过我皮肤的指尖让我觉得很痒，打算缩回脚时，她一把抓住了我的脚踝。","「放开我。」","听我坚决地这么说，她乖乖地遵从了我的指示。但是她的指尖马上又不安分地往上滑去，抓住我的裙摆，还很自然地想顺势掀起我的裙子。","「你不要这样乱来啦。」","我抓住她的手，开口抗议。","「我只是想确认你腿上的瘀青是不是真的消了。」","「那早就消了，有什么好确认的？而且不用掀也看得到吧。」","「说得也是。」","仙台同学甩开我的手，碰触我的膝盖。","说想确认瘀青是不是真的消了，她却连看都不看。","她用以指尖画着圈，抚摸我的膝盖。","她摸我的方式很奇怪。","让我觉得背上一阵发毛。","有点恶心。","「你根本没在看瘀青啊。」","仙台同学依然慢慢地摸着我的膝盖。","「我不要继续摸比较好吗？」","她嘴上这么说，仍旧没有停下手上的动作。","「现在立刻停下来。」","我态度强硬地说。","可是仙台同学还是没停手。","她的指尖从膝盖往下滑去，来到脚背上。像我命令她舔我的脚时那样，继续摸着我。手指沿着血管滑过脚背。这感觉很像有蚂蚁在皮肤上爬来爬去，让我觉得不太舒服。尽管如此，我还是没有认真地阻止仙台同学。我深吸一口气，并在吐出这口气之后，抓住并拉开仙台同学的手。","「够了。真的别再这样做了——你这是在报复我？」","因为我在她睡着时碰了她的脖子。","我以为她这是在报复我那时的行为，才会这么问。","「报复什么？」","仙台同学虽然发出了疑惑的声音，但我分辨不出她是不是真的听不懂我在说什么。可是她看起来莫名地开心，让我有种她在刻意惹怒我的感觉。","「不是报复就算了，手给我。」","我没等她回答便抓住她的手。","「这是命令吗？」","「是命令，所以照我的话做。」","「你又想在我身上留下痕迹了？」","「不是。」","我解开她衬衫上的袖扣，卷起袖子。","朝着仙台同学的手肘和手腕之间……","也就是我之前留下吻痕的位置，一鼓作气地咬了下去。","狠狠地。","我用力到几乎要咬破皮肤的程度，仙台同学推了我的额头。","「等一下，这样真的很痛耶。」","我因为她使劲推着我的额头而抬起头后，她继续抗议地说着。","「太扯了吧。真亏你感这么用力咬别人耶。你是有什么毛病？」","仙台同学一边抚摸着自己的手臂，一边放下袖子。","「让你补偿一下折到我课本的事啊。」","「你不要擅自决定补偿方式啦。」","「有什么关系？反正齿痕这种东西很快就会消失了。」","我之前做过的事最好全都消失不见。","而且这既然是命令，那不管我做什么，仙台同学都没资格抱怨。而且她应该也不是真的在生气。","我们之间就是这种关系，所以这样就好了。","「你刚刚那样咬真的很痛耶。」","仙台同学忿忿不平地说。","「毕竟这有一部分是要惩罚你乱来啊。」","「比起宫城你平常对我做的怪事，那明明就不算什么吧？」","仙台同学从床上下来，用略为不满的语气说道。","和平常一样。","我看到她不悦的样子，心里松了一口气。","〔本话含插图〕"]},{"t":"第8话　因为宫城触碰了我","p":["宫城困惑的样子很好玩。","虽然这样说会让人觉得我很坏，但这都要怪宫城做出了犹如在坦承自己罪行的反应。","「你不要动。」","我朝着坐在桌子另一边看漫画的宫城伸出手。不过在我碰到她之前，她已经先发出了诧异的声音。","「干嘛？」","「有头发。」","我说出伸手的原因后，宫城从书本上抬起头，问我：「在哪里？」","「我帮你拿掉。」","我用手撑着桌面，向前探出身体。朝着宫城的胸前伸出去的手指，碰到了她的脖子。","我没有很明确地碰触到她。","真的就短短一瞬间，轻轻碰到而已。","明明只是像手滑不小心碰了她一下而已，宫城却整个人往后缩。","几天前——","我在这个房间里睡着的那一天，因为脖子附近痒痒的而醒了过来。可是我那时候半梦半醒的，不太清楚是她对我做了什么我才会有这种感觉，还是单纯只是自己的错觉。","唉，不过呢……","看来我原本以为是一场梦的事情，终究不是梦。","只要看看宫城的反应，我就能确定了。那一天，碰到我脖子的是宫城的嘴唇。我拉了一下她那长度微微过肩的头发。","「好痛。」","「抱歉，原来它还没掉下来。」","我拉的是一根无论怎么看都还没有脱落的头发，但我还是刻意补上这句。","「你是故意的吧？」","「因为它看起来已经掉了啊，我只是想帮你拿掉。」","但她说我是故意的这点并没有说错，所以我没否认。","我想起今天进入房间时的状况。","我打算解开第二颗扣子，但停下了手。","只是看了宫城一眼，她却刻意别开视线。","后来她就一直表现得很奇怪。现在也是，我只是稍微闹她一下，她却惊讶到了夸张的程度。","「快点写作业啦。」","宫城不悦地说。","之前变得比较亲人的野猫又开始有了戒心。","今天的宫城看起来就像这样。","「你不用催，我快写完了。」","写作业。","这个在大约一小时之前收到的命令，因为我们现在不同班而变得有点棘手。要是同班，那我们的作业内容就会一样，只要让她抄我的作业就行了。可是现在我们两个班上出的作业不一样，我等于要特地为了她多写一份作业才行。","宫城的成绩不是特别好，也有不擅长的科目，不过整体来说应该还不算太差。","毕竟还有大考在等着我们，她自己认真写作业就好了嘛。","再怎么说，如果能被分在比较优秀的那一边，选项就会增加啊。","成绩这件事也是，会念书总比不会念书好。不仅能选择的大学会变多，在更远的将来也会有更多条路可选。","当然任何事情都有所谓的极限，由于每个人所能够到的天花板高度早就决定好了，这一切也有可能只是无谓的努力就是了。","「你决定好要上哪所大学了吗？」","四月初我问过同样的问题，当时跟我说「不知道」的宫城，这回说出了有点像又不太像的答案。","「还没决定。就算要上大学，只要是能考上的学校，我不管念哪里都可以。」","「你也太随便了吧。」","「因为我对这没兴趣啊。别说这些了，写作业。」","「好好好，我知道啦。」","真浪费。","我是没打算问她「要不要跟我来上同一个考生冲刺班？」之类的话，也不打算劝她用心准备考试，但宫城也太没有干劲了吧？","她总是这样随随便便的，不认真。","那天的她那么积极……应该说，她竟然在未经我允许的情况下把嘴唇凑了上来。","我用手摸了摸脖子。","我不知道她为什么会想吻这个地方。我原本以为是因为她之前想在我身上留下吻痕，才接续着做出这样的行为，但如果是这样，我的脖子上应该会留有痕迹才对。","只是普通的接触，到底有什么意义？","如果我们的关系逐渐朝着宫城原本否认的朋友关系靠近，那倒是无所谓。可是她的行为看起来会迅速地让我们变成不是朋友的某种关系。","我很高兴她愿意亲近我，但她继续做出那种行为的话，我会有点困扰。","我跟宫城的联系感觉会变得更强，有点可怕。","我不希望我们之间有那么深厚的关系，只要维持在不会太白也不会太黑，灰色程度的朋友关系就好。一旦超过了这个范畴，我觉得自己明年会没办法顺利地跟她分开。","我心里明明这样想，却没那么厌恶宫城对我做的事。","这样不好。","我说不出到底哪里不好，但我知道这样不好。","我拿起橡皮擦，丢向宫城。","橡皮擦勾勒出一道平缓的弧线，越过课本掉在她身旁。","「你今天不太说话耶，发生什么事了吗？」","我向抬起头的宫城搭话，并解开衬衫的第二颗扣子，只见她很不自然地别开了视线。","只有我被这种莫名其妙的情绪困扰着，感觉很不愉快。","要是宫城也多少觉得困扰就好了。","「没事。」","宫城冷淡地说，视线马上又落回原本在看的书页上。","「要不要聊聊喜欢的对象？」","「不要。」","我想也是。","她看起来就不像喜欢聊这种话题的样子。","我原本也以为她是个不太熟悉八卦消息的人，这我倒是猜错了。毕竟她知道有人跟我告白的事，应该还是有一定程度的情报网。","「宫城你没有喜欢的对象吗？」","「我不喜欢聊这种话题。」","「那你之前干嘛问我这方面的事？」","她之前非要聊这个，还特地问我拒绝男生告白的理由。","我可不准她说她忘了有这回事。","「……」","看来她不打算回话，我只听到她在翻阅漫画的声音。","「宫城。」","我催她回话，可是她动也不动。不过仔细一看就知道宫城皱起了眉头。我轻轻摸了摸脖子。","不就是因为你亲了这边吗？","这是你自作自受。","好好反省吧。","尽管我心里这样想，但跟无视我的宫城待在同一个房间里也很无聊。","「对了，黄金周期间我想跟你借书。」","我想说差不多可以放过她了，于是改变话题。","「不要。」","「我就知道你会这么说。」","宫城在这方面倒是一如往常。","我觉得她要是能一直保持这样就好了。","只要一直反复做相同的事情，和平的时间便能长久持续下去。我不希望情绪像搭云霄飞车那样起起伏伏。所以宫城这一如既往的回答，让我感觉舒畅许多。","宫城话不多不是什么稀奇的状况。即使是跟我在一起的时候，宫城也原本就不是那么多话的人。这么一想，就觉得宫城不太说话，也不过就是恢复原样罢了吧。","虽然这样不太好玩，但这也没办法。","我的感受没办法改变她的心情。","尽管我用这种想法来解释并接受了宫城又变得冷漠的事实，然而接下来马上就进入了黄金周假期，我在那之后便没再跟她见到面。","然后，在假期结束后又过了两天。","我在学校，直到今天都还没见过宫城。","也没在走廊与她擦身而过。","不同班就是这么回事吧。","我没有因此感到寂寞。毕竟我不缺聊天的对象，也交到了新朋友。我对学校生活没有太多的不满，过得还算顺利，也还满愉快的。虽然新班级里也是有人在说我八面玲珑，光会讨好别人，不过那都是些无须介意的小事。","「我去一下隔壁班。」","在进入下课时间后变得吵吵闹闹的教室里，坐在我斜前方的羽美奈突然说道。","「怎么了？」","「我忘了带课本。」","羽美奈意兴阑珊地说，还补了句：「不然还是跷课好了。」这时麻理子立刻跳出来劝阻她。","「还是别跷课吧，老师不是说你要是再跷课，就要写悔过书吗？」","「嗯～要我写悔过书是无所谓啦。唉，不过这次我就去隔壁班借一下吧。」","留下没什么干劲的声音后，羽美奈走出了教室。","说不上认真的她，一直有跷课的坏习惯。之前也因为这样而被老师叫去训过好几次，但即使升上三年级，她也不像有要改过的样子。二年级时跟我们同班的麻理子去年也常跟羽美奈一起跷课，但升上三年级之后，由于毕业后的出路这面高墙就近在眼前，她便改变了原本的态度。","小圈圈就是在碰到这种状况的时候很麻烦。","只要有一个人做坏事，那个人的朋友也会跟着做坏事。","在别人眼里看起来就是这样。","所以今年麻理子才会因为在意起自己的推甄分数而改变立场，阻止羽美奈。","不过事到如今才在意这种事也没用吧。","我觉得已经太迟了。","不过亡羊补牢总比什么都没做好。","我从抽屉拿出课本与笔记本。上课是不好玩，但我也没打算要跷课。要保持跟同伴不一样的良好印象，也是需要付出相应的努力。","「啊，笔记。叶月，上完课之后借我影印一下。」","我点头答应麻理子。这时一道轻佻的声音传来。","「借到了。」","羽美奈拿出手上的课本给我们看，坐到位子上。","「那个……」","我不禁出声。","映入眼帘的是下一堂课要用的现代国文课本，这点本身是没什么问题。","只是那本课本的封面有一条折痕。","「这个？」","羽美奈露出疑惑的表情，看着课本。","我握紧了拳头。","我居然用仿佛羽美奈手中的课本很特别的语气，说了「那个」——","我不该开口的。不过特地收回已经说出口的话反而更奇怪，羽美奈很有可能会觉得有趣而追问起来。","「那看起来不像瑠华的课本耶。你是跟谁借的？」","瑠华是羽美奈原本打算去借课本的朋友。但是羽美奈手上的课本不是瑠华的，也不是其他朋友的。","羽美奈手上的课本是宫城的。","因为封面上那道折痕是我弄出来的，我不可能认错。","「你怎么知道？」","「就有这种感觉。」","我没说出知道的原因。","羽美奈不知道我跟宫城熟识到光看一眼就能知道那是宫城的课本，我也没必要让羽美奈知道这件事。","「我本来是想跟瑠华借的，但是她不在。我就跟二年级同班的一个女生借了。呃～她叫什么来着？一个黑色头发，不起眼的女生。」","羽美奈一边说：「就是那个……」一边翻找自己的记忆。","但是我觉得羽美奈一定想不起来。","所以我替她回答了。","「……你说宫城？」","「啊～对对对，就是宫城。叶月你啊，记忆力会不会太好了一点？你都不会忘记别人的名字耶。」","羽美奈说得一副很佩服我的样子。她盯着课本看，然后马上笑了出来。","「是说宫城明明那么不起眼，课本却大咧咧地折出了一条折痕耶，有够好笑的。」","羽美奈咯咯笑个不停，这时上课钟声像是要抹去她的笑声似的响起。麻理子连忙回到座位上，老师也走进了教室里。","「安静。开始上课了。」","老师拍了讲桌一下说道。","然后在原本吵闹的教室安静下来之前，老师便开始上课。黑板上写着即使是说客套话，也称不上工整的字。实在不适合写在黑板上的这些文字，就像是爬到地面上的蚯蚓一样歪七扭八，难以辨识。","我看了斜前方的座位一眼。","映入眼帘的有一大半是羽美奈的背影，看不太到她桌上的课本。","我将目光挪回黑板上，把上面的文字抄在笔记本上。我没有要主张那本有折痕的课本属于我的意思，可是一想到羽美奈正在用那本课本上课，我抄笔记的手便觉得沉重无比。","老师沙哑的声音听起来也令人不快，让我感到烦躁。","啪叽。","自动铅笔的笔芯发出微弱的声响，应声而断。","羽美奈明明连宫城的名字都记不住。","我闭上了眼。","我不能去深究这本课本带来的这些情绪是什么。这种难以理解的情绪，只会惹来麻烦。","课本不重要，我不需要这么介意。","我睁开眼睛，看向黑板。","听着老师的声音，抄写笔记。","我在脑海里塞了一些多余事物的情况下反复这些行为，这堂课就这样结束了。","时间逐步流逝。","等我回过神来，下午的课都快上完了。","宫城偏偏不在这种日子找我。","今天这种日子你才应该找我过去啊。","我不禁在心里抱怨。","我今天会去你家。","我从来没有主动传过这种讯息，我们之间没有规定我不可以这么做。只是因为宫城主动联络我变得太理所当然，照理来说我也可以联络她才对。","宣告课堂结束的钟声响起，我拿起手机。","我瞪着手机小小的萤幕。","「你在等谁联络？男朋友吗？」","听到羽美奈的声音，我抬起头。","「我没空交男朋友啦。」","「你每次都说这种话。我会介绍好对象给你，交个男朋友吧。」","「现在先不要吧，等考完大考再说。」","「你也太认真了。你今天是要去课业辅导吗？」","不管我纠正多少次，总是会把考前冲刺班说成课业辅导班的羽美奈问我，我告诉她：「今天不用去。」","「既然这样……」","我想去那里，还有那里。","羽美奈说出自己的希望，随后出现的麻理子也同意她的提案。我把手机收进书包里。果然还是该由宫城主动联络我。","由我联络她就不对了。","在班会结束时，我们已经决定好要去的地方，一起离开了教室。","连假过后，她马上就会联络我。","我原本是这样想的。可是宫城迟迟没有联络我，我的手机直到羽美奈和宫城借了课本的三天后才响起。","没差，我一点都不在意，完全不在意。","既然付钱的是宫城，她只要在自己想联络我的时候联络我就好了。","我先绕去便利商店，买了洋芋片和巧克力。宫城家几乎不会准备零食。反正她今天大概也不会跟我说多少话，我想要是有点零食，应该能比较愉快地打发掉在她家的时间吧。","我提着装了零食的白色塑胶袋，朝着宫城家前进。","抬头仰望天空，天气莫名地好，连一片云都没有，像是刷上了一整片蓝色油漆，完全没有任何多余的事物。不过就像太阳会制造出影子一样，我的心里仍留有一些阴影，带着不是很舒坦的感觉持续向前走。我正在前往待起来理应很舒服的宫城家，这段路途却令我感到愤恨，脚步沉重无比。","为什么我非得抱着这种心情不可啊？","我甩动装有零食的便利商店提袋。","赶走企图盘据在我脑海中的宫城，跑了起来。","大约过了五分钟。","我用不至于会喘不过气来的速度奔跑，并在预计的时间抵达大楼。我按下大厅的电铃通知宫城，叫她开门让我进去。接着搭乘电梯来到六楼，在她家大门前又按了一次门铃后，门打开了。","「给你。」","我脱掉鞋子之后，一张五千圆纸钞随着一句简短到不行的话交到我手里。尽管我们好一阵子没碰面了，宫城还是表现得很冷漠。","「谢谢。」","我公事公办地把她给我的纸钞收进钱包里，走进她的房间。我放下便利商店的提袋后，宫城走出了房间。我来到她房里的书柜前，看了看排列在书柜上的漫画书背，发现数量增加了不少。","我拿起一本没看过的漫画，往床上一坐。在我慢慢翻页时，宫城拿着麦茶和汽水回来了。","「你新买了一些书？」","「因为放假期间没事做。」","宫城没说她买了，只回答了她买这些书的理由，便陷入沉默。","房间里的状况跟连假之前没有太大差别。","宫城也依然维持着对我爱理不理的态度。","我阖上漫画，指了指便利超商提袋。","「我买了那些来，可以开来吃。」","「你自己开啊。」","宫城连看都没看「那些」就这样说，朝著书柜走去。","该说她总爱唱反调吗？只要我说了些什么，她就会回我一些感觉很不满的答复这点也没变。平常我是不太介意，今天却觉得宫城这样的态度让人有些烦躁。","「志绪理。」","我叫了宫城的名字。","「……咦？」","宫城慢了一拍才回过头来，脸上明显带着厌恶的表情，我又喊了一次她的名字。","「我可以叫你志绪理吗？」","就我所知，她的朋友都直接用名字来叫她。","既然如此，我应该也可以这样叫她。","我们虽然不是朋友，却会做些普通朋友不会做的事情。既然我们之间共享着不能告诉他人的秘密，那么用亲近一点的方式称呼彼此，应该也没关系吧。然而宫城似乎不这么想。","「不行。」","她用冷漠的语气说道，接着拿了一本书，在我对面坐下。","「小气。」","我下床，坐到地上。","我从便利商店提袋里拿出洋芋片和巧克力，打开了洋芋片的包装。然后把薄得可怜的马铃薯切片放进嘴里。","一片、两片、三片。","我咀嚼着洋芋片，然后吞进胃里。","宫城明明说我不是朋友，却像朋友那样想要知道跟我有关的事。","想知道跟我告白的男生是谁，然后自己在那里不高兴。","那种反应看起来就是在吃醋。","她明明会吃醋，却不肯让我叫她志绪理。","真没道理。","我看了宫城一眼，她正在看漫画，没有要抬头看我，也没有吃洋芋片。","「喂，宫城，我喂你吃吧？」","我从包装里拿出洋芋片。","「不用，我不吃。」","「不用客气啦。」","我拿了一片薄薄的洋芋片送到宫城嘴边。可是她没吃掉我手上的洋芋片，而是另外从包装里面拿了一片出来。","「我自己吃。」","她说完后大大地张开嘴，直接吃掉整片洋芋片。","「那这片怎么办？」","我让她看看我手中这片被抛弃的洋芋片。","「我不要。」","宫城明确地拒绝我，又再从包装里拿出一片洋芋片，送进嘴里。我把手上这片无处可去的洋芋片收进胃袋里之后，抓住宫城的手。","「干嘛？」","尽管听到她讶异的声音，但我选择忽视。","我主动含住曾经在她的命令之下舔过好几次的手指。","我将舌头用力抵在她的手指上，一股咸味在口中扩散开来。","「仙台同学，不要这样。」","宫城伸手拉住了我的浏海，可是我不打算听她的话。我让舌头一路滑过手指，轻轻咬下。在我的牙齿顶到骨头，再稍稍用力后，她便强行抽出了手指。","「就说这样很讨厌了。」","宫城气呼呼地说，眉头紧紧皱了起来。","看到她这明显不悦的表情，我的心跳快了起来。","『就该露出这种表情。』","以前宫城曾经对不高兴的我这么说过。","一旦我做出厌恶的反应，宫城就会表现出一副很愉快的样子。","我原本不能理解她的想法，但我现在懂了。看到宫城对我表现出情绪，令我兴奋了起来。","「宫城你咸咸的耶。」","我微笑着这么说完后，宫城绷起了脸。","「那是洋芋片的味道吧？」","「也可以这么说。」","「你今天是怎么了，不要做奇怪的事情啦。」","「如果你不希望我做出更奇怪的事情，就命令我啊。」","跟宫城在一起，连我都不认识的自己就会从某处跑出来。如果是不久之前的我，才不会在没有宫城命令的情况下主动舔她的手指。我明明不想跟她牵扯得太深，却无法好好控制。","「我还没想好。」","宫城嘀咕着。","「要帮你写作业吗？」","「仙台同学，你很吵。我会自己想，你先不要说话。」","看样子她今天不打算命令我帮她写作业。","宫城把漫画放在桌上，缓缓喝着汽水。","喜欢命令他人，但不喜欢被人命令。","宫城顶着一张写着这种心态的脸，开始翻起书包。我因为没事好做，便朝着洋芋片的包装伸手过去，但又马上缩手，舔了舔自己的指尖，有着跟宫城一样的味道。","「仙台同学。」","看来宫城是找到想要的东西了吧，一如既往的声音传进我耳里。","「这是命令，把这个藏起来。」","「橡皮擦？」","我看了看放在桌上的东西。","「对。」","「藏起来的意思是，我随便藏在哪里都可以？」","「不是随便藏哪里都可以。要藏在你的制服里，然后我会把它找出来。」","「……宫城你尽是会想一些奇怪的把戏耶。」","如果是要我把橡皮擦藏在房里的某个地方，或许还有点好玩，但要我藏在制服里面，这游戏本身的意义就不太一样了。","「才不奇怪。」","「你一定是想做些奇怪的事情吧。」","「说什么奇怪的事情，那仙台同学，你觉得我会对你做些什么？」","「你会乱摸。」","「会想到那种事情的你才奇怪，仙台同学好变态。」","「你才变态。」","「你要说我变态也没关系，快点藏起来。」","毕竟我收了她五千圆，无权拒绝。","反正就算会被她摸，也是隔着衣服摸，不是什么大问题。","我拿起桌上的橡皮擦，站了起来。","「那你先转过去。」","我说完，宫城便乖乖地转过身去。","制服外套和裙子。","还有衬衫。","我盯着自己的制服看。","虽然命令是要我把橡皮擦藏在制服里，但我不管怎么看，能藏橡皮擦的地方都只有口袋。虽然真要藏的话，也是可以藏在袜子里，不过马上就会被她找到了吧。领带基本上不可能，我手边也没有胶带能把橡皮擦贴在领子里面，但就算有胶带，那样也太显眼了。","能藏的地方有限。","宫城也很清楚这点，所以这场游戏我根本是必输无疑。我想她的目的应该是以寻找橡皮擦为借口，趁机摸我，然后看我做出厌恶的表情或是反应。","追根究柢，她根本没说这是一场游戏，也没说输的那一方要受到惩罚。","所以我只要随便藏藏，敷衍宫城就好。","我把已经用过的橡皮擦放进制服外套的右边口袋里。反正不管放哪个口袋都马上就会被她找到了，不如放在一个比较好拿的地方。","「我藏好了，你可以转过来了。」","我喊了宫城后，她静静地转身，盯着我看。","因为我的口袋有微微鼓起来，她应该一看就知道我把橡皮擦藏在哪里了。实际上，宫城的目光的确在我的制服外套右边口袋上停留了一下。可是她没开口说她找到了。只是默默地靠过来，像在电视节目上看到的某些安检人员那样，隔着我的制服外套，开始搜我身。","我想也是。","早就猜到是这么回事了。","宫城机械式地碰触我的肩膀和背部，这样的行为是不至于令我感到不快，但我的心胸也没有宽大到让人这样乱摸还觉得好玩的程度。不过她毕竟是隔着制服外套摸，所以我也不是太在意。","宫城的手刻意避开口袋，摸向裙子。","她摸着我的腰骨附近，像是在拍打大腿那样寻找着橡皮擦。","然而橡皮擦不可能藏在那里，所以她的手最终还是来到了裙子的口袋处。她先柔和地抚过口袋上方，接着绕到我身后。我本想转头看看她打算做什么，她却抢先我一步，将手伸进了口袋里。","原来是从前面不好伸进来啊。","在我心想着「原来如此」，理解了她的行为时，宫城的手在里头摸来摸去，我不禁抓住了她一直乱动的手。","「你的手不要乱动啦。」","制作口袋的布料比裙子本身的布料还要单薄。明知道橡皮擦不在口袋里，还刻意仔细确认的这只手，就像直接摸在我大腿上一样，感觉有点恶心。","「不动的话，不就不知道橡皮擦有没有藏在里面了吗？」","「一般来说，手伸进来的瞬间就会知道了吧？」","「不知道。」","不听话的宫城又打算动手，于是我硬把她的手从口袋抽了出来。","我就知道事情会变成这样。","她应该是在报复我。","因为我直接叫她志绪理，又舔了她的手指，做了一些戏弄她的行为，她才会报复我。虽然我不清楚她接下来打算做什么，不过肯定不是我会觉得愉快的事。","「可以不要找了吗？」","「不可以。」","宫城这么说，接着站到我面前，解开我制服外套的扣子。","我早知道她不会罢休，她会解开我制服外套的扣子也在我预料之内，可是我的身体还是反射性地僵住了。宫城打开我的制服外套，目光由上往下，扫过早该知道不可能藏有橡皮擦的衬衫。接着伸出右手，触碰我的侧腹。","她的手像是在仔细摸索似的移动着，我按住了她的手臂。","很痒。","隔着制服外套我还可以忍受，但是衬衫的布料太单薄了。只要她的手一动，我就觉得浑身发毛，不太想被她摸。明明有制服隔开我和宫城，我却觉得她好像在直接摸我的身体。","这只是一场游戏。","不用太介意。","我虽然这样告诉自己，可是衬衫实在太不可靠了。单薄的布料把宫城的体温传递给我，让我的脑差点误以为我们正在做不该做的事。","我觉得差不多该停止了，但宫城不仅没有停手，甚至还更用力地摸了上来。她像是在撕开面包一样，用力地捏了我的侧腹，让我的身体为之一颤。当我回过神来，发现她的左手已经在腰骨稍微往上的位置游移。","「原来你侧腹这么禁不起摸？」","宫城用摆明就是在调侃我的语气说。","「与其说禁不起摸，就是会痒啊。」","「那就是禁不起摸嘛。」","宫城的指尖缓缓抚过侧腹。","衬衫摩擦着我的身体，令我不禁颤抖。","指尖往背部滑去，指甲像是在写字一样，在我的衬衫上移动。","我抓住宫城的手臂。","她碰我的方式跟刚刚不同。","尽管她脸上表情和平常并无二致，但该说她的摸法很色情吗，总之不是朋友之间的触摸方式。这跟我和羽美奈她们打闹时互相触摸彼此的感觉不一样。","如果是一开始那种不带感情的摸法还无所谓。","我可以当作这只是一场游戏。","但这个方式就不好了。","「我会痒，不要这样。」","要是再这样让她摸下去，我觉得心里会冒出一股不太好的情感，所以我更用力的抓住了她手臂。","「那我要找其他地方，放开我。」","「我可以放开你，但你要是再做出同样的事，我就会打你。」","「使用暴力不是违反我们的规定吗？」","她的声音听起来很平静，但是这种事不用她说我也知道。而且我自己没事也不想打人。","「你一定要去找别的地方喔。」","我再次叮咛之后放开手，宫城没有再做出一样的举动。相对的，她获得自由的手伸进了我衬衫胸前的口袋里，我想起她的手在我裙子口袋里做过的好事。","「你是明知道橡皮擦不在那里，还刻意这么做的吧？」","我踢了一下宫城的脚，以示抗议。","我不希望她隔着衬衫这么不可靠的单薄布料摸我。","「仙台同学，你违反规定了。还有不好好确认，我怎么知道你是不是真的没有藏在这里呢？」","「你很讨厌耶。」","宫城的语气相当愉快，真的很令人恼火。","「没事。我知道不在这里了，我会去找其他地方。」","我不知道她这句没事是在指什么，但她把手从我胸前的口袋里拿了出来。","「快结束这游戏啦。答案根本就显而易见吧。」","我不想再玩这种游戏了。","我很清楚，再继续下去也没好事。","「再陪我一下嘛。」","「你还想干嘛？」","「我要解开你的领带。」","「啥？」","宫城忽略我下意识脱口而出的话，就这样松开了我的领带。然后她毫不犹豫地摸了我的脖子，手掌紧密地贴合在我的肌肤上。","跟隔着布料截然不同的明确感觉。","宫城的手显得异常地火热。","说不定是我自己的体温升高了，但我分不清楚。她的手更用力地按了上来，我有种自己和宫城之间的界线变得模糊不清的感觉，或许是因为那里是她的唇曾经碰触过的位置。","「志绪理。」","我用宫城说了不行的方式叫她，将自己的手叠在她的手上。","「不要那样叫我。」","宫城连同我的手一起，将原本几乎要与我的脖子黏一起的手强行扯开，并且皱起眉头，像是生气了那样瞪着我。","看到她一脸苦闷的表情，让我原本逐渐沉重的心情轻松了许多。","宫城最好也多少感到困扰一下。不然只有我觉得困扰，太不公平了吧？","「要我再叫一次吗？」","听到我柔声地这么问，宫城眉间的皱褶更深了。尽管不清楚理由，但对她来说，被我呼唤名字似乎是件很不愉快的事。","「你不要说话。」","宫城不悦地说，用手捏住我的衬衫钮扣。","「你想做什么？」","她没回答。","宫城默默解开我的衬衫钮扣。","上面两颗扣子原本就没扣上，所以她解开了第三颗扣子，我出手按住正打算解开第四颗扣子的宫城肩膀。","「等一下。」","「干嘛？」","「你放开手。你是想脱光我的衣服吗？不需要这么做吧。」","我拉开宫城的手，扣上被她解开的扣子。","她一定不是真的想要脱掉我的衣服。我觉得只是游戏到了途中就变成在挑战双方的底线，比谁先开口认输而已。我们彼此应该都知道那条不能跨越的界线在哪里。","「我只是想说会不会藏在衣服里面。」","「我怎么可能会藏进来，你这样违反规则吧？」","「我们的规则是说不可以做爱，但没说不能脱衣服吧？」","「那现在立刻加这条规则进去。」","「只是开玩笑而已。我怎么可能会脱你衣服啊？」","我知道。","我也知道她只是在开玩笑。","这不过是在玩文字游戏的一环，她只是在等我求她停下来。","尽管如此，我还是觉得这种玩笑太恶劣了。","「你根本就知道我藏在哪里吧？」","我用力踩了宫城一脚，她才碰了碰我制服外套的右边口袋。","「这里？」","「答对了。游戏到此结束。」","我在她开口说再玩一次之前宣告游戏结束，重新系好领带。对她抱怨了一句：「宫城你这个大色狼。」后，坐到床上。","「所以今天的命令结束了吗？」","我这样问她，宫城一脸无趣地回了：「结束了。」喝了一口汽水。她把喝完后的空杯子放在桌上，背靠着床铺，坐在地上。","我看不到她的表情。","也不知道她在想什么。","她整个人都很奇怪。","才觉得她一时兴起地接近我了，她又很快就把我当成玩腻的玩具给丢掉。","宫城的制服碰到了我的脚。","我觉得她的制服外套弄得我很痒，拍了一下她的肩膀。","〔本话含插图〕"]},{"t":"第9话　即使仙台同学察觉了也无所谓","p":["我知道即使打开冰箱，里面也什么都没有。","我在厨房叹气。","如果仙台同学没有买材料过来，就连炸鸡块都做不了。","——不过就算有材料，我也不会做炸鸡块。","「要吃什么好呢？」","我说得一副有很多选项的样子，但是说起这个家里常备，又可以轻松弄来吃的东西，就只有一种。我关上冰箱，从厨房柜子里拿出两碗泡面，拆开其中一杯的包装胶膜，撕开杯盖。正打算拆开第二杯的胶膜时，才意识到我不需要做这件事。","「啊，真是的。」","在我临时起意下开始的找橡皮擦游戏结束后，总觉得气氛有点尴尬，我就让仙台同学先回家了。即使如此，我还是差点准备了两人份的晚餐，这都是因为在她有来的日子，我们会一起吃晚餐这件事几乎已经变成了一种惯例。那就像是在不知不觉间养成的习惯动作，让我的身体自己动了起来。","我把多出来的那碗泡面放回橱柜，将泡面放在吧台桌上，倒入热水壶里的热水，然后设定好厨房计时器，等上三分钟。","这格外宽敞的厨房和客厅，让我有种仿佛有什么东西潜藏在某处的感觉，只有我一个人在的时候，总是没办法静下心来。我明明待在自己家里，可是除了自己的房间以外，其他地方感觉就像是别人的家。","我回过头，看着没人会打开的电视和没人使用的桌子。","我上一次在这里和爸爸一起吃饭，是什么时候的事情了？","我试着回想却想不起来。面对这寻找不出的记忆，我不禁「唉」地叹了一口气，这时厨房计时器响起了尖锐的提示音，害我吓得抖了一下。","「吓死我了。」","对心脏真不好。","跟仙台同学的所作所为一样，对心脏很不好。","今天她突然叫我「志绪理」，害我的心脏差点停止跳动。只有舞香跟亚美会直接叫我志绪理，仙台同学至今从没这样叫我过。所以这个出乎意料的称呼方式，打乱了我的呼吸节奏。","我觉得她叫了我的名字我却没有马上回头，那也是无可奈何的事。","我撕开泡面的杯盖，把面条送进嘴里。","「不太好吃耶。」","虽然泡面本来就不怎么好吃，但是跟人一起吃的时候感觉还是比较美味。","即便那个人是仙台同学，也总比没有人好。","可是仙台同学今天做了跟平常不一样的事，我只好一个人吃晚餐。","「今天到底是怎样啊？」","尽管仙台同学原本就很会装熟，然而她现在又变得比以前更会装熟了。她与人之间的距离感很奇怪，不仅在我没有命令她的情况下跑来舔我的手指，还突然直呼我的名字。然后用一副仿佛在说「可以再亲近我一点也没关系喔」的态度碰我，让我变得也想试着碰触她。","结果就是那场找橡皮擦的游戏。","仙台同学很奇怪。","她的脑袋一定有问题。","如果她是个正常人，我就不用落入一个人吃晚餐的下场了。","到底是发生了什么事，才会导出这样的结果呢？","我根本就想不——","我拿出麦茶，把玻璃杯放在桌上。","我用指尖抚过自己的脖子，感觉自己的手格外冰冷。","我猜仙台同学已经发现我做的事了。","仙台同学折到我课本封面的那一天，我碰了她的脖子。她也是在那之后才开始做出一些捉弄我的行为。原本仙台同学的态度都还算顺从的，最近却有点叛逆，总是做出一些不必要的行为。我不希望她叫我的名字，也不希望她做我根本没有命令她做的事。","这里是有规则的。","只要遵守规则，仙台同学就会遵从我所有的命令。","只要不超出规则的范围，我可以下达任何命令。我要是想碰触她就可以碰，也可以要她改掉那种叛逆的态度。如果我真的想，也可以命令她「忘掉」我希望她忘记的事，所以即使仙台同学发现了我做过的事情也无所谓。不会有任何问题。","尽管如此，我今天却尴尬得像是自己做了什么不该做的事。","我吃掉放太久，已经泡得软烂的泡面，喝下麦茶。","果然不好吃。","反正这也不是需要细细品尝的食物，我把剩下的面灌进胃里后起身。收拾好制造出的垃圾，关灯。","在变得一片黑的客厅里面，我甚至连自己的轮廓都无法掌握。","我对着已经熄灭的灯，举起仙台同学的舌头舔过的手指。","在什么都看不见的情况下，用嘴唇轻碰，确认指尖的存在。","我的指尖理所当然地没有任何味道，我回到自己的房间里。","「啊，橡皮擦。」","我看到打开的书包才想起来，仙台同学没有把橡皮擦还给我。","「应该要好好还给我啊。」","这样我不就不能写作业了吗？","虽然我没什么干劲，但我本来还是有要写作业的。可是仙台同学害我没办法写了。早知如此，命令她帮我写作业就好了。不过仙台同学已经回家了，我就算在这里抱怨，橡皮擦也不会回到我手边。也不会有人像变魔术那样，帮我写完作业。","明天跟舞香借来抄吧。","我把作业的希望放在明天的舞香身上，提早上床睡觉。","结果隔天早上，我先到便利商店买了橡皮擦才去学校上课。","仙台同学虽然就在隔壁班，但她不会来还橡皮擦给我。即使我俩在走廊上擦身而过，也不会提起橡皮擦的事。因为我们说好了在学校不会跟对方搭话，所以就是这么回事。我并未对此有任何不满。至于橡皮擦的下落，等下次找她来的时候再问她就好了。而且我有新的橡皮擦，不会因此感到不便，橡皮擦本身也只是个便宜的消耗品，就当作我自己弄丢了也无所谓。","只不过在那之后，都没有发生任何会让我想找仙台同学来的讨厌事情，毕竟我之前就想说只是有一点不顺的话，我就自己忍耐一下。而且也有种不太好再开口找她过来的感觉。不过从我最后一次找她过来时起算，过了一周之后，我还是得再找她过来。","因为我要是突然不找她过来也很奇怪。","我第一次在没事的情况下，传了讯息给仙台同学。","『今天来我家。』","她马上回讯息告诉我她今天要补习，于是到了隔天她才来我家。","我们也不算很久没见到面。","即使如此，由于她身上的制服从冬季制服变成了换季用的款式，让我觉得仙台同学跟平常不太一样。或许是因为这样吧，她在我房间里，反而让我觉得有点静不下心来。","「宫城，你怎么了吗？」","仙台同学一边解开衬衫扣子一边说。","「为什么这样问？」","「嗯～因为你不太找我过来了。」","「只是因为我很忙。」","「是喔～」","仙台同学没有问我为什么很忙。","当然就算她问了，我也不打算告诉她。因为我其实根本不忙，回答不出什么具体的内容。","我拿了麦茶和汽水来，交给仙台同学五千圆。","「谢谢。」","她跟我道谢之后收下钱，坐在床上。","我因为她一如往常地收下五千圆而感到安心。除了身上的制服从制服外套换成了针织背心以外，仙台同学没有什么改变。她还是老样子，解开了两颗衬衫扣子，并松开了领带。","「你不脱掉那件吗？」","我隔着桌子坐在仙台同学对面，并指着她的背心问她。接着就听到她消遣我的声音。","「宫城你真的很喜欢要别人脱衣服耶。」","「我不是这个意思。仙台同学你不是都会脱掉制服外套吗？」","「我知道啦。所以今天要做什么？」","「你很猴急耶。」","今天明明没有发生什么讨厌到让我想找她来的事情，我却找了她过来。所以我一时半刻间还想不到要命令她做什么。","「总之先写作业吧。」","我没有特别想念书，可是也没有其他方法能让仙台同学安静下来了。虽然我可以命令她帮我写作业，不过那样我就没事做了。","今天要是不找点事情做，我怕我会做出一些不必要的事。","「那你的作业给我。」","仙台同学起身，坐到我身旁。","「我会自己写，仙台同学你随意就好。」","我再次坐到仙台同学对面，拿出课本和笔记本放在桌上。","「宫城你要自己写？」","仙台夸张地做出惊讶的反应。","「我是打算自己写啊。」","「你今天没有要命令我帮你写作业吗？」","「没有。」","「宫城竟然突然变乖了。」","「我原本就很乖啊。」","「那我也来写作业好了。」","仙台同学用没什么干劲的语气说完后，从书包里拿出了英文课本和笔记本。接着又拿出几份讲义放在桌上。","我马上听到笔在纸张上书写的声音。","我低头看向数学课本。看着上面有许多数字、英文字母以及各种记号的课本，我头都晕了起来。虽然这世上是有人认为数学公式看起来很美，但我只觉得那都是些看不懂的暗号。说是这样说，我还是得试着去解题，不然没办法写作业，所以我在脑海中寻找着公式。然而我却迟迟找不到应该已经学过的公式。","我偷偷看了仙台同学一眼。","她正以漂亮的笔迹接连写出英文字母。","振笔疾书的声音毫无窒碍，感觉仙台同学好像没有答不出的问题一样，让我有点羡慕她。","我继续跟数学公式搏斗。","我不时停下手，缓慢地解题，写作业的进度不如预期。在安静的房间里，唯有时间不断地流逝。一直看数字的眼睛越来越疲劳，我不禁轻轻叹了一口气，这时一枝笔从对面滚过来。我抬起头，仙台同学正在看着我。","「你写完了？」","「写不完。」","我冷淡地回答，把笔还给她，接着低头看向课本，这时她戳了戳我的发旋。","「好痛。仙台同学，你不要干扰我啦。」","「要不要我教你？」","不必，我自己想。","在我开口拒绝她之前，仙台同学已经来到我身边。","「没关系，不用你教。」","「可是我没事做。」","她边说边探头看我的笔记本，于是我推了推她的肩膀，和她保持距离。","「你跟平常一样去看漫画不就得了？」","「大多看过了啊。」","「我有买了一些新的，去看那些啊。」","我在没找她来的这一周内买了两本漫画。我觉得有两本漫画应该够她打发时间了，仙台同学却没有去拿漫画，反而抢走了我的笔记本，指了指正中央的位置。","「你这边写错了。」","「咦？」","「这边，算错了。还有这里。」","仙台同学拿起自己的笔。然后在我没有拜托她的情况下，径自开始订正我写错的地方，并开始解说。","她的说明浅显易懂。","她用连我都能理解的方式，细心地教导我。","问题是她贴得很近。","「等一下，仙台同学，你靠太近了。」","我刚才应该有稍微拉开一点距离了，仙台却在我们的制服几乎会碰在一起的位置上。","「会吗？」","「你最近很会装熟耶。这样很烦，离我远一点。」","我推开仙台同学的手臂，把她赶到桌子的角落去。","「说我很烦是不是有点过分啊？」","「才不过分。而且你这样靠着我很热。」","五月明明才过了一半左右，都还没结束，宛如夏季的酷热天气却持续了好几天。即使对象不是仙台同学，我也不想在这个气温下跟人靠在一起。","「你不希望我靠近你的原因就只有那个？」","「对。剩下的我自己写，仙台同学你去旁边啦。」","我指了指书柜。","我顺便把我新买的漫画书名告诉她，拿回在不知不觉间被仙台同学抢过去的课本和笔记本。可是不管我怎么等，她都不肯起身去拿漫画。甚至还缩短了我刻意拉开的距离，又把我的课本和笔记本给挪了过去。","「我不是说很热吗？」","「我不热啊。」","「骗人。仙台同学你明明就怕热。」","冬天的时候，可能是因为我把电暖器的温度设定得比较高，仙台同学总是会脱掉制服外套。","我觉得刚刚好的室温，跟她觉得刚刚好的室温不一样。","在相对怕冷的我会觉得热的房间里，仙台同学怎么可能会觉得不热？","「这样就不热了啊。」","仙台同学拿起放在桌边的空调遥控器，按下开关。","「你不要擅自打开啦。」","我抢走遥控器，切断电源。","她到底是怎样。","仙台同学比之前更缠人地接近我。","「我说宫城。」","我才不要这样随她起舞。","我看向课本，忽视她的存在。我虽然拿起了笔，想继续试着去解我刚才解到一半的问题，仙台同学却无视我想继续写作业的念头。","「这里。」","她的指尖抚摸着我的脖子。我忍不住抬起头，她的手掌便整个贴了上来。","「你知道我为什么摸你这里吧？」","仙台同学平静地说完这句话，又接着说下去。","「我睡着的时候，你为什么吻了这里？」","她的手再次抚摸我的脖子。","「你既然发现了，当下问我不就好了吗？为什么到现在才问？」","「你要问我问题，就先回答我的问题。」","她没有生气，但语气也称不上和善。","我认为仙台同学有权质问我。","而且想到我的所作所为，我也认为自己该回答她的问题，可是即使她问我「为什么？」我也不知该怎么回答。因为我自己更想知道我为什么会做出那种事。","「宫城，回答我。」","她平静地催促我，我拉开她那只贴在我脖子上的手。","「我只是用嘴碰了你，不是要吻你。」","「一般来说不会想用嘴碰这个地方吧？」","「你这不是知道答案了吗？就是因为一般来说不会这样做啊。」","仙台同学说得没错。","一般来说没有人会用嘴唇去碰熟睡中的她的脖子。","我是故意碰了那里的。","我确实记得这件事，然而我无法解释自己的行为。我并非基于什么理由才这么做，就算有，那理由也存在于我自己没有意识到的地方吧。","我阖上课本，仿佛在逃避仙台同学的目光。","如果我现在命令她「不要再追问了」，的确可以强行结束这段尴尬的时间。不过要是我这么做，她之后只要找到机会，一定会再提起这件事。","我觉得那样很麻烦。","「我又没有多做什么，无所谓吧。这样你能接受吗？」","我没有看着仙台同学，像是在找借口给老师一样地补上这段话之后，衬衫袖子被拉了一下。我因此看向了我明明不想看的仙台同学，打算再别开视线时，她用格外认真的表情开口说了。","「那现在呢？你想碰我吗？」","我不懂她为什么想问这种问题。","我也不知道她是否接受了我刚刚的回答。","跟人之间的距离感还是很奇怪的她就在我身旁，手依然抓着我的衬衫袖子。我希望她能稍微离我远一点，但她全身上下都散发出若是我不回答，她就不会放开我袖子的气势。","「你这是在命令我回答你？」","「能下命令的是宫城你吧。我这只是单纯的提问。」","「如果我说我想碰，你会让我碰吗？」","「你想碰哪里？」","「是谁说要提出问题前，得先回答问题的？」","「我的答案会因为你的答案而有所不同。」","她平静的声音回荡在我的耳中。","有些地方可以让我碰。","我想她的话应该是这个意思。","不过，为什么？","仙台同学尽是说些平常的她不会说的话，害我无法整理好脑中的思绪。","要是我说「哪里都好」呢？","说不定她只是在闹我。","追根究柢，我现在真的想碰仙台同学吗？","脑中浮现出许多念头，又像汽水的气泡那样消失。记忆的碎片也随之迸裂，让我想起那天睡在床上的仙台同学。","我那天也碰了仙台同学的嘴唇。","在碰到脖子之前，先用指尖滑过的嘴唇，宛如棉花糖那般柔软。","如果可以，我想要碰那里。","我朝仙台同学伸出手。虽然我没有回答她的问题，但她似乎理解了我的意图，并没有躲开。原本被她抓着的衬衫袖子也重获自由，我的指尖毫无窒碍地触及她的唇。","果然很软。","我轻轻按了按后，仙台同学舔了一下我的手指，吓得我急忙缩手。","「你命令我啊。」","仙台同学稍稍压低了声音说道。","不过在什么时候，要下达怎样的命令，全都取决于我。","不是仙台同学。","「宫城。」","她坚定地喊了我的名字，仿佛在催促我命令她。","顺着仙台同学的话下命令会让我有点不爽。而且她命令我，要我命令她，这也太奇怪了。尽管我心里这么想，还是不争气地开了口。","「……闭上眼睛。」","「好。」","仙台同学错了。","如果她知道这项命令代表着什么意思，这时候就该出言抱怨。然而她闭上了眼。她不可能不知道接下来会发生什么事，还是遵从了我的命令。","我的指尖碰到她的脸颊。","脸上有鼻子、眼睛和嘴巴。","只是仙台同学脸上的这些器官，排列的比一般人更好看一点，尽管不到模特儿或偶像的程度，她还是有一张漂亮脸蛋。说她是美女也不为过。","直到我在书店拿出五千圆之前，我们没有任何交集。","照理来说仙台同学应该不会来我家，也不会听从我的命令。如果像现在这样分到了不同的班级，她甚至会把我忘得一干二净吧。","所以这是不应该发生的事情。","我无法理解仙台同学为什么会闭上眼睛。","说不定我一靠过去，她就会睁开眼睛，笑我竟然当真了。尽管我不觉得她是会这样恶搞的人，我的脑袋却跟不上眼前这不可能发生的情境。我明明这样想，身体却不自觉地靠近仙台同学。","等我回过神来，我和她的嘴唇之间已经只剩下不到五公分的距离。","心脏好痛。","我没办法顺利地吸气、吐气。","我应该是忘了怎么呼吸吧。","我用摸在仙台同学脸上那只手的拇指轻触她的嘴角。","仙台同学动也没动。","我又稍微靠近了一点，然后我也闭上了眼。","这很简单。","她不会违抗命令。不到五公分的距离转眼间就消失了，若是我不想闭上眼，不闭也没关系。","我微微偏头。","——真的可以碰吗？我开始没有信心了。","要是我真的吻了仙台同学，她可能就再也不会到这房间里来了。这想法突然浮现在我的脑海当中，于是我推开了她的肩膀。","「对不起，你今天就先回去吧。」","「咦？」","仙台同学睁开双眼。","「宫城？」","她的语气相当惊讶。我拉着她的手让她站起来，动手收拾好她的东西，把书包递给她。打开房门，推着她的背。","我不知道现在做什么才是对的，也无法思考。虽然可能有比请她回去更好的办法，但我现在没有余力去找出那个办法。而且我不想让仙台同学看到我的脸。","我希望她不要回头，就这样回家。","「等一下。」","仙台同学似乎没打算就这样乖乖走人，她试图向右边转身，我却强行把她从房间带到了玄关。","「抱歉，我会再联络你。」","「为什么」，还是「我有话要说」之类的。","仙台同学嘴里喊着这些话，我却没有听进去。总之我逼她穿上鞋子，把她赶出了玄关。","「宫城，你开门啊。」","我听到她在敲打门板的声音。","我没有要开门。","我要是开了门，她一定会骂我。平常我都会送她到一楼的，可是今天没办法。","「我说宫城！」","仙台同学在门的另一边喊我。","我为什么打算要吻她？","我为什么没有吻她？","我倚靠着门板，觉得自己已经什么都搞不清楚了。","背后传来「咚咚咚咚」的闷重声音。","这么说来，我忘了问她橡皮擦的事。","我直到现在才想起这件事。","〔本话含插图〕"]},{"t":"第10话　宫城错了","p":["奇怪。","太奇怪了。","为什么我非得被她赶出房间啊？","我不知道已经敲了几下，但我「咚」地一声，停下了敲着宫城家门板的手。","我再敲下去宫城也不会出来应门，这样只会给她的邻居添麻烦。","但我不能接受。","因为有问题的是宫城。","我什么都没做。","企图要做些什么的人是宫城，所以有权利感到不满的人应该是我，不是宫城。","我本来想再敲一次门，不过犹豫了一会儿之后，还是转身背对了玄关。从六楼往下俯瞰，只有人和车的街景实在说不上美丽。看来这栋昂贵的住宅大楼注重的是便利性，对景观不是那么讲究。","不好玩。","不管是景色还是宫城，一切都不好玩。","我深深呼出一口气，朝电梯走去。平常宫城都会跟我一起搭电梯下楼，今天却只有我自己。我穿过一楼大厅来到外面，走在街上。","至少宫城应该不讨厌我。虽然我们不是情人也不是朋友，但我认为应该有类似好感那样的感情存在。所以她在那时候赶走我真的很奇怪。","「搞得好像都是我不对一样。」","命令我闭上眼睛的是宫城，想吻我的也是她。","然后她又自顾自地放弃，要我今天先回家。","在事情在这种不上不下的地方作结，连话都不听我说，就直接把我赶出来，这可不是命令他人的一方该有的行为。","……不对，我这是在说谎。","这不是宫城主动命令我的。","是我诱导她下达了这样的命令。","如果跟宫城接吻了，我会变得怎么样呢？","我很想知道这件事，所以要她命令我。","不过决定下达这个命令的还是宫城。最终仍是她自己选择要这样命令我的，所以我觉得她应该要负起责任。要说我是迁怒也无所谓，一切都是在那种情况下喊停的她不好。","我加快脚步。","我用几乎会喘不过气来的速度回到家，把自己关在房间里。虽然觉得肚子好像饿了，但我没心情吃晚餐。我脱掉制服，换上家居服，然后从书包里取出钱包。","「就算我还给她，她也不会收吧。」","我觉得今天自己的行为不值得她付五千圆。","可以的话，我很想把这笔费用退还给她，但是宫城很顽固，所以她一定不会收。不仅如此，她还有可能会就此不再联络我。","我把五千圆塞进存钱筒里之后拿起存钱筒。我不知道存钱筒是否有变重，不过五千圆确实持续在增加，我的心情就跟里头装的五千圆数量一样沉重。","「宫城这个笨蛋。」","我对着存钱筒抱怨，往床上一躺。","每当碰到这种情况，宫城就会躲我。","放春假前，她泼了我一身汽水的时候也是这样。她在那之后一直躲我，不肯联络我。她会冲动地采取行动，等到不知该如何是好时就躲我。还以为这样就可以解决问题。","「反正这次她也会做一样的事吧。」","结果我的推测成真，接下来五天宫城都没联络我。","放学后，我在教室盯着手机萤幕看。","要说「才过了五天」也是可以，但是考量到我和宫城之间发生的事，五天算是漫长的了。之前也发生过她这么久没联络我的情况，可是这次我觉得不管是等上一周还是两周，她都不会联络我。","至今为止，从未道歉过的宫城道歉了。","我不知道她为何决定道歉，不过我认为那足以作为宫城逃避我的理由。","我把手机收进书包里，看了坐在斜前方的羽美奈一眼。我向正热烈地和麻理子讨论放学后要去哪里的她搭话后，她便把已经决定好的行程告诉了我。","「我正好在跟麻理子讨论，不过今天就去老地方吧？」","「抱歉，我今天要去补习。不好意思，下次再一起去吧。」","「咦～你偶尔跷个课也无所谓吧？」","「要是被父母亲知道了，会很麻烦啊。」","「就给他们骂一下啊，又不会怎样。」","麻理子也随便地应了句：「就是啊。」赞同羽美奈这不负责任的发言。","「下次我再请你们。」","我一边提出几家口袋名单，一边跟羽美奈她们一起走向鞋柜。我跟她们两个一起换好鞋，在校门口道别。等羽美奈她们都离开之后，我才走上不是通往补习班的路。","我之前从来没有跷过补习班的课，但我今天不想去。虽然这样对羽美奈她们不太好意思，可是我已经决定好放学后要做什么了。","我的目的地是宫城住的大楼。","我快步走在已经熟悉的道路上，转眼间就到了。","人都到了这里，我要做的只有一件事。","我按下大厅前的门铃呼唤宫城。可是没有人回应。","「想也知道她不会应门就是了。」","一次、两次、三次。","我接连按下门铃，却还是听不到宫城的声音。","我早就料到会是这样了。","于是我拿出手机，传了讯息给宫城。基本上都是她主动传讯息给我，要我放学后过来，我没有传讯息说我放学后会过来，但这是我第二次传讯息要她开门让我进去了。","『宫城，出来应门。』","『你在家吧。』","『不要忽视我，让我进去。』","我传送的几条讯息都显示已读，可是没有回应。我虽然觉得自己这样很没教养，还是猛按门铃。在放完春假，我们重新分班之后，我曾经在这里做过同样的事，那时候她开门让我进去了。不过今天她不仅不肯应门，也没有回复我的讯息。","这让我很不爽。","非常不爽。","我第一次打了电话给她。虽然我早就知道会这样了，但是我打出的电话只有铃声持续响着，我还是没听到宫城的声音。","『接电话。』","我传的讯息甚至连已读都没有了。","「为什么这么不肯听人说话啊，又不是小孩子了，起码回个讯息吧。」","期中考快到了。","我觉得现在不是在这种地方疯狂传讯息给宫城的时候，可是这个问题不解决，我又不能静下心来好好准备考试。必须要记下来的内容，我全都没办法装进脑袋里去。","都是宫城害我变得这么惨。","这就像一种恶性晕眩症状，让我的情绪飘摇，无法稳定下来。","我离开大楼，准备回家。","这其实不是什么大问题。","真要说起来，就算我跟宫城之间的关系就这样断了也无所谓。也就只是原本应该会维系到毕业为止的关系，提前结束罢了。我是觉得有些遗憾，但也无可奈何。我会因此失去一个舒适的去处，不过我可以再去找下一个。","可是我不能接受我们的关系结束在这种不上不下的情况下。","我不知道自己是怎么走回来的，但还是回到了家。","想必是顺着平常走的路线走回来的。","除了宫城无视我之外，没有任何不同的日常生活。","我回到房间，看了看桌面。","只要有个契机就行了。","我把宫城那块之前都被我丢在桌上的橡皮擦，收进了笔袋里。","老师话很多。","我甚至觉得老师是故意讲这么多话的。","下课钟声早就响了。","我阖上课本和笔记本，从笔袋里取出橡皮擦。在心里发念要一直赖在讲台上不走的老师赶快出去，用脚尖敲着地板。","快点、快点、快一点啦。","我望穿秋水地直盯着老师，老师一边交代著作业要这样又那样，一边发下讲义之后，才慢吞吞地走出教室。我立刻收拾好桌面，向坐在斜前方的羽美奈搭话。","「抱歉，你们先吃。我要出去一下。」","虽然午休算是比较长的休息时间了，但考虑到我接下来要做的事情，午休时间都还是嫌短，我没空磨蹭。","「是没关系，不过你要去哪？」","「去一下隔壁班。」","我留下这句话后，便走向隔壁班。","我手里握着一块橡皮擦。","橡皮擦的主人就在隔壁班。","我来到走廊上，二班就在旁边，我用亲切的笑容和在二班门口附近的女生打招呼，请她帮我叫宫城出来。随着一声「宫城同学～」的叫唤声，一道耳熟的「怎么了？」传入耳中。","声音是从窗边靠中间的地方传来的。","正跟朋友在一起的宫城露出了惊讶的表情。而帮我喊她的女同学像是要再给她一击似的，又补了一句：「你朋友来找你喔。」","宫城因为这句话而显得很不高兴。","但也只有短短一瞬间。","她果然不至于会在学校发脾气啊。","我是觉得她要是真的生气，那也挺有趣的，不过宫城显然没打算放弃做表面工夫。听到「朋友」两字而睁大眼睛的宇都宫她们对宫城说了些什么，她略显尴尬地回了话之后，才走到我身边。","「……这里是学校。」","宫城一脸不悦，却又不知所措地皱着眉头这么说。","「我知道。」","「那你就不要来找我，我们不是说好了吗？」","她咬牙切齿的说话声里只有不满的情绪。不过她似乎还知道自己说话的内容不适合让别人听到，所以用只有我听得见的小小声音在跟我说话。","「这个放在我的口袋里。把这种东西拿来还你，就只是普通的归还失物而已啊，就算在学校找你说话也没什么好奇怪的吧？」","我把手上的橡皮擦拿给宫城看。","「这种东西——」","「不还我也无所谓，送给你。你想这样说对吧？」","我抢走宫城原本想说的话，她陷入了沉默。我早就知道她在这种情况会说什么了。我跟宫城相处的时间已经长到我能够猜到这些事。","「我是可以收下，但在那之前我有话要跟你说。」","我先把橡皮擦收回口袋里，然后抓住宫城的手臂。","「喂，等一下。」","「站在这里太醒目了，跟我来。」","虽然我觉得我们已经很引人注目了，但总比继续站在教室门口说话好。","我拉着宫城走。","午休的走廊上人很多，我拉着宫城的手往前走的状况比刚刚还引人注目。宫城也察觉到了这一点，立刻甩开我的手，自己跟了上来。她可能是觉得即使逃跑，我也会追上去吧，所以没有抱怨，默默地跟着我。","我们来到旧校舍的角落，我把难得如此顺从的宫城推进音乐准备室，然后把她带进教室最里面的地方。","「你带我来这里是想干嘛？我还没吃午餐耶。」","宫城来到午休时间不太会有学生造访的地方，立刻不再隐藏她的不满。听过好几次的这种低沉声音，充分地显示出她有多生气。","「我不这样做你就不肯听我说话，会逃走吧。」","我靠着放乐器的架子，再次抓住宫城的手臂。一脸不知道把和善忘在哪里的宫城没有反抗。她就这样任凭我抓着她的手臂，站在我面前。","「我们不是说好不在学校和对方说话吗？」","「是你说在学校不会跟我搭话，会用手机联络我。我可没有说我会照办。」","我觉得我这是在狡辩。","去年我确实是在自己也会这样做的前提下，接受了宫城提议，这也成了我们之间的规矩。宫城说得才是对的，但我不能退让。","我有无论如何都想问宫城，想要告诉她的事情。","「……即使如此，我也没什么事情好在这里跟你说的。」","尽管宫城接受了我那毫无道理可言的说词，仍马上投来愤恨的目光。","「即使你没有，我也有。」","「那下次来我家的时候再说就好了啊。」","「你在这种时候才不会找我过去，你根本打算就这样结束掉我们的关系吧。」","「我会找啊。」","「什么时候才会？我昨天去你家的时候，不管是按门铃还是打电话，你都在装死吧？」","「……我只是刚好没应门，也没接到电话……之后我就会找你了。」","宫城用根本不觉得她这话是认真的，也感觉不出她有想要找我的语气这么说。","我果然还是得在这里问啊。","要是我现在放开手，我跟宫城之间的关系就到此为止了。","我的手更用力地抓紧了她的手臂。","「我有事情想问你，回答我。」","我没听到她回我好或不好，但还是继续说了下去。","「你那天为什么赶我走？」","现在只有我的声音回荡在即使说好听也算不上干净的老旧准备室里。宫城不说话，而且一动也不动。充满历史的音乐准备室里摆放着许多乐器盒，但它们也就只是摆在那里，无法成为改变我俩之间沉滞气氛的契机。","「回答我啊。」","我拉了拉她的手臂，宫城像是要表现出她不愿回答的态度，往后退了一步。","「你不要命令我。」","「我可以命令你，因为这里不是你家。」","宫城只有在她家才可以命令我。","她用五千圆作为代价，买下命令我的权利。","这条规则并不适用于学校。","「只是因为事情做完了，我才请你回家，不是要赶你走。」","宫城死心地说：「这样可以了吧？」并试图甩开我的手，可是我不打算放开她。","「你觉得那样就算事情做完了？」","「我命令你闭上眼睛，你也照做了。这样就已经完成了命令，没有其他要做的事情了。」","「你真的觉得命令到那里结束就好了吗？」","「我不就说那样就完成了吗？」","「你明明还想再做点什么的。这样真的好吗？」","我原本就不是什么老实的人，但我觉得跟宫城在一起的时候，我的这个毛病会变得更严重。明明是我诱导宫城做些什么的，我却想逼她吐出答案。","不过事情当然不会进展得这么顺利。","「是仙台同学你想太多了吧。」","宫城放弃回答，甩开我的手，转身要离开准备室。我因此觉得有些愤慨。","「对了。宫城你啊，有在准备考试吗？」","我像是突然想到一样地问她，宫城回过头来，露出了狐疑的表情。","「你干嘛突然问这个？」","「我没有，都是你害我没办法好好准备的。你要负责。」","「我听不懂你说什么。」","「你现在带着手机吗？」","「我有需要回答你吗？」","「我在问你有没有带。」","「……我放在教室。」","「今天叫我去你家。」","我不会传讯息给她。","传讯息是宫城的工作。而且要今天。","我现在心情没有好到愿意放过她。","「如果我说不想呢？」","宫城不高兴地说。","她看起来很想回教室。而且心情似乎越来越差。","「就算不想也要叫我，一定要。啊，还有，橡皮擦还你。」","我走近宫城，看着她的眼睛，然后抓起她的手腕，硬是让她握住了那块橡皮擦。","「我不要，送你。」","「那我去你家收下。」","我没有收下橡皮擦就丢下宫城，走出音乐准备室。回到教室之后，感觉应该没时间吃午餐了，我便直接开始准备上下一堂课。","我往嘴里丢了一颗糖果，藉此欺骗空荡荡的胃。","在我听完老师的长篇大论，迎接下课时间后，手机里收到了宫城传来的讯息。","我没有特别急着赶过来。","即使如此，我还是比平常早到。","我做了一次深呼吸之后打开大门，宫城已经在等我了。感觉在我关上门之前，她就会给我五千圆。","「不用给我，毕竟是我要你叫我来的。」","平常我都会收下。","毕竟这是我们之间的规矩，我收下她的钱也是理所当然的事，我今天却先婉拒了她的五千圆后才脱鞋。我本来打算直接进去宫城的房间里，房间的主人却像门神一样动也不动，挡住了我的去路。","「我不是因为仙台同学说了才找你。而是我自己想找你过来的，所以我会付钱。」","看来即使回到家，宫城的心情依旧不太美丽，她一脸厌烦地说道。","「你有什么事情想命令我吗？」","「……有。」","宫城小声地说，再次递出五千圆。","怎么看她都不像有计划的样子啊。","她的声音和表情不像有事情要命令我，可是如果我跟她争这些，结果又被她赶出门，那我也很困扰。","「好吧。」","我收下五千圆并收进钱包里之后，原本挡在走廊上的宫城才说了句「我去拿饮料」并走向厨房。我没等她便径自走进房间，放下书包。然后松开领带，解开衬衫的第二颗扣子，靠着床在地板上坐下。","我虽然已经来过宫城家很多次了，现在却有些坐立难安。我没有心情看漫画，也觉得躺在床上等她好像不太对。","我也一样没有任何计划。","我不能接受宫城想把在这里发生过的事情以及我们之间的关系，像是用橡皮擦擦掉字迹，变回一张白纸的行为，然而我根本不知道该说些什么才好。虽然从我开始跟宫城交谈到现在还不到一年，今天仍是我最不知道该跟她说什么才好的一天。","我「唉」地呼出一口细细长长的气，这时宫城端着一个托盘，上面放着两个玻璃杯，还有她平常不会拿的小盘子走进了房里。","「吃吃看吧。」","她把小盘子放在桌上，冷淡地说。","「蜂蜜蛋糕？」","真难得。","虽然我也很久没看过蜂蜜蛋糕了，不过宫城会拿食物来招待我，本身就是一件非常难得的事。要说宫城会端来招待我的东西，基本上就是汽水和麦茶。","「今天你没吃午餐吧？虽然我觉得你是自找的。」","「喔，你今天这么体贴啊。」","「只是吃剩的，觉得丢掉也很浪费……你不吃我就收走。」","尽管嘴上这样说，宫城也没有吃那块蜂蜜蛋糕。而是坐到了床上。","「我要吃，开动了。」","我不确定蜂蜜蛋糕是不是该用叉子来吃的食物，但旁边放了一把银色的叉子。我拿起叉子，把细致高雅的蛋黄色甜点送入口中。吃了一口，蛋糕蓬松柔软又甜美。残留在底下的粗砂糖颗粒吃起来也有种脆脆的口感，非常好吃，我又吃了一口。","我把整片蛋糕都装进了胃里，喝了口麦茶。","实际上的确如宫城所言，我错过了吃午餐的时机。放学后我也拒绝了羽美奈的邀约，没去别的地方就来了这里，所以没有吃任何能替代午餐的东西。不过我想宫城应该也跟我一样没吃。","「你不吃吗？」","「我吃过了。」","宫城说着我无法判断是真是假的话，百无聊赖地晃着脚。她这样看起来既像是没事可做而觉得无聊，也有点像是坐立难安的表现。我觉得她这样很没规矩，所以拿叉子戳了戳她离我有一段距离的脚。","「很痛耶。」","她停止晃脚，忿忿不平地看过来。","「要我舔你的脚吗？」","「不必。要命令你做什么由我来决定。」","防范着我的宫城把脚抬到床上，抱膝而坐。","「仙台同学，你在学校不要找我说话啦。」","「这是命令吗？」","宫城没有回答。","她沉默不语，从我身上别开了视线。","我靠近宫城，拎起她的裙摆。可是她马上拍掉了我的手，我接着便听见一道压低的声音传来。","「都怪你，害我今天过得好惨。」","宫城没回答我刚刚那句话是不是命令，径自说了下去。","「因为仙台同学来教室找我，舞香她们问了我好多事。我回教室之后，她也兴致勃勃地一直追问你为什么来找我，累死我了。」","「你怎么回她？」","「我说你跑来找我借钱。」","「……真的假的？」","「假的。我说仙台同学是来帮老师传话，叫我去教师办公室，然后我就直接去找老师了……不过她很怀疑我的说词。」","嗯，我想也是。","毕竟至今没有任何交集的人突然跑来班上，然后朋友就这样不知道被带去哪里了。她们不觉得好奇那才奇怪吧。","「这样真的很麻烦，你不要再来找我了。」","宫城说完后下床，坐在离我有段距离的位置。","「你也坐太远了吧？」","「因为你会做奇怪的事情。」","「才不会，平常都是你在做些奇怪的事情吧？」","我纠正她抹黑我的发言。","她不命令我，我就不会做出奇怪的事情。只要宫城别下些奇怪的命令就好了，不应该把这问题怪在我头上。不过她似乎不这么认为。","「仙台同学才没资格说我，刚刚你不也突然想要掀我的裙子吗？」","「我只是拉一下而已啊，宫城你就只会否定别人。」","「还不是因为你总是会做些让人想要否定你的事。真要说起来，你今天到底是怎样啊？仙台同学你跟平常不一样，话太多了吧。」","我的话确实有点多。","我明明待在觉得舒适的房间里，今天却不知道为什么像是要掩饰自己感到格格不入的心情，一直在说话。跟我还不习惯这里的时候一样，为了不让场面陷入沉默而滔滔不绝地说个没完。","然而不是只有我这样。","「那是我要说的话。宫城你才是，今天话很多耶。」","我明明没问，宫城却主动向我报告在学校里发生的事，这种状况很少见。而且她平常根本不会拿点心给我，也不会顾虑我。","今天跟平常不一样。","这句话完全符合她的状况。","「我才没有话多。」","宫城气呼呼地说完，拿了书包过来，并从中取出某样东西。","「你是来收下这个的吧？我在学校也说过了，给你。」","她烦躁地说。","我看着她粗鲁地伸过来的手，上面放着我在学校还给她的橡皮擦。","她真的不管什么东西都会说「给你」。无论是在书店时的五千圆、因为我的制服被汽水泼湿而拿给我替换的衣服，还是这个我在学校还给她的橡皮擦，她都表现得像是毫无眷恋一样，可以轻易地送给别人。也不在乎我想要还给她的心情。我知道宫城就是这种人，但即使知道，也是有无法接受的事。","我没有拿起橡皮擦。而是抓住了她的手腕。","宫城一脸惊讶，我用唇轻触她方才还拿着橡皮擦的手指，并舔了一下。有点冰冷的手指上没有鲜血或洋芋片的味道。我把舌头用力抵上去，橡皮擦掉在地板上。宫城本想动手摸我的脸颊，却又马上拿开了手。","「别这样。」","她甩开了我抓着她手腕的手，用手推开我的额头。","「因为宫城你一直不下命令啊。」","「要是我命令你回家，你会回去吗？」","「那是命令的话，我会照做。」","规矩是绝对的，我会遵守。","不过宫城不会下达这样的命令给我。","如果她真的希望我回家，就不会问这种假设性问题，会直接像之前那样赶我回去。","「……仙台同学很狡猾耶。」","宫城嘴里模糊不清地嘀咕着。","「你要是觉得我狡猾，直接说出你真正想要我做的事情不就好了？」","「我没有无论如何都想要你做的事情。」","「没事要做的话，那五千圆还你。」","「我不收。」","「那你就命令我啊，我们是这样说好的。」","我们两个虽然乍看之下不像，实际上却很相似。","我不喜欢校内权力阶层这个说法，但依照这个逻辑来划分，我的地位算是在上层。如果分得更仔细一点，我应该会被分在上层内偏低的位置。至于宫城虽然不像是在最底层，却也不属于上层。","努力不要掉出上层之外的我，和勉强撑着不要落到最底层的宫城，在不上不下这个方面其实是一样的。","而且我们都想要一个方便的对象。","我从宫城那里获得了一个不是自己家，但能让我安心待着的地方，宫城也得到了可以予取予求的我。","若是我们因此对彼此产生兴趣，也不是什么奇怪的事。","我紧紧握住自己的手。","这样的想法其实不太坦率。","我心里已经有过答案了。尽管我拿出各式各样的道理来试着解释，但说穿了，我就是想跟宫城接吻，想确认看看真的亲下去了会怎么样。","——现在，就在这里。","「你知道你该下达什么命令吧？」","我稍稍接近宫城。","我移动了多少，我俩之间的距离也就拉近了那么多，并没有再拉开。宫城的视线虽然没有看向我，但也没有躲我。","「……由仙台同学你主动啦。」","宫城没有看我，说出跟之前不同的话。","「主动什么？」","「……接吻。」","接下来该怎么办。","她把决定权交给我。可是无权拒绝的我只会有一个答案。","我贴近宫城的身体，用手梳着她的头发。","稍稍过肩的一头黑发非常柔顺。","我用手捧着她的脸颊，将脸缓缓凑了过去。像只野猫那样根本不听人话的宫城乖乖地坐着，原本没有交集的视线对上，持续相望。这表示宫城还睁着眼睛。","「你闭上眼睛啊。」","「仙台同学你很烦耶。我会在想闭的时候闭上啦，你不要管我。」","要说不是情人的我们其实不需要营造什么气氛，那倒也没说错，但这样实在太没情调了。我不觉得这像是即将接吻的人该有的反应，却很像宫城会做的事。","我没办法，只能把闭上眼睛的时机交给宫城掌握，把脸凑过去。我一边想着这样还真有点难亲下去，一边靠到相当近的距离之后，宫城才像是要逃避我的目光似的闭上了眼。","我觉得她这样有点可爱。","虽然想再多看两眼，但我也闭上了双眼。","然后碰到了宫城的唇。","我的心跳没怎么加速。","但我确实有点紧张。","总觉得透过嘴唇传递而来的触感格外鲜明。","柔软又温暖。","我不清楚自己到底有没有憋住呼吸，但觉得宫城这个人离我好近好近。","我的嘴唇离开她的。","既不甜、也不酸，更不像蜂蜜蛋糕。","没有任何味道。","真要说起来，要是初吻就来个很有味道的吻，那也挺糟糕的。","我看着宫城，但她没有看我。","我还想再吻一次。","我想要更深刻地去感受宫城这个人。","我抓住她的肩膀，又把脸凑了过去，却被她推开。","「你还想要？」","接着听到宫城不悦的声音。","「不是你要我做的吗？」","「我又没叫你做两次。」","「小气鬼。」","我出言抱怨，伸手抚摸宫城的项颈。","传来的体温比平常更高。","「你再命令我一次啊。」","我这句话让宫城明显露出不快的表情，但是她停顿了一下之后，淡淡地说了。","「……再一次。」","我听见声音之后靠了过去，轻易地缩短了彼此的距离。我俩之间很快地就不再有任何空隙，接着便是第二次的接吻。","虽然第一次接吻时我没有意识到，但我觉得很舒服。","柔软的唇，以及透过嘴唇传来的宫城这个人的存在，尽管只是一点点的接触，感觉却这么地舒服。我的身体往宫城身上倒，热度从我俩接触的部分传来，身体像是打开了某种开关一样动了起来，我用舌头轻触她的唇。","感觉比方才更火热。","无论是我，还是宫城。","体温比起以手指碰触的时候更加交融，彼此之间的界线变得模糊。","宫城的唇稍稍张开，呼出气息。干哑的声音混在气息里，令我感到耳朵深处传来阵阵骚动。宫城的手抓住了我的背心。","想要，我还想要更多。","我想触碰宫城。","我以舌尖撬开她微微张开的唇，本想让舌头钻进去，却遭到拒绝。我为表抗议而咬了宫城的唇，结果被她用力推开。","「我没有要你做到这种程度。」","「接吻就是接吻啊。」","「总之你可以停下来了。」","宫城斩钉截铁地这么说，并且稍稍后退。然后看也没看我，又接着说了句：「接下来要怎么办？」后，拿起套着鳄鱼面纸套的面纸盒丢向我。我接下长出面纸的鳄鱼，放在地上。","「怎么办是指？」","「这样很尴尬吧。」","嗯，确实。","宫城不是我的情人。而且照她所说的，我们也不是朋友。既然跟这样的对象接吻了，的确会觉得尴尬。","不过应该什么都没改变吧。","我不认为只是接吻，宫城就会改变她的态度。","反正她之后一定也会像是全身带刺那样嫌东嫌西，不可能会变得温柔吧。要是她突然亲昵地跟我搭话，我反而会觉得很恶心。或许真有些什么会改变，不过在真的改变之前，我也不会知道那是什么，只能走一步算一步了。","「仙台同学的脑筋虽然好，但是很笨耶。」","宫城边叹气边说。","「我承认我很笨，可是我脑筋不好喔。」","要是我脑筋好，就能回应父母的期望了。","我应该会考上不同的高中，也就不会遇见宫城了。","「据说只有一开始会尴尬喔。」","我不负责任地说，往床上一躺。","宫城只要保持现状就好了，如果她能表现得一如往常，那就没问题。","「之后也要找我过来喔。」","「不用你说我也会啦，不要命令我。」","宫城不悦地起身，拿了漫画过来，然后喝了一口汽水。","跟她接吻之后，我可以知道的是，我中意宫城的程度已经到了我会擅自跑来她家、在学校找她，并且要求她命令我。","我竟然这么中意她，连我自己都很意外。","但我不打算告诉她就是了。","〔本话含插图〕"]},{"t":"后记","p":["非常感谢各位阅读这本《我买下了与她的每周密会～以五千圆为借口，共度两人时光～》。","本书是将网路连载小说的内容改写、修正，并另外加上专为出版品版本撰写的内容后，正式出版的产物。","这是我第一次出书，第一次写后记……也因为如此，就连正在写后记的这个时候，我脑中依然充满着「真的会出书吗？」的念头。由于我对此一直半信半疑，所以我觉得在看到这本书真的出版之前，绝对不可以死，于是每天都过着贯彻「爱惜生命大作战」的生活。而且我根本不知道后记该写些什么，现在正瑟瑟发抖。不过光是发抖事情也不会有任何进展，所以我想回顾一下从本作品诞生开始，直到我写这篇后记为止的经过。","本书的主角宫城和仙台是在二○二○年诞生的。她们之所以会诞生，是因为我在电脑里记下了「每周买一次同学的故事」这短短的一行字。我在最后成为本书书名来源的这句话上，添加了「有什么不顺心的事就用五千圆买下同学」和「校内权力阶层的上下关系」这两项设定，并且让故事往我自己想看的方向发展，最终变成了各位所看到的作品。","不过本书不仅两个主角都有点毛病，故事设定也很吃个人喜好。我还是会担心读者们买不买帐，所以先规划成了两话（在网路连载时为六话）就结束的短篇，并发表在网路上，没想到点阅次数竟然远超出我的预期。我心想「既然如此！」就继续让这个故事延续下去，从而获得了「第七届カクヨム网路小说大赛的爱情喜剧（轻小说）项目特别赏」的殊荣，并在U35老师出色的插画点缀下，得以出版成册。","由于网路连载的第一话是在二○二○年二月发表的，修稿时我必须面对两年前的自己，不过我觉得这部分与其说辛苦，不如说我反而做得很愉快。","然后关于幕间与番外篇的部分，都是因应出版计划而增写的内容。番外篇是以宫城的视角来描述第二话「宫城今天也给了我五千圆」的内容。这是我一直想写，却苦无机会写的故事，这下总算有机会问世了！","幕间则是在跟责任编辑开会讨论修改内容时，我提到番外篇写了宫城视角的故事，所以也想写一点仙台视角的新故事时，在责编提议：「那写遇见宫城之前的仙台来当作幕间故事如何呢？」所诞生出来的篇章。因为我本人从没想过要写她们两个相遇之前的故事，真的很感谢责编的提议。","发生了诸如此类的事，像这样回顾过去，看来页数也累积得差不多了。","最后在此诚心地感谢阅读宫城和仙台的故事，以及在网站上持续鼓励、支持我的各位。我还有很多关于她们的故事想写，要是能在第二集的后记再见到大家，我会很高兴的。","然后——","绘制超美插图的U35老师、告诉我很多我不知道的事情的责编、在各个方面协助本作品出版的各位，真的非常非常地感谢您们。","然后、然后，我还要谢谢总是陪我讨论、给我建议的好友N。谢谢你愿意做这么吃力不讨好的事情。","那么，希望各位喜欢接下来的番外篇。","羽田宇佐"]},{"t":"番外篇　仙台同学一定不知道我的名字","p":["尽管已经进入七月了，阳光却没那么强烈。","我停下脚步，仰望天空。早上踏出家门时还几乎没有的云朵，已经开始覆盖天空，感觉好像会下雨，也有可能不会下。明明已经度过梅雨季，步入夏季了，放学后的天空却还不愿意接受夏季的到来。","都怪这格外阴晴不定的天空，让我不知道是否该绕去别的地方。","即使早点回家，家里也没人。","一个人在空荡荡的家里消磨时间，一个人在没有其他人的厨房里吃晚餐。","只为了这些事情提早回家也没什么意思，所以先在外面晃晃再回家会比较好，但要是我还在外面消磨时间时便下起雨来，那可就麻烦了。我身上没带伞，下雨的话只能淋雨回家，要把淋湿的制服弄干又是一大工程。虽然我明天以制服还没干为理由请假，也不会有人苛责我，可是一个人在家也很无聊。","会下、不会下、会下。","我慢吞吞地走着，来到书店前，又抬头看了一次天空。","云层好像变厚了，又好像没有。我很希望天空能像不久前那样变回一片蓝，但看来是没希望了。","我前阵子才跟舞香一起去过书店，所以现在没有想买的书。不过上了高中之后会来的这家书店会进的商品种类很丰富，不管有没有要买书，都很适合打发时间。","我赌今天不会下雨而走进书店，朝着陈列漫画的区域前进。我看到了几本书名让我有点感兴趣的作品，但有些犹豫该不该拿起它们。我觉得如果要买，还是不要挑可能会下雨的今天，等哪天天气好再买比较好，所以看完小说区的书柜后，我便走向了杂志区。一些平放着的杂志封面映入眼帘，不过我没发现什么有趣的玩意儿，不经意地往左边看了一眼。","「啊。」","我反射性地发出了声音。","我偶尔会在这家书店看到这张脸。","跟我同校、同班的学生。","我发现了跟我就只是同班同学，除此之外没有任何关系的仙台同学，心里冒出了「真讨厌」的想法。","我对她正在看的那些五颜六色的杂志没兴趣，但就算只是看看封面，还是可以打发时间，所以我还是想在这里待一下。然而跟身穿同样制服的她待在同一个区域，让我觉得很不自在。毕竟仙台同学是离我非常遥远的人物，要是她主动接近，我也不知道该怎么办。所以我一旦看到她，就得离开这里。","我「唉」地轻轻叹了口气。","反正仙台同学不会注意到我。","既然她至今为止从来没有发现过我，应该不至于今天突然注意到我吧。真要说起来，我就连仙台同学到底记不记得我的名字都不太有把握，她搞不好连我的长相都没记住。","我认为我和她所处的世界就是如此的不同。","有一条看不见的线将我们划分开来。","只要去学校，就能够明确地感受到这件事。","班上同学依照色彩分成了许多种类，有同样色彩的人会聚集在一起。群体之间像是有界线一样，将整个班级划分开来，不同色彩的人不会混在一起。而我和仙台同学的色彩当然不一样。因为这些界线并非实际存在，大家还是可以在不同群体之间来去，所以平常不太会去在意这件事，可是我一旦去到不属于自己的区块，就会觉得那里的气氛完全不同，感到格格不入。","仙台同学是不会有这种感受的人。","她能够轻易跨越界线，去到教室里任何她想去的地方。","我跟她应该合不来吧。","我在离开杂志区之前，偷偷看了仙台同学一眼。","她用格外严肃的表情看着封面十分亮眼的杂志。这么说来，我之前看到她的时候，她也是这样一脸严肃地看着杂志。因为她在学校总是表现得很开朗，看起来很开心的样子，这跟我印象中的她不太一样。","即使如此，仍不改她引人注目的事实。","在学校的时候也是，尽管比不上茨木同学，她还是相当醒目。","或许是因为她总是有化一点淡妆，看起来很漂亮的缘故。","我背对仙台同学，离开杂志区。回到陈列漫画的书柜前，拿起刚刚在犹豫要不要买的漫画，又把漫画放回架上，走去小说区。我在书店里绕了两圈之后，再度回到杂志区。仙台同学已经不在那里了。我也没打算像个跟踪狂那样跟着她，于是朝着店门口走去，决定回家。","但我发现仙台同学正在收银台前翻找书包里的东西，因而停下了脚步。","她在做什么啊？","我从没在学校看她这样手忙脚乱过，让我有点好奇。","我觉得自己不该靠近，却还是因为在意而走了过去。一靠近就听到她发出了「啊～」「呃……」这些听起来不知该如何是好的声音。我看了看收银机，上面显示出书本的金额，但不像是已经付款了。看来她是忘了带钱包。","看她着急的样子，我不禁涌上一股亲近感。","我的钱包里放了一些对我而言实在太多了的零用钱，即使我在这里拿钱给仙台同学，也不会造成我的困扰。不过看着在学校总是游刃有余的她困扰到最后什么都没买，两手空空地离开书店的模样，感觉也满有趣的。","「这些书——」","仙台同学的声音传来。","我反射性地开口并采取行动。","「我付。」","我听到仙台同学惊讶地「咦？」了一声，又更靠近到她身边，从钱包里掏出五千圆，放在收银托盘上。","「仙台同学。这你先拿去用吧。」","这只是我一时兴起的行为，不是想卖人情给她，也不是想要求什么回报。","就是没来由地想这样做。","我没想太多就拿出了五千圆，可能是因为看到平常从未看过，显得不知所措又焦急的她，让我觉得好像看到了自己。也或许我只是想看看，我拿出五千圆之后，她会露出什么样的表情。我自己也搞不太清楚，但是因为钱包里面有这张五千圆钞票，所以我做出了平常不会做的事情。","我想大概就是这么回事吧。","「……你是宫城，对吧？」","原来你知道我叫什么名字啊。","我把差点出口的话给吞了回去。因为我以为不可能叫出我名字的仙台同学一副很惊讶的样子，害我差点也因为惊讶而脱口说出不必要的话。","「拿那张钞票去付吧。」","「没关系啦，这样对你很不好意思。」","「不用介意。」","毕竟我这么做别无他意，她别放在心上就好了。如果我们因为要付还是不付这种无聊的事在收银台前争执不休，反而引人注目。而且要是刚好被人看到，在学校问起我和仙台同学讲了些什么也很麻烦，所以我只希望能尽快离开这里。可是仙台同学不肯退让。","「不，这还你。」","放在托盘上的五千圆回到我手里，但我没有要把钱收进钱包里。我再次将五千圆放到托盘上。","「请问您是要用这笔钱付款吗？」","听到收银姐姐这只能用困惑来形容的声音，我回答：「是的，麻烦你了。」之后，五千圆便消失在收银机里。我趁仙台同学收下找零时离开收银台，但她立刻追了上来。","「宫城，谢谢你。我好像忘了带钱包，幸好有你帮忙。」","我听到了仙台同学开朗明快的声音，但她要是真的感谢我，我希望她就别再理会我了。在学校里，我和仙台同学分别属于不同区域。而在书店这里，我应该要出现在漫画区，仙台同学则是会在五颜六色的杂志区逗留。就因为我们两个应该待在不同的区域，我觉得我们应该要离彼此更远一点才合理。","「这是找回来的钱。用掉的部分我明天到学校再还你。」","「不用还我没关系。找回来的钱也给你。」","我不需要这五千圆。","要是舞香看到我在学校和仙台同学有金钱往来，她八成会一直追问我们之间到底发生了什么事。那可不是什么好玩的事。","我背对仙台同学，迈开脚步。","「咦？等等，这样我很困扰耶。」","「我真的不需要，仙台同学你就收下吧。」","「我不能收啊，还给你。」","「那你丢掉吧。」","「你说丢掉，这可是钱耶？」","仙台同学抓住我的肩膀。","我是觉得她如果舍不得丢掉，只要收下就好了，但她似乎不愿意丢也不愿意收，径自说了下去。","「啊～不然这样吧，这些钱我收下，就当作我跟你借了五千圆，明天一起还你吧。」","「无所谓，不用还我。」","我甩开她抓住我肩膀的手，走出书店。","「我会还你。包含找钱在内的五千圆，我会在学校还你。」","看样子她是追上来了，身后传来我在学校从没听过，有一点点带刺的声音。她明明都跟一群如果说要给他们五千圆，他们就会乖乖收下的人混在一起，然而她本人似乎不是那种类型的人。","她意外地啰唆。","而且还很坚持己见。","我一边走，一边思考该怎么把这五千圆硬塞给她。","仙台同学能接受……不对，即使她不接受，也不得不收下五千圆的理由。","我想着想着，一个烂到极点的点子闪过脑海。","「……不然你替我做事，来抵这五千圆好了。」","我看都没看仙台同学，便如此说道。","这笔钱是她付出劳力后换来的报酬。","这虽然是个无聊的提议，但也没什么好奇怪的。我爸爸也是在用劳力换取金钱。收在我钱包里的这些钱，是爸爸无论假日还是应该在家的时间，全都拿去工作之后，所获得的一部分成果。","「咦？做事？」","「总之你先来我家。」","我停下脚步，看向仙台同学。。","「啥？去你家是什么意思？我都说钱我明天会还你了。」","「你不来的话，钱就给你，你收下吧。」","仙台同学不会来，她也不必来。","那五千圆就给仙台同学。","这样就结束了。","虽然一个人回家也很无聊，我还是转身背对她。","接着听到一声小小的叹息。","仙台同学只要那样留在原地就好了。","我在踏出脚步前先抬头看了看天空。云层变得比我走进书店前更厚了。已经不是感觉好像会下雨，而是仿佛在说一定会下雨的灰色乌云覆盖着天空。","还是快点回家吧。毕竟我不想弄湿制服。","在我这样想的时候，又听见一道比方才更沉重的叹息声。","「我家有伞喔。」","我不知道仙台同学有没有带伞，但她忧郁的叹息让我忍不住说了多余的话。","「啊～真是的。你家在哪里？在附近吗？」","「不远，跟我来。」","我低声说完便往前走之后，仙台同学还真的跟上来了。","我不知道我想叫仙台同学做什么。","也不知道仙台同学跟来是打算做什么。","不过我觉得偶尔有一点这种小插曲也不错。","我不是真的有事想叫她做，但就算回家了，家里也只有我一个人，很无聊。如果有仙台同学在，感觉可以多少打发一点时间。虽然我们之间应该没有什么共通话题，所以她应该没办法跟我聊天，不过总是比一个人在家好。","所以我默默地朝着家的方向前进。","〔本话含插图〕"]},{"t":"电子书特典　有宫城在所以跟去年不一样","p":["我对情人节没什么想法。","那只是在三年的高中生活中会发生三次的活动。而今年是第二次罢了。","不过考虑到人际关系，我也不能完全忽视这活动。","因为和朋友交换友情巧克力，也是情人节活动的一环。我身边的朋友都会乖乖参加这活动，若想要维持良好的人际关系，我当然也得参加才行。","所以去年情人节，我送给朋友们自己做的松露巧克力，当作友情巧克力。","今年，我也送了自制的松露巧克力给羽美奈她们。","尽管送市售的巧克力也可以，但大多数的人都会给予「亲手制作」的东西过高的评价，我才会选择自己做。","无论去年还是今年，都没有任何改变。","只是理所当然地重复着同样的行为。","——本来应该是这样的。","我在充满可爱要素的空间里轻叹了一口气。","专为情人节设置的临时卖场里不仅有巧克力，还有色彩缤纷的包装纸、缎带、送礼用的纸盒，甚至连饼干模具、温度计也一应俱全。情人节所需的东西几乎都能在这里买齐。","我已经决定好要买哪些东西，只要挑出这些物品，拿着所需的数量去结帐就行了。","然而我很犹豫。","到底要不要送宫城我亲手做的松露巧克力。","我为了这个小小的问题犹豫、烦恼着。","宫城今天应该不会找我过去，我跟羽美奈也没有约，有很多时间可以考虑。不过这不代表自己可以一直烦恼下去，我还是希望能尽快决定。","「嗯——」","也因为现在是放学后，穿着制服的女孩子们在卖场里进进出出。我的叹息声混在这华美热闹的空间里，消逝而去。","做松露巧克力本身并不麻烦，况且我得做送给羽美奈她们的份，所以只要顺便做宫城的份就好了。但我不知道她收到会不会开心。","由于宫城是个怪人，就算收到几乎人人都喜欢的手工巧克力，她可能也不会觉得开心。再加上我完全不清楚她的喜好。真要说起来，我根本不知道宫城会不会在情人节那天叫我去她家。","因此我很犹豫。","送友情巧克力倒不一定要挑在情人节当天，可是自制的松露巧克力保存期限很短，如果她没有在我做好的几天内找我过去，巧克力就要报销了。这样一想，我便觉得直接买市售的巧克力似乎比较好。","我离开自制巧克力用具的区块，看起陈列在架上，数量多得数不清的市售巧克力。","毕竟宫城在面纸盒上套了可爱的鳄鱼盒套，她收到可爱的巧克力搞不好会很开心。","我一边这么想着，一边绕了临时卖场一圈。","宫城、宫城……我在心里默念着她的名字。其实她不过就是个会给我五千圆，要我朗读色情漫画、舔她脚的人。这些事实掠过脑海中，害我差点又要做出可能不需要送她巧克力的结论。我不禁再度叹了口气。","「唉，不过宫城好歹也算是朋友。」","还是做给她吧。","巧克力真要报销的话，到时候再想办法就是了。","我把印着花朵图案的包装纸和粉红色缎带放进购物篮。然后又将送礼用的纸盒和制作巧克力的材料，全都包含宫城的份一起放进购物篮里，随即走向柜台结帐。"]}]},{"vol":"02","title":"我买下了与她的每周密会 · 卷02","chapters":[{"t":"简介","p":["正因为不对，与妳相处才会如此惬意而放松──","放长假让我很郁闷。虽然早就习惯了，但是我并不喜欢独处。","高中最后的暑假大家都很忙，我和仙台同学之间也有只会在「放学后」见面的规矩在。","然而她却提议：「我来当妳的家教。」……只有我很在意我们接吻了的事吗？","好无聊，一点都不好玩。就算接吻了也毫无变化的宫城，还有即将到来的长假让我这么想。","所以我向宫城提议。","我其实搞不清楚自己是不是有「放假期间也想和宫城碰面」的念头，","也知道该和宫城保持距离……不过，我想自己大概很期待收到她的答复吧。"]},{"t":"第1话　下达命令的人是我，不是仙台同学","p":["上了三年级后的第一次期中考成绩很糟。","我不喜欢念书，但考试前还是会打开课本，至少努力背一下公式或年号。可是我背不起来，也没派上用场。","拜此所赐，我那不算特别好，却也不算特别差的成绩下滑了。","理由出在仙台同学身上。","都是因为考试前发生了那样的事，才会害得我不管做什么都不顺利。","我背靠着床坐在地上，轻轻叹了一口气。","进入六月后已经结束换季，统一换为夏季制服。一身轻便打扮的仙台同学泰若自然地坐在我身旁，看着杂志。","她平常固定会去的地方明明就是床上。","不知道是不是因为我们接吻了，我觉得她有点忘了客气为何物。","我将视线落到翻开却没在看的漫画上，旋即阖上书页，转而看向仙台同学正在看的杂志，只见她一页又一页地翻过去。那本杂志封面上满是诸如能让妳变可爱、提升好感度等空洞的文字，看起来跟我在书店给忘记带钱包的仙台同学五千圆那天她所买的是同类型的杂志。","仙台同学的表情毫无变化，又翻了一页。","『据说只有一开始会尴尬喔。』","这话是仙台同学说的。然而也不管这是我们五月接吻之后我第一次叫她过来，她看起来完全不觉得尴尬。","我搞不懂。","接吻之后，不是朋友的仙台同学变成了我更搞不懂是什么的人物。","我把漫画放回书架上，拿了一本新的出来。","——早知道就别叫她过来了。","今天没发生什么讨厌的事，我却叫了仙台同学来家里。","给她五千圆，买下她放学后的时间。","就像至今为止我所做的那样，我今天也做了一样的事。","毕竟我不希望她以为我跟她接吻后就不肯叫她过来了。而且我原以为自己可以摆出一副那点小事根本不算什么的表情见她，但我已经开始后悔了。","五月发生的事情对六月的我造成了影响。","尽管如此，仙台同学还是一如往常地解开了衬衫上的两颗扣子，拉松领带，和接吻前没有任何不同，是跟平常一样的仙台同学。","「宫城妳喜欢看这种杂志吗？」","用不知道是有在看，还是只是翻过去而已的速度翻著书页的她从杂志上扬起视线，开口问我。","「不喜欢。」","「因为妳一直在看我这边，我还以为妳喜欢这种类型的杂志。」","「我才没在看妳，我对那种杂志也没兴趣。」","我从她那轻佻的语气和微微上扬的嘴角，知道她是在戏弄我，便冷淡地回答。","「我也不太喜欢。」","「那明明是妳特地买回来看的杂志耶？」","「没错，我特地去买了其实我也没多爱看的杂志。」","仙台同学语调平板地说，阖上了杂志。","我是知道她没有很认真在看的原因了，但她没说她为什么要买自己不喜欢的杂志。不过我从她的交友关系可以推想到。","妆点在封面上的那些浮夸标语，是茨木同学感觉会喜欢的话。","想当个八面玲珑的人似乎也不容易。","要是她在我面前也能发挥她那八面玲珑的手腕，我觉得这段时光会过得更顺心一点，不过这房间里不需要那样的仙台同学，而且如果是那样的仙台同学，我应该就不会这样长期叫她来我房间了。","「对了，宫城，妳的考试成绩怎么样？」","仙台同学边喝麦茶边问我。","我不想告诉她我考得不好。","感觉她会去臆测我考不好的原因，所以我死都不想说。","「普通。仙台同学妳呢？」","「我也普通。告诉我妳的平均分数啦，成绩单发下来了吧？」","是发下来了，可是我不太想看「期中考成绩单」这玩意，也不愿去回想起它的存在。","「为什么我非要告诉妳不可啊？想问别人的成绩，先说妳自己的啊。」","「可以啊，拿我的书包过来。我的成绩单就放在里面，直接看比较快吧？」","仙台同学说完后碰了一下我的手臂。","制服从换季过渡期用的款式换成了夏季制服，衬衫也从长袖变成了短袖。因为没有布料能够挡住她的手，她的体温直接传到了我的肌肤上。书包就在我旁边，那只手除了要我赶快去拿之外没有别的意思，我的身体却因此僵住。","蠢死了。","我轻吐一口气，把仙台同学的手推了回去。","「不用，就算不看我也知道妳考得很好。」","「没有很好啊，普通而已。」","「脑筋好的人所说的普通，跟我相比就是考得好啊。」","「没那回事。拿我的书包过来啦。」","仙台同学拍了一下我的手臂。","我想她根本不在乎考试成绩。","只是因为我说不要看，她才觉得好玩，想给我看而已。","她总是在做这种事。","我抢走仙台同学放在腿上的杂志，丢向她的书包。","「去拿过来。」","我看着仙台同学冷漠地说。","既然她想拿书包，那去拿杂志的时候顺便拿过来就好了。","「好好好。这是命令对吧？」","不管我说过多少次「好」只要说一次就够了，仙台同学还是听不进去。她「嘿咻」一声地站起身，只拿了杂志过来。我本以为她要把手上的杂志递给我，她却坐回原本的位置翻起杂志，让我看某个头发微卷的女孩。","「妳要不要试着弄成这种发型？」","她秀给我看的发型很可爱，可是我不觉得那发型适合我。","「要我帮妳弄吗？」","她边说边伸过来的手唤醒了我的记忆。","在接吻前，仙台同学摸了我的头发。","动作很轻、很温柔。","然后那只手抚上了我的脸颊——","「不用。」","我躲开她仿佛顺着记忆伸来的手，在那只手碰到我的头发前就先开了口。","「感觉很适合妳耶。」","「跟适不适合我无关。」","我不知道她现在的行为究竟是有意还是无意，但是今天的仙台同学感觉比平常更会装熟。","就因为她会做这种事，我才会觉得她很坏心眼。","就连接吻那个时候她也很坏心眼。","刻意要我下那样的命令。","我不认为她讨厌我，也不认为她是故意在戏弄我，可是我不懂仙台同学为什么那么坚持要我命令她。我唯一知道的，只有仙台同学正任意摆布着我。我是不讨厌跟在学校时不同，没有在装乖的仙台同学，也会想要触碰她，但她这种态度让我非常烦躁。","我把身体转向仙台同学。","老师看到也会睁一只眼闭一只眼，微微偏棕色的头发映入眼帘。","从她绑成公主头的头发底下可以看见她的耳朵。","「妳没戴耳环呢。明明一副会戴的样子。」","仙台同学虽然不是会打扮得花枝招展的那一型，但就算有戴耳环也没什么好奇怪的。总是和她在一起的茨木同学就有戴耳环，经常被老师骂。","「我不想被老师盯上啊。宫城妳不戴吗？」","「不戴。」","我简短回答完，拉了拉她就算有戴耳环也不奇怪的耳垂后，仙台同学露出了惊讶的表情。我就这样顺势让手指滑向她的耳后。","「这样很痒耶。」","她毫无起伏的声音传来。","「妳就这样别动。」","我今天不会让她诱导我下命令。","我只会照自己的意思，去做我想做的事。","我的手指缓缓滑过，碰到她的耳根时，仙台同学抓住了我的手腕。","「我不就说会痒了吗？」","传入耳中的话语没有拒绝我触碰她的行为，她却用力拉开了我正在摸她耳朵的手。","「我刚才叫妳别动，妳没听到吗？」","这不是请求，是命令。","我想仙台同学也知道这件事。","「真要说起来，不过就是摸个耳朵，妳反应也太大了。难道妳这里很敏感吗？」","我伸出手，再度拉了拉仙台同学的耳垂。","「宫城，妳拉太大力了，很痛。」","仙台同学没否定敏感这说词，皱起眉头。不过她只有脸上的表情变了，身体没有动。","我缓缓地让手指从耳垂滑到耳后。","再度碰到她的耳根时，仙台同学的肩膀微微晃了一下。","她映在我眼中的表情感觉很不高兴，看就知道她没有接受我的行为。可是她没再像刚才那样抓住我的手腕。","「妳就该像这样听我的话。」","看着默默听从我指示的仙台同学，我松了一口气。我没再产生那种坐立难安，明明是自己的房间，却像是待在别人房间里的心情。","这个地方的主人是我，不是仙台同学。","回到应有状态的关系，让我起先躁动不安的心平静下来。","我的手指顺着耳朵的轮廓滑过。","当我把手指滑进宛如用石膏固定住，脸色始终都很不愉快的仙台同学耳朵里时，她的身体像是要逃离我似的往后缩了一下。","「喂。」","我虽然听到了她低沉的嗓音，还是像在搔她痒一样，继续摸着她的耳朵内侧。","仙台同学企图抬起手，又放了下来。","她依然遵守着我叫她不要动的命令，我继续玩着她的耳朵。","在学校总爱装模作样的仙台同学尽管气愤，仍默默忍耐着的模样很有趣。","我想对仙台同学来说不有趣的事情，对我来说就很有趣。而对我来说不有趣的事情，对仙台同学来说就很有趣吧。","这种事想都不用想，因为我和她完全相反，没有任何交集。","我无法理解进入六月，就表现得仿佛五月从没发生过任何事的她，也是理所当然的事。我不可能会懂仿佛被阳光照耀着，总是身在明亮处的仙台同学在想什么。","我的手指从她的耳根滑向脖子。","仙台同学的身体惊讶地抖了一下，原本压抑着的声音不禁脱口而出。","「妳根本是在玩我吧？」","她似乎忍不住了，抓住我的手臂。","「因为很好玩啊。妳要抵抗也行喔。」","「妳也该适可而止了吧。」","仙台同学明显地露出反抗的眼神。","「我不要。」","我一口回绝仙台同学，甩开她的手，然后拉着她的耳朵靠近她。","「宫城，我就说这样拉会痛了。」","我想也是。","因为我是故意用她会痛的方式在拉，所以她做出了正确的反应。","我对此感到心满意足，又拉近了我们之间的距离。","像接吻那时一样，仙台同学就近在眼前。","心脏误以为我对仙台同学有好感地噗通一跳。","我装作没注意到逐渐加速的心跳声，把嘴唇凑到她的耳边。","香甜的气味搔着我的鼻腔。那是仙台同学霸占我床铺的日子，枕头上会传来的香气，我不讨厌那味道。","她用的是哪个牌子的洗发精啊？","在过去浮现过好几次的疑问占据了我部分的思绪时，我用舌尖碰了她的耳朵。","「这样会痒啦。」","仙台同学推了我的肩膀。虽然这么说，但她可能没忘记我叫她不准动的命令吧，推我的动作不太用力。面对她这在我容忍范围内的抵抗，我轻轻地咬了她的耳朵软骨，仙台同学的身体有些夸张地抖了一下。","「不要咬我啦。命令到这里就可以结束了吧？」","她感觉不像是在生气，可是讲话的语气比平常更为低沉。","「不行。」","「才没有不行，快住手啦。」","「仙台——」","我停下在她耳边的低语。","然后重新说了一遍。","「叶月妳很啰唆耶。」","仙台同学曾经在这房间里用我的名字「志绪理」叫我。","我这样叫她是在回敬她之前的作为，没有更深的含意。","联系着我和仙台同学的是一份契约，我们不会发展为更进一步或是退一步的关系，这从我第一次给她五千圆的那天就已经决定好了。而她会到这里来的时间，也是有期限的。","最多只会到毕业。","不会更久了。","我们没有理由继续下去。","在这段终将告一段落的关系中，叫对方的名字并不是什么特别的事。","我的嘴唇吻上她的耳朵下方。","仙台同学瞬间用手碰了一下我的背，但又立刻收手。我用舌尖触碰她柔滑的肌肤，她静静地呼出一口气。那明明是个感觉会听漏的微小声音，却残留在我的耳中，与我的心跳声混在一起。我像是要逃离那声音，让舌头滑到她的耳后。","「宫城，妳这样很恶心。」","她的声音和平常一样，可是呼吸似乎有些急促。我的心脏也用比飞快的步伐还要更快的速度鼓动着。","我觉得不能再继续下去了。","然而我却被装作没发现的心跳速度给牵着走。","我把自己的身体重心放到仙台同学身上，就这样顺势推倒了她。","仙台同学的背部贴上地面，推倒她的过程轻松得令我傻眼。我本想就此咬上她的耳朵，但我的锁骨附近被她用力推了一把。","「妳再继续下去就违反规则了喔。」","不跟对方上床。","我想她应该是要说我的行为抵触这条规则了吧，但这不是那种行为。","「我没有违反规则啊。」","我把脸退开并出声抱怨后，仙台同学推开我坐起身。","「妳这根本就是类似的行为吧？」","「妳该不会是觉得很舒服吧？」","我故意调侃她之后，仙台同学像是在擦干净耳朵似的摸了摸耳朵，然后一脸厌烦地站起来，居高临下地看着我。","「说什么傻话？我是要妳别推倒我。」","她毫不客气地踢了我的大腿。","「喂，宫城。」","仙台同学躺到床上的同时开口叫我。","「干嘛？」","「妳之后可以叫我叶月喔。」","「我不会再叫了。」","我让背靠着床边并回答她之后，她用枕头打了我的头。明明也没多痛，我却夸张地对她说：「好痛。」可是我没听到她道歉，相对地，她又用枕头打了我一下。","「宫城妳这个人很无聊耶。」","她嘀咕的那个语气，听起来是真的觉得很无聊。","黑板上写着世界历史，高桥老师——哆啦桥今天也穿着蓝色的衣服。讲台上传来我没兴趣的国家反复经历盛衰荣枯的过程，我心不在焉地听着哆啦桥讲课。","事情总是不会照我所想的那样发展。","结果就算我命令仙台同学，她也就不知所措了那么一下下，最后还是我的心情像冉冉云烟一样，飘摇不定。","这不是我想要的结果。","我翻过一页课本。","仙台同学的呼吸。","甜美的香气。","柔软的耳垂和骨头的触感。","以及微微泛红的脸颊。","浮现在我脑海里的全是昨天的事。因为接连发生没办法全数收进记忆保存库里的事，害我的思绪有一大半都被仙台同学给占据了。","这太奇怪了吧？","之前也做过类似的事啊。","我曾在她身上留下吻痕，就连咬脖子这种事都做过了。昨天做的事跟这些事也没什么差别。","尽管如此，记忆仍残留在脑海中，变得越来越清晰。","最近总是这样。","只要扯上仙台同学就没好事。明明只是因为我一时兴起才开始的关系，我却觉得她的存在变得越来越重。","我从铅笔盒里拿出没能给仙台同学，留在我房里的橡皮擦。那块从我身边到她的手里，又在音乐准备室里被她硬塞还给我的橡皮擦上，没有任何使用过的痕迹。","这根本不是什么需要特地拿来还我的东西。","要是那时候仙台同学没到教室来把我叫出去，我跟她的关系便会就此中断了吧？我们也就不会接吻了。","「别东张西望的，认真看黑板。」","我听到哆啦桥那简直像是在说我的声音后抬起头。不过被念的是从前面算来坐第二个的男生，哆啦桥还问了他特别难的问题。","还好不是我。","有幸逃过一劫，没成为哆啦桥已成惯例的迁怒对象，我从铅笔盒里拿出另一块橡皮擦，明明没有想擦掉的字，我却擦掉了写在笔记本上的字。世界历史的一部分就此消灭，丧失了上课的内容。","面对哆啦桥坏心眼的提问，无论过了多久，都没听到答案。","我重新抄写黑板上的文字，把仙台同学还给我的橡皮擦收进铅笔盒里。","今天的最后一堂课就这样夹杂着哆啦桥的迁怒持续进行。而我直到最后都没被哆啦桥盯上。","「像这种时候气象预报就会不准呢。我本来还期待运动会的练习活动会取消。」","班会结束后舞香跑来找我，很遗憾地说着。","我懂她的心情。","虽然说运动会快到了，这也在所难免，但我们还是不欢迎必须占用放学后时间的活动。","「我也以为会取消。全体练习这种事很没劲耶。」","我混着叹气声回应她后，看向窗外。","早上看的气象新闻明明叫人要带伞出门，天空上却只复满了厚厚的云层，没有下雨。","「有需要放学后特地留下来练习吗？真要练习，拿上课时间去练不就好了？」","亚美看着连一滴雨都不肯下的天空，滔滔不绝地抱怨着运动会的集体练习，而且最后还补上了一句「真想早点回家」。虽然也有很期待运动会的人，不过我们三个对运动会都没什么兴趣。","「唉，但就算在这边抱怨，练习也不会取消，在被老师骂之前赶快过去吧。」","我说了句「对啊」同意舞香这死了心的发言，拿着运动服站起身。在仍旧提不起干劲的情况下，三个人一起走出教室，前往更衣室。亚美在走廊上嘴里还不断嘀咕着「真不想去」，舞香也一直附和她。","就算抱怨个没完，气象预报依然落空，我们来到了操场上。","正因为是集体练习，现场的人数多到让理应很宽敞的操场都显得狭窄了起来。就算是这样，我依然连找都没找，就看到了仙台同学。","老师还没有整队。","可是因为大家大致上都会按照学年、班别聚在一起，所以我会马上看到隔壁班的她也是没办法的事。而我必然地也会看到在仙台同学身旁的茨木同学，这也是无可避免的事。","仙台同学算是相对醒目的人了，但是茨木同学更引人注目。","明显染成了浅棕色的头发，没照校规穿好的运动服。","也有戴耳环、做美甲，一副在学校所向无敌的样子。除了仙台同学之外，其他在她身边的朋友也都是类似的打扮，感觉只有那里是不同的世界。不过看着开心地向男生搭话的茨木同学，我觉得她跟仙台同学很合不来。","我不懂她们两个为什么会凑在一起。","以前只从远处看着她们的时候，我还以为她们是同类，但现在不一样了。","仙台同学在兴趣、嗜好上感觉就跟茨木同学很不合。","「志绪理，妳在发什么呆啊？」","舞香拍了一下我的肩膀，我让仙台同学消失在我的视野之外。","「咦？我只是在想练习能不能早点结束。」","「都还没开始，哪会结束啊？是说茨木同学在耶。我还以为她会跷掉这种活动。」","舞香的视线看向我刚才看着的地方。","「是因为在意推甄分数吧？」","亚美随口说道。舞香回了她一句：「现在才在意也太迟了吧？」","「就算现在才在意，也总比都不在意好吧？」","「这样说也是没错啦。啊，话说回来，志绪理，妳后来跟仙台同学还有怎么样吗？」","舞香的视线从茨木同学移到了仙台同学身上，用充满期待的语气问我。亚美也抓住我的手臂，说：「我也想知道。」","仙台同学到我们班教室来，把我叫了出去。","这对舞香和亚美来说是很令人惊讶的事，在那之后，她们就变得经常会提起仙台同学。简单来说，刻意跑来叫我出去的仙台同学，成了她们感兴趣的对象。","我是有告诉她们一个还算合理的理由，然而在那天之后已经过了好一段时间，她们到了现在还是会像这样问起我关于仙台同学的事。从这点来看，我想她们应该没采信我的说词吧？","看她们脸上清楚地写着我们想听些有趣的八卦，我轻轻叹了一口气。","「妳说怎么样，是指什么？」","「哎呀～怎么样就是怎么样嘛。」","舞香理所当然地说。","「怎么可能会有啊？」","「说得也是。」","听到舞香肯定我的答复，我的心变得有些沉重。","不过只有一点点。","也不是真的有多沉重。","「运动会这种活动干嘛练习？当天直接上就好啦。」","对我和仙台同学的关系失去兴趣的舞香嫌麻烦地说着，在原地蹲下。我回她：「就算没下雨，要是能因为其他原因取消就好了。」又看了看仙台同学。","她和茨木同学可能是在聊些什么吧，两人正相视而笑。","当然，她没看向我这边。","上了三年级之后，我对仙台同学就有着过多无法厘清的感情。本以为自己是用慢吞吞的动作在前进，我的心情却以仿佛会因为超速而被抓的惊人速度一路狂奔。理性总是被耍得团团转，派不上用场。","这种心情最好连同仙台同学一并撒手不管比较好，不然事情就会变得麻烦起来了。我知道。我虽然知道，但也想一直命令她。","要她听我的话，顺从我、服从我。","——蠢死了。","我慢吞吞地仰头，看向天空。","我在书店给仙台同学五千圆的那天，也是这种暧昧的天气。","因为那是在考完期末考，大概七月初时发生的事，勉强还没满一年。","去年的这个时候，我在做些什么啊？","我试着回想，遇见仙台同学之前的记忆却很模糊。","「要整队了。」","在我茫然回想时，舞香戳了戳我的背。","总之去年的运动会很无聊。","我只记得这件事。","〔本话含插图〕"]},{"t":"第2话　我只是因为宫城说了才做的","p":["有什么正要改变。","我觉得考完期中考，宫城摸了我耳朵那天，会有这种感觉应该只是自己的错觉。","在那之后她又找过我好几次，但我们之间没出现什么巨大的转变。运动会也结束了，我过着平静无波的每一天。虽说我们接吻过，但那倒没让我们之间变得有多尴尬，她也没因为舔了我耳朵这种小事就不找我过去。","无聊。","一点都不好玩。","因为毫无变化到让人感觉很闷，这里待起来也没那么舒服了。我是不认为接吻就会改变些什么，但在我的心底深处或许还是希望能有些什么改变吧。","没劲。","真没意思。","宫城舔了我的耳朵。我倒不是希望她再舔我，却很在意宫城在想什么才会做出那种事。不过我没问她这么做背后的缘由，所以她的动机依然成谜。","后来宫城就没再命令我舔她的手指或是舔她的脚过，也没有再舔过我的耳朵。作为支付五千圆的代价，她只会下一些老套又没新意的命令。我并不是期望发生什么刺激的事，不过写作业和把漫画内容朗读出来这些事，我也已经做腻了。","唉，不过……","只有一点点也算数的话，也是有改变了的事。","房间里换了一张新的桌子，比之前那张桌子大一点，更方便把课本摊开。而且因为有空间能让我们并肩坐在同一侧念书了，宫城正坐在我旁边写作业。不过她看起来不是很开心。宫城的心情就跟进入梅雨季后的天气一样，阴晴不定。","「妳这里写错了喔。」","我拿笔指了指宫城笔记本上的某处。","宫城的英文好像不太好，还有其他几个地方也写错了，总之我先指出了其中一个错误。她却一脸不高兴地看着我。","「我又没问妳，妳不用跟我说哪里写错了。」","「那就放着让它错比较好吗？」","「……是不好。」","宫城皱起眉头，擦掉写在笔记本上的字。她用的不是我在音乐准备室里还她的那一块橡皮擦，是新的。","——居然故意用其他的橡皮擦，太坏心眼了吧？","我的视线回到自己的笔记本上。","「答案是什么？」","刚才还很认真写作业的宫城，开口要我提供能够迅速修正错误的解答。","「妳自己想啦。」","「我就不知道啊。」","「妳只是没心要想吧？认真写作业啦。」","「那这是命令，告诉我答案。」","宫城把自己的课本和笔记本推给我。","看她不高兴的样子，可能是没想到我会坐在她旁边念书吧，不过我没打算要换位置。","「这与其说是要我告诉妳答案，不如说是要我帮妳写作业吧？」","「对。帮我写。」","「好好好。」","我记得上次也是这样。宫城作业写到一半就不写了，把剩下的部分推给我，跑去看漫画。我把她的笔记本挪到自己面前，从宫城手里抢走橡皮擦。","作业的题目本身并不难。","只要认真写，就算是宫城也三两下就能写完了吧？不过在她的命令之下，这些假设都毫无意义。我擦掉写错的地方，把正确答案写在其他纸上，让宫城可以照抄上去。","「是不是快要满一年啦？」","我修正了几个写错的地方，一边开始写新的题目，一边开口问宫城。","「妳说哪件事？」","「就是我开始会到妳房间来的这件事。」","「是吗？」","宫城一副不感兴趣的样子说道。","「因为是从七月初开始的，也差不多过一年了。」","虽然是同班同学，但是我跟宫城几乎没说过话。我之所以会开始到她房间里来的契机，我还记得很清楚。","宫城像救世主一样，出现在忘记带钱包的我面前，帮我付了钱。如果这样说，想必是一桩美谈吧。然而实际上是她在书店的结帐柜台前硬塞了五千圆给我，我想把找回的钱还给她，她还放话说她不需要，可以丢掉，根本不是什么值得赞扬的事。","那一天，我觉得宫城是个难搞的人。而现在我依然觉得宫城是个难搞的人。","「妳那时候为什么要帮我付钱？」","「同班同学有难，我觉得该出手帮忙。」","「真的吗？」","「假的。是因为我钱包里刚好有五千圆。」","「那要是妳钱包里面放的是一千圆，妳就不会帮我付钱了？」","「可能吧。」","「反正妳这也是在说谎吧？真正的原因到底是什么啊？」","「因为我当时想那样做。就这样。」","我不知道她这话是想随便打发我，还是在说真的，不过宫城说到这里就中断了话题，站起身，然后从书架上拿了两本漫画过来，躺到床上。","我速速写完作业，戳了戳背对着我的宫城的腰。","「妳再躺过去一点。」","「为什么？」","「这里是我的位置。」","「这里才不是仙台同学的位置，这是我的床。床上很窄，妳不要过来。」","宫城冷淡地说，占领了床铺正中间的位置。","这张床的确是宫城的，不是我的。不过她叫我来房间里的时候，这张床每次都是我在躺，我觉得我应该有权可以分到一半的领地。","「又没关系，分一点位置给我啦。」","「不要。」","「宫城真小气。」","我与其说在戳她的腰，不如说在推她的腰，想要拓展自己的领地。然而宫城没碰我，开口说了。","「仙台同学妳很烦耶，别推了。」","宫城最近有时候会露出好像静不下心来的复杂表情，那是在我们接吻之后发生的小变化之一。而她现在就露出了那样的表情。","我不是那种不管发生什么事都不会受伤的人，也有纤细脆弱的一面。宫城这种表情有时候会深深地刺伤我。","我爬上床，为了扩大空间而动手推宫城的身体。可是她没把领地让出来，而是坐了起来。","「仙台同学，解开领带。」","宫城突然开口，面无表情地看着我的领带。","这不是什么好表情。","宫城在这种时候，脑子里想的都不是什么好事。","「为什么？」","「少说那么多了，解开。」","即使问她也得不到答案，这也是一如往常的事了，就算她没说，我也知道这是命令。我放弃无谓的抵抗，乖乖解开了领带。","「这样可以吗？」","「可以。然后把那个给我。」","「把领带给妳？」","「对，领带。」","她的语气虽然跟在写作业的时候一样，但我心中只有不好的预感。尽管如此，我还是把领带交给了宫城。","「转身背对我。」","我照她说的转身背对她后，她说：「把手给我。」抓住了我的手腕。","光凭这些，我就知道接下来会发生什么事了。","我不让宫城听见地轻叹一口气，把手绕到了身后。接着手腕上立刻传来了被布料缠住的感觉。而且相当用力。","「等一下，这样很痛耶。」","我的手腕被绑住，那力道强到让我觉得她绝对是使尽了全力。我开口抱怨。如果她毫不留情地绑到最紧，会留下痕迹。制服已经换成了短袖制服，要是手腕上有那样的痕迹，一定很显眼。","「宫城。」","我语气强硬地叫了她的名字之后，领带又更勒紧了我的手腕。","「绝对不准留下痕迹喔。」","我带着她要是做得更超过，我绝对不会原谅她的念头出声后，领带才稍微松了一点。然后手腕上传来了领带打结的触感。","「宫城妳真变态，这是那边的漫画里面出现过的情节吧？」","书架上排放着各种类型的漫画，从充满少女情怀的少女漫画到热血少年漫画都有。其中也有以色情为卖点的作品，里面应该有漫画曾出现过女主角被唯我独尊型的男友用领带绑起来的情节。","「仙台同学，妳希望有人像漫画里那样对待妳吗？」","「怎么可能？」","「那我不会做漫画里那种事，妳就这样坐一个小时吧。」","「咦？什么？妳这是放置PLAY吗？」","「……妳果然还是希望人家对妳做点什么嘛。」","身后传来了她仿佛提起了某种干劲的声音。","「仙台同学妳这变态。」","一股气息随着她的声音吹上我的脖子，下一瞬间，她隔着上衣咬了我的肩膀。","「好痛。」","宫城的字典里没有适可而止这个词。","所以即使我开口喊痛，她的牙齿依然紧咬着我的肩膀。","「我又没说希望妳做这种事。」","如果是平常，我会推开宫城的额头，逃离这份痛楚。可是今天我的手腕被绑住了，没办法那么做。就算想转身，感觉也会失去平衡摔下床，不能说转就转。我只能出声制止她。","「宫城。」","我大声叫了她的名字之后，才终于从痛楚中得到解脱。","「我不是叫妳别留下痕迹了吗？妳要咬我是可以，但也要懂得适可而止吧？」","「反正那里不会露出来，没差吧？」","「问题不在那里好不好？」","「那妳下床，去坐到地板上。」","不要。","我是可以这样回答她，不过我很清楚，我说了她也只会硬逼我下床。而且这种时候的宫城感觉就会若无其事地把人给推下去。","如果事情会演变成那样，还不如我自己下床。","我默默地照着她的话坐到地板上后，宫城脱掉袜子。","「仙台同学，妳知道我接下来要说什么吧？」","宫城对抬头看着她的我这么说，踢了我八成留有齿痕的肩膀一脚。","「要我舔妳的脚，对吧？」","我和宫城来往也有好一段时间了，只要对照过去的经验，她想说什么这种小事，我马上就明白了。","「既然知道，就做吧。」","居高临下看着我的宫城用听起来甚至有些开心的语气说。虽然比起阴晴不定的天气，她能有接近晴天的心情是比较好，但这不是我现在乐见的状况，因为我知道接下来绝对没好事。我脑中没有碰到这种情况，宫城的心情很好而我身上发生了什么好事的记忆。","我看着宫城伸到地上的脚。","对于舔脚这件事我是没意见。","那种事我之前就做过好几次了。","只是我在手被绑着的情况下很难舔她的脚。我没办法像平常那样用手把她的脚抬到适当的高度。","「妳把脚稍微抬高一点啦。」","「不要。」","她简短又明确地回答我。","那表示她不愿意配合，我觉得她真的很会整我。","就这样照命令去做。","她的意思就是这样，于是我的舌尖舔上她的膝盖。","膝盖当然也是脚的一部分。","可是宫城似乎不满意。","「从脚尖开始舔。」","她的声音从上方传来。","「用这副模样？」","「对，就用这副模样。仙台同学妳喜欢听我的话吧？」","我又不是自己喜欢才听她命令的，然而说这种话也没意义。我能选择的只有听从她的命令，或是把五千圆还给她，离开这房间。","我抬头看宫城。","她一动也不动。","为了遵从她的命令，我必须自己主动靠近宫城的脚。","「仙台同学。」","她轻轻踢了我的膝盖催促我。我慢慢从宫城身上别开视线。","这个房间的主人只会对我表现得任性又毫不客气，会若无其事地对我说出她对其他人不会说的话。明知如此却还是打算顺从宫城的我，也是前所未有的不知道脑袋是出了什么毛病。","这模样还满屈辱的呢。","我事不关己地想着，同时像是要舔地板一样，舔上她的脚尖。","「这样的仙台同学也不错呢。」","听到她那愉快得跟正在念书时简直判若两人的声音，我有点不爽。","这不是什么轻松的姿势，很难受。然而我没有选择还她五千圆，我的舌头从她的脚尖滑到脚背上。在我一路舔到脚踝处，嘴唇吻上她的肌肤后，她把脚抽走了。我虽然追着她的动作，用舌尖舔上她的脚背，但这次换宫城也主动把脚凑了上来。","我只觉得她在捉弄我。","「宫城。」","我叫了她的名字代替抗议。","她或许是不满我这么做吧，宫城把脚滑到了我的下巴底下，用脚背让我抬起头。","「什么事？」","宫城看着我，面带微笑地说。","「妳的脚不要动啦。」","「可以下命令的人是我，不是仙台同学。」","宫城这话没说错。","可是为什么我非得听她的话，甚至沦落到这副模样啊？","我自己选择了要顺从她，心中仍对此感到不满。","「继续啊。」","在我开口抗议前，宫城下了命令。","她把脚放回地板上，我的唇再度吻上她的脚背。","接受命令，遵从指示。","这已经变成了太过理所当然的事，尽管觉得很不爽，我的身体还是动了起来。","舔过她的脚趾，用嘴唇触碰她柔滑的肌肤。","我顺着舌尖能稍微感觉到的骨头轻咬她的脚踝后，宫城的身体稍稍动了动。我反复轻咬，舌头爬上她的胫骨。","舔舐、轻咬、吻上。","我不是没想过，要是我正在碰的地方是她的嘴唇会怎样。","我像接吻时一样，用嘴唇缓缓碰着她的膝盖。","在我数度吻上并用力吸吮之后，宫城粗鲁地说了。","「够了。」","「为什么？」","「因为仙台同学很下流。」","「那什么意思啊？」","「意思是妳很恶心。」","听到宫城没有起伏的声音，我用超过轻咬，足以留下齿痕的力道咬上她的膝盖。虽然牙齿撞上了她的骨头，但我不在意。我狠狠地咬下去后，宫城动起她的腿。","「仙台同学，很痛。别这样啦。」","被她语气强硬地这么一说，我看向她。","「我只是用不下流的方式来做而已。」","「不要做我没有命令妳做的事。」","「意思是叫我不要做舔之外的动作？」","「对，不过已经够了。」","她没有明说命令到此结束，不过我听她那冷漠的语气就知道了。可是我的手依然被绑着，没能得到解脱。","「帮我解开领带啦。」","「妳就一直维持这个样子如何？」","「那我要怎么回家啊？」","五千圆不能绑住我一整天。","只能在一天中的短短几小时内，让我听从宫城的命令。因为五千圆不能绑住我「一直」这么漫长的时间，所以她应该要接受我叫她解开领带的要求才对，没道理拒绝我。照理来说是这样的，宫城却没有帮我解开领带。","「不要回去就好了啊。妳就这样留在这里给我养如何？我会喂饭给妳吃的。」","宫城用听起来不像在开玩笑的语气说着玩笑话。","「别说那种无聊话，帮我解开啦。」","「那妳认真一点拜托我啊。」","明明也没多有趣，她却不肯轻易收回无聊的玩笑话。","宫城轻轻踢了我的膝盖，像是在催我动作快一点。","就算看着她俯视着我的眼睛，我也看不出她的情绪。","低头拜托宫城。","真想做的话，我随时都办得到，我现在却不想拜托她帮我解开领带。那是因为我有点……不对，是非常不爽宫城的态度。","「妳想就维持这个样子吗？」","她抓住我的衣领，仿佛在说直到我拜托她为止，她都不打算帮我解开。她虽然没有很用力，但我的身体还是顺着被拉扯的上衣，靠向了宫城。","我因为她这有些粗鲁的行为而瞪着她。","「放开我。妳这样再怎么说都做得太过分了吧？」","听我说了重话后，她像是没了兴致似的松开手，我的身体也跟着失去平衡。我是不至于因此倒到地上，但是她对待我的态度实在太随便，让我又开口打算再抱怨个一句。不过在我说话前，宫城就先出声问了我。","「仙台同学妳啊，希望我怎么对待妳？」","「妳这话是什么意思？」","「我想说妳可能有希望我对妳下的命令。」","「怎么可能会有啊？」","我又不是因为想被人命令才待在这里的。话虽如此，我倒不是想拿那五千圆，但也不是有什么希望宫城对我做的事。","「那妳能容许到什么程度？」","她没说出口，不过我知道她是针对「命令的内容」在问的。","她都为所欲为成这样了，事到如今还问这个？","我不知道她是出了什么事才想问我这个问题，但我觉得这实在不是过了快一年之后才问的问题。","「妳说到什么程度，那当然是在常识的范围内啊。」","「原来刚才的命令算在常识范围内啊？」","手被绑起来，像要舔地板一样地舔她的脚。","现在也仍旧被绑着。","尽管接受了这一切，这依然不包含在我的常识范围内。","「妳没有拒绝，就表示是这么回事吧？」","是因为宫城说了我才做的。","就只是这样而已，不是基于常识。即使其他人叫我做，我也绝对不会做，而且我根本不会去搭理叫我做这种事的人吧。","可是我不想特地告诉宫城这些事。","「妳这问法很坏心眼耶。」","「仙台同学妳还不是常用坏心眼的方式问我问题。」","宫城难得用闹别扭的感觉说道。","我没打算要否定她的话。","我是故意那样做的。","我喜欢看宫城狼狈的样子，并以此为乐。","然而这种事情我做可以，宫城做就让人很不爽。","简单来说便是这么回事。","问些刁难她的问题是我的特权，不知该回答什么才好的人应该是宫城才对。所以我反问宫城。","「我才想问妳，妳想对我做什么？」","「……我没必要告诉妳。」","她没打算回答，不过看来是有什么想做的事。","虽然知道了这点，但更进一步的内容我就不得而知了。我是很想知道，但这不是我该逼问她的事，也不是我该深入探讨的话题。","「这样喔。」我看着宫城，回了句像是在回应她，不带任何意义的话，然后开始扭动起被绑着的手腕，想试看看我能不能自行解开，但这只让领带陷得更深，弄痛了我的手腕。因为我说绝对不能留下痕迹，她有放轻了绑我的力道，然而那也只是感觉上放轻了而已，领带还是以就算留下痕迹也不奇怪的状态绑在我的手腕上。","「站起来。」","宫城不悦地说。","「咦？」","「妳想要我帮妳解开领带吧？」","「在手被绑着的情况下，要站起来很辛苦耶。」","手臂也有用来维持身体平衡的功用，一旦被绑起来，就连站起来或坐下这些单纯的动作都会变得很困难。我现在倒不是站不起来，但很有可能会因为站不稳而跌倒，有点恐怖。","「那妳就这样别动。」","这样说完后，宫城就咚的一声下床，迅速绕到我身后，没过多久便取下了压迫着我手腕的布条，我得以重获自由。尽管如此，我仍旧没办法随心所欲地挪动手臂，于是用力甩了甩手。觉得血液循环稍微变好了一点之后，我站起身，坐到床上。宫城在我身旁坐下，抓住我的手臂。","「给我看。」","在我说好之前，她仿佛突然变成了正在寻找证据的侦探，仔细盯着我的手腕。","「没留下痕迹。」","宫城喃喃说道，然后摸了摸方才被领带绑着的地方。宛如上面留有伤痕一般，她的指尖轻柔地抚过我的皮肤。她的手指慢慢滑向我的掌心，手臂像是对此产生反应，找回了知觉。宫城的指尖带来的刺激渐渐变得清晰，我甩开她的手。","「妳果然是想留下痕迹吧？」","「我是在说没有留下痕迹真是太好了。」","听起来根本不像是那样。","不管是摸我的手还是语气，都让人觉得她想的是如果有留下痕迹就好了。","「还是说妳希望我留下痕迹？」","「我哪会希望妳留下痕迹啊？要是手腕上留有被绑过的痕迹，我在学校该怎么办？」","「所以我不是没留下痕迹吗？」","宫城抛下这句话，踢了我的腿。她一副话还说不够的样子，又踢了我好几脚之后，像是忽然想到似的把手伸向被她抛在一旁的漫画。我在她的手碰到之前抢走那本漫画，向她搭话。","「我有件事想问妳。」","「什么事？」","宫城一边用怨恨的眼神看着我手上的漫画，一边回答我。","「要是我下了像刚刚那样的命令，宫城妳会听命吗？」","「我怎么可能会听？」","「我想也是。」","我早就知道了。","我是明知道宫城绝对不会做那种事还问她的。","就算我付钱命令她，她也不会舔别人的脚吧？我大概感觉得出来，她认为要我做她自己不愿做的事是有意义的行为吧。这对我来说虽然不是什么有趣的事，但我们的约定就是我要听她的话，所以这也没办法。","「我又不像仙台同学妳那么变态。」","「不，宫城妳才变态吧？因为妳会对人下那种命令，还很高兴。」","「我又没觉得高兴。」","可是她觉得很有趣。","她看着嘴上抱怨却还是乖乖听话的我，发出了愉快的声音。","我是没想要用下流的方式舔她，不过被人这样舔一定是件相当有趣的事。","「对了，妳要吃晚餐吧？」","宫城从我手中夺走漫画，硬是换了个话题。","「是要吃啦。」","我的确觉得比起继续讨论谁比较变态这种无谓的事情，讨论晚餐还比较有意义，但我不太能接受她擅自结束话题的行为。然而宫城若无其事地站起来，把漫画放回书柜后，就速速走出房间了。","一句话都不说喔？","唉，倒也无所谓啦。","我也站起身，跟在宫城身后。走进客厅，只见平常总是会在厨房里拿出调理包或市售熟食的宫城坐在椅子上。","「仙台同学，妳做点什么菜啦。」","传来一句让我怀疑自己是不是听错了的话。","我之前做过一次炸鸡块。","在那之后我们也一起吃了好几次晚餐，她曾拒绝我说要做菜的提议，可是我从没听她叫我做点什么过。","「妳有煮白饭吗？」","「有。」","「冰箱里面有什么？」","尽管我还有其他想说的话，不过要是我多讲了些什么，宫城一定会轻易地收回她方才所说的话。所以我没多废话，走向冰箱。","「有鸡蛋。」","我打开冰箱，如同宫城所说的，里面有鸡蛋。","除此之外没有其他能派上用场的东西。","荷包蛋、煎蛋卷、蛋包饭。","我虽然会下厨，但没有打算要成为厨师，看到鸡蛋，我能想到的菜色只有这几种。","该怎么办才好呢？","我一边从冰箱里拿出鸡蛋，一边思考。","我决定做口味偏甜的煎蛋卷，把鸡蛋打进盆里。宫城或许比较喜欢吃咸的，不过我没打算问她。她家看起来没有做煎蛋卷用的锅子，所以我把圆形的平底锅放到炉上，倒入黄色的蛋液。做到这一步，不用多久就能做好煎蛋卷了。因为是用圆形平底锅做的，形状不太漂亮，也有点焦，但是看起来很好吃。","「做好了。」","我把煎蛋卷和白饭放到宫城面前。一放到桌上，我就觉得这菜色以晚餐来说实在有点寒酸，但我也没更多东西能放上来了，这也没办法。","「我开动了。」","宫城规矩地双手合十后，拿起筷子。","我们总是会表现得像房间里的事不曾发生过一样地吃晚餐，即使今天她对我做了相当过分的事，也依旧不变。我也坐在她身旁，拿筷子夹起煎蛋卷。","到底是有什么毛病？","把人绑起来，还用脚踢人的宫城正默默地吃着煎蛋卷，听从了她那说差劲透顶也不为过的愚蠢命令的我也在吃煎蛋卷。","宫城搞不好以为她可以对我为所欲为。","我们之间有金钱交易，有订好的规则存在。","今天的命令即使在这些前提下，依旧做得太过火了。尽管如此还是跟她一起吃晚餐的我也满扯的就是了。","「妳至少说一下好不好吃啊。」","我问默默吃着饭的宫城。","「妳可以再做给我吃。」","跟炸鸡块的时候不一样。","她那时候不是说了好吃吗？今天真不老实。","不对，她居然会说我可以再做，所以搞不好这算老实的了。","「我想做的话就会做。」","我尽量冷淡地回答后，将甜甜的煎蛋卷丢进嘴里。","〔本话含插图〕"]},{"t":"第3话　我不知道这样的仙台同学","p":["我并不想对人做过分的事。","我对仙台同学做了说过分也不为过的事。","我内心的想法和做出的行为没有交集，我下了称不上好的命令，仙台同学也接受了那个命令。结果就是那样。","明明只要被领带绑着，乖乖坐在那里就好了，仙台同学却说了奇怪的话，事情才会演变成那样。","真要说起来，如果那是她无论如何都不想做的事，她大可开口拒绝我。","虽然我不知道自己会不会容许她拒绝我。","不管是要怎么对待她，还是怎么看待我自己，都好难。","我「呼」地轻叹了一口气，坐到床上。","窗外被足以令人感到厌烦的雨给淋湿了。","突然降下的雨一视同仁地淋湿了人、车、行道树，将一切泡进雨水里。","梅雨季还没结束，所以就算气象预报失准也不奇怪，但大量的雨滴正从天而降，甚至让人同情起在外头的人。或许是因为这样吧，仙台同学迟迟没来。","她在上了三年级之后，就算我找她来的那天她要补习，她也会隔天再过来。除此之外没有哪次我找她来，她却没来的。","雨越下越大。","要是知道雨会下得这么大，我就不会找仙台同学过来了。可是我到现在才叫她别过来，仙台同学也会来吧。我只能等她抵达。","我记得去年这个时候梅雨季已经结束了。","进入七月，考完期末考，梅雨季早早结束，在书店遇见了仙台同学。","然而今年和去年不一样。","到了考完期末考的现在，梅雨季还没过去。而我去年不算好也不算坏的期末考成绩，今年稍微变好了一点点。这可能是因为我有和仙台同学一起写作业，也有可能不是。搞不好是仙台同学害我期中考实在考得太差了，导致我在考试前比平常更认真念书的结果。","不管怎样，这都不是什么好回忆。","我躺在床上，闭上眼睛。","跟某人做了什么的事成为回忆，逐渐累积，然后将那之中的几天贴上纪念日的标签，加以整理。","要是做这种事，一旦出了什么状况，标签就会一口气全数剥落，一切都会被改写成不好的回忆。开心的日子越多，不好的回忆也就越多。","在书店遇到仙台同学的日子是哪一天，我觉得我没有连日期都清楚地记下来是件好事。我没在心中的月历上留下马上就能知道那是哪一天的标记，也不想在自己跟仙台同学的回忆上贴标签。","随着时间流逝，就算我不希望，也必然会发生某些改变。","就像原本温柔的母亲抛下孩子离去一样，连不要改变比较好的事情都会改变。","我不知道妈妈为什么会抛下我离家，也不知道她在想些什么。我也没问过爸爸。","他们其中一方或许有跟我说过些什么，但那毕竟是小时候的事，我记得不是很清楚。在我的记忆里，事情就是妈妈在某天突然离家出走了。在我已经不是小孩子的现在，也曾想像过这件事背后或许有什么原因。可是那不会让我和母亲的回忆变成美好的回忆。已经剥落的标签仍旧没变，没有再贴上新的标签。","我和仙台同学的关系也一样。","她比我多话，但总是不说重要的事，所以我不懂她在想什么。要是仙台同学突然从我面前消失，我想自己也不会知道原因为何。","我看向窗外。","天空仍下不腻地持续降下滂沱大雨。","我拉了拉说长不长、说短不短的浏海。","雨天时会觉得头发有点重。","「仙台同学是不是也会这样觉得呢？」这样的念头浮现在我脑海中。她一找到机会便会闯进我的思绪里，我为此叹了口气。","我拿起被我丢在枕头旁的手机。","仙台同学没传讯息过来。","好慢。","虽说在下雨，但也太慢了。","连房间里都听得到的雨声，让我觉得自己或许该联络她，叫她今天可以不用过来了。我有些犹豫，让手机上显示出仙台同学的名字。在我思考该传讯息给她，还是该直接打电话给她的时候，门铃响了。我从房里的监视萤幕上看到仙台同学，急忙帮她打开大厅的门锁。过了一会儿，门铃又响了。因为那是从玄关前传来的，我走出房间，打开大门，只见一身湿淋淋的仙台同学就站在门外。","什么都没变。","她无论何时都一样。","不管我做了什么事，她都会一脸若无其事地过来这里。","就连在这种下大雨的日子也一样。","「妳没带伞吗？」","「看就知道我有带了吧？抱歉，不过妳可以借我一条毛巾吗？」","气象预报说是晴天，所以她就算没带伞也不奇怪。不过仙台同学似乎不相信气象预报，右手上拿了一把小伞。","「妳进来吧。我借妳衣服，妳去里面换。」","我对制服正在滴水的仙台同学说。","「这样会弄湿妳家走廊喔？」","她说得没错。","要是刚才明明有撑伞却浑身湿透的仙台同学走过去，的确会弄湿走廊。要是她像平常一样走进房间，应该也会弄湿房间地板。","「没关系。弄湿也只要擦干就好了。」","「不好啦。借我毛巾。」","「那我拿毛巾跟衣服过来，妳在这里换衣服如何？」","「在这里？」","「在这里。反正这里除了我之外没其他人，也不会有人过来。而且就算用毛巾擦过，衣服也不会干。仙台同学穿着制服进来的话，还是会弄湿走廊跟房间吧。」","她的制服可不是用毛巾擦过就没事了。如果她不想弄得我家湿答答的，就要想办法弄干她的制服。倘若有不脱下来就能弄干制服的方法也行，然而那种方法并不存在。","「我没有在玄关脱衣服的嗜好。」","仙台同学斩钉截铁地说。","这回答否定了我的好意，不是什么好答案。","「妳担心会弄湿走廊的话，就在这里脱啊。」","「借我毛巾。」","仙台同学强硬且明确地说。","穿着湿透的制服应该很不舒服吧，可是她似乎无论如何都不想在这里脱下制服。理由想必是「因为这里对她来说是别人家」或「因为我站在她面前」这两者其中之一，后者恐怕比较接近正确答案吧。","我倒不是不能理解她的心情。","这却让我不太高兴。","说是这样说，但我也不能放着一身湿的她不管。","「我去拿过来，妳在这边等我。」","我留下这句话，走回房间。","我从五斗柜里拿出浴巾，把手伸向T恤。犹豫片刻后，我只拿着浴巾回到玄关，发现仙台同学解开了平常总是绑着的头发。","濡湿的头发勾勒出徐缓的弧线，垂在肩上。","这副模样我曾在体育课后看过好几次。","不过分班后我就没再看过了。","仔细一看，湿透的制服上衣紧贴在她的身上，甚至能看见里面的内衣。","仙台同学这副我现在才意识到的模样，使我的心跳声逐渐加快，我把手上的浴巾用硬塞过去的方式递给她。","「拿去。」","「谢谢。」","仙台同学简短道谢后，开始擦起头发。","她没问我衣服的事。","「仙台同学，妳的制服怎么办？」","「我用毛巾擦过就好了。」","「才不好。」","「宫城妳很不死心耶。」","「我借妳衣服穿，妳脱掉啦。」","遭到否定的好意让我不肯补上「我会回房间去，不会看妳换」这句话。","「……妳就那么想要我脱吗？」","仙台同学也不肯说我在这里很碍事。","我们都不肯说只要说出来就好了的话。","「没错。这样下去妳会感冒。」","人类的身体机能可没有方便到因为是七月就不会感冒。就算是七月，浑身湿透了还是会着凉、感冒。所以在这里把衣服换下来比较好。","我是这样想的。","仙台同学却否定了我的这份心意。","「妳不要动。」","我抓住仙台同学正在擦头发的手。","「这是命令？」","「对，命令。」","我看着她湿透的上衣。","第一颗扣子跟平常一样，已经解开了。","第二颗扣子还没解开。","我放开仙台同学的手之后，她放下了原本抓着浴巾的手。","我解开领带，也代替仙台同学解开了第二颗扣子。","「我没带可以换穿的衣服过来。」","「我刚刚就说了，我的衣服借妳穿。」","我要她把橡皮擦藏在制服让我找的那一天——","我还记得她要我在规则里加上「不能脱她衣服」这一条。可是我们没讲清楚这是否正式加进规则里了。","我没停下来的手慢慢地解开了她的第三颗扣子。","仙台同学没有抵抗。","就算我把手放上了她的第四颗扣子，她也没说什么。","我知道自己不是什么都能做，却渐渐搞不清楚界线在哪里。因为仙台同学不管什么命令都听，害我变得很想去试她的底线在哪里。","把她像狗一样套上锁链，绑在房间里，她大概也会接受。就算我做了跟她约好说不会做的事，我觉得她也会原谅我。","存在于我们之间的规定渐渐变得薄弱，我觉得自己会一脚踩进至今为止从未踏入的领域。要是绑住仙台同学的那条领带留下了明显的痕迹，或许就能取代那条变淡的界线，让我只要看到领带，就不会做出太超过的行为。","可是领带没在她身上留下痕迹，她也没有反抗我。","——不是这样。","我这样做是为了仙台同学好。","我的好意虽然被她否定了，但我没有因此舍弃这份好意。","我这样做是为了避免她感冒，不是在测试她，也不是要打破我们的约定。","虽然我的心跳得有点快，但那只是我的错觉。","我们还同班的时候，就曾经在同一间更衣室里换衣服。","我已经看过好几次她接近裸体的样子了。","脱掉她的衣服这种事根本不算什么。","我解开第四颗扣子，把剩下的扣子也全都解开了。","我抓着第二颗和第三颗扣子间的前襟，拉开她的上衣后，可以清楚地看见她的内衣。","那是一套简约朴素的白色内衣，没什么特别之处。款式随处可见，毫无新意。我以前在更衣室应该有看过她穿更花俏的内衣，不过她今天穿的是就连我都会有的款式。","尽管如此，我的心脏却吵得要死。","我只是因为她会感冒才脱的。","我明明没有别的意思，现在却希望仙台同学能阻止我这双手。那仿佛是在证明我有别的意思，令我呼吸困难。","就此停手比较好。","我明白，但手依然在动。","我一边寻找可以合理化自己行为的理由，一边触碰她的内衣肩带。","扣子全解开的上衣夺走了制止我的话语。","在我指尖下的白色肩带软弱无力，我的手稍稍一动，就能轻易地脱下。","毫无困难。","我轻轻挪动她肩上的那玩意后，看了看仙台同学，她没有露骨地摆出抗拒我的表情，但一看就知道她并不欢迎我这么做。明明是这样，她却没叫我住手。我把手从仙台同学身上收回来之后问她。","「妳不抵抗吗？」","「是宫城妳命令我不准动的吧？」","如果不是命令，她就会反抗了。","虽说这也是理所当然，但仙台同学用听起来像是这么回事的语气说道。","「妳反抗一下如何？」","「妳如果打破我们的约定，我就会反抗。」","「原来这不算违反规则啊？」","「要不是我制服全湿，我就会揍妳了。」","「表示这次是特例？」","「对。毕竟这样穿着我会感冒。」","就算脱衣服这件事违反规则，只要有理由就行了。","是这么回事吧？","我们的约定没那么严格。","比想像中更有弹性，可以因时制宜。","要说方便行事也行。","「可是我还没给妳五千圆。」","「妳打算不给我吗？」","「等等给妳。」","我不可能不给仙台同学五千圆。今天也是，要不是她淋得一身湿，我早就给了。不这样做，仙台同学就不会来这里。相对地，尽管旁边附有「在常识范围内」的注释，只要给她五千圆，她对我的命令就几乎是照单全收。","规则正持续转变为对现在的我们更有利的形式。不但可以事后付款，今天还得到了「特例」这个名正言顺的理由。所以我就算继续脱掉仙台同学的衣服也不会有问题，手却动不了。我明明已经解开了湿答答的上衣扣子，却没办法更进一步。","我讨厌这样，仿佛我脱她衣服是别有用心。","我讨厌这种像是我做了什么亏心事的感觉。","我也讨厌就算衣服要被脱光了，却毫不动摇的仙台同学。","她总是这样。","把麻烦的选项推给我，逼我做出选择。今天也是，要决定接下来该怎么做的人是我。仙台同学一副事不关己的样子。","明明就连现在，她其实也没有不想让我脱她的衣服。","我对仙台同学伸出手。","我将掌心放到靠近她心脏的位置，然后顺势按上去。","「仙台同学好冰。」","我已经搞不清楚我的心跳速度到底快不快了。","只是仙台同学的身体冰凉到让我有种自己体温很高的错觉。","「因为我淋得一身湿啊。」","就算不细看，我也知道是湿透的制服夺走了她的体温。","我碰了她的脸颊，果然很冰。","就算碰她的嘴唇，也依然冰凉。","她身上每个地方都冰得吓人，我的手离开她身上后，仙台同学摸了我的脸。","「宫城好温暖喔。」","冰冷的手夺走了我的体温。","这么说来，那时候仙台同学也摸了我的脸。","我们初次接吻那天——","她的手远比现在更为温暖。那是五月的事，那天发生的事我记得很清楚，但不太记得那究竟是哪一天。因为那不是该贴上标签整理的记忆，也没在我心中的月历上留下记号。","可是，假如我此刻在这里吻了仙台同学，会怎么样呢？","愚蠢的念头掠过脑海中，我抓住她正摸着我脸颊的手，把她拉近我。","尽管不到双唇相接的程度，她那姣好的脸庞仍近在眼前。","我和仙台同学四目相对。","我又试着把脸靠近了一点。","然而她没有闭上眼。","我是不介意我们接过吻的事实残留在我的记忆里，却不想留下企图吻不肯闭上眼睛的仙台同学并遭她拒绝的记忆。","我放开她的手，稍微往后退。","我没办法继续看着仙台同学的眼睛，拉开了她的上衣前襟。","没能脱下肩带的白色内衣映入眼帘。","心脏起了反应，我轻轻呼出一口气。","我的唇吻上她的胸口。","我用力吸吮她冰冷的身体后，仙台同学抓住了我的肩膀。不过她只是抓着，没有要推开我。我没在心中的月历上留下记号，而是在仙台同学身上留下了红色的印记。","我缓缓把脸挪开。","我看向她，她的胸口上留下了淡淡的红色痕迹。","我像是要确认似的抚摸着痕迹。","我的指尖宛如被她湿润的肌肤给吸住，用力压下。在我觉得只有变红的地方很烫，打算再吻上去的时候，她抓着我肩膀的手加重了力道。","「妳不是要脱我衣服吗？」","我听到她不高兴的声音而抬起头，只见仙台同学脸上正挂着不悦的表情。","「因为我觉得痕迹不会留很久。」","我像是在找藉口，说出了有别于问题答案的答复。","「这种的马上就会消失了，无所谓。」","我没有用力留下红色的印记。","不过是明天大概就会消失的程度，位置也选在不会被人看见的地方，仙台同学没道理要生气，我没脱她衣服也不是什么她该发脾气的事。即使如此，我还是觉得待在现场很尴尬，离开了她身边。","「我去拿衣服过来。」","我逃也似的说完，抛下仙台同学走向房间。从衣柜里拉出一件给她替换用的衣服后，我立刻回到玄关，把衣服塞给仙台同学。","「我会待在房间里，妳换好衣服就过来。」","我留下这些话，没等她回应就转身回房。","我坐在床上看着自己的手，发现淋湿了仙台同学的雨也弄湿了我的掌心。","我用力握紧双手。","今天的我很不对劲。","我想脱掉仙台同学的衣服，甚至为此找理由。","更进一步来说，是我想看她脱下衣服的模样。","——这种念头绝对很不对劲。","「宫城，我要进去了喔。」","随着敲门声，平常根本不会特地跟我说一声才进门的仙台同学的声音隔着房门传了进来。","「妳就跟平常一样，想进来就进来啊。」","我用在走廊上也能听到的音量抱怨后，穿着我的T恤和运动裤的仙台同学走进了房间。","「是这样没错，但我就没来由地想说一声。」","仙台同学简直像穿着自己的衣服一样地穿着我的衣服，和看惯了的制服打扮不同，充满新鲜感。要顺便再多说两句的话，我穿起来不过是普通家居服的T恤和运动裤，在仙台同学身上看起来显得高级了些。我虽然不想承认这是容貌带来的差距，但就是这么一回事吧。","我不能接受，却也无法否认。","「仙台同学，制服给我。」","我带着总觉得仍有些烦闷的心情站起来，朝她伸出手。","「妳要怎么处理？」","「我们家有浴室干燥机，我去用那个烘干妳的制服。」","「太好了。毕竟我也不想穿着湿答答的制服回家。」","仙台同学这么说完后，把制服交到我手里。我接过制服，走向浴室。","今天的一切都很不对劲。","一定都是下雨的错。","就是因为下了莫名其妙的雨，事情才会变成这样。","我把制服挂到衣架上，晾在浴缸上方。","打开浴室干燥机的开关，深呼吸。","「没事了——已经没事了。」","我这样说给自己听之后回到房间，拿起放在桌上的五千圆。","「拿去。」","我把钱拿给站在书架前的仙台同学。","「谢谢。」","五千圆随着她的道谢被收进钱包里。接着沉默便降临了这个房间。","我漫无目的地坐到桌前之后，拿着漫画过来的仙台同学也跟着在我身旁坐下。可是她没看漫画，开始写起了作业。我背靠着床，打开她拿过来的漫画。","看书或是写作业。","这种时候的沉默只有一开始会让人在意，现在不说话也不是什么令人难受的事了。","然而今天不一样。","沉默紧紧缠绕在我身上，缓缓地勒住我的脖子。明明在做跟之前一样的事，我却觉得难以呼吸，一心只想离开房间。","「是说妳给我的五千圆都是一张五千圆纸钞，妳每次都会去换钞吗？」","仙台同学或许也跟我有同样的感觉吧，她用开朗的语气开口说道。","「是没错，妳干嘛问这个？」","我从漫画上抬起头，看着仙台同学。","正确来说不是每次。我会一次去换好一定的量。","不管我拿一万圆纸钞给仙台同学找钱，还是给她五张一千圆纸钞，都会明显地有种我们在做金钱交易的感觉，所以我早就暗自决定要准备五千圆纸钞给她。","「没有啦，只是觉得妳很可爱。」","「咦？」","「因为妳为了给我，特地跑去换钞对吧？这种行为很可爱啊。」","穿着我熟悉的衣服，看起来很陌生的仙台同学笑着这么说。","「吵死了。这种话妳可以不要说出来。」","「我觉得有点吵正好啊。」","仙台同学看着我，仿佛在说今天就是这样的日子。","「话说回来，宫城妳啊，暑假不去补习吗？去上课业辅导或考生冲刺班。」","「不去。」","「那念书呢？」","「我会写作业。」","「那是最基本的吧。除此之外呢？」","「不想念。」","我知道那是自己非做不可的事，却不想做。我也不想去上课业辅导或是考生冲刺班。","「好好念书啦，我们是考生吧。」","仙台同学语气认真地说，拿笔尖戳了戳我的腿。","没过多久就要放暑假了。","一想到长假即将到来，我就忧郁了起来。","学校无论是教室或走廊都洋溢着一股兴奋感，每个人都在等待着暑假。","我虽然无法融入这股气氛当中，却也无可奈何。","毕竟不欢迎长假的学生绝对是少数，要大家配合我根本是天方夜谭。少数派只能摆出少数派该有的样子，乖乖待在一旁。","暑假对我来说太漫长了。","待在家里也只有我一个人，就算要跟朋友出去玩，也不可能每天都有约。在我们成了准考生的今年更是如此。尽管有约好了几天，跟去年相比仍少了许多。大家都要补习，不是要去课业辅导班就是要去考前冲刺班，和去年不同，都有既定的行程。接下来就算还有一些约，理论上也不会比去年多才对。","无聊。","我是很习惯独处，却不喜欢独处，所以我讨厌长假。","「志绪理，妳这样会长皱纹喔。」","吃完便当的舞香从我的斜前方伸手过来，用食指揉压我的眉间。坐在对面的亚美就只是笑着看我和舞香，没有出手救我。","「妳这样压我的眉间很不舒服耶。」","光是手指靠近眉间就让人快起鸡皮疙瘩了，我不想让她一直摸，便抓住舞香的手，把她的手放回桌上。因为进入午休时间而吵吵闹闹的教室静不下来。舞香也和班上的大家一样，开心地笑着，又把手伸过来戳了我的眉间。","「舞香，我就说这样很不舒服了。」","我戳了戳舞香的腰，逃离她的指尖。","「志绪理，妳这样犯规啦。」","「妳攻击我的眉间也是犯规啊。」","我对着舞香这样说之后，看着我们的亚美也笑着开口。","「真的很不舒服耶。为什么被人戳眉间会那么不舒服啊？」","「我不知道，但是很不舒服，所以别再碰我的眉间了。」","我摸了摸仍觉得不太对劲的眉间，一口咬下从福利社买来的面包。","「抱歉、抱歉。最近志绪理没什么活力嘛，所以我才想让妳打起精神来。」","舞香感觉有些刻意地说。","我只是没那么兴奋而已，不是没活力。不过在她们两个眼中看来，我好像很无精打采的样子，亚美也开口问我：「发生什么事了吗？」","是发生了什么事，可是我说不出口。","我跟仙台同学说好，不能把放学后我们之间发生的事告诉任何人。而且就算我没跟她订下这种约定，下雨那天发生的事也不是能告诉其他人的事。","「我只是太晚睡了所以很困。要是有人请我吃点什么，我马上就能打起精神了说～」","我说晚睡是真的，不过很困是假的。要隐瞒不能说的部分向她们解释太麻烦了，我便夹带着谎言，说了个好像很合理的答案，把所剩无几的面包全收进胃袋里。","「请客喔，妳想吃什么？」","舞香看着我，或许是想回应我的要求吧？然而在我回答之前，亚美先开口了。","「我想吃冰，请我。」","「我为什么要请妳啊？」","舞香傻眼万分地说，不过亚美完全不在意，决定了我们放学后的行程。","「不请我也没关系，我们三个一起去吃冰吧。毕竟今天这么热。」","今天的确很热。","或许是今年到目前为止最热的一天。","连在走廊上与我擦身而过的仙台同学也不停用手对着脸颊搧风。","她明明很怕热，但就算是盛夏，她在学校也只会解开上衣的一颗扣子。今天她也只解开了一颗扣子，第二颗扣子好好地扣着。所以看不到我在下雨那天留下的吻痕。","当然即使解开了两颗扣子也看不到，而且在那之后又过了几天，吻痕应该早就消失了。不过我有股强烈的念头想确认那个吻痕是不是还在。","我会这样想很奇怪。","这我也知道。","我虽然知道却还是这么想，是因为我昨天没能确认。","放学后，我一如往常地叫了仙台同学过来，想要她让我解开她的上衣扣子，看我留下的痕迹。","可是我说不出这个命令。","「我说吻痕啊……」","我下意识地开了口，心想着这下糟了。然而在我收回脱口而出的话之前，舞香便抓住了我的话柄不放。","「吻痕？」","「没错，妳们觉得那个会残留多久啊？」","我放弃挣扎，向她们问起我很在意的事。","「咦？什么？志绪理妳做了那种事情吗？」","舞香两眼闪闪发光地看着我。","「我又没有对象，怎么可能会做那种事啊？是我之前看到茨木同学的脖子上有吻痕，才有点在意啦。」","我没看过那样的茨木同学。尽管如此，我会临时诌出这个藉口是有原因的。","『用柠檬敷在吻痕上，能让吻痕更快消失。』","这是因为我想起自己在仙台同学的手臂上留下吻痕的那天，从她口中听说茨木同学曾这样说过。我想即使我看到茨木同学在显眼的地方留下了吻痕，也不是什么奇怪的事，才会这么说。虽然很对不起茨木同学，但我觉得这也很符合她的形象。","「啊，原来是这样。」","舞香的反应如同我的预期，让我感受到素行的重要性。也理解到事实就是这样被人捏造出来，变成八卦传开的。","「应该会残留好一段时间吧？妳说是吧，亚美？」","舞香语带调侃地说。","「为什么要把话题丢到我身上啊？我又不知道。」","「咦～妳跟杉川没做过吗？」","舞香愉快的声音传来。","她口中的杉山是亚美最近交到的男朋友。虽然跟我们就读不同学校，不过我常听到他们两个会一起去念书。","「因为我和杉川是纯洁正派的交往关系啊。」","如果不留下吻痕叫做「纯洁正派」，就表示我跟仙台同学之间的关系既不纯洁也不正派。不过我们又没在交往，所以要说跟清纯正派无关，那也无话可说，再说我也没在追求什么清纯正派。","只是我实在不知道，不清纯也不正派的我们，之后到底会变成什么样子。","我不知该拿自己如何是好。","最近我开始不知道该在什么时候找仙台同学过来了。","在发生讨厌事情的那天，找仙台同学过来。","我心中的这条规则已经毁了。","所以我无法掌握下一次叫仙台同学过来的时机。","我昨天才叫她来过，所以今天不该找她，明天好像也太快了。而且仙台同学还要去补习，让我更想不透该什么时候找她才好。","我看向窗外，宛如用颜料涂抹出的一片蔚蓝天空映入眼帘。","在仙台同学淋成落汤鸡来到我家之后，梅雨季马上就结束了，天气好得令人厌恶。仙台同学的制服想必不会淋湿，我也没有机会脱下她的制服。","今天又闷又热，让人头晕脑胀的。","要是能再凉一点就好了。","我对太阳没有恨意，却仍瞪着感觉连一滴雨都不会下的天空。","我提不起劲。","不过身旁的人似乎跟我不一样。","到底是哪里有趣了？","我看着在笔记本上奋笔疾书的仙台同学。","坐在我旁边的她正在写我的作业，却莫名开心。","一直在思考该什么时候找仙台同学过来的我简直像个笨蛋。只有我的心情很郁闷，这让我很不高兴。我的身体好沉重，胃里像是塞满了石头，完全提不起干劲。可是就算世界染成了一片灰，名为明天的日子也必定会到来，等我意识到的时候，距离暑假已经剩下不到一周了。","今天恐怕是我在放假前最后一次见到仙台同学。","「仙台同学，帮我从书架上拿小说过来。」","我从她手里抢走笔后，传来她有些不高兴的声音。","「自己去拿啦。」","「这是命令。哪本都好，妳随便拿一本过来。」","「是是是。」","仙台同学一副拿我没辙的样子，站起身走到书架前。","我明明说随便拿哪本都好，她却没有马上回来。她「嗯～」地沉吟，认真挑选小说，悠悠哉哉地晃了回来。","「请收下。」","仙台同学故意用敬畏的语气说道，把小说递给我。我却没接过那本小说，把刚才从她手里抢来的笔丢到桌上。","「朗读那本小说。」","「我就想说妳会这样讲，所以挑了一本页数比较少的。」","仙台同学在我身边坐下，翻开小说。","她从那本薄薄的短篇集接近正中间的位置开始朗读内容。尽管之前从未发生过她没有从头开始朗读这种事，但她依旧遵从了我叫她「朗读」的命令。","我觉得她这样真的很恶劣。","她是明知道我希望她从头开始朗读还故意做这种事的，所以我觉得很不爽。","不过她的声音很好听就是了。","听着就会感到心情平静，舒服得令人昏昏欲睡。","「宫城，调低空调的温度啦。」","原本在朗读小说的声音突然变成了渴求凉爽的声音。","「不要，妳赶快读下去。」","「要我继续朗读是可以，可是很热耶。」","仙台同学拿起我放在桌上的垫板，开始搧风。","这个房间里的温度对我来说恰到好处。","冬天是这样，夏天也不例外。这里是我的房间，所以会配合我的感受来调整。然而接下来会有好一阵子见不到面，我想偶尔配合一下怕热的仙台同学也行。","「那妳自己调啊。」","我指着桌上的遥控器。","「宫城真小气。」","我都把房间温度这个相当重要的事情让给她了，仙台同学却开口批评我。不过她立刻调整了空调原先设定的温度，甚至有些凉过头了。","或许是吐出冷风的空调让她心满意足了吧，她喝了口麦茶，翻起小说。","她朗朗读出小说的内容，我的眼皮变得有些沉重。","我趴到桌上。","桌子凉凉的，感觉很舒服。","——不如说有点冷。","我爬起来，抓住仙台同学的手臂，发现她的身体也冰冰凉凉的。","「等一下，宫城，妳这样我很难继续读耶。」","我在她的手臂上摸来摸去之后，听见她的抗议。尽管如此，我还是继续摸着她的手臂，当我犹如在确认触感，抚摸着她的上手臂时，仙台同学用低沉的声音说道。","「不要摸我。我不用朗读了吗？」","「妳不用朗读了，快调高空调的温度。很冷。」","我的手离开她身上，摩挲着自己的手臂。","「调高温度会热。妳会冷就找件衣服穿啊。」","她语带不悦的声音传来。","「仙台同学才是，会热妳就脱啊。」","「我已经没衣服能脱了啊。」","「不是还有制服上衣能脱吗？」","「宫城妳这色鬼。」","我倒不是认真要她脱，这话真冤枉。我不由分说地调高空调的温度。过了一会儿，太凉的房间变回舒适的温度，仙台同学紧紧皱起眉头，呼出一口气。","「好热。」","虽然我早就知道了，但不管是在学校还是在这个家里，我和仙台同学都是水火不容。我有试着努力去习惯她觉得舒适的温度，然而还是受不了太冷的房间，所以我认为在这个家里应该是仙台同学要妥协才对。","「仙台同学，转向我这边。」","「干嘛？」","「妳别管那么多，转过来。」","我这样说并拉了仙台同学的领带后，她的身体转向了我这一边。我顺势解开仙台同学的领带，又解开了一颗上衣扣子。","「这样多少会凉一点吧。」","她有时候会允许我解开她的第三颗扣子，有时候不准。今天似乎是解开也没关系的日子，她什么都没说。","我伸手摸仙台同学的胸口，也就是我在雨天留下吻痕的位置。","「……这里的痕迹很快就消失了？」","我问了自己一直想知道却没问出口的事。","「消失了喔。」","听到她小声的答复，我摸着她胸口的指尖加重了力道。","可是我说不出给我看这三个字。","「手给我。」","我没等她回答就抓住她的手腕，但她甩开了我的手，可能是不想遵从命令吧？","「妳要做那种事情的话，挑别的地方啦。」","「我只叫妳把手给我，其他什么都没说耶。」","「反正妳一定是想留下吻痕吧？手臂上有吻痕的话会很显眼，别这样。」","「妳说挑别的地方，那要挑哪里？」","「这种事情妳自己想啊。」","仙台同学冷淡地说，瞪着我。","她想说的话有一大堆，但这若是命令，她会照做。","我想大概就是这么回事吧？","「只要看不到就可以了吧？」","我还是问了一下这不用问也知道的事。","「对。」","听到这仿佛在说当然的声音，我看着仙台同学。","她身上看不到的地方有限，只有现在被制服遮起来的部分。","我抓住已经解开了三颗扣子的上衣前襟，往左右打开。她的胸口暴露出来，可以看见内衣，我先闭上了双眼。当我缓缓睁开眼，把脸凑向比上次留下吻痕的地方更高一点的位置后，听到仙台同学说了句：「宫城，很热。」","尽管如此我的唇还是吻了上去，碰到的部分很烫。","和她被雨淋湿，浑身冰凉的时候不一样。","我比之前更用力地吸吮，留下痕迹。","我抬起脸后，就算不至于在暑假期间都不会消失，那里仍留下了深深的红色印记。我触碰那小小的痕迹，温柔地抚摸。我让指尖滑过，碰到比那痕迹稍微高一点的位置，再度把脸凑近后，她伸手按住我的额头。","「宫城妳很喜欢做色色的事情耶。」","仙台同学一边机械性地扣上扣子，一边说。","「我才没有做什么色色的事情。」","「这种事就是一种色色的事情吧。」","「觉得这是色色事情的人才色咧。」","如果我是别有用心才吻她，或是这个行为本身带有更深的含意，那这也许就像仙台同学所言，算是一种色色的事情吧。但我今天既非别有用心，这么做也没有别的意思，所以仙台同学说的不对。","我为自己找藉口，接着后悔用了「今天」这个词。","这粗心的用词连接上了那个雨天。","去回忆那天发生的事，就像是在探寻自己的心情。","虽然暑假太长了让人很郁闷，不过这或许是个重整心情的好机会。在假期间处分掉这些我应付不来的感情。只要全都处理掉，一定会恢复原样的。","我站起来，趴到床上。","继续朗读小说。","在我犹豫着该不该这样说的时候，仙台同学的声音传来。","「宫城，妳决定好要念哪所大学了吗？」","「考得上的大学。」","我没看仙台同学就回答。","「太随便了吧？暑假结束后就是第二学期了，再不决定就糟了吧？」","「我就没兴趣嘛。」","「妳暑假要怎么办？去上个补习班啦。」","仙台同学开始唠唠叨叨地说些我爸都不会说的话，让我想捂住耳朵。","爸爸不知道是不是对我不感兴趣，他从没仔细问过我关于志愿的事，也不会叫我念书。明明我没去上大学，搞不好也不会去工作，但在我上了高中之后，爸爸也不曾啰哩啰唆地叫我做这个做那个。只会默默给我过多的零用钱。","「那个我之前已经回答过妳了。」","要再把我暑假的预定行程跟比我家人还啰唆的仙台同学说一遍也很麻烦。反正我不久前才回答过，没必要再说。","「妳之前说妳不会去补习对吧？那要不要干脆请家教？」","「我怎么可能请家教啊？是说仙台同学妳很啰唆耶，别管我的暑假要怎么过啦。」","我爬起来，把枕头丢向仙台同学。她接下枕头后随意开口说道。","「不是啦，是我这边有个好人选啊，想说可以介绍给妳。」","「妳很不死心耶。不用介绍给我。」","「一周三次，只要五千圆。很便宜吧？」","「一次五千圆？」","我不清楚家教的行情，所以不知道这算贵还是便宜。","「不是，三次算五千圆就好了。」","「——就好了？」","我盯着面带微笑说着奇怪事情的仙台同学。","「宫城，雇用我啦。我会教妳功课的。」","仙台同学很奇怪。","这不是我所知的仙台同学。","在放假期间来我家。","她至今为止从没说过这种话。","「……我们不是说好放假期间不碰面的吗？」","我说要买下她放学后的时间，是仙台同学自己跟我说假日不行，不过除此之外的日子她愿意用一次五千圆为代价听命于我的。而且这个约定一直持续着，去年的暑假我也连一次都没有跟仙台同学碰面。当然，包括寒假和春假，就连周六或周日，我都没有跟仙台同学碰面过。","「这是为了补偿我折到妳课本的事。」","仙台同学轻松地说。","不用回溯自己的记忆，我也记得我的国文课本上有仙台同学留下的折痕。","但是现在说这个，未免也隔太久了。","那已经是很久之前的事了，到了现在也不需要再特地提起，而且我应该已经用狠咬仙台同学的前臂作为她的补偿了。","「妳是说雇妳当家教？是说那件事，妳不是已经补偿过了吗？」","「那只是妳擅自咬我，又擅自把那当作补偿吧？」","「妳这么想要五千圆吗？」","一旦去思考她即使有弹性地改变规则，也要来我家的理由，我只想得到这个而已。毕竟仙台同学拿到的零用钱好像不算多，虽然她不像是需要五千圆的样子，但应该也没有其他理由了。","「或许是吧？」","她平静的声音传来。","「……仙台同学妳不是还要去上考生冲刺班吗？暑假期间也得去吧？」","「反正暑假期间可以调整时间，我可以补习完再过来这里。只有教妳功课而已，不能命令我。剩下的就跟平常一样。在暑假前给我答复。宫城妳要是想加强课业，上课时间由妳安排就好。」","「我没给妳答复的话会怎样？」","「那我就不会当妳的家教，跟去年暑假一样，不会来这里。」","仙台同学说完后，翻了一页她没有要朗读的小说。","〔本话含插图〕"]},{"t":"第4话　我太习惯会去见宫城的生活了","p":["我在放假期间也想见宫城。","我不知道自己心里是不是这样想的，但我简直就像是想见她一样，提了家教的事。我并不后悔，却在想自己为什么会说出那种话。","对舔了我耳朵的宫城。","对用领带绑住我的宫城。","对想要脱我衣服的宫城。","对不用细想也知道，她一路下来对我做了不少过分事的宫城。","我居然对她说了「雇用我啦」这种话。","我是有什么毛病？而且真要说起，说要当同学的家教也太不知天高地厚了。","这样感觉有点讨人厌，好像我是冲着钱才这么说的。","我仿佛会溺水般，深深泡进了热水里。","「宫城这个笨蛋。」","带着迁怒味道的声音在浴室里回荡着。","明天就放暑假了，宫城却没有联络我。虽然我早就知道了，不过这表示她不需要家教吧。毕竟我们说好了假日不碰面，宫城会拒绝也在我的预料之内。可是我很在意我突然说要当她的家教，宫城她是怎么想的。","反正宫城也很过分，就算我是个讨人厌的家伙应该也没差，但我还是会介意。","毕竟比起当坏人，还是当好人比较好。比起被人讨厌，我更想被人喜欢。","仙台叶月这个人就是由这种单纯易懂的行动原理所构成的。这点就算是面对宫城也一样。原本对宫城而言，我就很难说是个好人了，但我不希望她因为这次的事觉得我是个讨厌的家伙。","只有金钱往来的关系。","我明白我和宫城的关系仅止于此，也认为自己算是接受了这个事实，有时候却会非常在意我从同学手里收钱这件事。那是因为我其实并不欢迎五千圆介于我们之间。","我跟宫城变得越是亲近，这五千圆就越是沉重。","即使如此，我太过习惯每周会去见宫城一到两次的生活，没去见她反而静不下心来。要是她没联络我，我甚至会想说是发生什么事了。","其实在暑假期间，我是不该去见宫城的。","我最近太被情绪牵着走了。","空出一段时间很重要，只要有时间，我就能拉出不知被塞到哪里去的理性，也能找回原有的冷静。","算了，反正她好像也觉得别跟我碰面比较好，也没有联络我，所以怎样都无所谓啦。","我将视线往下移。","可以看见胸口上那小小的痕迹。","明明没胆子脱掉我整套制服，却有勇气留下吻痕。","真是个怪人。","宫城就只会做些奇怪的事。","我觉得不要让她留下这种痕迹比较好。一旦这种看得见的地方有宫城的痕迹，就算我不愿意，也会想起她，回忆起过去。拜此所赐，我一直拖拖拉拉地想着她没联络我的事，想从浴缸里出来都不行。","这种心情早点消失就好了。","暑假已经开始了。","我要去上考生冲刺班，也会跟羽美奈她们碰面。","必须做的事情比去年还多，我没空一直去想宫城。","「不行了。好热。」","我从满是热水的浴缸里出来，在浴室前的更衣室擦干身体，穿上家居服。","吹干头发之后，我走向黑漆漆的厨房，从冰箱里拿了一瓶运动饮料，再回到房间。","我看了一眼放在桌上的手机，通知有新讯息传来的灯号亮着。","我觉得很麻烦。","现在的时间已经过半夜十二点了。在这种时间还会传讯息来的对象，不是羽美奈就是麻理子。","不是要约去唱KTV，就是要约去联谊。","今天她们在学校一直滔滔不绝地讨论明天后的行程，所以我想她们一定是来跟我说那些事情的。羽美奈说暑假她父母逼她去上补习班，却也有说她会去打工。麻理子好像同样会去补习。不过她们也说去唱KTV跟联谊是不可或缺的活动。","我是很期待和平常玩在一起的朋友们一起去玩，但我对联谊没兴趣。她们两个找来的男生，总是只有那张脸能看，一点内涵都没有。","我拿起手机，坐到床上。","我看着手机画面，如我所料地看到了羽美奈和麻理子的名字。她们传来的讯息内容也跟我想的一样。","我今年或许可以拿考生冲刺班当理由，推掉几个约。","我边想这种事边仔细看萤幕时，发现上面有宫城的名字。","『周一、周三、周五，一周三次。跟我说妳大概会几点过来，还有来之前也要先跟我联络。』","虽然她话中省略了，但我知道她是在说家教的事。我看讯息传来的时间比半夜十二点稍微早了一点，表示她在暑假开始前给我答复了。","她规矩地遵守了我们的约定，我在传讯息回复羽美奈、回复麻理子之前，就传了一句「我知道了」给宫城。","每周会见到宫城三次。","加进漫长假期中的这个行程也没什么了不起的。可是我会见到她的次数比过去这段时间还多，让我有种奇妙的感觉。我觉得这会比我只有在上补习班的空档和羽美奈或麻理子她们碰面的假期过得更有趣。","考生冲刺班是个不怎么好玩的地方。","补习班的老师很认真在上课。上课内容浅显易懂，我的成绩也变好了。可以解开原本解不开的问题、考试分数变高也让我很开心。我喜欢能够看见成果的瞬间。","然而我早就发现，不管再怎么去上考生冲刺班，我的成绩仍不足以考上父母期望的大学。就算这样我还是无法选择不去，仍旧在上父母所选的考生冲刺班，所以很无聊。","我的成绩可以考上别人口中不错的大学，然而那也没有多大的意义。","我传讯息回复羽美奈和麻理子。","在以学校为基础延伸出的人际关系里，聪明懂事的仙台叶月将「我知道了」这句话经过一番包装后，按下了送出的按钮。我答应的只有联谊以外的行程，先保留了关于联谊的答复。","自从我开始会去找宫城之后，才知道我比自己所想的更会顾虑他人，感觉很讨厌。","我想自己和宫城见面的时候，大概是最轻松的。那段时光比我和任何人共度的时间都更有意义，也比待在任何地方都舒适。","「家教是从哪一天开始呢？」","我打开手机的行事历。","按照宫城指定的日期，是从周三开始。在已经过了半夜十二点的现在，等于是从今天开始的意思。","上午去上考生冲刺班，下午去宫城家。","明明只是要去找她念书，我却想着要是早上能赶快到来就好了。","从补习班回来，吃午餐，传讯息给宫城。从自己家出发，前往平常总是从学校出发的宫城家。","下午的路对我来说太热了，我挑有阴影的地方走着。天空和梅雨季时在下雨的感觉简直不像同一片天空，太阳在我的头上闪耀着。","走路过去大约要十五到二十分钟。","太热了，就连这样的距离我都觉得格外遥远。","如果是一年前的我，这时候应该已经想回家了，今天却有力气抱怨天空，抵达了宫城所住的住宅大楼。我请她帮我解除了大厅的门锁，搭电梯来到六楼。我在玄关前按下门铃后，大门马上就开了。","「这是我第一次看到耶。」","我忍不住说出了我在放假期间初次踏入的宫城家里，初次看到宫城的感想。","「看到什么？」","「妳穿便服。」","T恤和牛仔裤。","宫城倒也没有精心打扮过，只是穿着很常见的服装。虽然她穿着适合在家活动的轻便服装没什么好奇怪的，可是她穿的不是制服。这理所当然却又并非理所当然的事，让我轻轻抽了一口气又吐了出来。穿着陌生便服的宫城，看起来跟我所认识的她仿佛是不同的人。","「仙台同学妳也穿便服啊。」","「是没错啦。」","我今天的行程只有去补习班，还有来教宫城念书而已，没什么需要特别顾虑的事，也没有需要精心打扮的理由，所以我只做了短裤加衬衫这种普通的搭配。","「妳腿很长耶。」","宫城直盯着我看。","「妳就算夸我，我也没有东西可以给妳喔。」","「我不是在夸妳，只是说出我所看到的事实。」","宫城冷漠地说完后走向房间。我像平常一样，走在跟平常不一样的她身后进了房间。然后宫城给了我五千圆。","「这是周三跟周五的份。」","「上完三次课再给我就好了。」","「三次很难记，在每周一开始的那次给妳五千圆就好了吧。所以这是这周的份。」","一周三次的家教。","要收费的话，我觉得事后收费比较好。","在我当了三次家教之后再收钱，我在心情上会比较轻松。","可是宫城似乎想先付钱。而且还不是用三次当一个区间，而是用一周来计算，跟我的意见不合。","「我周一又没来，用五千圆当这周的份太多了吧？」","「那样很麻烦，算五千圆就好了。」","宫城可能是对已经给了我的东西没兴趣吧，她态度随便地说完后便坐到桌前，打开课本。","「我知道了，谢谢。」","我已经学到就算不肯罢休地缠着固执的她争论，也只是徒劳无功，不会有好事。我老实地把五千圆钞票收进钱包里，在宫城身旁坐下。","「所以老师，我们今天接下来要做什么？」","我看向客套地这么说的宫城，她一脸摆明了没干劲的样子。","桌上摆着她摊开的课本，还有老师出来当作暑假作业的讲义跟习题。都是宫城不擅长的科目。","她是想要我帮她写作业吧？","就算班级不同，暑假作业的内容也是一样的，如果只是要写完那堆讲义和习题，那我来写是比较快。只是那样就没有意义了。虽然我也没多认真地想当她的家教，但是我毕竟收了她的钱，所以宫城应该要自己写，有不会的地方我再教她吧。","「那当然是要念书吧？还有不要叫我老师。」","「又没关系，妳就是仙台老师啊。」","「妳明明就没把我当老师。妳其实根本不想念书吧？」","「没有人会自己主动想念书啦。」","那妳为什么要答应找我当家教的提案啊？","我把这句差点脱口而出的话给吞了回去。","我虽然在意，但觉得这话不能说出口。要是说了，感觉宫城就会改变心意了，而且她要是问我为什么会主动说要当家教，我也很伤脑筋。","「总之先从写作业开始吧。」","我拿起一张讲义放到宫城面前。","「仙台同学妳会帮我写吧？」","「不对，宫城妳自己写。有不懂的地方我会教妳。」","「好好好。」","宫城一副嫌麻烦的样子，说出了平常我在说的台词，然后低头看向讲义。我也摊开自己的作业，把答案写在讲义上。","房间静悄悄的，我看向身旁。","刚才嘴上还在抱怨的宫城正认真地在解题。从她的讲义上看来，有几题答错了，不过我决定等等再一并教她，先写起自己的作业。","这是我第一次在不用上学的日子来到这个房间里，却和之前没什么不同。毕竟宫城和要上学的日子一样给了我五千圆，人也在我旁边。","可是我想不会一直是这个样子。","在长假期间碰面，表示宫城这个人比起过去，与我有了更深的关联性。","春天来临，从高中毕业，在那之后我想必就不会再跟宫城碰面了。和宫城变得更亲近明明没有任何意义，我却特地在暑假跑到她家来。虽然我找了一些理由，像是我很中意宫城，或是这房间待起来很舒服等，然而我不知道自己究竟是在往哪个方向前进，有些不安。","即使如此，我还是选择来到这个房间。","就连可以不用来的暑假也跑来这里。","我不太喜欢这样的自己。","像是一直在解一个解不开的问题，让我头痛了起来。","「宫城，妳明天要做什么？」","我仿佛要逃离这份与暑假不相衬的黯淡心情，开口问她。","「什么是指什么？」","「明天的安排。」","「我一定要告诉仙台同学吗？」","宫城从讲义上抬起头，看着我。","「是没有一定要说，可是闲聊一下也无妨吧？」","「……我会跟舞香她们碰面。」","跟宇都宫还有另外的某个人吗？包含在她所说的「她们」里头的，我想一定是升上三年级之后就经常和宫城一起行动，叫白川的女孩子。","「妳们要去哪里？」","「去哪里都可以吧？仙台同学妳是啰唆的老妈喔？」","「我觉得我没像老妈那么啰唆啊。」","我倒不是认真地想弄清楚宫城的行程。","在放假前感觉百无聊赖的宫城也有约，让我有点在意那是怎样的行程。就只是这样，不过是闲聊个两句罢了，却被她说我啰唆，实在很没意思。不如说，我觉得连这种小事都不肯回答，反而抱怨起来的宫城还比较啰唆。只是宫城像是要我闭嘴地说了。","「我觉得妳很烦。」","「就聊一下又没关系。」","我用笔戳了戳宫城的手臂。","「我要写作业，不要妨碍我。」","宫城这样说完后，便在讲义上振笔疾书。可是还没过十分钟，她就丢开了手里握着的笔。","「我果然还是不想念书。这个妳帮我写啦。」","「自己写啦。还不到一个小时耶。」","「我下次会努力的。」","「那妳把写错的地方改好之后，剩下的我帮妳写。」","「是哪里写错了？」","「总之这里跟这里错了，还有其他地方。」","我用笔尖指出写错的地方之后，宫城数了一下数量，露骨地摆出厌烦的表情，但或许是交换条件很吸引人吧，她拿橡皮擦擦掉了错误的答案。我为了引导她写出正确答案，稍微给了一点提示后，她把写错的地方全都改过来了。","「剩下的我来写，在我写完之前，宫城妳先写妳擅长的科目。等我写完了妳再照抄上去就好。」","「……结果还是要写作业喔。」","「那当然啊。」","就连我接下来预定要写完的讲义，我都不会乖乖让她照抄。我现在没打算要说出口，不过我是想在某种程度上让宫城自己去解题的。她好像没想到我真的会做些像个家教的事，一脸不情愿地写着新拿出来的习题。","那些分量还不少的暑假作业，一天是写不完的。","在我们脚踏实地地慢慢填满讲义和习题的空白栏位后，也过了好一段时间。","「要吃晚餐吗？」","宫城回头检视已经写完的几张讲义，开口说道。","我没想到暑假她也会跟放学后一样准备晚餐给我，有些惊讶。","我大概猜得到她会拿出什么。","一定是市售熟食或是调理包。","虽然跟平常没两样，不过比起在家里吃晚餐，在这里吃好多了。","「我要吃。」","我说出早就决定好的答案后，宫城走向厨房。我跟在她身后走出房间，坐到吧台旁的椅子上。我默默地看着站在厨房里的宫城，只见她把银色的包装袋放进热水里，银色包装最后成了咖哩，被她端了过来。","我们两人一起双手合十，说：「我开动了。」之后，我吃了一口咖哩。","「吃调理包是不错，但妳偶尔也做做饭嘛。」","我将以调理包来说味道还满高级的咖哩吞进肚子里，对宫城说道。","「咖哩这种东西吃调理包就好了吧？要做很麻烦耶。」","「妳是不会做吧？」","「要这样说的话，那仙台同学妳做啊。」","「那妳准备好材料给我啊。」","因为老是让她请我吃饭也不太好，我是不介意为此付出劳力。先不管宫城觉得好不好吃，我至少能马上做出一些简单的菜色。叫我做饭的当事人却说了很不负责任的话。","「我想准备的话就会准备。」","她不会帮我准备材料吧？","听到宫城毫无干劲的回答，我在心中叹了口气，将咖哩送入口中。","在简单的对话过后，晚餐转眼间就吃完了。","我帮忙收拾并喝着麦茶，看向窗外。","就算先去过补习班，我也因为不用去学校而比平常更早到宫城家来，更早吃了晚餐。尽管如此，隔着蕾丝窗帘可以窥见的天色仍逐渐暗了下来。","「我差不多该回去了。」","虽然我晚回家也不会有人说些什么，不过我也不能一直待在这里。我回宫城的房间里拿了包包，走到玄关。在我穿鞋的时候，她开口向我搭话。","「仙台同学，妳明天也要去补习班？」","那不带起伏的语调，让我脑海中闪过我在晚餐前问到的宫城明天的行程。","「不只明天要去就是了。」","我去上考生冲刺班的时候，宫城在跟朋友出去玩。","虽说我们是考生，但也不是每天都得念书不可。所以宫城就算出去玩也没关系，我却莫名地感到不爽。","我伸手想打开玄关的大门，又把手收了回来。","转身抓住宫城的手腕。","「妳干嘛？」","我把一脸诧异的她拉向自己，吻了她的脖子。","尽管之前接吻过，我的心跳声还是变快了些。","宫城推了推我的肩膀。","可是我无法阻止自己。","我明明没想要做这种事，却用力把嘴唇抵上去，用不会留下痕迹的力道吸吮着她。","嘴唇感受到她柔软的肌肤触感。","洗发精和宫城的汗水混在一起的味道搔着我的鼻腔。我让嘴唇离开她，又轻轻地碰了一下之后，慢慢抬起头，对做出这种没意义行为的自己轻叹了一口气。","没有空调的玄关很热，我抓着宫城手腕的手也汗湿了。","「不要做奇怪的事情啦。」","她随着强硬的语气甩开了我抓着她的手。","「我不过就碰妳一下而已，也没有留下痕迹，不算太奇怪吧？」","「我不是那个意思。」","「我今天不仅教妳念书，还帮妳写了作业耶，这是报酬。」","我随便诌了个理由告诉宫城。","「……我没听说有这种机制。」","「因为我没说啊。」","「不要事后才多加规则上去啦。是说剩下的讲义也有很多部分是我自己写的啊。」","「可是也有一部分是用抄的吧？」","我说了几句话来补强我诌出的理由，打开玄关大门。我走到住宅大楼的走廊上，宫城也边抱怨边跟着走了出来，与我一起搭进了电梯里。","电梯来到了一楼。我们一同走着，直到抵达入口大厅。","我在走出住宅大楼前说：「再见。」之后，宫城看起来很不高兴地回了我一句：「拜拜。」","和过去不同，我知道道别后的下次是什么时候。","「再见」是指周五见，我不需要等宫城来联络我。","在我要回去的时候虽然没有约好，但后天的行程已经定下来了。","一定是间隔一天这个烦人的行程表不好。","这让我有时间去回想昨天发生的事，去想她今天在做什么。","反复去想便会留下鲜明的记忆。和念书一样。从家里走去补习班的路上、从补习班回家的路上、洗澡的时候、躺在床上还没入睡的时候。宫城可以闯进来的空档要多少就有多少。所以到了已经是周五的今天，我还是很在意昨天的宫城在做什么。","高中生在暑假能做的事情有限，所以我大概能猜到她去了哪里。","不是唱KTV就是逛街、看电影，或是去游乐园玩。","也就是这些了，她应该没去什么特别不一样的地方。","妳昨天去了哪里？","我现在也可以问她本人这个问题，可是我周三问她的时候她不肯回答我，我不认为她今天就会愿意回答。","「仙台同学，这边我看不懂。」","宫城坐在我身旁，用笔指着摊开的习题上面的位置。","「喔，这里是——」","我在写有一些数字的纸上，告诉她这题该用的公式。","从记忆中找出所需的东西并说出来不是什么困难的事。我知道我这样根本称不上家教，也不是该收费的事，却不能没有任何理由就在放假期间到宫城家来，所以才创造出了这个理由。","我想宫城也已经发现这点了。","就连我周三吻了她脖子的理由，都是随口诌出来的。","宫城有权为了那个吻而生气。","那为什么在我吻她之后，她没有真的生气呢？","我虽然想问，不过我想这也是一个就算我问了，她也不会回答的问题。这种不能说出口的话持续增加下去，感觉我总有一天会窒息，好恐怖。","「……妳昨天去了哪里？」","我把吞进肚子里的两个问题中，比较好问出口的那一个说了出来。","「妳帮我写作业的话，我就告诉妳。」","宫城干脆地说，把习题放到我面前。","嗯，我就知道会变成这样。","她是觉得我不可能会帮她写作业才这样说的吧，也就表示她没打算要回答我。","「今天就别写了吧。」","我阖上宫城的习题，背靠到位在我身后的床上。","「太快了吧？」","开始念书后才过了一个小时，所以要说快还是慢，那的确是快。毕竟还不到能说今天就到这里结束的时间，所以我提了一个提案。","「因为时间还早，妳可以命令我喔。」","「那是怎样？」","「我的意思是，毕竟今天也还不到该结束的时间，我周一也没来当妳的家教，所以我欠妳的这些部分，妳可以用来命令我。」","我没把「真要说起来，我这样根本就不算家教。」这句话说出口。","「妳不要擅自订新的规则啦。」","「世上有临机应变这句方便的成语啊，加条新规则也无所谓吧？」","「一点都不好。」","「那接下来要做什么，就由宫城妳决定吧。提个命令以外的事情。」","提前结束家教的工作，要我去做其他什么事情都行。反正我也没特别执着于命令这件事，把一切都丢给宫城决定后，可能是没有其他好点子吧，她推翻了自己的意见。","「……我要命令妳。」","「我知道了。妳要我做什么？」","「现在带我去妳家。」","「啥？」","「毕竟每次都是来我家，偶尔去仙台同学家也可以吧？」","她为什么会想下这种命令啊？","我真想敲开宫城的头，看看里面都装了些什么东西。","上高中到现在，我从没找朋友到家里玩过。朋友们曾说过好几次想来我家玩，不过我全都拒绝了。虽说朋友来玩也未必会去跟我父母打招呼，但有可能会撞见我父母。","如果发生那种事，事情一定会变得很麻烦。我不想特地让大家知道我跟家人的关系不好，也不想让别人踏进我的私人领域里。","「我开玩笑的。」","宫城一副觉得很无聊的样子说着，打开了我刚才阖上的习题。","「我什么都还没说耶。」","「妳接下来要说不行吧？」","「妳哪知道我要说什么啊？」","我这样说完，轻轻拍了一下宫城穿着短裤的大腿，她把我的手挥开。","我想这大概表示她心情不好吧。","我吸了一口气，一鼓作气地站起来。","「宫城，走吧。」","「咦？」","她愣愣地发出怪声。","「咦什么？叫我带妳去我家的，不就是宫城妳吗？」","「是没错。」","「妳不去的话，我就要坐下了。」","尽管不太情愿，不过对象是宫城的话，我觉得让她进我房间也没关系。可是开口提出这个要求的当事人如果不想去，我也没必要硬把她带去我家。","「我要去，但仙台同学妳也要一起去吗？」","宫城在我坐下前站起身，说了奇怪的话。","「要我带妳去，就是要一起去吧，而且我不一起去，妳也不知道路吧？宫城妳知道我家在哪里吗？」","「不知道。」","那是当然的。","她从没问过我住在哪里，我也没说过。就因为她一个人去不了她不知道在哪里的地方，只能由我跟她一起去。可是宫城依然站着没动。","「宫城，妳怎么了？不去吗？」","「……有可能会被其他人看到我们一起走在路上，没关系吗？」","宫城说的这番话让我明白她站着不动的理由了。","放学后发生的事情不能告诉任何人，在学校也不和对方搭话。","我们是这样约好的，所以没人知道我有在和宫城碰面。这一直是我们两人的秘密，往后也依旧是我们两人的秘密。所以她或许是想说我们不能一起走在路上吧，不过碰巧遇到原本的同班同学，一起走在路上
