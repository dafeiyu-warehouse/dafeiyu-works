"然后陷入沉默。","「干嘛突然不说话？」","「我可以摸你的耳朵吗？」","我明明没说可以，她却把手伸过来。我一把拍开那只手。","「不行。人家说刚打完耳洞最好不要摸。」","「宫城你刚刚不也摸了。」","「我等下会消毒，所以没关系。」","「反正你都要消毒了，让我摸一下也没差吧。」","「有差。真要说起来，我为什么非得让仙台同学摸啊？」","「我想仔细看一下耳环有没有好好戴在上面。如果重点是不要碰到耳洞附近，那我稍微摸到耳朵也没关系吧？」","「不用确认我也知道有笔直地打出一个洞，耳环也好好戴在上面。你不用看，也不要摸。」","想确认不需要用摸的。","光是照镜子就知道耳环的针有笔直地穿过去。","她嘴上说想要确认，但那在我听来不过是想做坏事的藉口。仙台同学总是这样，一旦掉以轻心，她就会对我做出奇怪的事。","「宫城，你知道吗？」","大概是放弃摸我耳朵了，仙台同学用格外温柔的语气开口。","「什么？」","「听说耳洞啊，打完之后反而比打的当下还要痛喔。」","「我事先查过，当然知道。」","「这样啊。」","仙台同学把鸭嘴兽放在地上，抓住我的右手。我反射性地缩回手臂，她却用不小的力道把我拉回去。有个温热的东西碰到比耳垂更上面的位置。","仙台同学的手指陷进我的手腕。","有点痛。","可是比起手腕，我更在意耳朵。仙台同学的嘴唇碰到我的耳朵，那久违的触感有点痒，但很舒服。","嘴唇退开，这次紧紧地贴了上来。","心脏跳得比刚才更快了。","这都要怪仙台同学。","我用左手一把推开仙台同学的肩膀。","「你不要突然做奇怪的事情啦！会害细菌跑进去。」","耳朵好烫。","我用指尖滑过仙台同学触碰过的地方。","「没关系吧？我碰的又不是打耳洞的位置。而且这才不是奇怪的事，是让你不会痛的幸运魔法喔。」","仙台同学说出我曾经听过的词汇。","可以写出正确答案的幸运魔法。","她如此主张，用嘴唇触碰我身体的某些部位，施展「幸运魔法」。然而，那是她打着能让我考上大学的名义擅自创造出来的东西。","「才不会因为这样就不痛。」","尽管不到需要嚷嚷的程度，耳朵上仍残留着痛楚。","「因为这不是会立即生效的幸运魔法啊。」","「仙台同学，你不要这样乱说话。」","「你也知道我的幸运魔法有效吧？」","因为考上了大学，我才会在这里。","可是我不晓得自己是不是因为仙台同学的幸运魔法才考上大学。不对，一般来说，这当然不是幸运魔法的功劳。能考上是因为我有努力念书，仙台同学也有教我。和被称作幸运魔法的吻没有关系。","「说什么幸运魔法，仙台同学只是在做自己想做的事嘛。」","「那宫城你想做什么？」","「仙台同学不想做的事。」","「这意思是——如果我说『不想施展幸运魔法』，宫城就会对我施展幸运魔法吗？」","「不是这样。」","「既然这样，你来对我施展幸运魔法啊。」","她从刚才就抓着我的手不放，现在又把我拉过去。我的身体差点失去平衡，只能强硬拉开她紧紧贴住手腕的手。","「仙台同学等一下——」","刚拉开的那只手又抓住我的肩膀。","仙台同学靠了过来，将嘴唇贴近我上半边的耳朵。","搬来这里后，这是我们最靠近的一次。","开始同居以来，仙台同学的嘴唇从未像这样紧紧贴住我身上的某个部位。我们也试着不让这种事情发生。说得更精确一点，我们很努力在寻找室友之间应有的距离。可是仙台同学现在让那些努力都化为泡影。她靠得好近，触碰着我。","「宫城。」","她在耳边呼唤我的名字。","吐出的气息感觉有点痒。","嘴唇又凑了上来，接触的地方变得温热。","太近了。","我觉得分开比较好。","可是我没办法像刚才那样推开仙台同学。","和唇瓣不同的东西碰触到我。是舌尖，耳朵湿湿的。就像她说的，没有碰到打耳洞的地方。","移动的舌头令我全身颤栗。","痒痒的，很恶心。","舌尖像要抚过皮肤表面般滑过，我的呼吸哽在喉头。恶心的感觉快被舒服的感觉给冲走，我用力呼出一口气，推开她的肩膀。","「等一下！仙台同学，你走开啦。」","我双手使劲，把仙台同学推回原本的位置。对室友来说，这样还是太近了，但已经不是能吻上我耳朵的距离。我从她旁边的鸭嘴兽身上抽出一张面纸擦拭耳朵，然后用鸭嘴兽拍打仙台同学的大腿。","「好痛。」","仙台同学夸张地大叫。","「我不是叫你别做奇怪的事情吗？说到底，室友根本不会做这种事。」","「室友还是会帮对方施展幸运魔法吧？」","「才不会施展『这种』幸运魔法。仙台同学你好好当个室友啦。」","「那是因为宫城你——」","仙台同学说到一半就停了下来。","「我怎样？」","「……叫我帮你打耳洞。」","「我是说过，但没叫你做多余的事。」","我又用鸭嘴兽打了一下仙台同学。","「好痛。」","「刚打完耳洞的我比较痛。再帮我消毒一次。」","我把棉片和消毒水递给仙台同学。她默默接下，用消毒水沾湿棉片，在耳环上轻轻按压。","迅速擦拭过我的两只耳朵后，她拿开棉片。","湿湿的耳朵感觉冰冰凉凉的。","跟仙台同学的嘴唇和舌头不一样。","被她触碰的时候，感觉更火热——","我差点想伸手去摸刚消毒过的耳朵，只好用力握紧拳头。","「我要回房间了。」","穿耳器、消毒水和棉片。","我把这些东西塞进纸袋，然后提着纸袋站起来。","可是仙台同学拉住我的衣服，我无法走出房间。","「宫城。」","「干嘛？」","「虽然刚才说过了，但耳环很适合你。我觉得很可爱喔。」","她松开拉着我衣服的手。","「不用说客套话。打耳洞用的耳环，造型根本无关紧要啊。」","穿耳器附的耳环是用来撑住耳洞的，我挑选的时候比起造型更重视材质。我实在不觉得这副以医疗用不锈钢制成的耳环，造型有好看到足以被仙台同学称赞「可爱」。","「我是真的觉得很可爱啊。」","「都说不用说这种话了。」","我转身背对仙台同学。","才走两步，身后又传来她的声音。","「等一下。这个呢？」","我回过头，仙台同学拿着装有鸭嘴兽盒套的面纸。","「那个就留在你房间里吧。」","「可是我房里已经有面纸了。」","我走回仙台同学身旁，从她手里接过鸭嘴兽，拆下面纸盒的盒套并递给仙台同学。","「拿去。」","「要我套在房间里的面纸盒上吗？」","「有套上什么东西比较好。如果你不想用就套回这个上面吧。」","「我会用，给我。」","仙台同学从我手里接过面纸盒套，接着补上一句：「还有一件事。」","「什么事？」","「黄金周，你哪天有空？」","面对这出乎意料的问题，我甚至不用翻开脑中的日历确认行程就能回答。","「有空是有空，但我死都不要。」","「我还什么都没说耶。」","「反正你一定是想找我出去玩吧？」","「是没错啦。」","「如果是其他行程我会考虑一下。」","我和仙台同学没有共同兴趣。说是这么说，但我其实不知道她有什么嗜好。我们无论是往来的朋友还是就读的大学都不同，两人几乎毫无交集，连想看的电影都不一样。比起出去玩，我觉得一起待在家里比较好。","「那你留个一天给我。我再想想要做什么。」","失去面纸盒这个骨架害鸭嘴兽变得软趴趴。仙台同学一边拍打鸭嘴兽的头，一边这么说。","「知道了。」","我再次转身。","打开房门后，她对我说了声「晚安」，我也回了一声「晚安」。","〔本话含插图〕"]},{"t":"第5话　想确认宫城","p":["在那之后。","从我帮宫城打耳洞的那天起，她开始会来我房间——其实也才两次。","第一次是我拜托她借我漫画，宫城把书拿来我房间后立刻回去。第二次是今天吃晚餐时，我请她借我字典，她就送来我房里。","我房间也有字典。","其实不用特地跟她借，但我想测试一下宫城会不会再拿来我房里。宫城应该也知道字典只是藉口。尽管如此，她还是来到我房间，现在坐在我身旁。","因为进入黄金周后闲着没事。","因为我先前拜托她连假期间留个一天给我。","或许是这两个理由的其中之一，也可能都不是，总之宫城乖乖地坐在我旁边，看着她拿来借我的漫画。","我阖上刚才在看的漫画，握住包覆面纸盒的鸭嘴兽的手。","明明有很长一段时间，我都固定坐在宫城身旁，宫城也会固定坐在我旁边。但我现在有点紧张。这大概是因为搬来这里后，我们之间曾有过隔阂。","聊点什么应该能转移注意力，可是我找不到合适的话题。宫城在看漫画，我没必要勉强找她说话，说不定还会被嫌吵。我知道应该保持沉默，但宫城在身边，我就忍不住想和她说话。","我放开鸭嘴兽的手，再次握住。","没有体温的手又小又软，让人放心不下。","这只不得不从共用空间搬来我房里的鸭嘴兽，或许就像宫城往后会再次造访的讯息。否则我房间的面纸盒有没有盒套根本不重要。可是我不知道至今为止都没打算进我房间的宫城，为什么突然想进来。","我继续揉捏鸭嘴兽的手。","「仙台同学，你喜欢那个吗？」","隔壁传来的说话声打破房里的静默。我将视线从鸭嘴兽挪到宫城身上，发现本来应该在看漫画的她正盯着我。","「『那个』？」","「鸭嘴兽。你从刚才就一直摸，我在想你是不是很喜欢。」","「嗯，还满喜欢的。」","我这么回答，拍了拍鸭嘴兽的头。我不介意被宫城看到自己在玩面纸盒套，但双手一时无所适从，只好再次翻开看到一半的漫画。我身体向后靠着床舖，翻过一页又一页。翻到第五页时，宫城说话了。","「……你家教的打工是从什么时候开始？」","我阖上刚打开的漫画，转头看去。","从学姐那边听完家教的说明后，我当场就决定要接下这份工作。","「连假结束。宫城你不去打工吗？」","「不要。」","「还是你想加入社团？」","「没兴趣。我才想问仙台同学，你不加入社团吗？」","「不要。我想把时间用在其他地方。」","上大学后交到的朋友都异口同声地说「这个社团不错」、「那个社团也很好」。仿佛社团和大学是成套贩售的商品，时常听人提起。也有朋友问我：「叶月你想参加哪个社团？」然而，我既不想拓展交友圈，也没有什么热衷到想找一群同好共同完成的事。比起社团，把时间花在打工上更有意义。如果宫城在家，我也比较想把时间用在和她一起吃饭。","「我以为仙台同学上大学后会加入社团或参加联谊，过着那种感觉很像大学生的生活。」","「我看起来像那种人吗？」","「……因为仙台同学你以前会看茨木同学在看的杂志，也会跟她一起玩。我以为你上了大学也会那么做。」","「原来如此。」","「而且你黄金周好像也会跟朋友出去玩。」","「不会。我会待在家里。」","「为什么要待在家里？」","宫城用极为认真的表情询问。","「问我为什么……我也不知道耶。」","因为宫城在，所以我会待在家里。","原因就这么单纯，可是仔细想想，这个答案很奇怪。我和宫城的交情没有好到会一起出门，也不会积极地与对方共享时间。只有我单方面想找她出去玩，和她共度时光。宫城则偶尔会愿意配合我。","我将差点逸出口中的叹息吞了回去。","「宫城连假期间不会回老家吧？」","帮她打耳洞那天，我问过她连假期间有没有空。","可是我没问她是否有其他安排。","「之前就说过了，我不会回去。」","「你没有打算和老家那边的朋友见面吗？」","「黄金周没有。」","「那就没有其他安排了吧？」","「我会跟舞香出去。」","果然。","我差点脱口而出。","如果她有什么行程就是和宇都宫出去。","我原本就是这么想，所以叹了一口气。","「既然你会和宇都宫出去，那也跟我出去玩嘛。」","「我跟舞香出去就够了。再说我跟仙台同学根本喜好不同啊。」","宫城答得干脆。她之前也说过死都不要跟我出门。","对象是宇都宫就可以，却不愿意跟我出去。","这个回答让我很不舒服。","不仅没意思，还有点反胃。","「是没错啦。」","即使喜好不同，我还是有想跟她一起去看看的东西。","现在被头发遮住了看不见，不过宫城戴着我帮她打耳洞时配戴的耳环。但那不是我挑的。可以的话，我希望她能戴我挑的耳环。既然那是为了让我想起约定的象征，戴我挑的比较好。我想和宫城一起去找更适合她的耳环。","然而，我很清楚她绝对不会跟我一起去看耳环。","「宫城，你生日是什么时候？」","就算当成生日礼物，她大概也不会收下。但我还是问了。","「干嘛突然问这个？」","「只是想到我好像不知道你的生日。」","「九月。」","「月份我原本就知道。是九月几号？」","收到项链的那一天，我就知道宫城的生日在九月。只是不知道更详细的日期。","「……我现在不想说。」","或许是有什么不好的预感，宫城皱起眉头。","「那你之后再告诉我。」","「看我心情。」","宫城冷淡地回应，视线落在漫画上。","理所当然地坐在我身边，态度却这么冷淡。","「现在戴的耳环是宫城你自己挑的吗？」","「我和舞香一起去买的。」","今天的宫城只会告诉我一些无聊的资讯。","我想和她聊天，想聊更开心的话题。不是为了听一些不想知道的事情才找她说话。","「你把头发拨到耳后啦。」","宫城低着头看漫画，我拉了下她的头发。","「为什么？」","「因为看不到耳环。」","「又不需要让你看。」","「耳环是为了让我看才戴的吧？」","「现在又没有约定。」","「我们不是约好黄金周要空一天出来吗？」","那大概不是需要靠耳环维系的约定。","但我想确认她有没有戴耳环。","一般在耳洞定型前都不会拿下耳环，所以她现在应该也戴着。尽管如此，我还是想亲眼确认耳环有戴在宫城的耳朵上，戴在我打出的耳洞上。","我能理解高中那时宫城想要确认项链的心情。同样的，我也想确认宫城的耳环。","「让我看耳环嘛。」","我把手伸向宫城的右耳。虽然一脸埋怨，但她没有逃开，任凭我将黑发拨到耳后。","银色的耳环映入眼帘。","我帮忙戴上的那个耳环，仿佛是一种宣告宫城是属于我的印记。我知道耳环没有那种含意，但宫城要求我帮她打耳洞，还有我亲手在宫城的耳朵上打洞、戴上耳环这件事，让我觉得那是非常特别的东西。","我朝耳环伸出手，又突然停下。","虽然想摸，但现在去摸刚打耳洞的地方不太好。这让我有些迟疑。","「看够了吧？」","宫城想把拨到耳后的头发回复原样，但我抓住她的手，像打耳洞那天一样吻上她的耳朵。","宫城以前也对我做过类似的事。","她吻过吊坠，也摸过好几次。","「仙台同学——」","宫城的声音从很近的地方传来。","我让舌头滑动，小心地避开耳环。","舌尖贴着软骨。","有点冰凉，又有点硬。","我将舌头抵上去，试图把自己的体温传递给她。","宫城的肩头微微颤抖。","不晓得是什么时候握住的，但她的手用力抓紧我的手臂。","我又吻了一下她的耳朵。","一次、两次。","第三次吻在耳环上。","「那边会痛，不要。」","宫城推开我。","我乖乖退开并观察她的表情，不像真的很痛。","「我会挑不会痛的地方。」","我用嘴唇轻轻碰触她耳朵偏上的位置。","宫城又动手推我。","「仙台同学，放开我啦。」","我将嘴唇用力贴上去，拒绝听从她的要求。宫城的手碰到我的下颚一带，顺势用力一推，让我的身体稍微后仰。我正想抓住她那只粗鲁的手开口抱怨时，宫城把我拉过去。耳垂开始发热。","好痛。","非常痛。","坚硬的东西夹着我的耳垂。","那是宫城的牙齿，简单来说就是我被咬了。她在这种时候不会手下留情，现在也狠狠咬上来，让我的耳朵又痛又热。用这种方式来对我做出的行为表达抗议未免太粗暴了。就算耳朵被咬下来我也不意外。","耳朵渐渐失去知觉。","应该像宫城刚才做的那样推开她。","我非常清楚。","我很不对劲。","把手臂伸到宫城背后。","将她搂过来抱住。","夹住耳朵的东西消失，痛楚也跟着消失。","宫城在我怀里。在离我非常近、相当近的位置。她的体温从我们身体紧紧贴住的部位传来，让我还想靠近。然而，我没办法再接近了。我被推开了，和宫城拉开一定的距离。","「这是怎样？你希望我再多咬几下吗？」","宫城看似生气地说。","「如果我说是呢？」","「仙台同学果然是变态嘛。」","明明不需要继续推了，宫城却用力推开我的肩膀，拉开距离。她从鸭嘴兽背上抽出一张面纸，擦拭自己的耳朵。","「仙台同学你也擦一下耳朵。」","宫城把鸭嘴兽推过来。","我很高兴她有想到我的耳朵，同时也希望她既然会在意就不要咬我。","我把手伸向失去一半知觉的耳朵，途中又作罢，抽出一张面纸。打苦情牌八成不管用，所以我没向她本人抱怨，乖乖地擦拭耳朵。","「连假的时候要做什么？」","宫城小声问道。","本来以为宫城会马上回房间，她却继续坐在我旁边，只是不肯转过来。","「你想做什么？」","「为什么要问我？仙台同学不是说要先想想吗？」","「我想听听看宫城的意见。」","「……既然这样，那个。」","宫城说着便指向桌面。","「平板？」","这个房间里少了一些搬家前存在的东西，也多了一些以前没有的东西。其中之一就是桌上的平板。在这个没有电视的房间里，它被我当作电视的替代品。","「对。我想用那个来看电影或其他影片。」","这个主意不错。","应该说我也想不到其他不出门就能做的事了。","「在我房间看吗？」","「可以，但你不准做奇怪的事。」","「我不会啦。」","「你刚才就做了啊。」","「我跟你保证，绝对不做奇怪的事。」","听我如此断言，宫城转向这边。","我再次将宫城的头发拨到耳后，看着耳环。","耳环是我改变了宫城这个人的证据。","那个变化微乎其微，只是多了个小饰品，有些人搞不好根本不会发现。尽管如此，它对我来说仍是一件印象深刻的事。","我这个人对宫城的外型造成影响。","以能够永久留存的形式。","无论是什么样的约定，我都不可能忘记。","「仙台同学，不可以毁约喔。」","「放心。我不会毁约。」","我轻轻触碰耳环，然后用头发遮住宫城的耳朵。","如果只是想让我记住约好的事，她明明可以写在纸上交给我，或贴在我的房门。宫城却没有那么做，反而刻意选择将约定与耳环串连在一起。所以我不会毁约。","可是我想违反规则，让她再对我下令。","我绝对不会告诉宫城，但还是忍不住产生这个念头。","然而，我会遵守刚刚订下的约定。","「不做奇怪的事」这个约定应该也适用于「在我房间里看电影」这件事。宫城没有明说，但我是这么认为的。","「宫城。你先想一下要看什么电影喔。」","我拍了拍鸭嘴兽的头。","天气很差。","进一步补充，大雨从早上就下个不停。","大部分的人应该都在抱怨连假期间为什么下大雨，可是这跟待在家里的我无关。要说有什么问题，那就是用平板播放的电影太无聊了。","「你觉得这部电影好看吗？」","我询问一旁认真盯着画面的宫城。","「满好看的。」","「哪里好看？」","「嗯……很多地方都好看。」","宫城的回应不算有回答到问题。","我不太了解的角色在平板上动来动去。宫城一直看着他们。即使开口搭话，她也不会转头看我。","用平板看电影。","对于缺乏共通点的我们来说，这个由宫城提议的连假活动再合适不过。问题是我们缺乏共通点，想看的电影天差地远。之前是我叫宫城决定想看的电影，所以对选片没有怨言。是我把选择权交给宫城的。","可是我应该能提出一点意见。","这部电影似乎是从游戏改编，开头很有趣，可是中途开始就不晓得在演什么了。我很难判断是不是因为自己没玩过游戏才觉得内容无趣。","「宫城，你觉得哪里好看？」","我伸手戳了戳近在咫尺的宫城。我们的肩膀近到几乎要碰在一起。","宫城不发一语，没有任何反应。","这点也很无趣。","老实说我已经受够这种状态了。","有够无聊。","还好这里是我房间。如果是在电影院，我就算觉得无聊也不能出声搭话。","「喂，宫城。」","我活用在自己房间的优势，又戳了她一下。这时，宫城把手伸向平板，停下持续播放的影像。","「仙台同学，你从刚才就很吵耶！不看电影就算了，安静一点啦。」","按下暂停键的那只手推了我的肩膀一把。","没有很用力，只是轻轻推一下，所以她应该没有生气。可是她的语气低沉，还露出厌烦的表情。电影好看到让她不想被打扰是好事，但宫城愈觉得有趣，我愈觉得无趣，非常不平衡。想让这段与她共度的时光充满「开心」非常困难。","「你想喝什么？我去拿过来。」","为了转换心情，我站了起来。","「……汽水。」","她用平板的语气回答。","「好。你可以继续看，不用等我。」","我走出房间，打开橱柜并拿出玻璃杯，然后叹了一口气。","早知道就该夺回电影的选择权，不顾宫城的意愿，挑一部恐怖片来吓吓她。最好让她晚上不敢一个人待在房间。虽然我不认为宫城会乖乖看恐怖电影，但我真的应该那么做。","「……要是真的做了那种事，不是被咬就是被踢吧。」","我从冰箱拿出柳橙汁和汽水，倒进玻璃杯。迟疑了一下是否要直接拿着两个杯子，最后还是选择将杯子放上托盘，走回房间。","「谢谢。」","宫城似乎在等我回来。她按下播放键，看向动起来的画面。","我坐到她身边，没看向画面，而是看着宫城。","连帽外套配牛仔裤。","大概是因为天气不好，气温较低，怕冷的她穿着一身保暖衣物。与穿着罩衫配长裙的我形成对比。","发型和平常一样。","所以今天也看不见她的耳朵。","难得打了耳洞，宫城却不把耳朵露出来。就算我说拨开头发才能看见耳环，她也不听。或许是觉得害羞吧？也可能不是。理由我不清楚，但因为被头发遮住，我反而更想看了。","我朝眼里只有平板的宫城伸出手。","碰到遮住耳朵的头发。","宫城马上嫌弃地挥开我的手。但我再次伸过去，将她的头发拨到耳后。","耳环露出来了。宫城又停下正在播映的电影。","「不要妨碍我啦。」","我没有回应，碰触宫城的脖子。","等我开始滑动指尖，宫城不悦地板起脸孔。","「仙台同学，你过去一点啦。」","她用力推了下我的肩膀，把鸭嘴兽放在我们中间。","「在电影结束前，你的手不准越过面纸。」","宫城说了很无聊的话。","我默不作声。宫城解除暂停，画面又继续动起来。感觉再惹她生气会变得很麻烦。我拿起柳橙汁，喝了大约半杯后放回桌上。","「喂，宫城。」","明明知道她不会回应，我还是尝试呼唤。","她的视线牢牢固定在画面上，看都不看我一眼。","「我想接吻。」","我跟宫城约好不会做奇怪的事。","我不认为这是奇怪的事，但对宫城来说，接吻大概被分类在奇怪的事吧。所以我没有采取行动，只是问问。她应该不至于连说都不准我说。","「宫城。」","因为她不愿意转头，我又叫了一次。","「为什么我非得和仙台同学接吻啊？」","宫城依然盯着画面，用不高兴的语气回应。","「以前有接吻过啊。」","「现在跟以前又不一样，我们是室友耶。」","宫城看过来。","她这话很无趣，可是没说错。","我把鸭嘴兽放到床上，肩膀靠向宫城。","「仙台同学，你很重耶。」","耳边传来冷漠的声音，但她没有推开我。","「宫城你不想接吻吗？」","「不想。」","「我就觉得你会这么说。」","「那你就不要问啊。」","宫城将视线移回画面。","从平板传出许多吵闹的声音，烦死了。","「宫城，命令我啦。现在你不管说什么我都会听。」","「我不要，你也不用听。」","无论我说什么，宫城都会否定我的话。然而，今天这个行为让我松了一口气。即使戴上耳环，宫城依然是宫城。","虽然希望她能有所改变，但我同时也对改变充满不安。我担心过度干涉会害宫城离开这个家。所以她现在逐一否定我想做的每件事，反而令我感到安心。如果她不否定，我会无法克制自己，会想一直靠近。","「仙台同学，你根本没有打算看电影吧？」","宫城把我推开。","我都特地把鸭嘴兽拿到床上了，我们之间又出现了足以将它放在地上的空间。","「我想看，可是这部片太无聊了。」","我关掉平板的电源。","「我还在看耶。」","「看其他电影啦。恐怖片之类的。」","「我死都不要。」","宫城瞪着我，完全没在掩饰内心的不满。明明叫我不准越线，自己却把手伸了过来。虽然鸭嘴兽这个界线不在，她的手还是明显超过原本鸭嘴兽所在的位置。宫城抓住我的衣领，毫不客气地用力拉扯。我按住宫城的手。","「你这样会扯坏衣服啦。」","这件上衣不贵，但我也不想眼睁睁看着它变形。然而，宫城无视我的提醒，再次用力拉扯衣服。因为不希望衣服变形，我只好将身体倾向宫城。","「宫城，放手啦。」","上衣被她的手指紧紧抓住，怎么也扳不开。宫城将脸靠过来，朝我的脖子呼出气息。肩头不禁一颤。她的脸靠得更近，有个温热的东西碰上脖子。","紧贴上来的是嘴唇，皮肤被她用力吸吮。","虽然不像被针刺到那么痛，皮肤还是窜过一股刺痛。","被舌尖碰触的地方湿湿热热的。","宫城不肯退开。","她靠得太近了。","我能听见自己的心跳声。原本应该听不见的。","但它比刚才播放的电影还要吵。","嘴唇更用力地贴上来，更猛烈地吸吮。","痛楚穿透皮肤，在体内深处缓缓扩散。","绝对会留下痕迹。","这不是什么好事。","尽管心里明白，我却想伸手抱住她。无处安放的手不知该如何是好，正打算抚上宫城的头发时，她干脆地退开了。","已经不痛了。","我不晓得脖子现在是什么情况，不过大概预料得到。","「你是笨蛋吗？宫城，刚刚那样绝对有留下痕迹吧？」","「是仙台同学不好。」","宫城不高兴地说，直直盯着我的脖子。","「就算是这样，还是有分能做的事和不能做的事啊。」","我从她那尖锐的视线就能猜到脖子变成怎样，但还是拿起镜子确认。","果然。","喉咙旁边的位置清楚地留下红印。","「宫城，我说你啊。至少挑个看不见的地方吧？这是要我怎么办啊？」","「如果选在看不见的地方，仙台同学就不会反省吧？」","「这不是反不反省的问题。在这么显眼的地方留下痕迹太差劲了吧？」","「仙台同学不是说连假期间哪里都不去吗？既然这样，在哪里留下痕迹都没差吧？」","「可是你会跟宇都宫出门耶？」","「我会出门，但仙台同学就一直待在家吧。」","这么说完，宫城推了我的肩膀。","「宫城也待在家啦。」","「不要。我已经跟舞香约好了。」","宫城的声音硬生生地撞在我的脑门。","不爽、不爽、不爽。","超不爽的。","我又照了一次镜子。","可以清楚看见红色的痕迹。","而且在相当醒目的位置。","我是说过连假期间会待在家，但没说一步都不会踏出家门。之后说不定会有其他安排，也可能会去附近的便利商店，但这下我就没办法出门了。当然可以穿高领的衣服遮住，可是就季节来看，我不太想用这个方法。话虽如此，如果不想办法遮住，就这样带着红色的痕迹出门，我又会被陌生人指指点点。","在路上撞见朋友绝对会被问东问西。如果用「交了男朋友」这个理由试图掩盖，朋友也一定会叫我拿出照片，或是带本人给她们看。所以我不能随便乱说。","宫城真的很矛盾。","嘴上说着不想接吻，却若无其事地对我做出这种行为。普通人才不会在室友的脖子上留下吻痕。创造出这个契机的人或许是我，可是宫城做出这种事，反而让我搞不懂她到底想要跟我发展成怎样的关系了。","然而，提议要当室友的我也不晓得自己到底期望和她变成怎样的关系。始终处于暧昧不清的状态。","可是我想跟她在一起。","我呼出一口气，放下镜子。","把手伸向脖子，抚摸留有痕迹的地方。","「宫城。」","「干嘛？」","她用一副不觉得自己有错的表情看我。","我按着太阳穴，深深叹了一口气。","「……继续看电影吧。」","真受不了马上就原谅宫城的自己。","我重新打开自己关上的平板电源。","结果那部电影很无聊。","我跟宫城果然兴趣不合。","可是比起跟大学朋友约出去，我更想看无聊的电影。然而，她这个举动等同从我这里强行夺走「出门」这个选项，实在不值得嘉许。","半夜，我看着宫城留下的痕迹。","已经过了一段时间，但那抹红色仍清楚地倒映在镜中。","我很清楚。","今天留下的痕迹不可能在一天内消失。","我把镜子放在桌上，身体向后靠着床舖。","使用遮瑕膏或粉底就能让痕迹变得不那么明显。可是我也没有想出门到非得采用那种方法。","「……只能待在家里了吗？」","待在这里就不用特地遮住。","在意宫城留下的痕迹会让「出门」这件事变得很麻烦，我也还没跟朋友约。连假期间宫城不会一直在家，所以我原本也想找朋友出去玩。但我没有什么特别想去或非去不可的地方。至于朋友们，反正等连假结束后，即使不想见，去大学也会碰面。","宫城要跟宇都宫出去玩，我却得一个人留在家里。关于这件事，我当然有很多意见，但待在家里耍废也不是什么坏事。","愈是回想宫城今天对我做的事，心里愈是不满。","仔细想想，从高中时期开始，她总是对我做一些过分的事。","比如为了测试敷柠檬片是不是真的能让吻痕更快消失，在我的手臂留下吻痕。","还有解开我被雨淋得一身湿的制服扣子，在我的胸口留下吻痕。","无论何时，宫城都不会做什么正经事。","但我还是选择和她一起住，待在这个地方。如果把现在的情况告诉去年的我，她一定不会相信吧。","我用掌心用力按住宫城留下的痕迹。","宫城的字典里好像没有「手下留情」这四个字，但刚开始多少有些顾忌。现在可是毫不迟疑。","我让背部离开床舖，身体前倾抱住双膝。","视线移向那只瘫在桌子底下的鸭嘴兽。","当初，背上长出面纸的那玩意儿是作为两人的共用物品被买回来，可是在我心中那就是宫城的东西。大概是因为跟她房里的鳄鱼面纸盒套很像，我也自然地接受自己房里出现这种东西。房间里出现更多属于宫城的东西曾经是我的重担，我现在却觉得衣柜里属于宫城的制服和上衣也是构成我房间的一部分。","我起身将首饰盒从衣柜上方拿到桌上，取出宫城给我的项链。","毕业典礼那天，这条取代信封留在我手边的项链没机会登场。","我想触碰宫城，就像还戴着这条项链时一样。","早知道就该趁宫城看电影的时候直接亲上去。","我用手指触碰银色的链条。","目光所及是月亮形状的小小坠饰。","我用指尖确认链条，然后紧紧握住那小小的坠饰。","我不是想回到那个时候，却很羡慕当时的自己。","我把鸭嘴兽拉过来，将项链戴到它头上后滚上床舖，敲了敲墙壁。","这一下敲得不算大力，没有得到回应，但隔壁传来一些声响。在这宁静的深夜，我不用竖起耳朵也听得出那是开门声。","我在床上坐起身。","犹豫着要不要去共用空间。","我也不是有话想说。","该怎么办呢？我思考了大约一分钟，然后站起来。幸好有买用来当睡衣的休闲服，我可以轻松踏进共用空间。","打开房门，外头的灯还亮着。宫城站在冰箱前面，身上是眼熟的休闲服。应该说是我寒假借宿她家时，她借我穿的那套。","「你不睡觉吗？」","我站在桌子前向她搭话，她冷淡地回了句「要睡了，只是想喝点东西」。宫城从冰箱里拿出汽水，倒入玻璃杯，喝下约三分之一的透明液体。","「仙台同学不睡吗？」","宫城单手拿着玻璃杯看向这边。","「我也想喝点什么。」","我给出一个能解释自己为何踏足共用空间的理由。","「要我帮你拿柳橙汁吗？」","「嗯……我喝宫城在喝的那个就好，分我一口。」","「这是汽水喔。」","「看就知道了。」","「……那剩下的都给你。」","宫城说完便走来这边，把玻璃杯递给我。","「我没有要喝那么多耶。」","我既没有口渴也不喜欢汽水。因为一个胡诌的理由就把还剩半杯以上的汽水塞过来，我也很伤脑筋。可是说想喝的人是我，姑且照自己说的喝了一口就打算把玻璃杯还她。可是宫城不肯拿。无奈之下，我只好喝掉半杯汽水，将玻璃杯放到桌上。这时，宫城开口了。","「仙台同学，你明天要出门吗？」","被她这么一问，我平静地回答。","「拜某人所赐，我就算想出门也不能出去啊。」","「是喔。」","明明是她自己主动询问，现在却显得兴趣缺缺。这么说完，宫城拿起我放在桌上的玻璃杯，喝光剩下的汽水。留下一句「我去收拾」就打算走去洗杯子。","「不多聊一会儿吗？」","我抓住宫城的手臂。","「我没有什么好聊的。」","「没有也可以聊啊。」","我拿走她手里的玻璃杯放到桌上。","朝宫城靠近一步。","伸出手，用指尖触碰她的嘴唇。","「你不是说要聊天吗？」","宫城皱起眉头，明显很不高兴。可是她没有逃开，我于是放开她的手臂。","「宫城你说点什么啦。」","「是仙台同学说要聊天的耶。」","「是吗？」","我抚摸宫城的脸颊，将掌心紧紧贴上去。","她多半知道我想做什么，现在应该要立刻逃走。","「宫城。」","就算我出声呼唤，她也不为所动。","记忆和高中时期重合。","回到校庆后，我找她过来的音乐准备室。","我把在我不知道的地方充分享受校庆的宫城叫出来，抓住她的手臂。然后对她说：「如果不想被亲就逃走吧。」","那时，我明明没打算接吻却突然想吻宫城，触碰了她。","跟现在的状况说不上完全相同，但我觉得很类似。","我把脸凑向宫城。","她什么都没说，好像也不打算闭上眼睛。我只好主动闭眼。","接着，双唇交叠。","柔软又温暖。","是我熟悉的嘴唇触感。","不过也许是太久没接触了，我的心脏仿佛生出毛病似的剧烈跳动，脑袋变得一片空白。光是嘴唇相碰就让我好难受，忍不住退开。接着又立刻吻上去，这次更用力。我抓住宫城的手臂，顺势拉向自己。她甩开我的手，用手推着我的肩膀。","不够。","还想再跟她接吻。","我抓住她的手。","又被甩开，这次被踢了一脚。","「你为什么没有逃？」","我希望她逃开的时候，宫城没有逃。本来觉得她一定会逃走，宫城却干脆地接受了。如果她在接吻前逃开，我就不会冒出「还想再接吻」这种念头了。","「……我只是想测试仙台同学到底是不是骗子。结果你果然是。约好一起看电影时，你明明说自己不会做奇怪的事。」","「那是说在『我房间里』不会做啊。」","「我就是讨厌仙台同学的这种地方。」","宫城忿忿不平地说，用比刚才更强的力道踢了我脚踝上面一点的位置。","「这一下很痛耶。」","虽然没用全力，她还是用不小的力道踢我。见我出声抗议，她又朝同样的位置踹了一脚。","「我要回房间了。」","宫城转身背对我。","如宣言般走向房间。在宫城跨出第三步时，我出声叫唤。","「宫城，你明天打算做什么？」","「跟舞香出去。」","「天气预报说明天会下雨耶。」","原本背对我的宫城突然转过来。","「仙台同学果然是骗子。我刚才看天气预报，上面说明天是好天气。」","她反驳了我随口说说的天气预报。","「那说不定是我看错了。你后天有空吗？」","「……有是有。」","「我们再一起看电影吧，毕竟我因为这个痕迹哪里都去不了。」","我摸着脖子，对她粲然一笑。","害我无法出门的主因是宫城制造出来的，所以她应该要负起责任。如果不陪我消耗这些多到有剩的时间，我可就伤脑筋了。","「先说好，我绝对不看仙台同学喜欢的电影。」","「没关系呀。」","我依然面带笑容。宫城用我今天听到的发言中最不高兴的语气说了声「晚安」。","〔本话含插图〕"]},{"t":"第6话　不想让仙台同学看到","p":["仙台同学什么都没变。","无论是深夜接吻后的隔天、今天早上，还是吃完午餐后，她的脸上都挂着和接吻前同样的表情，并用同样的语气说话。","当然，我也没变。","我们只是久违地做了从前做过好几次的事情。","仙台同学至今对我做出的那些行为，我都没有真的很抗拒。我不排斥这次的行为，所以没有阻止，她也不需要接受惩罚。","可是仙台同学打破了约定，态度却一如往常。我对这件事颇有微词。","明明是仙台同学要我和她当室友的。","虽然约好等下要一起看电影，可是感觉她又会打破「什么都不会做」的约定。这让我无法静下心。","我把手伸向耳朵。","用指尖触摸耳环。","我也可以叫她向这个小小的饰品发誓，说她不会打破约定。可是我不太想让仙台同学看我的耳朵。","我把镜子放到桌上，将头发拨到耳后。","看着倒映在小型立镜里的耳环。","耳洞大概经过一个月才会定型。","不能拆下耳环。","我也不是想早点换新的耳环，只是仙台同学说了「很适合」、「很可爱」那些奇怪的话，害我很在意这副耳环。想把耳环藏起来，不给她看。","仙台同学总是说些无关紧要的话。","我把拨到耳后的头发回复原样，然后看向时钟。","快到和仙台同学约好的时间了。","打算收起镜子时，我注意到嘴唇。","这让我想起前天仙台同学摸着我脸颊的手很烫。她迟迟没有闭上眼睛，眼神格外认真，碰触我的嘴唇也相当柔软。这些事跟着从记忆深处被翻出来。","我用指尖抚过嘴唇。","不久前，我也有像这样抚摸嘴唇。","伸手去抹说要帮我化妆的仙台同学的嘴唇，也像今天这样照了镜子——","我的视线被眼前的镜子吸住。看到镜中正用指尖触碰嘴唇的自己，我下意识用手遮住镜面。","「啊！」","攀上皮肤的冰凉触感令我心生悔意，连忙把手挪开。镜面上已经清楚地沾上指纹。","「啊～真是的。全都要怪仙台同学。」","我起身走出房间。","站在仙台同学的房间前吸气、吐气，并敲了两下门。里头传来「请进」的声音。我又做了一次深呼吸，打开房门。","「你还是来了啊。」","仙台同学背靠床舖坐着，有点意外地这么说。","「不来比较好的话，我立刻回房间。」","我知道她没有要赶人的意思，却还是转过身。房门关上前，我又听到她的声音。","「进来啊。」","听到那柔和的语调，我转头看见仙台同学站了起来，浅色的裙摆随之摇曳。","她经常穿裙子，但我几乎不穿。","搬来这里后，仙台同学虽然有叫我穿裙子，可是就那么一次，后来没有再说同样的话。她总是随意说出让我难以对应的话。","「我还以为你不会来……原来宫城不会因为那种程度的事离开，还是愿意来我房间啊？」","仙台同学提出莫名其妙的质疑，然后抓住我的手臂，将我拉进房间。","「你说『不会离开』是什么意思？」","「没关系，听不懂就算了。」","仙台同学笑着带过这个话题。","我很在意她是基于什么理由提出这个问题，打算再反问她一次。但仙台同学好像想夺走我的发言权，她抢先开口：「电影可以选你喜欢的。」接着补上一句「拿去」，把平板递给我。","我只好在她身旁坐下。","半边的身体刺刺的。","靠近仙台同学的肩膀和手臂仿佛有电流窜过，让我静不下心。只有半边身体变得敏感，好像能感受血液的流动。我挪动身体，稍微远离她。","「碰到我就要接受惩罚喔。」","我把套着鸭嘴兽盒套的面纸放到两人中间，然后将视线投向平板，思考接下来要看什么电影。这时，隔壁传来她异常开朗的声音。","「宫城想的惩罚大概无法当成惩罚喔。」","「那是怎样？你这话是什么意思？」","我从平板上抬起头，看向仙台同学。","「只是提醒一下。让你知道惩罚对我来说或许是开心的事。」","「我没打算用仙台同学会觉得开心的事情来当作惩罚。」","「意思是你要用不开心的事情当作惩罚？」","「当然。」","见我如此断言，仙台同学轻轻拍了下鸭嘴兽的头。","「宫城觉得不开心的事可能跟我想的有出入喔。」","她这么说是想逃避惩罚吗？","我无从得知这番话是否有其他意思，可是如果我觉得不开心的事，对仙台同学来说反而是开心的事，事情就严重了。","至今为止，那些一般人会拒绝的命令，仙台同学都照做了。无论是命令她舔我的脚，还是要她蒙住眼睛，仙台同学都没有拒绝。就算她真的认为惩罚是开心的事情也不是不可能。","「仙台同学真变态。」","「我又没说或做什么会被当成变态的事。」","「你现在绝对在想什么奇怪的事情。啊，一定是色色的事情吧？」","她是个会突然说想接吻，被拒绝后又在当天晚上跑来吻我的人。即使她在想什么更过分的事情也不奇怪。","「我没有在想什么色色的事情喔。」","仙台同学感觉很刻意地做出笑容。","如果能窥看她脑子里到底装了什么，我还真想看看。","就算她笑咪咪地说自己没想什么奇怪的事，我还是无法相信。","「绝对是骗人的。仙台同学明明是个大色魔。」","「不要那样说，讲得好像我只会想色色的事情。再者，说我一定在想色色事情的宫城才色。如果没在想那种事，根本不会想到要说这种话吧？」","「我才没有想。仙台同学你这个变态、色胚。」","我把平板放在地上，抓起鸭嘴兽，并用不小的力道拍打仙台同学的手臂。鸭嘴兽软绵绵的身体一次又一次地撞上仙台同学。她轻声笑了。","「抱歉啦，我刚刚是开玩笑的。你挑电影吧。」","「拿去。」她又把平板递给我。","我瞪了仙台同学一眼，看向画面中显示的几部电影名称。","我之前挑了一部仙台同学看到一半就腻了的电影，惹出一堆麻烦事。所以今天打算挑一部她会乖乖看到最后的片。话虽如此，我也不想挑仙台同学会看得很开心的恐怖片。","脑中浮现几部电影。","我从中挑选一部曾经在电视上多次重播、不管大人小孩都很喜欢的动画电影并说出片名。然后这么问：「你有看过吗？」","「没有，可是宫城看过了吧？」","「看过，但我很喜欢这部片。」","我找到那部想看的电影，开始播放。","旁边的仙台同学令人在意。","靠近她的肩膀和手臂果然有股触电发麻的感觉。","像先前一样，仙台同学把我们之间的鸭嘴兽拿到床上。","「好好看电影啦。」","这么说完，我稍微和仙台同学拉开距离。但她又凑了过来。我用力拍打仙台同学的手臂，她只简短回了一句「我会看」，并抓住我的手。","她只是轻轻握住，所以不会痛，我的手臂却像静电一样。我下意识想抽离，但仙台同学用力地握住我的手。","「没事的，我会好好看电影。」","仙台同学说着似是而非的话。","「你不喜欢的话我会放开。」","她小声地补上一句。","算了，不过是手。","如果是这种程度，顺着她也不是不行。","虽然没有回握，但我让她这样握着，将视线挪回平板。","二十分钟、三十分钟。时间逐渐流逝。","手就这样牵着，没有放开。","仙台同学有遵守她会好好看电影的约定。","选这部我已经看过好几次的电影或许是个错误。","半边的身体很在意近在咫尺的体温。","我将视线固定在平板上，专注于电影。","随着时间经过，电影的高潮场面过去，画面上跑过片尾的致谢名单。","仙台同学一直盯着画面。","尽管她在途中跟我说了不少话，却没像之前那样说些跟电影无关的事。真要说有什么问题，那就是原本存在于我们之间的距离几乎消失了。","仙台同学现在坐得很近，我们的肩膀几乎快碰上了。","刚开始看电影的时候没靠得这么近。","应该更远一些。","「我几乎没在看动画，但这部片很好看。」","电影播映完毕，仙台同学轻轻地把肩膀靠过来。手臂和手臂紧紧相贴，接触的部分感官变得更敏锐。","仙台同学的距离感很奇怪。","不用靠这么近也能说电影的感想，我希望她可以再离我远一点。","「那就好——可是你要维持这个姿势到什么时候？」","我抬起被她牵着的手。","「到宫城叫我放开为止。」","「那你放开。」","话音刚落，她便用会令人吃痛的力道紧紧握住我的手。","「仙台同学，放开啦。」","「你这么讨厌被我碰吗？」","紧紧贴住的手臂退开了。","可是她没有放手。","只是放轻力道。","「为什么突然这么问？」","「如果你觉得讨厌，我想知道原因。」","「仙台同学被我碰到也不觉得讨厌吗？」","我没回答仙台同学的问题就提出一个新的问题。她依然面带微笑地开口：","「我看起来像是讨厌吗？」","「……不像。」","「那这次换宫城你回答我的问题了。」","握着我的那只手加重力道，好像在催促我回答。不至于会痛，但散发出一股不容逃避的氛围。","「不讨厌，可是……」","无奈之下，我这么回答。「可是？」她又催我继续说下去。","「可是你现在先放开我啦。」","我不讨厌她的碰触，也觉得如果只是牵手就无所谓。可是一直牵着会让我静不下心。看电影时，我还能把心思放在平板上，不去介意牵住的手。但电影播完了。","手也该放开了。","可是她还牵着我的手。这让我坐立不安，好像心脏后方藏了些什么。","「仙台同学。」","我抗议似的叫了一声。","「知道了知道了。」","那个语气充满无奈，仿佛能听见叹息。同时，她也放开手。","我握紧又张开重获自由的手。","即使反复握拳，我还是不觉得这是自己的手，简直就是别人的手。直直盯着掌心时，旁边传来仙台同学的声音。","「电影看完了，但要不要做点别的事？毕竟还不到吃饭时间。」","「我要回房间了。」","我说完便打算起身，可是仙台同学抓住我的衣摆。","「再多待一下嘛。」","上衣的下摆被她用力抓住，稍微拉长了。","虽然可以就这样硬是站起来，但制造出一件下摆拉长的上衣可不好玩。我选择重新坐下，责怪仙台同学。","「放开啦。」","「宫城刚刚说碰到你就要接受惩罚，不用惩罚我吗？」","「不用。放开我。」","「宫城害我的黄金周泡汤了耶。」","仙台同学放开我的衣服，指着自己的脖子。","指尖前方是我留下的红色印记。","昨天也在。痕迹变淡了，但到今天仍未消失。","「再稍微陪我一下也不为过吧？」","仙台同学用令人烦躁的笑容看着我。","「……要干嘛？」","「我想想。帮宫城化妆如何？」","「不要。」","「不好吗？我绝对会帮你画得很可爱，头发也会弄成可以清楚看见耳环的造型。」","仙台同学伸手碰触我的头发，打算顺势将它拨到耳后。这时，我挥开了她的手。","「都说不要了。别碰我的头发。」","这话说得比想像中还重，连我自己都吓了一跳。眼看仙台同学的笑容差点僵住，我又补上一句「抱歉」。","我不是不希望她碰我的头发。","只是不想让她看见耳环。","可是我不想说出这个原因。","房里的气氛仿佛有一半降到了冰点，令人不知所措。当我无所适从地打算起身时，仙台同学用开朗的语气说道：","「我不会碰你的头发，可是让我帮你化妆嘛。淡妆就好。」","我知道仙台同学是在顾虑我，所以很难开口拒绝。话虽如此，我也不想让她帮我化妆。","我抱住双膝，说出妥协方案。","「做点其他事啦。」","「那你当一下我的换装娃娃。」","「换装娃娃？是要我穿仙台同学的衣服吗？」","「对。我会挑选适合宫城的衣服，你穿一下嘛。」","「为什么你只会说这种奇怪的话啊？」","我不是什么都想拒绝，可是仙台同学的提议全部让人难以接受。我希望她能提出一些像样的方案。","「做宫城想做的事也可以啊。你有什么主意吗？」","「……没有。」","「那听我的也没差吧？如果没有其他想做的事就从『化妆』和『换衣服』中选一个吧。」","虽然不想变成她的玩具，但我似乎没有两个都拒绝的选项。为了增加新的选项，我试着想了下自己想做的事情。然而，我实在想不到自己在这个房间里有什么想做的事。","如果是和舞香在一起，我不用特别做什么就能让对话延续下去，天南地北地聊些无关紧要的琐事来消磨时间。但我和仙台同学之间不存在能够让对话延续下去的共通点，根本不晓得这种时候该怎么做。","唯一明白的就是不管化妆还是穿上仙台同学的衣服，我都不想被她看见。无论选择哪一边，仙台同学绝对会说些什么，所以我不想让她看。","「宫城无法决定的话就由我来选喔？」","「如果非要选一个，那你借我衣服吧。」","要是选化妆，仙台同学就会碰到我的脸跟头发。就算被碰到耳朵也不奇怪。这么一想，我觉得跟她借衣服来穿还比较好。","——虽然我完全不想当她的换装娃娃。","说到底，我跟仙台同学的体型不一样。","无论是裙子还是裤子，我都很担心腰围部分。要是拉链拉不起来就糗了。再说，我们的容貌也大不相同，我不认为她的衣服会适合自己。","「那就来换衣服吧。宫城，转过来。」","仙台同学伸手拉我的手臂，想让抱膝而坐的我面向她。","「面向哪边都无所谓吧？你赶快把衣服拿出来啦。」","「别说那么多了，转过来啦。」","她又用力扯了下我的手臂，我只好不甘愿地转过去。","「总之先脱衣服。」","语毕，仙台同学一脸理所当然地抓住我的上衣下摆，打算直接掀起。","「等一下。」","我急忙按住她的手。","「嗯？」","「什么『嗯？』啊！我自己会脱，你出去啦。还有先把衣服拿来啊。」","「等你把身上那件脱下来，我就会拿衣服给你。虽然你叫我出去，但这里是我房间耶。」","犯错的明明是仙台同学，她却看着我，一副是我不对的样子。","不管怎么想，她的主张都很奇怪。这里的确是仙台同学的房间，但在一般情况下，没有人会还没准备替换的衣服就叫人先脱掉身上那件。","「这跟是不是仙台同学的房间无关。先拿衣服给我啦。」","我伸手催促，但仙台同学不仅没拿衣服还靠了过来，手从上衣下摆滑进来。","她用掌心抚摸着我的腰。","那只手一路往上爬，碰到了肋骨。","感觉痒痒的。我隔着上衣抓住那只为非作歹的手。","「仙台同学果然只会想色色的事情嘛。」","「我才没有在想色色的事。你赶快脱啦。不脱就不能穿衣服了啊。」","「我死都不要脱。总之你先准备衣服，在我换好之前去外面等啦。」","「不行。如果不想在我面前换衣服，就让我帮你化妆。那样就不需要脱衣服了吧？」","答案从一开始就定下了。","仙台同学总是这样。","明明准备了选项，却不让我做选择。","「仙台同学真令人火大。」","我瞪着异常贴近的她，贴在腰上的手这才从衣服里钻出来。","「宫城，我再让你选一次。化妆跟换衣服，你要选哪个？」","「……随便仙台同学吧。」","「那就选化妆喽。」","这么说完，仙台同学拿出一个具备一定分量的收纳盒，重新坐回我面前。「我会尽量不碰到头发的」。她补上这么一句。","仙台同学面向我，笑咪咪地取出发带。","「宫城，抱歉。因为会妨碍化妆，我要碰一下你的头发喔。」","她一开始就碰了说好会尽量不碰的头发。浏海被发带撩起，两鬓的头发也被拨到耳后。结果耳环还是露出来了。","一点都不好玩。","一旦要化妆，头发多半会碍事，所以我早就料到事情会变成这样。明明只要拒绝并离开这个房间就好，我却没有这么做，所以这是自作自受。尽管心里明白，我还是皱起眉头。","「我一直很想帮你化妆呢。」","耳边传来她雀跃的声音。","和我不一样，仙台同学似乎心情很好。","「那么从隔离霜开始。」","她从收纳盒里取出小小的容器，将类似乳霜的液体抹在我的额头和鼻子。不碰到脸就没办法化妆，所以这也是理所当然，但仙台同学离我好近。视线好像会对上，却没有交会。她带着认真的眼神抹开我脸上的隔离霜。","总觉得坐立不安。","我无所适从地闭上眼睛。她仿佛就在等这一刻，帮我的眼睛周围也涂上隔离霜。","「接下来是粉底液。」","我不晓得她为什么要特地解说步骤。如同宣言，她从收纳盒里取出某个东西，传来喀啦喀啦的摇晃声。接着，我的脸上被涂了应该是粉底液的东西。","总觉得自己成了一张图画纸。","只是加上「隔离霜」、「粉底液」这些听起来很厉害的名称，跟把颜料涂在脸上没什么差别。","因为我只需要安静坐着，要说轻松是轻松，可是也没别的事情好做，无聊得要命。正想开口说话，仙台同学却叫我别说话。在意脸的状况想摸一下，她也叫我不要摸。","不管想做什么都被阻止，我的心情逐渐变得郁闷。话虽如此，我还是乖乖坐着。过了一会儿，仙台同学的手停下来，我于是睁开眼睛。","「可以了吧？」","这么说完，我和一脸认真的仙台同学四目相对。","「接下来才要开始呢。刚刚那些都是事前准备喔。准备。」","「我已经腻了。一直坐着不动很无聊。」","眼看仙台同学又想从收纳盒里拿出什么，我抓住她的手。","「宫城，稍微忍耐一下啦。」","「不要。」","「说什么『不要』，再把脸借我十分钟就好。」","「那五分钟。」","我说完便放开手。仙台同学低声沉吟，先是仔细观察我的脸，再从收纳盒里拿出什么东西，指示我闭上或睁开眼睛。碰到眉毛和眼睛的时候，五分钟早就过了。我又开口说道：「可以了吧？」","「五分钟太短了，根本画不完啊。」","仙台同学出声抱怨。","「可是我们说好了五分钟啊。」","「那再让我帮你画腮红跟唇膏就好。很快。」","我根本没答应，仙台同学却从收纳盒里出取出看似腮红的东西和唇膏，放在桌上。","跟她争执只是白费功夫。而且事到如今就算回房间，我的脸也已经被当成图画纸了。","「你要保证那两个画完就绝对不会再画其他的。」","我没叫她对耳环发誓，但仙台同学看了我的耳朵一眼，说了「好」。然后拿起腮红，用比划笔更大的刷子抚过我的脸颊。","她对我做的事情就像在脸上画一张新的脸。这种技术感觉和美术成绩成正比，不是我擅长的领域。我的美术成绩不太好。","「我直接帮你涂唇膏喔。」","仙台同学如此宣告。","可是碰上我嘴唇的不是唇膏，而是她的指尖。手指轻轻放上唇瓣，缓缓滑动。","从下唇的正中央到嘴角。","缓缓地沿着我的嘴唇移动。","这种事情以前也发生过好几次。","仙台同学不会随意触碰我的嘴唇，她绝对另有所图。","我感觉自己的心脏一紧，按住她的手臂。","「你是要涂唇膏吧？」","指尖没有抵抗地离开。唇膏取代仙台同学的手指贴上我的嘴唇。","太阳穴擅自跳了一下。","我不太喜欢唇膏。黏黏的感觉很不舒服，我只有嘴唇太干的时候才会用，现在也想马上擦掉她涂上的唇膏。虽然很想推开仙台同学的手，我还是用力握拳忍了下来。","我不想害她分心，搞得嘴唇以外的地方都沾上黏黏的东西。","我的指甲陷入掌心，手开始觉得痛了。这时，唇膏离开了唇瓣。","「完成。你可以把那个拿下来了。」","仙台同学指着发带。","我照她说的拿下撩起浏海的发带。接着，她递来一面手镜。","「觉得如何？」","我在她的催促下照了镜子。","倒映在镜中的是我，却又像是某个不是我的人。","视线移到嘴唇，上面涂着和仙台同学同样的颜色。","我不认为这颜色适合我。眼前的仙台同学明明也有涂，看起来却像完全不同的颜色。","我知道不能碰，但还是用指尖碰了一下。","嘴唇和平时不同，黏黏的。","和有涂唇膏的仙台同学接吻时不甚在意，涂在自己嘴唇上却觉得异常黏腻。这究竟是为什么呢？","「宫城，感想。」","她又开口催促。我不再照镜子，而是看向仙台同学。","「……气色变好了。」","「是没错啦，但你也说一下『变可爱了』嘛。」","「我只觉得很奇怪。」","「才不奇怪。我是抱着『想把你变可爱』的心情来化妆，所以一定很可爱。」","「感觉不太适合我。」","「很可爱啦，我说真的。」","不出意外，仙台同学说出怎么听都像在戏弄我的话。如果她是认真的，应该要去看一下眼科。如果不需要看眼科，那我希望她闭上嘴。那些多余的话里充满我听不惯的陌生词汇，反复强调会让我浑身不自在。","「要我教你自己也能画出这个妆的方法吗？」","我把镜子还给仙台同学。","「不用。我不会画。」","「如果你不打算自己化妆，我可以帮忙喔。」","「不需要。你已经满足了吧？我要去把这个洗掉。」","「等一下啦。难得化了妆，要不要现在出去吃饭？」","「不要。放连假前我就说过不会跟仙台同学出门了吧？而且这个没关系吗？」","我碰了一下仙台同学的脖子。留在她身上的痕迹还没消失。","「……我忘了。」","「还很明显喔。」","其实没有我说的那么明显。","只要有心掩饰应该能遮住。可是如果她说遮起来就能出门，我会很伤脑筋，被她设法遮住也很没意思。最好到连假结束后都不要消失。","「那还是别出门吧。」","「唉～」仙台同学叹了一口气，身体往后靠着床舖。用指尖无法确认位置，但仙台同学还是摸了摸脖子。刚才还能看见的红色痕迹被她的手遮住，我于是抓住那只手。","「干嘛？」","仙台同学好像很惊讶。","「不要动。」","「这是命令？」","「不是。但我刚才听仙台同学的话，让你帮我化妆了。所以你也要听我的话。」","我和背靠床舖的仙台同学四目相对。","拉开抓着的那只手便能看见红色痕迹。","仙台同学没有动。","我用指尖触碰她的嘴唇。","唇膏没像我唇上的那么令人在意。以前被亲吻的时候，我也从未觉得讨厌。","指尖抚过下颚，一路滑到红色痕迹所在的位置。","虽然没有下令，但仙台同学没有抓住我的手。我把脸凑近她的脖子，用嘴唇触碰红色痕迹。这时，仙台同学吞咽了一下。","「连假已经结束喽。」","「我知道。」","所以我不打算在醒目的地方留下痕迹。","解开仙台同学身上衬衫的两颗扣子。","锁骨下面一点的位置。","我将嘴唇贴上去，用力吸吮。","仙台同学的体温透过嘴唇传来，感觉比平常高一些。","「宫城，这样会留下痕迹啦。」","肩膀被她拍打，我于是移开嘴唇。","没像之前那么深，但还是有留下红色的痕迹。","因为是在不显眼的地方，应该没问题。","「仙台同学不讨厌被我碰吧？」","「这已经超过『碰』了吧？」","「是仙台同学太斤斤计较了啦。」","我把脸埋进她的颈项。","咬上刚才留下的痕迹。","轻咬后再用舌头舔舐。","这是我今天最接近仙台同学的时刻。","有股好闻的香味。","即使用了她放在浴室的洗发精，我也不会散发出一样的味道。即使化了妆，我也和仙台同学截然不同。她漂亮又聪明，我就算做同样的事也不会得到和她同样的结果。","我咬上仙台同学的脖子。","稍微用力，让牙齿陷入皮肤。","我不会因此与她同化，但有种更接近她的感觉。然而，耳边立刻传来仙台同学喊痛的声音。我就此松口，舔过留下的淡淡齿痕，吻上她的耳朵下方。这时，她抓住我的手臂。","「这该不会是惩罚吧？」","仙台同学的语气就像突然想到。","「不是。」","「那这是怎样？」","这不是命令或惩罚。","我只想一直在她身上留下痕迹。","耳洞之类的形式也行。可是仙台同学不同意，所以才会变成这样。","「怎样都没差吧？」","进入大学就读，不久后还会开始当家教。","我所不知道的仙台同学不断增加。","在那当中应该能加入一点我的存在。","她不应该跟我计较一个小小的痕迹。","「有差。为什么？」","仙台同学追究起她平常不会追究的事。","可是不管她问几次，我都不想回答。","因为仙台同学会在我不知道的地方做我不知道的事。","怎么可能说出口。即使老实回答，她一定会说这不能当成在她身上留下痕迹的理由。","我用能够强烈感受仙台同学体温的力道贴上舌尖，舔过她的脖子。她的体温果然比平常更高。","嘴唇凑到她的耳朵下方轻轻吸吮，不知道有没有留下痕迹。我又让舌头滑过她的肌肤，吻上耳垂。跟脖子相比，耳垂冰冰凉凉的，感觉很舒服。","「等一下，宫城。再继续下去就糟了。」","仙台同学用力抓住我的手臂。","尽管如此，我还是继续舔舐、轻咬她的耳垂。仙台同学用双手环住我。","「不要这样。」","我轻轻推了下仙台同学。耳边传来她的声音。","「你还想继续对吧？既然这样，也让我做一些我想做的事嘛。」","「放开我。」","她应该有听见，手臂却更用力地环抱住我。","「仙台同学，我不会再做了。放开啦。」","我刚才只有轻推，现在却用力地推开仙台同学，总算挣脱她的怀抱。","「宫城，你不要每次都突然做出这种行为啦。」","仙台同学一边摸着锁骨下方，一边看向我。","「我才不想被仙台同学这么说。」","未经许可就触碰对方的人不只有我。","仙台同学自己也会触碰，甚至吻我。这么一想，不管我做什么，她应该都没资格抱怨。","「宫城。」","仙台同学叫了我一声，然后「唉～」地叹了口气。","「干嘛？」","「下次要不要一起出去吃饭？」","听到这句出乎预料的发言，我下意识回答「好啊」。我不是不想去，可是像这样被诱导回应让我不太高兴。","「那约好了喔。」","在我开口抱怨前，仙台同学就抓住我的手臂。两人之间的距离瞬间缩短。尽管隔着头发，仙台同学的嘴唇还是有碰到我的耳朵。","她明确地吻了一下耳环。","「为什么马上就做这种事啊？」","见我出声责怪，她轻声回了句「用来代替打勾勾」。","「那你可以正常打勾勾啊。」","「反正这副耳环本来就是用来记住约定的，应该没差吧？再说，如果不好好发誓，说不定会忘记约定啊。」","仙台同学说得理所当然，我却觉得不对劲。","「等一下。这样很奇怪耶。这副耳环的功用是让仙台同学记得并遵守我说的约定，不是用来让我遵守仙台同学说的约定。」","「宫城太斤斤计较了啦。」","仙台同学把我的话当耳边风。","重新扣好被我解开的衬衫扣子。","〔本话含插图〕"]},{"t":"幕间　对宫城说的欢迎回来","p":["一手提便利商店的塑胶袋，一手拿新的钥匙。","打开玄关门走进屋内。","「我回来了。」","我有些大声地打招呼，但没有得到任何回应。","家里没人，没有回应也是理所当然。但我觉得很高兴，又说了一遍「我回来了」。","果然还是没有回应。","上大学后，我为了通勤搬来这个「没有家人的家」。这是我长久以来的愿望，现在终于实现了。高中时期，我住在即使说「我回来了」也得不到回应的家里，也接受了这个状况。然而，对着明明有人却得不到回应的家里说「我回来了」，等于在削去一部分的自己。","与父母的快乐回忆。","与姐姐的快乐回忆。","每次对着明明有人却得不到回应的家里说「我回来了」，「过去觉得很快乐的我」便会削减一点。","可是新的家没有东西会消耗我。","在空无一人的家中回荡的「我回来了」竟是如此美妙、愉快的声音。这让我打从心底觉得搬过来真是太好了。来到这里后已经讲过数不清的「我回来了」，可是我还想再讲更多次，想尽情享受家里没有人的事实。","可是大约再过一小时——过了下午两点，这个没人在的家就会变成「有宫城在的家」。","对我来说，那是比搬来「没有家人的家」更令人高兴的事。我也一直期待着宫城要搬来的这一天。","「我回来了。」","我讲不腻似的小声重复，脱掉鞋子。比起与家人同住的那个家，这里的玄关较小，但对我来说刚刚好。穿过短短的走廊，来到共用的开放式厨房。我将从便利商店买回来的汽水和麦茶冰进冰箱，把三明治、柳橙汁和包包放在桌上。坐到椅子上，环顾整个开放式厨房。","共用空间里的家具和家电是我用双方父母提供的钱买回来的。虽然受限于价格和款式，但我自己觉得还不错。我其实想和宫城一起选，但她用一句「交给仙台同学」的讯息就把这些事情丢给我。","算了，这也很像宫城会做的事。","我吃起刚买回来的三明治。","尽管肚子不饿，我还是将有些晚的午餐装进胃里。吃完三明治，正在喝柳橙汁时，手机响了。我从包包里拿出手机。","画面上显示羽美奈的名字，她传来的讯息这么说：『暑假可以去你家住吗？』","我搬来这里后，羽美奈传过几次类似的讯息。","想来我的新住处玩，或是五月连假的时候想碰个面之类的。","手机里不断累积的讯息试图连起还是高中生的过去与现在，却无法打动我的心。可是还不到要冷漠以对，和她们断绝往来的程度。所以我唤回高中时期的自己来回应高中时期的朋友。","『有室友在，可能不太方便耶。』","送出无伤大雅的答复，将手机放在桌上。","我想收到的不是羽美奈的联络或麻理子偶尔传来的讯息，而是来自宫城的联络。她从高中毕业后就很少传讯息。","可是这个心愿没有顺利传达。","这也是理所当然。","她没事不会联络我。","我趴在桌上。","说到「没事不会联络」，姐姐有传过一次讯息。","「唉～」我大叹一口气。","内容毫无意义，只问我是不是搬完家了。所以我也只回一句『搬完了』。","我们姐妹明明已经形同陌路，真不知道她为何特地传讯息。但我也不想知道原因。","我撑起上半身，喝光剩下的柳橙汁。","清空桌上的垃圾后，我觉得该找点事来盖过无聊的记忆，于是打开与宫城的聊天室。","『我还是去接你吧？』","虽然之前问过同样的问题并被拒绝，我还是再传一次讯息。当然，没像我传给羽美奈或麻理子那样马上得到回复。等了大约五到十分钟，一句冷淡的『我可以自己过去』出现在萤幕上。无聊的答案，但很像宫城会说的话。她光是有回讯息就不错了。","「只能等了吗？」","我把手机放在桌上，站了起来。","我的房间和宫城的房间。","两个房间紧紧相邻。我面前有两扇门。","宫城说先搬过去的人可以先选房间，所以我先选了，剩下那间就变成宫城的房间。话虽如此，房间的坪数其实一样，所以选择本身没什么意义。只是用来区别「我的房间」和「宫城的房间」。","我打开「我的房间」的门。","陌生的房间里放着陌生的家具。","尺寸较小的书柜和衣柜。","看起来比从前廉价的床舖和棉被。","这些家具都很简约，但床舖是我自己存钱买的。它是属于我的东西。大学毕业前的这四年，我注定要接受父母照顾。单凭我存的钱无法维持生活所需，所以无法澈底和父母断绝往来。","所以至少——","我希望睡的床舖是靠自己的力量得到。","我不会再回去家人住的那个家了。","买床舖一方面是为了重新加强决心。另一方面，我觉得如果能完全掌握睡的地方就能继续做自己。","我在房间里走一圈，坐上床舖。","映入眼帘的不仅有新买的东西，也有从家里带来的陈旧物品。书、衣服、镜子这些东西就是我从老家带来的。然而，这里缺少一个重要的东西。","——可以存到一百万圆的存钱筒。","那是我高一时买的，一直放在房间，但现在不在这个房间里。这间房子要签约时，我必须用开罐器撬开那个没有开口的存钱筒。打开的瞬间，它就不再是存钱筒了，所以我没有带来。","相对的，我的室友快来了。","「真不敢相信。」","决定房子并签约，在毕业典礼那天把信封交给宫城。","那天，我其实不相信宫城会选择当我的室友。我的做法毕竟强硬，再说对象是宫城，就算被拒绝也不奇怪。","我站了起来，又在房间里绕了一圈。","从今天起，我和宫城会成为室友。想到这点我就静不下心。","我停下脚步、转身，像被关在笼子里的动物一样在房间里漫无目的地绕圈。然后，我走进开放式厨房。","平常的我不会这么坐立不安。","但只要扯上宫城，我就没办法保持平常心。","我看向置于桌面的手机。","宫城没有传讯息。","我转头看向两扇并排的房门。","走近宫城的房间，敲了敲门。","当然没有回应。","我轻轻打开门，看向里面。","空空如也，没什么有趣的东西。","这里是宫城的房间，但家具和搬家纸箱都还没送来，还没真正变成属于她的空间。","「宫城会带什么过来呢？」","我之前每周会去宫城家一到两次，甚至更频繁，所以能回想她房里有什么东西。可是她没说会从那个房间里带哪些东西过来，我就无法想像现在看着的空间之后会变成怎样的房间。","宫城这个人真的很小气。","什么都不跟我说。","那个房间里有我看过好几次的漫画或小说，也有我很期待能看到续集的作品。可是她连那些漫画或小说会不会出现在这个房间都不跟我说。","我将房门关上，没有走进去。","然后盯着放在桌上的手机。","时间没有推进。","宫城没有传『快到了』或是『还要一阵子』之类的联络讯息。","一分钟好漫长。","只有六十秒的一分钟感觉有一百秒、两百秒那么长。一定有人扭曲了时间的概念。我明白即使在房间里走来走去，时间也不会过得更快。尽管如此，我的腿还是自己动了起来，绕了开放式厨房一圈后回到座位，左右摆动。","我最后一次看见宫城是在毕业典礼那天。","自那之后，我一直期待着今天这个日子。事到如今再等个十分钟、二十分钟根本不算什么。但我静不下来，体内总有某个部位在运作。仿佛能看见漫长的时间，没办法乖乖坐着不动。","我停下不断晃动的脚，看向手机。","上网搜寻这个家里缺少的东西放进脑袋。然而，不管我放多少，那些资讯都会立刻从太阳穴掉出去。我敲了敲这个将看过的东西忘个精光的脑袋，做了三次深呼吸。这时，耳朵抽动一下。","我站了起来，好像有听到开门声。","打算走向玄关时，开放式厨房的门被打开。宫城出现了。","我有事先把钥匙寄过去，所以对于她没按门铃就进来这件事，我没有意见。可是宫城没有事先告知自己快到家了。她没有做这种谁都能办到的事情，所以我有意见。虽然知道她是个不会主动联络的人，但至少该传个『我到车站了』或『我到家门前了』吧？然而，在开口抱怨前，我必须先说一句话。","「宫城，欢迎回来。」","宫城穿着我看过好几次的连帽上衣和牛仔裤。我微微一笑，她却露出疑惑的表情。","「『欢迎回来』？不是应该说『欢迎你来』？」","「这里已经是宫城的家了，所以可以说『欢迎回来』喔。」","毕业典礼那天，在宫城没有选择项链，而是选择「信封」的瞬间，这里就是宫城的家了。早在知道自己会先搬过来的那天，我就决定要用「欢迎回来」来迎接她。","「……我回来了。」","我没有要求，但宫城说出和「欢迎回来」成对的话语。","好开心。","我开心到想去窗边对着外面大喊「欢迎回来」。","「我回来了」和「欢迎回来」。","我大概一直在等待这两句话组合在一起。","「欢迎回来。」","我又说了一遍，她也再回一声「我回来了」。我叫宫城放下行李并这么说：「我来帮你介绍房子。」","「这里没有大到需要人介绍吧？」","「是没错，但这是心情问题嘛。」","我对她粲然一笑，宫城把行李放在地上，语气平板地开口：「你想介绍就介绍吧。」","她的态度冷漠也不是从今天开始，所以我不在意。","更衣室、厕所、浴室。","我带她在这间没多大的屋子里绕了一圈，回到开放式厨房。","「这里是结合餐厅的开放式厨房，共用空间的介绍就到这边。然后宫城的房间在那里，隔壁是我的房间。」","「……谢谢。我把行李拿去房间。」","「等一下。先喝点什么吧？有汽水和麦茶。」","「不用。」","耳边传来冷淡的回应，但我还不想放宫城离开。","「我们好久没见面了，稍微聊聊吧。你这段时间还好吗？」","「很好。一看就知道吧？」","「就算是看就知道的事，不问也不晓得是真是假吧？」","「或许是这样啦……仙台同学呢？」","「如你所见，我过得很好喔。」","我笑着回答，对话就此中断。","开放式厨房突然被寂静笼罩。宫城不知所措地拉着连帽上衣的绳子，缠绕在手指。我们没办法像以前那样度过这久违的沉默。我的指尖像在弹琴一样滑过桌面，然后看向宫城。她解开缠绕在手指上的绳子，转身又说了一次：「我去放行李。」","「我一直在等宫城喔。」","我对提着行李远去的背影这么说。","「没有长到需要用『一直』来形容吧？感觉毕业典礼刚过不久。」","宫城头也不回地回应。","「我先过来这边，所以觉得过了很久。记得你说搬家的行李四点会到？」","「嗯。」","「这样啊。」","简短的话语迅速消失，沉默再度降临。","感觉现场的气氛快要僵住，我尽可能用开朗的语调开口：","「宫城，今天开始请多指教喽。」","原本背对我的宫城转过来。","她皱起眉头，然后马上用手指按着眉间小声低喃：","「……请多指教。」","宫城消失在房间。","还不习惯的房间与还不习惯的宫城。","新生活感觉没那么容易，不过我还是打从心底觉得，宫城在毕业典礼那天选择的是信封真是太好了。","〔本话含插图〕"]},{"t":"第7话　我所不知道的宫城","p":["初次见面，请多指教。","稀松平常地打招呼后，又过了三十分钟。我那僵硬得宛如被水泥固定住的身体稍微放松了。学姐说当家教没有想像中困难，但第一次接触的事，无论是什么都令人紧张。","连假结束后，我照预定行程开始当家教。不能表现得像以前教宫城念书时那样。","我不知道可以聊多少和念书无关的事，也不晓得该和学生保持怎样的距离。学姐说只需要表现得像个老师，但我还无法确定老师应该具备的形象就迎来了这天。","「我是花卷桔梗」，刚才这么自我介绍的是个国三的女孩。我的第一个家教学生现在正坐在桌子另一侧紧紧盯着题库，简直快把题库看出一个洞来。","我喝了一口她妈妈端来的麦茶。","好怀念。","放学后，宫城也会帮我准备麦茶。","「老师。」","花卷妹妹抬头看我。","开始当家教前，我从未被人叫过「老师」。这个称呼让我不太自在，总觉得静不下心。","「有不懂的地方吗？」","我看向放在桌上的笔记本，上头满是工整的字迹。虽然我是在这三十分钟内才知道，但花卷妹妹的成绩似乎还不错，不像需要请家教的样子。她妈妈希望我能协助她准备升学考试，可是我觉得不需要太担心。","「我没有不懂的地方，只是想问老师为什么想当家教啊？」","花卷妹妹说话时会直视对方的眼睛。我和她四目相对。","她顶着一头短发，看起来很活泼，说话的语气却非常沉稳。头发和宫城不同，拨到了耳后。身上穿着一看就知道有乖乖遵守校规的制服，这点倒是跟宫城一样。","「嗯……」","我沉吟片刻。","「为了赚钱」，虽然想这么说，但身为老师，这样回答感觉不太好。","「大概是因为我喜欢教导别人吧？」","「老师经常教人功课吗？」","「嗯，会教朋友。」","我不认为这个词适合当作宫城的代名词，但我也不方便在打工的地方说出实情，于是用常见的说法含糊带过。为了避免她顺势问起「朋友」的事，我主动提问：","「花卷妹妹你是会教人功课的那型吗？还是让人家教你的那型？」","「我是让人家教我的那型。姐姐经常教我功课。」","听见不太想听的话，我喝了一口麦茶。","优异的姐姐与还算不错的我。","小时候，我们两个都很得父母疼爱。然而，等我和姐姐逐渐拉开差距，他们就将关爱全数倾注在姐姐身上了。父母的态度也造成我们姐妹俩的隔阂，至今还未消失。","算了。","现在这样也好。","如果家人的态度始终如一，我应该不会和宫城住在一起。","我拿起玻璃杯，将与家人的回忆连同麦茶一起饮下。","「现在没再让姐姐教你了吗？」","「姐姐是体育绩优生，透过保送名额去念住宿制的高中了。」","「这样啊。」","我将空空如也的玻璃杯放到桌上。","我无法透过看似活泼开朗，但好像不擅长运动的花卷妹妹来想像她姐姐是怎样的人。不过这只是无关紧要的小事，缓和房间里的气氛比较重要。","有紧张感不是坏事，可是一直维持紧绷状态会很累。","我和花卷妹妹没有差几岁。","但我不晓得我们有些什么共通点，只能在逐渐缓和的氛围中断断续续地聊着不是很有意义的话题，继续念书。","每周两次，一次九十分钟。","「花卷妹妹的家教」这个身份，我可能还得再花一点时间适应。话虽如此，在我们变得稍微不那么生疏时，九十分钟过去了。今天的家教时间到此结束。","向她妈妈道别后，我走向玄关。","穿上鞋子后，跟我身高相近的花卷妹妹朝这边鞠躬道谢，然后笑咪咪地送我离开。","这么说来，一起生活后，我好像没看过宫城的笑容。她原本在我面前就几乎不笑，可是我高中时有在学校里看过她笑起来的模样。我们现在就读不同间大学，没有那样的机会。但我不禁这么想，真希望宫城也能像花卷妹妹一样在我面前展露笑容。","我顺着先前紧张走来的路折返，搭上电车。","一想到接下来就能回家，我的心情轻松多了。","花卷妹妹的理解能力很强，不需费心。","跟不坦率的宫城大相迳庭。","嗯……坦率的宫城感觉很诡异。","我任凭搭不习惯的电车摇晃着身体，一边想着失礼的事。穿过剪票口，走在一如往常的回家路上。沿着楼梯爬上三楼，打开玄关门走进屋内。宫城的鞋子在门口，人却不在共用空间。","肚子发出细微的咕噜声。","我有跟宫城说自己会晚回家，所以她应该吃过晚餐了。尽管如此，我还是为了问这个不问也知道的事情，敲响宫城的房门。","一下、两下、三下。","宫城走进共用空间。我还来不及看向里面，她就关上房门。","「你吃饭了吗？」","我在她开口前这么问。","「吃过了。」","「吃了什么？」","「泡面。」","宫城用不悦的语气回答。","「你好好煮饭吃啦。」","「有吃东西就好啦。反正只有我一个人。你找我就是要问这个？」","「我要泡茶，你要不要喝？」","这不是我找她的原因，但姑且当作是这么回事。如果她还没吃晚餐，我本来想邀她一起吃。既然吃过了，我只好再找别的理由。","「仙台同学不吃晚餐吗？」","「等下再吃。」","「先吃饭啦。」","「那你出来喝茶。」","眼看宫城打算回房，我拉住她的手臂，让她坐到椅子上。一边用快煮壶烧水，一边打开冰箱。","虽然不是宫城，但我也觉得现在才要开始煮自己一个人要吃的东西很麻烦。","我用锅子烧开水，将奶油炖菜的调理包隔水加热，同时泡茶给宫城。先把白饭盛在盘子里，再把加热过的奶油炖菜淋在白饭上。","白饭和奶油炖菜应该分开吃，可是我今天不想增加要洗的碗盘。第一次打工还是满累的，所以我决定像宫城从前那样，把奶油炖菜淋在白饭上一起吃。","我将奶油炖菜端上桌，回到座位。这时，宫城若无其事地叫了声「喂」，接着开口：","「……你打工地方的学生是怎样的人？」","「是个乖孩子喔。感觉平常就有在念书，人也很有礼貌。」","「是喔。」","宫城一副不感兴趣的样子。","「还有感觉很坦率吧。跟宫城不一样。」","我故意这么说，吃了一口奶油炖菜。咽下嘴里食物后，我看向宫城。她用指尖敲了下桌子。","「因为我在仙台同学面前没必要表现得坦率。」","「那宫城要在谁的面前才会变得坦率？」","「仙台同学以外的人。」","「我就知道你会这么说。」","尽管觉得坦率的宫城很诡异，我偶尔也想看看坦率的宫城。","比如，我叫她让我看耳朵就会乖乖露出耳朵的宫城。","跟花卷妹妹不同，宫城今天也没有露出耳朵。头发太碍事，遮住那个为了让我看而存在的耳环。她在学校大概也不会露出耳朵，但如果是宇都宫说想看，宫城应该会坦率地让她看。","想到这点就忍不住要叹气，我只能将那口气连同奶油炖菜一起吞进肚里。","我又吃了一口奶油炖菜，然后开口说道：","「宫城你难得戴耳环了，就把耳朵露出来嘛。」","桌子另一侧的宫城皱起眉头。","然后，她露出沉思的表情，将头发拨到耳后。","我差点弄掉手里的汤匙，赶紧把汤匙放上盘子。","「仙台同学，你答应我啦。」","宫城走到我身边。","「答应什么？」","「明天由仙台同学负责煮饭。」","「……好啊。你想吃什么？」","我朝宫城伸出手，摸了一下耳环代替约定。","其实我想吻她的耳朵，但现在的宫城跟我认识的宫城好像有哪里不同，让我不敢轻举妄动。","「做仙台同学喜欢的东西就好。」","我在脑中思考菜色，然后这么回答：「知道了。」","要遵守昨天和宫城的约定并不难。","只是煮晚餐，没什么大不了。","可是我决定不了菜色。","我在超市里来来回回绕了好几圈。","宫城说做我喜欢的东西就好，但我脑中没有立刻闪现什么菜色。","「该怎么办呢？」","猪肉、牛肉、鸡肉。","我瞪着在肉品区一字排开的肉类。","这不是该认真烦恼的事情。","我猜宫城那句「做仙台同学喜欢的东西就好」大概等于「随便」，所以做什么都行。可是我也不能做宫城不吃的东西，一直为此伤脑筋。虽然和宫城一起度过满长一段时间，我还是搞不清楚她的喜好。","第一次在宫城家做的晚餐是炸鸡块。","那时，我几乎没在顾虑宫城的喜好，用不了多久就定下菜色。","「……炸鸡块啊。」","宫城吃过也说好吃，是个不会出错的菜色。","我追溯起当时的记忆。","那天，我叫宫城切高丽菜。结果她切伤手指，我还舔了她的血。宫城真的都叫我做一些奇怪的事。在那之后，没有任何一个人叫我舔他们的血。只有宫城会叫我做那种事。","「唉～」我叹了一口气，把飘走的思绪拉回晚餐菜色。","这么说来，我在宫城家吃过好几次即食汉堡排。因为不只一次，我想这应该是她相当喜欢的食物。","我从卖场陈列的肉品中拿了一盒混合绞肉放进购物篮。在超市绕了一圈，追加洋葱和面包粉，然后拿出手机。我不太记得汉堡排需要的食材，总觉得还少了什么。查看食谱后，果然发现缺少几样食材，于是把牛奶和肉豆蔻放进购物篮。冰箱里还有鸡蛋，所以我没多买，直接到收银台结帐。","回家后，我看到宫城的鞋子在玄关，可是人不在共用空间。我走到她的房间前，隔着门说今天会做汉堡排。她很快就回了一句「欢迎回来」，但本人没有出来。","我将洋葱以外的食材放进冰箱，拿出砧板和菜刀放在流理台。然后将洋葱切丁，下锅拌炒。","将绞肉放进调理盆，底下再放一盆冰水，一边降温一边揉捏。加入盐、胡椒、肉豆蔻后继续揉捏。放入炒过的洋葱、泡过牛奶的面包粉、鸡蛋，然后继续揉捏混合。这样持续揉捏绞肉，我都快忘记自己在做什么了。","汉堡排长得一副只要把绞肉搓成一团拿去煎就好的样子，做起来却意外费工。我有点后悔，早知道就买已经将材料混合揉好，只要下锅煎就完成的现成汉堡排。话虽如此，我也不能半途而废。将绞肉捏成汉堡排的形状后，我像电视上的厨师那样双手来回抛掷绞肉，挤出里面的空气。","做到这里，接下来就只剩煎了。我加热平底锅，将汉堡排放进锅里。听着煎肉的滋滋声，盖上锅盖，开始做沙拉。汉堡排快煎好时，我去叫了宫城。她走出房间，默默地帮忙添饭和端盘子。","宫城昨天突然要我答应她一件没有重要到需要对耳环发誓的事。","我不认为「准备晚餐」是需要特别约定才能叫我做的事。","我将汉堡排放上宫城端出的盘子，然后看向她。宫城没有露出开心或高兴的表情。不晓得她到底是怀着怎样的想法叫我做晚餐。","「酱汁呢？」","宫城看着盛装汉堡排的盘子这么说。","「我现在要做。」","我将蕃茄酱和调味酱放入平底锅，稍微加热煮沸。再把做好的酱汁淋在汉堡排上，端到餐桌后就座。","「我开动了。」","我和宫城异口同声地说。","家里没有餐刀，所以我用筷子切开汉堡排。","刚煎好的柔软汉堡排被切下一角，随即溢出满满的肉汁。一看就知道煎出来的成果比我预期中更好。一口咬下，简直跟餐厅里卖的一样好吃，让我忍不住想自夸。可是宫城不发一语。","「好吃吗？」","看着对面默默吃着汉堡排的宫城，我这么问。","「好吃。仙台同学喜欢汉堡排吗？」","「还算喜欢？」","要说喜欢还是讨厌，那应该算喜欢。但我不是因为喜欢才做的，所以给出模棱两可的回应。","「为什么是疑问句？你不是因为喜欢才做的吗？」","「嗯，应该吧。宫城喜欢汉堡排吗？」","我看着宫城，心里想着以后或许可以将汉堡排列入喜欢的食物之一。","「还算喜欢。」","宫城说出我无从判断真假的回复，将汉堡排送入口中。我也继续用筷子切开汉堡排，送进嘴里。","对话就此结束，我们安静地吃饭。","花了不少时间做的汉堡排，只用不到一半的时间就消失在胃袋。","「仙台同学，你等下要做什么？」","宫城放下筷子问道，没有抬头看我。","「为下次的打工做预习。应该说复习吧？我的家教学生是国中生。毕竟过了这么久，国中时学的东西我大部分都忘了，不重新复习感觉有点不安。」","「这么认真啊，明明是打工。」","「就算是打工也该认真面对吧？」","「是喔。」","宫城一副兴趣缺缺的样子，从冰箱拿出麦茶。她也在我面前放了一个玻璃杯，可是杯子碰撞桌面的声音比平常更响亮。感觉她的心情不太好。","「谢谢。」","我的道谢没有得到回应。","她默默地在我对面坐下。","「宫城也去找个打工如何？」","「不要。」","得到冷淡的回复后，对话再度中断。","我从话题的走向能大概猜到她心情变差的原因。","不该提起打工的事。","昨天也是，讲完打工相关的事情，宫城的样子就变得很奇怪。","「……等这里收拾好，我可以去仙台同学的房间吗？」","宫城突然这么说。","毫无脉络可循。","不仅如此，还大有问题。","我等下要为下次的打工做复习。","我应该有这么说。","就算来我房间也只会造成困扰。","「可以啊。」","毫不犹豫的，我脱口说出和内心想法完全相反的话。","「那我来收拾。」","宫城拿着盘子和玻璃杯起身。","太奇怪了。","但我无法拒绝。","可以等宫城回房间后再开始复习。","趁搭电车的时候复习也行。","共用空间里响起洗碗的声音。","我说不出「我来帮忙」这句话。","让宫城进来房间也不是头一遭了，我却非常紧张。","喀擦！喀擦！碗盘的碰撞声格外响亮。起身时，宫城走到我面前。","「收好了。」","「你要来我房间吗？」","「要。」","换作平时，她大概会说「你不想要我去的话，我就不去了」，今天却没有这么说。一起回到房间后，宫城理所当然地坐在我身旁。可是她就只是坐着，沉默不语。或许不打算说话？宫城板着一张脸，把我原本放在书桌的字典拿过来放到自己腿上，开始翻阅。","「到底是怎样？」","我朝主动询问能不能来我房间，来了却不发一语的宫城搭话。","「『怎样』是指什么？」","宫城从字典上抬起头。","「就是你为什么心情不好？」","「没有不好。」","绝对不好。","声音压得很低也不肯看我。","心情差到让人感觉不出是她主动说要来我房间的。虽然吃晚餐时心情也不怎么好，可是现在不高兴的程度跟那时候简直无法相提并论。","「你不是有事要找我吗？」","听我这么问，身边传来更低沉的嗓音。","「没事就不能来吗？」","「没有不能，但既然来了就表现得开心一点嘛。」","「我又没有不开心。」","这种时候，宫城都会变得很顽固。","就算不高兴也打死不肯承认。对话呈没有交集的两条平行线。","她的心情在我不清楚原因的情况下变差并不稀奇。不过是宫城自己要来我房间的，希望她的态度能再软化一些。","「如果没有不开心，你可以笑一下吧？」","我不会要她效法花卷妹妹，但笑一下也不会少块肉吧？我今天不仅履行了她单方面要我做晚餐的约定，也改变原本要复习的计划来陪宫城，所以我应该有权提出要求。","「我有笑。」","宫城答得斩钉截铁，脸上却还是老样子，挂着只能用「不高兴」来形容的表情。","「根本没在笑啊。」","「我有笑……在大学的时候。」","我想也是。","我知道宫城会在这里以外的地方笑。高中时我也在学校里看过好几次她的笑脸。我们二年级同班时，她会在宇都宫面前笑。升上三年级后，我也在走廊上看过宫城的笑容。宫城总是在没有我的地方露出笑脸。想到她现在多半也和那时候一样会在宇都宫面前笑，我就很不爽。","「我的意思是现在、在这里、笑。」","我和宫城就读的大学不同。","如果她不在这里笑，我就没办法像以前那样看到宫城的笑容。反正都要看，比起不高兴的宫城，高兴的宫城当然比较好，能面带笑容的话更好。","「又没什么有趣的事，我笑不出来。」","「只是微笑而已，很简单吧？来，嘴角往上扬。」","我伸出手指按住宫城的嘴角向上推。","她腿上的字典「啪」地一声掉在地上。","这么做感觉会让宫城的心情更差，但我不管做什么都无法影响她，所以根本没差。我用手指在宫城的脸上做出笑容。和硬被我向上推的嘴角相反，她的眉间堆起深深的皱纹，变成了与其说是笑容，不如说有点可笑的表情。宫城抓住我的手腕，把我的手指从自己脸上剥开，一口咬下。","这一下毫不留情，骨头甚至能感觉牙齿的触感。","我反射性地想抽回手指。","可是被咬着的手指抽不回来。","不仅如此，她咬得更用力了。","「宫城，会痛。」","身体因为意料之外的痛楚而僵住。宫城用强烈到让我怀疑她想咬断骨头的力道咬上来，我感觉连太阳穴都开始痛了。","「都说会痛了。」","我拍打宫城的肩膀，试图抽回被当成人质的手指。但她不肯松口。希望她能笑一下的小小愿望，正持续转变为痛楚。","不懂得手下留情这点一如往常，可是今天特别痛。我不知道原因为何，可是她夸张地用力咬住我。","好痛、好烫、开始头晕目眩了。","「宫城！」","我痛得无暇顾及力道，用力拍打她的肩膀。宫城依然不肯松口，这次我伸手去碰她的耳环。老实说我的手指痛到想要就这样扯下耳环，但我只有轻轻拉一下。柔软的耳垂被拉长，夹着手指的牙齿放轻了力道。我顺势抽回手指，牙齿干脆地松开了。","「不要吃人家的手指啦。汉堡排还不够吗？」","被宫城咬过的手指上留下清晰可见的齿痕。","这毕竟痛到她就算说打算吃掉我的手指代替饭后甜点，我都会相信。现在也还在痛。","「真要吃的话，我会找更好吃的东西。」","宫城用不带起伏的语调讲出失礼的话，抽起几张面纸粗鲁地擦拭我的手指。","手指处传来一阵刺痛。","「如果想要我笑，仙台同学就做点会让人发笑的有趣事情啊。」","宫城把方才从腿上掉落的字典放回书桌，看着我这么说。","「算了。不管我做什么，感觉你都不会笑。」","我轻轻抚过那刺痛到连脑袋都开始发麻的手指。即使已经习惯宫城带来的痛楚，我还是忍不住皱眉。","「既然这样，你一开始就别做奇怪的事情啊。」","「我也这么想。是我太蠢，才会试图让一个不想笑的人露出笑容。」","「既然知道了，仙台同学就代替我笑啊。」","宫城伸出手指按住我的嘴角，然后像我刚才对她做的那样将嘴角向上推。她的动作非常粗鲁，简直想把我整个脸颊向上扯，我于是挥开她的手。","「我说啊，刚才硬逼你笑是我不好。但你不仅咬我，还对我做出同样的事情，真的很令人火大耶。够了吧？」","「不够。」","宫城看向我的手指。","那是我刚才被咬的手指。我有种不好的预感，想要缩手，然而为时已晚。有齿痕的手指落入宫城手里。","「会痛啦快放开。」","我把被她紧紧握住的手指往自己的方向抽回。可是宫城不但没有放开，还用要拔下手指的力道猛力拉扯。我不敌痛楚，往宫城那边靠了过去。","「你到底是怎样？」","我维持前倾的姿势这么问，但宫城没有回答。","「有什么想做的事情就说啊。」","见我加重语气，宫城松开我的手指。","相对的，她一把拉住我的衬衫领子。宫城把脸凑近到两人呼出的气息会交融在一起的距离，然后猛然停下。","没有开口。","四目相对后，她瞥开视线。","宫城松开我的衬衫领子，这次换我抓住了她的手臂。","「接下来呢？」","「没有接下来。」","宫城冷淡地说完，甩开我的手，接着退回她刚才拉近距离前的位置。","「没有的话就编一个啊。」","「仙台同学……」","她编织出的字句转眼间就没了下文。","「你把话说完啊。」","「——仙台同学有想要我做的『接下来』吗？」","「如果我说有，你打算怎么做？」","「如果有就拜托我啊。那样的话要我做也行。」","痛觉从刚才一直隐隐作痛的手指上消失了。","我握住宫城的手。","她没有逃走，但也不肯看向这边。","宫城刚才打算做的行为——接下来的动作。","光是意识到这点，我就觉得被咬过的手指发烫。我轻轻呼出一口气。","「既然这样，吻我。」","我对着不肯抬头的宫城这么说。","「你这不是拜托。」","「请你吻我——这样可以吗？」","「可以。」","语毕，宫城靠了过来。","然而在嘴唇相触前，她的动作便停了下来，试图缩回被我握住的手。","宫城在这种时候就很没骨气。尽是对我做出没意义的多余行为，而且做那些事的时候明明会使出全力，真到了紧要关头却这样畏畏缩缩。","「是宫城自己说只要我拜托你，你就会做的。不能反悔喔。」","我在宫城打算逃避前提醒她必须遵守承诺，然后闭上双眼。","宫城的气息逐渐靠近。","她用力回握我的手，碰触我的唇瓣。","很轻，只有短短一瞬间，几乎连体温都感觉不到。","吻完，宫城便退开了。","我睁开眼睛，看见宫城像是在防备一样拉开一段距离。她这个态度让我很不爽。刚才那个吻根本不算有履行约定。","「就这样？」","「对。」面对我的质疑，她冷淡回应。","「再亲一次啦。」","「不要。感觉仙台同学在想什么奇怪的事。」","宫城甩开被我握住的手。明明甩开了，却没有离开我身旁。即使我再次拉近距离，她还是坐在我旁边，没有逃走。","宫城的反应不同于以往，很反常。","换作平常，她早就像野猫一样竖起全身的毛，绝对不会接近我。","「……宇都宫还好吗？」","如果继续保持沉默，感觉宫城会说她要回房间，所以我开口了。因为不晓得该和今天的宫城说什么，我只能从少数的共通点里寻找话题。","「她很好啊。」","「把她带来这边怎么样？」","「为什么我要把舞香带来啊？」","「你们是朋友吧？找她来玩啊。」","「不要。」","意料中的回应。我努力找出的话题被干脆地斩断。","算了，如果她真的找朋友来，我会很伤脑筋。","可是我很想问宇都宫，宫城在大学里是什么模样。她一定知道许多我所不知道的宫城。我也知道宇都宫所不知道的宫城，但不确定到哪个范围才是宇都宫所不知道的宫城。","「宫城。」","我一边寻找对话的开端，一边看向身旁。","「你有跟宇都宫接吻过吗？」","宫城露出狐疑的表情。","可是我想知道。","我很在意宇都宫知不知道宫城的嘴唇有多柔软。","「仙台同学会跟朋友接吻吗？」","「不会。」","「我也不会。」","说不会和朋友接吻的宫城，刚才和我接吻了。那是因为我们顶多算是室友，不是朋友。我们从来不是朋友，但这样也挺好的。","我触碰宫城的脸颊。","即使把脸凑过去，她也没有抗拒。","她不愿意闭眼，所以我主动闭上眼睛，吻了她。","反复好几次，连同刚才连嘴唇的柔软都没能清楚感受的那次一并吻上。","撬开她紧闭的双唇，将舌头探入口中，深深地——","吻着宫城。","几乎相同的体温交融。就算舌尖相触，她也乖乖地没有反抗，所以大概不排斥。触碰人体内部那个朋友不会触碰的地方，这让我更想深入地了解宫城。手指被咬的时候，她的舌头也有碰到我，我也能感受她的体温。可是我只觉得痛，一点都不舒服。现在却非常舒服，想要一直延续这个吻。","我把身体重心倾向宫城。","感觉快要顺势推倒她时，宫城将我一把推开，拉开了距离。","「仙台同学。」","宫城叫了我一声。那个语气不算不高兴，可是也称不上开心。","「什么事？」","「……辞掉打工啦。」","随着这句听起来实在不像接吻后会说的话，宫城紧紧握住我那根刚才被她咬过的手指。即将上升的体温因疼痛而降了下来。","「为什么？」","宫城没道理叫我辞掉打工。","去工作的人是我，我应该也没有给宫城添麻烦。当然，往后也不打算造成她的困扰。","我盯着宫城。","她依然板着一张脸，默不作声。","「做不到。现在辞掉会给人家添麻烦，而且我也满喜欢这份工作的。」","比起去便利商店或餐饮店打工，当家教更适合我。重点是时薪很高。如果能少花一点时间在打工，我就有更长的时间可以待在家里。","「那种事情不用你说我也知道。」","宫城放开我的手指。","「那你为什么叫我辞掉打工？」","「只是说说。」","低声说完，宫城握住我的手。","她果然很奇怪。","跟平常不一样。","虽然很想知道她叫我辞掉打工的理由，但要是问了，宫城绝对会跑回自己房间。牵着的手很舒服，不想放开。所以我什么都没说，回握那只手。","〔本话含插图〕"]},{"t":"第8话　仙台同学一定不在的日子","p":["我觉得自己对仙台同学做了不好的事。","我有在反省了。","可是我咬她手指后已经过了将近一周，她还贴着OK绷。我很想知道到底是怎么一回事。","「那个要贴到什么时候？」","我将目光移向仙台同学的手指，咬下她准备的吐司。涂上奶油和果酱的吐司，甜味和咸味的平衡恰到好处，逐渐成为早餐的固定班底。","「你说OK绷？」","「对。」","高中时，说要做炸鸡块的仙台同学拜托我切高丽菜丝，我因此划伤手指。她那时在我流血的手指上贴了只重视功用，一点都不可爱的OK绷。现在她被我咬过的手指上也一直贴着和那时同款的OK绷。","「嗯～」","沉吟半晌后，仙台同学喝了一口柳橙汁。","在她做了汉堡排给我吃的那天晚上，我毫不留情地咬了她的手指，在上头留下齿痕。我自己也觉得手指上即使留有伤痕也不奇怪，但不可能过了这么久还没消失。","「伤痕早就消失了吧？」","「不知道耶。」","尽管语调一如往常，但仙台同学没有看我。看来今天是不时会出现的她不愿意和我对上眼的日子，这点也令我相当不满。而自己只因为这点小事就不高兴的事实，害我差点陷入郁闷的情绪中。","「把那个OK绷撕掉啦。」","我其实很想抓住她的手，直接把OK绷撕下来。但我咬了一口吐司，忍下这股冲动。","即使她不会真的生气，也不代表我可以为所欲为。我还是知道这世上有分「可以做的事」和「不能做的事」。硬是抓住别人的手去做什么就是「不能做的事」。","「我才刚贴上去，现在撕掉太浪费了。」","「你贴着那个是在挖苦我吗？」","「挖苦？你为什么会这么想？」","仙台同学好像很惊讶。","「仙台同学还在气我咬你的事吧？」","我的语气变得有些尖锐。为了掩饰，我将炒蛋送入口中。","唯有仙台同学，我始终和她处不好。","虽然想用更普通的方式和她相处，但我办不到。","因为在大学毕业前都会住在一起，我希望能用和舞香相处时那种平静的心情和她相处。然而，这个愿望无法实现。明明知道这样不好，我还是会对仙台同学做出过分的事。只要和她在一起，我就控制不了自己的情绪。至今为止，不管和怎样的人相处，我都不会咬人或踢人，只会对仙台同学这样做。","「那种事情已经是家常便饭了，事到如今我哪会因为那样就生气。」","「你总是说谎。」","就算用力咬她，仙台同学也不会生气。我很清楚。可是每次看到缠绕在她手指上的OK绷，我就会想起自己做过的事，心底隐隐作痛，差点脱口说出多余的话。","早知道就不要那么用力咬她。","早知道就不要叫她辞掉打工。","脑中浮现的尽是这些事。","我早料到即使叫她辞掉打工，她也不会听。实际上，仙台同学就没有辞掉工作，继续当家教，不时和我聊起学生的事。","「宫城，你不要一大早就心情不好啦。」","仙台同学用不带起伏的语气说道，咬下一口吐司。","我不知道仙台同学的基准为何，但她有时候会听我的话，有时候不会。","打耳洞不行，打工也不行。","即使叫她让我打耳洞，叫她辞掉打工，她也不会听从。说到底，仙台同学不会因为我的话而改变。","「我的心情没有不好。」","言辞不带情绪。","平淡地宣告。","「如果心情没有不好，那是『什么』不好？」","我没有哪里不好。","不好的是仙台同学的打工。","如果她的打工不是当家教就好了。","其他的打工我就能接受。","「我只是讲法不太好而已嘛。你这样挑人语病很坏耶。」","我喝下半杯柳橙汁，把没说出口的话吞回肚里。然后将玻璃杯放在桌上。","「对了，宫城你应该知道吧？我今天要打工所以会晚回家。你自己先吃晚餐喔。」","「好。」","无法变更的行程让我感到郁闷。","家教工作填满仙台同学的行事历，把我挤出去。","去年夏天，「家教」是专属于我的名词。","我和主动要教我念书的仙台同学一起度过了高中三年级的漫长假期。我不认为在她打工的地方会发生和那个暑假一样的事情，可是每回听到「家教」这个原本专属于我的名词，心里就会涌现许多想问仙台同学的问题。","当家教时，你也和跟我念书时一样坐在学生旁边吗？","你会握住学生的手吗？","——你说过不会跟朋友接吻，那你会跟学生接吻吗？","成为室友后，我有很多想知道的事，心中也充满许多无法整理的感情。其中之一是我们就读的大学不同。可是这被我视为一件无可奈何的事，不至于无法应对。我可以藉由过去和现在的记忆去想像她在大学里的模样。虽然之前一直无法接受有我无从得知的仙台同学，但我现在是这么想的。","可是家教的打工另当别论。","那和我的过去有强烈连结，我无法接受那些能轻易想像的画面。回忆起我们在暑假或放学后共同度过的时光，将里面的我置换成她的学生，被那些我认为不可能发生的想像所折磨。","打工只是日常生活的一环，不是我该介意的事。即使介意，等她真的开始打工，我应该就能接受这个事实了。然而事情并非如此。","一想到在当家教的仙台同学，我的意识便会奔向过去。","以前那个宣称自己是家教、教我功课的她，跟现在打工当家教的仙台同学不一样。不可能一样。尽管心里清楚，我还是想知道哪里不一样，同时也不想知道。","太奇怪了。","就算问仙台同学，她也只会给出普通的回答。那是当然的，我也不需要特别的回答。","我知道把过去那段时光跟现在拿来做比较是一件多么奇怪的事。","我很清楚。","但还是很在意，没办法静下心。","我想把这份心情吞进肚里消化掉，像在吃仙台同学做的汉堡排那样。明明这么想，这份心情却一直残留体内，让我很不舒服。","「宫城，我差不多该出门了。」","仙台同学清空盘里的食物，将玻璃杯中剩下的柳橙汁一饮而尽。","「等一下。你先撕掉OK绷再出门。」","「你还在介意这个啊？」","老实说OK绷已经不重要了。","我只是没来由地想挽留仙台同学，却想不到留住她的理由。","「让我看看你的手指怎么样了啦。」","「看了也只是普通的手指啊。」","仙台同学无奈地开口，叹了一口气。","然后撕下OK绷。","白皙亮丽的手指没有半点伤痕，只是表面有点皱。","是一根看不出为何需要贴OK绷的手指。","「根本没有痕迹了嘛。」","「大概是贴着OK绷的期间消失了。」","仙台同学随口说出毫无根据的话，碰了下手指。接着用刚才不肯和我对上眼的眼睛看向这边，粲然一笑。","她最近经常对我笑。","可是那样的仙台同学不是真正的仙台同学。和我记忆中那个想在暑假时玩「假扮朋友游戏」、看电影时脸上挂着一张虚伪笑容的仙台同学重叠。或许是因为这样，笑容满面的她令我感到不安。","我摸了摸耳环。","可以的话，我想用耳环束缚住她，立下「辞掉打工」的约定。但耳环只是个饰品，没有能将南瓜变成马车的力量。它也不是只要摩擦就会有精灵出现、为我实现愿望的神灯。耳环只是能和仙台同学定下日常的小约定，让人暂时安心的东西。再说，即使立下约定也不能保证她绝对不会打破。","「宫城，可以麻烦你收拾吗？」","「可以啊。」","「谢谢。我今天想早点去学校。」","仙台同学起身走回房间。","我咬下吐司。","又甜又咸，不好吃。","今天回来后，我又得一个人吃不好吃的晚餐。想到这点，胃部就隐隐作痛。我有股今天一整天都会很不顺利的预感。","结束所有漫长的大学课程后，我回到家里，开始犹豫不决。","要吃泡面还是即食汉堡排？","也有「自己做饭」这个选项。","我透过几种方法决定了今天的晚餐，拿出即食汉堡排加热。家里现在只有我一个人，要吃饭的也只有我。特地做晚餐很麻烦。仙台同学早上出门前有说自己今天要打工，会比较晚回家。就算她不说，我也记得这个必须独自吃晚餐的日子。","热好汉堡排，拿出盘子添饭。脑中一瞬间闪过要是有买个沙拉之类的东西回来就好，可是一个人吃的晚餐即使多出一道配菜也不会变成快乐的时光。和某人一起吃的晚餐，不管吃什么都觉得好吃，可是一个人吃的晚餐，不管吃什么都索然无味。只是用来填饱肚子的玩意儿。","我动起筷子，将汉堡排和白饭装进胃里。就算和仙台同学一起吃饭，我们也从未在餐桌上热络聊天。然而，一个人别说热络了，甚至不需要开口说话，所以盘子很快就空了。洗完碗盘，我也没必要继续待在共用空间，于是回到自己的房间。","我从书柜上拿起黑猫，丢到床上。","像在追逐黑猫似的跟着跳上床。","今天不是开心的日子，但也没有不顺利。可是我的心情不太好，觉得洗澡很麻烦，甚至懒得换衣服。我也没那个干劲去处理重要的作业，只好把黑猫拉过来。","「喵。」","我代替玩偶叫了一声，摸摸它的头。","作为圣诞礼物跑来的黑猫，变成一个只要放在身边就会感到安心，摸摸它的头就能让我转移注意力的存在。盯着它看就会想听它的叫声。如果它会喵喵叫，我的心情应该会好转吧。","我把黑猫放在胸口，闭上双眼。","本来没有睡意的，视野被遮蔽后，脑袋却像蒙上了一层雾霭，意识逐渐远去。","一下下就好。","三十分钟左右。","我甚至懒得设手机的闹钟，在隔着眼睑仍能感受房间灯光的同时，任凭睡魔袭来。呼……听见自己平稳的呼吸声。咕咚……黑猫滚下床了。在明明很暗却能感觉到光线的黑暗中，意识在不深不浅的位置徘徊。半梦半醒之间，远处传来微弱的声响。","叩叩，叩。","意识到那是小声敲门的声音，我从床上爬起来。","「干嘛？」","挤出卡在喉咙的声音，对着门外问道。","「我买了蛋糕，你要不要一起吃？」","门外传来仙台同学开朗的嗓音。","「蛋糕？」","「对，蛋糕。总之你先开门啦。」","我在她的催促下走出房间。","门「砰！」地一声被关上。仙台同学抓住我的手臂。","「我买了草莓鲜奶油蛋糕、草莓塔、生乳酪蛋糕跟起司蛋糕。你可以挑喜欢的吃。」","「会不会买太多了？」","「一个人吃两块蛋糕不算多吧？我去泡红茶，你先坐。」","我明明没说要吃，仙台同学却拉着我的手臂，一路把我带到餐桌前。","仙台同学拉开椅子，朝我微微一笑。我将视线投向餐桌，一个白色盒子被放在桌上。一看就知道她不是去便利商店，而是去更专门的店舖购买的。","我不讨厌蛋糕，胃里也还有空间。","不保证能吃下两块蛋糕，但一块绝对吃得下。","我乖乖就座，看着仙台同学。","「……发生什么好事吗？」","「没发生什么好事也可以买蛋糕吧？吃了好吃的东西心情就会变好啊。宫城不喜欢蛋糕吗？」","「喜欢是喜欢啦。」","「那就好啦。我先烧好热水了，等一下喔。」","这么说完，仙台同学把已经放入红茶茶叶的茶壶跟马克杯拿过来，用我们一起去买的快煮壶往茶壶里注入热水。然后用手机计时，在绝佳的时间点将泡好的红茶倒进马克杯。","「你可以挑自己喜欢的。」","仙台同学边说边打开白色盒子。","我窥看盒内，她刚才说过的几种蛋糕紧密地排放。先不论吃不吃得下，这四种都是我喜欢到愿意全部吃下肚的蛋糕。如果只能挑两种，我心里也有既定的答案了，可是感觉由我先挑不太好。","「买的人先挑啦。」","我将选择权交给仙台同学。她拿了盘子过来，盛了草莓鲜奶油蛋糕和生乳酪蛋糕端到我面前。正好都是我原本比较想吃的蛋糕，仙台同学大概是依据我的视线挑出这两种的。","「仙台同学喜欢吃哪个？」","「草莓塔和起司蛋糕。」","她说出剩下的两种蛋糕，将蛋糕放上盘子。","「实际上是哪个？」","「我是挑自己喜欢的买，所以四种蛋糕都喜欢。」","仙台同学好像觉得我会问什么麻烦问题，讲了一个笼统的答案。她撕下起司蛋糕外面的塑胶膜，说了声「我开动了」，用叉子切下等腰三角形的顶角，开始品尝蛋糕。","这意思是叫我安静吃掉盘子上的蛋糕。我也说了声「我开动了」，撕下草莓鲜奶油蛋糕的塑胶膜。草莓我想留到最后再吃，所以先把草莓挪到盘子，再切下等腰三角形的顶角，咬了一口。不会太甜腻的鲜奶油在舌头上化开，和轻柔的海绵蛋糕融合在一起，落入胃袋。","「好吃吗？」","仙台同学吃下第三口起司蛋糕，然后看向我。","「嗯……谢谢你。」","我向她道谢，切下充满鲜奶油的蛋糕，将叉子上那一大块蛋糕送入口中。鲜奶油一口接着一口滑过食道，我简直不像已经吃过晚餐的人。","对面的仙台同学则默默地吃着起司蛋糕。她没提起打工的事。没有跟我说学生提出一个出乎意料的问题，或是最近的国中生在想什么，诸如此类我根本没兴趣的话题。","不管她有没有提起打工的事，我都很不高兴。","蛋糕很好吃，但有些无法消化的东西持续堆积在比胃部深处更深的地方。","「仙台同学，过来这边。」","我指着斜前方开口。仙台同学带着疑惑的表情站起来，我补上一句：「连椅子一起。」她制造出轻微的碰撞声，跟椅子一起来到我的斜前方，静静地坐着。","「张开嘴巴。」","语毕，我用指尖挖起一团鲜奶油。滑顺的鲜奶油包裹着手指，传来冰冰凉凉的触感。","仙台同学的眉间出现了少许皱纹。","我知道自己接下来要做的不是什么好事。","尽管如此，我还是再说了一次「张开嘴巴」。她毫不犹豫地张嘴。","我伸长手臂，把手指送到她嘴边。","将指尖伸进她张开的嘴里。仙台同学闭上双唇，牙齿碰到我的第一指节。湿热的舌头抵住手指，鲜奶油逐渐化开。","只要我开口，大多数的事情仙台同学都愿意照做。","现在也是。明明不是命令，她却张开嘴，舔舐我的手指。","看到她听从指示，我松了一口气。我不像从前那样有权命令她，但有些事情并没有改变。","我又将手指稍微往前伸。","牙齿宛如抵抗般咬住手指。","尽管如此，我仍将手指往里面伸。她的舌头缠了上来。比鲜奶油更温热坚硬的舌头滑过手指，既舒服又恶心。我强行抽出手指，从没有盒套的面纸盒里抽出一张面纸擦干净。","「你为什么舔我？」","听我这么问，她用遵从指示是理所当然般的态度回答：「是宫城你叫我舔的啊。」","「我只是叫你张开嘴巴。」","「那就是叫我舔吧？」","虽然没错，但看到她这么自然地做出我没说出口的事，我开始产生一种不管说什么，她都会照做的感觉。","——如果现在叫她辞掉打工……","差点脱口说出心里的话，我赶紧用叉子切下一块草莓鲜奶油蛋糕，将一口大小的蛋糕送入嘴里。不会太甜腻，反而轻盈又松软，我却觉得胃里的蛋糕好沉重。鲜奶油和海绵蛋糕仿佛变成铅块或铁块。","「仙台同学，你刚才说没发生好事也可以买蛋糕。但其实有其他原因吧？」","我开口询问，试图忽视变得沉重的胃袋。","「因为我想吃点好吃的。」","「真的吗？」","「……我只是想让宫城开心一点。」","仙台同学夹杂着叹息回答，又继续说下去：","「我看你现在心情也不太好，要怎么做你才会开心？」","「我没有心情不好。」","「明明就不好。我不会勉强你笑，但至少表现得开心一点嘛。」","即使我不高兴、不露出笑容，仙台同学也会陪在我身边，像这样做些体贴的行为。我觉得偶尔表现得开心一点也无妨，却不知道该如何在她面前做出开心的模样。","仙台同学很温柔。","可是我没办法温柔对待仙台同学，总是做出试探她的行为。","「舔我。这样我的心情说不定会好转。」","我把没沾上鲜奶油的手指伸向仙台同学。她握住并拉过我的手，照着指示将舌尖贴上食指舔舐。比她的手温度更高的东西爬过手指，明明没有可以舔掉的东西，却像在舔鲜奶油一样滑动。往指根方向移动，渐渐弄湿我的手指。仙台同学的嘴唇吻上我的手背。","唇瓣很快离开，又再度吻上。舌尖抵住我的皮肤，一路舔到手腕。神经聚集在接触仙台同学体温的地方，皮肤的感官变得敏锐。舌头每次在肌肤上滑动，我便觉得浑身不对劲，肩膀擅自抖动。","心脏像缩成一半大小那样难受。","仙台同学的舌头从手腕顺着血管挪动，朝着手臂前进。","她又吻了上来。我抽回手臂，手就这样回到我身边，没有遭遇任何阻碍。","她的体温一消失，我便觉得不满足。","比起吃蛋糕，我更想触碰仙台同学。","「闭上眼睛。」","听我这么说，仙台同学立刻闭上原本睁开的双眼。","我起身抚摸她的脸颊。","手指缓缓滑动，用指尖描绘她嘴唇的形状。摸到正中间时，手指被舔了一下。我将手指移开唇瓣。这时，仙台同学抓住我的衣服。就像顺势被拉过去一样，我用嘴唇触碰她的唇瓣。","只是轻轻碰一下，没有鲜奶油的味道。","仅仅感受到那柔软的触感便让双唇分开。","仙台同学睁开眼睛，与我视线交会。","她一脸有话要说的样子，我则抢先开口：","「仙台同学，你没有遵守我们说要去吃饭的约定。」","我搬出黄金周期间她对着耳环发誓会遵守的约定。","「因为连假结束后有太多事要忙了。」","我坐到椅子上，看着找借口的仙台同学。","「是仙台同学约我的耶。」","「那个约定，可以挑下周日完成吗？」","「可以啊。」","我简短回答并用面纸擦拭手指。仙台同学仿佛什么事都没发生过一样，喝了口红茶。"]},{"t":"第9话　我想知道宫城的一切","p":["宫城最近都待在我身边。","今天也一样。","虽然心情还是一样差。","「仙台同学，我一定要从这里面选一件吗？」","宫城皱起眉头，用低沉的语气说道。","「你要试试其他的也行，可是我不会拿裙子以外的东西出来喔。」","约好要一起去吃饭的星期天，经过宫城「那件太短」、「这件太长」、「这个颜色我不喜欢」地不断挑剔，我床上只剩存活到最后的三件裙子。","没想到她会配合我的换装游戏。","傍晚才要出门。在那之前，既然要打发时间，两个人应该比一个人好。「要做什么？」去找宫城后，她这么问。我说想帮她化妆或换衣服。没有强迫她一定要选，如果不要就算了。可是宫城选了换衣服，然后自顾自地不高兴起来。","「选中间那条如何？」","宫城的面色凝重。我都开始同情那些裙子了，于是指着小腿肚长度的荷叶裙提议。","「不要。」","「那你什么都不穿就打算出门吗？」","「会被当成变态啦。」","「不想当变态就随便选一件啊。要我再把其他裙子拿出来也行。」","我对裙子没什么执着，只是有好一段时间没看见穿裙子的宫城，所以久违地想看一下。如果她真的有那么一丁点想穿，我希望她能穿给我看。","「……就中间那条。我要换衣服了，你出去。」","宫城小声咕哝，我被推着身体赶出房间。要是敢讲出「在我面前换衣服嘛」这种蠢话，感觉连出去吃饭这件事都会泡汤，所以我乖乖离开自己的房间。","她最近真的坦率过头了。","换成其他人，我不会因为这样就说人「坦率」，但她是宫城耶。考虑过去的种种状况，她现在简直坦率得可怕。这段时间的气温高到不像五月，她说不定是热到脑子出毛病了。","我靠上房门。","比宫城选的那条更长的裙摆随之摇晃。","马上就到六月，离七月也不远了。宫城说不定会因为天气太热而变得更不正常。不对，应该说我希望她能变得不正常。爱唱反调的宫城没什么不好，但我更想好好享受坦率的她。","「可以进来了。」","当我想着这种让宫城知道可能会被踹一脚的事情时，她的声音传来。我开门走进房间。","轻柔的荷叶裙和不悦的表情。","床舖前站着心情看起来比换衣服前更差的宫城。","穿着别人的衣服，她脸上居然能摆出比下雨天被车子溅起的污水喷到更厌恶的表情。这点让我惊讶，可是宫城穿上了她选的那条放在中间的裙子。","「很适合你。很可爱耶。」","我说出心里的想法，她则用不带起伏的语气回应：","「不用说这种话。」","「一般都会讲一下感想吧？难得换了裙子，要不要连上衣也换一件？」","宫城身上那件薄休闲服跟裙子很搭，但我想再多享受一下帮她换装的乐趣。","「这样就好。比起这个，我们快点出门啦。」","宫城冷淡地说。","「那要去哪里？」","虽然很想尽情地把宫城当作玩具，让她从头到脚都穿上我喜欢的衣服、让我化妆，但今天的目的是吃饭。再做些让她心情变差的事情只会惹出麻烦。","「去附近的家庭餐厅就好。我不想去太远的地方。」","大概是很在意裙子，宫城一直看着自己的脚。","「好。就去家庭餐厅吧。」","我和宫城一起离开房间，走向玄关。","穿上鞋子打开大门后，她拉住我的衣服。","「我要穿什么鞋子？」","宫城皱着眉头问道。","「穿球鞋就好吧？」","「好。」","宫城从鞋柜里拿出球鞋穿上。我看了她全身的打扮，又重复一次「好可爱」这个感想，结果被她推出玄关。","我们走下楼梯，朝家庭餐厅前进。","两个人都穿着裙子走在路上，这让我回想起高中时期。虽然几乎不曾穿着制服并肩同行，但穿着裙子的宫城在我身边。接近那段放学后时光的景象不免令人怀念。","可是我不认为宫城也想着同样的事。","她默默走在通往家庭餐厅的路上。","车子驶过的声音与孩童的嬉闹声。","傍晚的城镇充斥着各种声音，就算我们之间毫无对话也无所谓。室外气温以五月来说偏高，而且没有风，所以我觉得有点热。宫城倒是不受影响，不断地迈出步伐。明明可以再悠哉一点，宫城却走得很快。","这让我想抓住宫城的手，减缓她的步行速度。","本来想伸出手，最后还是作罢。","配合她的步调前进。","难得心情好，我不想做那种会被甩开手的事，反而扫兴。就算立刻抵达家庭餐厅，马上吃完饭，我们也还有很多时间。","虽然我不知道宫城会不会想跟我共度那段时光。","「宫城，你吃完饭打算做什么？」","我心急地开口。","「吃完再说。」","从宫城口中说出不算好的回答。我们踏入家庭餐厅。","看菜单、点餐。","聊了一些最近做的事或发生的事。","宫城几乎只负责听，但如果主动询问，她也会跟我聊最近买的书，或是学校里发生的事。尽管称不上相谈甚欢，但我不在意，毕竟我们从高中时期就没聊得很热络。可是一旦不聊天，饭很快就吃完了。出门不到两个小时，我们又回到家中。","「所以你决定好接下来要做什么了吗？」","我在玄关脱下鞋子并询问宫城。","「可以去你房间吗？我也想把裙子还你。」","「好啊。」","最近的宫城果然很奇怪。就算心情不好也会找理由待在我身边。今天也是，她等一下应该会来我房间，坐在我旁边。","我不知道宫城在想什么。","可是这让我很高兴。","「宫城，你要喝点什么吗？」","我在共用空间停下脚步，看着宫城。","「不用。」","得到冷淡的答复后，我们直接走到房间。我打开电灯，犹豫着要不要开冷气。再怎么喊热，现在也才五月。以气温来看很合理，可是从这个时期就开始吹冷气感觉太过分了。我于是打消这个念头。","「仙台同学。」","宫城把床舖当成椅子坐在上头。听到这声呼唤，我打算在她旁边坐下，结果被踢了一下。我只好坐在地上，抬头看向宫城。","「干嘛？」","「舔我的脚。」","「好久没听到这个命令了。可是你已经不能再命令我了。」","我们之间已经不存在五千圆了。","只有名为室友的关系。","「这是惩罚。如果没开口提醒，仙台同学根本不打算履行一起吃饭的约定吧？」","「只是晚了一点。就算你没说，我也会好好遵守约定啊。」","「那这是裙子的交换条件。」","宫城用低沉的语气说道。","她的心情明显比出门前更糟糕。","「裙子？」","「对。我听从仙台同学的要求，当了你的换装娃娃，所以这次换仙台同学听从命令了。」","原来如此。","所以她才会乖乖穿上裙子啊。","我这才意识到「宫城就算嘴上抱怨仍接受我的提议」这个行为背后的意义。我不认为她原本就想叫我舔她的脚，可是她想用交换条件的名义命令我做什么事情。这点是毋庸置疑的。","「你要下令也行，但我不接受奇怪的命令喔。」","「我觉得『舔脚』对仙台同学来说不是奇怪的命令啊。毕竟你舔过很多次了。仙台同学很喜欢我的脚吧？」","打扮得可爱却说出一点都不可爱的话，宫城踹了一下我的肩膀，翘起脚来。裙摆摇曳，视线被她的腿吸引过去。意识飞往高中时期，脑中浮现宫城的房间。","感觉自己的手忍不住想伸向她的腿，我急忙握拳。现在不应该做这种事。可是从宫城的态度来看，我也知道她绝对不会让步。","「我都听你的话了，仙台同学却不听从。太奇怪了吧？」","宫城的声音从头顶落下。我以不会被察觉的音量轻叹一口气。","「……从脱袜子的步骤开始？」","「对。」","「我知道了。」","我紧紧闭上双眼，然后睁开。","脱掉宫城的袜子，用手捧着她的脚跟，把脸凑近。视野被一只不会太白，有着健康肤色的脚塞满。我的嘴唇吻上她的脚背。","脚背中间和脚趾根部。","吻了几下后，头上降下一句严厉的「你认真舔」。","我其实很想避开这个情境。因为对现在的我来说，舔脚这个行为太刺激了。","可是宫城坚持要我舔，我也没办法。","我将舌尖抵在她的食趾顶端，往下舔到趾根。宫城的体温传来，我的体温好像也上升了。真希望刚才有开冷气，但我又不能现在去开。","将裙子掀到膝盖上，久违的膝盖让我的心脏怦咚作响。","我的手从脚跟滑到足弓。","缓缓抚摸到趾根处。宫城语带不满地叫了一声「仙台同学」，让我住手。然而，我吻上脚背，将舌尖抵上皮肤。舌头一路滑到脚踝，在脚胫上落下一吻。","心跳声吵得要命，仿佛接了一台扩音器。","我迅速地换了一口气。","舌头贴着皮肤，舔舐骨头包覆的地方。手指滑过小腿肚，抚摸膝盖内侧。这时，宫城的腿微微一颤，抗拒地想要逃开。我用力抓住她的小腿肚，沿着胫骨往上舔。亲了下坚硬的膝盖，然后把脸抬起来。","「继续。」","宫城踢了踢我的肩膀。","「办不到。」","「为什么？」","「没有为什么。已经结束了。」","「你不要擅自结束啦。」","「如果可以舔脚以外的地方，要我继续也行。」","「我的命令不是那样。舔我的脚啦。」","宫城不高兴地这么说，抬起原本翘着的脚放上我的大腿，仿佛在命令我舔。","我姑且还试图保持理性。","可是再继续下去就不行了。","用来锁住理性的螺丝别说松开，根本能听到它掉在地上的声音。原本就很容易松开的螺丝滚落到房间里的某处，无声无息地藏起来，让人找不到。不对，是我自己没打算找。失去固定用的东西后，负责抑制感情的理性顿时瓦解，如冰块般消融。在这个炎热的房间里，失去原形的理性不可能变回原样。","我挪开宫城的腿，站了起来。","「干嘛？」","宫城的声音传来。我迟疑了片刻，将右膝压上床舖。把手放到她肩上轻轻一推。虽然早就料到了，但她的背不肯乖乖倒在床上。","「宫城，让我推倒你啦。」","「死都不要。仙台同学一定在想什么奇怪的事。」","开始共同生活后，即使话不多，我还是有跟宫城聊天、吃饭，维持室友的关系。尽管对这层关系有所不满，我还是想继续维持室友的关系——我这段时间都是这样催眠自己。","「我不否认。」","我心中一直抱着邪念，会做不能告诉宫城的梦。","所以才要拒绝这个命令。","事情会演变成这样都是因为宫城最近很不对劲，下了奇怪的命令。","这份邪念就像是宫城培育出来的。她下完舔脚这种命令就在那边装傻，我也很伤脑筋。我可是有好好拒绝了。是她无视我的话，所以是宫城不好。","「仙台同学，让开啦。」","宫城用强硬的语气说道。","「让开之后，你打算做什么？」","「回房间。」","「那我不要让开。」","「让开啦。」","尖锐的眼神和低沉的嗓音。","可是宫城没有踢我或咬我。","她也没有推开我逃走。","明明能做到这一切却没有那么做，或许是因为宫城相信我不会做她真正抗拒的事。","如果真是这样，我不想背叛她的信任。","「——宫城。」","声音有些沙哑。","慢慢的，多花一些时间。","如果想维持她对我的信任，至少该等到宫城愿意让我进她房间。但我无法等到不知何时才会到来的那一天，我想用在风中奔驰的速度接近宫城。","「拜托了，同意我接下来要做的事。」","寂静的房间里，只响起我的说话声。","我与宫城四目相对。","又推了一下她的肩膀。","轻轻的，慢慢的。","就这样轻易地让宫城倒向床舖。先前的互动宛如一场骗局。","「……你接下来要做什么？」","宫城抬头看我，出声试探。","「如果明白说出来，你会同意吗？」","我用手指梳开宫城的头发。","撩起一束准备亲吻时，她伸手抵住我的额头。","「怎么可能。」","「我想也是。所以我才会拜托你。」","「……我和仙台同学是室友吧？」","「是室友啊。从前是，以后也是。」","「骗人。仙台同学想做的事情，根本不是室友之间会做的事嘛。」","「就算是室友也无妨吧？」","「室友」是用来指称共同住在一个屋檐下的人，跟做了什么无关。不管我接下来打算做什么，这个关系也不会改变。这充其量是诡辩，但如果宫城需要室友这个代名词，我想为她保留下来。","虽然我不晓得她会不会同意。","「仙台同学又这样随便说话。」","「宫城也随便一点啦。」","「我才不要。」","宫城答得毫不犹豫，对话就此中断。","她的手碰到我的肩膀，用力推着我。","即使不被允许，我也想更进一步。","但如果宫城真的说不要，我也打算死了这条心。","短暂犹豫后，我打算起身。这时，宫城把手收了回去，低声问道：","「——如果不同意，仙台同学打算怎么办？」","她不高兴或是不笑我都能够忍受，但我不想被强烈地拒绝，更不想被她讨厌。","「我绝对不会再对宫城做出这种事。不管是同住期间，还是没有同住之后。绝对不会。」","「你嘴上说绝对不会，但还是可能打破约定吧？」","宫城凝视着我，摸不透她在想什么。","「我不会。我愿意向耳环发誓。」","我伸手碰触小小的银色耳环，那个我亲手在宫城身上留下的印记。吻上那个怎么想都是特别的东西，然后在她耳边低语：","「我向你保证。」","「反正你只是随便说说吧？毕竟仙台同学动不动就说谎。」","「听起来像随便说说吗？这副耳环就是为此而存在吧。我绝对不会打破约定。」","我再度吻上小小的饰品，轻咬她的耳垂。","宫城摸着我的头发，手指爬上我的耳朵。她用仿佛上面有耳环的动作触碰我明明没戴耳环的耳垂，却又疏远似的缓缓推了我的肩头。不管怎么想，这个动作都表示她不同意我接下来要做的事。所以我主动起身。","现在我的心中同时存在「想更进一步的我」和「打算放弃的我」。双方僵持不下。","然而，这是不能打破的约定。","我伸出手，用指尖触碰宫城的耳环。","「宫城，我会好好遵守约定。」","我不是澈底死心。","尽管如此，我还是打算下床。这时，一声「仙台同学」让我看向宫城。","视线交会。","宫城轻轻吸了一口气。","什么都没说。","我无法忍受沉默，又补上一句「不用担心」来保证自己会遵守约定。接着，宫城用小到感觉会漏听的音量开口：","「……电灯。」","「咦？」","「关掉啦。」","这出乎意料的内容让我忘了回话。急忙爬下床舖，拿起桌上的遥控器关灯，只留下小夜灯。这时，宫城有些生气地说：「全部关掉啦。」所以我顺着她的话，连小夜灯都关了。","「仙台同学，窗帘也拉上。」","「我回来之后就没打开，窗帘有拉上啊。」","「你检查一下有没有拉好。」","我照她说的去检查窗帘，发现还有一点缝隙，于是再次打开小夜灯，重新拉好窗帘后关灯。排除光源让一切事物的轮廓变得模糊不清，我静静地回到宫城身边。","「宫城。」","我触碰没有回话的她，把身体靠过去。","抚摸并亲吻她在黑暗中变得朦胧的头发。宫城抓住我的衣服。","没有说话。","我在她的太阳穴、脸颊、耳朵上落下数不清的吻。","待在近乎全黑的房间会产生一股与世隔绝的错觉。然而，只要踏出一步，外头就有多到数不清的人，我也不会再有那种世界上只剩我和宫城的幻想。可是这个房间是只属于我和宫城的空间，没有人可以妨碍我们。不会发生像去年暑假那样的事。即使发生了，我也不打算再中途停手。","我的意志坚定，但底下的宫城实在太安静了，反而令人不安。","「喂，宫城。等下就算有人按门铃，我也不会去应门喔。手机响了也不会接，我也不会让宫城接。现在还来得及反悔……你真的要继续下去吗？」","在理性完全融化、变得无法克制前，我这么问。","「仙台同学，你很啰唆耶。要做就别说话啦。」","随着这道冷淡的声音，我的脖子被咬了一口。靠近肩膀的位置一阵刺痛，但她似乎有放轻力道，不到平常那样想喊痛的程度。牙齿瞬间陷入皮肤又立刻离开，放过了我。我轻咬她的下巴反击，她则推了下我的肩膀，所以我更用力地咬上她的脖子。宫城抗拒似的回推。她一动，洗发精的香味便扑鼻而来。明明跟平常一样，闻起来却格外甜美的香气令我头晕目眩。","抚摸她快和黑暗同化的头发，手指顺着耳朵的轮廓滑动。将舌尖抵住耳垂处的耳环，顺势往上舔，仿佛在确认软骨的触感。尽管世界上的一切都因为墨色而变得模糊不清，从相触的部分仍能清楚感觉到宫城的轮廓。","「宫城。」","我轻声呢喃，将舌头伸进她的耳朵。","宫城粗鲁地拉扯我的头发，但没有用力。","「这样很痒。」","她不满地抱怨。","「忍耐一下啦。」","语毕，我舔了她的耳朵。结果被踢了一脚。","「喂，宫城，很痛耶。」","「谁叫仙台同学不住手。」","「我怎么可能住手啊。你配合一点啦。」","抚摸她的耳朵，轻轻含咬。","「我就说这样会痒——」","咬住耳朵的牙齿加重力道，宫城来不及说完便倒抽一口气。","亲吻她的耳朵下方，舔过脖子。在外面走了一段路，房间里又很热。明明应该有流汗，我却觉得像舔了花蜜一样甜。这或许是洗发精造成的错觉，也说不定是我已经不正常到连感觉都出了问题。","我有如在品尝宫城一般，让舌头滑过颈部的凹陷处，轻轻含咬。手隔着衣服滑过她的腰向下移动。从休闲服的下摆滑进去，直接触碰到她的腰。被汗水打湿的肌肤吸住我的掌心，宫城的体温和呼吸也跟着传来。我想多感受一点，于是用力将手贴上去，摸到她的肋骨。正要掀开衣服时，她抓住我的手臂。","「你要是脱了我的衣服，我会生气喔。」","「别担心。我不会脱。」","听我这么说，她放开我的手臂。","抚摸、摩挲肋骨下缘柔软的部分。我的手缓缓移动，宫城则不发一语。然而，微微缠绕我们的黑暗让我看不清她的表情。她大概是觉得让人褪去遮蔽身体的衣物太害羞了。希望是这样。","手指爬过位于身体中心的肚脐，往上移动。没有掀起休闲服，继续前进。碰到内衣后，她又抓住我的手臂。","「我刚才说过不准脱吧？」","「我没打算脱，只是想摸。」","我吻了她的脸颊，并如此低语。抓住我的手松开了。","老实说，不管是内衣还是上衣，我都希望能除去包裹宫城的一切。可是我想尊重她的意愿。","我安静、缓慢地隔着内衣触碰她的胸部。","亲吻她的颈项，手悄悄地移动。","比起柔软的皮肤，我更能清楚感觉到包覆胸部的蕾丝和布料。只要稍稍用力，手掌下的身体便微微一颤。我碰触肩带，不发一语地让指尖慢慢向下滑动。","「……不要。」","她微弱的声音让我停止手上动作。","「房间很暗，我什么都看不到，也不会脱掉任何东西。我只是想触碰宫城。」","「不行。」","「就算不脱也不行？」","「不脱也不行。」","她的语气不重，也不冷淡。我无法分辨她是不是认真的。","老实说，无论是胸部、背脊、腰。","或是除此之外的所有部位。","我都想要触碰、亲吻宫城的全部。","我希望她能同意我这么做。","可是我不想违反宫城的意愿。我的欲望和宫城的希望正好相反，若将这两者放上天秤，必然会倾向宫城那边。","「……我知道了。」","我抽出衣服里的手，让手爬上宫城的脖子。接着缓缓滑动，隔着休闲服碰触胸部。她马上抓住我的手。","她用不算弱的力道紧紧握住我的手。这个抓法不像很排斥，可是我不想再听她说「不行」。如果能慢慢探索「可以做的事」和「不能做的事」就好，但宫城应该不会给我思考的时间。我轻轻呼出一口气，吻上宫城的脖子，用力吸吮。她立刻拍打我的背。","「也不准留下痕迹。」","既然意见这么多，宫城又为何同意？我非常在意，却也明白一旦问出口，这段时间就到此为止了。","「但我可以吻你吧？」","我姑且问了一下，没有得到答复。","这大概是「可以」的意思，所以我堵住宫城的唇，将舌头伸进去。在柔软唇瓣的深处碰上坚硬的牙齿，轻点宫城的舌尖。我轻轻点了几下，宫城不算积极，但还是回应了我。明明很柔软却又坚硬温热的舌头，光靠这细微动作就夺走我的思考能力。滑溜的舌头交缠，让我几乎忘了如何呼吸。","我不知道为什么只有宫城能够融化我的理性。","也不晓得我为什么会这么想吻她。","尽管如此，身体仍自作主张地轻咬、舔舐宫城的嘴唇，反复接吻。宫城的呼吸乱了，我的呼吸也变得愈来愈急促。然而，比起喘不过气的难受，两人体温交融的舒服感觉更为强烈。宫城的呼吸断断续续，混杂不成声的呻吟。紊乱的呼吸令我兴奋起来，忍不住想赶快迈入下一个阶段。","我移开嘴唇，与宫城十指交缠。","或许是因为房里太暗，我无法清楚看见宫城。手上的感觉因此变得更敏锐。光触碰就觉得很舒服。","嘴唇轻触脸颊，再度吻上耳朵。","松开交缠的手指，抓住休闲服的下摆。她按住我的手。我慢慢抓住她的手，将嘴唇凑上去。吻着她的指尖、手背、手腕，轻轻掀起休闲服，吻上她柔软的腹部。","一次、两次。","吻上又退开。","我又稍微掀起休闲服，将嘴唇抵在肋骨下方。","用牙齿轻咬。宫城的身体微微一颤，伸手抓住我的脑袋。","我将舌尖抵上她的皮肤，缓缓滑动后，再度落下一吻。","吻遍所有她同意的地方。希望等这个得到允许的行为结束，我们再度接吻时，宫城能想起今天被我嘴唇碰过的所有地方。宛如在搔痒、抚摸一般，持续制造不会残留的痕迹。","指尖顺着肋骨滑动，用力亲吻她的心窝。","将舌尖贴上去时，宫城的身体抖了一下。","每回被我的嘴唇碰触，她的呼吸就变得短暂而急促。我也跟着乱了呼吸。","手爬上腰部，隔着裙子抚摸骨盆。顺势让手往下滑，掀起裙摆后，宫城的身体微微一颤，伸手抵住我的肩膀。","我停止手上的动作，凝视黑暗中轮廓模糊的宫城。","没听到她说不要。","「宫城。」","我平静地呼唤，她的手指紧紧陷入我的肩头。","没有开口抱怨。抓着我肩膀的力道也称不上抵抗。","接下来要做什么？","我想她应该清楚，只是还在犹豫。","去年夏天也发生过可能演变至此的事情。","「你会同意吧？」","我能理解宫城的踌躇。","所以尽量用温柔的语气询问。她放开原本抓住我肩膀的手。","「仙台同学是变态。」","「变态就变态。」","我把掀起一半的裙摆掀得更高，让手指爬上宫城的大腿。她的身体变得紧绷，我停下动作。","因为能感觉她的紧张，我有些犹豫。","现在碰那里还太早了。","可是——","我深吸一口气再吐出，调整紊乱的呼吸。","悄悄地滑动手指。","宫城的身体还是很紧绷，却没有出声制止。","碰到内裤后，我在意起自己的指甲。","先前没料到事情会变成这样，我不知道自己的指甲现在多长。印象中还好，但我很在意会不会弄痛她。","就在我的手停止动作时，宫城的身体扭了一下。","因为感觉她想逃走，我将手伸进内裤。我以前从未摸过其他人的这种地方。不对，根本不可能摸过，所以很紧张。刚才还擅自行动的身体，现在却像没电的人偶一样迟钝。我悄悄地移动手指，来到与至今碰过的宫城身上所有地方触感和温度都不一样的位置，黏稠的东西沾湿了我的指尖。","心跳快得仿佛快心脏病发，大脑中心和宫城的那里一样发热。我战战兢兢地稍微动了动手指。","「嗯……」","听到那不存在于记忆中的声音，我的手反射性地停下来。那个宛如撒娇的声音显然与平常不同，我惊讶得心脏都快跳出来了。","「……果然还是不要。」","宫城用微弱到会漏听的音量这么说。","但从指尖传来的反应可以知道她并不排斥。身体可能只是因为被碰触而起了反应，换成其他人说不定也会出现同样的反应。然而，现在我指尖前方的是她允许我触碰的结果，宫城绝对不知道我有多开心。","在这种状况下，即使她说不要也没办法。","我已经停不下来了。","「——如果无论如何都不行，要跟我说。」","我让湿润的手指爬上宫城最敏感的部位，宛如轻抚般缓缓动着。","宫城没再发出声音。","相对的，她的呼吸仿佛配合著手指动作，变得愈来愈急促。我从未如此清楚地感受宫城的体温。比我今天碰到的任何地方更烫，手指简直要融化了。连自己呼出的气息都跟着变烫，喉咙传来灼烧般的刺痛感。","我加重指尖的力道，宫城的身体微微颤动。那宛如混合了彼此情感的黏稠液体缠上手指，弄湿了我。","我继续缓缓移动指尖。","宫城的热流就像在邀请我一般不断涌出，指尖逐渐沉溺于宫城。","我能听见宫城微弱的声音溶解在黑暗中。","在墨色的世界中，宫城始终朦胧不清。明明这样触碰着她，我依然不满足，想更深入地了解宫城。","再一点点。","只要再让手指滑动一点点，我就能更紧密地与宫城的体温交融，甚至能澈底理解从未有人碰过的宫城深处。能够认识我所不知道，同时也是其他人无从得知的宫城。","她紊乱的呼吸不规则地抚过我的脸颊和耳朵。原先隐藏在融化理性下的感情催促我做出行动。然而，我硬是停下刚才缓缓移动的手指。","「仙台、同……学？」","宫城用沙哑的声音呼唤我。","我受到那从未听过的声音吸引，试图将手指滑到通往宫城深处的那个地方。可是对选择待在黑暗中、穿着衣服和内衣裤的宫城做出那种事，她一定会逃走。","「还好吗？」","我轻声询问，宫城抓住并拉扯我的衣服代替回答。","我看不清楚她的表情。","虽然想满足所有对未知领域的渴望，但我不希望她拨开这只手。我压抑住急躁的心情，在她允许的范围内动起刚才停下的手。","真希望她至少能叫我「叶月」。","我知道这是绝对不会实现的心愿，但我希望她能用平常听不到的甜腻声音喊我叶月，并允许我叫她志绪理。如果不被允许，我想撬开她紧闭的双唇以及铁定用力阖上的牙关，听听宫城强行忍下的那些声音。","可是我知道这些全是她不会同意的事。","既然如此，我就应该专心享受她允许我做的事。","我明白。","却希望她能允许我做得更多。","希望宫城被我的手改变，想听见那些从未让其他人听见的声音，想看她变得无法自拔。","往后也是，直到永远。","希望她能接受抱持这种念头的我。","我滑动指尖。","宫城一部分的感情缠绕着我。","房里很热，宫城的体温很高，唯有指尖的触感格外清晰。「对宫城有非分之想的我」与「想要抑制自己的我」交缠不清，难以分离。我渐渐不知该如何是好，在她耳边低声喊着「宫城」来代替想叫她「志绪理」的冲动。","她没有回我一声「叶月」。","就算是这样，我仍喊了好几次「宫城」。我的低喃和平时不同，有些沙哑，听起来完全不像自己的声音。听我反复喊着「宫城」，她用力地拉扯我的衣服。","「你……很吵、别喊了……」","耳边传来她断断续续的声音，我们的身体紧紧贴合。","然而，宫城拉我过去只是想让我闭嘴，没有别的意思。尽管如此，隔着布料仍能清楚感受到那个炙热的身体。简直就像在说宫城渴望着我，令我欣喜不已。","「再多让我听听宫城的声音。」","心中冒出「要是能实现一个就好」的念头，心愿化为声音逸出口中。","「不、要。」","耳边传来她微弱且试图压抑感情的声音。","为了避免漏听，我将注意力集中在耳朵。","「那说『不要』也好，再多说几句。」","「你很……吵。」","那仿佛会消失在黑暗中的声音搔得我耳膜发痒。","光是听到宫城的声音，我就觉得自己快失控了，想要再「拜托」她。","「……我会安静，叫我叶月嘛。」","「不……要。」","我的理性因为宫城而融化消失了，她的理性却没有完全融化，留存在她心中并拒绝了我。就算在这种时候，宫城依然是宫城。这让我想融化她的理性。","「那你都别说了，吻我。」","我把脸凑近宫城，她伸手抵住我的肩膀。","可是手上没有用力。","我吻了她的脸颊，低声说道：「算我求你。」","宫城的手触碰我的脸颊，抚过唇瓣。然后，她像是放弃挣扎般吻上我的唇。","这是一个和本人意愿无关的吻。不是宫城自己主动，是我出声拜托的。尽管如此，宫城主动吻我这件事仍让我几乎停止呼吸。","嘴唇反复接触了好几次，宫城抓住我的肩膀。","呼吸变得急促，我能听见她口中不时逸出没能忍下的声音。","去年夏天那段原本非常鲜明，细节却随着日子一天天过去而变得模糊不清的记忆逐步更新。宫城的声音、气息和触感。为了那个做过无数次的梦境，我正在搜集能提升解析度的要素。","我一定会反复梦见今天的宫城。","置入今天的宫城，替换掉过去梦境中不确定的部分。一想到之后都会梦见如此鲜明的梦境，我大概会后悔，却停不下来。因为我一直想知道宫城在这种时候会发出怎样的声音，会做出怎样的反应。","手指用力地按压宫城，她咬了我的脖子。","牙齿陷进肉里，很痛。","可是这份痛楚应该会与宫城的快感相连。这么一想，疼痛好像也成为打乱呼吸的理由。我甚至觉得可以再痛一点。","宫城的感情透过那毫不留情咬着我的牙齿直接传来，害我差点失去意识。明明是我在碰她，觉得舒服的人应该是宫城，却连我都有了感觉。","希望这段时间能永远持续下去。","虽然这么想，我脖子上的痛楚却消失了。耳边传来宫城苦闷的声音。","「仙台、同学。」","听见那声难受的呼唤，我知道宫城已经快到极限了。","还没，还要，永远。","把忍不住想停手、想继续延长这段时光的我赶出脑中。我改变了手指原本徐缓的动作节奏。","溢出的情感澈底沾湿指尖，宫城抓住我的肩膀。","是我至今从未感受过的强烈力道。","然而在痛觉传达前，宫城的身体先没了力气。","房里只剩下宫城不规律的呼吸声，以及我变得急促的呼吸声。","无论是宫城的喘气声还是她传来的体温，我能感受到的一切都是如此舒适。我吻上瘫软无力的她，轻轻触碰她柔软的唇瓣，舔过下唇。她宛如在等待我一般微微张嘴。然而，舌尖一碰上我便马上被她推回来。","「……好热。」","宫城调整紊乱的呼吸，喃喃说道，并伸手推我的身体。我收回刚才感觉快和宫城融为一体的手指，她一把推开我，爬下床。","「宫城——」","我本想问她要去哪里，但开口前就听到宫城喊了一声「好痛」。她似乎撞到了桌子。","「要开灯吗？」","语毕，我才发现遥控器不在手边。","「我自己开。」","「遥控器在桌上。」","小夜灯亮起，宫城抱着鸭嘴兽坐回床上。她抽出几张面纸，擦拭我的手。","宫城的痕迹逐渐从我身上消失。","她低着头，比平常更仔细地擦拭我的手指。看不清楚她的表情。","方才潮湿的手指变得干干净净，失去宫城的体温。尽管如此，她依然低着头。","「我去泡个澡……想把身体洗干净。」","宫城站了起来，转身背对我。","我想挽留却找不到合适的话语。这都是因为我碰了宫城。面对原本应该一阶一阶踏上的阶梯，我别说两阶了，根本一口气跨越了三、四阶。我们开始担心以往总被忽视的「顺序」。","「宫城。」","她在房门前停下脚步。","虽然还没找到该说的话，但我觉得应该说点什么。","「没事吧？」","我说出今天不晓得已经说过几次的话，她平静地回应一声「嗯」，可是没有再多说什么。房门就这样关上，宫城的气息消失了。","〔本话含插图〕"]},{"t":"第10话　我所不知道的仙台同学和我所不知道的我","p":["我没有归还裙子。","我在更衣室里意识到这件事，但不想在这时候回去仙台同学的房间。我脱下衣服，看着镜中的自己。","从没有留下任何痕迹的身体可以看出仙台同学有听我的话。","刚才发生的所有事情，全是我在做梦。","即使有人这么说，我恐怕也会信以为真。我的身上真的完全找不到仙台同学的痕迹。","我摸着自己的脖子。","上面明明什么都没有，我却觉得好像有痕迹。不只脖子，被仙台同学吻过的每一处都好像有留下什么。即使试图转移注意力，我的大脑也不听使唤。","仙台同学的声音、呼吸、手的触感。","直到刚刚都还能感觉到的一切残留在脑中，占据了大部分思绪。接下来的几个小时，不对，更久。可能是几天，甚至一周。不晓得会持续多久，但我可能会一直想着仙台同学，感觉很讨厌。我不希望她闯进我的时间。我知道答应仙台同学会发生什么事，却没料到她会占满我的思绪。","我轻轻呼出一口气，脱下内衣裤走进浴室。","浴缸里面没有热水，所以我打开莲蓬头。","「好冰！」","流出来的明显是冷水，我连忙关上正弄湿双脚的莲蓬头。以五月来说，今天相当热，但我没打算在浴室里洗冷水澡。说不定该让脑袋冷静一下，可是我的身体已经降温了，紊乱的呼吸也已经恢复正常的节奏。","不要紧。","没事的。","我静静地吸气又吐气。","今天不是暑假的最后一天，不是会变成分界线的日子。即使这是会残留在记忆中的事，应该也不会像去年夏天那样连日期都记得一清二楚。","可是没办法找借口了。","那天的事，我们还可以藉口说是当下太冲动或一时兴起。寒假前，她看了我的胸部，但那个算是要她教我念书的交换条件。寒假时，我主动碰了仙台同学。如果想为那件事找借口还是能想到合适的理由。","今天这件事不是冲动或一时兴起，明明没有交换条件，我却没有选择拒绝。我知道她要做什么，还决定「同意」她。","尽管心里不是很舒坦，但那是我自己决定的事，所以没关系。我只能努力说服拼命找借口的自己。","然而，自身的变化让我吓了一跳。","我没想到自己会发出那种声音，也没想到自己的身体会做出那种反应。","还有——","——我没想到会那么舒服。","本以为我都明白，但我其实根本不明白。","我谨慎地转开热水。","确认莲蓬头流出的热水不会太烫，也不至于不够热。然后开始淋浴。","我没和别人做过相同的事，所以不清楚是不是无论对象是谁，我都会变成那样。然而，我会觉得舒服，应该、大概，是因为对象是仙台同学。而我一辈子都不要知道这件事比较好。","我打算用五千圆买下仙台同学的时间时，我们约好了不上床。我不知道今天做的事情算不算上床，但我们的关系已经来到离以前做过的约定十分遥远的地方。","舔我的脚。","今天我对仙台同学下达的命令是我们高中时期做过无数次的事，但在那之后的发展却大不相同。","未知的事情会令人不安。","成为大学生后，仙台同学开始打工。她总是优先打工，将我放在其次。「打工」这个词会带来我所不知道的仙台同学，不是什么有趣的玩意儿。可是看见她顺从的样子，我就能用她没有改变的部分去中和掉「打工」这个不同性质的东西，让我能稍微接受打工的存在。答应当她的换装娃娃是因为我觉得这可以作为命令她的交换条件，却没想到事情会演变成这样。","老实说，如果知道自己会变成那样，我就不会同意。","虽然这说不定是我迟早会同意的事，但不应该是今天。明明是这样，仙台同学却对耳环发誓说如果我今天不同意她，她往后绝对不会再做这种事。害我心生动摇。","「……明天该怎么办啊？」","关上热水。","我对仙台同学所做的事产生了怎样的反应？","她全都知道。","碰我的当事人怎么可能不知道。","尽管起因是我自己制造出来的，但我不想让仙台同学知道我会有那种反应。可以的话，我真想消除她的记忆，可是我没有那种魔法般的能力。","既然住在一起，即使我刻意错开时间，过着尽量不和她打照面的生活，也不可能一辈子都不跟她碰面。再说，我也没有希望一辈子都不要再见到仙台同学。","「……烂透了。」","刚才仙台同学反复呼唤我的声音，根本不像在叫室友。抚过耳膜的声音太过舒适，我明明阻止了她，不想再继续听下去，现在却又希望能再听到那个声音。可是想再听一次就表示得做跟今天一样的事。","——办不到。","我怎么可能再让仙台同学看到那样的自己。","如果是我碰仙台同学，她会发出怎样的声音？虽然很想知道，但我不认为她会乖乖让我碰。","脑中浮现的尽是不正经的念头，我明白自己变得不太对劲。照这样下去，我根本不知道明天该用怎样的表情面对她。明天最好永远都不要到来。","「仙台同学这个笨蛋，笨蛋，笨蛋。」","都说我们是室友了。","毕业典礼那天，仙台同学的确有这么说。搬到这里后，仙台同学会一直是我的室友，往后的四年间应该也是我的室友。可是我们今天做的并不是室友会做的事。仙台同学随便地讲出「就算是室友也无妨吧？」这种话，但听过彼此那些从未听过的声音后，我不知道往后是否能维持现在的关系。","「室友」这个高中时期不存在的代名词，就像是让我们能够共同生活四年的门票。如果失去这个代名词，感觉不用到四年，这段生活便会消失。","就算没有仙台同学也无所谓。但要是她不在了，我会很在意。","我会变得想要知道所有我无从得知的事情。","即使人在身边，我也会很在意。但我不晓得如果仙台同学不在了，自己该怎么办。所以过了毕业典礼这个期限，本该在那时候结束的关系又延续至今。话虽如此，我也不知道该怎么处理一心想着这些事情的自己。","我洗净身体，穿上用来取代睡衣的休闲服走出更衣室。","仙台同学不在共用空间。","我将麦茶倒进玻璃杯，拿回房间。","喝了半杯，把书柜上的黑猫移动到枕边，躺到床上。","仙台同学就在墙壁的另一侧。","我很在意她现在在想些什么。","我所不知道的仙台同学和我所不知道的我。","今天，我们知道了彼此都不知道的事。","得知了至今无从得知的仙台同学，我不知道这究竟是不是一件好事。往后说不定会后悔，也或许不会。我现在还无法想像未来的事。","然而，我无法接受只有我自己一个人在害羞。总觉得每次遇到这种事的都是我。","我亲吻黑猫的额头。","讨厌。","我不想满脑子都是仙台同学。","大学也好，舞香也罢。明明想思考别的事情，我却因为刚才近在咫尺的温度消失而感到失落。","这样一点都不像我。","明明还没打算要睡，我却紧紧闭上双眼。","仙台同学理所当然地出现在脑中，我轻叹了一口气。","「所以说，发生什么事了？」","我踏进房里的瞬间，舞香开口了。","去她家玩的时候，她一开始大多会问「要喝点什么吗？」。可是对今天的舞香来说，要喝什么似乎不重要。","「在说之前，我可以先把包包放下吗？」","我问这个房间的主人舞香。","「可以是可以，但我们约好了，所以你要告诉我发生了什么事喔。」","「嗯。」","我把包包放在桌边，坐在柔软的地毯边缘。上大学后，我已经来过舞香的房间好几次。可是一想到接下来必须回答的问题，我就有些紧张。","「告诉我原因吧。真的是吵架吗？」","舞香在对面坐下，直直盯着我看。","她口中的「原因」是指我带着一大包行李去学校的原因。更进一步来说，是我请舞香让我借住在她家几天的原因。我在教室里拜托舞香「今天让我借住你家」时，有解释「因为我和室友吵架了」，但光靠这么一句无法说服她。","可是我不可能告诉她自己是因为昨天发生的事——室友之间不该发生的行为，在逃避仙台同学。再说，我之前跟舞香说我和亲戚住在一起。如果这时候搬出仙台同学的名字，事情会变得更复杂。","「该怎么说呢……发生了一些事，搞得很像吵架。」","这个谎言连我自己都觉得很烂，心里充满愧疚。","我不想瞒着舞香，可是以隐瞒我和仙台同学过去发生的一切为前提，我没自信能够好好说明我们变成室友的经过。我也没有勇气全盘托出。","我总是这样。","缺乏勇气。","早上面对仙台同学的勇气。","晚上和她一起吃饭的勇气。","因为缺乏这些勇气，我才会在仙台同学起床前离家。我明白逃避无法解决任何问题，我也不是不想见到她。但我想破头也不知道该用怎样的表情面对仙台同学，又该跟她说什么话。","「我就是希望你告诉我『一些事』到底是什么事啊。」","舞香挤出不自然的笑容，又补上一句：「毕竟我要让志绪理住在这个狭小的房间嘛。」催促我开口。","如她所言，舞香的房间是不算宽敞的单人房。但因为整理得干净整齐，我从来不觉得房间很小。只是多我一个人感觉也没问题。不过身为请求收留的那一方，我没有资格反驳。我也觉得至少该说清楚原因。话虽如此，我还是无法鼓起勇气，从室友是仙台同学开始一路说明到昨天发生的事。","「真的是吵架啦。」","我打算将一开始撒的谎贯彻到底。","「志绪理不像会跟人吵架啊。」","「对方毕竟是亲戚，我不小心说得太过分了。」","「那是志绪理的错吗？」","「嗯～我觉得不是谁对谁错的问题……应该说我想让脑袋冷静一下。」","不晓得她是否接受了这个说词。舞香回了句「是喔」，然后看着我。","「志绪理，你的冷静『一下』大概是多久？」","「一下就是一下。」","「如果打算在我这里住到让脑袋冷静下来，你就好好告诉我。」","舞香用认真的语气这么说。","「……大概三周。」","语毕，我看向舞香，又订正自己的说词：「……至少两周。」","「不管是三周还是两周，不会太久了吗？」","「那一周。不然三天也好，让我暂时住在这里。」","「其实你要住两周还是三周都行，可是吵架拖久了反而更难和好喔。早点回家比较好吧？」","从那柔和却坚定的语气能听出舞香不是不愿意让我住下，她是真心在为我担心。我原本像被针刺到的心痛感变得更强烈，仿佛有一根木桩钉在胸口。","「……我知道，可是……」","考虑到昨天发生的事，即使我今天不回家，仙台同学多半也能体谅我的心情。但还是早点回家比较好。毕竟拖得愈久只会愈难回去，我也不能一直仰赖舞香的善意。","而且我今天也想着仙台同学。","早上发现我不在，她是怎么想的呢？","去大学上课时有想着我吗？","她还想做那样的事吗？","许许多多的思绪闪过脑中，心情也随之起伏不定。结果我到最后还是没能回家，待在舞香的房间。","「算了，有志绪理在很开心，我也不介意你待在这里，但还是好好想一想吧。我先去拿点什么过来，你坐着等一下。」","舞香说完便站了起来。","看着打开冰箱的舞香，我忍不住想问她和室友发生肉体关系时该如何应对。但如果真的问了，比起应对方式，感觉我得花上更长的时间来解释室友是谁，事情又为什么会变成这样。所以我连「这是我朋友遇到的状况」这种假设性说词也一并封藏心底，整个人倒在地毯上。","至少该听从「好好想一想」的建议，思考怎么做才能和仙台同学过上一如往常的生活。可是一想到她就会一并带出周日的记忆，这让我的大脑停止运作。","「梅子汁和柳橙汁，你要喝哪个？顺带一提，梅子汁是新产品。」","舞香走回来，对慵懒躺着的我说明玻璃杯里的内容物。","「柳橙汁。」","咚！玻璃杯放到桌上的声音让我坐起身。","「——志绪理。」","「干嘛？」","「跟你吵架……应该说跟你住在一起的人，该不会其实是你男朋友吧？」","舞香坐回她先前的座位，看向这边的眼神格外认真。","「你为什么会这么想？」","这意料之外的话让我盯着舞香。","「你不否认啊？」","「我否认了啊。」","「刚刚那句话根本没在否认啊。很可疑喔。」","「一点都不可疑。」","我喝了一口柳橙汁，补上一句「不是男朋友啦」。舞香只回了一声不带起伏的「喔～」看来她并未采信我的说词。","「这个耳洞其实也是为了男朋友打的吧？」","舞香玩笑似的这么说，伸手过来揉捏我的耳垂。因为很痒，我缩起身体，同时回了句「都说不是了」。她的手指松开我的耳垂。","舞香轻笑出声，我则看向她的指尖。","仙台同学也摸过我的耳朵，但和舞香摸的时候完全不同。","我也摸了下自己的耳朵。","跟仙台同学摸我时的感觉不同。这说起来也是理所当然，她的手有别于其他任何人的手。","周日那天，我记得仙台同学的手——","我又差点想起昨天的事，连忙用柳橙汁将浮上的记忆沉入胃里。和实际闯入身体的耳环相比，仙台同学更深刻地闯入我的内心深处。一旦轻忽大意，记忆就会立刻探头出来。","「志绪理，这个很好喝耶。你要喝一口吗？」","对面的舞香将玻璃杯放到我面前，带着淡淡颜色的透明液体摇晃着。大概是因为她刚才有说这是梅子汁，我觉得空气中似乎飘着一股挟带清爽酸味的香气。","「不用。」","我不讨厌梅子，但还是把玻璃杯还给舞香。","「这样啊。」","手机铃声几乎和舞香的声音重叠。我从包包里拿出手机，画面上显示『你早上是怎么了？』这是仙台同学不知道传来第几则的讯息。","我希望永远都不要见到仙台同学，又想早点见到她。","因为无法整理自己的情绪，我没有回讯息就把手机塞回包包。","「跟你吵架的人传来的？」","舞香喝了一口梅子汁。","「嗯，是啊。」","「你今天真的不回去吗？」","「今天让我住下来吧。」","「你想住多久都可以，但还是要早点和好喔。」","我不晓得舞香到底相不相信我的说词，但她的语气很温柔。","「嗯。」","我稍微犹豫了一下，拿出手机。","『抱歉。我今天不会回去。』","我不想让仙台同学担心。","我把最起码应该告知的讯息传给仙台同学，然后将手机收进包包。","〔本话含插图〕"]},{"t":"后记","p":["非常感谢各位拿起这本《我买下了与她的每周密会》第五集。随着U35老师绘制的宫城和仙台，这次的第五集也顺利出版了。","如同第四集的预告，宫城和仙台成为了大学生。《每周密会》决定出书之际，能够出版到「大学生篇」也是我立下的目标之一，所以此刻真是感慨万千。希望大家也能好好享受宫城和仙台在新天地里创造出来的故事。","那么，我想稍微把时间拉回第四集发售前后，聊聊那时的事……各位有听广播剧吗？","这次很荣幸能获得撰写脚本的机会，我把希望能听到宫城和仙台说出来的台词全部写进去了。没错。比如她们经常挂在嘴边的台词，还有让仙台的语尾加上「喵」。","太棒了。","虽然希望宫城也能在语尾加上「喵」，但万一发生这种事，她就会变得难以攻陷，结果还是没办法（笑）。如果还有这样的机会，到时候也让宫城说点什么吧！","广播剧的内容包含在《每周密会》的特设网页上回答问题才能听到的限定版，总共有三集。希望还没听过的读者能上特设网页看看，我会非常开心。","第四集发售时，除了广播剧，还有做一支PV。","这支PV在第四集发售前居然抢先在安利美特池袋店的大型电子看板上亮相。东京实在太遥远，我没能亲自去看。不过似乎有很多读者去现场观看，让我在播放期间内一直很紧张兴奋。第四集发售后，这支PV也被用来当作电视广告。我这次也跟着紧张兴奋地观看广告！","另外，宫城和仙台的周边商品开始贩售了。","除了书籍封面和彩页，周边也有使用U35老师全新绘制的插图，每个都漂亮又可爱！周边商品寄达时，我还召唤了好友N来家里一起举办开箱仪式，两个人都兴奋到不行。周边商品的讨论已经是很久之前的事，所以看到实品的时候真的很开心。尤其宫城是一个不太作可爱打扮的女孩，U35老师新绘制的白色连身洋装更显得特别。仙台看到这样的宫城应该也会很开心吧。","我把周边商品摆放在电脑附近，在漂亮可爱的宫城和仙台的围绕下创作《每周密会》。这是多么幸福的空间啊！我也不禁想着，真希望鳄鱼面纸盒套跟黑猫玩偶这些与她们两人息息相关的东西也能出成周边商品，让这个幸福的空间变得更充实。","然后，由右腹老师执笔的漫画版也开始在Young Champion 网站上连载了！收到第一话的分镜时，我就非常期待漫画版能早日出现在大家眼前！表情丰富的两人非常可爱，希望各位能搭配小说一同享受。","而且没想到《每周密会》竟然创了官方的X帐号！负责营运管理的人是我的责任编辑。官方帐号会公开作品的最新消息及相关企划，还请大家务必关注。","后记来到尾声，我依然要诚心感谢阅读第五集的各位、在网路上鼓励及支持我的各位、U35老师、责任编辑以及在各个方面协助本作品出版的各位。同时我还要感谢我的好友N。NPOWER总是帮了我很大的忙！","那么，希望能在第六集的后记与各位再见！","羽田宇佐"]},{"t":"番外篇　对仙台同学说的欢迎回来","p":["在我不算长的人生中，今天是最坐立不安的一天。","理由很简单，我周遭的一切全是崭新的。","陌生的书柜和床舖。","衣柜和窗外的景色。","才刚搬完家，眼前的这个房间还没有变成我的房间。","如果打开我过去打包的纸箱，取出里面的内容物，这里或许会变得更像我的房间。可是今天才刚搬来，我实在无心做那种事。","「啊～怎么办啊？」","意识到自己说话变得大声，我不禁屏息。","然而，本来应该在这个家里的仙台同学还没回来。","虽然这么做有点对不起她，但我请她先出去了。","这单纯是因为我没办法同时应付搬家公司的人和仙台同学。既然一次只能应付一边，我只能请仙台同学出去了。虽然仙台同学说「你不用理会我啊」，可是在她面前和其他人交谈会紧张。我一定会不停找理由支开她。","这么一想，在业者把东西全部搬进来前，我觉得还是请她先出去比较轻松。","我坐上为了放在这个房间而新买的床舖。","坐起来的感觉不一样，我又站了起来。","这张明明是自己买的却又不属于我的床舖，让我强烈感受到自己来到一个新的地方。我忍不住皱起眉头，整个人跳上床，把脸埋进枕头。我闻到一股不同于从前枕头的气味。即使抬起头，那些新的气味也不会散去。这个房间对我来说也是新的，让我感觉自己不该来到这里。","毕业典礼那天，决定和仙台同学合租房子的人是我。","列出选项的人是仙台同学，但我将项链戴上她的脖子，选择了樱花色的信封。尽管有些迟疑，我还是决定在新的地方和她成为室友。","可是我觉得很不安。","不熟悉的房间。","不熟悉的家具。","不熟悉的景色。","还有熟悉的仙台同学。","对我来说，这一切都是新的。来到这里前还很积极正向的心情变得退缩，我不禁想逃离这里。","妈妈不在以后，我过着明明和爸爸住在一起，爸爸却总是不在的生活。「家」成为一个理应存在我以外的人，那个人却不会回来的地方。","可是这个家不一样。","这里有除我之外的人，而且那个人一定会回来。","仙台同学现在不在，但她差不多要回来了。她会在这里吃饭、念书，或是看看闲书。视情况，她也会和我说话。所以我即将在这个家里，待在仙台同学就在隔壁的房间，或是共用空间里生活。","这是早就知道的事，但与我过往的生活相去甚远，令人坐立不安。","会有人回来的家，在我心中实在太陌生了。","说是这么说，这也不代表我想回到那个没有人会回来的家里。","我翻身仰躺在床上。","这里并不存在孤独的早晨或夜晚。","即使半夜醒来，我也不用害怕身后出现某种东西。不管是这面墙的另一侧，还是这扇门后面，仙台同学总是在家里的某个角落。往后四年间，我不用再过着害怕黑暗的生活。约定并不是绝对的，她说不定会毁约，但我不需要抱着太大的期望。","用力地闭上双眼，再睁开。","仙台同学虽然会找理由要我做选择，有时候也会说谎，但我知道她就是这样的人，所以没问题。合租房子这件事原本不存在，就算突然改变期限也无妨。只要这么想并做好心里准备，就算临时发生什么状况，我也能够承受。照理来说，只要想着我有可能变成独自生活就不会有事。","我对着天花板叹了一口气。","综合来看，我认为搬家的优点大于缺点，却还是以不安为燃料，不断搜索着不好的未来。","这样不行。","虽然没那个心情，但我还是应该来整理房间。什么都不做地虚度光阴会让我的脑子里塞满不该去想的事情。","我起身从大量的纸箱里拆开上面写着「玩偶」的箱子，从里头救出鳄鱼面纸盒套和黑猫玩偶。","我把鳄鱼放在桌子底下。","其实应该先在里头装上面纸，可是我的搬家行李中没有。如果问仙台同学，她应该会从哪里拿出面纸。但她现在不在，我只好先让鳄鱼空着肚子。","我本来想把黑猫玩偶放到床上，却迟疑了一下。","这里是我的房间，但跟搬家前不同，我以外的人也可以轻易踏足。虽然不认为仙台同学会擅自闯入，但凡事总有个万一。","「待在这里吧。」","我把黑猫放在书柜上。","一个玩偶孤伶伶地坐在空空如也的书柜上。","黑猫看起来格外寂寞。我摸了摸那小小的脑袋，鼓励地说：「我这就拿书过来。」","「是哪箱来着？」","我检查房里的纸箱，打开写着「书」的箱子，把几本我喜欢的书放在黑猫背后。这时，外头传来敲门声。","「宫城。」","同时也传来仙台同学的声音。我稍微打开门。","「我回来了。」","我不知道她在高兴什么，但仙台同学愉快地这么说。","「欢迎回来。」","我说出这句极少说出口的话，来到共用空间。","关上房门，看向仙台同学。","在爸爸不会回来的家里，「欢迎回来」派不上用场。所以即使我会对着没人在的家说「我回来了」，也几乎没有机会说「欢迎回来」。","我还不习惯这句话。","但我并不讨厌。","跟到昨天为止那段几乎没有人需要我说「我回来了」的生活不同，这里有需要这句话的人。这仿佛是我存在于此的意义之一，感觉还不坏。抵达这里时，仙台同学说的「欢迎回来」也没什么不好，感觉这里就是我的容身之处。","新家充满着我不习惯的事物，但「我回来了」和「欢迎回来」变成了成套的句子。这点倒是不错。","「宫城，房间怎么样？你一个人可以收拾吗？」","「嗯，应该可以。总之床可以睡人了。」","纸箱几乎还没拆封，不过只要慢慢收拾就好。距离大学开学还有一段时间。","「要我帮忙吗？」","「不用。仙台同学去收拾自己的房间吧。」","「我几乎都整理好了，可以帮你。」","「没关系。我能自己收拾。」","我的行李中没有什么见不得人的东西，可是自己的东西还是想自己收拾整理。虽然我曾经命令仙台同学帮我整理书柜，但这次不一样。如果要从头开始布置房间，我希望全部由自己亲手操办。","「我可以去看看宫城的房间吗？」","仙台同学伸手指向我身后。","「不可以。我还没收拾好耶。」","我可不想让她看见堆满纸箱还乱七八糟的房间。","即使要让她进房间，那也该是我收拾完毕后，不是现在。","「对了。宫城的床放在哪个位置？」","语毕，仙台同学粲然一笑。","「干嘛问这个？」","「只是好奇。我的床放在靠这一侧的墙边。宫城呢？」","刚才指向我身后的手指，这次指向不同的位置。从她所指的位置来看，「这一侧」显然是指我房间和仙台同学房间交界处的那面墙。","「跟你一样。在这面墙边。」","我没有特别坚持床要放在哪个位置。","只是没来由地想放在离人近一点的地方，所以将床放在靠近仙台同学房间的那一侧。","「那我们晚上说不定能隔着墙壁聊天呢。」","仙台同学说着蠢话。","「那样会吵到邻居，我才不会做那种事。」","「开玩笑的啦。如果吵吵闹闹的，搞到邻居来投诉也很伤脑筋。」","仙台同学的脸上依然挂着微笑，她坐到共用空间的椅子并看向我这么说：「总觉得怪怪的呢。」","「什么怪怪的？」","「因为我可以不用回家。」","「……仙台同学想回家吗？」","「不想，我会待在这里。」","「……四年间一直待在这里？」","「对，一直待在这里。」","对话就此中断，仙台同学的声音消失在共用空间。我也没有开口说话，现场陷入不自然的沉默，气氛变得有点尴尬。","「仙台同学，这个家里有盒装面纸吗？」","感觉继续保持沉默会更不自在，我于是问起刚刚发现缺少的东西。","「我房间里有。要拿过来吗？」","「不用现在。如果有多的，我想要一盒。」","「好，那我晚点拿给你。」","仙台同学温柔地回应。沉默又再度现身。","我们只是从「前同班同学」变成了「室友」，应该没有太大的改变。两个人在一起的时间却多到令我无所适从。","「啊，对了！宫城，要不要来庆祝一下搬家？」","仙台同学大概也有同样的感觉吧，她突然大声说道。","「不用……我要去便利商店。」","不行了。","比起继续待在这里忍受这个气氛，我想出去外面走走。","「便利商店？你有什么想要的东西吗？」","「我只是饿了。」","「那我们一起去吃饭吧。」","「我去便利商店解决就好。」","如果不是单独出门就没有意义。仙台同学跟来就等于把这股难以言喻的气氛一起带出去，和待在这里没什么区别。","「这样啊。那也带上我嘛。你不知道便利商店在哪里吧？」","「我知道。来的路上有看到。」","「只看过一次，你说不定会迷路啊。」","「才不会，而且仙台同学不用特地跟去，我也会买你的份回来。你想吃什么？」","「我想看了再决定，所以要一起去。」","仙台同学从椅子上起身，露出微笑。","不管怎么想，她都非常想跟去，这让我很不高兴。我也不是非去便利商店不可，让仙台同学自己去也行。然而，一旦说「那你自己去」，她又会改口说「我不去便利商店了」，赖在这里不走。","即使许久不见，仙台同学还是一样麻烦。","可是我觉得这样很有仙台同学的作风。","「宫城，今天是我们成为室友的第一天。作为纪念，我们一起去嘛。」","完全不打算退让的仙台同学笑嘻嘻地说道。","可是我不喜欢「纪念」这个词。擅自订下纪念日这种行为会让我非常困扰。","「今天是普通的日子。」","「哎呀，是普通的日子也没差啦。就算只是普通的日子，我们也可以一起去便利商店吧？」","「……是没错。」","被仙台同学截断了后路，令我一时语塞。","事情演变成这样反而让我开始觉得，去便利商店明明是件小事，一直推脱的自己好像是个罪大恶极的人。","「那就说定了。我先回房间一趟，等一下喔。」","语毕，仙台同学回到自己的房间。","她真的很霸道。","高中毕业后，她还是会擅自决定我的答复。","我呼出一口气。","全新的生活始终伴随着不安，但一如往常的仙台同学让我稍微安心了。我不确定自己能否跟她好好相处，希望能过上像高中时期那样的生活。","——虽然我没什么自信。","我从自己的房间拿出包包。","然后站在共用空间，握住新房间的门把。","「我要出门了。」","小声低喃后，我坐到仙台同学挑选的椅子上等待。"]}]},{"vol":"06","title":"我买下了与她的每周密会 · 卷06","chapters":[{"t":"简介","p":["我们做了室友之间不会做的事。那天以后宫城再也没有回家。我知道她去了哪里，也想要把她带回来。可是那天触碰宫城后，我察觉了心中那个「不愿承认的感情」，脚步变得无比沉重。宫城真的是个无论在或不在都会左右我感情的麻烦人物。","早点回去比较好。我明明很清楚，迟迟未归的这段时间却让我愈来愈不知道该怎么面对仙台同学。与此同时，我不断想着「仙台同学今天是怎么度过的呢？」也是不争的事实。自己拉开的距离得靠自己缩短——我非常清楚，但今天恐怕还是回不了家。"]},{"t":"第1话　对宫城的了解","p":["周日时，我和宫城做了室友之间不该做的事。","我没天真到认为这件事不会对隔天造成影响，所以早就料到宫城周一早上会不见人影。虽然没想到她那天不会回家，不过依照宫城的个性，做出这个决定也不奇怪。","可是，我从未想过她会连续三天不回家。","「还以为她马上就回来了。」","我叹了口气，将柳橙汁倒入玻璃杯。","等心情平复，她隔天就会尴尬地回家。","原本是这么想的，但直到第四天早上，宫城都没有回来。这让我有点不安。","那是宫城同意之下的结果，我们的关系没有改变，依然是室友。同时我也能理解，她周一早上很难用室友的身份面对我。","事实上，我也不晓得该用什么表情来面对宫城。","所以我们需要时间。","可是三天太久了。","我拿起装满柳橙汁的玻璃杯，从共用空间回到寝室。","至于宫城去了哪里，我其实不怎么担心。","「八成在宇都宫那里。」","我坐在地上，喝了约半杯柳橙汁，然后将玻璃杯放在桌上。","『你在宇都宫家吗？』周一传讯息问宫城，她只回我一句『不用担心』。我应该猜对了。如果不是，她大概会抱怨似的补上一句『不是舞香家』。","这种时候，宫城有地方可去的确让我安心不少。然而，对象是宇都宫又令我心情复杂。","我不认为她和宇都宫之间有什么。","即使什么都没有，依然心生不满。","话虽如此，总比不晓得宫城借住谁家，担心她无处可去好。只是若宫城就这样不回来，她的室友似乎会变成宇都宫。","那可真伤脑筋。","宫城差不多该回到这个家了。","我往床上一躺。","床罩和床单都洗过了。","明明洗过，我仍觉得上面有宫城的味道。周日的事我并不后悔。可是我很后悔选在这个房间。躺在床上便会不由自主地回想。","宫城在这里。我触碰她，吻她，还进一步——","记忆犹新，宫城不在反而让我更容易回想起来。","要是一如往常地和她一起吃饭，作为室友生活，我或许能将记忆尘封在梦境当中。但本人不在的事实减轻了我的罪恶感，妄想便自作主张地膨胀。","真的很讨厌。","明明因宫城迟迟未归而感到不安，脑中却想着周日的宫城。","我用力拍了一下脸颊，拿起手机。","刚才有传讯息问宫城什么时候回来，但手机静悄悄的。即使如此，我还是再检查一次。","果然没有回应。","拜此所赐，上课时间快到了，我却一点都不想去学校。","宫城离家后，这个念头数度兴起，但我还在犹豫该不该去她的大学。","假如宫城和宇都宫在一起，她应该不会跷课，所以去大学说不定能见到她。若能去宇都宫家里，事情就更简单了。问题是我不知道她家在哪里。","要是想见宫城，我应该去她的大学。","明知如此，我却迟迟无法下定决心。","与其迷恋于记忆中的宫城，不如去找她本人。我非常清楚，也很想见她。可是我不晓得该用什么表情见她。相较于宫城，我恐怕更难用室友的身份去面对她。","理由非常单纯，可以的话我不想承认。","现在也想装作没发现。","想必我……","在这段漫长的时间里——","一直喜欢着宫城。","不晓得她是何时夺走我的感情。比起「夺走」，用「侵蚀」形容或许更贴切。宫城一点一点地闯进我心里，在不知不觉间扎根住下。我一直将这份成长到无法逐出内心的感情塞进阴暗狭小的空间，用名为五千圆的屏障遮住，小心地避开。","即使有什么东西会刺激到深藏的感情，只要选择忽视就等于不存在。我和宫城连朋友都算不上，即使成为室友，这点依然没有改变。就算高中毕业后失去了五千圆这个屏障，那份悄悄存于内心深处的感情开始彰显自己的存在感，我依然谨慎小心，不去注意。","直到那个周日。","触碰宫城从未展现的一面，让长久以来被隐藏、被逃避的感情轻易闯入我的视野，飞奔而出。","——仙台叶月喜欢宫城志绪理。","一旦产生自觉便再也不容忽视。","我现在满脑子都是宫城。","宫城多半不会再同意我那么做，可是我还想触碰她、吻她、听她发出只有我知道的声音。怀着这种心情见面，我不确定自己能否用「室友」的身份和宫城相处。察觉这份感情却不知该如何面对的现在，她不在让我松了一口气。同时，以「察觉感情」为由，这个不愿去找宫城的自己也非常讨厌。","无论宫城在不在，她都会左右我的感情。","这个人真的很麻烦。","「……今天也不会回来吗？」","如果她主动回来，我就算勉强自己也必须梳理心情。如此一来，我应该能表现得像个室友。可是，她大概不会主动回来。","我起身下床。","真希望高中毕业前有问到宇都宫的联络方式。我说什么可能都无济于事，但如果宇都宫叫她回来，宫城应该会乖乖听话吧。然而，我联络不上宇都宫。所以想把宫城带回来只能跑去她的学校。","「一般都会找个合适的时机回来吧？」","我绕了房间一圈，看向手机。","深吸一口气，缓缓吐出。","决定再传一次讯息，问宫城何时回来。如果中午前没收到回复，我就去她的大学。","今天的行程可说是板上钉钉了。","我不认为宫城会回讯息，所以我要跷课。","反正现在出发还是会迟到。而且，这种状态持续愈久，见面时愈尴尬。不确定能不能遇见，但如果想去宫城的大学找她，我只有今天了。就算没碰到，我也有机会遇见宇都宫。","通过周日的触碰，我发现宫城比想像中更接纳我。她应该不讨厌我，否则不会同意我做那种事。","现在只能这么想了。","我将沉默的手机放在桌上。","整个人倒向床舖，闭上双眼。","脑中果然浮现宫城的身影。我叹了一口气。","升上大学后，我没跷过任何一堂课。","对我来说，那是学习的地方，不能偷懒。今天也该去学校。可是，我完全听不进昨天的上课内容，今天八成更听不进去。所以去学校也没有意义。","读一所不错的大学，进一间不错的公司，再也不回那个家。","宫城改写了我所描绘的未来。","我原本不打算找人合租房子，也不想成为会跷课的大学生。然而，我和宫城成为合租室友，还跷了大学的课。","我察觉到这份感情比想像中更棘手，或许该干脆地抹去。可是，「宫城」早就根深柢固地盘据心底，我不认为自己能把它赶跑。","回复期限是十二点。","起先是这么想的，但转眼间就过了十二点。都快下午两点了，我还在等宫城回复。","「至少回个讯息嘛。」","我躺在床上，瞪着手机，喃喃道出从周一开始无限循环的话。","我已经决定只等她到十二点，现在得赶快出门。","今天有家教的打工。","即使跷掉大学的课，我也不能跷掉和学生相关的打工。继续像这样眼巴巴地等待回复，打工时间就要到了，所以我应该赶快出门。明白归明白，但一想到见面时的尴尬场面，我就跨不出家门。","没自信像平常那样说话。","没自信像平常那样直视宫城的脸。","然后，我也无法承受某种可能——看到我的异常举动，宫城误会我对周日那事感到后悔。如果为了解开误会而告白，她一定会觉得我想利用「喜欢」这个词来合理化周日的行为。我将无法传达真实的心意。再说，假如向她告白，宫城一定会再次离开我。","「不行。」","我一边自言自语，一边挺起上半身。","盯着没收到回复的手机，身体被一种比「想见宫城」更强烈的负面情绪驱策。","『宫城！回讯息！』","满怀着焦躁与期待，我送出讯息。","手机果然毫无反应。","眼看时间无谓地流逝，我下定决心踏出家门。","五月步入尾声。艳阳高照，蓝天上仅有几片云朵。但夏天的脚步还很遥远，不算太热。","我快步走向车站，搭上电车。","手机在包包里沉睡，像死了一样。","在电车摇晃下仍毫无反应。","拿出手机，看向萤幕，果然没有回复。「何时回来？」不算什么难题，她应该立刻回讯息啊。","我看着窗外流逝的风景。","一想到待会儿必须做的事，我就焦虑到想在下一站下车，掉头回家。就像被敞开的车门吸引，我在正确的那一站下车，拖着沉重的步伐前进。仿佛穿了一双铁鞋，一步一步地靠近宫城应该在的大学。不晓得走了几分钟，目的地终于出现在眼前。我停下脚步。","「……这么说来，没有事先查过呢。」","决定租屋地点时，我查过她的学校位置，但没有顺便浏览校内资讯，所以不清楚校内设施的相对位置。谁教我满脑子只有宫城，没做好事前调查。只好立刻拿出手机，上网搜寻这所大学的导览图。","「希望能找到宫城。」","我出发前就知道了，大学这个占地宽广且人潮众多的地方实在不适合找人。就算是自己的学校，想找一个行踪成谜又联络不上的人也不容易。","早知道就多问她一些大学的事。","宫城不至于对大学生活只字未提，但也没有详细到能让我掌握她的行程。我根本无法预测她此时此刻在哪里。","一手拿着手机踏进校园。尽管没有限制他校学生进出，我还是有些紧张。","姑且先到学生空堂时可能会去的地方找人。可是无论去了哪里，和多少人擦肩而过，我都没看到宫城。说到底，我连宫城有没有来上学都不确定。「在学校里找她」或许毫无意义。","四处乱逛了将近一小时，我坐上长椅。","总觉得在浪费时间。明明只是走路，我却疲惫不堪。拿起手机确认，宫城没有回应。我其实很想直接问本人。可是，假如宫城发现我跑来这里，她一定会偷偷溜走。说是这么说，我也不认为继续流浪能找到宫城。","「去校门口附近吧。」","在大学校园中找人，好比从砂糖堆里挑出一粒盐。两者明显是不同的东西，混在一起却变得无从分辨。","进入视线范围的学生们就像散落一地的砂糖，我不觉得自己能找到宫城。即使如此，去人来人往的地方应该更有机会找到那个不回我讯息、像盐一样的宫城。","我起身朝正门走去。","或许是因为刚才四处走动，明明有风，我却觉得有点热。","天空蔚蓝得令人火大。","换作平常的我，大概会觉得天气很好吧。然而，现在的天空愈蓝，我只会愈生气。","轻轻吐出一口气。","还是再找一会儿吧。宫城应该在校园内的某个角落。我于是向右转，边走边四处张望。这时，一张不陌生的脸映入眼帘。","「啊！」","我反射性地大叫。","周身的气质不太一样，但绝对是她。","「宇都宫！」","「……咦？咦咦！仙台同学？」","我奔向迎面走来的宇都宫，抓住她的手臂。","「怎么了？仙台同学为什么在这里？」","宇都宫惊讶地睁大眼睛。","果然啊。","宫城没把和我合租房子的事情告诉宇都宫。","她要是知情，看到我就不会这么吃惊了。","宫城说她有把同居的事告诉宇都宫，但我不觉得她会实话实说。结果真的是这样。","「我在找宫城。」","尽管有些过意不去，我还是搬出宫城的名字。","「你说的『宫城』，是指志绪理？」","「对，就是那个宫城。她该不会借住在你家？」","「……仙台同学为什么要找志绪理？」","「你没听说吗？」","「你是指哪件事？」","宇都宫一脸狐疑，没能进入状况。","宫城绝对会生气吧。","都高中毕业了，没必要再向宇都宫隐瞒我跟宫城的关系。宫城似乎想瞒着她，可是这件事不说，话题就没办法延续下去。就算会演变成麻烦事，让宫城伤透脑筋，那也是她自作自受。谁教她欺骗宇都宫，又不回我讯息。","「我和宫城住在一起。看来她没有说呢。」","我朝宇都宫粲然一笑。","「我不知道这件事……你说『住在一起』，是和志绪理住在一个屋檐下？」","「是啊。」","「真的吗？」","「真的。」","「志绪理说自己跟亲戚同住。」","宇都宫皱起眉头，随即叹了口气继续说道：","「……该说听起来不像实话吗？她表现得很不对劲，所以我觉得应该不是亲戚。没想到和她住在一起的人是仙台同学。」","「宫城说她和亲戚住在一起吗？」","「对。」","这是合理的藉口，却也是会被立即戳破的谎言。","实际上，宇都宫现在就发现了。","「仙台同学为什么和志绪理住在一起？」","宇都宫提出那个理所当然，同时也是我最不想被问到的问题。考虑到我和宫城高中时期的关系，不难理解她发问的意图。但我不知道该怎么回答，实在没资格批评宫城那个会被立即戳破的谎言。","「因为我们是朋友啊。」","「虽然当初不相信，但我高中时问你跟志绪理是不是朋友，仙台同学那时回答『不是』吧？」","「我说过吗？」","我当然记得，但如果承认宇都宫的话，事情会变得更复杂。","「你有。」","「哎呀，无所谓吧？就当我们是朋友。」","我现在没有余力去思考合理的藉口，也想不到其他能解释我和宫城同居的理由，所以不能在这里退缩。我朝宇都宫挤出灿烂到不能更灿烂的笑容。","「那让你们感情好到能一起住的契机是什么？二年级同班时，仙台同学跟志绪理看起来不像有深交。」","宇都宫语气认真地询问，我则犹豫着该怎么回答。不只现在，宫城高中时应该也没有把我们的事情告诉宇都宫。光凭几个秘密不至于摧毁宫城和宇都宫的友谊，但若她们的关系因此出现裂痕，那就太对不起宫城了。","「我某次在书店买书时忘了带钱包，宫城当时先垫了。我们就是因为这件事才变好。」","「我还是第一次听说。只是借个钱，感情就会好到能一起住吗？」","凭空捏造的谎言脆弱不堪，混入些许事实能让谎言更稳固，不容易被拆穿。","但这个方法仅限微小的谎言，无法用来解释「我们原本毫无交集」这件事。宇都宫显然不愿接受这个无伤大雅、以「混入事实仍破绽百出的谎言」编织而成的答案，进一步要求更详细的说明。","「这个嘛～剩下的你问宫城吧。」","宇都宫是宫城的朋友，要说到什么程度应该由宫城决定。若再多做解释，破坏了她们的关系，我也会很伤脑筋。总之，这种麻烦事就交给宫城，我要完成自己原本的目的。","「先把话题拉回来，宫城借住在你家吗？」","「刚才的问题我可以去问志绪理，也不介意回答仙台同学的问题。但你可以先放开我吗？」","「啊，抱歉。」","我放开宇都宫的手臂。","因为不想让她跑掉，我反射性地抓住对方的手臂。仔细想想，她又不是宫城，不会一看到我就逃走。","「志绪理的确借住在我家……她『吵架的对象』原来是仙台同学吗？」","「吵架？」","突然冒出一个没印象的词汇，我忍不住反问。","「志绪理说自己跟同居人吵架了，拜托我让她借住几天。」","宇都宫试探性地说，同时紧紧盯着我。","想在别人家借住好几天，自然需要能说服对方的理由。可想而知，宫城无法将我们之间的事原原本本地告诉宇都宫。虽然不晓得宫城是如何解释我们吵架的原因，我还是决定配合她的说词，延续对话。","「唉，算是吧。因为无聊的小事起了口角。」","「你说『起口角』，是和志绪理吗？」","宇都宫好像很惊讶。","成功用「无聊的小事」带过吵架原因了，但我似乎不该用「起口角」这个说法。","「没错，和宫城。」","「我原本就无法想像志绪理吵架的模样，更想不到她会跟人起口角……你们到底是什么关系啊？」","明明说好之后再问宫城，她又抛出麻烦的问题。","可是比起质问，我更在意宇都宫说的另一件事。","在我的认知里，与宫城吵架再正常不过，宇都宫眼中的宫城却不是这样。这表示我所认识的宫城和宇都宫认识的宫城不一样。虽然早就知道了，可是从宇都宫的发言中察觉，心底还是浮现一丝优越感，以及些许焦躁。仿佛有人徒手触碰心脏表面，一股躁动不安的情绪即将在体内扩散。我不禁握紧双拳。","「只是普通的室友啊。比起这个，你可以帮我转告宫城，叫她早点回来吗？」","「志绪理今天有来上课，你应该直接跟本人说。如果你愿意在这里等，我可以叫她过来。还是你要跟我一起去找她？」","「这两种办法都行不通吧。宫城只要看到我就会逃走。可以请你劝劝宫城，说服她回家吗？」","「……你们吵得那么凶吗？」","「嗯，算是吧。」","「既然这样，你们更应该当面谈谈。」","宇都宫真善良啊。","她并未完全采信这套说词，但明显很担心我。","「我只能想像宫城逃走的未来。」","「那来我家谈呢？志绪理说她今天也要住下来。」","如果是在宇都宫家，宫城大概避无可避。但我也想像不到什么好结果。","宫城的谎言已经被戳破。若在这种情况下碰面，事情一定会变得很棘手。而且，我也不确定自己能否用从前那副表情面对宫城。","「真能这样就好了，可是我接下来得去打工。我在当家教，不方便请假。所以，如果宇都宫能帮忙转告，我会很高兴。」","我讲出不是谎言的理由，拜托宇都宫帮忙说服宫城。","「仙台同学在当家教吗？跟我对你的印象有点落差。」","「是吗？我其实很擅长教人功课喔。」","「那等你结束打工再来我家如何？」","「会很晚喔？」","「没关系。」","宇都宫干脆地应下，随即说出住址。看来我没有「不去」的选项。心中只有不好的预感，不过在宇都宫面前，宫城的态度应该不会太差。","「谢谢。别告诉宫城我会去。还有，保险起见，先给你我的电话号码。」","我决定在打工结束后去宇都宫家，并和她交换了联络方式。","〔本话含插图〕"]},{"t":"第2话　与仙台同学的归途","p":["「志绪理，你真的不回去吗？」","舞香坐在桌子另一侧，原本投向手机的视线移到我身上。","「嗯。」","我已经在舞香家住了好多天。她非但没有赶我走，还总是温柔地出言关心。","我不能一直依赖体贴的舞香。","应该早点回去。","我当然很清楚。","可是我今天也不想回去。","周一时，我单纯是因为周日发生的事太尴尬才逃出来。现在不一样了。没回去的这段时间令我更难面对仙台同学。","「跟你吵架的人应该也很担心喔。」","「我知道。」","仙台同学今天也有传讯息来问我什么时候回去。手机里所有来自她的讯息都充满担忧。每次看到她的讯息，我都觉得自己应该回家，还开始在意仙台同学是如何度过我不在的每一天。","她想必会一如既往地去学校上课、和朋友聊天。这样才对，可是我希望她变得和平常不一样。今天的家教打工最好也请假别去。","我讨厌有如此想法的自己，觉得应该早点回去，但又回不去，因此更讨厌自己。也讨厌这个心里想着『不能再麻烦舞香了』，却持续给她添麻烦的自己。","「你这么不想回去，真的只是吵架吗？」","舞香盯着我看。","「只是吵架。」","撒了一个谎，就得为了保护它说更多谎话。想到我至今对舞香说的种种谎言，以及往后将持续累积的谎言有多沉重，我就觉得至少该告诉她——我的室友是仙台同学。可是想说明这件事而不触及其他问题，简直难如登天。","「志绪理。」","「什么事？」","「……你没有什么话要对我说吗？」","舞香的口吻特别认真。","「没有啊，为什么这么问？」","伴随这新的谎言，我喝了一口柳橙汁。","「没什么。唉，到时候还是要把话说开喔。」","「嗯。」","我知道现在的情况不乐观。也明白若放着不管，我和仙台同学的关系恐怕会就此瓦解。","高中时都是仙台同学在维系我们差点瓦解的关系。","在被我洒了一身爆米花和汽水后。","在我意欲强吻又把她赶回家后。","仙台同学强行缩短了我制造出来的距离。","然而，我这次必须自己拉近距离。","即使今天不行，明天也该回去。","我是这么想的。","喝下一口柳橙汁，我拿起手机。想传讯息给仙台同学，手指却动弹不得，迟迟打不出『我明天回去』这几个字。这时，门铃响起，舞香站了起来。","「啊，来了。我去应门，志绪理待在这里。」","舞香的说法很奇怪，就像在等待某人。","我们没有叫外送，现在也不是宅配的寄送时间。","「……你朋友？」","「以后或许会是吧。」","现在不是朋友，往后可能变成朋友的某个人。","我猜不出对方的身份。再说，现在这时间，不熟的人应该不会来访。","这间套房不存在隔间，稍微挪动身体就能看见玄关。就在我变得在意而微微起身时，耳畔传来熟悉的声音。","「我马上就回去，所以在这里说就好。」","我反射性地站起来。","隔着舞香，我看到那张不想见却又想念的脸。","「在玄关说话会吵到邻居，进来吧。」","「……那我就打扰了。」","怎么会？","为什么？","仙台同学不可能来这里。","手脚逐渐发冷。","「宫城，我来接你了。」","仙台同学粲然一笑。","「——舞香，为什么？」","面对这难以理解的状况，我看向理所当然地邀请仙台同学进门的舞香。","「我在学校遇见仙台同学，就问她要不要来家里。」","「……咦？」","什么意思？","舞香怎么会在学校遇见仙台同学？","碰面后又为什么演变成邀她来家里的状况？","我完全搞不懂。","这时候要是随便开口，感觉会让不能曝光的事情曝光，害我不晓得该说什么。不对，仙台同学人在这里就表示至少有一件不能曝光的事情曝光了。不清楚事情怎么演变成这样，但还是先假设「我和仙台同学有交集」的事已经曝光了。可以的话，我真想逃离这里，但仙台同学和舞香挡在通往玄关的长廊。","「因为宫城迟迟没有回来。我去学校找你时碰巧遇见宇都宫，就变成这样了。」","「就算你这么说……」","困扰。","这个状况令我非常困扰。","脑袋仿佛自动关机。它拒绝思考，也拒绝接受现况。","「我在学校被仙台同学搭话，听说她在找志绪理就让她过来了。我不晓得你们之间发生了什么，先谈一谈吧？」","舞香说得理所当然。","我试着整理从两人口中陆续吐出的情报，依然无法顺利连接。能够理解的，只有「不该同时出现的两人如今凑在一起」这个令人难以接受的事实。","「……舞香，你根本没说仙台同学会来啊。」","「是我拜托她不要说的。如果知道我会来，宫城早就不见人影了吧？」","当然啊。","如果知道仙台同学会来，我当然不会待在这里。现在也巴不得逃走。","居然预测我的行动，还不准舞香说，实在太过分了。","不确定有哪些事情曝光，又曝光到什么程度。可以的话，我原本希望能自己告诉舞香。","——虽然不知道那会是什么时候。","「详情我之后再跟你说，先回家吧？」","仙台同学仍挂着微笑说道。","我也觉得自己应该回去，可是大脑跟不上状况。见我没有动作，仙台同学靠了过来，抓住我的手臂。","「放——」","我反射性地想用强硬的语气逼退她，但又把话吞了回去。这里是舞香家，舞香正看着我们。如果像平常那样大声反抗，不晓得舞香会说什么。","「站着说话不太好，进来坐着说吧？」","舞香的语气轻柔，像要舒缓我和仙台同学之间那股难以言喻的气氛。语毕，她坐下来接着说：","「不过志绪理很过分耶。居然骗说你和亲戚住在一起。而且这也表示，我高中时问你和仙台同学是不是很要好，你那句『没特别好』也是骗我的嘛。」","「……对不起。」","舞香嘴上嫌我过分，声音却很温柔。然而，那番话深深刺进我心里。","看来「我和仙台同学是室友」一事曝光了。我想知道她还从仙台同学那里听说了什么，但考虑到我至今撒下的谎言，现在必须先道歉。我觉得自己不管道歉几次都不够，可是谎言被以出乎意料的方式揭穿，一个万万料想不到的人也在场。这让我没办法好好说话。","「哎呀，我其实有很多话想说，但那些可以之后再谈。总之，你们先坐下吧。」","我无法拒绝舞香，只能乖乖坐下。仙台同学也静静地坐到斜对面。舞香刻意地清了声喉咙。","「那么，你们现在就在这里言归于好吧。」","「咦？」","话题朝着我完全没想过的方向进行，我不禁惊讶出声。","「用不着这么惊讶吧？志绪理，你和仙台同学吵架了吧？」","经她确认似的一问，我顿时想起自己曾撒下的谎，于是点点头。","「我找仙台同学过来就是要让你们和好。不管是要促膝长谈还是怎样，两个人握手之后再一起回去吧。」","「咦？要握手吗？」","这次换仙台同学惊讶地开口。","「开玩笑的，但你们要相亲相爱地一起回去喔。志绪理要是就这么住下，我也很伤脑筋呢。」","舞香看着我微微一笑。","心情因为她营造出来的和谐气氛而平复许多。同时，我也有点害怕这股气氛可能随时瓦解。","「你们就算要谈很久，我也不介意喔。仙台同学要不要喝点什么？」","「谢谢。不过我没打算久坐，不用了。口渴的话，我喝宫城的就好。」","「才不给你喝。」","我斩钉截铁地说，将剩下的半杯柳橙汁挪到自己面前。但仙台同学理所当然地说着「给我一口喔」便喝了我的柳橙汁。平时碰到这种情况，我一定会抱怨，可是在舞香面前也不好发作，只好忍下来。","「宇都宫是作风比较强硬的那种人吗？」","仙台同学放下玻璃杯，看向舞香。","「平常不是这样，但我这回只能采取强硬的手段吧？尽是些第一次听说的事，害我完全摸不着头绪。虽然是我自己找仙台同学过来的，但谁能来解释现在的状况？假使跟高中时的我说这些成员某天会聚集在家里，她一定不会相信。」","「任谁都无法想像现在这幅景象吧？」","仙台同学这么说，舞香回了句「是啊」。眼前脱离现实的情景让我开始头痛。尽管这是自己说谎招致的结果，我还是不想面对。","「宫城，今天就回去吧。你有什么想说的，我可以在家里听你说。」","我无法忍受这股看似和乐融融，实则尴尬至极的气氛，但也不想回家。","「志绪理，你不回家也行，但如果今天想住下来，我会质问你一整晚喔。」","「听见没？宫城，你打算怎么办？」","突然出现的终极二选一。我在舞香的注视下喝光杯里的柳橙汁。","「……我回去。」","我不得不做出选择。闻言，仙台同学站了起来。","「宇都宫，谢谢你，帮大忙了。」","舞香回了句「别客气」，随后将行李递给我。既然已经做出选择，我就不能不回去，所以跟着站起来。","「我今天先回去喽。之后可以再跟你联络吗？」","仙台同学语气熟稔，舞香也用同样的态度回她「可以啊」。无论她们是真的变得亲近，还是表面上说说客套话，这都不是什么有趣的事。感觉仙台同学被舞香抢走了，舞香也被仙台同学抢走了。","我闷闷不乐地和仙台同学一起走向玄关。仙台同学再次道谢后穿上鞋子。我也对舞香说：「抱歉在你这里借住了好几天，谢谢。」仙台同学走到外头，我也拿着包包准备离开。这时，舞香叫了声「志绪理」，拉住我的衣服。","「今天就不问了，可是你之后要告诉我为什么跟仙台同学住在一起喔。」","可以的话，我希望她这辈子都不要问。","想是这么想，但舞香不会善罢干休。","「……好。」","我把「我不想说」吞回肚里，离开舞香家。","我和仙台同学走在这几天和舞香一同走过的路上。","若要用一个词来概括这一天，没有比「自作自受」更恰当的了。","路灯照亮了夜路。然而，临别时舞香说过的话不时闪过脑中，我感觉自己正被黑夜包裹。造成如此局面全要怪自己说谎。知道归知道，我还是忍不住抱怨。","「仙台同学，这是怎样？」","「你指哪件事？」","「你把我们住一起的事告诉舞香了吧？」","「我的确说了。不能不说啊。」","「明明说好不能把我们的事情告诉其他人。」","「那个约定仅限于高中时期。」","仙台同学如此说道，没有看过来。","明明走在身边，她眼里映出的却不是我。","「就算有时限，擅自把我们同居的事说出去还是很过分啊。」","我知道这是迁怒，可是一想到下次和舞香见面的情景，嘴巴就不由自主地动了。","「过分的是宫城吧？一直不回来，不说自己去了哪里，还几乎无视我传的讯息。担心得跑去找你也是在所难免吧？而且你自己说有把同住的事情告诉宇都宫。你都这么说了，我当然会去找宇都宫问你的行踪啊。」","仙台同学说得没错。","我的室友是谁？","因为我对仙台同学说自己有把这件事如实地转告舞香，她以此为前提行动并无不妥。可是仙台同学一定不觉得我有老实告诉舞香。既然都猜到我在说谎，她自然不需要把我们同住的事情告诉舞香。","当然，不管找多少藉口，一切都是我的错。","我不该责怪仙台同学。","关于这点，我非常清楚。","不该抱怨或
