九月后，第一次找仙台同学来的那天，她帮我绑了头发。","然而那并非我感到不对劲的原因。","我望着仙台同学的头发。","仙台同学穿制服时的发型固定跟今天一样是公主头，所以现在的她是「平常的仙台同学」。但暑假期间的她大多没绑头发，导致记忆有些混淆，我想就是这点让人觉得不对劲。","「不用管我的头发。倒是妳把头发解开啦。」","「为什么？」","「没为什么，这是命令。而且只是解开而已，很简单吧。」","仙台同学说着：「是没错啦。」同时解开头发，或许是因为一直绑着，那头比我更偏棕色的头发解开后也不是直的。虽然和暑假时不同，带着一点弧度，不过在我心中，当时和现在的印象恰到好处地融合在一块。","「接下来只要像平常那样就好。」","我没有其他想命令仙台同学的事，便把剩下的时间全丢给她。","「像平常那样是怎样？」","「随便说点什么啊。」","「随便……所以说什么都行吗？」","「都可以。」","「这样喔。」","仙台同学「嗯～」地思考着。","在她陷入沉思之际，我的意识飘向暑假期间的记忆。","八月三十一日。","暑假最后一天，我们做了跟平常不一样的事。","我不记得有在心中的月历上做记号，要自己别忘记那天的事，尽管如此，暑假的最后一天仍残留在我的记忆中。她明明没有推倒我，我也不是自己躺下的，背却靠在地板上，视线范围内全是仙台同学。她以嘴唇触碰我，手也碰了我……简单来说，就是我们差点打破「不上床」的约定。","「那我问妳一个问题。」","仙台同学开朗明快的声音，把我从暑假的记忆拉回现实。","「宫城要考哪所大学？都到这个时候了，不可能还没决定吧。」","虽然说都可以，但这实在不是什么好问题。","听到这个不太想被人询问的话题，我下意识地皱起眉头。","她八成知道我不想聊这个，却还故意问我。","「是宫城叫我说点什么的嘛，回答我啦。」","之所以没来由地难以启齿，其实是因为志愿的大学我是随便选的。报考的学校倒没有需要特地隐瞒，况且就算不说，她也迟早会知道。","我一边后悔自己没有限定话题范围，一边说出本地的大学名称。","「仙台同学呢？」","我没有特别想问，然而要是不问，话题就无法延续下去。","「外县市的大学。」","仙台同学语气冷淡地表示，接着补上学校名称。","「妳这话是认真的？」","她所说的那所学校，可不是脑筋好一点就能考上的。据我所知，这所高中至今从未有人考上那所大学，即使是仙台同学想必也考不上。","「骗妳的。虽然以那里为目标，但我绝对考不上嘛。」","她灿烂地笑着说。","「原来妳以那里为目标啊……」","「我也知道考不上就是了。」","本以为她在说笑，然而从她没有否定我的话来看，似乎真的打算去考。我不知道她为什么会以那种大学为目标，不过毕竟她很认真地补习，现在依然希望自己能考上也说不定。","「这件事情我只有告诉宫城，不可以跟其他人说喔。」","「我不会说的。再说我们约好不能把这里的事告诉其他人了吧？」","「说得也是。」","这还真是让人困扰。","只属于我们两人的秘密早就够多了，不需要更多。秘密越多便越沉重，让人难以动弹，会有种自己无法离开仙台同学眼前，哪里都去不了的感觉。","「那实际上妳要考哪间？」","意图稀释无意间听到的秘密，我姑且一问，结果仙台同学又说了一所外县市的大学，是她应该考得上的大学，看来是实话没错。","即使如此——","虽说考量到她的成绩根本理所当然，我早就设想过大概会是这样了，然而从本人口中听到她要去念外县市的大学，我的心情依旧不太好。","我很在意与仙台同学共享新的秘密，不过眼下她实际要报考的大学更占据了脑海，仿佛一并削去了心中的一隅，让人莫名烦闷。","「喂，宫城，跟我考同一所大学嘛。」","她若无其事地推了个难题给我。以我的成绩来说，那并非能轻松考上的大学。","「不要随便说这种话啦，我怎么可能考得上？」","「没那回事。」","「我不想特地报考会落榜的学校。」","「不去考怎么知道会不会落榜？就算低空飞过也行啊。再说妳最近有认真念书，感觉再努力一点就能考上了吧。」","「上同一所大学又没意义。」","「或许是这样没错，可是能考上的话，上好一点的大学比较好吧。」","「我绝对考不上。」","我从未想过要特地努力考上好大学。","况且和仙台同学共度的时光只到毕业典礼那天。","就算上同一所大学也没用。","她应该同样很清楚这点才对。","而她要到外县市，对我来说也无关紧要。","没错，我完全、丝毫不在意。","「别再提这件事了。下一个命令——」","尽管没什么想下的命令，但我不想一直延续这个聊未来出路的无聊话题，只好想想有什么现在就能做的命令。","「妳还有命令要下喔？」","「对，听我的话。」","「悉听尊便。」","仙台同学说着，却毫不掩饰脸上那还没讲够的表情。","我开始思考。","命令、命令……无关紧要的命令。","虽然想着有什么可以打发时间的命令，我却想不到，尽管如此，也不能都不说话。要是不赶快说点什么，仙台同学又会开始说些多余的话了。","我阖上课本，自眼前的仙台同学身上瞥开视线，环顾房内——床、衣柜、五斗柜……随着书架映入眼帘，我总算决定好命令。","「朗读一本书。」","「可以啊，要朗读哪一本？」","「内容感觉很枯燥的书。」","「不是内容感觉很有趣的？」","「枯燥的书比较助眠。」","「原来如此。」","意识到我要她以朗读代替摇篮曲，仙台同学站起身来，走近书架前，毫不犹豫地拿了一本书过来，坐到床边。","「这本行吗？」","记得她拿来的那本小说是因为漫画的主角说喜欢，我才会买回来的，然而感觉不太有趣，我没有看完。","「就那本。」","我坐上床，命令仙台同学。","「知道了。」","纤细的手指翻开一直沉睡在书架上的小说。","从有着枕头的这边，可以看见侧坐在地上的仙台同学侧脸。","翻动书页的声音响起，接着传来嗓音，她正朗读着我不觉得有趣的故事。","过去我曾下过无数次这样的命令，仙台同学也和之前一样流畅地朗读着小说，不大也不小的音量，对这个房间来说刚刚好，柔和的嗓音相较于我在教室听到的更悦耳，总觉得相当好听。","解开两颗衬衫扣子，朗读着小说的仙台同学，跟暑假前没有任何不同。","毕竟不知道她朗读的小说到底哪里有趣，照理说我应该马上就会想躺下，产生睡意，今天却不像平常那样想睡，甚至不想躺下来。","不是仙台同学的错。","问题大概出在我身上。","帮我绑头发的那天，我曾告诉她在这个房间里和她共度的时光，到毕业典礼那天就会告一段落。","因此一旦毕业，就听不到这个声音了。","这是我自己决定的。然而仙台同学说出「外县市的大学」，使她毕业后会前往远方这点成了明确的事实，导致我突然在意起这种小事。即使得知以后就算想在路上巧遇她都不可能，我的大脑却无法理解。","「妳不睡吗？」","无聊的故事突然中断，转而讲起一直坐在床上，不肯躺下的我。","「我会睡的。妳继续吧。」","就连睡魔的气息都感觉不到。我一在床上躺下，仙台同学的手便伸过来，毫不犹豫地摸了摸我的头发。我推开她的手。","「妳继续朗读啦。」","她没有回话，但中断的故事再度传入耳中。","通透的嗓音搔着我的耳朵。","因为不困，我没闭上眼睛，望着仙台同学。","头发遮住她姣好的脸庞，十分碍事。","早知道就别叫她解开头发了。","我凑向坐在地板上的仙台同学，她的声音变得更近了些。","视线定在她解开的扣子上。","现在虽然只能稍微看见锁骨，但我曾看过那之下的部分。","比现在更热的暑假。","我命令仙台同学脱衣服，她乖乖地脱了。","尽管那是仙台同学要我下的命令，然而往后不会再发生那种事，我不再有机会看见她的身体。","无所谓。","不管是要上不同的大学，还是不会再看到她的身体，都与我无关。","大学那种地方，感觉比她正在朗读的故事还要无聊。","我将手伸向仙台同学，拉了拉她的头发。","「妳在看哪里呀？」","本以为她会开口抱怨喊痛，她却说出不一样的话。","「因为仙台同学在那里，我才会看着妳。」","我讲出不算精确的事实，听见她狐疑地说了句：「是喔？」但她没再多说什么，把小说放在床上后转向我，轻轻叹了口气，接着拉扯我的浏海。","「闭上眼睛啦，妳不是要睡觉吗？」","她的手遮住我的眼睛，原本明亮的房间暗了下来，变得什么都看不见。我抓住并拉开她盖在我眼睛上的手。","仙台同学就在视线前方。","明明没打算这么做，视线却对上她的眼睛。","——好近。","彼此之间的距离比刚才缩得更近了。","我连忙松开抓着她的手，结果碰到放在床上的小说，书「啪」一声掉在地上，她却没打算捡起来。","「仙台同学，离我远一点啦。」","「是宫城先靠过来的吧？」","先靠近的人是我。","我承认。","然而我不记得自己有这么靠近她，仙台同学不知为何观察着我。","「即使如此，仙台同学也有靠过来吧？」","「有吗？」","「有。而且妳朗读也不用离我这么近吧？」","我这么说着，轻轻推了她的肩膀，仙台同学却不听我的话。","她的手摸上我的耳垂。","轻柔地抚摸，又捏着拉了拉。","指尖滑过我的耳后，痒得不得了。","仙台同学的手缓缓地继续触碰我，宛如要唤回暑假的记忆。我敲打她的手臂。","「抱歉……」","仙台同学瞬间露出惊讶的表情，旋即道了歉，以W字坐姿坐到地上。","「捡起来。」","我撑起身体，指着掉下去的书，仙台同学于是听话地拿起那本书，迅速翻动书页，停在理应写着故事后续的那页。","「我继续朗读吧。」","她以不带起伏的语调说。","「不用朗读了。」","「妳不睡吗？」","「不睡。」","正确来说是「睡不着」，不过没必要告诉她正确的内容。我从仙台同学手中抽走那本书，放到枕头上。尽管尚未写完的作业就这样被丢着不管，但我没有下床，手上空空如也的仙台同学也没回去桌前。","由于命令做到一半就结束了，房里变得异常安静，沉默感让人不太舒服，无法静静地坐着。我忍不住想做点什么，于是用指尖敲着书。","房里只听得到微弱的「咚、咚」声。","仙台同学往床舖这边靠来，背倚着床。","从床上可以望见她平常看不见的后颈。正想着只要伸手就能碰到之际，仙台同学像是灵光一闪，说了句：「对了——」之后继续说道。","「宫城，你们班决定好校庆要做什么了吗？」","她的口中突然冒出下个月学校预定举办的活动。我跟上她的话题。","「还没。仙台同学你们班呢？」","「我们班的人都没什么干劲，应该会以成果展之类的形式混过去吧。」","「真好。」","突然开始的对话远比彼此沉默不语来得好，话题就这样延续下去。","既然可以聊这种安稳的话题，真希望她能早点这么做，比烦人的考试话题好多了。即使气氛依旧有些尴尬，却相对接近我们平常的感觉。","「宫城你们班不是这样吗？」","「班上的大家都很积极，说这是高中最后一次的校庆，想做些能留下回忆的事。」","我只觉得有够麻烦。","说是大家，实际上是一半的同学兴奋地讨论着要做些什么，剩下的人虽然觉得随便做做就行了，然而那些在班上特别招摇的人成了主导活动走向的中心人物，导致其他人都不敢开口抱怨。","「大家都很积极……宫城也是吗？」","「还好，我觉得随便做做就行了。」","「我们班很轻松喔。」","仙台同学转头笑着说。","要是我们同班就好了——","我差点对着她温柔的笑容这么说，赶紧闭上嘴。","「差不多该继续写作业了吧？」","仙台同学往桌上看了一眼。","「我不想写。」","「要我继续朗读吗？」","「……还是写作业好了。」","「那妳过来这边。」","「不用妳说我也会过去。」","爬下床的我犹豫了一阵后，坐到仙台同学对面。","要上大学——","仙台同学暑假前就曾这么说过，即使没问，我也觉得她想上的八成是外县市的大学。","不过是从她口中听到早就预料到的事。","就只是这样。","我却依旧受到了一点冲击。","正确来说是，明明听到了一如预期的事，我却满脑子都想着它，没想到自己会有这样的反应。","仙台同学之所以会想到外县市，从我在暑假时造访她家看到的状况便推测得出来。","想离家。","我想大概是这样吧。","假设这个理由没错，我便无法改变她的志愿。","不对。","不是的。","我倒不是想改变她的志愿，再说即使改变也没意义，高中毕业后，我们之间的关系就结束了。追根究柢，她的志愿该由她自己决定，并非我该插嘴的事。","这些事我心知肚明，却在仙台同学回去之后动弹不得，始终坐在她刚刚坐着的地方。","我们没有一起吃晚餐，因此我还没吃饭。","可是我不饿。","我慢吞吞地站起身，拿着换洗衣物走向浴室。要是悠哉地泡在浴缸里，感觉会一直想些无谓的事，我于是冲了个澡，躺到床上。","照这样下去，我会考上作为志愿的本地大学，成绩没办法跟仙台同学上同一所大学，但我本来就没把考上好大学当成目标，所以没差。","说起来，根本就是仙台同学管我管太多了。","明明没试着了解我真正的成绩，却随口说出要我跟她上同一所大学这种话。虽然要是提出我想念外县市的大学，爸爸多半会同意，然而以现在的成绩来看，我绝不可能跟仙台同学上同一所大学。纵使将我们暑假时一起念书这件事也考虑进去，想必依旧有困难。一旦看到下个月的期中考成绩，仙台同学也会说我不可能考上吧。","报考根本考不上的大学不过是徒劳。","「……为什么我要认真思考这种事啊？」","我一个翻身，关上灯。","爸爸今天也没有回来。","想到不只是这个房间，这个家里所有的灯都关上了，我就有些不安。","「没事的。」","一点都不恐怖。","我在心里喃喃自语，闭上眼睛。","或许是因为比平常早上床吧，我一点都不困，却依旧紧紧闭着眼。","一只羊、两只羊……","我试着仰仗老派的手段，开始数羊，可是睡魔依然没有袭来。结果我始终没能深深睡去，就这样半梦半醒地迎接早晨，无可奈何地前往学校。","就算走进教室，睡眠不足的脑袋还是浑浑噩噩的。","开始上课后，不管过了一小时或两小时，脑袋依然茫茫然，仿佛蒙上一层雾气，记不得老师说了些什么。待我回过神来，已是第三节课的下课时间，与亚美一起过来找我的舞香出声叫我。","「志绪理，要走喽。」","「咦？」","「下一堂课要去视听教室啊。」","舞香这么说完后，亚美便接着说：「快点、快点。」","「啊……嗯。」","我连忙抽出课本和笔记本，站起身来，还没空确认有没有忘记带什么东西，舞香就说：「好了，动作快。」一把抓住我的手臂。我和她们一同离开教室，缓缓迈步在走廊上。","我不会早睡早起，却几乎没发生过这种因为睡不着导致睡眠不足，恍神得虚度整个上午的情况。","之所以这么提不起精神，全都要怪仙台同学。","都是因为她说出宛如要决定别人未来志愿的话，才会害我困得没办法好好上课。","实在让人生气。","我有点迁怒地大步往前走，走廊上传出「哒」的脚步声，让我迷茫的脑袋稍微清醒了些。又用力地踏出一步后，耳边传来舞香的声音。","「志绪理，前面、前面。」","「前面？」","「这边啦！」","舞香拉了我的手臂。","我的身体微微往旁倾斜，原本集中在脚上的注意力转向前方。","就这样和仙台同学对上眼。","——咦？仙台同学？","为什么？","不对，这没什么好奇怪的。","我在学校，仙台同学出现在走廊上当然很合理，只是以前从未发生过在发现之际，距离仙台同学已经这么近的这种事。理所当然和并非理所当然的事同时发生，使我吓了一跳，撞上仙台同学的肩膀。","「哇！」","彼此的肩膀不是从旁轻轻擦过，而是直接撞上，所以很痛。由于被舞香拉住，我没办法好好支撑自己而差点跌倒，顿时惊呼出声。","「志绪理，没事吧？」","舞香撑着摇摇晃晃的我问道。我看向她。","「我没事。」","重新站稳的我回答她。","将视线从舞香移回仙台同学身上后，茨木同学与她的朋友也一并进入视野范围内。","「叶月，没事吧？」","「嗯，我没事。」","一如刚才舞香跟我的对话，茨木同学也对仙台同学说出类似的话，我的目光无法从她身上移开。","——仙台同学旁边是我的位置。","这样的台词浮现在脑海中，我试图挥去这句话，却听见熟悉的声音说：「对不起喔。」","「妳没事吧？」","仙台同学以在我房间里鲜少出现的亲切语气这么说，紧盯着我。","我不擅长应付这样的她。","只得从她身上瞥开视线。","「……没事，我才该道歉，刚刚有点恍神。」","若要说起这究竟是我还是仙台同学的错，责任一定出在我身上。","我面朝前方，却没有看路。","也没注意到朋友出声提醒我快撞到人了。","尽管追溯理由的话，追根究底仍得归咎于仙台同学，但我不能在这种场合下说。","「妳没事吧？」","我莫名叫不出「仙台同学」，对她说出当下早已出现过好几次的话。","「没事。我帮妳捡东西喔。」","她这么说着，捡起掉在走廊上的课本。看到那本课本，我这才终于意识到自己手上没拿着课本和笔记本。","「对不起，我自己捡就好。」","我蹲下来拾起笔记本，接着伸手要拿铅笔盒，仙台同学却抓住我的手腕。","「我帮妳。」","她语气温和地说着。","不肯放开抓住我手腕的手。","用力得让人觉得痛。","「我自己捡就好。」","假如这里是我房间，只要大喊「放开我」就好了，然而这里是学校，我选择相对和缓的说法，要她放开我的手。","「啊，抱歉……」","用力抓着我手腕的手松开了。","「这就是全部了吗？」","仙台同学一边将捡起来的课本递给我，一边问。","「嗯，只有这些。谢谢妳。」","「不客气。」","仙台同学粲然一笑，露出犹如精美娃娃般的笑容后迈步离去，随即消失在眼前，走廊上只听得见茨木同学的说话声。","我拍了拍课本和笔记本，也顺便拍了拍铅笔盒，对舞香和亚美说：「走吧。」","「——妳对仙台同学做了什么吗？」","舞香狐疑地望着我。","「什么是指？」","「她不是猛盯着妳看，还抓住妳的手？难道不是因为妳做了什么吗？」","「应该是觉得很痛才会那样吧？毕竟我刚刚撞得满大力的。」","我不觉得她有那样盯着我。","然而方才被她抓着的手腕很痛。","上头没有留下痕迹。","不知道仙台同学为什么会做出那种事。","我看着刚才被抓住的手腕。","跟我撞上仙台同学之前没有任何不同。","我胡思乱想着——要是有留下什么不会消失的东西就好了——叹了口气。","〔本话含插图〕"]},{"t":"第2话　宫城太不懂得什么叫客气了","p":["感觉这是我第一次在学校和宫城说话。","之前虽然曾把宫城叫出来，在音乐准备室和她说过话，不过那比较接近待在她房间里的状况。然而刚刚不一样，我们首度在朋友面前有了段像样的对话。","这其实没什么大不了的，但我认为是件大事，不禁觉得自己不太正常；明明不需要回头，我却想要回头。","「叶月，妳好像心不在焉耶，真的没事吗？」","听到羽美奈意外大声的询问，我望向身旁。","「抱歉，我在想些事情。」","「等等又会撞到人喔。」","我对轻松大笑的羽美奈说了句：「确实。」继续迈步在走廊上。","即使竖耳倾听，也听不到宫城的声音。","传入耳中的只有羽美奈和麻理子的声音。","「刚才那女生，记得……是叫宫城？妳跟她感情很好吗？」","羽美奈看似回想起来地说。","「是宫城没错，不过我跟她感情没特别好喔。」","「妳们暑假的时候不是走在一起吗？」","「妳说跟谁？」","「宫城啊。」","「妳认错人了吧？」","我很习惯说谎，所以这话说得很顺。","「我不觉得自己会认错叶月耶。」","羽美奈或许相当有自信，继续咬着这个话题不放。","「当时是在奇怪的地方看到妳们的，我记得很清楚。」","这么说着的她随后讲出的车站名，正是我和宫城暑假时去过，两人为了玩假扮朋友游戏而去看电影的地方，因此她看到的毫无疑问是我和宫城，不是认错人。","「这么说来——」","在我们正好走到教室前面时，为了修正方才的谎言，我用回溯记忆般的语气缓缓说道。","「我亲戚家在那附近，所以我曾去过那里一趟，当时碰巧遇到了宫城。」","「真难得，叶月也会忘记发生过的事啊。」","一直默默听我们对话的麻理子看着我说，语气开朗而明快。","「我也是人嘛，还是会忘记一些事情的。」","我笑着走进教室，接着传来羽美奈不高兴的声音。","「叶月跟宫城的感情到底好不好是不重要啦，但我怀疑妳就是因为她，暑假才会那么难约。」","羽美奈坐到位子上，以怀恨在心的眼神望向我。我没走向自己的位子，就这样继续跟她聊着。","「我不是说过暑假得去上考前冲刺班，所以不太能和妳们碰面吗？是说妳为什么会去那里啊？」","「跟男朋友约会。」","「跑到那种地方？」","「我们聊到偶尔想去点不一样的地方啊。那附近不是没有我们学校的学生吗？所以才会特地跑远一点。」","起了反效果呀……","明明特地和宫城挑了个照理说不会碰到熟人的地方。","没想到羽美奈也抱着跟我们一样的想法跑到那里。","「你们感情还真好，好羡慕喔。」","笑了笑的我接续话题。大概是「好羡慕喔」这句话说对了吧，羽美奈的心情稍微转好。虽然她似乎不打算深究我和宫城的事，我却不希望她想起话题的开端，依然面带微笑地跟她聊着男朋友的话题。而她或许已经不在意宫城了，开始说起和男朋友那天去了哪里，吃了些什么。","我倒没想过要嫉妒别人的幸福，但对这些事实在提不起什么兴趣，左耳进右耳出地听着羽美奈的说话声。","垂下视线的我看着自己的手。","上头理所当然地没有宫城的痕迹。","「刚刚撞到的时候受伤了吗？」","也许是觉得我一直盯着手很奇怪吧，麻理子探头过来观察我。","「没有，没事。」","「真的吗？」","「妳看，没事吧？」","我挥了挥手给她看。","「及格，这样和男朋友约会时就能牵手了。」","「妳又马上就说这种话，我没对象喔。」","「我知道。妳赶快交一个嘛。」","「即使交了男朋友，我可能也不会跟对方牵手吧。」","「为什么？牵一下啊。」","麻理子一脸疑惑。","「会这么想跟对方牵手吗？」","并未特别针对羽美奈或麻理子，我只是抛出这个问题。","这个问题没什么特别的含意，我也不觉得答案会带来帮助。虽然宫城浮现在我的脑海中，却并非我的交往对象。我从未想过要跟她牵手走在路上，然而只要她在我身边，我就会很在意。","「一般来说都会牵手吧。」","羽美奈这么表示，麻理子也接着说：「一旦约会的话就会牵手吧。」","「我知道了，叶月想要纯洁到连手都不牵的交往吧？」","麻理子促狭地说着，朝我伸出手。我握住她的手。","她与宫城的手没什么差别。","温暖又柔软。","我想羽美奈的手也差不多吧。","可是宫城显然和她们不同。","我没特别想跟她牵手，却想碰她，方才在走廊上撞到她之际也是，回过神来时，我才发现自己抓着她的手腕。这份感情并不像麻理子说的那么纯洁。","「怎么了？难道妳喜欢上谁了吗？」","羽美奈兴味盎然地望着我。","这下麻烦了。","看来就算我说没有，她也会说：「至少有在意的对象吧？」继续追问下去。","「是谁？是谁？」","麻理子愉快的嗓音也传入耳中。我思考着有什么答案能搪塞过去，上课钟声随即响了。","「上课喽。」","钟声在绝佳的时机响起，犹如正义的伙伴般拯救我。才刚回到座位上，老师就走进了教室。","这堂课开始了，教室里响起老师的说话声。","我将黑板上的字抄到笔记本上。","右手在纯白纸张的空白处写下了「宫城」，接着又擦掉。","即使待在学校，也想和她说话。","脑中响起自己的声音，仿佛要将老师的说话声给盖过去。","……我在想什么蠢事啊？","在学校和宫城说话毫无意义可言。说起来就算到了现在，彼此待在她房里时陷入沉默的机会依然比较多。","我把这些杂念赶出脑海，将课本翻到下一页，专注于填满笔记本后，不长也不短、一如往常的上课时间便结束了。我正打算起身和羽美奈她们一起吃午餐，却听见通知收到讯息的声音，于是从书包里拿出手机。","重新坐回位子上的我看向手机萤幕，收到的是宫城一如往常会传来的讯息，填满我放学后的行程。无关乎昨天才找我，她今天再度要我过去，我对此却毫不讶异。","我在走廊上抓住她的手腕。","她应该是想追究这件事吧？","问题在于我无法解释自己在大家面前抓住她手腕的原因。尽管可以说是因为我想碰她，但宫城想必不会接受这个回答，八成会反问我为何想碰她。","我不想把宫城还给她的朋友。","我想触碰她的心情深处蕴藏着这样的感情——怎么可能说出口？虽然这份感情论大小不过就跟金平糖差不多，却非我对宫城该有的感情。","传了讯息给宫城，答应放学后的约定后，我从座位上站起来。","一想到她会追问我在走廊上发生的事就头痛。","真麻烦。","然而见宫城这件事本身，倒是不会让人感到麻烦。","转眼间到了放学后——","我向羽美奈她们道别，走在熟悉的路上，不疾不徐地抵达宫城家。","走进房间的我解开衬衫上面数来的第二颗扣子。","房里的气氛依旧有点怪，但我已经习惯了。","我收下五千圆钞票，背靠着床坐下后，宫城拿来装有麦茶和汽水的玻璃杯放在桌上，接着犹豫了一下，坐到我旁边。尽管距离相比之前有点远，但暑假结束后首度有人在的身旁，让我松了口气。虽然无法让一切恢复如昔，不过逐渐接近原样了。当然也有些不太顺利的地方，然而这也没办法。就算只有表面上也无所谓，一旦表现得仿佛暑假之前，心情便会随之转变。","宫城什么都没说，在桌上摊开课本和讲义。我不知道她到底有没有心念书，但她乖乖地写着讲义。","我也翻开课本和笔记本，开始写作业。","昨天我对宫城说的那句「跟我考同一所大学啦」其实相当不负责任。她表示不可能考上之际，我虽然说没那回事，却也觉得照她现在这样很难考上。","进入暑假后，我们曾一起念书。","宫城开口「这里我不懂」要我教她的次数确实减少了，但我依旧不认为她能达到合格的标准。","然而如果从现在开始认真念书，说不定考得上，这需要本人拿出干劲才行。既然叫宫城报考同一所大学，我自然打算指导她功课，却没办法强迫她。","就算考上同一所大学，也不代表会发生什么。","宫城早已决定好结束这段关系的日子，我也同意。","只是没来由地觉得要是她跟我念同一所大学，好像会很开心。","「仙台同学。」","耳边传来宫城的声音，我抬起头。","「有哪里不懂吗？」","「不是。我想问妳今天那是怎样？」","果然……","宫城之所以会连续两天叫我来——","虽然早就预料到原因，但我仍装出毫不明白的模样。","「那是怎样是指？」","「妳不是在走廊上抓住我的手腕吗？」","「我只是想帮妳把东西捡起来。」","「只是捡东西的话不用抓住我的手腕吧？」","「不过是稍微碰到妳的手而已呀。」","「我觉得那不只是碰到。」","有够麻烦的。","追究这种不想说出口的事，只是徒增我困扰。","况且要是照实说，宫城八成也会感到困扰。","为了彼此着想，不想把宫城还给她朋友这种事还是别说出口比较好。","「……妳希望我回答什么？我会说出宫城希望听到的答案，妳说吧。」","我提出得以和平解决问题的方案。","倘若她有希望我说的话，我就照着说，好结束这个话题。毕竟就算继续谈下去，也不会得出双方都满意的结论，怎样都行，最好赶快脱离这个话题。然而我也知道宫城不会满意这个回答。","「我才不想要妳那样做。」","「那妳想要怎样？」","「告诉我妳抓住我的原因。」","「我只是因为想碰而碰了妳。」","我说出抓住她的一部分原因。","「什么意思？认真回答我啦。」","「我回答啦。」","「妳为什么想碰我？」","这种事情还是别问比较好，才能度过安稳的时光。","「妳明知我不会回答，还故意问我吗？」","为了打断她接连抛出的问题，我提出反问，然而她却没有回答。莫可奈何的我只好抛下一句——","「有时即使没有理由，也会想碰一个人吧。」","这么说着的我把手伸向宫城。","虽然比之前坐得离我更远一点，我仍马上碰到坐在身旁的宫城，抚上她的脸颊，掌心贴了上去。尽管她不悦地皱起脸，我却依旧没有抽开手。自肌肤相触的部分传来的体温感觉相当舒适，我的手滑下脸颊，摸着她的脖子。","总觉得自己现在对她怀抱的感情很不纯洁。","「想碰别人这种事怎么可能没理由？」","「所以宫城碰我时想必是有什么理由的吧？」","「这个——」","宫城一时语塞，没继续说下去，反倒拉开我正摸着她脖子的手。","「真搞不懂仙台同学，不管在学校还是在这里，妳都只会做些奇怪的事。」","压低声音这么说的她垂下视线。","「我也搞不懂呀——宫城，赶快下今天的命令啦。」","再这样下去，我没自信能维持若无其事的样子。我很清楚，自己在宫城面前用来保持理性的那根螺丝根本派不上用场。","纵使表面上恢复如昔，我们依旧没能回复原有的关系。但凡受到一点刺激，刻意维持的表面便会轻易瓦解。","比起就这样顺势发生些什么，让她命令我比较好。反正她多半只会下一些无关紧要的命令，状况应该会比现在理想。","「那让我帮妳打耳洞。」","没抬起视线的她说出「打耳洞」这个词汇，实在太出乎预料，我忍不住反问。","「打耳洞？」","「对，我想在仙台同学的耳朵上打耳洞。」","莫非是想报复昨天她叫我朗读小说，我却摸了她耳朵的那件事？她抬起头，伸手拉扯我的耳垂。","「死都不要。」","我斩钉截铁地对她说。","耳洞这种事后会持续留在身上的存在太令人困扰了。","宫城三不五时就想在我身上留下痕迹，实际上也的确留下了痕迹。至今为止我之所以容许她这么做，是因为那些痕迹马上就会消失。","可是打耳洞不一样。","我没办法像之前那样接受这命令。","「为什么不行？」","「因为违反校规。」","她没打算要客气的手持续揉捏着我的耳垂。我抓住宫城的手臂，顺势用力拉开她的手，她这才老实地松开捏着耳垂的手指，语气却很不死心。","「仙台同学的裙子那么短，也染了头发，早就违反校规啦。」","「这种程度还在学校容许的范围内吧？」","「仙台同学总是这样。」","「总是这样是指？」","「擅自订出规则，还一副理所当然的样子。」","「订规则这种事没关系吧？不管裙子还是头发，我都维持在不会被老师骂的程度，既然没被骂，就表示不算违反校规吧。」","校规没那么严格。虽然有明文规定，但运用这些校规的老师在管理学生之际，不会像字面上写的那么确实，只要大致上没违反就不会挨骂，老师也会认为我有遵守校规。我只是订出要在那个「大致上的范围内」行动的规则，依循行事罢了。","「妳这样很狡猾。」","「觉得狡猾的话，宫城也这样做不就好了？裙子再短一点会比较可爱喔。」","我抓住并拉扯那要长不短的裙子，打算帮她在不会被老师骂的范围内弄短一点，她却拍了我的手背。","「不用，维持这长度就好。比起这件事，就算之后也行，让我帮妳打耳洞啦。」","「下其他命令啦，这违反规则了。」","我干脆地如此表示，可是宫城依旧一脸不肯死心的样子。","一言以蔽之便是无法接受。","她心里恐怕是这么想的吧。","「我绝不会让妳帮我打耳洞。」","保险起见，我再度对看来相当坚持要命令我让她打耳洞的宫城这么声明。无论有多坚持，我的回答都一样，即使愿意听从她大多数的命令，还是有不能接受的事。","「打耳洞哪里违反规则了？」","「留下会一直留在身体上的伤痕违反规则吧？跟暴力差不多。是说妳想要我戴什么耳环？让我看看啦。」","我不打算接受宫城的命令，却很在意她准备了怎样的耳环。但她没有拿出耳环，比刚才更小声地说。","「还没准备，妳愿意让我打耳洞的话我就去买。」","「不用买。真搞不懂妳为什么想在我的耳朵上打耳洞。」","「……我只是想实验老师会不会生气，总觉得仙台同学偶尔也该被老师念一下。」","宫城嘀嘀咕咕地说出不知是真是假的理由，听起来实在不怎么有趣，让人非得抱怨个两句不可。","「不要拿别人做实验啦，想个更像样的理由好吗？」","「有像样的理由就行了吗？」","「不行。」","搞不清楚宫城的真心话究竟为何，可是帮我打耳洞这个命令实在太沉重了。","我不需要即使未来上了不同大学，不会再见到她后，依旧会残留在身上的东西。唯独我将两人共度的时间刻划在身上这种事，实在敬谢不敏。","「那妳先不要动。」","宫城的话让我涌现不好的预感。","「妳想做什么？」","她没回话。","相对地把手伸了过来。","却没触碰我的耳朵，反倒落在肩膀上。","她总想在我身上留下痕迹，是故意的吗？","明明就在眼前，我却摸不透她在想些什么。我们的对话量虽然比刚来这房间时多，但也只是变多了，我依旧不了解宫城这个人，她隐瞒自己真正的想法，今天也是，让人无从判断她毫无准备却想帮我打耳洞这件事，究竟是一时冲动，还是总算说出口的念头。","单单凭借不着边际的对话，要贴近彼此的心情可说极为困难，使身体的距离化为零却很容易。宫城的唇吻上我的耳朵。","黑发传来洗发精温和的香气。","身体自然地接受了曾触碰过我好几次的嘴唇。尽管开始觉得宫城比谁都接近我是理所当然的，我仍保有认为自己不该接受这件事的理性。","「等等，宫城。」","我推了她的肩膀。","她的体温离开我们相触之处，耳边传来她的声音。","「既然仙台同学不让我打耳洞，就用这个来代替吧。」","太过靠近的声音，让我推着她肩膀的手一震。","她呼出的气息抚过耳朵，感觉很痒。","「乖乖别动啦，我又不会弄伤妳，这命令很简单吧？」","随着宛如酥脆零食般轻盈的嗓音，某个湿润的东西抚上我的耳朵。","我马上就知道那是她的舌头。","贴上来的舌头温温热热的，一动起来就令人起鸡皮疙瘩，坐立难安。以前也发生过这种事，总觉得该遵从理性，然而与之相反，心里同样有个声音试图说服自己，认为这种程度的命令没什么好拒绝的。","感情在两个选项之间摇摆不定。","温热的舌尖让我的理性败给了惰性。遵照命令乖乖不动后，有什么坚硬的东西碰上我的耳垂。","大概是牙齿吧。这种时候绝对没好事。","「宫城，放开我。」","过去的经验让我推着宫城的肩膀。","我加重手上的力道，她却不为所动。","牙齿挟着耳垂用力咬下。","「这样很痛。」","我随着这句话拍打她的肩膀，牙齿却刺进耳垂。","她狠狠地使劲咬着我。","痛得仿佛要将今天这天刻划在记忆当中。","不对，与其说痛，不如说很热。","无论是她呼出的气息，抑或洗发精的香味，全都让人搞不清楚。","「就说很痛。」","「啪」的一声，我用力拍打宫城的身体，她颤抖了一下。","轻易拉近的距离又轻易拉开了。","「妳也未免咬得太狠了吧，根本比打耳洞还过分啊？别说开个洞，耳朵都快被妳给扯下来了。」","我没打过耳洞，不过想必没这么痛。宫城就是这么用力地咬了我的耳朵，不知道她这股冲动究竟是打哪来的？","「我才没咬得那么用力。」","「妳有，真的很扯耶，一定被妳咬伤了啦。」","我看向摸过耳垂的指尖。","没有沾上血。","然而我不相信。","感觉有哪里在流血，我伸手要拿放在桌子下的卫生纸，然而套着鳄鱼盒套的那东西却消失了。","「等一下，宫城，我要用卫生纸，妳不要拿走啦。」","我开口向抱着鳄鱼的宫城抱怨。","「妳又没受伤。」","找理由似的说完后，她把面纸盒放在桌上。","宫城不满意我没乖乖听令的态度。","应该是因为这样才会抢走鳄鱼吧。","冲动又意义不明的行动——","正是她经常对我做的事。","可是她变了。","以前的她总是以我不悦的表情为乐，现在却有所不同，当下的脸色完全看不出半点开心的要素。说得更精确一点，反而看起来很不安。","自己做出过分的事还这样，未免太自我中心了。","根本是自作自受，我没必要退让。","「就算露出那种表情也不行。」","我从镇座在桌上的鳄鱼背上抽出卫生纸，擦拭耳朵。","薄薄的卫生纸依然洁白，没有沾上血。","「我的表情跟平常一样吧？」","宫城以与平常略有不同的表情说着，打算抢走鳄鱼。我拍开她的手。","「有没有不一样，妳照镜子看看啊。」","「我不要。」","她的脸色暗了下来，模样仿佛被抛下的小猫般胆怯不安，害我有种好像做了什么坏事的感觉。","「——会痛的不行。」","口中逸出听起来像是容许宫城行为的话语。","现在的我们不该做出这种行为，然而只有一下下无所谓。","之所以冒出这种念头，全是宫城的错，都怪她露出那种不安的表情。","「可以吗？」","「这是命令吧。」","我拉了拉她的上衣，表示愿意听从命令。","没错，这是命令，我莫可奈何。","只要在规则范围内就无权拒绝，只能接受宫城。","「那妳乖乖别动。」","耳边再度传来刚才听过的话，她的体温慢慢接近。","温热的东西有些犹豫地碰上耳朵，仿佛要舐去我被咬之后残留的痛楚般滑过，舌尖舔过之处比方才牙齿咬过的地方更多。我不讨厌退开后又碰上来的那个东西。","她的牙齿碰到了耳垂。","方才的痛楚重新复苏，我反射性地抓住她的手臂。","但她这次没那么用力，只是轻轻咬着，坚硬的物体挟着我的耳朵，像是在测试我能忍受的力道，感觉得出她的牙齿小心翼翼地避免弄痛我，缓慢又温柔地触碰着耳垂。明明带来的刺激应该很微弱，我的心思却全被吸引而去，清楚意识到自己的精神都专注在耳朵上，静不下心。","耳边感受得到宫城的呼吸。","呼气的声音太近了，令我的心浮躁不安。","却又因为宫城身处我伸手可及的范围而感到放心。","不过她做得太过火了。","带来的刺激不适合现在的我们。","宫城太极端了。","并非只要不痛就什么都好。我按住她的额头，要她退开。","「等一下，宫城，这样虽然不痛，可是感觉不太妙……」","「什么意——」","宫城话说到一半就停住，随即老实地表示：「对不起。」道了歉。","我轻轻吸了口气，又慢慢吐出，把鳄鱼放在彼此之间，从它背上抽出卫生纸擦拭耳朵，像是要擦掉宫城的痕迹。","「像这种时候，仙台同学有怎样的感觉？」","宫城一边摸着鳄鱼的头，一边若无其事地问我。","她明明把快说出口的话给吞了回去，接下来的话语却又让这个行为失去意义，害我差点叹气。","「妳自己体验看看如何？」","我朝不负责任的宫城伸出手，她却夸张地往后缩，导致伸出的手没能摸到她的耳朵。","「开玩笑的。」","我语气轻松地说着，对她笑了笑。","即使缩短原本就已经很近的距离，也只会变得尴尬。","不禁脱口而出的多余发言，只要包装成玩笑话丢掉就行了。","明明这样想，宫城却格外认真地说。","「——愿意让我帮妳打耳洞的话，可以喔。」","这句话里的「可以」，指的是我可以做出同样的事情，让我忍不住盯着她。","一旦付出让她在耳朵上打洞的牺牲，便可以做她刚刚对我做的事。","这话听起来实在太有吸引力，我霎时有些犹豫，接着讨厌起犹豫的自己。","「说什么蠢话呀？比起这件事，羽美奈看到我跟妳走在一起了。」","我改变话题，结束这段危险的对话。宫城的注意力旋即转移到羽美奈这个词汇上。","「咦？什么时候？」","「看电影那天，羽美奈好像也去了那里。我跟她说我们碰巧遇见。」","「她相信了？」","「应该吧。就算不信我也不在意。」","「我也不在意，反正不会再跟仙台同学出去了，根本没差。」","宫城冷淡地表示，打了鳄鱼的头。","望向不太高兴的她，我倚着床。","「其实妳还想跟我出去吧？」","听到我故意这样说，她立刻回话。","「我不会再跟仙台同学出去了。」","这种时候，宫城总会跟被拉长的橡皮筋恢复原状时一样，迅速地抽身。由于实在抽身得太果断了，反而使我有点害怕，不知道是只对我这样，还是无论对谁都一样，让我没办法再多说些什么。想接近我时，她明明会不顾我的感受拉近距离，一旦满足了就疏远，这样未免太过分。","「毕竟也没有需要一起去的地方嘛。」","其实我想说的并不是这个，却找不到其他合适的话语。我叹了口气，把鳄鱼丢到宫城身上。","〔本话含插图〕"]},{"t":"第3话　就算不和仙台同学见面也没差","p":["从书柜里抽出书，再放回去。","基于我的命令，仙台同学一直做着这种单调无聊的举动，不时听到她抱怨：「好热。」但我不打算理会。九月中旬依然很热是事实，可是再调低空调的温度，就换我会觉得冷了。","整理书架。","今天的命令任谁都办得到，也不是我想叫仙台同学做的事，然而随便乱下命令，可能会衍生出太过火的行为，所以只能下一些不用担心失控的命令。","「宫城，这本呢？」","仙台同学转过身来，拿了本漫画给我看。","「随便放就好。」","回答她的我，依旧坐在桌前的地上。","我对书的排列方式有所坚持，比方说照书种排列，或是把喜欢的书放在好拿的位置，不过事到如今，也没必要跟仙台同学说明。以前我同样曾要她整理书架过很多次，整理过的书架用起来很顺手，所以这并非需要特地叮咛的事。","「这种的最伤脑筋耶。」","尽管嘴上抱怨，她依旧把手上的漫画放回书架上。","感觉她很擅长做这种事，动作俐落，就像在玩益智游戏，改变书本摆放的位置，填满书架上的空隙。","明明看起来很会玩游戏，实际上却玩得很烂。","我回想起彼此唯一一次一起玩游戏时的情况，望着仙台同学，视线移动到她的耳朵上。","结果她还是不肯让我打耳洞。","尽管打耳洞违反校规，也会挨老师骂，然而茨木同学同样打了耳洞，其他女生也有打。就算仙台同学有留心避免被老师盯上，迟早也会打耳洞才对。既然如此，让我来打应该无所谓吧。","但我早就知道她不会听从命令了。","五千圆不是万能的。","依旧有办不到的事。","我心知肚明，现在却仍想在那个毫发无伤的耳朵上开个洞。","「对了，大学妳打算怎么办？」","仙台同学头也不回地说。","「什么怎么办？」","「想跟我考同一所大学的话，我会教妳功课啊。」","「我不会考的。」","纵使考上同一所大学，像现在这样跟她在一块，想必也只会持续到大学毕业为止，甚至说不定在大学毕业前，她就会主动提出要结束。","既然如此，还是早点结束来得好。","在她说结束前由我主动结束，就不会受伤了。","「是喔。」","仙台同学的语气既不阴沉也不开朗，填满书架上的空隙。","「……不过我会念书，好歹也是考生嘛。」","这可不是说谎。","之前推给仙台同学写的作业，我现在都自己写了，今天也早早写完作业。尽管没特别想写，桌上仍放着考试题库。","「即使报考的大学不同，有不懂的地方我还是会教妳的。」","「别担心我，念妳的书啦。」","「假设妳指的是考前准备，就算不说我也有在做。」","仙台同学头也不回地回答。","从夏季制服衬衫袖口伸出的手臂跟暑假时一样，简直无法相信她是走来我家的，手臂完全没有晒黑，一点痕迹都没有。","制服还是长袖之际，我曾在那条手臂上留下痕迹。","有别于据说比我想像还早消失的那个痕迹，若是打耳洞就会留得更久。如果她身上留有任谁都看得出的痕迹，不管谁在她身边，我都能够放心。","我跟仙台同学在学校不会交谈，但要是有什么能让其他人知道，她的时间有一部分是属于我的就好了。","——我就是死不了这条心。","明知她绝不会听从「让我打耳洞」的命令，却仍迟迟无法放弃，和得不到想要的东西而气得跳脚的小孩子根本没两样。","「宫城，我整理好了。」","仙台同学随着这句话转过身来。","从衬衫短袖底下伸出的手臂果然很白，耳朵上也没有伤痕。身后的书架排列顺序虽然与平常迥异，但漫画跟小说都整整齐齐地排放在架上。","「是说宫城你们班校庆后来决定怎样？」","仙台同学坐到我身旁，开口询问。","「说是要开咖啡厅。」","三年级生不用太认真。","尽管老师没有这样说，不过这已成了校庆活动不成文的规定，应该是希望三年级生专心准备考试吧，然而每年都会出现认真筹备校庆活动的班级，今年那个班级看来就是我们班。","「无论事前准备还是校庆当天，感觉都很麻烦耶。」","听到她有些同情的声音，我立刻回话。","「很麻烦啊，要准备的事情很多，我现在就开始郁闷了。」","「要做女仆装吗？」","「又不是要开女仆咖啡厅，不至于办得那么盛大啦。」","「什么嘛～本来还想说宫城要是穿女仆装，我就去看看。」","仙台同学以听起来不像有兴趣的语气表示，低声轻笑。","「如果是女仆咖啡厅，我只会担任内场人员。」","毕竟是班上中心人物决定好的事，我没反对，然而光是普通的咖啡厅就够麻烦的了，根本不可能穿女仆装接待仙台同学，我绝对不做。","「所以妳要当服务生啊？」","「轮班制。」","「那我果然还是去看看宫城好了。」","「妳绝对不要来。」","「其实妳很希望我去吧？」","「不用，妳不要来。」","仙台同学显得格外开心，怎么看都是在戏弄我。","咖啡厅这种东西，其他学年或班级应该也有，仙台同学没理由来见已经约好在学校不会交谈的我。我马上就知道她说要来看只是嘴上说说，不过是在调侃我罢了。","我就是不爽她这种态度。","「比起这点，下周似乎就要开始筹备咖啡厅了，有时我会比较晚回来。」","我没兴趣陪她抬杠，传达了得事先告诉她的事。","「意思是到校庆为止都不会有命令？」","「如果时间对不上就会变成那样。」","因为校庆之后还有期中考，就算想认真筹备校庆活动，也不可能每天都忙于准备。即使如此，相比过去还是比较难约时间。","「好，我明白了。」","听见她的声音一如往常，心脏仿佛被人一把揪住般，觉得好难受。","仙台同学说他们班只打算办成果展交差了事，但不可能完全不用准备，所以应该多少会占用放学后的时间，况且她还得补习，行程无法变更，她也不会变更，所以会回答「我明白了」根本是早就知道的事，我却不觉得这是个好答复。","我用力握紧双手，随后张开。","校庆的准备和补习。","光是这两个行程，就会让我们无法顺利凑出时间。","到校庆为止的短短两周。","其实严格说起来不到两周。","即使碰不到面，期间也就这么长，跟寒假或春假差不多。我们以前也曾这么久没见面过，仙台同学表现如昔照理说是很普通的事。","即使只有一瞬间，却为此感到遗憾的我才奇怪。","这种心情只是错觉吧。","我不可能觉得寂寞，仙台同学也不可能涌现这种感觉。","「要是全都能早点结束就好了。」","我随手翻起被她放在桌上不管的课本。一碰到宛如自己的东西般看惯的课本，掀起波澜的情绪便似乎平静不少，希望一切都很麻烦的校庆、期中考、大学入学考全部消失的心情也逐渐消散。","「等等，别乱翻我的课本啦。」","仙台同学开口抱怨，用笔尖戳了戳我。尽管如此，我依旧翻着课本，结果手被用力地戳了一下，这才收手。","交换课本如何？","这样一来，在上课的日子，我就能用仙台同学的课本。然而她的课本跟我的明显不同，不仅写了很多笔记，字迹也不一样，马上就会被人发现这不是我的课本了。","不对，为什么？","我干嘛思考交换会怎样？","或许是不同于过去，连暑假都见面的缘故吧，有仙台同学在已经变成过于理所当然的事，我才会因为有可能暂时见不到面而感伤……一定是这样。","我望着默默面对课本和习题的她。","解开两颗扣子的衬衫和领带。","漂亮地绑起来的头发一如往常。","我拉了拉她有些松的领带。","「另一个命令——解开这个。」","「……为什么？又想把我绑起来？」","仙台同学发出一听就知道有所防备的声音。","「不是。」","领带和打耳洞不一样，不会在身上留下伤痕。","大家的领带都是同样的，只要我跟仙台同学不说便没人会知道。","这就是这样的命令。","——交换我和仙台同学的领带。","简单又不会留下痕迹的命令。","我很清楚，想交换什么是件很奇怪的事。","即使如此……直到校庆为止。","我想在这段短短的期间内和她交换。","我伸手摸向自己的领带，像是没别人在这个房间里时换衣服那样解开领带。","「为什么宫城要解开领带？不是我要解开吗？」","仙台同学一脸疑惑地问我。","「跟我交换啦，交换领带。」","我将解开的领带放在桌上。","「……为什么要交换？」","「有时即使没理由也会想交换吧。」","「一般来说没理由是不会想交换的吧？」","「仙台同学还不是会没来由地想碰我，就算没理由也可以交换吧。」","有时即使没有理由，也会想碰一个人吧。","询问她为何在走廊上抓住我的手腕时，仙台同学是这样说的。正因为没理由也无所谓这道理是她搬出来的，叨叨絮絮的她显得很奇怪。但她就是不肯解开领带，一直想从我身上得出答案。","「没有理由吗？」","「仙台同学很啰唆耶。闭上嘴，解开领带啦。」","见我嫌麻烦而硬是拉扯她的领带，她以没什么干劲的声音回我。","「好好好。」","看来不像是接受我没表明理由，不过她解开了领带，套到我脖子上。","领带是制服的一部分，因此不管是谁的都一样。","而且只是一片布，不是什么特别的东西。","明明如此，挂在我脖子上的那条领带却有别于自己的，感觉略显沉重。","「满意了吗？」","仙台同学平静地说，伸手要拿起我放在桌上的领带，然而我在她抓住之前就抢走了那条领带。","总觉得这还不足以让人满意。","除了领带之外，制服还有其他部分。","「我们不是要交换吗？妳别拿走啦。」","她提出理所当然的主张，打算从我手里抢回领带。","「衬衫也跟我交换吧。」","无论领带或衬衫都一样。","都是制服的一部分，都是布片，不管一片还是两片都差不多。","所以就算连同领带一起交换衬衫也没关系。","听起来根本是歪理，感觉仙台同学会生气。","这是理应避免的命令。","但我就是想从她口中听到早已知道的答案，难以压抑这份心情。","「意思是要我脱？」","仙台同学停下动作。","「要是有不脱又能给我的方法，就可以不用脱。」","「根本是天方夜谭吧？」","「那妳就脱吧。」","我简短地宣告并把领带递给她，她接过领带，把它卷起来放回桌上。本以为仙台同学马上会讲出「说什么蠢话」之类的话，她却什么都没说。","命令不是叫她脱衣服，而是交换制服，然而很难说这样到底算不算违反规则。","可以命令跟不能命令的事情并未明确地区分开来。","但凡在规则的范围内，仙台同学不会反抗，可是受规则限制的命令常与规则外的命令紧紧相黏，导致界线暧昧不清。","而她只要从混淆的命令中挑出该拒绝的项目，拒绝我就好了。","「是要交换吧？」","方才陷入沉思的仙台同学为求保险地问我。","「没错，交换。」","「交换的话可以啊。」","她干脆地背叛我的信任，解开衬衫的第三颗扣子。","即使难以厘清，这依然是应该拒绝的命令。","仙台同学想必也很清楚，却接受了它。一旦她没说这违反规则，我便只能顺着她，看着她逐渐解开扣子。","她相较暑假时更干脆，毫不犹豫地脱下了衬衫。","与当时不同，我们今天没有交谈。","由于仙台同学没说话，我直盯着她。","内衣和我在下雨那天看到的一样，是白色的。","不记得是不是同一件。","遭内衣遮掩的胸部形状看起来很漂亮。","这么说来，我们在暑假做出太过火的行为那天，尽管隔着内衣，但仙台同学摸了我的胸部，我却没摸过她的，总觉得好像有点吃亏。","现在只要稍微伸出手，不管哪里都摸得到。","摸得到她柔软的胸部、柔滑的腰肢。","「宫城也赶快脱啦。」","仿佛要打断我的邪念般，仙台同学将制服递给我，然而我并没有接下，她的指尖于是「咚」地碰到我的手臂。我抓住她的手。","至今我从未对任何人有过这种念头，却想触碰仙台同学的身体。","我的手缓缓地往上滑，指尖爬上她的上臂，用力按压，埋进那比软糖还柔软、比棉花糖更有弹性的肌肤，却没能碰到胸部和腰。在我犹豫的指尖碰到其他地方之前，她的手臂就溜走了，把衬衫塞给我。","「不是要交换吗？赶快把衬衫给我啦。」","仙台同学语气不悦地说。","把接下的衬衫放到床上，系好挂在脖子上的领带后，我站起身来，打开衣柜。","「喂，宫城。」","耳边传来她责怪我没把要交换的制服拿给她的声音，但我没回应她，挑了件挂在衣柜里的衣服，递给仙台同学。","「拿去。」","「等等，妳拿新的出来太奸诈了吧？」","我塞给她的衣服是白衬衫，也是学校指定的制服。这里是我房间，就算不脱掉身上穿的这件，也有办法拿出衬衫给她。","「才不奸诈。妳赶快穿上啦。」","「很奸诈好吗？宫城也脱啊。」","「我可没说要跟妳交换现在身上穿的衬衫。」","「……宫城是小气鬼。」","仙台同学不高兴地皱起眉头，可是马上就死心了，摊开手里的衬衫。","她愤恨地瞪着衬衫后望向我，尽管一脸想抱怨的样子，却依旧什么都没说，穿上我的衬衫，系上我的领带。","衬衫的扣子有两颗是解开的。","她似乎穿得很不舒服，拉了拉袖子。","接着又说了一次：「小气鬼。」","脖子感觉怪怪的。","领带以不会太紧也不会太松的程度系在上头。","或许是因为绕在脖子上的布片不是自己的，我才会觉得不对劲，静不下心来。","我试着拉了拉领带。","无论外观还是触感，仙台同学的领带跟我的可说毫无差别。既然舞香和亚美都没注意到我换了领带，无论任谁看到或伸手拉，这都只是一条普通的领带吧。","唯独我跟仙台同学知道彼此的领带不同。","「志绪理，别看领带，看着前面走路啦，这样很危险耶。」","耳边传来舞香的声音，她拉了一下我的手臂。","原本放在领带上的注意力转移到外在环境，方才被遮蔽在意识外的声音瞬间涌入。","来往行人的声音。","汽车行驶的声音。","脑中因为萦绕耳畔的声音而突然变得热闹了起来，让我回想起自己正在前往购物中心的路上。","似乎是要去采买吧。","我放开领带，望向前方。","几天后就是只让人觉得麻烦的校庆，尽管毫无兴趣，我仍得忙着准备。都怪今天有人说想在看板上多加点装饰，我只好献出放学后的时间去买材料。","「妳这样一直发呆的话，会跟撞到仙台同学那时一样又撞到人喔。」","亚美笑着说，舞香则是有点无奈地开口。","「若只是撞到人倒还好，妳一副会不小心走到人行道外被车撞的样子，感觉很恐怖，拜托专心点走路啦。」","「抱歉。」","走在许多身穿制服或西装的人们交会而过的人行道上，无论何时撞到人都不奇怪，然而对象是人的话，即使撞到——只要不是什么特别奇怪的人——都还好解决，但要是遇上车则另当别论。校庆会变得怎样我并不在意，可是出车祸送医就伤脑筋了。看医生也好，住院也罢，我都不想把这种无聊事加入未来的行程里。","当然我没打算走在车道上，但整个人都在恍神，连要去购物中心这件事都忘了，就算出意外也没什么好不可思议的。","那天之后，我没再和仙台同学碰过面。","校庆的准备工作跟补习让我们的行程一直对不上。我传了好几次讯息，收到的回复都是她得补习，延期的约定又因为校庆的准备工作而告吹。要是我搞到必须去医院，约定就得再往后延了。","「志绪理最近常常在看领带耶，怎么了吗？」","舞香指着我的领带。","「没什么，只是在意有没有打好而已。」","我跨出一大步，逃离舞香刺在我胸前的视线，然而这次换亚美用能感觉到不打算让我开溜的力道，大力地拍了我的肩膀。","「突然开始在意自己的穿着，很可疑喔。妳之前明明不太在意的啊。」","「才不可疑呢，只是觉得好像怪怪的。比起这点，我们要买什么呀？」","我强制结束即使被追问也无从回答的对话，顺便把让人静不下心来的领带抛诸脑后。","「我有写在纸条上。」","这么说完后，舞香从裙子的口袋掏出折起的纸片。我瞧了瞧那张几十分钟前还是笔记本一部分的纸片，上头甚至写着搞不清楚到底要用在哪里的东西，全部买齐的话应该会有不少东西要提回去，不过比在教室里帮忙好多了。","我们随口抱怨着，朝购物中心前进。","尽管相比盛夏时是不算热，但白色的衬衫依然汗湿地贴在背上。我不知为何没办法穿上仙台同学的衬衫而收在衣柜里，因此与领带不同，我并不在意衬衫，却很在意她怎么处理我的领带跟衬衫。","我曾在学校里看到她。","但是光看根本看不出构成制服的衣物是我的，还是仙台同学的。","我想见她，直接问她我的制服怎么了。","「校庆能早点结束就好了。」","亚美对我小声嘀咕的这句话起了反应。","「准备虽然很麻烦，可是校庆本身很开心啊。对吧，舞香？」","「对啊，毕竟今年是最后的校庆了，我们一起到处逛逛吧。」","「……我也不是完全不期待啦。」","听到亚美和舞香开心的语气，我不干不脆地回答。","我并不讨厌校庆这个活动，说起来去年玩得还算开心，前年也满愉快的，不好玩的只有被少部分人创造出的「尽情享受活动」风潮给拖下水这件事。","班上的中心人物想大玩特玩的话，自己去玩就好了，却偏要强迫大家跟他们一起炒热气氛。今天也是，如果不用采买，我就能把仙台同学叫到家里了。","事到如今，早点回家也无济于事，但我还是想早点回家。","正当思绪被这些负面思绪给囚禁住之际，传来了亚美积极正向的发言。","「哎呀，今天就悠哉地购物，然后回家吧。」","「亚美，我们今天可不是要去买自己的东西喔？」","舞香轻轻甩动纸条给她看。","「采买这种事随便啦，速速解决，打发一下时间再回去就好了。」","「妳又说这种不负责任的话。」","「认真跑腿也没意义啊，志绪理也这么认为吧？」","「是呀。」","倒不是想效法亚美的乐天态度，只是思考要怎么改变早已无可奈何的事情也没用，不如赶快结束麻烦的采买工作，跟她们做些开心的事情再回去。","我和她们一起走进购物中心。","舞香一手拿着纸条，买齐了分量不少，搞不清楚要用来干嘛的材料。我和亚美化为搬运工，一如失去自我意志的僵尸，跟在舞香身后，完成跑腿的任务。","「妳们想不想喝点什么？」","几乎是靠着舞香结束采买工作后，亚美的一句话决定了接下来目的地是美食街。","这次换她带头走在前面。","我们搭上手扶梯，聊着没营养的话题。经过贩卖各种杂货的柜位时，我停下脚步。","那是平常我不会在意的柜位，换作以前，甚至不会放慢脚步。但我看到陈列在店舖前的饰品——一条有着银色链条，挂着小小坠饰的项链，看起来很适合仙台同学。","我下意识地走近柜位，听见舞香开口。","「什么？有什么可爱的东西吗？」","「还好。」","我连忙回答。差点抛下我走掉的亚美绕了回来，看着项链。","「难道我们应该送妳饰品当生日礼物比较好吗？」","「想要这种东西就说嘛，说了我们就会买啦。」","舞香遗憾地说。","她们上周送了我铅笔盒和书套作为生日礼物，两个我都很喜欢，收到的那天就开始用起那个铅笔盒，书套也套在看到一半的小说上。它们都是我说过想要的东西，所以没有送饰品比较好这回事。","「倒也不是想要，只是刚好看到而已。」","没错，不过是碰巧看到，让我想起仙台同学罢了。这饰品只要有我给她的五千圆便绰绰有余，不是买不起的价格，却非我该买来送她的东西。说穿了，我根本不可能送她项链，也没有理由送她。要是知道她的生日，感觉的确能拿来当成送礼物的理由，可是我不知道，也没听她说过。","……就算知道，我也不会送她吧。","不用细想也知道，彼此不是会送对方礼物的交情。既然不会送，就算发现感觉很适合她的东西也没意义。","「要进去看看吗？」","听到舞香这么问，我果断地回答。","「不用。」","「既然不用，那我们走吧。」","亚美轻快地说完后便走了出去。舞香虽然再度询问：「真的不用吗？」但我的答案依旧没变。毕竟看了也没用，我没必要更改答案。","仙台同学没有来。","昨天跟今天我都没在等她，然而校庆这两天她都没有到我们班上来。","『我去看看宫城好了。』","我很清楚，最后碰面的那天所说的不过是玩笑话，她也不是那种会特地跑来看我的人，所以我没有等她。喧嚣的高中最后一次校庆落幕，事后的收拾工作也做完了，我只是在最后的最后想到仙台同学没来而已。","我望着有半数同学已经回家的教室。","尽管没那么积极地想参与，不过咖啡厅已然收摊的教室里空荡荡的，白天的喧闹宛如一场谎言，让人感到有些寂寥。","校庆本身是满开心的。","我不仅和舞香她们去了平常不会去的一年级教室，也看了在体育馆举办的活动，就连在咖啡厅里忙东忙西的事，总有一天同样会变成美好的回忆。而仙台同学没有出现在任何一个环节，并不是需要在意的事。","只是因为她说的话很奇怪，才会残留在脑海里，她不管来不来都无所谓。我玩得很开心，接下来也要和舞香她们去吃饭再回家，仙台同学一点都不重要，我根本不觉得有差。她现在想必打着校庆庆功宴的名义，跟茨木同学她们去哪里玩了吧。","我望着装满校庆余韵的书包。","里头装有用来代替咖啡厅制服的围裙，以及我直到刚才还穿在身上，跟班上同学们成套的T恤。","未来一定不会再用到这些东西了。","一如不会在这里度过明年夏天的三年级生不需要的夏季制服，进入十月后，我们就会换上换季用的制服，短袖衬衫将会变成长袖。","结果我一次都没有穿过仙台同学的衬衫，也已经没机会穿上那件始终沉睡在衣柜里的制服了。","「志绪理，东西收好了吗？」","舞香在教室一隅向我搭话。","「嗯。」","我重新系好仙台同学的领带，拿起书包。","「我肚子也饿了，赶快走吧。」","顺着亚美的这句话，我们三人一同走出教室。","走在与校庆正热闹的时候不同，变得没什么人的走廊上，啪哒啪哒的脚步声异常响亮。当我们走下楼梯，接近鞋柜之际，书包里的手机响了。","「是志绪理的手机？」","我点头回应舞香的话，停下脚步，拿出手机望向萤幕，上头显示着仙台同学的名字。","『妳还在学校里吗？』","那段简短的字句是我未曾从她那里收过的讯息，我捏紧领带。","她以前从来没有问过我这种事。","我还在学校又怎样？","不在学校又怎样？","由于是第一次收到的讯息，我没办法想像后续会发生的事，然而再怎么绞尽脑汁，也不知道接下来等着的会是什么，所以我只打了「还在」便送出答复，结果传出后马上又收到新的讯息。","『我在之前那里等妳。』","我们在学校里没有亲昵到用一句「之前那里」就能意会到对方在说什么，但我马上就知道她指的是哪里。","有个我和她唯一一次在学校里单独说过话的地方——","音乐准备室。","她一定是在那里等我。","「对不起，我忘了东西，得回去拿一下。还有今天我没办法跟妳们吃饭了，我爸好像会提早回来。」","虽然感觉很假，但我找不到其他合适的理由，只好迅速说完，转身往回走。","「咦～！可以一起回去拿呀，志绪理也跟我们去吃饭啦。」","亚美的声音追了上来，我转身面对她。","「因为我爸叫我早点回去。真的很对不起，妳们两个去吃吧。」","我「啪」地双手合十拜托她们之后，舞香毫不犹豫说了。","「既然志绪理没办法去，那下次再去好了。亚美觉得呢？」","「这个嘛～还是挑大家都有空的日子好了。总之我们去拿妳忘记的东西吧。」","「啊～没关系啦，这样很不好意思。感觉要花点时间，我自己去就好了。」","我又说了：「对不起啦。」再度向她们道歉。「嗯～」地沉思了一下后，亚美露出有些无奈的表情开口。","「那我们先回去喽。不过志绪理哪天有空？」","「我会再配合妳们把时间空出来的，妳们先挑一天吧。」","「好，那我再跟舞香讨论。」","「谢谢妳们，对不起喔。」","我向她们挥挥手，朝着旧校舍走去。","大多数学生都已经回家的学校，有种仿佛连接着不同世界的诡异氛围。即使太阳快下山了，外面依旧很亮，走廊上也没那么暗，然而随着越来越接近旧校舍，看到的学生人数逐渐减少，总觉得有点恐怖，让我加快脚步。宛如想逃离自己啪哒啪哒的脚步声般，我打开音乐准备室的门，只见仙台同学像是要混在乐器当中地待在那里。","我在灯光下走近她，她开口搭话。","「好久不见。」","我们曾在走廊上擦身而过好几次，睽违的时间不至于到要说好久不见的程度。","「不是约好不在学校说话吗？」","「那妳别来就好啦，只要回讯息给我，表示不会过来就解决了。」","仙台同学倚着放有乐器的架子，微微一笑。","「妳有事要找我吧？是有话跟我说才会叫我过来的吧？」","我不过去。","的确能这样答复她没错，我却没这么做，连自己都搞不清楚原因何在。指尖自作主张地传出「还在」的讯息，嘴巴擅自编出无法跟舞香她们一起吃饭的理由，但我不想特地告诉仙台同学这些事。","「我想说可以跟妳一起享受一下校庆。」","她以像是装出来的语气说着，敲了敲放乐器的架子。","「校庆都结束了，在这种地方根本没什么好享受的，这个笑话一点都不好笑。如果没有话要说，我要回去了。」","「我话还没说完。」","她拉近了刚才还很恰当的距离。我反射性地往后退一步，她却拉住我衬衫的袖子。","「如果说我想和宫城一起逛校庆，妳会笑我吗？」","虽然没有那么认真，在我开口抱怨前传来的声音却也不像在开玩笑，让人难以回答。说是这样说，但彼此间的气氛实在没有轻松到能保持沉默，我只好简短地表示。","「会。」","「我想也是。要是宫城说了一样的话，我也会笑。」","「……妳明明没来我们班，还好意思说？」","仙台同学也知道我们没办法一起逛校庆，这是不会实现的事。然而她要是真的这样想，就该来我们班上露个脸。","而她没有来。","我认为这就是答案。","她今天也跟平常一样，只是在戏弄我而已。","「我们没有约好。」","听到她冷淡的语气，我知道自己想的没错。","「我要回去了。」","我伸手推了仙台同学的肩膀，想推开抓着我衬衫袖子的她，却仍旧维持着太近的距离，她不肯放开我的衬衫。","「羽美奈她们啰哩啰唆的，一直说有想去的地方。」","「妳在说什么？」","「我没去宫城班上的原因。」","「我又没问原因，这根本不重要。」","「我以为妳想知道。」","「才不想。我要回去了，放开我。」","「我不要。」","她再度拉近已经很近的距离，原本只抓着衬衫袖子的手抓住我的手臂，用力拉了过去。","我没打算挪动身体，却因为站不稳而往她更靠近一步。明明只有一步——距离应该仅有数十公分——但她比那距离靠得更近，我们的嘴唇就快碰在一起。","明显不是偶然而是刻意的行动，让我反射性地别开脸，可是仙台同学不愿意放过我，脸再度凑了过来，我于是用力地推了她的双肩。","「不能做这种事吧？」","不会再接吻了。","尽管没有定下这样的规则，但我以为是这样。","「暑假的时候，宫城明明也曾主动吻我吧？」","「因为暑假已经结束了，我不会再跟妳接吻。」","「妳在暑假结束后还是有舔跟咬我的耳朵吧？」","「耳朵没关系吧。」","听到我斩钉截铁地这么说，仙台同学轻轻「哦～」了一声，拉起我的领带。","「宫城，这是我的吧？」","「是又怎样？」","「妳想要我的领带和衬衫，逼我脱衣服，结果还说这种话？既然做了这种事，不觉得让我吻妳一下也很合理吗？」","「我才没有想要，也没逼妳脱，只是跟妳交换而已啊。」","语气强硬地说完后，仙台同学不满地回嘴。","「那交换结束了，现在马上把领带和衬衫还给我，在这里脱下来。」","「仙台同学也知道这件衬衫并不是妳的吧？我之后会跟着领带一起还给妳，这样就行了吧？」","「不行。」","制服已经更替为换季用的款式，衬衫也换成长袖衬衫，仙台同学原本穿的那件短袖衬衫不在这里，这种事情明明一看就知道，她却没有改变回答。","「现在，在这里还给我。」","她不肯退让，催促着我。","「不要命令我。」","「这不是命令，只是在说交换结束了。」","「既然如此，仙台同学现在也会把衬衫还给我吧？」","「当然。」","「妳穿的明明是换季用制服耶？不可能还给我啊。」","「宫城的衬衫我有带来。这条领带是妳的，立刻就能还妳。」","「妳是在骗人吧？谁会在校庆带衬衫来啊？」","「觉得我在骗妳的话，自己去确认看看啊？东西就放在书包里，妳可以打开。」","仙台同学回头望向放着乐器的架子。我顺着她的视线，看到眼熟的书包就在那里。","打开确认根本毫无意义。","她讲得如此果断，表示衬衫就在书包里。既然是仙台同学，预料到事情会演变至此，事先准备好衬衫带来，也不是什么奇怪的事。","「……妳的目的是什么？」","「让我吻妳，我就不追究妳现在没办法跟我交换的事。」","「太奸诈了。既然要交换，应该事前通知我吧？这样我今天就会带来了。」","「宫城也很奸诈啊，之前就没脱衬衫。」","「我又没说要交换身上穿着的衬衫，才不奸诈呢。」","「那我们也没决定好要交换多久，所以就算叫妳现在还给我也一点都不奸诈吧。总觉得我们是彼此彼此啊。」","眼下的仙台同学不太正常。","她不是会说这种话的人。","即使会依循自己的想法诱导我行动，她也从未这么强硬地要我接受要求，不知道她到底怎么了才会变成这样。","我们在校庆结束之前都没碰过面。","能想到的理由只有这个，但我不认为仙台同学会因为这种事情而改变。","「才不是彼此彼此呢。真要说起来，我们不是约好不在学校说话吗？妳先好好遵守规则才有资格说这种话吧。」","不然连我都会变得很奇怪。","她要是不振作点，我们就会像坏掉的指南针一样迷失方向，朝着不可以过去的地方前进，如果那是无法回头的地方就伤脑筋了。仙台同学会在几个月后抛下我离去，我不想跟她有更深的往来。","「……都是宫城不好，在校庆上玩得很开心的样子。」","仙台同学嘀咕道。","「妳为什么知道我好像玩得很开心？」","「因为我有看到妳。」","「仙台同学自己也玩得很开心吧？」","去年校庆，我曾看到她开心地笑着的模样。","今年虽然没看到，但我想一定还是一样。","然而她没回答。","相对地，抓着我手臂的手放松了力道。","「那么不想让我吻妳的话就逃走啊，我不会跟排斥得想逃跑的人接吻。妳要是逃跑，我就放过妳，不会追上去。」","「意思是要我做选择吗？」","「就是这样。我把选择权交给妳，遵从妳的选择。」","「……仙台同学果然很狡猾。」","她总是不做选择。","把决定权交给我，观察着状况。","而且在她提供的选项里，我应该要选哪个也是早就决定好的事。","「赶快决定，不然妳就没得选喽？」","仙台同学这么说着，放开了我。","〔本话含插图〕"]},{"t":"第4话　想和宫城做的事，宫城想做的事","p":["不知道宫城究竟是做出选择，还是放弃了。","但她没有逃走。","即使松手，她仍站在我面前。","我之所以把她叫来音乐准备室，只是想跟在我不在之处享受校庆的她说上几句话，并不是为了接吻，原本是想抱怨个一两句话就放她走的。因此心中本来的感情尽管阴郁，但还算正常。","然而——","校庆这两天，她都在等我。","正确来说有点不同，但宫城说了可以这样解释的话，使我原本只是想说几句话的念头，变成这个样子。","全都要怪她说了意想不到的话。","我根本没想到她会记得那句半开玩笑的话，也没预料到她会说这种话，成了我做出过度行为的理由。","「宫城。」","即使轻声呼唤，摸了她的脸颊，她依旧没有逃走。尽管看起来十分不满，宫城仍待在面前，表示她也同意我接下来要做的事。我缓缓将脸靠过去，她没有动，却以想抱怨的表情看着我。","「闭上眼睛如何？」","我对看着我的宫城这么说。","「不用妳说我也会闭。」","传来的声音里渗出不满的情绪，让我知道她没打算乖乖闭上眼睛，这是常有的事。我摸着她脸颊的手掌心整个贴上去，但她依旧没闭上眼睛，直盯着我，实在不像一个随后要接吻的人。","然而我们也不是会顾虑气氛的关系就是了。","无可奈何的我只得先闭上眼，与她双唇交叠。","触感和在暑假接吻时一样。","无论柔软度还是温度，我都非常清楚，唯独心脏不同——或许是学校这个地点不好吧，我的心脏吵得连自己都吓了一跳。我忍耐着持续在体内响起的心跳声，仅止于轻触地让嘴唇离开她之后，她紧紧地抓住我的手臂。","我顺着那只不至于无法甩开，却十分用力地抓着我手臂的手，望向宫城，她露出像是要咬我的眼神，但是没有咬我，尽管眼神很难说是老实地接纳了我，然而也不像讨厌的样子。宫城这个人想咬我的话，早就咬上来了。","所以这只手的意思是——","我垂下视线，看向抓着我手臂的手。","「宫城，这样很痛。」","没有回应。","她明明有听见我的声音，却没有放开我的手臂，不仅如此还用力握紧，就连指甲都陷了进去。","我望向宫城的脸，只见她脸上挂着不高兴的表情。","试着稍微把脸凑近。","宫城什么都没说，也没有动。","而当我的身体没靠过去，稍微退开后，她拉着我的手臂。","我不讨厌像这样用小小的动作留住我的宫城。","「可以再一次吗？」","尽管不用问也知道答案，我依旧刻意询问。宫城没有开口，也不愿意点头，却又拉住我的手臂，仿佛在催促我。","她要是逃走也很让人头痛，所以我不会告诉她，但我觉得这反应很可爱。","我缓缓凑上脸。","这次宫城先闭上了眼睛，我们双唇交叠。","心跳声还是老样子，既吵又快。","我和她接吻过好几次了。","次数多得早已习惯。","然而我大概是在紧张吧？","即使只是嘴唇轻轻地碰在一起，没有用力压上去，也没有舔，我却觉得交叠的部分特别热。我伸手抓住宫城的肩膀，感觉手也跟着热了起来，随着接触的部分增加，心脏又变得更不平静，好难受。","虽然不情愿，我仍脸退开，结果她再度抓住我，不过这次没那么用力，不会痛。","我犹豫了一下要不要再吻她，随即比刚才更用力地把嘴唇叠上她的。","宫城没有逃走。","我的心脏也稍微听话了点。","我不想和她分开，这个吻比起第一次、第二次都要更长。","她正位于比我跟任何人在一起时更近的位置。","体温从彼此相触的部分交融在一块。","一切都让人觉得很舒服。","我想再多感受宫城的温度，于是以舌尖触碰她的嘴唇，她果不其然地推了我的肩膀。我老实地退开三步后，她开口说道。","「我没说可以用这种方式接吻。」","「这种方式是哪种方式？」","「就是像刚刚那种。」","「妳不说清楚，我怎么知道？」","「要是不知道就都别接吻啦。」","宫城会在这种时候含糊其词。虽然喜欢她这种反应，我却很想知道追问下去会怎样，因而多嘴了几句。这种情况下，她的心情总是会变得很差，声音也会压低。","尽管可以用一句「常有的事」带过，不把这当成一回事，但今天我不想让她不高兴，却也想再看看她的反应。","「所以只要不是刚刚那种就行？」","虽然觉得她会生气，我仍往前走了两步，把脸靠过去，接着便听到她不高兴的声音。","「那件事才过了一个月，妳再忍耐一下啦。」","她所说的「那件事」想必是指暑假最后一天。那天之后，我们的嘴唇就没有相触过。","「也就是说宫城之前都在忍耐，其实很想接吻喽？没问题吗？」","我也觉得自己很坏心眼，但又好奇她会怎么回答。","「妳不要擅自乱解释啦，老是说这种话，很好玩吗？」","「很好玩。」","「仙台同学真差劲。」","想接吻——","宫城不可能说出这种话，我却暗自希望她这么说。","倘若再度发生暑假的那种事就麻烦了。","那种行为不该继续发生。","我原本这样认为，然而眼下再度与宫城接吻后，反而不知道自己之前为什么会那么想了。我甚至觉得她在书店给我五千圆的那天，彼此定下的规则根本毫无意义。","「只是接吻而已，又没关系，这已经不算违反规则了啦。」","「才不好。」","宫城斩钉截铁地说。","「那就把规则改成可以嘛。」","「不要。」","以五千圆做交换，听从宫城的命令。","本来只是当作打发时间才会答应她，到现在却早已超越打发时间的范畴。坚持守住规则的宫城脑袋实在太死板，甚至让我觉得过去定下的约定很烦，讨厌死了。","这世上有「临机应变」这种方便的成语。","只要不让人发现，在学校说话根本无所谓，接吻也没关系。只要不让任何人知道我们的关系，即使规则如此宽松，理论上也毫无问题才对。","「宫城就这么不想接吻吗？」","「妳这问法太狡猾了。」","「也就是说妳想接吻吧？让步一下嘛。」","「……就算继续做这种事，仙台同学还不是会到很远的地方去？」","「报考同一所大学就好了。」","「仙台同学留在这里啦。」","「咦？」","我听到以为宫城绝不会说出口的话，忍不住盯着她的脸，只见她紧紧抿着嘴。","「宫城？」","叫她也不回话。","她瞥开视线代替回答。我希望她能看向这边而摸了宫城的脸颊后，她冷漠地说。","「别碰我。」","我无视她的话，掌心就这样贴了上去。平常她应该会拍开我的手，今天却没有。","「仙台同学，把领带还我。」","她的这番话足以合理地要我拿开放在她脸颊上的手，我也没理由拒绝，于是乖乖地解下领带递给她，宫城也把领带还给我。","我在她开口说些什么之前，抢先提起另一个必须物归原主的东西。","「我的衬衫给妳，反正已经没机会再穿了，妳就留着吧。至于妳的衬衫还是还给妳比较好吗？」","虽然跟她说我把衬衫带来了，然而我的书包里没有该还给她的东西，就算要我还她也没办法，我却觉得事态不会朝令人困扰的方向发展。","「不用今天还我没关系。」","尽管说得很含糊，但宫城将衬衫托我保管了，然后像是要改变话题似的，又补上一句。","「妳今天到底为什么叫我过来？」","「想跟妳一起享受校庆啊，我刚刚不是说了吗？」","「认真回答啦。」","「因为我们一直没碰面，我想跟妳说点话。」","在校庆之前，宫城一副对这个活动没多大兴趣的样子，今天看见的她却显得很开心。","结果即使没跟我碰面，她感觉也过得很开心，就算我去找她，一定也只会摆臭脸给我看，而且我在学校不能向她搭话。拜此之赐，去年还觉得很好玩的校庆，今年反倒没那么有趣。我明明过得一如去年，然而没有同样的感受。","所以才会传讯息给宫城。","我不想让校庆就这样无聊地结束。","就只是基于这种程度的理由。","「想说点话结果是那样？那样根本不算说话。」","宫城语气低沉地说。","「只是做得有点过头了，但还是有跟妳说话吧？」","虽然确实是做了说话以外的事，可是我也有跟她交谈。","以比较笼统的方式概括而论，要说彼此有讲话应该也没什么问题。","「才没有。」","「有吧？倘若觉得说得不够，要再多说点也行啊。」","「我才没说不够。」","她以心有不满的表情加上一句：「真不爽。」但似乎没打算再多抱怨什么。","「时间也差不多了，回家吧？」","与其说是询问，不如说我是在告知决定事项。宫城点了点头，尽管待在这里的时间不算长，但距离校庆结束早已过了好一段时间。日落的时间变早了，外头的天色已然暗下来。","「妳要先走吗？」","考虑到宫城应该不想被人看到跟我走在一起，我开口问她。","「……仙台同学先走。走到鞋柜之前，我会跟在妳后面。」","「跟在我后面说不定会被其他人看见喔？没关系吗？」","「我会和妳保持一段就算被看见也没关系的距离。而且——」","「而且？」","我大概想像得到她说到一半的话后面的内容是什么。","尽管如此，却还是反问她，接着便传来她不高兴的声音。","「因为旧校舍很恐怖。」","「要我牵着妳的手吗？」","「不用做这种多余的事，赶快走啦，天色都要变暗了。」","「反正已经暗下来了，妳不如走在我旁边？」","「绝对不要。赶快离开走廊啦。」","皱起眉头的宫城打开门，推着我的背。","我无可奈何地走了出去。","走廊上响起啪哒啪哒啪哒的轻盈脚步声，还能听到另一个像是要追上来的脚步声。回头就能看见宫城，我的心情变得比校庆时好多了。","宫城明明阻止了我，我却无法阻止自己。","不用冷静下来思考也知道。","今天的我很奇怪。","待在暑假时被宫城以「很常见」形容的房间里，我轻轻呼出一口气，在床边坐下。","在学校把宫城叫出来，逼她跟我接吻，简直是疯了。","不仅如此，我们还真的接了吻。","然而我不后悔。","没有逃走的宫城也是同罪，与我毫无二致。是因为她也想要，我们才会接吻的，一定是这样。","——这不过是谎言。","虽然宫城允许我吻她，逼她接吻的人却是我，如果不那样做，事态就不会演变至这个地步，我现在只是在自欺欺人罢了。尽管心知肚明，然而到这个时候，我仍思考着「想再跟她接吻」这种事，真的是该下地狱。","叹气叹到连脑浆都快跟着吐出来了。","但我还是仿佛要将肺里清空似的长叹了口气，整个人倒在床上。","房里的墙上用衣架挂着一件衬衫。","那件短袖衬衫是宫城的，结果我没能还给她，一直挂在墙上，成了衬衫的固定位置。","「收起来吧。」","我站起来折好衬衫，收进五斗柜，放在宫城送我……应该说是硬塞给我的长袖上衣旁。她的东西逐渐增加，侵蚀着我的房间，放在存钱筒里的五千圆也是我从她那里收到的东西。就算毕业，她的痕迹仍会留在这里。","五千圆花掉就行了，衣服也只要拿去丢掉就好。","尽管心里明白，我却仍旧做不出这些任谁都能办到的事。对连接吻都忍不住的我来说，不管事情多么简单，一旦和宫城扯上关系就会变得非常困难，没办法顺利完成。","我呼出一大口气代替叹气。这时桌上的手机响了。","反正一定是羽美奈吧——我怀着这样的想法看向手机萤幕，果然是羽美奈。她传来一串诸如今天玩得很开心，还有下次想去其他高中的校庆玩这些兴奋又雀跃的文字。要认真回她也很麻烦，我只回了句「对啊」就把手机丢到床上，坐到书桌前。","校庆才刚结束，学校的时程安排实在称不上好，不到两周后就是期中考了。虽然维持着足以考上志愿大学的成绩，然而凡事没有绝对，所以我不能不念书。","事到如今，我不打算改变自己的志愿。","却很在意宫城的话。","仙台同学留在这里啦。","看起来是认真的，然而那不像她会说出口的话，却也沉重得不像是一时兴起便能脱口而出的话。","改变志愿，留在这里。","我从未考虑过这个选项，也认为不可能这么做，因为要是不能离开这个家，上大学就没意义了。无论选择哪一所大学，父母都已经说好会照顾我到大学毕业，既然如此，挑一所能离开这里的大学比较好。","如果……","留在这里，到毕业典礼结束后，我跟宫城的关系便不会就此告终。","我忍不住思考着这件事，却又觉得不可能发生。","即使留在这里，宫城走在身旁的未来也不会到来。","毕竟顽固的她八成会坚守「这段关系只到毕业为止」的约定，即使没遵守约定，也会像今天一样说「我绝对不要」，不肯走在我身旁吧。","犹如要让灯光穿透般地对着日光灯抬起右手，我盯着手。","回家之际，我对宫城说的「要我牵着妳的手吗？」有一半是认真的。","假使会怕，我可以牵着她的手。","我是这样想的，更进一步来说是想抓起默默跟在身后的宫城的手，牵着她走。","我握紧伸向天花板的手，随即张开。","暑假期间，我没有想跟宫城牵手的念头。","在学校撞到她之际，也没有想跟她牵手的念头。","虽然有时会想碰她，但也仅只于此。","今天却想和她牵手。","见到宫城之后，我就否定着过去的自己活着，拜此之赐，连自己明天会变得怎样都不晓得，心情郁闷无比。","映入眼帘的手只是普通的手，与宫城的手没什么差别，虽然以身高来看，我的手可能比较大一点，但没有什么特别之处，明明和暑假一样毫无改变，却想和宫城牵手，甚至觉得要是这只手掉下来，就会直接飞到宫城身边。","若只针对牵手这个行为，不管是跟羽美奈或麻理子都能牵。如果对象是她们，一旦想牵手，要牵多久就能牵多久，甚至就算跟其他更不熟的对象牵手也行。手就是这样的东西，无论跟谁都能牵，然而我想牵的对象有限。","好比说期间限定或数量限定的限量商品，因为感觉很稀有，会令人情绪高昂，可是「宫城限定」就伤脑筋了。要是什么都限定在她身上，我会无法动弹，行动受到过多限制。","我的行动原本只会在放学后受她限制。","况且我们早就接吻过了，还差点更进一步，事到如今才想牵手，顺序实在很奇怪。","我随着叹气声放下手。","不牵手也没关系。","这点程度的事情还能忍耐，我能断言。","问题在于我无法断言不会跟她接吻。","我忍不住叹气，这已经不知道是今天第几次叹气了。","「……都是宫城的错。」","今天，我得知了如果表示想接吻，宫城尽管不情愿也会接受的事实，要是再说出同样的话，她想必仍会接受。这么一想，我就不敢说自己不会再做出跟今天一样的行为，甚至开始觉得等到毕业典礼，一切都划下句点后，就不需要勉强自己忍耐了。","就算再怎么强调我们不是朋友，也不代表要做什么事都可以。","用来防止理性松懈的其中一颗螺丝大概掉在音乐准备室了。令人困扰的是，我不打算把它找回来，也没想要准备新的螺丝。","「啊～总之来准备考试吧。」","即使继续想着她，我依旧想不出彼此之间正确的关系性究竟为何，念书准备迎接一定有正确答案的期中考反倒轻松多了。","而且做点什么事情比较能够转移注意力。","我打开课本和笔记本，放在桌上。","虽然丢在床上的手机又响了，我的视线仍落在课本上。","校庆结束后大约过了一周——","学校里完全染上了期中考的色彩。","不长也不短。","要说马上却又感觉太久的今天。","宫城传来了一如往常的讯息。","要是在那天之后马上叫我过去，实在让人不知该如何是好，所以时间久一点反而正好。也多亏有时间想像宫城或许同样不晓得该如何面对我，我才能保持冷静地坐在她身旁。","尽管行程老是对不上，导致我迟迟无法过来，这个房间待起来依旧舒适。虽然宫城的视线异常强烈，但那可能是因为明明已经入秋，天气却跟夏天一样热，让我脱下换季制服的背心。我把衬衫上面数来的两颗扣子都解开了，她没道理再嫌我跟平常不一样。","「妳觉得自己期中考成绩会变好吗？」","我翻了一页课本，拿近在眼前的考试问她。","「我不知道。」","她从我身上瞥开视线。","「暑假时我不是曾教妳功课吗？」","「是没错，但又不是妳教了就一定能考好。」","「我是觉得妳的成绩会变好啦。」","暑假的我们做了些不可告人的事，但有更多时间在念书，她要是成绩没变好才奇怪，而且如果没变好也很让人头痛。然而不管是「感觉会变好」，或是「应该会考得比较好」，宫城都不肯说。","「期中考考完后，让我看妳的成绩。」","我用笔戳了戳宫城的手臂，催她回答。","「为什么一定要给仙台同学看成绩啊？」","「因为我暑假当了妳的家教啊，想知道成效如何嘛。」","「虽然是这样……」","「我也会让妳看成绩啦。」","「不用给我看。」","「那我的不给妳看，让我看妳的。」","「我的成绩根本不重要吧？」","尽管宫城说得无关紧要，但成绩要是真的不重要，我就不会拜托她给我看了。","要是清楚知道她的成绩，就能推测她大概考得上哪所大学，更进一步来说，可以知道她是不是有机会跟我上同一所大学。我没有权力改变她的志愿，也不打算硬逼她改变，却想知道她的考试成绩。","「才没有不重要。上大学之后我还想继续打工当家教，可以当作未来的参考。」","「听起来像说谎。」","「真的啦。」","上大学后我的确打算要打工，却没决定是家教，但或许会是选项之一，所以也不完全算是说谎。","「让我看啦。」","我再说一次。宫城以发自心底排斥的声音回答。","「……要是看了不会说些什么，我就给妳看。」","「说些什么是指？」","「分数太差，或是这种题目怎么会写错之类的。」","「我才不会说那种话。」","「那就可以给妳看。」","她脸上依然挂着不想给我看的表情这么说。","那语气让人相当怀疑她是不是真的会给我看，但也只能相信她本人的话，倘若补上一句：「约好喽。」或是追问：「真的吗？」感觉都会让她推翻刚才心不甘情不愿说出的那句「给妳看」，改口说「死都不会给我看」。","我再度重申：「我只会看，什么都不会说的。」接着看向课本。解完几个问题后往旁边一看，只见宫城虽然低头，却没有看着课本或习题。","安静的房间里响起指尖「咚、咚」地敲着桌子，带有节奏感的声音。","那是她制造的声音，虽然不算吵，却让人相当介意，难以集中精神。当然，这声音的制造者也不像有在专心念书的样子。","到底是怎样？","最近……应该说要追溯到校庆前就是了，宫城相当认真地在念书，然而今天一点干劲都没有。","快要期中考了。","她不认真念书的话我会很困扰。","我打算开口叫住持续用指尖敲桌子的宫城，她却抢先跟我搭话。","「仙台同学。」","「什么事？」","咚咚声停了。","宫城安静了下来。","也不管是她自己出声叫我的，她什么都不说。","「宫城？」","看着没事应该不会叫我的她，我稍微等了一下，才传来微弱的声音。","「……仙台同学的生日是什么时候？」","「咦？我的？怎么突然问这个？」","出乎预料的话让我忍不住反问。","「没什么理由。」","「宫城的生日是什么时候？」","「九月，已经过了。我的事不重要，告诉我妳的生日啦。」","「我不想说」或是「是我在问妳」。","本以为得到的答复会是这种抱怨，她却毫不抗拒地回答，感觉连抱怨的余力都没有，于是我也老实地回答她。","「叶月。」","「那是妳的名字吧？」","「不是那个意思。皐月、水无月、文月。」","从五月开始依序说出旧历的月分名称后，宫城终于意识到「叶月」除了名字之外的其他含意。","「——八月？」","「对，八月出生，所以叫叶月，很单纯吧？」","以日本传统的月分名称来说，八月是叶月。","因此在八月出生的我被命名为叶月。虽然这个命名方式感觉没什么坚持，不过我很喜欢「叶月」这个名字的发音。","「所以？妳问这个干嘛？」","我依旧不清楚她突然问我生日有什么意义，于是开口询问，然而她不但没说出对我生日月分和名字关联性的感想，也没再追问是八月的几号，就这样陷入沉默。以一个主动要求别人告知生日的人来说，反应未免太平淡了。","有什么只需要知道生日月分的情境啊？","她说完八月后就一直低着头，让人更摸不透为什么要问我生日了。","「如果这个问题没什么特别的含意，那就念书啦。」","宫城会说些让人搞不懂的话，却不太会说毫无意义的话。尽管觉得她问我生日应该有什么含意，然而即使问她也不肯回答，我莫可奈何。","我的视线落在课本上。","然而别说开始念书了，她反倒突然站起来，从书桌抽屉里拿出一个小盒子来。","「这给妳。」","伴随着不带感情的声音，她把那个盒子放在我的课本上。","「说要给我……这是什么？」","我盯着眼前的小盒子。","「……还问我是什么？里面放了我要给妳的东西。」","「我知道，但不是要问那个。妳为什么会突然拿出像礼物的东西呀？」","「又没关系。都说要给妳了，妳收下啦。」","其实就算不问，我也知道这盒子是做什么用的，只是想透过宫城的话来对照自己心里的答案。","「可以把这个当成生日礼物吗？」","即使追问下去，我也不认为她会公布正确答案，便自己说出解答。","「仙台同学这么认为的话，就当成生日礼物吧。」","她真的很不老实。","小小的盒子有着漂亮的包装，彰显出这是特地准备的东西。问完生日后拿出这种东西，不说也知道这是生日礼物，我不懂宫城干嘛不承认，更进一步来说，也不懂她准备生日礼物的用意是什么。","为了之前根本没有打算知道的生日准备礼物，怎么想都很奇怪，我们也不是会互送生日礼物的关系。","「要是我生日的时候没来，妳打算怎么办？」","「不怎么办。即使是生日礼物，也没人规定一定要生日当天才能送吧。」","「不惜做到这种程度也要送我生日礼物，应该有什么理由吧？」","「不要就还我。」","她粗鲁地说，没等我回答就抢走放在课本上的小盒子。我一时情急地抓住她的手。","「等一下啦，我把这个还给妳的话，妳又会怎么办？」","「丢掉。」","「马上就说这种话……没必要丢掉吧？」","「因为这东西我又不用，也没有其他能送的人。」","我尚未解开这不可能毫无用意就准备好要送我的生日礼物之谜，但显然没有空悠哉地解谜。倘若犹豫着要不要收下，宫城真的会把盒子连同内容物一起当成垃圾丢掉。","「总之我会收下。给我。」","我从宫城手里救回小盒子，开口询问。","「可以打开吗？」","「不打开的话我干嘛给妳？」","宫城没好气地抛下这句话。从这样一直呛我的态度来看，她的心情似乎不太好。","她看似嘴里塞满了百分之九十九的黑巧克力，望着漂亮地包装起来的盒子。还是第一次看到表情这么不高兴地送我生日礼物的人，宫城想必是第一个，也是最后一个吧。","她这样我还真难打开。","面对刺来的视线，我轻轻呼出一口气，接着小心翼翼地撕开包装纸，打开盒子，里头是一条银色的项链——硬要分类的话，或许该说是吊坠——总之放着饰品。","底下垂挂着仿照月亮形状制成的小小坠饰，对我来说好像太可爱了点。我一边想着宫城搞不好更适合戴，一边拿起项链，观察坠饰和链条。本来有些担心如果这很贵该怎么办，但看了一下品牌，发现似乎不是那样的东西。","我已经从宫城那里收下五千圆。先不提这饰品是不是生日礼物，我没有厚脸皮到收下别的东西，还能摆出一副若无其事的样子。","「我会再送妳礼物当作回礼的，妳想要什么？」","我把项链放回盒子里，同时问她。","「什么都不需要。」","「意思是送什么都行？」","「妳不用回礼。」","她以意外强硬的语气这么说。","「这说法很伤人耶。」","收到点心的回礼，或是借笔记的回礼；送点什么小东西当成礼物，或是收到一些礼物，都是很常见的事。既然收到生日礼物，送些什么作为回礼说是基本的礼貌也不为过，她却强硬地拒绝了，根本不懂得看气氛说话……不对，如果不是我送的，她或许就会收下。","好比说是宇都宫送她的。","这件事还是别再多想比较好，我盖上盒盖。","「只有我可以给妳东西，仙台同学不用给我。比起那点，妳现在就把它给戴上，这是命令。」","宫城说完后，打开才刚盖上的盒子。","「要戴是可以，但通常不是送的人会帮忙戴上吗？」","「妳自己戴。」","「一般人在这时候会说『我帮妳戴』吧？」","「我才不会说。」","尽管早有预期，宫城却冷淡地说。","她这种个性真的很不可爱。","「喔。」","倒也不是希望她能帮我戴，可是她的说法一点都不好玩。不过现在对她说什么都没用，要是说了什么无聊话，她一定会追加命令，而且绝对没好事。","我从盒里取出项链。","解开扣头，慢慢戴上。","「我戴好了。」","我以指尖抚摸项链坠，望着宫城。虽然不讨厌饰品，但是和制服一起穿戴在身上，总觉得胸口附近让人有些浮躁。","「看就知道了。」","「不是那个问题。妳没什么要说吗？」","「可以摸吗？」","「说点感想啦。」","我是要她说感想，没说可以摸，然而她的手理所当然地伸了过来。即使是说客套话，我也不认为她会说出很适合我这种话，因此早就预料到她不会提出感想，却没想到会被摸。我反射性地往后缩，但宫城的手先碰到了我。","指尖顺畅地顺着链条滑过。","手指微微碰到皮肤，感觉好痒。","「链条是不是有点长啊？我喜欢更短一点的。」","我抓住她那动作实在说不上好的指尖，抱怨起其实不是很在意的事情。","「比这更短的话，在学校就会露出来了。」","她像是在确认长度，拉了一下链条又放开。","「我连去学校都要戴着它吗？」","「戴到毕业典礼为止。」","「意思是到高中毕业前，都要一直戴着？」","「对，一直，无论在学校或家里都要戴着。」","「这也是命令？」","「对，命令。」","宫城以不强不弱的语气说。","项链只是项链，外观看起来不过是普通的饰品，就算一直戴在身上也没什么好奇怪的。","然而我懂她的弦外之音。","这想必不是单纯的饰品。","她不是会心血来潮送我礼物的人——这话要是说出口，她八成会理所当然地同意，所以我才不说。不过我想这项链更像是用来宣告所有权的项圈，否则她不会针对要我戴在身上这件事，加上「到毕业典礼为止」的期限。","「学校不在命令的范围内。」","虽然只是饰品，不过一想到这是宫城送的东西，就有种脖子被缓缓勒紧的感觉，有点难受。","过去也曾发生过类似的事。","留下吻痕或齿痕。","然而那些都是会随着时间消失的痕迹，不像饰品会一直留存。即使这个礼物几乎没有重量，我却觉得格外沉重，至少在学校的时候会想拿下来。","「把规则改成戴着它没关系就行了吧？仙台同学偶尔也让步一下啦。」","她的话跟我在音乐准备室说过的话一样。","没想到事到如今，我居然会被过去的自己给捅一刀。","「让步吗……既然如此，只要宫城开口拜托我说『请妳戴着』，我就听妳的。」","我拿她绝对不会做的事情当成条件。","「那就算了，要不要戴随妳便。」","「宫城，这种时候妳就老实地拜托我如何？」","「不要。」","如我所料，她收回了一度说出口的命令。","这样我就能自由决定要不要戴项链了。","我望向宫城，身旁的她不高兴地沉默不语。","指尖「咚」地敲了一下桌子。","我又听到一声「咚」，她伸手拿起原本收着项链的盒子。","她大概是后悔给我礼物了吧？","我知道。","没必要退让。","宫城不肯拜托我。","所以这不构成命令。","明明知道，嘴巴却自己动了起来。","「……如果只要戴着就好，我到毕业前都会戴着，但要是被老师发现而没收了，我可不管喔。」","我从她手里拿回小盒子。","我有自觉，也已经做过很多次同样的事——总之我就是太宠宫城了，宠到愿意接受范围外的命令，选择一直戴着项链。","「妳不解开上面数来第二颗扣子，应该就看不到。」","望着我的衬衫，宫城平静地说。","「我觉得看得见耶。」","「妳扣上第二颗扣子看看。」","原本解开两颗衬衫扣子的我依言扣上扣子，接着维持跟在学校时一样，只有最上面那颗扣子解开的状态问她。","「看不到吗？」","「放心，看不到。」","「那就好。」","「……仙台同学，之后不可以让别人看到它。」","「咦？要不让人看到很难吧？毕竟上体育课的时候得换衣服。」","「绝对不能让我以外的人看到。」","说她的命令是在刁难人也不为过。","虽然可以尽量不给人看，可是既然学校有必须换衣服的课，就很难一直藏着这条项链不让人看见。况且「我以外的人」这句话紧紧攀附在脑袋里，那表示宫城是例外。我马上得出了一个结论。","「所以不能不让宫城看吗？」","「反正仙台同学在这里的时候都会解开第二颗扣子，我看得到。另外要是我命令妳，就要让我看。」","「既然看得到，根本不用特地命令我吧？」","「要让我看清楚的意思。」","「……这命令会不会太色了？」","毕竟不是要我脱掉制服，让她看项链这命令应该还在规则的范围内。","不过「我主动解开扣子，她就看得到」跟「她命令我，就要让她看个清楚」，两者单就结果来看，虽然状况类似，心理层面上却截然不同。但凡宫城开口就得让她看，算是相当过分的行为。","「才不色。现在就让我看。」","刚刚才叫我扣上扣子的那张嘴，这下又强制要我解开扣子。","「妳果然很好色嘛。」","「没仙台同学那么夸张。再说妳平常就会解开两颗扣子了，所以少废话，解开啦。」","「真的要我再解开吗？」","「不解开的话我看不到。」","尽管一如宫城所言，我平常在这里时都会解开第二颗扣子，却因为加上让她看项链的这个条件，变得莫名地难以执行。在我犹豫之际，她又补上了一句：「这是命令。」","「只要解开就好了吧？」","一旦把没什么大不了的事情看成大事，感觉真的会把事情给闹大，于是我老实地解开刚扣上的扣子。","「这样就行了？」","感觉得到宫城的视线停在我的胸口上。","虽然知道她看的是项链，锁骨一带仍有种令人浮躁难安的感觉。","「没必要这样猛盯着吧？」","「只是在看我给妳的东西，要怎么看都行吧？」","「妳是想做这种事才特地准备礼物的吗？」","要我解开扣子，想看我的胸口。","除了用来代替项圈外，即使包含这种理由也不奇怪。","「仙台同学不用知道我是基于什么理由才准备的。」","宫城平静地说，接着又说：「然后……」","「再解开一颗扣子。」","「现在这样就能看见了，够了吧？」","「看不清楚。」","「妳从刚刚开始就直盯着吧？」","「我想看得更清楚一点，这是命令，照我说的做。」","基本上，从上面数来的第三颗扣子是不该解开的。","然而今天宫城感觉不会死心。","基本归基本，还是有所谓的临机应变或例外存在，所以要我今天特别解开第三颗扣子也不是不行。尽管不觉得她只是想看项链，但在这里跟她僵持不下实在很麻烦。","「好好好。」","我随口回答，解开领带，就连第三颗扣子都解开，宫城的手随即伸了过来，指尖虽然碰到衬衫，不过没做出拉开领口，让我的胸口整片暴露而出的动作，只有稍微拉开到能看见项链。","我的内衣和肌肤已经给她看过好几次了，事到如今没什么好害羞的，内心某处却仍有些不平静，仿佛飘在空中般缥缈不定。","她的手指沿着链条滑动。","慢慢摸过的手犹如数着连接的金属环，感觉很痒。","她将体重压在原本缓缓摸着链条的手上。","刚才还在摸项链，顶多只是顺便碰到肌肤的手用力推了一把，让我失去平衡。她的身体就这样压上来，把我推倒在地。","「等一下，宫城，很痛耶。」","尽管不到非常用力，我依旧以不小的力道撞上地板，背跟肩膀都很痛。但宫城一言不发地将脸凑近我的胸口，吻了坠饰。","由于坠饰很小，这等于是吻在我的胸口上，她却将整个嘴唇抵上来，像是要让我了解这个吻是为了碰那个小小的东西。","她并没有把全身的重量都压在嘴唇上。","可是好重。","好难受。","被嘴唇触碰的地方莫名地热。","她总会一脸若无其事地对我做出这种事。","感觉没有为我这个被吻的人着想。","吸气、吐气。","不过就是呼吸而已，却变得困难至极。我轻轻拉扯胸前的头发，宫城抬起头。","这次改成用手指抚过链条。","望着她的行动，我知道自己的想法没错，无论是在吻坠饰之前，还是现在，她始终保持沉默，什么都没说，我却觉得这些行为根本是在宣示所有权，而且比过去的任何行为更令人这么想。","这条项链大概、也许、应该……不对，是绝对带有「仙台叶月到毕业典礼前都属于宫城」这样的含意。","老实说，我真的不知道该讲什么才好。","虽然不想告诉她本人，我却接受了这个礼物；尽管觉得难以呼吸，十分麻烦，但我并不排斥。","「宫城，可以了吧？」","想不到该说些什么的我，只好随着这句比较保险的话拍打她的背，但她不肯退开，不仅如此，又吻了一次坠饰，然后以指尖抚摸着小小的坠饰，手指必然地碰到我的肌肤。","果然还是很痒。","我不至于因此笑出来，皮肤表面却一阵搔痒。","触碰坠饰的手指轻轻地压在肌肤上。","月亮坠饰的冰凉感与宫城的体温交融，流入我的体内。","我回想起暑假最后一天。","不只是搔痒感，指尖连同那天的记忆一并带来别的感情。","宫城正自作主张地试图解开我的第四颗扣子。","这下不妙。","心中那股显然不该对现在的她涌现的感情逐渐膨胀，我抓住她的手。","「宫城，停下来，再继续下去就不好了。」","「是因为这样违反规则而要我住手？」","「那也是原因之一，不过主要是我的理性快飞走了。」","能不把这当一回事地任她为所欲为，也就到此为止了，要是不就此结束，会发生对现在的我们来说并不好的事情，我不相信自己的理性。宫城也是，倘若不能理解这点，我们两个都不会有好下场。","「仙台同学的理性究竟是怎么了？不要那么不负责任地飞走，好好绑着，别让它乱跑好吗？」","「那还满难的耶。」","「……妳为什么会这么没自信啊？」","她有些傻眼地说。","就算这样问我，我也不知道为什么，同时不懂都到了这个地步，宫城为何还想相信我的理性，以至于回答变得很随便。","「我自己也不知道，所以妳自重点。」","说得像是要把责任都推给宫城一样，她陷入沉默。","看似在思考些什么地皱起眉头。","面有难色约十秒后，她静静开口。","「如果说让我解开一颗扣子，妳想接吻也行呢？」","她烦恼后得出的结论，是我从未想过她会说出口的内容。这次换我沉默了。","我在脑子里反刍方才听到的话。","接着向本人确认是否理解错误。","「——意思是我可以吻宫城？」","「对。」","没想到她会提出这种交换条件。","以前我也曾在宫城面前解开过第四颗扣子。","不是需要犹豫的条件。","「好啊，解开也无所谓。」","会发生不好的事。","这实在不是刚刚带着危机意识阻止宫城的我该说的话。","实在不能相信自己的理性。","「仙台同学自己解开。」","「好。」","我依她所言，解开第四颗扣子。","宫城的手指碰触我的肚子，我的身体有些紧绷。","掌心紧密地贴了上来。","有股缓缓渗透的暖意，却难以令人心情平静，我一瞬间屏住呼吸。那股热度仿佛深入至内脏，我抓住她的手腕，然而感觉不到她有想要继续往下摸的意思，她的手滑顺地摸到腰附近后便离开了。","「妳可以吻我。」","宫城小声地说。","我稍微坐起身，伸手触碰她的脖子，一路滑到她的后颈，让她更靠近我，随即把脸凑了过去。距离我们最后一次接吻并未经过太久的时间，但我想早点碰她，有些强硬地把嘴唇叠上她的。","宛如品尝着那让人还想再度体验的柔软触感，我轻轻地咬了她的嘴唇。换作平常，宫城早就会动手推我，要我早点退开，今天却难得温顺，感觉就算解开她的一颗衬衫扣子，也会容许我这么做，于是我退开嘴唇，拉松她的领带。","宫城毫无抗拒。","她睁一只眼闭一只眼地放过我解开她一颗扣子的行为。我的嘴唇凑近她的脖子，然而在吻上去之前，她便用不小的力道推了我肩膀，我的身体又倒回地板上。","「结束了。」","斩钉截铁地说完后，宫城坐起身来。","「太快了吧？」","「那我也可以继续做比刚才更进一步的事吗？毕竟这是交换条件，如果仙台同学还要再接吻一次，我也要做点什么。」","「妳又没说接吻只有一次。」","「就算没说也只有一次。」","「太不讲理了吧？」","「况且我只有碰一下，感觉只能算一次接吻的份。」","她以没在掩饰不满情绪的语气说道，扣上自己的衬衫扣子。","「我知道了，就结束吧。」","再继续啰唆下去，感觉她又会下什么不好的命令。我并非希望更进一步，只是她容许的话，想再多碰碰她而已。","我慢吞吞地爬起来。","打算扣上一直敞开着的衬衫扣子，宫城的手却伸了过来，开始替我扣起扣子。她从下面开始一颗又一颗地扣上，连最上面那颗都扣起来了。","「这样很难受耶。」","我开口抱怨后，她冷淡地回答。","「就这样扣着。」","「这是命令？」","「不是。」","一脸嫌麻烦地说完后，她随即朝桌子走去。而觉得很难呼吸的我解开一颗扣子，系上了领带。","〔本话含插图〕"]},{"t":"第5话　仙台同学很任性","p":["我看着放在书桌上的考卷。","结果不算差。","不如说变好了。","但这不是能和仙台同学上同一所大学的成绩。我会让等等造访这房间的仙台同学看考卷，不过她的感想一定跟我一样。","那原本就不是考得上的大学，我也不觉得自己稍微认真念书就能追上她，因此这结果没什么不好的。","由于并非需要感到消沉的事，我没有太过在意。尽管心情有些沉重，但八成是因为天气不好。","我的视线移向窗外。","午后下起的雨，直到现在还在下。","天空灰暗，是令人忧郁的天气。","我叫仙台同学过来的时候，她曾说会晚一点才到，所以还没来。","为了打发时间，我拿出手机，看起大学的线上导览手册。","翻了几页的我叹了口气。","显示在画面上的导览手册不是我的志愿，而是舞香的志愿，我看过好几次，几乎已经掌握所有内容。尽管不像仙台同学的志愿那么难，但不久之前我如果说要报考这所大学，老师八成会面有难色吧，不过它现在不再是我报考前就该放弃的大学，况且离仙台同学的志愿很近。","还来得及。","我不是不能报考外地的大学。","翻到导览手册的最后一页后，我关上手册。即使看了也不会有什么改变，我依旧接着点开了仙台同学要去念的大学导览手册。毕竟看过很多次，内容也不会因为到今天而有什么改变，于是我机械性地翻了几页，看到一半就关上了。","我把手机放在桌上。","从铅笔盒里拿出两块橡皮擦里的其中一块，那是仙台同学不惜在学校把我叫出去，也要还给我的橡皮擦。和她相处的记忆正逐渐增加，其中某些恐怕会化为回忆，尽管期中考前给她的那条项链不像橡皮擦在我手边，感觉却也会变成那样的存在。","——这不是什么好事就是了。","倘若会留下回忆，希望只会留在仙台同学的脑海里。","我不想留在脑海里。","虽然这么想，不过做出会留在仙台同学脑海里的事，便表示同时也会留在我脑海里。无论留下来物体是否有形，脑中的她仍不断增加，就连一块橡皮擦都染上了她的气息。","明明不打算像这样一再增加彼此共同的记忆，但我不知为何总是在做这种事，结束和仙台同学关系的日期没有改变，早就决定好了，却看起根本没要报考的大学导览手册。真想把做出这种无聊事的自己丢到别的地方去。","今天要是没叫仙台同学过来就好了。","想着事到如今早已莫可奈何的事，我叹了口气。门铃响了。","用不着确认也知道是谁到来。","我把橡皮擦收回铅笔盒里，解除大厅的门锁，没过多久仙台同学就来到我房里。","「今天很冷呢。」","她一边打喷嚏一边说。","十月进入尾声，服装也已经换季成冬季制服。今天的天气对怕热的仙台同学而言，说冷也不为过。","「雨下得很大吗？」","「已经变小了。」","「肩膀都淋湿了。把制服外套给我。」","见我伸出手，仙台同学脱下了有些淋湿的外套，解开衬衫的第二颗扣子，看得见项链挂在胸口。虽然想触碰那条银色的项链，但接过外套，挂在衣架上后，我随即走向厨房。","半开着冰箱的我看向热水壶。","确认里头还有热水后，我自架上抽出茶包，泡了红茶，再从冰箱里拿出自己要喝的汽水，回到房里。只见仙台同学已经坐在固定的位置上。","把杯子放在桌上后，传来她开朗的声音。","「这是红茶？」","「要是觉得汽水比较好，妳就喝汽水吧。」","「红茶比较好，谢谢。」","她以看似相当开心的笑容望着我，我转身背对她，从书桌上拿了考卷过来。虽然不太情愿，不过已经约好要给她看了，我把考卷和五千圆钞票一起放在桌上，坐到她身旁。","「给妳。」","喝着红茶的仙台同学放下杯子，道谢并收起那张五千圆，随即拿起考卷。","「妳有要让我看考试成绩啊？」","「是妳叫我要给妳看的吧？」","「是这样没错，但没想到妳真的会给我看。」","「不看就还给我。」","我伸出手，她却没把考卷还给我，也没回话。","她就这样默默地盯着考卷。","「没什么要说的吗？」","「宫城不是叫我什么都别说吗？」","我的确曾这样说过，然而一言不发地确认考试成绩和内容，让人感觉很不舒服。假设她一一挑出问题，说这里不好、那里不对，我应该会很挫折，可是连一句好或不好都不说，感觉也很不舒畅。","「妳可以说话，所以至少说句什么吧。」","「虽然不清楚妳之前的考试成绩，但我想应该进步不少？」","「对。」","「妳还想再多念点书吗？」","「不想。有这个成绩应该就能考上大学了，已经够了吧？」","我从她手里抢走考卷。","「要看我的吗？」","「比起考卷，给我看项链啦。」","见仙台同学打算打开书包，我拉住她的制服。","「让妳看项链是命令吗？」","「对。」","「这以分类来说是有坠饰的饰品，好像不该说成项链，而是吊坠耶。」","「怎么说都没差吧？」","「也是啦，只是感觉问题。」","以怎样都好的语气说完后，她看着我。","「请，妳就看到满意为止吧。」","尽管声音听起来很随便，不过她有遵从命令，所以没关系。","我摸着衬衫上有时可以解开，有时又不能解开的第三颗扣子。","她想抓住我的手，却又马上收了回去。","第三颗扣子想必已经变成可以解开的扣子了吧。","我想看项链看得更仔细，于是解开她的领带和那颗扣子，虽然不到领口大开的程度，但可以看见内衣。由于实在不好碰她的内衣，我摸了项链。","「好痒。」","「忍耐一下。」","之前交换的领带已经换回来了。","而我们约好这条项链她会一直戴到毕业典礼为止。","我轻轻拉扯链条。","「宫城太粗鲁了。」","「妳很吵耶，安静一下啦。」","「是是是。」","我用指尖抚过链条。","最近的仙台同学太恣意妄为了。","在学校把我叫出去，吻了我。","做些我没命令她做的事。","虽然不讨厌和她接吻，但在学校说想接吻就不对了。她理应服从我，不该主动说想做些什么。要做什么必须付出相对的代价，付出代价的人则是我。","不是仙台同学。","得让她搞清楚，有权要她把收到的东西戴在身上、下命令的人是我，她只能服从我。","期限到毕业典礼为止。","在这段期间，她根本不用理会茨木同学或其他人说的话。","只要看着我就好了，能碰她的人有我一个就够了。","「满意了吗？」","大概是受够一直不说话了吧，仙台同学按住持续摸着项链的我的额头。","「妳可以扣上扣子了。」","「宫城，交换条件呢？」","她提起我赠送项链那天的事。","那天，为了获得解开衬衫第四颗扣子的权力，我赋予仙台同学可以接吻的权力；可是今天只解开三颗扣子，我没打算做更进一步的要求。","「刚刚没有做需要提出交换条件的事情吧？」","「我以为妳接下来要做。」","「没有。扣上扣子。」","「提出交换条件啦。」","搞不懂她的话究竟是不是认真的，甚至让人觉得她接下来会说「方才的只是玩笑」当作没发生过这件事，考前她说的「理性会飞走」在我看来也是在说笑而已。真要说起来，我不认为自己身上具有会让她失去理性的要素。","「我不要。」","虽然知道她在期望什么，我却拒绝了她。","尽管不讨厌她吻我，然而不讨厌的行为成了讨厌的事。一旦命令她，我也可以主动吻她，但她一定会说：「原来妳想接吻到要命令我啊？」我才不想这么做。","而且——","要是反复接吻，感觉她会厌倦跟我接吻这件事。","扣上仙台同学的第三颗扣子后，我下达不是她所期望的命令。","「拿本书来朗读。」","「念书呢？」","「等妳朗读完再念。」","她没说「知道了」，也没说「好好好」，系好领带站了起来，走到书柜前。","「要选哪本？」","「挑妳喜欢就好。」","「喜欢的喔……」","像是在自言自语地嘀咕完之后，我听见小小的喷嚏声。","「妳该不会感冒了吧？」","「只是有人在说我的八卦啦。」","她一脸无趣地说着，拿了本漫画过来。","一如往常叫仙台同学过来的讯息，被与平常迥异的讯息给拒绝了。","拜此之赐，我现在正在前往她家的路上。","『我感冒了，请假在家，今天没办法过去。』","收到这个由于不同班而无从得知的事实后，我只回复一句「知道了」，脑中却响起三天前见面时，她打喷嚏的声音。","倘若下雨那天的喷嚏是请假的原因，她可能已经请了几天假。这没什么，不管请假多少天，都不是我需要介意的事。只是至今为止我从未看过她请假，没来由地有点在意她是否没事罢了。","况且——","病倒在跟家人关系看起来不太好的家里，感觉很难受。虽然不清楚跟病倒在没人在的家里相比，到底哪边比较难受，总之绝不是什么愉快的状况。","我很清楚，即使去了也不能改变什么，但至少能带个宝特瓶饮料过去，也能带点吃的给她。尽管没自信这些东西能帮上忙，但有总比没有好吧？","彼此已经共度时光超过一年了，探病很正常，毕竟我也是有人性的，多少会担心，所以这没什么好奇怪的。","一边回忆自己暑假时和她走过的路，我一边朝她家前进。","虽然和仙台同学说过的话我记得一清二楚，但在那之后从未去过她家，不太确定这样走对不对。","途中我看见当时和她一起绕去的便利商店，走进店里。","总之先把瓶装茶和优格放进购物篮。","需要贴在额头上的那玩意吗？","短暂犹豫后，我把贴在额头上用的退热贴也丢入购物篮。考虑到仙台同学和妈妈的关系，感觉会需要这种东西。","我付了钱，走出便利商店。","由于没有事先联络，即使造访可能也见不到她。尽管如此，我依旧没有停下脚步，走了约五分钟，抵达曾经看过的住宅。","站在玄关前的我陷入后悔。","实在不好传讯息叫病人出来开门，既然如此，不按下眼前的门铃就进不了这个家。","以时间来说，仙台同学的爸爸应该还在上班，不在家才对，可是她妈妈我就不知道了，或许有在工作，也可能没在工作，这些事我从未问过仙台同学，她也没主动提起过。总之最有可能来应门的人就是她妈妈。仙台同学这个病人应门的可能性微乎其微。","我对她妈妈的印象实在不太好。","——还是回去好了。","我在玄关前盯着便利商店的塑胶袋。","吸气，吐气。","决定只按一次门铃，如果没人来应门，我就回去。","我把食指放在按钮上后施力。","门铃响起，接着恢复寂静。","没人来应门。","说不定她父母都去工作了，除了仙台同学之外没有其他人在家。","还是回去吧。","就在我正打算转身背对玄关的瞬间，从对讲机传来了不是仙台同学的女性声音，虽然是第一次听见，但那一定是仙台同学的妈妈。","真想就这样右转回家。","可是都已经是高中生了，总不能按了人家的门铃就跑。语无伦次地讲出我是来探病的之后，玄关的大门打开，我在暑假时见过的仙台同学妈妈出现在门后，冷淡地说：「进来吧。」我向她道谢，朝仙台同学的房间走去。","爬上楼梯，两扇并列的房门中靠前面的这扇——","我伸手要敲门，却又猛地打住。","来到这里的我，今年还没有如此后悔过。","虽然没多想……真的是没多想就来了，然而我没有先联络就擅自跑来，仙台同学搞不好会生气，也有可能不让我进房间。","早知道就别按门铃了。","我决定留下买来的东西就回去，把便利商店的塑胶袋挂在门把上。不过大概是因为太紧张了，袋子里的宝特瓶撞到门，发出「咚」一声，声音不小。正当我犹豫着不知该如何是好时，房门打开了。","「……为什么宫城会在这里？」","穿着睡衣的仙台同学这么说。","「我要回去了。」","我转身背对她。","「咦？等等，到底是怎样？」","「没事，妳不用在意。」","我头也不回地回答，在走廊上前进，打算就这样走下楼梯，跑到走廊上的仙台同学却抓住我的制服下摆。或许是因为感冒了吧，那只手虚软无力，硬是甩开病人逃走也让人过意不去，于是我停下脚步。","「就算说不用在意，我还是会在意啊。妳哪会明明没事却出现在我家？」","看来她没有因为感冒而意识不清，开始在意起一些无须在意的小事，甚至注意到我不希望她现在发现的东西。","「这是什么？是妳带来的吗？」","她指着挂在门把上的便利商店塑胶袋。","「那个给妳。」","「……谢谢。妳带着这些东西来，该不会是来探病的吧？」","「不是。」","「妳说不是，却跑到我家？」","虽然的确是因为那样才来的，但我不想承认，于是只能保持沉默，闭口不语。","不熟悉的走廊突然变得鸦雀无声，仙台同学一脸无奈地开口。","「总之先进来房间吧。」","她依然抓着我的制服，拿起挂在门把上的便利商店塑胶袋。无权拒绝进房间的指示，制服下摆被她抓着当人质的我，只能拖着沉重的脚步走进她房间，关上房门。","书架和床舖。","还有桌子。","收拾得很干净。","和暑假没什么不同的房间里，有个大存钱筒放在五斗柜上，是个存五百圆硬币进去可以存到几十万圆，随处可见的存钱筒。之前来的时候没有这东西。","我仔细看了看仙台同学，即使是她，今天也不至于化妆，头发同样没绑。","却戴着项链。","而不知道是家里没有，还是已经没发烧了，她的额头上没有贴着退热贴。","「宫城，妳在那边找地方坐吧，我去拿点什么过来。」","「假设是要拿饮料跟吃的，那个袋子里就有了。」","我对着把便利商店塑胶袋放在床边的仙台同学这么说，她确认了袋子里的内容物。","「我去拿宫城的份过来。」","她说完便打算走出房间，我叫住她。","「不用，躺下啦，妳感冒了吧？而且我马上就要回去了。」","「马上是多久？」","「现在就可以回去了。」","可能是以为我会在她离房时回家吧，仙台同学坐到床上。","「我睡太多了，现在不困，陪我聊聊天啦。」","「没什么好聊的。」","「不说话也可以，再待一下啦。」","她平静地说。","尽管声音和平常毫无二致，可是穿着睡衣又没化妆的她看起来就是个病人，让我觉得自己如果就这样回去，是件非常过分的事。","「还有发烧吗？」","「还在烧。」","「让脑袋冷却一下如何？那里面有放。」","我在跟床有点距离的位置坐下，指着装有退热贴的便利商店塑胶袋。","「宫城帮我贴啦。」","「自己贴。就算感冒了，这点小事还是做得到吧？」","「妳对病人会不会太冷淡了？」","「反正妳还在发烧，冷一点正好吧？」","虽然没认同我是来探病的发言，但我确实是来看看她状况的，却觉得没必要特别温柔。","「今天一天听一下我的请求也无妨吧？」","这么说着的她，把装有退热贴的盒子朝我丢来。盒子划出一道抛物线，掉在我前面。","「这样很危险耶。」","「帮我贴啦，我是病人耶。」","说得好像这是她正当的权力。","换作平常，我会把装有退热贴的盒子丢回去，叫她自己贴。","今天我当然也想这么做，然而眼前的她就如同本人所说的，是个病人。一想到这点，我就没办法表现得像平常那样。","要是她能再有精神一点就好了。","她的声音有点沙哑，是那种一听就知道感冒了的声音。而且都怪我特别问她还有没有发烧，导致更难以冷漠的态度对待她。","我捡起盒子，走近床舖。","「妳可以坐在这里。」","坐在床边的她拍了拍身旁的位置。","尽管不打算说出「这样感冒会传染给我」这种话，脑海中却浮现暑假时在这个房间里发生的事。那天我坐在床上，尽管没有命令仙台同学，她还是舔了我的脚。","我不认为现在的她会做出同样的事情，但足以成为迟疑是否要坐到床上的理由。","「宫城，坐下啦。」","见我不知该如何是好地犹豫着，她的语调从柔和变成带有强制性的口吻。虽然可以站着帮她贴退热贴，不过要是不听话，感觉她又会啰哩啰唆。今天的她正尽情地利用着病人这个身份。","我无可奈何地在她旁边稍远的位置坐下，打开盒子。","「我帮妳贴，头转过来。」","拿出一片退热贴给她看之后，她老实地转过来面对我，却没把额头露出来。为了把她碍事的浏海往上拨开，我伸出手，她却抓住我的手。","好烫。","手臂上传来的温度让我意识到她感冒了，霎时有些退缩。我的手被她用力拉过去，退热贴掉在床上。","彼此之间的距离缩短，嘴唇像是要撞上彼此般碰在一起。","一如她的手，嘴唇也比平常更烫。","舌尖毫不客气地钻进口中。","湿滑的舌头果然也很烫，我除了接受外别无他法","她的体温缩减了我的选项。","好比说推她的肩膀。","或是咬她的舌头。","我的行动受到限制，什么都做不了。","炽热的舌头专心地动着，仿佛在口中探索，我无法抗拒。","那个试图与我的舌头交缠的物体热得仿佛会烫伤我。","她的身体太烫了，害我无法开口抗议。","无法从抓着我的手、触碰着我的嘴唇、柔软的舌头，以及这股热度中逃脱。","希望她放开我。","明明这样想，我却不那么排斥。","都怪她传过来的体温，使我无法做出正常的判断。","尽管不打算回应她缠绕上来的舌头，但也不想把那东西赶出去，持续交叠的双唇实在太过舒服，让我搞不清楚彼此已经吻了多久。","时间的感觉消失，脑中变得满满全是仙台同学。","无法顺畅地呼吸，好难受。","我想从双方交叠的手中逃离，抓住她的睡衣，仙台同学这才缓缓地退开。我差点下意识地拉住她的睡衣，只好口吐怨言来掩饰自己的行为。","「……刚才绝对不是该接吻的时机。」","「因为宫城靠过来了。」","「是妳把我拉过去的吧？退热贴都掉了。妳别再做任何事情了，而且像刚刚那样的吻很恶心。」","因为她是病人就乖乖听话的我真是个笨蛋。","但凡温柔一点，她马上就会做出这种事。","尽管没有排斥到想要抱怨的程度，但我不想再让她吻我了。","「说得更委婉一点嘛，这样我很受伤耶。」","「不要。既然会受伤，就别再做刚刚那种事了。」","「……妳真的生气了？」","我觉得自己的语气没那么凶，然而平常无论我生气或心情不好都不会在意的仙台同学，声音里却透露着不安。","可能是因为发烧而变得软弱了吧？","这样的她打乱了一切。","听到她这么说，总觉得自己好像做了什么坏事。","虽然对仙台同学说恶心，不过那是在说谎，我早已习惯那种接吻方式。或许我对病人说得太过分了吧，尽管不到收回前言，我仍否定了她的发言。","「我没有生气，可是心情很差。」","「既然如此，作为交换条件，妳可以命令我。」","「什么既然如此啊？我才不会命令妳。」","「为什么？」","「我看起来有那么差劲，会去命令一个病人吗？」","尽管有想命令她做的事，但我不至于那么没人性，会命令一个正在发烧的人。相比利用病人身份的仙台同学，我可是很正直的，才会觉得现在就算稍微听听她的请求也无所谓。","「就算宫城很差劲，我也不在意喔。」","「不要净说些奇怪的话，赶快睡觉啦。」","我推了推仙台同学的肩膀，她却不肯躺下，咳嗽了几声。","「妳看，感冒不是又变严重了。快睡。」","「我不想睡。」","仙台同学一边咳嗽一边说。","「一般来说，得了这种会咳嗽的感冒，应该不会跟人接吻吧？我要是感冒全都怪仙台同学。」","「就是想传染给妳才跟妳接吻的。宫城，妳也感冒啦。」","她说出让我怀疑自己是不是听错的话，拉着我的制服袖子。","「这话会不会太过分了？要是感冒了，我会一个人病倒在家里耶。」","虽然平常就搞不懂她在想些什么，但或许是因为发烧，今天更搞不懂她了。正常人才不会说要把感冒传染给别人，至今也从未有人对我说过这种话。","「我会去照顾宫城的。」","「妳不用来照顾我。」","「别客气，不然我直接留宿照顾妳吧？」","「我绝不会让妳留宿，谁知道妳会做些什么？睡觉啦。」","今天的仙台同学没有要听我说话。","强迫推销说会来照顾我也很困扰，说要留宿也很困扰。实际上她应该不会真的跑来留宿，然而即使是开玩笑，照理说也该避免谈及这种可能会害我们出差错的事。","「我要是睡了，妳就会回去啦。」","她难得发出犹如在闹别扭的声音。","我把差点叹出口的气吞了回去。","又不能表现得太冷淡，和病人说话实在有点麻烦。","「我觉得待到妳睡着为止就已经算很体贴了。」","「对病人更体贴一点啦。」","「还要更体贴？」","「对。」","「想要我对妳那么体贴的话，就别做些多余的事啦。」","「就算不做多余的事，妳也不会变得体贴一点吧？」","没想到她会这么说，真过分。","明明我今天对做了多余事情的仙台同学相当温柔。不过即使这么说，她现在也听不进去。我捡起掉落的退热贴，从便利商店的塑胶袋里拿出优格和汤匙递给她。","「把这拿去吃了，乖乖休息。」","「……谢谢。」","她听话地接过优格，撕开上头的封膜，然后一口、两口，将优格送入口中。","「宫城，妳再多待一下啦，这样我的感冒会好得比较快。」","「我又不是感冒药。」","「我知道。」","「少说蠢话，吃完就睡觉。」","「我刚才说过，睡太多了，现在睡不着。」","「就算这样还是要睡。」","「那妳要是吻我，我就睡。」","她挖着优格的手停了下来。","把汤匙放在优格盒里，指尖抚过我的嘴唇。","仙台同学的体温没变。","还是一样烫。","然而从指尖传来的体温很舒服，我不禁希望她能再多碰触，抓住了抚摸着嘴唇的手指，脸稍微凑近她，轻轻呼出一口气。","「仙台同学太不知收敛了。不睡也没关系，躺下来休息。」","我拿走她吃了一半的优格，放到桌上。","由于她理所当然地索吻，让人差点误会了，我可不是为了做这种事情才来的。我从盒子里取出退热贴，贴在一脸想抱怨的仙台同学额头上。","「好冰。」","「要是不冰就是瑕疵品了。」","「是没错啦。」","「还有妳要是不睡，我就要回去了。」","我用没有退热贴那么冰的语气如此宣告。仙台同学思考了一下，说：「既然这样——」","涌现了不太好的预感。","尽管如此，我依旧反问一句：「干嘛？」她平静地回答了。","「妳愿意把手借我握着的话，我就睡觉。」","「手？」","「对。」","「……这倒是可以。」","我接受了相较接吻更温和的提案。听到我的回答后，仙台同学满意地在床上躺下，犹如催促我似的伸出手，我把手放到她的手上。","「跟人牵手开心吗？」","我坐在床边，握着果然还是很烫的手询问，她紧紧回握住我的手。","「满开心的。」","说完后，她缓缓地闭上眼。","〔本话含插图〕"]},{"t":"幕间　有宫城在的房间","p":["我早就预料到醒来之后她就不在了。","尽管如此，依旧忍不住这么想——","宫城不在。","当我从并未深深潜下，宛如飘在浅滩上的睡梦中醒来后，没有任何人在房里。尽管不打算为此感叹，也不至于希望时间倒转回闭上眼睛之前，我却仍有些失望。","我坐起身，从床上望向桌子。","吃了一半的优格放在桌上，象征着宫城毫无疑问曾待在这个房间里的事实。","她要回去时，即使我在睡觉，总觉得也该说一声才对。","倘若不想叫醒我，至少该留张字条。","宫城做不到这些理所当然的事，毕竟她明明不像会来探病，却跟平常人一样跑来，所以照理说该做些普通人会做的事再走，但她没做。她总是这样，搞不懂是哪里有毛病。","我撕下额头上的退热贴，用力握紧。","不冰了。","今天的她似乎有那么一点温柔。","我钻进被窝里，咳了一声。","手里这片她带来的退热贴将我的时间往回卷。缓缓闭上眼睛后，意识便和宫城来之前，在房间里后悔自己没去上学的我重叠在一块。","我想早点去学校。","只要去学校，当宫城一如往常地传讯息过来时，就不用回传「我感冒了，请假在家，今天没办法过去。」这种讯息给她了。","今天没办法去宫城家。","这个事实带给在被窝里的我不小的打击。","整天待在有妈妈在的这个家里太痛苦了。","好难受。","感觉快不能呼吸了。","妈妈没事不会到我房间来，即使感冒了也一样，做好至少要做的事情之后，她就不会接近这个房间。倒不是希望她说出「妳没事吧？」这种关怀的话，可是看到即使我身体不舒服，也显然完全不关心的妈妈，我就会忍不住拿姐姐来跟自己比较。","姐姐感冒的时候，她会更——","在意起那些一直不去在意的事。","真不该感冒。","尤其是像现在已经退烧的阶段更不好。","一旦身体状况真的很糟，就连思考的余力都没有，不会去想些多余的事。然而感冒药发挥效用，原本超过三十八度的高烧已经退到三十七度多，身体的不适过了高峰，思考的力气也跟着回来。这种时候如果能光想些正面的事情就好了，状况不佳的自己却像在扯后腿，思绪总想飘往负面的方向。无论状况比较好的我再怎么阻止，心情依然朝着深不见底的沼泽不断下沉。","比起往上爬，人更容易往下掉，回想起姐姐的我跟她比较，情绪愈发消沉。那些不思考也无所谓的事情一直在脑子里转啊转的，心情很郁闷。","我继续窝在棉被里，摸着宫城给我的项链。","隔着睡衣，指尖沿着链条往下，确认着月亮造型的坠饰形状。","这种时候，总觉得自己需要宫城。","只要待在她房间，我就不会去想家人的事。","明天能不能去学校呢？","我试着把手放到额头上。","果然还是很烫，我拿起体温计。","量了体温，发现又比刚才升高了一点。","淋雨果然没好事。","暑假前，宫城差点脱了我淋湿的制服。","那件事孕育出我心中对宫城的邪念。","这次则成为我感冒没去上学，哀叹无聊的际遇，想着宫城的契机。","真的很不好。","我翻了个身，紧紧闭上眼。","一点都不困，睡不着。","也没有看书或念书的力气。","要回复羽美奈她们传来的讯息也很麻烦。","可是时间不肯过去。","对不分日夜都在睡觉的我来说，时间的流动实在太慢了，明天在遥远的彼端，仿佛永远不会到来。就算这个过于安静，感觉不出家的某处有家人在的房间被时间给抛下，也不是什么奇怪的事。","我缩起身体，再伸展开来。","凭借睡衣和棉被的摩擦声，确认时间有在流动。","竖起耳朵，想再多听点声音，却传来有人走上楼梯的脚步声。","——是妈妈？","身体紧绷起来。","妈妈应该没有事需要在这个时间来我房间，然而除了她以外，没人会走上楼梯。真麻烦。「咚、咚」地踏着楼梯的声音消失，可以感觉到有人在房门前，但没有传来敲门声，门也没打开。","我将注意力集中在耳朵上，不放过任何细微的声音。","连自己的呼吸声都觉得碍事，我屏气凝神地倾听，结果听见这个家里绝不会出现的一声「咚！」我忍不住爬了起来。","咦？怎么回事？","即使等待，也没有发生任何变化。","传来那声巨大的敲门声后，一切便回归寂静，反而让人觉得诡异。","总觉得不是妈妈。","她不可能那样大声敲门。","那在房门另一侧的人是谁？","我悄悄下床，打开房门。","「……为什么宫城会在这里？」","不懂她为什么会在这里。","宫城不会来我家。","她不是那样的人，我也没叫她过来。","「我要回去了。」","冷淡地说完后，宫城转身背对我。","「咦？等等，到底是怎样？」","「没事，妳不用在意。」","一步、两步、三步。","她头也不回地离去，我反射性地跑到走廊上，抓住她的制服。","无论怎么想都不可能没事。理应不在这个家里的人出现，对我来说可是件大事，对宫城来说应该也是。她跑到只来过一次，连朋友都不是的人家里，怎么可能不是件大事？正因如此，她才会头也不回地想从我面前逃走。","「就算说不用在意，我还是会在意啊。妳哪会明明没事却出现在我家？」","到底是怎么回事？","我无法理解眼下的状况，环顾四周后，看到先前走出房间时「不存在」的东西。","「这是什么？是妳带来的吗？」","我指着挂在门把上的白色袋子——应该是便利商店或超市的塑胶袋。","「那个给妳。」","「……谢谢。妳带着这些东西来，该不会是来探病的吧？」","「不是。」","「妳说不是，却跑到我家？」","看来宫城除了探病外不可能有其他目的。但她一语不发，一直默默地站在走廊上。","「总之先进来房间吧。」","虽然妈妈几乎不会到二楼来，但要是这个场面被撞见就麻烦了。我从门把上取下白色塑胶袋，走进房间，一直被我抓在手上的制服当然也受到拉扯，宫城同样跟着走进房间。她关上房门，我放开她的制服。","回到自己的地盘，凭借房门断开有妈妈在的「外面」后，心情稍微平静了些，我开始注意起自己的打扮。不用仔细想也知道，我穿着睡衣，没有化妆，头发八成也乱糟糟的，实在不是可以见人的模样。顺带一提，我连讲话都沙哑了，没办法顺利发出声音。","我把白色塑胶袋放在床舖附近。","这种时候也不联络一下就跑来探病的宫城是大笨蛋，我连打理仪容的时间都没有就和她碰面，让她进来房间。可以的话，我很想换套衣服，但她似乎不太在意，一副觉得曾经来过一次的这里很稀奇的模样，环视房间各处。","这么说来——","我差点「啊」地出声，瞬间屏住气。","今天没把装满五千圆的存钱筒收起来。","她不知道存钱筒里装着什么。","尽管如此，依旧有种秘密被发现的感觉，我试图开口掩饰。","「宫城，妳在那边找地方坐吧，我去拿点什么过来。」","「假设是要拿饮料跟吃的，那个袋子里就有了。」","闻言，我确认袋里的内容物，确实有饮料跟食物，然而不仅如此，还放了用来让额头降温的退热贴。没想到宫城会买这种东西来，让人惊讶，还以为这种时候她会说：「我不知道要买些什么才好。」买些派不上用场的东西带来。","真想不到她会这么机灵贴心。","不过袋子里的饮料只有一瓶宝特瓶。","「我去拿宫城的份过来。」","「不用，躺下啦，妳感冒了吧？而且我马上就要回去了。」","「马上是多久？」","「现在就可以回去了。」","宫城的话并未让我感到惊讶，我们不是对方请假没上学就会去探病的交情，况且待久了说不定还会被传染。考虑到彼此的过去和未来，她早点回去比较好。","她却来到了时间多得有剩的我身边。","如果马上回去，这个房间又要被时间遗忘了。","我坐到床上，望着宫城。","「我睡太多了，现在不困，陪我聊聊天啦。」","「没什么好聊的。」","「不说话也可以，再待一下啦。」","「还有发烧吗？」","宫城小声地说。","「还在烧。」","「让脑袋冷却一下如何？那里面有放。」","她指着白色的塑胶袋。","我明白她的意思，是要我自己拿袋里的退热贴贴在额头上。但既然都贴心到买这种东西带来了，应该可以再多做点贴心的事情吧。","「宫城帮我贴啦。」","昨天房门前也放了退热贴。","那是小时候妈妈会帮我贴，然而现在只会放在房门前的东西，我没有拿来用。退热贴就这样被放走廊上，没有进入房间，在几个小时后消失了。今天那玩意也没有出现在房门前。","可是宫城带来的退热贴轻易地闯入房间。","「自己贴。就算感冒了，这点小事还是做得到吧？」","听到她冷淡的声音，我的胸口好痛。","这明明是她常有的态度，我却难以接受。","忍不住希望她负起带退热贴过来的责任。","大概是因为感冒，让我的一切都变得很虚弱吧。","「妳对病人会不会太冷淡了？」","「反正妳还在发烧，冷一点正好吧？」","语气完全没放软。","宫城对待病人的态度跟平常没两样。","冷淡得让人搞不懂她为什么会来探病。","「今天一天听一下我的请求也无妨吧？」","我取出塑胶袋里的那盒退热贴，丢向一直站着的宫城。","这里不是她房间。","是没有五千圆介入的我房间。","她不仅没办法命令我，还可以听我的请求。","当然，她未必会接受这件事就是了。","「这样很危险耶。」","看着落在脚边的盒子，宫城皱起眉头。","我昨天或许也是用同样的表情，看着放在走廊上的退热贴吧。","「帮我贴啦，我是病人耶。」","宫城毫无动作。","她直盯着装有退热贴的盒子，看似思考着什么。","由于我仍在发烧，全身无力，只得忍耐着沉默。都怪我一直说想要她帮忙贴退热贴这种孩子气的话，房里的气氛变得难以言喻，十分尴尬。退热贴对我来说想必不是什么好东西吧，居然会想仰赖宫城，根本不像我会做的事，应该要赶快自己贴好退热贴来退烧，变回平常的我。","还是自己贴吧。","正当我打算这么说时，宫城捡起刚才盯着的盒子走来，想仰赖宫城的我又回到了心中。","「妳可以坐在这里。」","我拍了拍旁边，但她没有要坐下，依然站在面前，皱着眉头。","「宫城，坐下啦。」","更加强硬地说完后，宫城脸上挂着心不甘情不愿的表情在一旁坐下，打开退热贴的盒子。","「我帮妳贴，头转过来。」","她取出退热贴，以略显温柔的语气这么说，我听话地转向她，彼此四目相对。只有宫城在的这个房间，从有妈妈在导致待起来很不自在的家里独立，飞往我所需要的「放学后」。","或许是因为我已经三天没去学校，一直待在这个只让人感到难以呼吸的家里，总觉得有她在的这里待起来非常舒适自在，不同于夏天她来到这个房间时，","宫城把手伸向我。","指尖快要碰到我的浏海，我抓住她的手。","退热贴掉到床上，我抓着那只手拉向自己。","我知道她想做什么。","只是为了帮我贴退热贴，想把碍事的浏海拨上去。","但我想和她接吻。","一如希望自己能更加觉得这里是个待起来舒适自在的地方，我想更进一步地感受宫城，为此，彼此间的距离理应化为零。我吻上了她的唇。","当然不冰凉，却也不烫。","她的嘴唇很舒服。","我用舌尖撬开她闭上的唇瓣，钻入口中。","她毫无抵抗。","温顺地接受了我的吻。","说不定会把感冒传染给她。","但我无法制止自己。","我捕捉、缠上宫城的舌头，交融且流入体内深处的体温让人感受到她的存在。和她接吻后，之前独自关在这个房间里的事情宛如一场谎言，令人更想和她接吻。","我用力地把嘴唇抵上去。","深刻且漫长地吻着。宫城抓住我的睡衣，我的嘴唇这才缓缓退开。","「……刚才绝对不是该接吻的时机。」","明显表露出不悦的声音朝着我飞来。","「因为宫城靠过来了。」","「是妳把我拉过去的吧？退热贴都掉了。妳别再做任何事情了，而且像刚刚那样的吻很恶心。」","接吻前的语气明明很温柔，她现在却口气冷漠地这么说。","「说得更委婉一点嘛，这样我很受伤耶。」","感冒的我没办法表现得一如往常，光是想到妈妈在房门外，身体就会紧张得僵硬起来；会因为宫城的话而感到心痛。","「不要。既然会受伤，就别再做刚刚那种事了。」","昨天没贴的退热贴。","跟小时候不一样的自己。","跑到我不带朋友来的房间里的宫城。","像今天这种过去与现在交错混合的日子，真不希望构成舒适放学后时光的宫城冷淡地对待我。失去家人的关心后，我若无其事地在这个家生活到现在，然而今天不行，我没办法顺利地切割过去。平常不算什么的小事，今天却不肯变成不算什么的小事。","所以才希望宫城能稍微温柔一点。","就算只有待在这房间里的时候也好。","〔本话含插图〕"]},{"t":"第6话　宫城不说出口的事","p":["宫城来探病了。","这是足以用晴天霹雳形容的大事件，但也仅只于此，并未唤来台风或引发天灾。我依然持续被宫城叫去她房间。","与感冒前没有任何不同。","即使进入十一月，她依旧在我身边。","不过这样的日子当中，仍发生了一些预料之外的事。","在考完期中考后的现在，宫城还是认真地念着书。","她给我看的期中考成绩虽然不足以跟我以同一所大学为目标，然而成绩并不差，若是她的志愿一定考得上，所以我本以为她会说不要再念书了，但她一如以往地继续念书。","毕竟是考生，念书倒没什么好奇怪的，然而她原本很不喜欢耗费多余心力在念书上，却花了比维持现有成绩更多的心力念书，这景象看起来很不可思议。","我咬下一片从便利商店买来的洋芋片。","妳改志愿了？","对于我今天在这里问她的问题，宫城冷淡地说：「我没改。」","我从放在桌上的袋子里再拿出一片洋芋片。","「宫城，张开嘴巴。」","尽管不知道她超乎必要地继续念书的原因为何，但我把洋芋片拿到苦恼地瞪着课本的她面前。","「我自己吃。」","许久之前我买洋芋片过来时，她说了同样的话，自己吃下洋芋片；今天则像是仿照那天的行动，从袋里取出洋芋片，放入口中。","「吃这片啦。」","「不用。」","她立刻否定我的话，明显地摆出不高兴的表情。","要是硬把她的嘴巴撬开，丢洋芋片进去，她一定会生气。","她对没感冒的我很冷淡。","要是我今天也感冒，同样发着烧，她应该会对我更温柔吧。实际上，记得感冒的我对宫城说了相当任性的话，但她没有真的生气。尽管前提是「身为病人」，不过一想到她也会温柔地对待我，就让人感慨万千。真希望她能对不是病人的我也温柔点。","「才不好，我要喂妳吃，张开嘴巴啦。」","虽然把洋芋片拿到宫城嘴边，她却迟迟没有张口。","宫城像只讨厌人的野猫，总是不顺着我的心意行事，一靠近她就会逃跑，伸手便会被咬，留下的几乎都是很痛的回忆。","尽管如此，在我感冒的日子，纵使冷淡如她只是一时兴起，却仍说要为我做些什么。即使仅限那天，但在看到那样的她之后，我便抱着期待。","「宫城。」","我把那片薄得跟纸没两样的马铃薯最终下场抵在她的嘴唇上，她一脸打从心底感到不悦的样子，张开了嘴。","一边想着真是难得，我一边将洋芋片塞进微微张开的双唇之间，薄脆的零食立刻从指尖消失。她皱起眉头，像是吃了什么难吃的东西。","不枉我特地买来——虽然这么想的同时，我也觉得要是她能吃得更开心一点就好了，不过这份不满被她从我手上吃东西这件事给抵销。这可不是在喂养她，却让我想再多喂些东西给她吃，甚至让人开始觉得如果继续喂她吃洋芋片，即使毕业，她也会因为想要食物而跟我碰面。","我又拿起一片洋芋片，送到她嘴边。","「来，请用。」","还来啊？尽管没这么说，但要说她脸上写着这句话也不为过。她望着我，一脸不情愿地张开嘴。","洋芋片靠近，而后随着轻快的声音消失。","我的手指顺势按上宫城的嘴唇，她皱起眉头。","虽然表情看起来很难说愿意接受这行为，我的指尖仍沿着她的唇形滑过，接着她像是在吃洋芋片似的，咬了我的手指。","这在预料的范围内，不过很痛。","之前来这个房间时，我也因为摸她的嘴唇而被她给咬了，今天却依旧刻意买洋芋片来做这种事，理由非常单纯——因为打从感冒卧病在床的那天以来，我跟宫城就没再接吻过了。在那之后，只要做出感觉会发展成接吻的行为，她就会像这样明显地拒绝我。","「宫城，很痛耶。」","她没把这句带有希望她能住手意义的话给听进去，牙齿更深地陷入我的手指。","「既然要动嘴，不如舔我啦。」","这样说着的我用被咬的指尖碰了她的舌尖，手指这才总算从她的牙齿中解脱。","「不舔我吗？」","「不要。」","她冷淡地说，视线落到笔记本上，在解到一半的问题后补上几个字，翻阅课本。","只要喂她吃洋芋片，她就会连我的手都一起吃。","喊痛的话，她会咬得更用力。","叫她舔我，她则会放弃继续咬我。","总之不会听我的话。","无论是好是坏，她都会做不同于我所期望的事。","感觉她的反应很明显。","我却不知道她一直逃避接吻的理由。","暑假结束后，我们有过一定程度的自律，但那是过去的事了。我们曾在学校接吻，在这个家里也接过吻，事到如今明明没什么好抗拒了，她却不肯接受我。","不晓得宫城为何如此顽固地想戒掉接吻，问她也一定不会回答我，即使硬要问出原因，也只会被她以命令禁止问问题作收。","她总是这么奸诈。","尽管没有到无论如何都想跟她接吻的程度，但我并非完全不想跟她接吻。况且她不但不让我吻，还要确认项链的存在，一下命令无权拒绝的我解开第三颗扣子，一下摸我的胸口，对我为所欲为。当然，我说想碰她也不让我碰，交换条件同样不知道消失到哪去了。","她不该因为感冒就温柔地对待我。也不该接受我吻她。正因为她那天没像平常那样抵抗，我才会直到今天仍对她抱有期待。","「宫城。」","我戳戳她的肩膀，要她转头面向我。","「干嘛？我在念书。」","接着把手指塞进她嫌烦地动着的嘴里。","「舔我啦。」","话一说完，她便咬了我的手指。","好痛。","牙齿咬着手指的力道比刚才更强。","我用空着的那只手抚摸她的脸颊，一路摸到耳后。","拉扯耳垂后，她放轻咬我手指的力道，我以指尖按住她的舌头。","「不是叫妳咬我，是舔我。」","这并非命令。","我无权要她服从我，这充其量只是请求，所以她要再咬一次也行，要抓住手腕，把我的手指拔出来也可以，她有权这么做。","然而她哪个都没做，听从我的请求。","温热的东西贴上指尖。","舌头抵了过来，缓缓滑过。","黏膜碰到手指，带来具体而鲜明的感觉，使神经集中在濡湿的部分上。","温度明明没那么高，却让人觉得指尖烫得像是烧起来。感觉仿佛受到宫城的体温诱导，温度逐渐累积在我的身体里。","我缓缓拔出手指，触碰她的嘴唇，结果食指到第二关节都被舔了。","宫城要是听到一定会生气，所以我没说出口，但总觉得这种时候的她很煽情。","以前也曾像这样被她舔过手指。","然而当时并不觉得煽情，我清楚地意识到自己正以不同于以往的眼神看着她。","我再度用指尖抵着她的嘴唇，打算顺势将手指塞进口中，她却粗鲁地抓住我的手臂，用力拉开。","「够了吧？」","宫城说道。即使隔着制服外套，也能感受到她用指甲刺我。","「假如我说还不够，妳会再舔我吗？」","「仙台同学，妳知道自己没有权力命令我吧？」","「我知道。」","老实地同意宫城的话后，她放开紧紧抓着我手臂的手，随即从套着鳄鱼盒套的面纸盒里抽出两张面纸。","「擦干净。」","我依言用她递来的面纸擦拭自己的手指，再把面纸揉成一团，丢进垃圾桶，漂亮地投篮成功。而她仿佛等待着这刻，开口说道。","「换仙台同学舔我的手指了，这是命令。」","她的指尖抵在我的嘴唇上，我用舌头碰触手指，代替「好」的答复。","一如宫城刚刚所做的，我让舌头缓缓滑过，直到食指的第二关节处。","用力抵上去，能感觉到坚硬的骨头。","我轻咬了一下。宫城试图把手收回去，我抓住她的手，吻上手臂。","有些在意现在的我在宫城眼里是什么样子。","她看着我想些什么？有什么感觉？","实在好想窥探她的内心。","「仙台同学，够了。」","她语气冷淡地说，抽回了手。","但我拉住她的手，咬起指尖。","顺势含住她的手指后，鳄鱼被推到我的锁骨附近。","「我说够了。」","宫城不停把鳄鱼推来，我放过她的手指。","「还可以再继续喔。」","我夺走鳄鱼，抓住她的手，再度将嘴唇靠近手指，然而被抓住的手马上就溜走了。","「不用继续，停下来。」","「为什么？」","「还问我为什么？妳有点——」","「有点？」","「没事。」","她没告诉我讲到一半的话后续是什么，强制结束话题。","「把鳄鱼还我。」","我按照宫城的话把套着盒套的面纸盒递给她。擦完手指后，她不是把鳄鱼而是把垃圾拿给我。","「刚刚没说完的话要说完啦。有点什么？」","接过纸团后，我将它丢进垃圾桶，可惜这回投篮落空，我起身捡拾垃圾。","「仙台同学是变态。」","「那绝对不是刚刚没说完的话吧？」","我重新坐回宫城身旁，摸了摸她拿着的鳄鱼的头。","「喂，宫城，刚刚那样舒服吗？」","「妳很烦耶。我要念书，不要说话。」","我很清楚。","宫城绝对不会表示很舒服。","尽管如此，我依旧想着——如果她这样想就好了。","汉堡排调理包与即溶汤包——","从我手中吃下洋芋片的宫城端出的晚餐，一如往常是无须费心准备的餐点，我们和平常一样吃下那些东西。","她会询问我要不要吃过晚餐再回家，但从未问起要不要留宿，因此吃过晚餐后我就回家了。","宫城会对我说的话跟不会对我说的话早有定论。","倘若硬要分类，她对我说的话大多很冷淡，拜此之赐，我总是被她给否定，却认为这就是宫城，也觉得她这样就好了。","——直到上个月感冒为止。","我停下正抄写着黑板上文字的手，望向时钟。","距离午休还有五分钟。","我在笔记本上画了只鳄鱼，视线再度移回黑板上。","距离最后和宫城碰面的日子又过了几天。","九月时因为暑假的余韵，总觉得毕业典礼还有很久；十月忙着应付校庆和期中考，没空思考剩下多少时间。然而进入十一月后，毕业典礼突然成了切身相关的事。以天数来看，距离毕业仍有一段时间，可是中间有寒假，第三学期又有一半以上的日子可以自由选择要不要到校。","时间所剩无几。","这样一想，我就想问些宫城不会对我说的话。","都怪那场感冒使我知道她也能温柔地对待我，变得相当贪心。","我让画在笔记本上的鳄鱼背上长出面纸。","钟声很快就响了，老师宣告下课。收好课本和笔记本的我朝羽美奈的位子走去，拍了一下她的肩膀。","「羽美奈，我要去福利社，妳们先吃吧。」","「好，可是妳的便当呢？」","「今天没有。」","耳边传来她随意地说着：「这样呀。」我回了一句：「那我走了。」拿起钱包。钻过成排的课桌椅，正打算走出教室之际，我听见羽美奈大喊而停下脚步。","「叶月！帮我买草莓果汁，等等再给妳钱。」","「我也要。」","麻理子也跟着说。我抬起手回答。","「OK～」","她们要买的东西没什么大不了的，我随口答应，一边盯着教室内往外头走，结果撞上了什么。","「哇！」","「未注意前方」这句话浮现脑海。","尽管没有走得很急，但我没有看着前面。","「对不起，妳没事吧？」","我一边道歉，一边跟撞到的某人对上视线，发现是我见过的人。","「我才该道歉。」","宇都宫舞香——","宫城不仅常常提起她的名字，她也总是和宫城在一起，所以我很清楚她的长相，但对她而言，我不过是以前的同班同学，毕竟彼此并非熟稔得会向对方搭话的交情，于是我挑了句无伤大雅的话。","「没事吧？」","「我没事。」","她简短回答后便继续往前走。","而我也不能就这样驻足，便迈步朝目的地前进。","学校的内部构造非常单纯。","走廊是笔直的，一侧是窗户，对侧则是成排的教室，能走去的地方仅限于此，说到午休时间会去的不外乎厕所或福利社。不管怎么想，宇都宫的路线目的地都跟我一样。","「那个……我是二年级的时候跟仙台同学同班的宇都宫，还记得我吗？」","方才默默走在前头的宇都宫停下脚步，突然开始自我介绍。","「当然记得。」","我经常听宫城提起宇都宫。","但这话不可能跟她说，所以我回了个安全的答案，跟她一起往前走。","明明是她主动搭话的，却没再开口，就这样默默走着。可能是因为撞到之前的同班同学，目的地又一样，她觉得不好什么都不说才会自我介绍吧，结果却演变成更令人在意沉默的状况。","然而我同样无话可说，彼此只得静静地走在走廊上。","由于要去的地点相同，事到如今也不方便拉开距离。","我很怕这种什么都没有的空白时间。","假如对象是宫城，就算一直保持沉默也不会让人在意，但是换成宇都宫我就撑不住了。完全不认识的话另当别论，倘若认识，我就会想说点什么。说是这样说，然而我跟宇都宫的共通话题屈指可数，所以能说出口的话当然已经决定好了。","「宇都宫，妳要考哪所大学？」","抛出很符合考生身份的话题后，她回答了一所离我的志愿没多远的大学。","「哦……我也要考外县市的大学呢。」","她问起是哪所学校。告诉她大学名称后，我又说：「要是考上，说不定会在那边遇上呢。」延续这个有限的话题。","「那志绪理……呃，二年级时一样跟我们同班的宫城志绪理，也想跟我考同一所大学，所以——」","「咦？」","我忍不住出声，打断宇都宫的话。","宫城志绪理。","随着不用反问也很清楚的名字一起听到的话完全出乎预料，让我停下脚步。","宫城应该是要考本地的大学啊。","——为什么？","「咦？呃……咦？」","宇都宫一脸惊讶地看着我。","看来我发出的声音好像比自己所想的更大声。","「啊，对不起，只是想说原来宫城的成绩还满好的啊～」","尽管这话说来有些失礼，但我想不到其他话能带过这个尴尬气氛了，这也没办法。","「因为她最近好像很认真在念书。」","虽然不到觉得我很可疑的程度，不过宇都宫一脸疑惑地回答。","我想她只是为了打破沉默才会提起宫城，也同样只是因为我的反应超乎预期才会吓一跳。就这样带过这个话题，避免再度提起宫城，便能让这件事作为抵达福利社前的闲聊而落幕。","我迈开停下的脚步。","在走廊上往前走了一步后，我的嘴巴仿佛配合著腿，自作主张地动了。","「宫城真的要考那里？」","「因为说得突然，我也不知道是不是认真的，不过她说想报考。」","「这样啊……」","「……那个……仙台同学跟志绪理是朋友吗？」","我们方才应该是在闲聊才对，宇都宫却像是在察言观色地压低声音。我望向她的脸，或许是因为紧张吧，表情有点僵硬。说不定她就是想问这件事才向我搭话的。","「为什么这么问？」","我笑着反问。","「因为之前在走廊上和志绪理相撞的氛围，以及在走廊上擦身而过之际，仙台同学似乎不时会看着志绪理。况且妳也曾把志绪理叫出去过，我才隐隐约约有这种感觉。」","总觉得她相得敏锐，观察入微。","我不记得自己有盯着宫城，然而擦身而过时，视线确实会飘过去，也曾跟她四目相对。即使约好在学校不往来，彼此在校外却有着以「深刻」形容也不为过的关系，因此无关乎个人意愿，我的身体会自然地做出反应。","「我们不是朋友喔。之前会叫她出来，也是因为老师要我去叫宫城而已。」","我面带笑容地这么表示，稍微加快了走路的速度。","「……是我多心了吗？」","自言自语般地说完后，宇都宫说：「我先去买果汁了。」朝着自动贩卖机走去。我跟她没有要好到会一起走去自动贩卖机，于是先去买了三明治，再连同羽美奈她们的份买了果汁，走回教室。她们正热烈地聊着关于男朋友的话题。","午休时间和羽美奈她们一起吃午餐还满开心的，一想到再过几个月就听不到这些没意义的聊天内容，多少让人有些寂寞。但今天她们的对话之于我完全是左耳进右耳出，既不觉得开心，也不觉得寂寞。","我只有随便应声，咬着三明治。","完全没听说宫城要考外县市的大学。","我曾想过要是同一所大学不行，附近的大学也是选项，却又觉得提了也会被冷漠拒绝，所以没对她说过。她却不知何时决定跟宇都宫报考同一所大学——离我要考的大学没那么远的学校。","不对，事情还没成定局。","她只是有可能会报考，还不确定。","然而从考试后她仍认真念书的状况研判，宇都宫的话应该是真的。既然是这样，宫城之所以不揭露这个事实，是因为不想让我知道，也代表报考那所大学的理由不是我，而是另有目的。","尽管觉得她选择外县市大学的理由要是我就好了，不过想和宇都宫上同一所大学更有说服力。","唉，除此之外也没其他理由了吧。","这是理所当然的。","我和宫城的交情没有到会誓言要上同一所大学，纵使上不了也要上邻近的大学，约好一直当朋友的地步。她不仅划出了界线，表示彼此目前的关系只会持续到毕业，也不让我吻她，应该没有即使毕业也不想跟我分开的念头吧？","假使有不想分开的对象，想必会是宇都宫。比起只是同班过又不是朋友，什么都不是的我，她选择宇都宫根本没有哪里不对。","没错，这很正常。","但一点都不好玩。","宫城跟宇都宫是朋友，关系不在这之上，我没打算怀疑这件事。","而我和宫城虽然并非朋友，却在与宇都宫不同的意义上成了「亲昵的关系」。尽管如此，宫城依旧选择了只是普通朋友的宇都宫。这个事实倒不至于让人不爽，胃却绞痛起来。","三明治不太好吃。","我的味觉出了问题，竟然会觉得宫城做的——正确来说是宫城拿去加热的东西就是了——端出的那些感觉很不健康的食物更好吃。","咽下干燥的面包，喝了一口买来的奶茶，口袋里的手机响起。我看向萤幕，宫城传了一如往常的讯息过来。","我想在她家以外的地方聊聊。","犹豫了一下后，我传了跟平常不一样的讯息给她。","『放学后来音乐准备室，我等妳。』","上完所有课之后，仍然没收到她的回应。","原本我就认为宫城一定不会回复，这并不奇怪。","于是我理所当然地朝音乐准备室走去。","宫城说不定会来，也有可能不会来。","虽然校庆后找她过来时她来了，可是想到那天我所做的事情，她不来的可能性比较高。","可是……","要是宫城来了……","今天从宇都宫那里听到的消息……","我想问她。","——总觉得不太舒服就是了。","胃是不痛了，胸口深处却闷闷的。","脑中浮现的全是负面的念头，心情开朗不起来，感觉就像是看着只疼爱姐姐的父母而钻牛角尖，只会涌现各种悲观的想法。","这样的我很不好。","花了不少脑筋，机灵地待在班上还不错的位置，享受不错的校园生活——那样的我感觉快消失了。","吸气，再吐气。","我静静走在不是很大的音乐准备室里。","即使选择外县市大学的理由与我无关，宫城仍选了与我要考的大学相距不远的学校。","不管理由为何，比起远，近当然更好。","单纯地这样想就轻松多了。","尽管不想主动承认，但我不希望跟宫城分隔两地，对于她选择和宇都宫上同一所大学，我虽然觉得心里很不舒畅，仿佛走在浅灰色的世界里，不过把重点放在「近」这个字上比较好。只要她就在离我没那么远的地方，彼此的关系理应不会彻底断绝，一旦这么想，总觉得我就能容许一定范围内的事。","反正我也没办法立刻整理好所有心情。","既然如此，比起主动坠入绝望深渊，不如选择某种层面上更好一点的思考方式。","我说服了无法接受的自己，想办法让心情转往好的方向，这并非什么坏事。","然而仍有其他问题。","我所认识的宫城很不老实。","即使要她告诉我报考哪所大学，她也绝对不会说吧。我也不想搬出宇都宫的名字，要是提起她，感觉宫城一定会说：「只是找她商量而已，没有要考。」全力否定这件事。","话是这样说，但若不提及宇都宫，实在很难确认今天听到的消息究竟是不是真的。","即使如此，我依旧不想放弃。","但要是宇都宫把午休时发生的事情告诉宫城——","宫城打算和宇都宫考同一所大学。","倘若宫城意识到我知道这件事，事情就棘手了。她就算对宇都宫说：「我还是去考本地大学好了。」也不奇怪。","脑中想不到什么愉快的事。","唯有问题在脑海里闪啊闪地发着光。","我停下一直在准备室里走来走去的脚步。","看向时钟，来到这里后已经过了十五分钟。","「她可能不会来吧……」","再等也就五分钟。","或许是因为十一月也要过了一半，冬天就快来临，音乐准备室有点冷。这里不是该长时间等人的地方。","真要说起来，就算是宫城，也不会让我等上个三四十分钟才对。希望如此。","我走近放着乐器的架子。","望着入口。","闭上眼睛再慢慢打开后，门静静地开了。","说不上短，但也说不上长的裙子映入眼帘。","不高兴地皱起的眉头。","没说半句「我来晚了」或「抱歉让妳久等了」这种贴心的话。","宫城默默地接近。","半长不短的头发随着步伐晃动，她在我前面一点的位置停下脚步，一脸嫌麻烦地开口。","「说好在学校不说话的约定呢？」","她以书包重重敲了一下我的腿。","「想守住约定的话，妳遵守就好啦。不过妳也没遵守，表示约定根本不重要吧？」","「我要回去了。」","用比室温更低的语气说完后，她立刻想打道回府，我开口叫住她。","「等一下啦，我是真的有事才叫妳过来的。」","「反正一定是什么无聊事吧？不用在这里，在我家讲就好啦。」","尽管嘴上抱怨，她依旧把书包放到地上，看着我。","「因为我不想被妳命令。」","我灿烂地笑着说，她回以一个露骨的不满表情。","「有事要说就快说。」","我要说什么，又该怎么说呢？","直到现在仍然没整理好思绪，即使再想五分钟，我也不觉得自己能整理好。","但凡事情扯上宫城，我的脑袋就惊人地无法运转，结果还是只能像平常一样，直接抛出问题。","「……妳的志愿是哪所学校？」","「妳说有事就是要问这个？」","「对。」","「我说过很多次了。」","「毕竟大学又不是只能报考一所，我想说妳搞不好还有其他想考的地方。」","「没有。」","答案一如预期，我用手指弹了一下装有乐器的盒子。","大学的话题是宫城不会对我说的事情之一。","虽然很想追问下去，可是我也明白她不会回答。","我想知道的事她总是不告诉我。","没有方法能确认宇都宫的话究竟是真是假。","「考一下嘛。现在说不定能考上更好的大学，难得妳都认真念书了。」","尽管觉得行不通，我还是试着从宫城口中套出想知道的答案。","「妳很烦耶，别再提这个话题了。」","「我在这里不会听妳的命令。」","「这不是命令，要是想说，妳就一个人说到满意为止吧。我无话可说，要回去了。仙台同学等等到我家来。」","她单方面地结束了对话。","虽然早就知道，但我依旧觉得她很冷漠无情，也知道要是再继续延伸这个话题，她只会以更冷漠的态度相对。然而死到临头仍不肯放弃的我，不想让她就这样回去。","「妳没有想跟朋友上同一所大学吗？」","我很想说出宇都宫的名字当成具体范例，却还是把她的名字给吞了回去，封在胃里。","「……妳突然说什么啊？」","「这种事情不是很常见吗？想跟感情要好的朋友上同一所大学。」","「这么说来，妳今天有和舞香说话吧？」","宫城没回答我的问题，微微皱起眉头反问我。从她的反应研判，宇都宫应该有把碰到我的事情告诉她，既然如此，我就不能装作没听到宇都宫的名字，硬是推进这个话题。","「妳问宇都宫的话，我在前往福利社的途中有遇到她。」","「妳跟舞香说了什么？」","「她问了我之前把宫城叫出来的事情。」","「就这样？」","「就这样。她有说什么吗？」","「她跟仙台同学说了一样的话。」","「这样啊……」","看来宇都宫没跟宫城提起大学的事。","所以我别再继续追问下去比较好。","让话题就此结束，便不会演变成麻烦事了。","尽管心知肚明，心里却仍有个念头想继续说下去。","「妳满意了吧？我要先回去了。」","宫城打算拿起放在地上的书包，我反射性地抓住她的手。","「干嘛？」","不悦的声音传来。","「要不要再聊一下？」","「不要。要聊的话，回去再聊也行吧？」","「是没错啦……」","我知道。","却不想放手。","握得紧紧的，想让抓着她的手与她之间没有任何空隙。","她的手比我在感冒那天牵着的更冰凉。","即使有两个人在，音乐准备室依然很冷，手摸起来会冰冰凉凉就是因为这样，我的手想必也很冰。说是这样说，但我不是为了暖手才抓住她的。","「仙台同学，回去再说。」","「再待一下啦。」","要是放手，我又会好一阵子牵不到她的手了，想到这里就不想放开。","想牵手、想多碰触她。","我没办法好好处理这些心情。","我想这是因为都是宫城在碰我。","也觉得是因为她什么都不说。","「宫城。」","我呼唤她的名字，往她靠近一步后，她甩开我的手。","「我不会跟妳接吻。我要回去了。」","「我什么都还没说耶。」","可能是回想起我过去在这里做过的事情了吧，她的声音冷漠万分，但我只是想再多碰碰她，并非想要接吻。","「妳接下来有可能会说啊，这只是先发制人。」","「妳误会了，我只是想碰妳而已，因为妳平常也总是在碰我嘛。」","「用『也』太奇怪了吧？我才没碰仙台同学呢。」","我解开了在学校不会解开的衬衫第二颗扣子。","拿出项链给她看。","「妳不是一直都在摸这个吗？」","宫城每次叫我过去，总会要我让她摸平常藏在衬衫底下的项链。然而就算我想摸同一个地方，也会被命令给制止。","「那是在摸项链，不是在摸仙台同学。」","「即使如此，妳依旧连同项链一起摸了我，所以让我碰妳啦。每次都只有妳碰我，太奸诈了。」","我又走近一步，朝她的脸颊伸出手。","将掌心贴上她的脸颊后，可能是手很冰吧，宫城吓得抖了一下。我顺势让手滑过脖子，解开她的领带，然而在我解开她的衬衫扣子前，手臂就被抓住了。","「妳很变态耶，住手啦。」","她语气强硬地这么说，拉开我的手。","「宫城的命令在这里无效。」","「也是。我买下的是在我房间里的仙台同学，不是学校的仙台同学。」","「知道的话就老实点，别乱动。」","「可是妳也一样，无权在学校对我做什么。」","「妳之前明明让我吻妳耶？如果吻妳都可以了，让我碰一下也行吧。」","说出曾经在这里发生的事实后，宫城面有难色地重新系好领带，随即以不带感情的语气说。","「……想碰我的话，妳就做点相对应的事啊。仙台同学很喜欢交换条件吧？」","「倒不是喜欢，不过——交换条件是什么？」","反正一定不是什么像样的条件。","尽管如此，我依旧询问宫城。","〔本话含插图〕"]},{"t":"第7话　和仙台同学间的理所当然","p":["我不讨厌仙台同学碰我。","然而只要容许一件事，她就会得意忘形，比我容许她做的想要得更多，所以不能什么事情都容许她。但我满喜欢接受交换条件这个提议，乖乖听我说话的她。","我坐到放在音乐准备室一隅的旧椅子上。","「舔我的脚。」","过去她已经听过这句话好几次了。","尽管如此，她依旧露出惊讶的表情。","「咦？」","「没听到吗？我叫妳舔我的脚。」","「……在这里？」","「妳能在这里舔的话，我就让妳碰我。」","仙台同学几乎不会违背我的命令，不过只限于在家里，再怎么说应该也不会在学校舔我的脚。","正因为觉得她办不到，我才会选这件事当作交换条件。","虽然只要是她会想拒绝的条件，无论什么都好，但我想不到其他还有什么会让她迟疑要不要执行的命令了。刚刚下的命令绝对不是个好命令，不过作为交换条件不可能成立，因此仙台同学只能死心，意外地是个可以轻松且和平解决问题的命令才对。","「妳知道这里是学校吧？不是宫城的房间喔。旧校舍不太会有人来没错，但要是被人看到该怎么办？即使是交换条件也太超过了吧？」","不出所料，仙台同学一一陈述起无法接受交换条件的理由。","「那就当妳办不到，可以吧？」","我开口问她。只见她望向音乐准备室的入口。","眼神摇摆不定，或许是在思考些什么吧。","趁着她犹豫不决之际，我决定了答案。","「当作交换条件不成立就行了吧？我要回去了，仙台同学等等再到我家吧。」","就算她仍有话要说，回家再说就好了。","今天的她尽是问些我不想被她问起的事，所以在家我也不是很想跟她讲话，但总比继续在这里说话好。若是在家里，也能用命令强制结束对话。","我从椅子上起身，拿起书包，正打算走出去时，仙台同学出声叫住我。","「等一下。」","说完，她在我开口之前就搬了椅子过来。","「坐下啦，妳想要我舔妳的脚吧？」","「不用勉强。」","「我没勉强。妳安静坐下啦。」","「要是有人来了怎么办？」","「没关系，届时我会说是宫城命令的。」","「那样我有关系啊。」","「就算有关系，也是妳自己提出的交换条件，所以坐下啦。」","刚才仙台同学犹豫了。","没有立刻听从要求，这毫无疑问是令她难以接受的交换条件，最终却决定听令照做。","纵使得吞下让人犹豫的条件，也想要实现的事情。","我不认为那单单只是「想要碰我」而已。","「……妳不惜做到这种地步也想做的事到底是什么？」","「我应该说了吧，只是想碰妳啊。」","「真的只有这样？」","「对啊，我不会做会惹宫城生气的事。」","直直地盯着我的仙台同学这么说。","沉稳的声音不像在说谎，可是我不相信想在不生气的范围内碰我这种事，会让她愿意接受在这里舔我的脚这种条件。真要说起来，她没道理想做这种事，照理说没有这么做的契机才对。","尽管如此，她的眼里现在只有我。","让「她为什么接受了交换条件」的疑问成了微不足道的小问题。","她的衬衫连第二颗扣子都解开了，我看得见项链。","到毕业典礼前的她就该是这个样子，当下也实现了。一想到这里，我便觉得自己的心情还不错。","「宫城，赶快坐下啦。」","提出交换条件的人是我。","并非听从仙台同学的话，而是为了对自己的话负责而坐到椅子上。她缓缓地跪在地上，脱掉我的室内鞋和袜子。","音乐准备室的门关着。","或许是有些不安吧，她像是在确认入口般地看着门。","没有说话声从走廊传来，也没有脚步声，只听得见她轻轻呼出一小口气的声音。","视线从门移回我身上。","不是舌头，而是指尖滑过脚背。","柔软地压上来的手指感觉痒痒的，我轻轻踢了仙台同学的脚。","「不是这样，用舔的。」","犹如回应我的话，她握住我的脚跟，脚被她稍微抬了起来，靠向她的脸。不像舌头那么湿的东西压上我的趾根处——我马上就知道那是她的嘴唇——伴随小小的声响，嘴唇一再碰上脚背。","我以脚抵着她的嘴唇，藉此抗议她没有遵从我叫她舔的命令，比嘴唇更热、更湿的东西随即朝脚踝移动而去。","「这样就行了吧？」","仙台同学抬起头问我。","「不行。」","当然不行。","决定实践这件事的是仙台同学。","怎么可能容许她就这样敷衍了事？","「妳好好舔啦。」","「我舔了吧？」","「刚刚那样不算。」","「我觉得算啊。」","「不算。」","斩钉截铁地说完后，仙台同学把我的脚拉过去，咬了脚拇指，虽然有控制力道，咬我的力气依旧不小，很痛。尽管开口想抱怨，但在说话之前，我的脚背就被舔了。","舌尖一路滑动，爬上脚踝。","温热的舌头宛如抚摸着肌肤般移动的触感，感觉没有那么不好。","第一次被仙台同学舔脚之际，虽然是自己提出的要求，我仍觉得有些恶心。然而像她这种跟我几乎没有任何交集的人听从命令，舔我的脚这件事，让人有股近似于优越感的感受。","可是现在跟当时不一样。","滑过骨头上的舌头令背脊一阵发麻，简直宛如电流窜过的感觉，跟恶心截然不同。","我脚上稍微用力，抵着她的舌头，舌尖便贴在我的脚上，用力抵了回来。","她的体温在称不上温暖的音乐准备室里感觉相当舒适。明明愿意接受这种条件，却有不肯退让的事，让我对她相当不满。","为什么？","为什么她要去念外县市的大学？","执拗地要我改志愿，自己却没打算要改。","不，我晓得她坚持要念外县市的大学，是因为家庭环境。但她都在学校做出这种事了，却不愿意考虑一下我曾说过一次的「留在这里」，让人很不爽。","即使想像得到原因，我依然无法接受。","所以才不想把大学的事情告诉她。","尽管曾跟舞香说我想跟她报考同一所大学，但要是告诉仙台同学相同的事情，她八成会认为我是在追随她的脚步，感觉很讨厌。","但是我很在意。","倘若说出这件事，她会用触碰我的舌头、嘴唇，温柔地以对我来说并没有那么温柔的声音，说些什么呢？","「宫城，还要继续吗？」","「继续舔啦。」","我轻轻踢她。","她一瞬间板起脸，不过立刻垂下视线，既非舌头也不是嘴唇的东西碰到我的脚——她的指尖抚过脚跟，奔上小腿肚。裙子被掀起，柔软的嘴唇碰触膝盖，湿滑的舌头爬了上来。","舌头缓慢，时而用力地触摸着膝盖。","那显然与刚才不同的舔法让人忍不住想缩回脚，但马上又被拉回去。","心脏仿佛紧紧地收缩，好难受。","她宛如要拭去打翻的液体，不断地舔着我的脚。","这下不妙。","虽然不想回忆，记忆却重新复苏。","暑假最后一天，在我的房间里，仙台同学——","我屏住呼吸，伴随流泻的记忆吐出一口气。","一旦松懈下来，事情总是会变成这样。","之前命令她舔我手指时，她也不肯普通地听从命令，用了比起舔舐，更会让人联想到别种意义的方式来舔。","「停下来，结束了。」","我伸手推着她的头，想让她远离膝盖。","然而别说远离，她反而更用力地吸吮、轻咬。","暑假时，我觉得跟她做那种事情也没关系，当时的确有过这种想法，现在却不认为彼此该做那种事。","差点觉得可以继续下去的我错了。","这并非该对仙台同学怀抱的感情。","她的嘴唇碰上比膝盖略高的位置。","「仙台同学，住手啦。」","在音乐准备室的一角，我没有讲得很大声，但她不可能听不到。","即使如此，她仍超乎必要地掀起我的裙子，吻上膝盖内侧。","原本藏在衣物下的部分接触到准备室里的冷空气，应该要觉得冷才对，却只有她碰触的地方很热。","嘴唇再一次压上来，传出小小的一声「啾」。","她的手轻轻握住我的膝盖往外侧推。","温热的东西在紧贴上大腿后离开。","却很快地又贴了上来，用力抵着大腿。","感觉很痒，我的身体微微扭动。","她原本碰着膝盖的手缓缓滑动，滑溜地想钻进我的裙底深处。","——这样下去不行。","我把手伸向仙台同学的头。","就这样按住她的头，重新审视自己的腿。","这模样还真糟。","她的头不但在我的两腿之间，裙子还乱得见不得人。一想到只有我是这副模样，总觉得好丢脸。","别说一句，我甚至想抱怨个十句二十句，但还是先一把推开仙台同学的头，整理好凌乱不堪的裙子。","「我没叫妳做这种事。」","我把想抱怨的话浓缩成一句丢出去，瞪着表现得一脸若无其事的她。虽然下过很多次要她舔我脚的命令，却从未遭受这种对待过。","「我只是照宫城说的舔脚而已啊。」","「才不是只有舔呢，妳还做了奇怪的事。」","「那这样的就行吗？」","她稍稍掀起我的裙子，舌头舔上膝盖——这个我没吩咐的行为让人吓了一跳，脚也随之一颤，犹如湿润软糖贴在皮肤上的触感逐渐接近大腿。我按住仙台同学的头。","「住手啦。是说那里根本不是脚。」","「是脚吧？那里是膝盖耶。」","「不对，膝盖不是脚，膝盖是膝盖。」","「照这个说法，从哪里到哪里算是脚啊？」","说完，仙台同学摸了一下我的小腿肚，手指还很顺便地爬上来。我拍掉她的手。","「就此结束，脚的范围根本不重要。妳再退开一点。」","我用力推开她的额头，她乖乖地退开了，让人有点意外。然而只有一开始听我的话，她马上又抓住我的脚。","「帮妳穿袜子。」","「我自己穿就好。」","「妳的袜子明明在这里耶？」","挤成一团的袜子塞在她方才帮我脱下的室内鞋里，鞋子则在她旁边，不是坐在椅子上的我可以轻松拿到的位置。","「还我啦。」","「都说要帮妳穿了，妳继续坐着。」","我的脚被她抓着，想站也站不起来。就算她没说，我也只能坐着，无法自己去拿，也无法穿上袜子。","不得已，我照着她的话做。","她的指尖碰上我的脚背，有些痒痒地慢慢抚摸着，随即动作俐落地帮我穿上袜子。","我不太喜欢没事就会做出这种行为的她。","这并非普通的行为，她却马上接受、习惯这些不普通的行为，将之视为理所当然，仿佛我被纳入她的日常生活中，让人很不愉快。","仙台同学根本不在意我在想什么。","还看似理所当然地帮我穿上室内鞋，吻了膝盖。","「就叫妳别做这种事了。」","「我下次会注意。」","她以根本没反省，也不像会注意的表情这么说。","要是继续坐着，不知道她还会对我做些什么。","我站起身，整理着根本没被碰到的制服外套。仙台同学也站了起来，拍掉裙子上的灰尘后开口说道。","「所以交换条件呢？我可以碰宫城了吧？」","她理所当然地主张自己应有的权力。","「可以，妳碰啊。不过不只接吻，妳也不准脱掉我的制服，解开扣子一样不行。」","「事后才补上这些条件也太奸诈了吧？」","「才不奸诈，因为妳马上就会做些奇怪的事，不加上这些条件很危险啊。况且妳不会做惹我生气的事情吧？」","针对过度行为的惩罚。","——其实不到这种程度，但我不知道原本只是让她能尽情碰我的交换条件，会一路攀升到什么境界。她说不定真的只会碰我一下，然而回顾过去的行径，我根本不可能相信她。","「是啦，跟刚才说的一样，我不会做惹宫城生气的事。」","她用比随风飞舞的树叶更轻的声音说，粲然一笑，可是那个柔和的笑容是我在学校看到的她才会露出的笑容，反倒让人更无法信任。","「真的别做什么奇怪的事喔。」","保险起见，我再三叮咛后，传来她不满的声音。","「我就这么不能信任吗？」","「妳想想自己刚才做的事情，反省一下如何？」","「我已经反省过了。」","「……那就好。」","我很担心。","但即使做出太过火的行为，她依旧遵守了约定。","因此我也该遵守约定。","我紧盯着她，她一步两步地逐渐接近。","不知道她会做些什么，我的身体紧张地僵硬起来。","她来到和接吻差不多近的位置时，我反射性地往后退，脚却撞到椅子。","椅子发出了巨大的「喀啦」声，仙台同学抓住我的手臂——","随即抱住我。","「……这是怎样？」","彼此的距离比接吻时更近，我自言自语般地嘀咕着。","「一般来说是叫拥抱啦。」","「我知道。」","虽然知道，仙台同学的距离却近得让人忍不住想问。而且这还是第一次被她拥抱，身体轻飘飘的，甚至觉得室温较低的音乐准备室里好热。","心脏也好奇怪。","明明没做什么，却噗通扑通地吵个不停，感觉都要被仙台同学听见了。","「妳不要留在这里啦。」","她突然说了我从没想过的话。","「叫我别留在这里，是在说哪件事？」","我大概知道她想说什么，尽管如此还是反问她。她在手臂上施力，更用力地抱住我。","「在说妳选一所我们能一起吃饭的大学如何？」","我想看她现在脸上是怎样的表情。","然而因为环绕在背上的手臂，我的身体动弹不得。","能将仙台同学的感情传达给我的，唯有耳边听见的声音，可是她的声音毫无起伏，语调相当平缓，让人甚至无从想像她的表情。","「仙台同学无权决定我的志愿。」","我小声地回答后，传来的是她平静的声音。","「我们现在不也总是在宫城家一起吃饭吗？不觉得要是毕业后也能不时一起吃饭，会很开心吗？」","她没接受我的否定，谈起了毕业后的事。","我不知道该回答什么才好。","她所说的未来感觉很开心。","比起一个人吃饭，和她一起吃饭比较好吃，即使不说话，只要有人待在身边就能安心。我也觉得要是毕业后不能再见到仙台同学的话会很无聊。","却没有足够的自信相信她所说的话。","毕竟当下的我不知道她脸上是什么表情，语气听起来也并非真心，让人无法相信就算毕业了，她还会想跟我一起吃饭。","「宫城？」","耳边传来她的声音。","「好了，结束了。」","我没提及毕业后的梦想，想挣脱她的怀抱，但环绕在背上的手臂没有松开。","「再抱一下也没关系吧？」","「不行。」","「好啦。」","「才不好。」","「说好嘛——志绪理。」","她低声呢喃，有个柔软的东西碰上我的耳朵。","我马上就意识到那是嘴唇。","紧紧凑上来的嘴唇感觉好痒，我用力地推开她的身体。","「别叫我的名字。」","像是要撕掉涂了胶水的纸，一鼓作气地扒开她的身体，擦了擦耳朵。","「妳命令的内容那么沉重，相较之下，我能做的事未免太少了吧？」","仙台同学看着我，不满地说。","「已经很够了吧？」","尽管事后才补上条件，但她一开始就知道自己能做的事情没那么多了，所以我没道理听她抱怨，也没有更多能做的事了。况且即使吻的是耳朵，依旧违反了不接吻的条件。","再说她居然抱住我，简直就像——","宛如要抹去浮现出的话语般吐出一口气，我抓起书包。","「如果我以后在这里也会听宫城的命令，可以再碰妳吗？」","「不可以。」","她越是接近我，我就越觉得她待在我身边是理所当然的。","即使毕业，也会在我身边，跟我一起吃饭。","而我也会一如往常地命令她，觉得这样的每一天会延续下去。","但这当然是不可能发生的事。","「嘴上说不行，但要是我叫妳过来，还是会来吧？」","「不会来，妳别叫我来。」","「好好好。」","她的语气随便到我实在不觉得她有把话听进去。说完之后，她牵起我的手。","「干嘛？」","「不是要回去了吗？」","「跟妳牵着手回去？」","「当然是开玩笑的喽。」","仙台同学笑着放开了手。","「我先回去。仙台同学等等再走。」","我离开她身边，保持着距离。","「等等是几分钟？」","「十分钟后。」","「五分钟就好啦。」","「不要，总觉得妳会用跑的追上来。」","其实我不觉得她会跑来。","只是想要一点时间。","因为在短暂的时间里发生了太多事，我原本就不好的脑袋都要烧坏了。","我背对仙台同学走出音乐准备室。","啪哒啪哒地走在走廊上，接着回头。","后面当然没有仙台同学的身影。","走出旧校舍后，我朝着校舍出入口前进。","学校里虽然不至于完全没有人，走廊上却安静得让我有种是不是没人的错觉。要是这时天色已暗，我说不定会怕得冲出学校，不过今天外面的天色还很亮。我以快走的速度前进，路上没和任何人擦身而过，来到鞋柜前。","我换上鞋子，走到室外。","在因为寒风而颤抖的同时回头。","仙台同学不在。","这是当然的。","毕竟是我叫她过十分钟之后再出来的，她遵守着指示。如果不想遵守这个指示，她会乱找些理由跟在身旁才对。","好比说因为目的地是一样的。","我今天传了平常会传的讯息，叫仙台同学来家里。虽然她回了「放学后来音乐准备室，我等妳。」这种讯息，导致一切都乱了套，但我们接下来要去的地点是一样的。由于要去的是我家，可以一起回去，但我们约好在学校不会和对方扯上关系。","所以这样就好了。","我「呼」地吐出一口气。","冰凉空气不到将周遭染成一片白的程度，却完全感觉不到半点温柔，让人意识到今年的气温比去年的同一时间更低。","仙台同学一不在就好冷。","在音乐准备室，因为她太靠近了，反而让人觉得很热。","——不对。","只有仙台同学碰到的地方很热而已，冷不冷跟她没关系。","我转向前方。","要是走得这么悠悠哉哉，我会被她给追上。","突然抱住我，叫我别留在这里。","她做过的事跟说过的话全都令人在意，然而眼下不是在意那种事情的时候。要是想得太深，我会无法行动，甚至会开始觉得她做的所有事情都是有用意的。","我走出校门，以不会喘的程度快步朝家里走去。","路上和几个人擦身而过，经过好几间店，我在每周会绕去几次的超市前停下脚步。","今天冰箱里是不是什么都没有啊？","没有冷冻食品，也没有调理包和泡面，完全没有可以简单弄来吃的东西。","如果她没做蠢事，使出全力跑来，我就还有一点时间可以采买。","我走进超市，拿起购物篮。","高丽菜、马铃薯……","我把咖哩和炖菜的调理包，以及几种冷冻食品放进购物篮，犹豫了一下后，也把猪肉、鸡肉、咖哩块给放进去，拿去结帐。提着比平常更重的袋子走出超市时，已经过了大约二十分钟。","我看了看手机，仙台同学似乎已经先抵达我家那栋大楼，传了几则讯息过来。","传出讯息前，我停下手上的动作。","想到今天发生的事，她要是回家就好了。","与其过十分钟再走出音乐准备室，应该直接叫她今天别来了。突然做些至今从未做过的事，我不知道该用什么表情面对她。","超市提袋装满平常不会买的东西，我甩着提袋。","挂在手臂上的重量拖慢了走路的速度。","慢吞吞地拖着迟迟不肯往前的双腿迈进后，家越来越近，我看见大楼的灯光，走进一楼大厅，接着传来不高兴的声音。","「以一个先走十分钟的人来说未免太慢了？妳没看手机吧？」","顺着耳熟的声音望向墙边，只见就算不在也不奇怪的仙台同学就在那里，鼻头有些红红的，昭示着我让怕热的她等待的时间，长到足以使她显得很怕冷。","「原来妳还在等我呀。」","「那当然。妳要是叫我过十分钟之后再来，结果故意装作不在家，我可是会吓到的。今天很冷耶，不要绕去其他地方啦。」","既然觉得冷，回去不就好了？","差点说出这句话的我，把手上提着的袋子亮给她看。","「这个。」","「什么？要叫我拿东西吗？」","「这是仙台同学要做的晚餐材料。」","我把东西塞给她，解除大厅的门锁。","「我今天要做晚餐？」","「这是命令。」","说出无法反驳的话后，她小声地说：「原来如此。」迈步跟上。我们一起搭电梯到六楼，她没有试图牵我的手或是聊天。在玄关脱了鞋后，我们直接走向厨房。","我打开电灯和冷气，仙台同学则收拾起袋里的东西，气氛不至于尴尬，却没有什么好说的。她表现得一如往常，完全不像是在音乐准备室里抱了我的人。","说起来无论发生什么事，她总是挂着若无其事的表情。平常我会觉得这样的她很令人生气，今天却松了口气。要是一脸发生过什么事的样子，我反而很难跟她待在一块。","等她收好东西后，把五千圆交给她。","「如果我说不需要会怎样？」","仙台同学以犹如第一次看到五千圆的表情说道，但这就像是一种仪式，我不给她五千圆，彼此的关系就不会成立。没有付出代价，仙台同学就开始在这里做晚餐的话便不是命令了，还会凸显出我是受到她说毕业后也要一起吃饭的蠢话影响，才叫她做饭的。","今天要她做饭跟那件事完全无关。","偶尔想吃吃别人亲手煮的饭——","我只是这样想罢了。","「妳要是想回去，可以不要收下。」","见我打算收起将无处可去的五千圆，她一把抽走那张钞票。","「谢谢。只要做晚餐就好吗？」","她把五千圆收进钱包，开口问我。","「对。」","「可以先煮饭，吃完之后再去念书吗？」","「可以啊。」","「那要煮什么？」","「随便煮。」","我随口说完后，原本看着冰箱里的她反而不看了，转头望着我。","「说什么随便……妳特地去买食材，不是有想吃的东西吗？」","「什么都好。我又不下厨，只是因为不知道该买什么才好，才随便买了些东西。」","「也太没计划性了吧？」","「我就不懂啊。」","听到我老实的回答，仙台同学「嗯～」地沉思着，随即关上冰箱，站了起来。","「我倒也不是真的很会下厨，就算妳随便买了东西回来，要我随便做点什么，也办不到啊。」","「不然把我买回来的那个拿去加热吧。」","我指着放在吧台桌上的调理包。","「加热也行啦……但这样就称不上是做晚餐了。我煮个咖哩吧，反正有马铃薯也有肉，虽然没洋葱也没胡萝卜，不过应该没关系吧？」","既然下命令的我都说可以了，用调理包解决感觉比较轻松，然而在奇怪的地方很重视礼仪的她不肯以调理包打发命令。尽管不讨厌她这种有些认真的个性，有时候却也很麻烦。如果面对各种事都能随便一点，她便不会干涉我的志愿了，这样我也就不用想些多余的事。","「交给妳了。」","简短回答后，她又问我：「白饭呢？」","「有冷冻的，就用那个吧。」","「好。」","「那我去那边了。」","虽然有很多话想说，但我决定总之先等她煮完想煮的东西再说。我走出厨房，坐到吧台桌旁的椅子上，从客厅这侧望着她。","她一旦做出决定，再说什么都没用。","证据就是当我说出「交给妳了」之前，她就已经拿出锅子和菜刀，现在在洗马铃薯了。","我不认为她所说的「一起吃饭」包含了做饭，然而看着别人下厨的模样感觉不错。这个家除了我之外还有别人在的事实，令人感到安心。","而且我希望那个人是仙台同学，也希望这种事情能理所当然地持续下去。但她所创造的理所当然，可能会因为一时兴起而突然消失。","一想到这里，心情就有些沉重。","再加上看着她，总感觉只是单纯地配合著我而已，一如她会为了迎合茨木同学的话题而阅读杂志。尽管配合我感觉没有什么好处，但这样想比较合理。","她正在拌炒已经削皮、切块，变成不同形状的马铃薯。我开口问她。","「……妳不留在这里吗？」","不到鼓起勇气的程度。","尽管如此，这依旧是我想问却又难以问出口的事，所以嘴巴动得不太顺畅，声音也有点沙哑，导致语气变得像是在讲什么重要的事情，害我有点后悔。早知道就别讲了。","仙台同学什么都没说。","我的声音应该没有小声到让她听不见，可是她仍然继续煮着咖哩。","尽管得不到回应，但我不打算催促她。","我把额头靠在吧台桌上，耳边传来她的声音。","「意思是妳希望我留在这里？」","「问问题的人是我耶。」","我抬起头望向她。她手里拿着高丽菜，可能是想做沙拉吧。","「我不会念本地的大学。」","虽然问题有些模糊，但其中的含意确实传达到了，也收到预料中的答案。我早就知道，却还是想对不肯改变意见的她抱怨个几句。","「……只是要一个人搬出来住的话，在这里也行啊。」","「我不想那么做。」","她简短地回答，开始切起高丽菜，随即以几乎要被切菜声给掩没的声音继续说。","「能像这样跟宫城一起吃饭的日子还有——还有多久来着？」","她刻意问我。","「自己想啊。」","「毕业典礼在三月，二月几乎不用去学校，所以是十二月跟一月吧？」","「应该吧。」","毕业典礼不至于近得马上就要到了的程度。","尽管如此，想到仙台同学进入二月说不定就不会来了，往后吃饭这件事便让人郁闷。待在这个家里，只要有一边空着就很冷，虽然只是这种小事，我却觉得她应该待在身边，因为这已经成了理所当然，要是她没有理所当然地出现就麻烦了。","一瞬间我想着，早知道会变成这样，暑假那天干脆放任自己失控就好了。虽然得出彼此不该做那种事情的结论，但要是真的做了那种疯狂的事，总觉得在思考这些无聊事之前，我就会告诉仙台同学自己要跟舞香考同一所大学的事。","然而现实不同。","我们既没有失控，我也还没决定好未来该怎么办，说到底，能不能考上大学根本还是未知数，等考上后再决定就好。我一直拿它当藉口，逃避着选择。","只是我和仙台同学在这个家里共度的时光太多了，让人想要离开这个家。","唯独这点不会改变。","〔本话含插图〕"]},{"t":"第8话　我想更了解宫城","p":["我抱了宫城。","距离发生至今不过两周，称不上过了很久，原本鲜明的记忆却急速地变得朦胧不清，不确实到让人甚至想不起她在怀里的触感。","虽然那天她乖乖地待在我怀里，但那种事情想必不会再发生了。这样一想，就觉得自己或许该更清楚地把她的触感刻划在记忆当中。","要是记忆也能一并收进五斗柜，跟她的上衣和衬衫摆在一起就好了。","思考着这种事情的我，可能已经病入膏肓了吧。","真讨厌。","时间离午夜还早，在房间里写习题的我让笔在桌上滚动，越过笔记本，撞上课本后停了下来。","都是因为快要期末考了，坐在书桌前的时间越来越长，总觉得自己一直在念书。不过实际上我的确一直都在念书，所以不是错觉。","在这种情况下还要加上大学考试这个行事，教人怎么不郁闷？","我不讨厌念书，但还是希望大学考试能早点结束，然而一旦大考结束，我和宫城约好的毕业典礼就会来临。现在的我不希望以后无法再见到她。","我摸了摸她眼下已经不太碰的项链。","虽然她会透过命令我，或是动手解开第三颗扣子确认跟触碰这条项链，次数却越来越少。而随着碰项链的次数变少，要我做饭的次数增加了。","我倒不是希望她碰这条项链，只是她不碰，总觉得不太对劲。","这项链仿佛一旦戴上便脱不掉的诅咒道具，束缚着我，甚至让人觉得都是因为这条项链，才会害我一直想些无聊事。","我拍了拍自己的脸颊，斩断这股沉滞的气氛。","接着站起身，稍微拉开窗帘。","看向窗户，只见风正把大颗的雨珠打在上头。","从开始念书前就听到的雨声变大不少，还加上风声，待在寂静的房里不免觉得有些害怕。要是天气再冷一点，把雨都变成雪就好了。","我坐在椅子上，拿起手机。","这种时候，宫城在做什么呢？","打从第一次造访宫城家到现在，从来没有除了她以外的人待在那个家里。我不知道她父母在做什么，也不知道他们为何总是不在，更不知道胆小如她在这种夜里会不会觉得害怕。","我打开通讯App，找出宫城的名字。","短暂犹豫后，我拨了电话给她。","铃声响了两次、三次，逐渐增加。","当铃声响到第六次，我正想死心挂断电话之际，传来了宫城的声音。","「……仙台同学？」","「嗯，是我。」","「妳这时间打来做什么？」","问我做什么也很让人伤脑筋。","说穿了就是明明没事，我却打了电话给她。","倘若据实以告，感觉她会生气。","「因为天气很差，我想说宫城很胆小，应该正怕得发抖吧。」","我尽量轻松地讲出打电话给她的契机。","「我才没那么胆小呢。我只会怕鬼……不对，是恐怖片或连续剧，风雨没关系。」","看来她虽然怕鬼怪但不怕风雨是事实，电话那头的声音听起来不像是害怕的样子。","「对了，那打雷呢？也不怕？」","我想找话题，就顺便问起了等等说不定会打起的雷。","「不喜欢，但不是害怕。」","「不喜欢但不怕啊？」","「……不行吗？」","「倒也没有啦。」","说完这句话后，对话就这样中断了。","如此一来，我实在不知道该跟她说些什么。","只是想听听她的声音。","只是有一点担心她。","我不打算说出这种话，也没这么想。","大概、应该……没这么想。","却也不想挂断难得打去的电话。","「妳现在一个人在家？」","赶在没耐心的宫城嚷着要挂电话前，我填满似乎会变得漫长的沉默，然而手机彼端没传来任何声音。","这可不是什么好问题。","她几乎不说自己的事，就算我问她，也会转移话题。","「……是没错。」","我正要后悔，想说不该问刚刚那个问题时，却听见她微弱的声音。","「妳晚上总是独自在家吗？」","「因为我家人几乎不回家。」","虽然曾想过可能是这么回事，但这还是我第一次从她口中听到关于家人的事。","不知道她为什么会回答，然而这很难得。","「两个人都在忙着工作吗？」","「仙台同学，妳没什么要说的吗？」","看来这是她不想回答的问题，声音变得有些低沉。感觉到她想转移话题的气息，莫可奈何的我老实地告诉她。","「没什么特别要说的。」","对话旋即再度中断，房里只听得见窗外传来的风雨声。尽管还有其他事情想问，然而要是问起大学的事，可以想见她一定会很不高兴。假如现在说出「大学」二字，她肯定会挂上电话。","未免太不平衡。","感觉只有自己单方面地倾向宫城，找不到平衡点。","可是就算如此感叹，她也只会说想说的话，沉默依然持续。倘若继续这样沉默下去，恐怕不用等我问起大学的事，她就会挂电话了。","实在不想单方面地被挂电话，我于是主动表示。","「看来讲到这里就好。」","那么，晚安。","我本来打算接着这么说，却被宫城给打断了。","「妳再说点什么
