羽美奈发出了一听就知道很不满的声音，然而麻理子拿起羽美奈的书包，拉着她的手走了出去。","「对不起喔。下次我再补偿你们。」","我对着她们的背影说道。麻理子随意挥了两下手回应我。","我垂下视线，看着装有手机的书包。","我不觉得自己非得和宫城见面不可。","可是在接到羽美奈邀约时犹豫的我，才是真正的我。","我拿出手机，输入要传给宫城的讯息。","『赶快找我过去啦。』","经过短暂的犹豫后，我按下送出。","由我主动联络没联络我的她。","即使对演变成这样的事态十分不满，但要是不联络她，她搞不好这辈子都不会主动联络我，所以这也没办法。","我叹了口气。","一分钟、两分钟……","时间缓慢地流逝。距离传出讯息已经过了五分钟，手机依然没有任何反应。","一如预想。","宫城没有回复讯息。我曾思考过要不要叫她到音乐准备室，但想想还是算了。既然她没有回复刚才的讯息，就算叫她出来，她也不会赴约。","她的班级就在隔壁。","直接去堵她比较快。","我穿上大衣，拿着书包来到走廊上。隔壁班的门关着。我从前门上的小窗窥看教室内，只见宫城正准备和宇都宫她们从后门离开教室。我的视线移向走廊上。","和宫城对上了眼。","可是在我开口叫她之前，她便说：「我忘了东西。」转身走回教室。紧接着我的手机就响了。","『你过一会儿之后再到我家来。』","我从书包里拿出手机。萤幕上显示的文字，怎么看都是她认为这样做总比我在宇都宫她们面前叫住她好才传来的讯息，这样一想就让人有点生气，想从教室里把她拖出来，想在宇都宫她们面前，把我和她至今为止都会共度放学后的时光，甚至暑假和寒假期间也有见面的事情全说出来。","虽然要是真的做了这种事，我所剩无几的高中生活一定会过得万分辛苦，所以不会做就是了。","『过一会儿是过多久？』","我靠着教室和教室间的墙壁，传出回复的讯息，随即心不在焉地环顾四周，或许是因为走廊上太冷了吧？等待着宫城的宇都宫她们也走回教室里。在这段时间内，我的手机仍不断收到讯息。","『在我离开教室后过一阵子。』","『知道了。』","『我现在要走出教室了，不要找我说话。』","『是是是。』","在学校不准找对方说话。","传出讯息告诉她我会遵守差点就要打破的约定后，我看着走廊。她很快就走出了教室，跟宇都宫她们一起离开。","尽管不知道一阵子是多久，不过等了五分钟以后，我同样走出学校。","用不至于快过头的速度走在前往宫城家的路上。","缓缓流逝的景色单调无趣。","行道树上毫无绿意，行人的打扮也很不起眼。","冬天缺乏色彩的景象，光是倒映在眼里就令人提不起劲，吹来的风也很冷。我原本是以不算悠哉但也不算太快的速度前进，步调却逐渐加快。明明晚了五分钟才离开，却已经看到比我早离开学校的宫城背影。","「宫城。」","我在大约再一分钟就能抵达住宅大楼之际出声叫她。","可是她没有停下脚步。","我在住宅大楼前走到她身旁，踏进大楼。","「仙台同学，我不是叫你过一阵子再到我家来吗？」","「我的确过了一会儿才离开学校啊，只是追上你了。」","我们穿过大厅，一起搭上电梯。","「追上我未免也太奇怪了，你是急着赶过来的吧？」","「单纯只是宫城走太慢了吧？」","「才不慢。是仙台同学走太快了。」","我和嘴上抱怨着的宫城踏出电梯，走到玄关。跟在打开门锁的她身后走进屋内后，她叫我等一下，自己跑进房里不见人影，然后很快又回来，递来一张五千圆纸钞。","「谢谢。」","我拉动钞票，即使有些许被捏住抽不动的感觉，钞票依然很快就落入了手里。我将收到的五千圆纸钞收好之后看向她，发现她脸上挂着难以言喻的复杂表情。","「宫城？」","「没事。」","今天再度上演了一次和之前一样的互动。她的身影消失在厨房里。我先走进她房间，脱下大衣和制服外套，解开衬衫的一颗扣子，从黑猫负责看守的书柜上拿了本漫画。躺在床上翻动书页时，房门打开了，她将麦茶和汽水放在桌上。","「空调要设定在几度，你才不会觉得热？」","她把我脱在地上的大衣和制服外套挂上衣架，一边问我。","「我脱外套已经算是一种习惯了，设定在几度都没差。反正觉得热的话，我会喊热——是说宫城应该有事要跟我说吧？」","我阖上看到一半的漫画，坐起来。","「我有什么事要跟你说？」","宫城背靠着床舖席地而坐，用完全不懂我在说什么的表情看着这边。","「你考试考得怎么样？还好吗？」","「我有必要告诉仙台同学吗？虽然说过会告诉你我有没有考上大学，却没提到要说出我考得怎么样吧。而且后面还有其他考试要考啊。」","「考得好或不好这种事，现在马上就答得出来了吧？不要那么小气，告诉我啦。」","我抓起枕头拍她的头。","毕竟还有其他考试得考，不是考完这个就结束了。诚如她所言，她没有义务向我报告考得好不好，我们没有约好，所以想问她不过是我的任性，却无法克制自己想知道的欲望。","「宫城……」","我又用枕头拍了一下她的头。她的眉间堆起皱纹。","「……普普通通。」","停顿了一下后，她给了我一个模糊不清的回答。","「普普通通？普普通通是怎样？」","「总之就是普普通通，我有什么办法？真要说起来，你考得又怎样？」","「普普通通。」","用刚听到的话回她之后，她转身背对我。","就算没看到她的表情，我也知道这话惹她不高兴了。","宫城拿起玻璃杯，喝下汽水，把内容物剩下大约一半的玻璃杯放回桌上。","我已经习惯沉默了，而且本来就是明知道会惹她不高兴，还回「普普通通」的。尽管如此，我仍很在意充斥整个房间的沉滞气氛，开口问道。","「是说宫城会去毕业旅行吗？」","我抛出一个常见的无聊话题。","「不会。仙台同学呢？」","「虽然不到旅行的程度，不过我会跟羽美奈她们出去。」","「是喔？」","回应的声音有些低沉。","她转过头来望着我，随即站起身拿走我放在床上的漫画，动作跟用抢的没两样。","「我还在看耶。」","我倒也没特别想看后续，但还是开口抱怨。","「书是阖上的，你根本没在看。」","「接下来正要继续看啊。」","「我要命令你，你待会再看。」","这样说完后，宫城便把漫画放回书柜上。","「今天要做什么？」","「你在那边坐好。」","命令从衣柜前飞了过来。","「你说床上？」","「对。」","我依言坐到床上。然后她打开衣柜，拿出一条水蓝色的毛巾。","「接住。」","这句话与毛巾同时抛来，但毛巾还没到我所在的位置就落地了。不过她并不在意。在我捡起毛巾前，她说出下一道命令。","「你知道该拿那个做什么吧？」","她以平静的语气这么说，指着毛巾。","「要我自己来啊？」","我拿起水蓝色的毛巾问她。","一旦对照过去的经验，我就知道自己该做些什么。然而一想到在这个命令之后她可能会对我做的事情，便让人不太想积极地顺从她。","「自己来。」","宫城很没品。","总是下些不能公然说出来的命令。","虽然被她命令这件事本身就不是什么可以对外公开的事情就是了。","「快点啦。」","见我仍拿着毛巾犹豫，她开口催促。","无论是自己来或让她动手，结果都不会改变。","只会造就我蒙住眼睛的事实，使事态继续进展下去。尽管有点抗拒自己蒙上眼睛，但要是继续拖拖拉拉下去，可能会害她心情变得更糟，导致之后的命令更不像话。","我用水蓝色的毛巾蒙住眼睛。","主动蒙上眼睛，让这个行为变得更加离经叛道。","她这个人真的很没品。","「我什么都看不到，很无聊耶。」","我向不确定到底在哪里的她抱怨。","「我不是为了让仙台同学觉得好玩才这么做的。」","她的声音从正面回应我。","「所以这样做是宫城觉得好玩喽？」","「不好玩。」","宫城似乎不只是没品，连思考逻辑都很不正常。","我不懂她为什么要叫别人做些不好玩的事。","「然后呢？你要对我做什么？」","我想忽视心中那股对于看不见的不安感，开口问她。","却没有得到回答。","「宫城？」","呼唤应该在正前方的宫城名字后，她的手碰了我的脸颊。","那只手轻柔地抚过脸颊，沿着唇瓣移动。","我的身体反射性地紧绷起来。","我回想起暑假她蒙住我眼睛之际发生的事，可是她的手很快便离开，没跟那时候一样地吻我。","「仙台同学。」","她语气平静地叫我。","虽然没有碰我，但我能感觉到她的视线。尽管有蒙住眼睛的毛巾碍事，实际上我并不知道她有没有在看我，却仍觉得坐立难安。脖子附近有些痒痒的。","「回我话啦。」","宫城有些生气地对沉默不语的我说道。即使如此，我仍没有回话，于是她又叫了一次：「仙台同学。」","「什么事？」","「——说讨厌。」","「啥？你突然说什么啊？」","「别管那么多，说就对了。」","「为什么？」","「没有为什么。」","我听见的声音和平常一样。","不高兴而有些低沉的声音。","她说出一些让人搞不懂的话，倒也不是什么稀奇的事。我常常无法预测她的行动，即使在意也无计可施，却觉得刚才的并非自己能在不清楚用意的情况下就听从的命令。","「我要对什么说讨厌？」","像是要和宫城视线交会似的稍微抬起头，我谨慎地询问。","尽管被毛巾蒙住的眼睛无法对上宫城的双眼，我依旧想知道她真正的心意，用看不见的眼睛看着她。","「……对我。」","她悄声说道。","现在……","我现在就想看到她的脸。","双手并没有失去自由。","碰得到水蓝色的毛巾。","我动手准备解开只会碍事的毛巾，想看她脸上带着什么样的表情，可是在解开毛巾上的结之前，手就被抓住了，接着毛巾也被重新绑紧。","「我没说你可以解开。」","我听见她的声音，紧邻在我所坐位置旁边的床舖微微下沉。她不由分说地拉我的手臂，让我转向她所在的方向，随即往后推倒我。幸好有棉被，我的背并不痛，但在视觉被剥夺的情况下遭人粗鲁地对待很恐怖。我正想说至少要抱怨个一句，然而先传来了她的声音。","「快点说啦。」","她的手指碰上吊坠的链条，把链条拉了出来。","宫城没有解开我的衬衫扣子。","吊坠被她用力拉扯，链条陷入了我的后颈皮肤。","「你拉得太用力了，这样很痛，而且会坏掉啦。」","她似乎抓着坠饰，所以我不觉得脖子有被勒住，却感觉她有可能会这样勒紧到我停止呼吸，令人背脊发寒。因为看不见，不知道她会做些什么，我的呼吸变得有些急促。","「放开啦。」","我试着以比较严厉的语气说，但她仍继续拉着吊坠。","链条带来的疼痛感使我皱起眉头。","「宫城。」","她没有回应。","相对地有股温度靠近，我的感觉变得敏锐起来。我又叫了一次：「宫城。」她随即放开吊坠，咬了我的脖子。随着温热的东西一同抵上来的牙齿陷入皮肤，却没有痛到让人想喊痛的程度。不知道是因为这没有刚才链条勒住后颈那么痛，还是她的嘴唇碰着我，总之我还能忍受。","不过我没再感受到痛楚，她的嘴唇和牙齿便离开了。有个不是嘴唇的东西碰上我被咬的地方。那多半是手指的东西抚摸我的脖子，顺便抚过链条，滑过锁骨上方。","她理所当然般地解开了我衬衫上的一颗扣子，松开领带。","我看着被毛巾给蒙住，看不见的宫城。","脑中浮现出她接下来会对我做的事，呼出一小口气。","可是她没有绑住我的手。","就只是松开了我的领带，没有再做其他事。","毕竟她一开始就能绑住我的手，要是真的想绑，我早就已经被绑住了。","所以我今天想必不会被绑起来。","她大概希望我能碰她吧。","我做出有利于己的解释，摸索着找到她的手臂，把她拉过来。","伸出手臂环抱住她，抚摸她的头发。","她既没有拍开我的手，也没有逃开。","「——宫城，你讨厌我吗？」","我用手轻轻梳着她的头发问。","「……嗯。」","稍微停顿了一下后，传来她的回应。","「那就清楚地说你讨厌我。你说了，我便会听从你刚刚叫我说讨厌的命令。」","我凭着触感找到宫城的脸颊，用指尖抚过唇瓣。","她什么都没说。","「你说我也不会生气的，说吧。」","指尖前的嘴唇没有动。","要是她这时候说讨厌才让人惊讶。就连我抱住她、摸她的头发，她都不排斥了，怎么可能说得出讨厌？","我的手指缓缓离开她的唇瓣后，她也稍稍往后退去，接着伸手摸上吊坠，以感觉会在我的肌肤上留下链条痕的力道沿着一路摸过去，指尖来到坠饰所在的位置。","「把项链还给我。」","她用力拉扯吊坠，力道大到要是说她想扯坏这条吊坠，我也会相信的程度。","我这次毫不犹豫地取下蒙住眼睛的毛巾。","——看起来非常不高兴，但也像是快哭出来的表情。","在遭到妨碍前就解开毛巾的我，眼里倒映着宫城眉头深锁的脸。即使刚从黑暗及压迫中解放的视野仍有些模糊，我所看见的毫无疑问是她。","「不是叫你不准擅自解开吗？」","她放开吊坠，一把抢走毛巾。","「比起那个，要我把吊坠还给你是怎么回事？」","「没什么理由。」","宫城那与其说是冷淡，不如说不带感情的声音传来。","我揪起她的衬衫。","「那我不还。是你叫我在毕业典礼前都要戴着吊坠的吧？好好遵守约定啦。」","「仙台同学还不是会不守约定。」","她气愤地说着，拉开我揪着她衬衫的手。","「就算我会不守约定，宫城还是要遵守约定啊。」","说出任性的歪理后，她一语不发地用力拉扯，想扯断吊坠。","「我不会还你。」","我拍打她的手，再度强调。","尽管如此，她依旧继续拉扯吊坠。我又打了一下她的手，她这才收手，陷入我后颈的链条放松下来。","「我说宫城，后面还有考试，你不要说这种奇怪的话啦……我会很失落耶。」","我推开她，坐起身来。","「仙台同学怎么可能会觉得失落？」","用微弱的声音说完后，宫城无力地趴在床上。","「你真的是个笨蛋耶。」","我用枕头拍打她的头，爬下床问道。","「下次呢？」","「咦？」","她抬起头看我。","「下次我哪天要来这里？因为你已经决定好到毕业典礼前都会叫我过来，付五千圆给我了，所以快说啦。」","「……我会再联络你。」","「你绝对不会联络我吧？现在就决定。」","语气强硬地催促她后，她把脸埋进了枕头里。","「六天后。」","传来她含糊不清的声音。","好久。","可是考试毕竟还没全部考完，我们也得念书才行，所以约在六天后并不奇怪。","「我知道了。那等可以自由选择要不要去学校之后，你打算怎么办？」","我提起另一件在意的事。","到了二月，学校就不会再强制三年级生到校，在毕业前去不去学校都无所谓。虽说是交由学生自行决定，不过大多数学生都会选择不去学校。羽美奈和麻理子也都说她们在这段期间不会去学校。我也不打算去。","我还没听说宫城打算怎么做。","「……」","她不可能没听到。然而将脸埋在枕头里的她一动也不动。","「宫城，自由到校期间不是放假。」","学校放假时不见面。","我们有着这样的约定。","但自由到校期间算得上是要上学的日子。","「宫城。」","我喊她的名字催促后，她才小声地回了句：「不用你说，我也会叫你过来。」","〔本话含插图〕"]},{"t":"第7话　想从仙台同学那里得到的东西","p":["约好的六天后就是明天。我的心情好沉重。","叫仙台同学过来。","不过就是这样的小事，却令人感到忧郁。","她问我考试结果时，我虽然说普普通通，但那是骗她的。我觉得自己考得比普普通通更差。就因为我认为能考得更好，才不想说那样算是普普通通，然而要是直接把考试结果告诉她，她表现得很失望，那也很没意思。","所以就像她不遵守约定一样，我也对她说了谎。","我讨厌这样的自己。","青椒、绿花椰菜、春菊……","在放学回家路上绕去的超市里陈列的蔬菜中，我也看到了讨厌的东西。一如无法喜欢上这些东西般，我也无法喜欢上自己。","巴西里也很讨厌，仙台同学也——","要是能讨厌她就好了。","结果仙台同学不肯说她讨厌我。","我叹了口气，把即食调理包和泡面放进购物篮里。本打算再买个汽水就回家，我却停下了脚步，走回生鲜蔬菜区，把马铃薯和胡萝卜放进购物篮。","这世上如果有吃了会变聪明的蔬菜就好了。","我在超市里晃来晃去，一边追溯记忆，好像在哪里听过鱼含有会让脑筋变好的成分，但我不喜欢吃鱼。我知道即使自己愿意吃鱼，也不可能突然就变聪明。","我非常明白，到了这个节骨眼才着急根本无济于事。","然而就像求神拜佛一样，我想仰赖些什么。","要是想和舞香上同一所大学，下次的考试才是重点，只要能考好就没问题了。毕竟我的成绩有变好，老师也说我可以去考考看。","但无论是老师或自己，我都难以信任。","也始终无法信任仙台同学。","要是能有不会动摇的自信就好了。","如果我能相信自己考得上大学，也相信仙台同学，就会觉得即使毕业了，同样可以像过去这段时间一样，继续和她见面。但实际上我并不知道自己能不能考上第一志愿，她也没守住跟我的约定。","假设没跟舞香考上同一所大学……","我就会留在这里。","毕竟亚美也会留在这里，所以我不会落单，舞香那边只要继续保持联络就行了。纵使考试失利，世界也不会就此毁灭，只不过是往后会过着我一开始所想的生活罢了。然而要是事情演变成这样，总觉得很无趣。","倘若考得上，我当然希望自己能考上，没考上我的心情会很糟，也不希望是因为外在因素，而非自己做出的选择，导致不得不和仙台同学分隔两地。假如最后会变成那样，倒不如由我主动在毕业典礼到来前离开她。","那一天——","如果她愿意说出讨厌我，我就能在约定好的日子之前离开她了。","我在宝特瓶的货架前思考着。","伸手想拿汽水，却又作罢。","虽然并非要以仙台同学为优先，可是冰箱里的两个宝特瓶在我的印象里，是麦茶那瓶剩下较少。","「买两瓶又太重了……」","考虑到还得提着东西回去，我不可能把两种都放进购物篮里。我放弃汽水，将麦茶放入购物篮，然后在结帐之前又去拿了一盒牛肉。","开始和仙台同学一起吃饭之后，我的舌头就变得更贪心了。虽然即食调理包和泡面也很好吃，但煮出来的料理更美味——我想起了这件自从妈妈不在之后便遗忘的事。","反正都要吃，我想吃更美味的料理。","问题是能让我吃到美味料理的人，只有仙台同学。","她在不知不觉间成了构筑我这个人的要素之一。回顾过去，我心中的月历上留有许多不记得自己曾做过的记号，就连味觉都留下了印记。那些几乎都是她擅自加上去的，然而每一个我都能清楚地回想起来。","我本来认为「讨厌」这个词，能成为记忆的橡皮擦。","足以擦掉我心中的月历在不知不觉间被加上的那些记号，消除写入记忆中的那些关于仙台同学的情报，恢复到我在书店给她五千圆前的状态。","可是我没能得到那块橡皮擦。","反而得到了抱紧我的仙台同学体温，以及下一次的约定，令人满心忧郁地过着今天这个日子。","我「唉」地呼出一口气，付了钱走出超市。","走在一月尾声，吹着寒风的城市里。","右手拿着的提袋很沉重。","开始与仙台同学一起吃饭之后，要买的东西也跟着变多。要是这种时候她能在旁边帮忙拿东西就好了，毕竟这里头有接近一半是她要吃的东西，要她做这点小事也是应该的。但一想到实际上要她来拿东西，就得加上我们必须一起采买的规则，总觉得很麻烦。","假如往后也会继续发生这种状况，调整一下规则会比较好。然而我们所剩时间不多，我也没有想和她一同采买，或是希望她能帮忙拿东西到需要为此改变规则的程度，所以照理来说只要维持现状即可。","明明是这么想的，我却觉得右手上的东西格外沉重。","脑中一直想着如果她来帮我拿一半该有多好。","都怪这个不可能成真的想法不肯消失，连我的头都开始变得沉重起来。","都约好毕业后不再见面了，我也不知道能不能和舞香考上同一所大学。","即使如此，如果——","我能和舞香上同一所大学。","反正我是个说谎的骗子，把过去的约定变成谎言也无所谓吧？","我用力甩动手上沉重的提袋，加快脚步。","不对。","觉得我这个骗子就算说谎也无所谓的这个想法才是谎言——","「根本搞不懂是怎么回事了嘛。」","想着想着，脑袋都混乱了起来。","这只是风太冷，让人没办法好好运转脑袋罢了。","在灰色的天空下，我再度加快了脚步。尽管没有明显感觉到速度变快，吹着风的脸颊却冷得似乎快要结冻。袋子的提把因为麦茶而深深陷入手里。","我迅速走回住宅大楼，把袋子里的东西放进冰箱。","回到房间里打开空调，换衣服。","然后就这样躺到床上。","从放在枕边的黑猫底下抽出五天前仙台同学阅读的漫画。","不断翻动书页。","我的心情一直摇摆不定。","明天我不想见到她，又想见到她。","我没有笨到不晓得两者是互斥的想法，然而最近不想见她和想见她的心情，总是交杂在一起。","一旦见面，就会想再和她见面。","虽然想说既然如此，那别见面就好了，但是就算没见面，我也会想和她见面。","一直思考这种事情很难受。","我忍不住会想，要是能回到去年的这个时候该有多好？倘若时间可以倒转，我会在重新分班之前就结束和她之间的关系。这样一来在选大学的时候就不用想那么多，可以继续在这里生活下去。","仙台同学果然该说讨厌我。","她总是这么过分。","我阖上只是翻着页，根本没在看的漫画，拍了一下黑猫的头。黑猫没有发出「喵～」或「咪～」的叫声，也不像仙台同学那样会开口抱怨。","无聊。","我又打了一下黑猫的头。","明明不希望明天到来，却又希望明天早点到来，有这种想法的我怎么不干脆消失算了？","从学校回来后，我以念书来消磨空闲的时间。","做着这件一年前的我想必不会做的事情时，门铃响起。如同之前说好的六天后，我在开始念书前传了「你现在过来」的讯息给仙台同学，所以按门铃的人一定是她。","我把后来一直放在枕边的黑猫挪到了书柜上。","看了看对讲机，萤幕上显示出仙台同学的身影。","她比我预期的更晚到。","我所谓的「现在过来」是表示「立刻」，要她赶快过来的意思。","距离传出讯息已经过了一段时间。","我透过对讲机向她抱怨，解开大厅的门锁。过了一会儿，门铃再度响起。打开玄关大门后，她吐出心中的不满，一边走进屋里。","「我也已经算是急着赶过来了耶。」","说讨厌我。","她绝对还记得我说过这句话，却用一如往常的表情看着我。","「太慢了。」","「要比这更快，不用飞的过来根本办不到吧？」","「你要是会飞就飞过来啊。」","因为仙台同学表现得一如往常，我也像平常那样回呛她。","我用自然得惊人的态度，接受了没得到讨厌这个橡皮擦的今天。虽然不认为这是一件好事，我却想不到还有什么新的方法能获得橡皮擦。","「宫城会飞的话，我下次就用飞的过来。」","她一脸嫌麻烦地说道，脱下鞋子。","我将五千圆纸钞递给她，轻轻呼出一小口气。","这五千圆是要用来买下她的时间。","我并不觉得惋惜。","却很在意如果不给她会怎样。","她曾主动问过我「如果我说不需要会怎样？」当时说不定该问她那句话是什么意思。我想知道，要是那天自己接受了她的提问，不给出五千圆的话会怎样。","「仙台同学。」","当彼此之间没有代价存在。","我想像着比现在更之后一点点的未来，犹豫该不该将手里的五千圆给她，但很快就把五千圆递了出去。","「给你。」","她像平常一样拉住纸钞边缘，我的手指反射性地用力。不过在她开口说些什么之前，我便急急忙忙地松开了手。","就算没有五千圆，她也会——","这是句即使没有橡皮擦也该擦掉的话。","「谢谢。」","仙台同学收起五千圆。","我不认为不给她五千圆的自己具有任何价值。如果没有付出代价，我就无法买下她的时间，她也不会听从我的命令。不听从命令，便表示她也不需要再来我家了。","「我去拿饮料。」","我转身背向她。","「那我等你。」","我走到厨房，拿出两个玻璃杯。打开冰箱，里头有着两个内容物所剩无几的宝特瓶，还有昨天新买回来的一瓶麦茶。我取出汽水和新买的麦茶，倒入玻璃杯，将杯子放到托盘上，回到房间。只见仙台同学坐在平常会坐的位置上。","「今天你来做晚餐。」","我这么说着，把玻璃杯放到桌上，坐到她身旁。","「那是今天的命令？」","付出五千圆的代价想获得的东西。","绝对会守住的约定。","倘若能买到这样的东西，我就可以信任她。即使上了不同大学，要像她说的那样偶尔一起吃饭、出去玩也可以。可是我说不出这种话，五千圆不可能买到等同于要束缚她一生的命令，也不是试图疏远她的我该说出的命令。","「对，什么都可以，你做点东西来吃吧。」","我看着她，下达与五千圆价值相当的命令。","「你说什么都可以……冰箱里应该不是空的吧？」","「不是。」","「我可以先去看看冰箱吗？」","「可以。不过我要跟你一起去。」","我这样回答后，她便放着摊开在桌上的参考书不管，站了起来。我也一起走向厨房。","点亮客厅和厨房的灯之后，她打开冰箱，盯着冷藏库，接着又看了看冷冻库跟蔬果室才转身。","「你喜欢马铃薯和胡萝卜吗？」","「普通。为什么会这么想？」","「因为冰箱里一直都有，我才想说你是不是喜欢。」","「也不是一直都有。我只是不知道要买什么才好，才买了这些。」","「拜托你配合想吃的菜色买材料回来啦。」","「我不知道自己想吃什么。」","随便吃。","我过去都过着这样的饮食生活，所以即使有想叫仙台同学煮点什么来吃的念头，也不知道要叫她煮什么，更不知道自己想吃什么。","况且我从未对下厨产生过兴趣，于是就在不知道买哪些材料可以煮什么的情况下成了高中生。","「那我们一起去采买不就行了？再说比起依据材料来决定菜色，先决定好想吃的菜色再采买材料，我也比较好做啊。」","虽然不到觉得自己想了个好点子的程度，但她用相当轻快的语气说道。","两人一起去采买，把沉重的东西分成两份，一人提一半回家。","这是我昨天才想过的事情，没想到会从她口中听到同样的话。从她的声音听起来，有种即使在毕业典礼后，我们也会像这样一起站在厨房里的感觉。然而那是不可能实现的未来。","「仙台同学要这样说的话，那你去买啊。钱我再给你。」","「意思是没有一起去的选项吗？」","「没有。」","和仙台同学在一起，会让我认为回到只剩下自己一个人的状态是件很恐怖的事。严格来说，就算她不在了，我也不是独自一人。我有朋友，上了大学以后应该也能在那边交到新朋友。明明如此，却觉得一旦没有她，自己就会变成孤身一人。","我严重地倾向她，甚至产生了自己是以她为支柱才有办法站立的错觉。怀疑要是她不在了，我是不是就无法自立？","那样太令人困扰了，所以一个人能完成的事情，就该独自去做。","「那就照之前这样，由宫城去买吧。」","她很刻意地叹了口气，随即走向客厅，明明没有要吃饭，却坐到吧台桌前的椅子上。","「真要说起来，比起付钱要我下厨，直接去找那种家事外包服务的人来，应该能吃到更好吃的饭菜吧？」","悠哉地开始聊起天来的仙台同学似乎不打算回房间。我无可奈何，只好站到她身旁。","「我不喜欢有外人在家里。」","妈妈不在之后，某段时期会有人来家里帮忙煮饭、打扫。我不知道那是不是家事外包服务，不过当时有外人在家里让我静不下心来的事，倒是记得很清楚。","「我也是外人啊。」","「仙台同学是——」","特别的。我差点这么说，又吞了回去。","这不是可以随便说出口的话。","「我是？」","仙台同学咧嘴一笑。","「虽然是外人，但原本是我的同班同学，所以没关系。」","「意思是即使不是我也无所谓？」","「这种事情不重要啦。比起那个，你决定好要做什么了吗？」","我像是在逃离她那仿佛要说些什么的视线，改变话题。","「还没决定。」","「赶快决定啦。」","今天晚餐的菜色根本不重要。","既然都要花时间，还不如把时间用来念书。然而比起念书，她似乎更在意晚餐的内容，在我身旁一脸认真地陷入沉思。","「就算叫我赶快决定，但咖哩跟奶油炖菜都做过好几次了……嗯～马铃薯炖肉呢？啊，不过没有洋葱。」","我从仙台同学嘴里嘀咕着，像是自言自语的内容当中，找到了想吃的东西。","「你会做马铃薯炖肉？」","「你想吃吗？」","「你会做的话。」","「我不知道怎么做，得查一下。因为没有洋葱，做出来可能不好吃就是了。」","「就算没有洋葱，你也要做得很好吃啦。」","我不在意少了什么材料。","但她能做出即使缺少材料，在某种程度上依旧好吃的东西当然更好。","「我会尽量努力，可是不保证喔。」","她站了起来，走回厨房。确认完冰箱里的食材和调味料后，说要回房间去。","马铃薯炖肉很好吃。","因为那是我自己做不出来的料理，所以很遗憾地成了会残留在记忆中的东西，不过好吃并非坏事。","仙台同学在吃过饭、念完书之后回家了。","在那之后，没有用到的蔬菜们就这样沉睡在冰箱里。","她又来到我的房间，在我身旁疾笔振书。","我在一月底吃了马铃薯炖肉，眼下已经步入二月。","再过一个月，即使不情愿，毕业典礼也会到来。","和她一起待在这个房间里——","一思考起这样的时间还剩下多少，我便感到忧郁。","「宫城，差不多休息一下了吧？」","仙台同学戳了戳我。","「是可以……」","她来到这个房间后，已经过了至少两小时。","不念书我会感到焦虑，却也明白急不得的事情就是急不得，再怎么焦虑也无济于事，而且专注力没办法持续那么久。","我放下握着的笔，看向身旁。","倒不是真的很久没见到她，却有种隔了很久才又见到她的感觉。","大概是由于进入二月后，我就没再去学校了吧。","舞香跟亚美都说自由到校期间不会去学校，我也不想去可以不用去的学校。虽然自由到校期间才刚开始，可是不去学校，我就连在走廊上与仙台同学擦身而过的机会都没有。想必是因为不像这样叫她过来，就完全不会看到她，我才会觉得彼此有好一阵子没见到了。","「可以不用去学校之后，宫城都在做什么？」","仙台同学看似正好想起这件事情，开口问我。","「念书。」","虽然我不喜欢念书，不念却又不安心，只好勉为其难地念下去。","「我想也是。那学校呢？」","「没去。反正舞香跟亚美也都没去，去了也很无聊。仙台同学也没去学校吧？」","她今天不是穿制服，而是穿着便服出现在这个房间里，这表示她没去学校，是从家里过来的。也就是说即使我去了学校，也不会遇到她。","「是这样没错。」","她没什么干劲地回答。","我看向她摊开在桌上的笔记本，上面有着一排排工整的字迹。尽管其中有些字超出了格线，我依然觉得她的字很漂亮。","跟她的外表一样。","她五官端正，又把自己打理得漂漂亮亮，即使有些部分超出了校规容许的范围，依旧不会受到老师责备。","待在仙台同学身边，我总忍不住会想，要是能变得像她一样就好了。","可以写出漂亮的字，会念书，外貌又好看。","如果能变成那样，感觉自己便能变得更有自信一点。","我不让她听到地悄悄叹了口气，往后挪动身体，背靠着床舖。笔记本的文字消失在视野范围内，我紧紧闭上双眼，轻轻伸了个懒腰再睁开眼睛，看到她的长发。她今天穿的虽然不是制服，不过跟寒假时不同，没有穿高领上衣，而是穿着衬衫。然而被那头长发挡着，我没办法清楚看到她的脖子。","那头没有绑起来的长发很美，却让人无从得知她有没有戴着项链。","我伸手轻拉她的头发。","「干嘛？」","她看着我。","我今天已经付了用来当作命令她代价的五千圆，所以可以确认她是不是有戴项链。","我又一次让手指缠绕住她的头发，再松开。","她应该有戴才对。","至今为止，她从来没有不戴。","「没事。」","我简短回答，挺直身体，背部离开靠着的床舖。仙台同学随即解开了衬衫上的一颗扣子。在我问她理由之前，她就拉出了项链。","「我有戴。」","她看着我，理所当然地说着。","「我又没有叫你给我看。」","「因为你看起来想这么说。」","「我没打算要说，也没那么想。」","「是喔？」","她一脸无趣地说着，收起项链，却没把衬衫的扣子扣回去，反倒伸手来拉我连帽上衣的帽子。","「还记得我们约好你考上的话要告诉我吗？」","「记得。」","怎么可能忘记？","就是因为跟她做了这种约定，我才会不安吧。","假如没考好……","就得告诉仙台同学，我没有考上。","我们的约定是考上要告诉她，所以一旦没考上，我大可不必说。可是在没告诉她的那一刻，她就知道我没考上了，既然如此，等于没有不告诉她的选项。但不管怎样都得告诉她的话，我想告诉她我考上了。","「你考试没问题吧？」","她语气不变地问我。","「没问题。」","「那就好。」","才不好。","我完全不知道好在哪里。","说什么没问题都是假的，我依旧对自己毫无自信。","她却没有察觉到。","总觉得要她察觉到我没说出口的心情，根本是强人所难，但我仍认为她该察觉到。","「仙台同学，帮我施个幸运魔法啦。」","「那是今天的命令？」","「对。」","「幸运魔法是指之前的那个？」","「是你说那个有效的吧？」","我知道仙台同学之前对我施的「幸运魔法」根本不是真正的幸运魔法，也明白那更像是她想看我不知所措的样子才做的恶作剧，没有实际的效果。尽管如此，却还是觉得让什么都做得到的她触碰我，我也能得到她一半的能力。","「手借我一下。」","她靠近我。","我老实地伸出手，她动作轻柔地抓住，然后像之前一样，用嘴唇触碰我的指尖。","她连做这种事情都像一幅画，实在太奸诈了。","我心里莫名地焦躁起来，轻轻拉了拉她的浏海。和之前触碰的顺序不同，她的嘴唇碰上了我中指第二关节上方的位置。","这种事情不可能让人变得有自信，但总比什么都不做来得好。即使无法变得像她一样，至少能消除那股觉得自己不念书不行的焦虑感。","嘴唇触碰我的指根。","紧接着，某个温暖的东西爬过我的手背。","如果是被狗或猫舔手，我会觉得很可爱，但对象是仙台同学就不可爱了。心中有股更不一样的感觉，大概是因为我并非用对待动物那种纯粹的心情看待她吧。","我强烈地希望她不要对其他任何人做这种事。","能像这样感受到她体温的人，有我就够了。","方才舔着我手背的舌头离开，转而在掌心上落下一吻，然而只吻了一下。她马上就抬起了头。","「结束了？」","我这样一问，她便紧紧握住我的手。","见我没有回握住她，却也没有甩开她的手，她开口说：「还没。」","她没先问过我，就将我的连帽上衣袖子往上卷到手肘的位置。我默默盯着她，只见她将嘴唇贴在我的手臂内侧，用力地吸吮那里。","痛得像是被针刺到了一样。","仿佛有好几根针从她嘴唇抵着之处流入我的体内，照理来说根本没什么大不了的痛楚，却令人感到异常疼痛。那些针随着血液在体内流动，聚集到心脏，持续地刺着我的心。","嘴唇离开，稍微换了个位置，再度贴了上来。","果然依旧疼痛异常。","留下两个痕迹的仙台同学抬起头。","「这也是幸运魔法？」","我知道这不是幸运魔法。但我一问，她马上就回答：「是幸运魔法。」","留下痕迹的位置好烫。","她吻了其中一个痕迹，拉下我的袖子。","「这个幸运魔法真的有效吗？」","「有啊。相信我啦。」","「正因是仙台同学，我才没办法相信。」","我不认为马上就会消失的痕迹能当成幸运魔法。如果痕迹会一直残留到放榜的那天，我或许还会相信，然而它不可能过那么久都不消失。","「没问题啦。你偶尔也相信我一下嘛。」","仙台同学不负责任地说。","「我要是没考上，你要负责吗？」","「可以啊。」","「要怎么负责？」","「给你决定。」","仙台同学每次都不自己做决定。","总是把一切都丢给我。","不过她这话八成只是在开玩笑，不是认真的，所以认真去想她要怎么负起责任也很蠢。就因为跟她认真也没意义，我决定结束这段休息时间，重新握起笔。她却抢走我手里的笔。","「干嘛？幸运魔法已经施完了吧？」","「还没完。还有。」","这么说完后，她的指尖爬上我的唇瓣。","「你现在要做的事情，绝对不是幸运魔法吧？」","我抓住她的手腕，拉开她的手。","「是幸运魔法啦。」","「你根本只是想接吻嘛。」","「……」","她既没有肯定，也没有否定我的话。因为她就这么默默地伸手过来，想碰我的嘴唇，我推开她的身体。","「宫城。」","叫了我的名字之后，我明明没说她可以继续施幸运魔法，她却把脸凑了过来。所以我也把脸凑过去，用额头撞了她的额头。","脑袋里响起一声沉闷的「咚」。","「好痛！」","仙台同学大叫一声，按住额头。","我当然也按着自己的额头。","「宫城是笨蛋吗？很痛耶。」","「是仙台同学不好，我也很痛啊。」","我没打算用力撞她。","额头却比想像中还痛。","「要是你因为刚刚撞那一下，把记起来的东西全忘了，也不关我的事喔。」","「就算忘了，我接下来还会继续念书，所以没差。还有，直到考完试为止，我不会再跟你见面。」","「咦？这是怎样？你想整我吗？」","「不是。」","我不认为不找她过来算是在整她，也不是刚刚才临时决定在考完所有考试之前不和她见面。这是我从昨天就在思考的事。","「你说到考完所有考试为止……但有不少考试吧？」","「是没错。我会念书的。」","「不一起念吗？」","仙台同学以有些低沉的语气问道。","「我自己念。仙台同学也要考试吧？」","倒不是说跟她在一起就不能念书，只要问她问题，她都会教我，也比独自念书开心。但我现在想尽可能地去做自己办得到的事。","「……我知道了。毕竟我们都得认真念书才行。」","她露出意兴阑珊的表情，阖上我摊开在桌上的参考书，以及笔记本，连笔跟橡皮擦都收进了铅笔盒里。","「仙台同学，我正打算要继续念书耶。」","我打开被阖上的参考书和笔记本，可是她又阖上了它们。","「我说宫城——」","我没有回应。","不想回应故意妨碍我的仙台同学。","「不要命令我施幸运魔法，命令我吻你啦。」","仙台同学握住我的手。","「不要。」","「我们会有一阵子见不到面耶。」","「所以呢？」","「宫城不想接吻吗？」","「不接吻也无所谓。」","「是喔？」","一脸无趣地说完后，她放开我的手，身体靠到床上，接着就没再多说些什么了。她平常明明会逼得我不得不命令她，今天却意外干脆地放弃，感觉很诡异。所以我才会主动说出这种话。","「——那么想接吻的话，你就吻啊。」","「这是命令？」","「你希望我命令你吧？」","她没有回答。","相对地，她离开靠着的床舖，把脸往我的方向凑过来。","比起嘴唇，她的手先触碰到了我的脸颊，温柔地抚摸着。","我和仙台同学对上眼。","即使直直回望着她，她也不肯闭上眼睛。我先闭上眼睛之后，嘴唇上传来触感。","总觉得这是个久违的吻。","比起抚摸着脸颊的手，柔软的唇瓣更舒服。","她很快就退开，打算再吻我一次，所以我推了她的肩膀。","「宫城。」","「就这样，结束了。」","我简短地宣告，用力握住自己的手臂。","而仙台同学打开了阖上的参考书和笔记本。","〔本话含插图〕"]},{"t":"第8话　我和宫城剩下的时间","p":["在考试结束前不见面。","提出这个恰当且认真的提案的宫城已经全都考完了，正在房间里懒散地滚来滚去。我和她都已经考完所有需要参加的考试，尽管还不知道结果，不过该做的事情都做完了，至少在心情上可以得到解脱。不过都怪我一见面就问她考得好不好，她的心情很差。","我一见面就知道她不希望被我问起这件事，却仍忍不住想问。","果然不该带来。","我从平常固定坐的位置，望着里头装有巧克力的包包。","在她叫我过来的前一刻，我还在犹豫要不要带来的巧克力，完全失去了拿给她的时机，躺在包包里头没办法出来","躺在床上的她心情非常恶劣，没人会想在这个情况下把巧克力拿给她。而且还要再过一阵子才是情人节，让我更不方便给她巧克力了。不仅如此，我依旧不知道她到底考得怎样。由于不晓得随兴的她什么时候才会再叫我过来，我才会把巧克力带来，想说在能见到面的时候先拿给她。但这或许是个错误的决定。","今年跟去年不同，甚至让人怀念起不用想那么多就能把巧克力送给她的去年。","进入自由到校期间，没有再去学校这件事，为巧克力增添了不必要的沉重意义。去年我是因为要做送给羽美奈她们的巧克力，顺便做了宫城的那份，今年却变得像是特地为了她而做的。","参加季节性活动。","这不算是我的行事准则，不过只要跟朋友在一起就会参加，所以情人节我会跟朋友交换巧克力。","今天也一样。","去年宫城虽然说不会跟朋友交换巧克力，我还是想给她——即使距离情人节还早，我仍打算这么做。可是一旦没有要给朋友巧克力，「顺便」给她的藉口，总觉得很难拿给她。追根究柢，宫城并非我的朋友，所以巧克力感觉会在没有出场机会的情况下，就这样结束它的一生。","我站起来，走到书柜前。","伸手摸摸被她放在漫画前的黑猫，正在看有没有增加什么新书时，身后传来她的声音。","「仙台同学，这个你拿去。」","我转过头看向宫城，只见她不知何时爬下床，拿着一个系有缎带的盒子站在那里。她手上的盒子不算大。","「那个是……」","我没有拿漫画就回到桌子前。她用简直像是要硬塞给我的方式，把红色的盒子拿给我。","「我去买东西的时候刚好看到，就买了。」","我盯着来到手中的盒子，一边坐下。","这个盒子不管从哪个角度来看，都加上了情人节用的包装，上面甚至还有品牌名称。里头的内容物无论怎么想都是巧克力。可是她根本不可能送我巧克力。","「……不是饿一食之日吗？」","她去年是这样称呼情人节的。","我记得很清楚。","这样一想，盒子里的内容物就算是紧急粮食也没什么好奇怪的。","我看着坐在身旁的她。","她脸上挂着比平常更不高兴一些的表情。","「去年不是仙台同学叫我别说那种不受欢迎的男生才会说的话吗？不要就还我。」","从她的发言，可以确定盒子里头的东西是巧克力。","「我要，谢谢你。另外我也有准备。」","我急忙打开包包，从里头抽出装着巧克力的盒子。","现在是我唯一能给她的机会了。","「来。虽然早了点，不过这是宫城的份。我自己做的。」","我把以浅粉红色包装纸包好的盒子递给她。即使这完全称不上是什么聪明的方法，但我也没有余力装模作样了。","「明明没去学校，你还特地做给茨木同学她们啊？」","大概是因为我的讲法听起来像是还有其他人的份，宫城创造出不存在的事实，看着我。","「嗯，是啊。你可以打开。我也可以打开吗？」","我反射性地撒了不必要的谎。","不知道为什么，我很难说出自己不是顺便，而是只做给了她这件事。","「随你高兴。」","她冷淡地说，开始拆起我给她的盒子外层的包装纸。我也不想弄破，小心翼翼地撕开包装纸，打开盒子，里头装着六颗巧克力。","跟我去年送给她的巧克力数量一样。","我不认为她是记得这件事，才故意买了同样数量的巧克力，感觉只是巧合。不过从白色情人节也死都不会回礼的她手里，收到跟我去年给她的巧克力同样数量的巧克力，依旧是很让人高兴的一件事。","可以的话，希望宫城能用更愉快一点的心情给我巧克力。不过要是真的发生那种事，明天一定是世界末日。","「对了，要像去年一样喂你吃吗？」","我指着送给她的巧克力。","她拿着的巧克力跟去年同样是松露巧克力，数量也一样。我曾想过要做不一样的东西，不过送她精心制作的巧克力有种小题大作的感觉，最后就放弃了。","「不用，我自己吃。」","她拿起上面撒满糖粉的白色巧克力，随即一口吃下了我特地做得比较小，方便食用的巧克力。","表情没变。","也没有说感想，所以我无从得知她觉得好不好吃。","她的指尖看似犹豫着该不该再拿一颗巧克力而动了动，随即从鳄鱼背上抽出一张面纸。","「好吃吗？」","我询问正在擦指尖的她，她小声地回了个：「嗯。」","「……谢谢。」","虽然去年宫城也有向我道谢，我依旧松了口气。毕竟比起不好吃，还是希望能听到她说好吃，听到她道谢也很让人高兴。尽管正确来说，她说的并非「好吃」而是「嗯」，不过我也没期望能直接从她口中听到赞美。","「仙台同学不吃吗？」","「我要吃。」","「那你把那个给我。」","她指着我面前的巧克力。","「这是命令？」","「命令。」","「应该不是要我还给你吧？」","虽然觉得不至于，不过还是问一下。","「我没说那种话。」","她的否定让我放下心来，乖乖把整盒巧克力交给她。","「张开嘴巴。」","宫城拿起一块方形的巧克力说道。","「……这是怎样？」","身体反射性地往后退。","我猜她是打算喂我吃巧克力。","可是这件事情本身就很奇怪。","她不可能单纯只是要喂我。","宫城喂我吃某个东西——","过去也曾发生过这种事，但在我的记忆里都不是什么好事。光是她为我准备巧克力就已经够不可思议了，总觉得她不可能只是想喂我吃巧克力。","由于宫城不惜提出命令也要喂我吃，背后一定有鬼。不做奇怪事情的她根本就不是她。","「你要自己吃的话就算了。」","粗鲁地说完后，她作势要把拿着的巧克力放回盒里。我连忙抓住她的手。","「对不起。喂我吃啦。」","虽然很在意喂食这个行为附加了什么客制化选项，不过基于命令发生的事情不管有多不愉快，我终究得照单全收，因此在意也没用。","「那么，嘴巴。」","她省略了张开这个指示，但我老实地张嘴。方形的巧克力逐渐靠近，很快就连着手指一同被推进我的嘴里。她的手指碰到我的舌头。或许是巧克力因为体温而融化了吧，她的指尖好甜。我在咬下巧克力的同时一并咬了她的手指，她随即抽出手。","口中只剩下巧克力。","不太甜也不苦。","我看着宫城。","既没有散发出想做什么奇怪事情的气息，也不像要再拿起一块巧克力的样子。命令的内容如她所言，似乎没有什么客制化选项。","「好吃吗？」","她说出我方才说过的话，用面纸擦拭手指。","「你要试试味道吗？」","巧克力很好吃。","但我不想用话语来说明。","「不用，那是要给你的东西。」","「你别在意啦。」","我抓住她的手臂。","轻轻拉动后，她皱起眉头，却什么都没说。我就这样把她拉了过来，与她双唇交叠。","最后一次接吻，是在我第二次为宫城施幸运魔法的那天。","在那之后，我们一直没有见面。","会这么轻易地让我吻她，也许是因为中间隔了一段时间。","我用舌头撬开她紧闭的双唇。","她抓住我的手臂，却没有抵抗。尽管称不上积极，但她允许我进入她的嘴里。平常她早就会生气地说「这样根本不是在试味道」了，然而今天的她相当温柔，甚至使人有些不安，却也不想让嘴唇离开她，于是碰触着她的舌头。","即使戳戳她的舌尖也没有反应。用抵上去的感觉缠绕着她的舌头后，她更用力地抓住我的手臂。从湿滑的舌头上传来她的体温。","那温度比手更热，令人心跳加速。","和宫城的吻一直都很甜。","不知道是她给我的巧克力，还是我给她的巧克力造成的，感觉很甜。说不定跟巧克力根本无关，总之就是很甜，让人想更深入地触碰她。","犹如激烈地缠上她般深吻。","既火热又甜美，好难受。","没办法好好呼吸，我让嘴唇离开。","真要说起来，这比较像是我品尝了宫城。我想她果然还是会生气。","「这样根本感觉不出是什么味道嘛。」","她推了我的肩膀一把，和我拉开距离。","「那只要继续下去，直到你知道是什么味道就好了。」","「我自己吃比较快。」","她似乎没生气。然而以低沉的语气说完后，她把手伸向应该已经属于我的盒子。我在她拿起巧克力前抓住她的手腕，用力一拉。","「仙台同学。」","尽管语气听起来很不高兴，她却没叫我住手，所以我不客气地又吻了她。这次她双唇微张，我的舌头轻易地闯入其中。","果然很甜。","我不知这是什么的甜味，然而她就是很甜。让人想要更多，将舌头更深地探入她口中。","她的手抓住我的肩膀。","指尖陷入皮肉中，很痛。","平常一定会推开我的她没有这么做，让人很在意，稍微退开身体。","「你今天不生气啊？」","听我这样一问，宫城又皱起了眉头。","「既然知道我会生气，就别这样做啦。」","她口吐怨言。","可是没有生气。","明天就是世界末日。","电视上要是播出这样的新闻，我会毫不怀疑地相信。","宫城的表现就是这么不对劲。","在交换巧克力之后，她又叫我过去了好几次，不但没有生气，也没下什么奇怪的命令。虽然不到心情好的程度，可是她说了不少话，也愿意让我吻她。","这样的她怎么可能存在？","我待在自己这个跟宫城的房间相比，感觉很不自在的房间里，仰望着天花板。","仔细想想，无论是不生气或愿意开口说话，作为一个人来说都是很普通的事。基本上就算只是点头之交，人也会用平静的态度和对方相处。所以我想现在的宫城是个正常的人。我最近看到的她，恐怕是跟宇都宫她们在一起时的她吧。","看到这样的她却会感到不安，说不定我才是那个不对劲的人。","我靠着床舖，望向放在五斗柜上的存钱筒。","存在里面的五千圆纸钞。","我不知道到底存了几张，不过脑中瞬间闪过「如果没有那个」的想法。如果没有五千圆的交易，我就不会跟宫城变得亲近起来，也不会像这样想着她。如此一来，应该就能专心想着自己的事，等待毕业了。","有够麻烦的。","无论是我还是宫城，一切都很烦。","「能和她聊很多事情很开心」也好，「她没对我下奇怪的命令，真是太好了」也罢。","倘若能不去深究原因，单纯地为此感到高兴就好了。但现在我反而觉得她越是温柔，在那之后等待我的便越会是不好的结果。","回顾过往，不同于平常的她从未给我留下什么美好的回忆。","所以我会想怀疑她的行动，觉得这一切的背后都是有原因的。","如果我是宇都宫，想必就能接受现在的宫城，不会怀疑她吧？看到心情不再恶劣，变得多话的她，也会觉得她应该愿意取消以毕业典礼为关系划下句点的约定，为此感到高兴。","可是我办不到。","我不认为宫城讨厌我。","她要是讨厌我，就不会让我吻她、碰她的身体。然而她既像是接受了我，又像是没有接受。我不知道她是基于什么原因才装出这副温柔的样子，却觉得自己越是希望她能撤销那个约定，她就越会给出一个不同的答案。","真要说起来，明明放榜了，她却连个联络都没有。","我把自己上榜的事情告诉了她。","也从她那边得到了一句恭喜。","不过她无视于要告知结果的约定，没有联络我。尽管并不是毫无手段能知道她有没有考上，但我乖乖地在等，所以她应该要早点告诉我才对。","考上了。","没考上。","这么简短也无所谓，总之应该传个讯息给我吧。","「赶快跟我联络啦。」","我在心里又补上了一句「笨蛋」，站起身来。","跳上床，闭上双眼。","时间才刚过九点，要睡觉未免太早。","而且我也还没洗澡。","「唉」地呼出一口气后，手机铃声在耳边响起。我看了看萤幕。","「……宫城。」","她在刚好到让人忍不住要怀疑她是不是有在窃听的时机打来，害我反射性地坐了起来。","「应该不会没考上大学吧？」","我深吸一口气，再吐出来。","马上想到不好的结果让我有些罪恶感。不过这都是因为她没明确地告诉我考得怎么样，实在不能怪我。","「喂？」","我用不算开朗也不阴沉的语气对着手机那头说话后，宫城的声音取代不知道响了几声的来电铃声，传了过来。","『考上了。』","「咦？」","『我跟舞香考上同一所大学了。报告结束。』","「咦？啊，考上了啊。那……」","宫城让人等了老半天，报告却这么干脆，害我没办法顺畅地说出想说的话。","——那你会和宇都宫去念同一所大学吗？还是不会？","虽然彼此没约好要告诉我这件事，但我想知道。可是在我问她要选哪一边之前，她就先开口了。","『另外，我有一部想看的电影。』","「电影？」","这句跟大学无关的话来得实在太过突然，使我本来该说出口的话变成别的东西。当我意识到自己甚至忘记恭喜她考上时，手机那头传来她说「对」的声音。","情绪追不上以我从未想过的速度改变方向的话题。她不仅沉默不语，考上大学了也没表现出开心的样子。拜此之赐，我说不出刚才忘记说的恭喜。","宫城这个人总是这样。","都没在考虑别人，自己说完想说的事情就不说话了。","我老是被她的感情给耍得团团转，即使如此，却仍无法不去顾虑她。尽管觉得自己扮演着吃亏的角色，但又无法抛下这角色，现在也在思考该怎么跟她搭话。","『就这样。』","她小声地说。","然而我知道不只是这样。接下来的话大概得由我说出口才行。","「你该不会是要约我去看电影吧？」","『你不想去的话就算了。』","「你打算哪天去看？」","宫城以意兴阑珊的语气，说出应该是她事先决定好的日期。","时机真不凑巧。","「我是想去，但那天刚好有事。可以稍微提前或延后吗？」","她在手机的另一头『嗯～』地沉思着。","虽然考上大学的报告在不知不觉间变成讨论要去看电影的事，然而现在把话题拉回去，可以想见去看电影的事便会化为乌有。既然如此，电影的优先度自然提高了。","大学的事情还是当面聊比较好。","现在急着问她，结果听到了不好的回答，也很让人伤脑筋。","『那提前好了。明天呢？』","我回答：「可以啊。」她便指定好碰面的时间与地点，跟我们暑假一起去看电影时相约的时间地点一样，让人心里有些躁动不安。","无论是宫城主动约我去看电影，还是特地指定跟暑假时同样的时间地点，都让人觉得很不对劲。在我总觉得不太安心，想问她原因之际，她喊了一声：『仙台同学——』","「什么事？」","『你说有事是什么事？』","「毕竟大学已经确定下来了，要去看房子。」","我要一个人搬出去住。","我早就决定如果考上想念的大学就要这么做，所以得去找房子。虽然也可以等到春假期间再去，不过我在补习班听说想找房子还是趁早去比较好。","「宫城打算怎么办？」","『什么怎么办？』","「你如果要去念那边的大学，就得去找房子吧？」","我装作顺口提起大学的事。","只问这个的话应该不会有问题。","『我搞不好会留在这里啊。』","「那假设你要去呢？」","『……去住宿舍。』","「你没办法跟其他人一起生活吧？」","『毕竟爸爸很忙，没空陪我去看房子啊。要是真的没办法住宿舍，到时候再想办法。』","宫城讲得像是都已经决定好了。从那毫不迟疑的回答中，可以感觉到她的心意已大致底定。她想必会跟宇都宫念同一所大学，也真的会去住宿舍吧。但要是再追问下去，她肯定会说自己死都不去念。","「你做事真的很随便耶，虽然是无所谓啦。是说你要看哪部电影？」","『仙台同学想看什么？』","「不是你说有想看的电影吗？」","这我就不得不追问了。","她的发言跟先前的说词有所出入。","『只是加减问一下而已。明天你可别忘了喔。晚安。』","手机那头传来她冷淡的声音，接着没等我回话就挂断了电话。","说完想说的事情就挂电话。","宫城果然还是宫城嘛。","虽然她最近确实表现得很不对劲，今天也很不对劲。","不过自己想干嘛就干嘛这点，还是跟平常的她一样。","由各种不对劲的她身上散发出的讨厌预感，跟从说要住宿舍的她语气中感觉到的美好预感混合交杂。","我将手机放在枕边。","闭上眼睛，思考明天的事。","看完电影之后……","大学你打算怎么办？","而在毕业典礼之后，我们会变得怎么样？我要问宫城这些问题。","我不知道她是否愿意说出我期望的答案，也没有自信，却不能不问。","我睁开眼睛，大叹一口气。","还没决定好明天要穿的衣服。","我在脑中试着用自己现有的服装做搭配。","暑假和宫城去看电影时，我很犹豫要穿什么去。","总觉得这次应该也很难做出决定。","她会犹豫吗？","我又大叹了一口气。","到片尾名单大约两小时。","我一直看到最后，才和宫城起身离席。","重新整理好裙子，走出影厅。","如果对象是羽美奈或麻理子，一定会觉得片尾名单是额外的要素，在电影本篇结束后就立刻站起来。一旦跟她们看电影，就得配合她们起身，所以我不是很想跟她们一起看电影。","可是宫城会坐到影厅内亮灯为止。我们暑假去看电影的时候，她也一直坐到了最后。尽管个性与嗜好完全不同，在这方面我们倒是很合得来。","即使羽美奈和麻理子有些地方跟我不合，一致的部分依旧比宫城多。要找出我和她的相似点明明算是一件困难的事，我却觉得跟她在一起比较开心，才会让人感到很不可思议。","「你觉得好看吗？」","在我们走出电影院时，她开口问我。","「宫城觉得呢？」","「满好看的。」","「我也觉得。我看过的动作片虽然不多，不过这种片也不错呢。」","尽管是宫城说有想看的电影，但结果到了今天，她仍没说是哪部电影，于是我们没来由地看了蔚为话题的动作片。其实我也可以选择看恐怖片，但是她会怕，所以我从候选名单中排除了恐怖片。总觉得她应该要称赞我才对。","「要去吃点什么吗？」","我配合她的步调走在身旁，开口询问。","今天的目的是看电影，其他都没有决定。","但是我有话要对她说。倒不是有什么想吃的东西，却想找个能坐着说话的地方进去。虽然我也觉得如果表示有话要跟她说，她会逃走，但我已经决定要跟她谈谈了。","「我要回去了。」","「咦？已经要回去了？」","我看着她。","她今天穿得不像是看完电影就要直接回家的样子。","说得清楚易懂一点，就是她今天难得有打扮。尽管没有化妆，却穿着花色可爱的裙子，以及我从没看过的大衣。","跟暑假来看电影时那身休闲的打扮不同。","所以我以为她看完电影之后，会愿意再跟我去其他地方。认为这跟说好的不一样是我一厢情愿的想法，但她要是就这样回去，那就让人伤脑筋了。","「我又没有其他想去的地方。仙台同学还有空吗？」","「有。」","「那来我家吧。」","说完之后，宫城抓起我的手往前走，抓的方式明显地和平常不一样，力道很轻。那种不带强硬的感觉，温柔地触碰着我的方式，简单来说就是牵着我的手在走路。","以过去的她来看，我简直无法想像她会做出这种事。","没错，绝对不可能。","太过自然地牵起的手实在太不自然，让我直盯着她的脸。","「干嘛？」","身旁传来她不带起伏的声音。","即使我们牵着手，擦身而过的行人们也毫不在意。不过就算是我，看到有不认识的人牵手走在路上，同样不会特别留意——我想大概就是这么回事吧。所以我不在意别人的眼光，却很在意她在想些什么。","「宫城，你这只手是？」","我轻轻握住她牵着我的手。","「放开比较好吗？」","「我不介意就这样牵着，但这是为什么？」","「反正再过几天就是毕业典礼了，被人看到也没关系。」","宫城说出平常绝对不会说的话。","毕业典礼确实快到了。","等我找好房子回来，再过几天就是毕业典礼。一旦毕业后，我们只能在放学后见面，或是在学校不准和对方说话……这些规则都将变得无关紧要。我的确觉得即使提前打破规则也没什么大不了，然而刚刚这话并不像是她会说的台词。","「这向来是我的台词吧？宫城平常根本不会说这种话啊。」","我同样很在意她为什么不顾夏天来看电影的时候，被羽美奈撞见我们走在一起的事，依旧选了这个地方，但更在意她的台词。","「那我要放手了。」","「咦？等一下啦。」","宫城试图放开手，我连忙用力握紧，不让她的手溜掉。那只平常就算我握住也会硬是抽走的手马上安分了下来。","「去我家可以吧？」","不可以。","即使我这么说，今天的宫城大概也不会听取意见。反正只要能跟她谈谈，我并不介意地点，既然如此，答案就只有一个。我回答：「可以啊。」","她没有放开手。","我们边走边断断续续地进行称不上对话的对话。穿过车站的剪票口，和夏天时一样，两人一起搭上电车。经过几站之后下了电车。","尽管二月的城镇里仍有些寒意，我们还是缓缓地走在路上。","正等待春天到来的橱窗逐渐变得缤纷亮丽，天空也很明亮。我和宫城依然牵着手。顺利考上大学，跟在一起很开心的对象去看了一部好看的电影……明明是个感觉接下来只会发生好事的日子，我心中却丝毫不觉得雀跃。","要是在迈入冬天之前就有这样的日子该有多好？","假如是发生在去年夏天，我觉得自己应该会开心得想要小跳步。","但现在是距离夏天十分遥远的冬天。","我们走在路上，通往两人悠哉地度过漫长时光的房间。","靠近住宅大楼时，她放开了手。","加快脚步，走在比我前面一点的位置。","不是制服的裙子映入眼帘。","我可以清楚看见曾经舔过好几次的脚。","这么说来，最近宫城都没有命令我舔她的脚。","我想不起最后一次做这件事的日子是哪一天。倒不是想舔她的脚，只是觉得她要是能变回会下这种命令的她就好了。","我们穿过大厅，搭乘电梯来到六楼。","一起走到玄关前，宫城打开门锁。","开门走进屋里。","她先脱了鞋子。","同样脱下鞋子的我追在她身后，她却在房间前拿走了我的包包。","「仙台同学。」","她理所当然地松手，让我的包包掉在走廊上。","包包里没放什么会摔坏的东西，但我还是不太高兴，打算捡起掉在地上的包包。可是在我的手碰到包包之前，她先抓住了我的手臂。","「喂。」","我抬起头看向她。她拉扯我的手臂。","在我开口抱怨之前，她的脸就凑近过来，碰上了我的嘴唇。","我们接吻过很多次。","宫城却几乎没有主动吻过我。","——除了暑假之外。","夏天一起去看过电影后，她就变得会主动吻我了。那是很短的一段期间，彼此之间也依然存在着五千圆。然而当时，我觉得我们的关系有了些变化。","现在，我也不讨厌她主动吻我。","嘴唇很柔软，感觉很舒服。","我将她的身体拉向自己。","双方的距离变得比刚才更贴近，但是她马上从我身上退开。","「这里是走廊。」","我不知道该对不像宫城的宫城说些什么才好，只好说出这句无聊的话。","「又没人在。」","她嘀咕着。","我从没在这个家里看过她以外的人。","没人在成了理所当然的事。就算她不说，我也不觉得会有其他人在，所以其实不担心这点。要说担心什么，就是她在不是房间的这个地方，做出了打从暑假结束后就几乎没做过的事情。","今天的宫城像是在重现那个暑假。","「为什么？」","我有好多想问的事，可是还没问出口就放弃了。","她的手轻柔地触碰我的脸颊。","指尖抚过我的嘴唇，她又一次地吻了我。","相触的柔软唇瓣令我脑中浮现出不好的消息。","世界末日要到了。","不对，世界不会步向终点，然而我们的关系或许会告终。","我不认为这个吻是她期望的吻。","想接吻、想触碰对方的人都是我，不是她。今天的她只是在做我之前所期望的那些事情而已。","我主动退开脸。","「你还没下今天的命令。」","得赶快让她变回平常的她才行。","无论是牵手或接吻，我都只觉得是宫城用来划下句点的仪式。","暑假时我们之所以会跟今天一样去看电影，是为了测试能不能成为朋友。那一天，她选择不和我当朋友，我也接受了她的选择。","今天虽然没有和暑假时的情形完全一致，但我不认为她会毫无意义地重现暑假那天所发生的事情。","「我没有给你五千圆。」","「那种事情不重要，快命令我啦。」","我想赶快将暑假跟今天切割开来。","「那你只要乖乖别动就好了。」","她下了个无聊的命令。","这不是我所期望发生的事。","她应该下一些更不讲理的命令。","比方说要我舔她的脚。","可是她下了无聊的命令，理所当然地把脸凑上来，接着动作自然到让人觉得不自然地吻了我。","她的嘴唇有着跟我吻她时相同的柔软和温度，体温交融的感觉无论何时都是那么地舒适。可以的话，真想就这样继续跟她接吻下去。","但是别接吻比较好。","今天的吻背后想必有什么原因，我想知道那个原因，希望宫城能否定我的想法，说这不是用来划下句点的仪式。","我缓缓推开她的肩膀。","「我说啊，你最近是怎么了？感觉不太对劲耶。」","我捡起就那样掉在地上的包包，看着她。","「你平常不是很想接吻吗？」","「是这样没错。」","「现在不想吗？」","「想。想是想……可是这是怎样？」","「怎样是指？」","「……意思是叫你告诉我，为什么要做会让我高兴的事？」","「我又不是故意要讨你欢心。」","「那这是怎样？」","她没有回答我的问题。","看似在思考些什么，陷入了沉默。","我觉得要是一直沉默下去，宫城会说出不好的话，于是决定先询问我事先打算在今天跟她谈的事。","「不想回答就算了。不过我接下来要问的事情，你要好好回答。」","我有准备好的问题。","然而在问出口之前，她便抢先发言。","「关于大学，我会跟舞香念同一所学校。」","冷淡的声音回答了我原本想问的问题，而且是我所期望的答案。","「那——」","她夺走了我要说的话。","说得更清楚一点，是她犹如要封住我的嘴似的吻了我。","她用力抓住我的手臂，刚捡起来的包包再度掉到地上。","在毕业典礼后这段关系就要告一段落的约定，现在怎么样了？","我原本要说出口的话被宫城给吞了下去。","有个柔软却带着些许硬度的东西碰上我的嘴唇。感觉到那东西轻轻地抵上来，我张开嘴唇，她随即难得主动地把舌头伸了进来，舌尖触碰着我。她更用力地抓紧我的手臂。","而我主动把舌头缠上去之后，她的手更用力了。","我曾经想过，如果宫城不要总爱唱反调，像这个样子就好了。不过只是想想而已，我上了大学之后还想见的她，不是这样的她。","我推开她紧紧贴上来的身体。","「你不用勉强自己。」","平常的她比较好。","要跟我谈论毕业典礼后该怎么办的对象，不是平常的她就没有意义了。","「我没有勉强自己。」","她触碰我的脖子。","指尖徐徐抚过我的后颈，拎起吊坠的链条，然后就这么顺势把它从衣服里拉了出来。","「毕业典礼结束后我有话要跟你说，这个你别忘了带过来。」","这么说完后，她用力地拉了一下坠饰。","好痛。","方才一直被她抓着的手臂，还有遭链条勒住的脖子都痛得不得了。","「你今天先回去吧。」","她说完这句话，捡起我掉在地上的包包。","「拿去。」","宫城以塞进我怀里的方式把包包递给我。","「宫城下次什么时候会叫我过来？」","「下次是毕业典礼后。在那之前我不会找你过来，所以你绝对不能忘记，要来喔。」","她再三叮咛地说道，拉起我的手臂，力道毫不留情。我就这样被她从玄关赶了出去。","大门「砰」的一声关上。","平常都会送我到楼下的她没有要送我下楼。","这种时候通常不会发生什么好事。","我敲了一下阻隔着我的大门。","门没有打开，也没听到宫城的声音。","我握紧拳头。","却没有再敲门，而是朝着电梯走去。","〔本话含插图〕"]},{"t":"第9话　和仙台同学在毕业典礼之后","p":["虽说是毕业典礼的早晨，但也不会发生什么特别的事。","这我知道。","说不定仙台同学会跑来堵我。","我曾想过这件事。不过走出住宅大楼后，她并没有出现在那里等我。只是因为她以前曾经直接跑到我家来，我才想说今天说不定会发生同样的事情。毕竟我一再无视她传来好几次的讯息，她搞不好已经不想理会我这个人了。","反正我也没特别期待她来，真的来了也很让人困扰。","我一如往常地走在平常去学校的路上。","一旦抵达学校，我穿着制服走在这条路上的机会就只剩下一次——只有在毕业典礼结束后走回家的那一次——这么一想便觉得有些寂寞。","无论什么事情，到了最后总是令人感伤。","我穿过以三月的早晨来说算是温暖的城镇，朝着学校前进。","天气很好，我应该要感到愉悦才对，脚步却很沉重。制服感觉也很重，拖慢了步调，我必然走得比平常更为缓慢。","就算走得很慢，学校依旧不会消失，毕业典礼也不会取消。而我跟仙台同学的约定更不会就此不存在。","我就这样无精打采地踏进校内，爬上楼梯。","我走在走廊上时，仙台同学从吵吵闹闹的隔壁班上走了出来。","她的制服穿得就像毕业典礼早上该有的样子，衬衫最上面的一颗扣子扣了起来，领带也系得好好的——那是今天结束后，我便再也看不到的打扮。我并非想把她的这副模样深深烙印在眼底，但视线仍牢牢地盯着她。","明明不能出声叫她，却想找她说话。","仙台同学。","我好想叫她。我曾叫过无数次那个名字，在学校却叫不出声。","就这样卡在喉咙里。","被人看到也没关系。","一起去看电影的那天，我虽然对她这么说，但我们应该要遵守约定才对。要是我跟她一直以来都有遵守约定，照理来说现在就不会觉得这么郁闷了。","我打算从仙台同学身上转开视线。","可是在瞥开目光之前，她先发现了我。","她微微张嘴。","我聚精会神地竖起耳朵，想排除走廊上那些此起彼落，不属于她的声音。然而不知何时跑出来的茨木同学拉走她，声音在成形之前就消散了，身影也随之消失在教室里。","我连叹气都叹不出来。","明明已经决定好答案了，然而一看到她，我又差点要犹豫起来。","在关于考试的一切都结束后，我就一直在思考毕业典礼之后该怎么办。老实说我觉得去思考这件事本身相当奇怪。我早已决定这就是最后，也把这个决定告诉她了。","约定不是用来打破，而是必须遵守的存在。","心里明明是这样想的，我却犹豫了很久。","我经过仙台同学已然不在的走廊，踏进了教室，把书包放到自己的座位上后，走去舞香的位子。","我不太喜欢感伤的气氛，不过变成要独留在此的亚美从毕业典礼开始前就在哭了。舞香正致力于安抚亚美。","我的腿和制服果然都很沉重。","要动起来好麻烦。","我想办法动了动嘴，向她们道早安，然后看着亚美，出声问她：「你还好吧？」","「志绪理～！」","哭得鼻头红通通的亚美，用仿佛世界末日即将到来的语气喊着我的名字，过来抱住我。","「我要是也跟你们两个考同一所大学就好了。不要抛下我啦～」","「又不是以后再也见不到面了，你太夸张了啦。」","这么说的我，轻轻拍着亚美的背安抚她。","「可是……」","抽抽搭搭地哭个没停的亚美，讲话有着很重的鼻音。","我一边温柔地拍着她的背，一边对她说「我们随时都能见面」、「暑假再一起去玩」之类的话。","在这段时间里，我的脑中也全是仙台同学，不禁觉得自己真是个无情的人，却也很想处理一下从考完试之后就一直在想着她的自己。","「亚美，你再继续哭下去，脸会变得很不上相喔。」","舞香拍了拍亚美的肩膀。","哭得像个孩子的亚美放开我，回说：「我知道。」同时用手帕按着眼睛。我不知道她是从什么时候开始哭的，但她的眼睛确实快肿起来了。接下来明明还有毕业典礼要参加，她的脸却已经哭花了。","「志绪理也是。」","舞香这么说完后，递了一包面纸给我。","「我没哭。」","「是没有，可是看起来快哭了啊。」","「真的耶。」","亚美边哭边笑地看着我。","讲成这样可真让人意外。","我还没哭呢。","把面纸还给舞香的我揉了揉眼睛。","今天没什么难过到需要哭的事情。","虽然和亚美上了不同大学，却非再也见不到面。而我跟舞香往后同样能继续待在一起。","——再也见不到面的只有仙台同学而已。","今天结束之后，我们的关系便会跟着结束，再也不会见面。","所以我才会想在毕业典礼到来前留下一点点回忆。我原本不想跟她做些会在月历上留下记号的行为，不过既然结束的日子快到了，就算多增加一些回忆也无所谓吧。","送情人节巧克力或一起去看电影，都不是什么大不了的事。即使做了些什么跟平常不一样的事，也马上就会忘记了。","记忆并非会持续残留下来的存在。","迟早会变淡，甚至有可能消失。","就连短短一年前的事，有些都已经忘了。","我不知道要经过多久，高中时的记忆才会变淡，但只要不去回想，理论上应该不用花上多少时间便会消失了。","但我现在很后悔当初觉得可以多跟她留下一些回忆。","情人节巧克力的味道。","两人一起去看电影那天的吻。","我一再反复回想，回忆别说变淡了，反而变得更加深刻。","没办法顺利忘记。","理应只是少少的回忆，却比我原先所想的更为沉重。","「志绪理。」","舞香的声音将我拉回现实。","「你在哭。」","她拿着面纸的手伸过来，擦拭我的脸颊。","「……我自己擦。」","我打算用手擦掉脸颊上的眼泪，看着舞香。","她的眼神中没有要调侃我的意思。","我接过一张刚才觉得不需要而还给她的面纸。","「那个……舞香，谢谢你。」","「因为毕业典礼就快开始了嘛。」","舞香以温柔的语气说道。","「是啊。」亚美也带着鼻音应和她。","气氛逐渐变得感伤起来。舞香「啪」地拍了一下手。","「对了，在大学开学前，我们三个一起去哪里玩吧！」","「喔，好主意！」","亚美开朗的声音响起。","日期、时间，然后是地点。","三人一起讨论好之后又过了一阵子，老师走进教室。我们移动到体育馆，毕业典礼转眼间就开始了。","校长致词，以及来自校外的贵宾问候。","台上的人不断说着跟去年没什么差别的话。我虽然不觉得上头传来的致词内容会令人感动落泪，然而毕业典礼营造出一股明明很夸张，却又莫名地带着悲伤的气氛，使人泪腺不受控制。","我揉揉眼睛，寻找仙台同学。","却受到成群制服妨碍，看不清楚周遭。我低下头。","如果上了三年级，我还是跟她同班，会不会变得跟现在不一样呢？","如果上了三年级，我还是跟她同班，是不是就能相信她呢？","不可能成真的自己不断在脑中盘旋。","要是我打破规则，在大家面前找她说话，即使班级不同，也能变成跟现在不同的自己，相信她吗？","我再怎么想也想不出结果，找不到正确答案。","虽然根本不知道到底有没有正确答案。","我抬起头。","前任学生会长在台上致答词。","如果那是仙台同学，我就能清楚地看见她了。","我想着这种事，轻轻摇了摇头。","唱完骊歌，回到教室。","从老师手中接过毕业证书。","与舞香和亚美一起离开学校，聊了些和平常没什么不同的无聊话，跟她们道别。接着还过不到五分钟，我就听到身后传来声音。","「宫城——」","不用回头，我也知道那是仙台同学的声音。","我加快脚步。","「我说宫城！」","尽管声音从比刚才更靠近的地方传来，我依旧没有回头。","「志绪理！」","听到她大声地这样叫我，我不得已停下脚步。","回过头看着她。","「我不是说过很多次，不要叫我的名字了吗？」","「谁教宫城不转头看这边？」","仙台同学这么说，追了上来。","「我的确有叫你来我家没错，但没说要跟你一起回家吧？」","走到我身旁的她和早上不一样，解开了衬衫最上面的扣子，领带也松松的。","「你是没说，不过一起回去也没关系吧？」","「有关系。尽管不是在学校，然而不在这种地方和对方说话，也在我们约定好的范围之内啊。」","「反正毕业典礼都结束了，那种规则根本没差了吧？」","她说了很像她会说的话。","总是这么随便、轻佻。","就连毕业典礼这天也一模一样。","「有差。你从后面跟上来。」","「好。」","用听起来不像在说好的语气说完后，仙台同学立刻停下脚步，却又马上迈开步伐，走到我身旁。","「不是叫你从后面跟上来吗？」","「我是从后面跟上来啊。」","我瞪着看起来没有打算要听话的仙台同学。","「你仔细看好。」","耳边传来毫无反省之意的声音，我仔细看着仙台同学，她就走在真的只比我后面一点点的位置。","「不是这样。」","「就是这样啦。毕竟接下来也不能再穿着制服一起回家了啊。」","已经没有机会再穿上制服了。","也没有机会和她一起回家。","如此一想，总觉得好像可以同意她的说法。可是我不能接受。","「仙台同学——」","我停下脚步看着她。而明明刚经历过毕业典礼，却表现得跟平常完全一样的她也停下了脚步。","「干嘛？」","我已经决定今天要对她说了，我想她也知道我会说些什么。即使如此，她依旧没有露出悲伤的表情。我对连这种时候都一脸若无其事的她很不爽。","倒不是希望看到她哭或表现得很难过，只是希望她能换上一反平常的表情。","「仙台同学在毕业典礼上有哭吗？」","「没有。」","仙台同学咧嘴一笑。","我知道为什么自己一去思考未来的事，就会感到越来越不安。","即使往后也如眼下一般会跟她见面，但等到上了大学，状况依旧不可能会和现在完全相同。我会和她念不同的大学，过着不同的生活。这代表跟念同一所学校的现在不同，我们甚至不会在学校里遇见对方。即使会和她见面，也只是偶尔的事，我能得知的她就只有偶尔见到的部分。","而我想不管问她什么，她都只会像现在这样，表现得若无其事。","我如果说无法接受这样的她，她会露出怎样的表情呢？","总觉得不能接受有我不知道的仙台同学存在。","我在留下少许回忆的过程中所了解到的就是这件事。我想她一定不会接受这样的我，况且会对她产生这种想法的我也很不正常。","「宫城在毕业典礼的时候哭了吗？」","她以明天也会过着同样生活的语气问我。","「我怎么可能哭？」","把仙台同学关在某个地方这种事太不现实了，不可能办到。既然这样，还是遵照约定，把今天当成结束的日子比较好。","「这样啊。」","我们像看电影那天一样，一起朝着我家走去。","可是跟看电影那天不一样，我们没有牵着手。","「要去逛逛吗？」","仙台同学以一如往常的表情，指着位在车道对面的店家。","「不要。我要直接回家。」","「好。」","我加快脚步。","她理所当然地走在只比我后面一点点，根本已经可以说是我身旁的位置，无视我叫她从后面跟上来的发言。我不是很高兴，却没有改变步调，朝着家的方向前进。","聊不起来。","我们断断续续地说着一两句跟毕业典礼无关的话。","逐渐接近我家。","对话消失了。","我家不会变远，只要一步步地走，就会一步步地接近。","抵达住宅大楼，穿过大厅，搭上电梯，从六楼出来，一起走到家门前，打开门，在玄关脱下大衣。我先走进房间里打开空调，跟在身后的仙台同学解开了衬衫从上面数来的第二颗扣子，却没有脱下制服外套。","我看着她松垮的领带。","她在电梯里完全没开口说话，刚才默默地走过走廊，现在也沉默不语。脸上明明挂着跟平常没两样的表情，却有一点点跟平常不一样，害我静不下心来。","她坐到床舖前面平常坐的那个位置。","「我去拿点东西过来。」","我靠过去和她搭话后，她的神情看起来异常认真。","「等等再去就好。你有话要说吧？」","她的视线直直地盯着我。我无可奈何，只好坐在她的斜前方。","「坐我旁边啦。」","她不满地说。","「我坐这里就好。比起这个，你有带项链来吗？」","「与其说有带来，不如说我戴着。」","仙台同学稍微靠近我，解开扣子，拉开衬衫领口。","她的胸口稍微裸露而出，看得见银色的链条。","我今天没有给她五千圆，没有权力命令她给我看项链，她却毫无怨言地让我看了。或许是因为她也知道，今天是最后一天。","「那个还给我。」","「为什么？」","「毕竟命令已经过期失效了。」","我把项链拿给她时，曾命令「不管在学校或家里都得戴着」，当时应该也有讲明期限是「到毕业典礼为止」才对。她一直守着这个约定，不可能只忘记期限。","已经过期的命令，没有必要遵守。","项链是我给她的。既然已经用不上了，我应该有权收回那条项链。","「我想问一下当作参考，我还给你之后会怎样？」","「我会把项链丢掉，跟你就此结束。」","「结束是什么意思？」","她像是现在才第一次听说般，问起这个理论上她应该知道的事情。","「我不会再跟你见面。」","「你要是和宇都宫念同一所大学，我们随时都能见面耶。即使如此也一样？」","「我们一开始就约好只到毕业典礼啊。就算随时都能见面，我也不会跟你见面。把项链还我啦。」","「还给你的话，你会丢掉吧？未免太浪费了。」","真不干脆。","她应该早就知道我今天会说些什么了，我们也约好只到毕业典礼为止。尽管事先没有连要将项链还给我这件事都讲定，但这并非需要抗拒的事情。把这种宛如项圈的东西给丢掉，对她来说也是好事才对。","「一点都不浪费。还给我。」","我像是在催促她似的伸出手。","「你这个人真的很小气耶。」","这样说完后，仙台同学夸张地叹了口气。","随即缓缓地解开项链。","「拿去。」","她将项链放在桌上。","我把手伸向银色的项链，然而在碰到之前，仙台同学开了口：「不过在那之前——」","「我有东西想给你看，所以你等一下。」","「有东西想让我看？」","「没错。」","仙台同学一边说：「就是这个。」一边从书包里抽出某个东西，放到项链旁边。","「……信？」","放在桌上的那个东西，正确来说是个樱花色的信封，正面没有写任何字。信封本身没什么厚度，看起来很轻，我想里面装的八成是信纸。","「不对。你可以看里面装了什么。」","我拿起她干脆地否定里头装有信件的信封，翻过来看，背面当然没写什么，封口也没有封上。我轻易地打开了上头没有胶水或贴纸的轻薄信封，里面果然是一张薄薄的纸。","不是信件的那张纸并非信纸。","而是被对折再对折，像是影印用纸的纸张。","一次两次地摊开折起来的纸张后，上头画着我意想不到的东西。","「仙台同学，这个……是什么？」","我并非第一次看见纸上画的东西。","那东西我至今为止看过好几次，然而不是现在这个状况下该看的东西。","「房子的平面图。」","耳边传来仙台同学平静的声音。","「这我看就知道了。」","「那不就好了？」","「不好。我是在问你，为什么现在会从信封里冒出这张平面图。」","「因为这是宫城的房间平面图。不让你看就没有意义了吧？」","我完全不懂她这是什么意思。","她虽然一脸若无其事，说出来的话却乱七八糟。尽管她做的事情有很多我都无法理解，但这依然是那当中最令人无法理解的行动跟话语。拜此之赐，我又看了一次从信封里头拿出的纸。","有两个房间。","另外还有厨房、餐厅、浴室，算是满宽敞的房子。","「这房子以一个人住来说太大了。」","我有很多想说的话，不过还是先举出了从眼前的纸张所得到的情报中感到奇怪的一点。","「一个人住是太大了，但你不觉得两个人住的话刚刚好吗？」","「——两个人是指？」","我已经预测到仙台同学接下来会说什么了。","却没办法忍着不问她。","「我和宫城。你别去住宿舍，来跟我一起住啦。地点大概是在两所大学中间，所以可能得多花点时间通学就是了。」","她以稍快的速度，一气呵成地继续说下去。","「虽然跟你现在的房间相比小了点，但房子满干净整齐的。」","「仙台同学……」","「啊，钥匙得等搬家时才会拿到。我之后会再拿给你。」","「仙台同学——」","「我有跟父母说过会跟你一起住了。他们不太在意这种事，只说随我高兴就好。」","「仙台同学！我没有说要跟你一起住，也没拜托你去看房子。真要说起来，签约的时候要先付订金吧？我的份是谁出的？」","我满脑子都是疑问，所以不知道该从哪里问起才好，总之先开口打断了说个不停的她。","看着上面画有房子平面图的那张纸。","我不认为她会独自去看房子，应该是和父母一起去的，负责签约的也是他们才对。可是他们不可能连我的那份订金都先帮忙出。","「我用存钱筒里的钱出的。」","仙台同学说得理所当然。我直盯着她看。","「存钱筒？」","「我从宫城那里拿到的五千圆，那些我全都存进存钱筒里了。」","「你说存进存钱筒——表示都没花掉吗？」","我对给出去的钱不感兴趣。","我没算过自己到底给了她多少钱，也没问过她用在哪里。毕竟要怎么用是她的自由，我一直认为她有在用那些钱。","「因为我不需要花到那些钱啊。存在存钱筒里的那些钱，我说是宫城先寄放在这里的订金，交给我父母了。」","将我作为命令代价付给她的五千圆用在我身上。","没想到她会做出这种事。","追根究柢，她为了没有要拿去花用的五千圆跑来我家，听从我的命令，到底是有什么毛病？简直是疯了。","「你这个人脑筋很好，却是个笨蛋耶。」","我把画有房子平面图的那张纸对折再对折，放在桌上。","「笨蛋就笨蛋。总之你选一边吧。」","「你说要选，是要选什么？」","其实我不用问也知道，却还是问了她。","「吊坠和信封，选你喜欢的那一边，我会遵照你的选择去做。如果你选了吊坠，我就不会再跟你见面，即使看到你也不会搭话。今天就是我们最后一次见面。」","「那我要是选信封呢？」","「你就要和我一起住。」","仙台同学绝对不会做出选择。","她总是会准备好选项，让我去选。","而且她在准备选项时，就已经事先决定好我的答案了。与我个人的意志无关，她会让我选择她要的那一边。","今天也是这样。","她在诱导我选择信封。","可是我要选的话，会选择项链。","这对彼此都好。","毕竟她别被我这个人给束缚住比较好。而我也一样，最好赶快忘掉她，熟悉新生活。至今为止所发生过的事情不过是一时兴起的程度，等长大成人后再回顾，只会觉得「自己当初怎么会做那种蠢事啊？」不是该依依不舍地拖到上大学后还持续下去的关系。","答案从一开始就已经决定好了。","即使如此，我仍在说出答案前，向仙台同学提出了问题。","「我可以问一下吗？」","「可以啊。」","「你为什么要自作主张地决定好房子？」","「居然问我为什么？因为我觉得要是不这样做，你就不会再跟我见面了啊。况且我基本上还是有跟你联络。只是你都没回就是了。」","在我们去看电影之后，曾经来过好几次联络。","其中有几次是在她说要去看房子的期间。因为她传来的不外乎是「你在做什么」或「接电话啦」这类的内容，我才会无视这些讯息。但倘若我知道她在找要跟我一起住的房子，一定会回讯息阻止她。","「我有说过要去住宿舍。」","我刻意不去触及自己无视她联络的事情，开口向她抱怨。","她让事情变得复杂了起来。","原本只要说好我们以今天为界线，往后不再见面这件单纯的事情，一切就结束了。","「宫城不喜欢宿舍那种地方吧？」","「……即使不喜欢，我也会想办法适应的。」","就算妈妈抛下我离开，爸爸都不回家，我仍习惯了这些事，就这么生活着。纵然不是因为喜欢才去住宿舍，总有一天我也会习惯，想办法适应的。况且环境改变的瞬间也可以视为一个段落，要是想和仙台同学断绝关系，便只有现在了。","「我觉得比起勉强自己去住宿舍，跟我一起住比较好吧。与其和别人一起生活，不如跟我嘛。」","即使往后四年间一直跟她在一起，也绝对不会有什么好事。","她想必马上就会适应新生活了，上大学之后，她就算跟我在一起，也不会以我为优先。而我也一样，假如住进宿舍，展开新生活，便不会满脑子都想着她。生活一定会变得相当忙碌，我也会渐渐不再想起她，她留在我心中的印记和记忆迟早会淡化。","所以还是努力去习惯跟她不同的生活比较好。","即使无法立刻办到，即使得花上一些时间，我也该等待她逐渐淡化，被其他事情覆盖、消失的那天到来。","这样做绝对比较好。","尽管如此……","尽管如此，我还是忍不住想问——","「信封……如果我没选信封，仙台同学打算怎么办？」","我看着樱花色的信封。","那个带有春季气息的信封比真正的樱花更美，就像仙台同学。","「我会去找其他愿意跟我一起住的人，所以你不用在意。反正上了大学，要找到想跟人合租房子的室友应该不难吧？」","她说得宛如花瓣随风飞舞般轻盈。","那连一点分量都没有的语气，令我的心躁动不安。","她要和我不认识的人一起住。","在我不知道的地方，跟我不认识的人一起生活。而我在完全不清楚这些事情的情况下，就这样再也无法和她见面。","心中有个无法容许这种事情的自己存在。","我用右手抓住左手手背。","接着让指甲刺在手背上。","她跟谁一起住都与我无关，我也无权干涉。","这我明白。","可是无法接受。","我讨厌这样。","我在右手上施力。","好痛。","连胸口深处都好痛，没办法顺利呼吸。","仙台同学的脸上现在挂着什么样的表情呢？","我虽然想知道，视线却紧盯着信封，没办法往上扬。","「……你这样太随便了吧？」","我硬是挤出声音。","却说不出我讨厌她和我不认识的人住在一起这种话。","「宫城还不是很随便。你一定是想说要是真的不能住宿舍，到时候再来想办法吧？」","我并不想住宿舍。","其实我觉得自己根本没办法和其他人一起生活。","却也找不到要跟她一起生活的理由。","不是朋友的我们，不会变成过往的同班同学以外的关系。","「要是我选了信封——」","会怎么样？","我明明已经听过答案了，脑袋却不能好好消化这些资讯，忍不住想一问再问。","我静静地吸了一口气，吐出来。","然后扬起刚才一直无法离开信封上的视线。","「我们明明不是朋友，仙台同学还要跟我一起住吗？」","「你不知道吗？就算不是朋友，也能当室友啊。」","仙台同学这么说着，把那张折起来放在桌上的纸收回信封里。","「舞香呢？我要怎么跟她说？」","「那由你自己决定。所以信封和吊坠，你要选哪个？」","信封和项链，从两者中选择一个。","我做出选择后，仙台同学就会接受我的选择。","怎么办？怎么办？我该怎么做？","——该怎么做才不会后悔？","「宫城，做决定吧。」","仙台同学催促着我。","我朝着桌子伸出手。","看着信封和项链，拿起了项链。","仙台同学轻轻呼出一小口气。","「转过去。」","我这样告诉直盯着我的她后，她默默地转过身去。","我靠近她。","解开项链的扣头，戴在她的脖子上。","银色的链条收进它应在的地方，被头发遮住。","我不是想跟她当室友。","然而并非朋友的我们，能变成某种不同于现在的关系，感觉也不是什么坏事。","我对着她的背影开口。","「——只有这四年。如果只有这四年，要我当你的室友也行。」","难得我有意愿要放走她，她却刻意准备了信封这种东西，事情才会变成这样。","她真的是个大笨蛋。","我撩起一束长发，轻轻拉动。","「宫城——」","松开仙台同学的头发后，她便想转过头来，于是我按住她的头，让她面向前面，不能转过来。","「意思是你选择了信封？」","「你觉得选项链比较好的话，那我就选项链。」","我尽量用一如往常的语气说完后，她抓住我按在她头上的手。","「如果宫城要用四年当一个段落，得好好加油，别留级喽。」","「仙台同学真的老爱说些多余的话耶。」","总觉得这种时候应该还有其他更合适的发言才对。虽然我不知道那是什么，但是叫人家别留级这种话绝对不是现在该说的话。","「你这只手放开啦。我也会放手。」","她这么说着，用力握了一下我按在她头上的那只手，随即放开。无可奈何地照她说的放手后，她转过来面向我，接着理所当然地握住我的手。","「以后我可以叫你志绪理吗？」","「不可以。」","「宫城好小气。」","「仙台同学很啰唆耶。」","听到我的声音，仙台同学嘻嘻笑着。","她真的就会说些多余的话。","不过只有四年。","如果就这点时间，要我跟这样的她共度这段时光也行。","我回握住她就这样牵着我，没有放开的手。","〔本话含插图〕"]},{"t":"后记","p":["非常感谢各位阅读《我买下了与她的每周密会～以五千圆为藉口，共度两人时光～》第四集。","本书是改写、修正网路连载版小说的内容，并加上专为成书版撰写的内容而正式出版的产物。","这次的第四集同样将随着U35老师所绘制的宫城和仙台出版发售，也是她们从高中毕业，故事进展到一个段落的一集。这集能够平安发售，着实让人松了口气。","！","注：此指日本出版时间","《每周密会》在「下一部人气轻小说大赏2023」的文库部门拿到了第八名，实在非常感谢支持本作品的各位。紧接在「这本轻小说真厉害！2024」之后，本作品又再度上榜，我真的很高兴。","在《每周密会》的特设网页上，公布了纪念本作品在「这本轻小说真厉害！」及「下一部人气轻小说大赏」上榜而另外撰写的短篇故事，希望大家有空能上去看看。","从2022年《每周密会》计划出书后到现在，前前后后真的经历了很多事。决定由U35老师来为本作品绘制封面及插图、决定由右腹老师负责本作品的漫画版、宫城和仙台有了声音……连同在「这本轻小说真厉害！」以及「下一部人气轻小说大赏」上榜在内，实在发生了太多太多事情，感觉时间过得飞快，转眼间就来到了2024年。迈入今年后也发生了许多令人兴奋的事，真的仿佛只过了短短一瞬间就到现在了。","《每周密会》参加过许多比赛，却迟迟无法走到出书这一步，曾被说过还差一点，或是不合书系的风格。","此外也曾经遇过许许多多状况。宫城和仙台的故事能像这样出版成册，都是因为有各位发现并阅读《每周密会》这部作品的读者们。要是没有大家的支持，这部作品就无法通过第七届カクヨム网路小说大赛的读者评选，书籍的集数也没办法像这样累积下去。实在很感谢大家！","然后，我想对责任编辑说些话……","其实我本来是打算以第七届カクヨム网路小说大赛，作为《每周密会》这部作品最后参加的比赛。要是责任编辑没有发现《每周密会》，这部作品就没有机会出书了。真的非常谢谢您，感激不尽！","我很不擅长说这种话，在不断错失机会，一直没能告诉责任编辑的情况下，就这样来到了第四集，已经只剩下公开致谢这条路可走……于是我就这么做了。","尽管已经到了尾声，不过我依然要诚心感谢阅读第四集的各位、在网路上鼓励及支持我的大家、U35老师、责任编辑、在各个方面协助本作品出版的各位。然后还要感谢我的好友N，谢谢你每次都愿意听我商量烦恼！","那么，希望能在第五集的后记与各位再见！","羽田宇佐","〔本话含插图〕"]},{"t":"番外篇　当春天造访这个房间，仙台同学将会……","p":["去年的这个时候是春假。","今年则过着不是春假，不确定是什么的日子。","我既不知道该怎么称呼从高中毕业典礼结束，到大学开学典礼来临前的这段时间，也不知道虽然结束了高中生活结束，却仍不算是大学生的自己究竟是什么人。","「唉」地吐出一口气，我坐在地板上，环顾满是纸箱的房间。","没料到未来会是这样。","我本来打算报考当地的大学，从这个房间通学，现在却变得要离开这里，和舞香念同一所大学。本来要住宿舍的计划也没能实现，必须做好离开这个房间的准备。","由于要念外县市的大学，我本来就得搬家才行，却没想到会演变成这么大规模的搬家。","不住宿舍，和仙台同学当合租室友。","因为预定改变了，相比住宿舍，我需要准备更多东西，房间里才会放满了纸箱。虽然大型物品已经决定好要直接在当地购买，却仍有不少东西要带过去，老实说实在很麻烦。可以的话，我真不想做打包装箱的工作。","尽管爸爸说可以请搬家公司来帮忙打包，但我不想让别人碰房间里的东西。既然如此，我就只能自己打包了，于是现在才会像这样将东西装进纸箱里。","问题是不管再怎么装都打包不完。","虽然这很明显是我没先决定好要带哪些东西过去就开始打包造成的结果。然而我不知道搬过去之后会需要哪些东西，这也没办法。","「书该怎么办啊？」","我起身站到书柜前。","全部带去未免太不现实，而且可以想见搬过去之后，书还会增加。如此一想，就只能从这些书当中选出无论如何都得带去的书了。","好难。","我有很多想要重看的书。","毕竟这个房间不会消失，没带走的书会一直留在这里。尽管如此，一想到不回来就看不到那些书，我便无法决定要把哪些书留下来。","「要是能全都带过去就好了。」","即使是书，对于抛下它离开这件事，我依旧有股罪恶感。","要是选择留在这里，就不需要抛下书离开，也不需要打包装箱。可是我没有选择那样的未来。拜此之赐，我持续进行着区分哪些东西要带走，哪些东西要留下的作业。","我盯着书背。","跟最右侧的书说「带走」。","对旁边的那本书也说了「带走」，再旁边的一本则是「留下」。","心情好忧郁。","像这样挑书，让人有种哪天自己也会被仙台同学给区分出来，抛下离去的感觉。","我们一起合租房子的期限是四年。","不过也有可能撑不到四年就会提前结束。","我用力拍了一下脸颊。","一去思考，便会让人在开始前感到不安。然而现在有比起担心大学入学后的四年更重要的事情，那就是打包装箱。","我取出决定要带走的书，装进纸箱里。","又继续选出要带走跟要留下的书，把几本书装进纸箱里。","在反复做这件事的途中，我因为一本漫画而停下了手上的动作。","「……这是仙台同学第一次来这里时朗读的那本吧？」","她好像说过这本漫画很色，不是可以大声读出来的内容之类的。","而我命令仙台同学朗读出漫画的内容后，她一边抱怨一边朗读了。","那一天，我用五千圆买下了她放学后的时间。","我从书柜上取出她抱怨过的漫画，还没决定要不要把它带走，总之先放到装有鳄鱼面纸盒套的纸箱上面。","「休息一下好了。」","打包装箱的工作毫无进展。","老实说我根本没有时间休息，却又提不起干劲。","我坐在地板上，看到被我放在一旁没收起来的相簿。那是从用数位相机或手机拍摄的照片中，把拍得比较好的照片列印出来后整理而成的，里面收着许多过去的我。","还是小婴儿的我。","照片里有拍到妈妈。","一岁生日。","照片里有拍到妈妈。","两岁生日。","照片里有拍到妈妈。","虽然我很久没打开相簿了，不过还记得里头有哪些照片。","幼儿园的开学典礼和毕业典礼，以及小学开学典礼的照片，有很多都有拍到妈妈。可是以某个时期作为分水岭，一直都会出现在照片里的妈妈不见了，不时会出现的爸爸同样不见了，过去就此中断。拍摄的照片不再被列印出来，拍照这件事本身也不再发生，我更不再打开相簿。","稍微犹豫后，我把相簿放在纸箱上。","打包装箱的缺点，就是在过程中会看到一些平常不会看到的东西。","手老是停下来不动就做不完，我的心情越来越沉重。","「决定要带走哪些东西这件事真是有够麻烦的。」","这个房间里还有仙台同学的制服衬衫这种东西，让我一直在犹豫该带些什么走才好。况且因为预定要搬家的日子还有一段时间，不是马上就要搬家了，要是把所有东西都装进纸箱里，会害我连明天要穿的衣服都拿不出来。","我慢吞吞地站起来，躺到床上。","满是纸箱的房间让人难以呼吸。","我只想早点从打包装箱的苦行中解脱。","我叹了口气，拿起放在枕头旁边的黑猫玩偶，摸摸它的头，对它说话。","「……你要跟我搬家吗？」","黑猫没有回话。","如果是把这只黑猫当成耶诞礼物带来给我的仙台同学，应该会说些什么，然而黑猫不爱说话。要是它能陪我说说话，我的心情或许会舒畅一点，然而不管我询问什么，它总是不肯回话。","我把黑猫放回原处，闭上双眼。","我并不困，意识却在眼睑创造出的黑暗中飘荡，变得昏昏欲睡。","意识在脑海里载沉载浮。","耳边传来手机的来电铃声。","一声、两声、三声。","铃声没有中断，一次又一次地响起，响个不停。我不得已地睁开眼睛爬起来，爬下床去拿放在桌上的手机，接起电话。","「仙台同学，你很烦耶。」","连同抱怨，我一起叫出显示在手机萤幕上的名字。","『你劈头就讲这种话，会不会太失礼了？我是担心才打给你的耶。』","「我觉得没什么需要你担心到特地打电话过来关心的事。」","我坐到床边，用脚指尖蹬了一下地板。","『总觉得你可能会赶不上开学典礼啊。』","「什么意思？」","『我担心你来不及做好搬家的准备。要我去帮忙吗？』","仙台同学以不轻也不重的语气说着。","虽然很怀疑她是不是真的在担心我，但这话听起来不像是在开玩笑。不管怎样，我都要告诉她我不需要帮忙，一个人就弄得完。","「不用。我已经先预约好搬家公司了，时间上不会来不及，正在打包装箱。」","『这样啊。毕竟打包装箱很麻烦，再加上感觉你会说「开学典礼根本不重要」，我才会有点在意。』","这番话虽不中亦不远矣，她还真是敏锐。","实际上我的确觉得打包装箱有够麻烦。","而且我原本就不太喜欢参加开学典礼。","开学典礼和毕业典礼密不可分，将开始与结束连接在一起，表示开始的事情终有一天会结束，所以两者都不是什么值得开心的事。","想到开学典礼正逐步接近，我就觉得一切看起来都很灰暗，让人心情非常消沉，像是被厚重的乌云笼罩着，哗啦哗啦地下起大雨。","『话说回来，你有跟宇都宫她们说你要跟我合租房子的事情吗？』","仙台同学提起会让我的心情变得更沉重的话题。","「这跟仙台同学无关吧？」","我不知道该怎么告诉舞香和亚美才好，所以一直没有向她们订正当初我说要去住宿舍的说法。尽管很想就这样装作住进了宿舍，瞒着她们我和仙台同学合租房子的事情，可是舞香跟我念同一所大学，我没办法一直瞒着她们。","然而要是告诉她们我在外面跟人合租房子，她们一定会追问我对方是谁，所以我还在寻找有什么无伤大雅的理由，可以解释我为何会和仙台同学合租房子。","「仙台同学才是，你有跟茨木同学她们说我们的事吗？」","我觉得在烦恼的应该不只有自己才对。","仙台同学也一样，必须向朋友解释她为什么会跟在学校里没交集的我合租房子的理由。","『宫城希望我怎么做？』","「你这话是什么意思？」","『我曾说过自己会跟朋友合租房子，但没明说对象是谁，反正大家都会留在这里，倒也不是非说不可。况且要是说我跟宫城一起住，她们大概会抱着想看好戏的心情跑来玩。不过你觉得我跟她们说一声比较好的话，我不介意告诉她们我跟谁合租房子。你觉得呢？』","电话那头传来的声音与平常毫无差别，连一丝丝烦恼都感觉不到。","「……你不用告诉她们。」","太奸诈了。","茨木同学她们跑来玩，伤脑筋的人会是我，不是仙台同学。我觉得她问我这种从一开始就已经决定好答案的问题，实在很坏心眼。","『宫城八成还没说吧？』","「你很让人生气耶。」","她真的很奸诈。","结果陷入烦恼的人只有我而已。","不过现在不告诉舞香或亚美，也还有办法蒙混过去，我之后再来烦恼这个问题就好了。","『哎呀，虽然告诉宇都宫她们你要跟我合租房子这件事我帮不上忙，不过有需要我去帮你准备搬家的话，随时都可以跟我说。』","「有你这份心意就够了。」","打包装箱就像是在整理回忆。","虽然麻烦，但我不需要帮忙。我不想让任何人触碰，才会想自己收拾这个零乱的房间。","『宫城。』","仙台同学平静地呼唤我。","「干嘛？」","『……我会先到那边去等你。』","从手机的另一头传来她柔和的嗓音。","「嗯。」","我心中怀有许多不安。","和她合租房子的不安多到我不用特别去找，就能马上发现的程度。","不过这是我自己的决定。","跟她一起住绝对不会只有好事，但一定会有开心的事情。尽管心中的不安不会消失，然而我并不后悔自己选择了信封。","『之后见。』","仙台同学这么说。我也回了她一句：「之后见。」","电话挂断，她的声音随即消失了。","我拿起舒服地躺在枕边的黑猫玩偶。","「一起走吧。」","站起身来，跟黑猫一起看着满是纸箱的房间。","高一开学典礼的那一天，我完全没想到会有这天的到来。","当时那个连能不能考上大学都还不确定的我，隐约认为自己会一直生活在这个没人在的家里。而在二年级的七月，巧合加上我的一时兴起，让仙台同学开始到这个房间里来。上了三年级之后，她依然会来这里。","接着，划分我们的毕业典礼到来，她不会再来这里。春天将造访这个房间，给仙台同学五千圆，命令她的生活也结束了。","我就快要和她来过无数次的这个房间道别，开学典礼的日子逐步接近。","可是我和她之间并没有结束。","新生活很快就要开始了。","在总是有人在的房子里。","〔本话含插图〕"]}]},{"vol":"05","title":"我买下了与她的每周密会 · 卷05","chapters":[{"t":"简介","p":["来到春天，我「做不到的事情」增加了。","成为室友后，我跟宫城应该会变得更为亲近，","我们相处起来却莫名尴尬。","不说碰触或接吻，就连交谈都非常少。","为了找回过去那些理所当然的互动，","我们需要找出代替五千圆的新藉口──一个新的规则。","来到春天，我「不明白的事情」增加了。","没被花掉的五千圆和变成室友的仙台同学。","我过去为这段关系赋予的那个理所当然的解释，","因为这些事实而有了一百八十度大转变。","为什么仙台同学那时候会──","面对事到如今才涌上心头的疑问，","我甚至不明白自己到底想不想知道答案。"]},{"t":"第1话　过去我和宫城的那些理所当然","p":["时序来到春天，搬家工作也告一段落了。","成为大学生后，我过着不再从宫城那里拿五千圆的日子。","原本理所当然地存在于我们之间的五千圆消失后，每一天都很新奇。早上起床就能看见宫城。对她说「早安」，她也会回应一句「早安」。如同我们在毕业典礼那天的决定，我和宫城成为合租室友。即使上了不同的大学，我们也住在同一个地方。","这次的期限是四年。","到大学毕业为止，我们会住在一起。","换句话说，我将和宫城度过更长一段时光，远远超过先前相处的时间。然而，比起和明明有听到我说话，却毫无反应的家人住在一起，我觉得现在反而能过着更像个人的生活。","话虽如此，我和宫城的生活并非一帆风顺。","还是存在不少问题。可是宫城不让我去解决。","我从流理台下抽出牛奶锅。短暂犹豫后，倒入足以泡两人份红茶的水，放到炉上加热。","作为我们共用空间的这个开放式厨房里，没有快煮壶或煮水壶。","我已经把必要的东西全带过来，也买齐了欠缺的物品。","原本是这么想的，但开始生活后，我发现还缺了不少东西。快煮壶就是其中之一。我很想去买，却因为宫城而迟迟无法成行。","叹气的同时，后方传来一阵脚步声。我于是转过身。","看见一脸睡意的宫城走出房间，我向她搭话。","「早安。」","「……早安。」","「要喝红茶吗？」","「不用。」","「今天的午餐打算怎么办？」","牛仔裤配上连帽休闲上衣。","我朝穿着和平时没两样的宫城抛出问题。只见她皱起眉头，似乎不想被问起这件事。","我对她说了「早安」，但再过一小时就是十二点了。今天是周六，睡晚一点也不成问题。而且我也不晓得自己能干涉宫城的生活节奏到什么程度。不过既然住在一起，问她「有没有要吃饭」应该无伤大雅吧。","「我随便吃吃就好。」","宫城用明显不悦的语气回答。","「难得我们都在家，要不要一起吃饭？喝完红茶后我就来准备。」","我一边从橱柜里拿出马克杯，一边这么提议。","「……我跟舞香有约。」","又是宇都宫。","我不太高兴。总觉得来到这里后，宫城就过于频繁地和宇都宫碰面。","「那你的午餐呢？」","「我急着出门。」","她给出一个牛头不对马嘴的回应。","拜此所赐，我不晓得她说的「随便」是指什么。","是要跟宇都宫在外面随便吃？还是快迟到了，打算在家随便吃点东西再出门？","又或者，「随便吃」其实有别的含义？","我从宫城的话语中找不到正确答案。说是这么说，但就算我继续追问，她大概也不会给出明确的答复。","「这样啊。」","我给出模棱两可的回应后，宫城的身影消失在盥洗室。","看来她没打算在家吃午餐，而是要在别的地方随便吃。我把刚拿出来的马克杯放回橱柜。","搬来这里后一直是这样。","宫城的话非常少。","就像回到从前。","刚开始去宫城的房间时，她不太说话。我也不擅长应对宫城创造出来的沉默。现在的气氛跟那时差不多。","我们都还没有习惯新的生活。","我们之间一直存在的五千圆消失了，得到名为「室友」的关系。但我们不知道这个关系应有的样貌。直到毕业典礼前，待在对方身边明明是理所当然的事，现在却觉得距离太近。然而一旦远离，我们又会因为距离太远而坐立不安。","我倒掉牛奶锅里的热水。","和宫城一起住。","我早就知道这么做的结果不会全是开心的事，却万万没想到会如此困难。","我准备好鸡蛋和牛奶，拿出调理盆。","将蛋打进调理盆，加入砂糖搅拌，再倒入牛奶继续搅拌均匀。吐司应该用菜刀切开，但我今天直接用手撕成四块丢进盆里。盯着浸泡在蛋液里的吐司时，宫城从盥洗室走出来。","宫城。","还来不及发出这短短两个音节，她已经走回自己的房间。","距离午餐时间还有点早，不过我决定要煎法式吐司。开火加热平底锅，让奶油融化。","这个厨房比宫城家的小。","但用起来跟宫城家的一样方便。只是待起来不自在。","这个家还没有变成我的家。","我将泡过蛋液的吐司并排在平底锅中，盯着吐司。","无论早上起床还是从大学回来，甚至是睡前，宫城都在这个家里。虽说走进自己的房间便能独处，隔着墙的另一边也几乎一定有宫城。","这个事实让我有点紧张。","宫城大概也一样。","这里是个尴尬的空间，还没变成自己的家。","虽然应该比她原本预定入住的宿舍好。","我吐出一口气，关上瓦斯炉。从橱柜里取出一个盘子，盛装刚做好的法式吐司，端到餐桌。打开冰箱后，我的手先伸向柳橙汁，最后却拿出汽水。将汽水倒入玻璃杯中，再将玻璃杯放到法式吐司旁边。我拿着叉子坐下后，传来开门声。","「仙台同学，我要出门了。」","听见她的声音，我把视线从法式吐司移向宫城。","「你回来之后有空吗？」","我其实想知道她几点会回来，可是那样感觉就像我想掌握宫城二十四小时里的所有行动，很难问出口。","「不知道。」","宫城冷淡地回答，在我回应前就走向玄关。","说得直接一点就是她逃走了。","我喝下宫城总是在喝的汽水。","果然不好喝。","我不喜欢碳酸气泡在口中不断爆开，或是那种从内侧把胃挤开的感觉。宫城很喜欢，可是对我来说，汽水是个连到底甜不甜都难以判断的东西。我实在不想主动去喝。","我慢吞吞地把法式吐司送入口中。","甜味里充斥着奶油和鸡蛋的美妙滋味。","柔软湿润的吐司让胃平静下来。","大概吃完一半，我又喝了口汽水。","学期刚开始，连选课都还没结束。","选了什么课？会怎么安排大学生活？我也想和宫城聊这些事情，但她总是在逃避。她过去也逃避过好多次，可是在这个狭窄的空间里被她如此对待，我还是会受伤。","这张不算大的桌子和两张椅子，本来是两人共用的。但现在说是我专用的也不为过，因为我几乎没有宫城坐在对面的记忆。","去年夏天，我们明明一起做了法式吐司来吃。","我叹了一口气，将剩下的法式吐司塞进胃里。","从桌上的面纸盒里抽出一张轻柔的面纸，擦了擦嘴。","面纸盒没有装盒套。","因为宫城以前为面纸盒装上鳄鱼的盒套，我觉得可以一起去买共用空间用的面纸盒套。当然，我也想去买快煮壶。只要出门把这些东西买齐，这里住起来应该会更舒适。","可是我到现在还是不知道宫城想不想帮面纸装上盒套，也不知道她是否认为快煮壶是必需品。这都是因为我们之间的对话实在太少了。","而且我也不晓得高中时在宫城房间里的那些东西现在怎么样了。","鳄鱼的面纸盒套有跟着她一起搬家吗？","我在圣诞节送她的黑猫玩偶，有被摆在她的书柜上吗？","之所以连这么单纯的事情都不晓得，是因为我到现在都还没有踏进宫城的房间。明明住在一起，对现在的我来说，宫城的房间却是那么遥远。","「唉～」我吐出肺里的空气。","手指从脖子滑向胸口。","毕业典礼那天，宫城叫我还给她，最后又回到我手里的项链。自收到的那天起，项链一直在我身上的这个地方。可是搬来这里后，宫城说可以不用戴，所以我没有戴在身上。","我和她的关系如我所愿地延续下去，过着比住在原生家庭时更像个人的生活。光是如此，我就应该满足了。然而，如果可以，我希望能像高中时那样，打开关上的房门，走进宫城的房间。我希望像那时一样坐在宫城身边，和她接吻——","「……她一定会生气吧。」","理所当然地存在于我们之间的五千圆消失了。现在我们没办法再做以往那些理所当然的事。高中时期的回忆几乎荡然无存，我也失去了踏进宫城房间的权利。她不再对我下命令，我也无权触碰她或是和她接吻。","——宫城想要再和我接吻吗？","去看电影的那天后，我们就没有再接吻。","我一直觉得不需要五千圆。","现在却觉得要是有五千圆就好了。","跟过去相比，我很难度过新奇的每一天。","欠缺的东西太多了。","其中最缺乏的是「对话」，我想跟宫城多说点话。","不对，是必须要对话。","照现在的距离感，我们多半没办法一起生活下去。","迟早会出现裂痕。","搬来前我就知道和宫城一起住不容易。但因为是我霸道地要宫城选择来这里，我得负起一定责任来改变现在的气氛。","既然无法掌握应有的距离感，我只要准备可以测量距离的东西就好。","用来测量我们之间新的距离的一把尺。","如果有这样的东西，我们就能找到双方得以自在相处的距离。不会过度干涉，能在保有合适距离感的情况下一起生活。","第一次去宫城家时，我们一起订定了「规则」。","只要和那时一样，再度订下能用来当成标准的「规则」，生活就会变得更舒适。","我抬起头，拿起放在桌子一隅的手机，传讯息给不知道现在人在哪里的宫城。","『别在外面吃晚餐喔。我等你回来。』","过了一会儿，我看见回复。","『我不知道几点才会回去。』","『我等你。我会一直等到宫城你回来。』","这内容好像在威胁，不过这也没办法。","『我会买点吃的东西回去。』","虽然没说具体的时间，不过既然说会买吃的回来就表示她应该会在晚餐时间返家。回传了『我等你』后，我开始收拾刚才用来盛装法式吐司的盘子和玻璃杯。","「你是不是买太多了啊？」","我把有点大的袋子放在共用空间的桌上，看着宫城。","传讯息说不晓得几点才会回来的她，比预期中更早回来。","很好。","毕竟我希望她能尽早回来，也很感激她在该吃晚餐的时间到家。可是刚才宫城说着「拿去」并递给我的袋子里，装了数量多到两个人吃不完的面包。","「舞香说那家店的面包很好吃，所以我多买了一些。」","她口中的「舞香」是宇都宫。听到这个意外的名字，我的太阳穴一带微微抽动。","宫城遵守了「会买点吃的东西回来」的约定，我也没有指定要买什么东西。即使她递给我的袋子里放着宇都宫说好吃的面包也没有问题，但我现在不想听到那个名字。","「面包应该是早餐或午餐，不是晚餐时该吃的东西吧？而且我中午才吃过面包。」","几步之外的宫城脸上没有半点笑容，而我吐出只能用「挑剔」形容的话语。","「那你不要吃啊。」","宫城低声说道。不算宽敞的开放式厨房里飘散出紧张的氛围。","我不是想对她说这些。","当时赶着出门的宫城想必没那个心思去留意我做了法式吐司当午餐，这些面包是无辜的。当然，这也不是宇都宫的错，是我心情不好。这样下去没办法好好谈。","冷静点。","我对自己这么说。","「我没说不吃啊。等一下，我去拿喝的。宫城你喝汽水就好吧？」","我没等她回答便走到冰箱前。","拿出柳橙汁和汽水，倒进玻璃杯。从袋子里直接拿面包出来吃也行，可是那样不像在吃晚餐，所以我从橱柜里取出两个盘子递给宫城。端着玻璃杯就座后，宫城在对面坐下。","「仙台同学可以选你想吃的。」","「宫城你先选啦。」","「你午餐也吃了面包吧？可以选不一样的啊。」","我比较想要之后再选，可是像这样一直互相礼让会没完没了。重要的不是吃哪个面包，而是和宫城对话。","「那我就先选喽。」","我从袋子里取出夹了火腿和起司的可颂面包与可乐饼面包，放上盘子。「宫城呢？」听我这么问，原本盯着我看的宫城才将马铃薯沙拉面包和热狗卷放到盘子上。","「我开动了。」","尽管没有刻意配合，我们的声音还是重叠了。","我从盘子上拿起可颂面包，咬了两口。","外皮酥脆，里头松软又有嚼劲。","火腿和起司的分量不多不少，恰到好处。","这应该算是相当美味的面包，但我今天没有余力品尝。","「宫城，跟我一起住的事，你有告诉宇都宫吗？」","我问出一直很在意的事情，没有直接切入正题。","「说了。」","「她说什么？」","「没什么。」","宫城冷淡地回应，咬下马铃薯沙拉面包。","「你绝对没把我的事情告诉她吧？」","宇都宫从以前就很在意我和宫城的关系。得知我们一起生活，她不可能没有反应。","「我有说。」","宫城大口大口地吃面包。","视线固定在盘子上，看都不看我一眼。","不管怎么想，我都不认为她有把我们之间的事告诉宇都宫。然而，想办法问出她是不是真的有把我们合租房子的事告诉宇都宫，或是逼问她是怎么跟宇都宫说明都没有意义。即使我追问，宫城也不会从实招来。再说，不知道真相也不会对我造成任何困扰。我只是想满足些许好奇心。","「……仙台同学今天等我回来是想问这件事吗？」","宫城开口了，视线没有离开盘子。","我咬了一口可颂面包，吞下后才这么回答：","「宇都宫的事只是开场白，接下来才要进入正题。我们来订定规则吧。」","我的声音让宫城抬起头。","「规则？」","「对，两人同住的规则。有一些默契或公约，生活起来会比较方便吧？」","「仙台同学决定就好，之后再告诉我。」","宫城用厌烦的语气这么说，把热狗卷留在盘子上就站起来。","这个反应也在我的意料之中。","原本以为她甚至不会和我一起吃晚餐，所以她光是坐在对面吃面包，我就很想夸奖宫城了。但如果这时候让她溜走，我们只会重复先前的生活。","「我决定就好？那就算我订下每天都要接吻的规则，你也没意见喽？」","我喝了口柳橙汁，把玻璃杯放回桌上。","「当然有意见啊。」","「那你就参与讨论啊。」","「……你说的规则是指怎样的规则？」","宫城回到座位，看向这边。","「比方说要怎么轮流丢垃圾或打扫。类似这样的规则吧？」","其实我更想知道能不能像以前那样接吻或是触碰她的身体。没有五千圆的日子很新奇，但过去存在于宫城房间里的一切仿佛都随着五千圆一同消失了。我并不满意这样的生活。","可是，现在说这些还太早了。","现在的我们需要习惯普通的生活。","如果没有订定合租房子的规则，并以室友的关系共度每一天，这样的生活会非常难熬。","「那我想要订一条『不准擅自进入对方房间』的规则。」","宫城低声说道，大口咬下热狗卷。","「我现在没有擅自进入你的房间，不过先订下这样的规则比较好吧。除此之外，你还希望有什么规则吗？」","「除此之外？其他还有……」","宫城喃喃说道，仿佛在自言自语。","我主动向陷入沉思的她提出几条规则，宫城也回了一些像样的意见。","可以找朋友来家里玩，但不能过夜。","外宿不回家时要事先联络。","除了这种感觉必须决定的事项，我们也订下一些不清楚是否有必要的规则。经过一段说长不长，说短不短的时间后，宫城稍显疲惫地开口：","「应该不需要更多规则了吧？」","听到她这么说，我喝了一口柳橙汁。","「一周一次就好，一起吃饭怎么样？」","我看向宫城，尽量表现得很自然。","「一次就好吗？」","「是啊。」","「知道了。不过……」","话语断在这里。","可是宫城一副欲言又止的样子，于是我开口问道：「不过？」","「不只外宿，会晚回来的时候也跟我说一声啦……这样一来，我们在其他日子可以一起吃饭，之前也是一起吃的啊。」","宫城语速极快地小声嘀咕。","「一周不只一次也可以啊？」","「仙台同学不想一起吃的话就算了。」","「我会把这个当成规则，时间上能配合的日子就一起吃吧。所以宫城你如果会晚回来也要跟我说喔。」","她轻轻回了一声「嗯」。","没想到宫城会主动提议有空就一起吃饭，不用局限于一周一次。在新的生活中，她仍希望保留「一起吃饭」这件和从前相同的事。尽管只是一件微不足道的小事，我还是安心不少。","「那么，如果违反规则就要接受惩罚喔，宫城。」","我不认为宫城会不守规则，但还是设下一个让人更难打破规则的条件。","我们先前订下的几乎都是打破也无关紧要的规则。","可是最后这条「有空的日子要一起吃饭」的规则，虽然没什么特别之处，却是我希望她能遵守的规则。要是宫城也有同样的想法就好了。","「惩罚是什么？」","「这个嘛～听从对方的一个要求，怎么样？」","惩罚的内容不重要，但太简单就没有意义了。某种程度上，那必须是有点麻烦的事。","「可以啊，你可别忘了喔。因为会违反规则的人是仙台同学。」","宫城说出失礼的话，直直盯着我看。","算了，毕竟我没什么信用。","回顾过去的所作所为，我能理解她为什么会这么说。可是我也不能老实承认自己会违反规则。","「别担心，我不会违反规则。」","我如此断言，一口吃掉所剩不多的可颂面包。火腿和起司一起落入胃袋。接着，我把手伸向可乐饼面包。","「喂，仙台同学。」","「什么事？」","我咬下可乐饼面包，然后看向宫城。","「一起吃饭的时候，谁要负责做饭？」","「因为要一起吃，所以我们一起做啊。」","见我毫不迟疑地回答，宫城脸上写着「超级麻烦」。为了避免她开口说出「还是不要一起吃饭好了」，我急忙转换话题。","「对了，宫城。我想要快煮壶，可以去买吗？」","「这件事根本不需要问我啊。你想买就买。」","「我也不能擅自去买吧？毕竟是共用的东西。」","「那只能买了啊。我会出钱。」","「你不用出钱。因为是我们要一起用的东西，我会用那笔钱去买。」","听到我的话，宫城皱起眉头。","「那笔钱是仙台同学的。」","「是我们两个的。」","「那是我给仙台同学的啊。」","「那笔钱」指的是我存钱筒里的钱。里面存的是宫城拿给我的五千圆，作为听从命令的代价。所以她没有说错。","这间房子签约时用掉了「那笔钱」的一部分。不过在搬家前，宫城的父亲又把用掉的部分还回来了。","这也是理所当然的事，连想都不用想。","听到本来说要去住宿舍的女儿现在要跟人合租房子，宫城的父亲怎么可能一毛钱都不出？一半的签约金确实回到我手里，补回了用掉的部分。","可是我不想把这笔钱花在自己身上。","话虽如此，就算我想还给宫城，她也不可能收下。","结果那笔钱变成我们的「共用资金」，平时由我保管。","当然，宫城也不肯接受这个安排。","「哎呀，不管是谁的钱都好啦。我们一起去买快煮壶吧。」","我抛开再怎么争执也不会有结论的问题，把话题拉回快煮壶。","「如果我说不要呢？」","「那宫城往后就要一直用牛奶锅帮我烧热水。」","我对她灿烂一笑。宫城则一脸厌烦，好像吞了一只带着苦味的虫子。","「……什么时候去买？」","「明天。你跟宇都宫有约吗？」","如果说下周，感觉今天决定好的事情都会化为乌有，所以我不想再拖时间了。","「……没有，可以啊。」","宫城低声说道，吃着剩下的热狗卷。","「喂，宫城你明天穿裙子好不好？」","在这个带着一丝尴尬，但已经相对变得缓和的氛围下，我说了句无聊话。","「不好。」","「你也回答得太快了吧？」","「又没有需要穿裙子的理由。」","「因为我喜欢宫城的腿啊。」","来到这里后，我就没看过宫城穿裙子。当然，跟需要穿制服的那时候不同，我自己也没有天天穿裙子，今天穿的就不是裙子。可是我久违地想看看宫城的腿。大概是因为在宫城的那个房间里，我们穿着制服度过了一段不算短的时光，我比较习惯宫城穿裙子的模样。","「我死都不会穿。」","「我就觉得你会这么说。」","「……你就这么想看吗？」","「如果你愿意让我看。」","我其实想摸宫城的腿。但我现在不可能对她本人说，也不打算说。不对，就算不是腿也没关系，我想跟高中时一样，理所当然地触碰宫城。我甚至觉得她不再下达命令是一件值得惋惜的事。","「仙台同学真变态。」","我就知道她会这么说。","但我觉得会说这种话的宫城比较好。","〔本话含插图〕"]},{"t":"第2话　仙台同学该遵守的规则","p":["我没有设闹钟就睡了。","可是在刚过六点这个以周日早上来说相当早的时间，我醒来了。","「……好困。」","我将倒在枕边的黑猫玩偶一把拉进被窝，放在胸口上。摸着黑猫的头，闭上眼睛。","晚上的确有睡意。","可是睡不好，一大早就醒来。","搬来这里后一直是这样，脑袋浑浑噩噩的。","这一切都要怪仙台同学。","——要是能这么说就好了，但原因八成出在我身上。","我不习惯家里总是有人。","早上起床，仙台同学在家。从大学回来，仙台同学也在家。连假日都是这样。没人在家原本是理所当然的事，所以这个充满他人气息的空间就像别人家，让我没办法静下心。但如果身边有从以前房间带过来的东西应该会比较好睡，因此来到这里后，我还是把黑猫放在枕边。","我深深吐出一口气，张开眼睛。","今天有行程。","昨天做了根本不想做的约定，害我得跟仙台同学一起去买快煮壶。无论是睡前还是现在，我都不想去。我连这个房间都待不习惯，想跟仙台同学一起出门简直比登天还难。","「唉～」我又大大地叹了一口气，视线往下挪动。","地上有一只从背部长出面纸的鳄鱼。","尽管只是枝微末节的小事，但看到该在的东西出现在该在的地方，我才觉得这里是自己的容身之处。","希望这个房间能早点变成我的房间。","我把黑猫放到枕边，慢吞吞地爬起来打开衣柜。","每到早上，我总是犹豫不决。","我不晓得自己该直接穿用来代替睡衣的休闲服走出房间，还是应该先换套衣服。搬来这里之前，我起床后总是穿着休闲服刷牙跟吃早餐。可是现在仙台同学也在，我不太想穿着休闲服在家里晃来晃去。","仙台同学应该还在睡。","怎么办？","短暂思考后，我抽出上衣和牛仔裤换上，然后整理床舖。准备踏出房间前，我伸手拿起躺在枕边的黑猫。","不可以擅自进入对方的房间。","虽然昨天这么约定，可是仙台同学有违反规则的前科。","为了排除任何隐忧，我将黑猫放到书柜上。其实玩偶放在哪里都无所谓，但如果仙台同学知道我把黑猫放在枕边，她一定会说些什么。很讨厌。","被我从固定位置挪动的黑猫。","地板上的鳄鱼。","整理好的床舖。","确认完这些，我走出房间。","作为共用空间的开放式厨房里没有仙台同学的身影。","刷牙洗脸回来后还是没看到仙台同学。我打开冰箱，迟疑了一下，拿出柳橙汁倒进玻璃杯，然后看向桌面。","桌上有个放着剩余面包的袋子。","我把玻璃杯放在袋子旁边。","因为不清楚仙台同学的喜好，我东挑西选地买了超过两人份的晚餐。我不讨厌面包，但也觉得自己买太多了。","「早安。」","随着这声问候，看似刚起床的仙台同学闯入我的视野。","「早安。」","「我先去洗脸。」","仙台同学带着睡意这么说，消失在盥洗室。","我坐到椅子上，喝了一口柳橙汁。","时间过得很慢。","这一分钟就像在上无聊的课一样漫长。即使再次钻进被窝多半也睡不着，但待在这里实在无事可做。我一边喝柳橙汁，一边犹豫着要不要回房间。看着内容物还剩半杯以上的玻璃杯时，我听见仙台同学的声音。","「早餐可以吃这个吗？」","我转向声音来处，仙台同学没有看向这边。她盯着玻璃杯询问，并拿起盛装面包的袋子。","「可以啊。」","「话说回来，宫城你是不是太早起了？」","「仙台同学也起得很早啊。」","「我正好醒了。」","穿着宽松休闲服和牛仔裤的仙台同学这么说，大大地伸了个懒腰后坐到椅子上。她的视线还是固定在我的玻璃杯，我只好无可奈何地发问。","「你想喝吗？」","「一口就好。」","「那你喝啊。」","我没等她回答就站起来，把玻璃杯递给仙台同学。她没看我，说了句「谢谢」后接过我喝到一半的柳橙汁。如她所说，仙台同学只喝一口便把玻璃杯放回桌上。","仙台同学早上偶尔会像这样别开视线。","说不定是我多心了，仙台同学可能只是刚起床，脑袋还昏昏沉沉的，过一段时间才会清醒。但我觉得不太舒服。这种时候，我会听到体内深处传来骨头摩擦的沉闷声响。","「仙台同学，你喝光啊。」","「我不喝了。」","「那剩下的怎么办？」","「宫城你喝啊。」","算不上一如往常，但对话还是延续了下去。","这或许该归功于昨天订下的规则。","感觉还需要花上一段时间，仙台同学才能完美融入我的生活。这样的相处模式比之前好多了，但我不认为对话能就此延续。因此在空档出现前，我提出了就算不说话也能消磨时间的方法。","「我要吃早餐。仙台同学呢？」","听我这么宣布，仙台同学站了起来。","「我也要吃。我去倒一杯柳橙汁，宫城你还要再喝一点吗？」","「不要。也不用拿盘子。」","「为什么？」","「那样就要多洗盘子啊。」","「是没错啦。」","那个回应透出些许不满。过了一会儿，仙台同学带着装有柳橙汁的玻璃杯回来。","「仙台同学，你先挑。」","等她回到座位，我把装面包的袋子推过去。","「昨天是我先挑的，所以宫城你先挑啦。」","「没关系。仙台同学先挑。」","「这种事情应该要轮流吧？」","「我吃你挑剩的就好。」","「嗯～那宫城你帮我挑。」","仙台同学把那袋面包推回来。","「我不是叫你先挑吗？」","「没差吧？反正不管怎样，我都会吃先被挑出来的面包，宫城吃剩下的。」","仙台同学微微一笑，说出乍听之下没错，仔细想想又不太对的话。","虽然很想反驳，但她说的也不完全错。我只好乖乖从袋子里拿出红豆奶油三明治和核桃面包推给仙台同学，把剩下的奶油面包跟面包卷放在自己面前。","「我开动了。」","这么说完，仙台同学开始吃核桃面包。我也说出「我开动了」，咬下奶油面包。","自从妈妈离开后，我独处的时间总是比较长。","现在，仙台同学和我在一起的时间比任何人都长。","——即使我没有付给她五千圆。","我又咬了一口奶油面包，看向仙台同学。","我们的关系跟之前不一样了。","这点我明白。","仙台同学准备了名为室友的关系，我也接受了。然而，即使转变为新的关系，我现在还是很在意仙台同学为何听从我的命令。她明明不需要那些五千圆。","对我来说，五千圆的存在非常重要。想把仙台同学留在身边就绝对不能没有五千圆。对仙台同学而言，五千圆必须是她不得已听从命令后获得的奖励，不应该是存起来不花用的东西。","差点又要叹气了，我于是喝了一口柳橙汁。","再次看向仙台同学。","在我的视线前方，她静静地吃着面包。","没有打算开口。","我不想聊天，所以她不说话也无所谓。但她光是默默坐在对面，我就会开始在意一些不该在意的事。","如果我以前没有给她五千圆，仙台同学会怎么做？","假如拿掉这个媒介，眼前这个不曾花掉五千圆、全都存起来的仙台同学还会跟我共度那些时光吗？","会让我命令她吗？","事到如今，我也无从得知了。","一旦试图去解决这许许多多的「为什么」，我的脑袋就会吵吵闹闹得静不下来。可是我也觉得解决这些「为什么」会使我们现在的关系发生变化。","「宫城。那个面包不好吃的话，我跟你换吧？」","始终默不作声的仙台同学这么说，拿起红豆奶油三明治。我咬下还剩半块以上的奶油面包。","「不用换。我只是很困，所以在发呆。」","「这样啊。话说今天的午餐可以在外面吃吗？」","语毕，仙台同学一口吃掉剩下的核桃面包。","「可以啊。我吃完这个会先回房间，等时间到再出门。」","「好。」","我们一边吃面包一边断断续续地聊着不重要的小事。我和仙台同学原本就没有共同话题，以前即使对话中断，我也不在意。可是来到这里后，沉默会让空气变得沉重。我勉强寻找话题延续对话，把剩下的柳橙汁和面包全塞进胃袋。","「仙台同学，我们几点要出门？」","「十二点应该差不多会饿，十一点左右出门吧。」","「好，那就十一点。」","我这么回应仙台同学，然后回到房间。","一下倒在床上，一下翻翻漫画打发时间。","房里待起来不太舒服，但我不想出去。感觉在共用空间和仙台同学大眼瞪小眼只会更不自在。","就这样打着消磨时间的名义窝在房里时，约好出门的时刻也逐渐接近。","我打开衣柜，看向带着春天色彩的裙子。","那是毕业典礼后买的，一次都没穿过。","我将它拿出来放在床上，开始思考。","假如穿着这条裙子走出房间，仙台同学会认为是因为她叫我穿，我才穿裙子。即使我只是刚好看到衣柜里的裙子，碰巧拿出来穿，也会搞得像我是为了仙台同学而穿。","原本充裕的时间流逝殆尽，已经快十一点了。","我把裙子放回衣柜，拿出针织衫。","把针织衫套在原本的上衣外面后走出房间。","「你准备好了？」","看起来在等我的仙台同学这么问，我回答：「准备好了。」她刚才穿着的宽松休闲服换成衬衫，牛仔裤也换成裙子。","「那我们走吧。」","就算我没穿裙子，仙台同学也没有说什么。","你明天穿裙子好不好？","我知道她昨天只是一时兴起，没有多想就说出口。她不是真心想看我穿裙子。","仙台同学拿着包包走向玄关。","我跟在她身后。两人一起穿上鞋子，踏出家门。","从三楼走下楼梯，两人一起走在平常我总是独自经过的人行道。","我没有和仙台同学并肩而行。","而是毫不犹豫地跟在她后面，相隔一点距离。","汽车驶过的声音。","小孩子嬉闹的声音。","四月里不冷不热的微风。","平时看惯的景物似乎有哪里不同，但我还是压下折返的念头，像机器人般持续迈步前进。","我有问她要去哪里。","可是我只知道住家和大学周遭的环境，不清楚她说的地方在哪里。持续跟在仙台同学后面一点的位置，弯过几个街角后搭上电车。我不想改变我们的相对位置，但电车里有不少人，我只好站到仙台同学旁边。","窗外流逝而过的景色很陌生。","这里没有我的容身之处。","搬到这里后，我一直是个外人。即使今天和仙台同学在一起，这点也没有改变。不晓得要经过多少时间，流逝而过的景色才会变成属于我的东西，那间房子才会变成我的家。这不是仙台同学的错，可是我至今仍无法融入新的环境。我知道闷闷不乐无法解决任何问题，但我还是很忧郁。总觉得再这样下去，抵达目的地前我就会先下车，于是将视线移向仙台同学。","「干嘛？」","仙台同学这么问。虽然没有转头，但她似乎察觉到我的视线。","「没事。」","「你已经累了？」","「我不累。」","我冷淡的回应中断了对话。","仙台同学看向窗外。","过了一会儿，窗外的景色停止流动，车门打开了。","方才喧闹的车厢变得更吵了。","等乘客上下车，车门关闭后，仙台同学平静地叫了我一声：「喂，宫城。」","「你早上为什么喝柳橙汁？」","离站的电车逐渐加速。","我也和仙台同学一起看着窗外。","「没有为什么。」","「是喔。那你为什么一直躲我？」","对话自然地进行，仿佛以固定速度流逝的景色，落在截然不同的地方。","「『那』是怎样？这件事跟柳橙汁完全无关啊。」","因为她过于自然地转换话题，我忍不住出声抱怨。","「没差啦，回答我。」","身旁传来她和平时无异的轻柔嗓音。","我将原本固定在窗外的视线转向仙台同学。与方才的语气截然不同，她的侧脸挂着异常认真的表情，让我没办法随便回答。","「……因为我不晓得该怎么做。」","「果然。」","「因为仙台同学你一直在家啊。」","这话不应该告诉她本人，但现在的气氛也不容我含糊带过。无奈之下，我只能实话实说。","「我们毕竟住在一起啊。就算你觉得我不在家比较好，我也会很伤脑筋。」","「我又没说你不在比较好。」","「试着习惯我啦。被你这样躲会让我很受伤。」","仙台同学的视线从窗外转到我身上。","「——对不起。」","虽然不是刻意要躲她，但我觉得这是自己的错，于是道歉了。","可是仙台同学有时候也会躲我，时不时会像今天早上那样别开视线，所以该认错的不只我一个。但我很难开口抱怨，因为她没像我逃避得那么明显。","「不在家的时候，你去找宇都宫了吧？」","仙台同学用试探的口吻问道。","「是没错。」","「你们平常都去哪里？」","跟舞香有约。","作为出门的理由，我每次都这么告诉仙台同学。但被问去了哪里，我实在答不上来。","「就算你问我去哪里，我们也没去什么值得一提的地方。」","「你这样讲我怎么知道是哪里？」","「……附近。」","「我就是在问你『附近』是哪里啊。」","「我对这里不太熟，所以都交给舞香决定。」","「即使都交给她决定，你们还是一起去了哪里吧？」","「不是什么大不了的地方。」","这不算说谎，因为我跟舞香的确没去什么特别的地方。但我说的也不全是实话。","我跟仙台同学说「跟舞香有约」时，大概有接近一半的次数没有和舞香见面。几乎都自己去书店或咖啡厅打发时间。如果详细说明去了哪些地方，她可能会发现我没和舞香碰面。","「好吧，算了。」","尽管语气听起来不像有接受我的答复，仙台同学仍没有继续追问。她的放弃让我松了一口气。可是成功让她安静下来之后，我反而不晓得仙台同学感兴趣的部分到底是什么了。","是舞香？是我们去的地方？还是我？","我虽然有点介意仙台同学真正想问的事情究竟是什么，但电车在这时摇晃了一下，景色流逝的速度逐渐慢下来了。","「要下车了。」","仙台同学的声音打断了我的思绪。","下车并简单吃过午餐后，我们用走的前往目的地。","明明只要快煮壶，我们却花了不少时间。","这不是急迫到会影响生活的东西，照理来说可以用网购。不然在家附近也买得到。不需要特地跑来一个得搭电车，一起吃午餐，再走一段路才能到的地方买。","「宫城，我们到了。」","刚才顾着走路、一直保持沉默的仙台同学开口了。我们抵达了目的地。别说家电，感觉只要不是太奇葩的东西，这里几乎都有贩售。","仙台同学搭上电扶梯，我站在她的下一阶。","虽然一样，却又不一样。","映入眼帘的是仙台同学的长发。开始共同生活后，它有时会被绑起来，有时不会。今天的仙台同学和高中时一样，将左右两侧的头发编成公主头，束在脑后。从这个角度看不见，但她脸上现在也带着早上起来时没有的妆。","除了身上穿的不是制服，她明明做了跟高中时期几乎一样的打扮，我却觉得仙台同学和那时候的她感觉不像同一个人。","不，正确来说，是我没有用和那时候同样的眼光来看待仙台同学。","一定是因为那些没被花用的五千圆。","我不晓得这份感情该何去何从。","在我心中，新的生活与不一样的仙台同学都变成非常不稳定、不知该如何处置的事情。我们还是高中生时，我靠着「支付五千圆」大致收束整顿了这份感情。可是五千圆消失后，这些无法解释的感情也失去了安身之处。","如果能回到还穿着制服的那段时光，我就什么都不需要思考了。","我不需要烦恼早上该穿什么走出房间，不用为中断的对话感到不安。仙台同学不会叫我穿裙子，我也不用在意自己没穿裙子，她却什么都没说这种事。","我走出电扶梯。","接着又搭了往上的电扶梯。","在我视线前方的背影挺直了背脊。","一头长发漂亮得令人想触碰。","我呼出一口气，意识到自己差点伸出手。","大概是累了。","因为睡得不太好，脑袋没有在运转。","「宫城，这边。」","仙台同学没搭上下一阶电扶梯，直直往前走。跟在后面的我立刻看到架上陈列的快煮壶。仙台同学一边喃喃说着「该选哪个好呢？」，一边确认似的拿起几个快煮壶。而我看着那样的她。","有外型圆润的，有壶口细长的。","被仙台同学认真检视的那些快煮壶，不管是颜色还是形状都不一样。功能应该也不一样，但我觉得只要能烧热水就好，挑哪个都无所谓。然而，她很认真地做比较。我不打算催促，但感觉她可以挑得更随意一点。","「宫城你觉得哪个好？」","那双方才还注视着快煮壶的眼睛，倒映出我的身影。","「都可以。话说你没有先做功课吗？」","「我姑且有查到一些看起来不错的。」","「既然这样就选那个啊。」","「有两个候补选项，你就选一个嘛。」","「这个跟这个。」仙台同学边说边轮流指向两个快煮壶。","「我都可以，选仙台同学喜欢的吧。」","「就算都可以，还是有个人偏好吧？」","「就是没有啊。」","「那选这个好了。」","语毕，仙台同学指向比较大的快煮壶，然后看着我说：「颜色由宫城你决定。这是要一起用的东西，你多少帮忙选一下啦。」","「我没有特别喜欢的颜色。」","烧热水的功能与颜色无关。","无论是白、黑，还是红，挑个喜欢的颜色就好。再说，我对快煮壶没兴趣，让想买快煮壶的仙台同学挑自己喜欢的颜色比较好。","「……宫城，你跟宇都宫去逛街买东西的时候也都是这样吗？」","仙台同学的话里掺杂着叹息。","「『这样』是怎样？」","「态度冷漠。不肯帮一点忙。」","她责备的口吻勾起我的罪恶感。","假如是跟舞香一起，我不管做什么都会更认真地思考。如果要买快煮壶，我会问她想要的功能，也可以帮忙挑选款式跟颜色。应该说，只要对方不是仙台同学，无论什么事我都能普通应对。但换成仙台同学，我就会突然做不到那些跟其他人一起时，理所当然能做到的事。","——相反的，我有时会做出跟其他人相处时不会做出的行为。","「你无论如何都不想选吗？」","听见仙台同学的声音，我认真地看向架上陈列的快煮壶。然后，我做了一次深呼吸，说出最安全的颜色。","「白色好了。比较有快煮壶的感觉。」","「与其说快煮壶，不如说有家电的感觉吧？」","「那改红色好了。」","「知道了，就选白色。」","看到我因为意见相左改选其他颜色，仙台同学露出开朗到不自然的笑容，拿起白色的快煮壶走向收银台。我只好跟过去，两个人一起结帐。","「这样就买完了吧？」","听我这么问，她简短地回了声「嗯」。我以为接下来大概要照原路回去了，可是仙台同学说她有个地方想去，搭了向上的电扶梯。","「不回去吗？」","我多问了一句。虽然没说要去哪里，但仙台同学那个稳健的步伐怎么看都已经决定好目的地了。","「我想绕去别间店看一下。」","「你有想买的东西吗？」","「没有。但时间还够，去一下也没关系吧？」","如此说道的仙台同学微微一笑。","她笑得温柔，那个眼神却不像在征求意见。","与其付出无谓的劳力，我选择默默地跟着仙台同学。","一起吃午餐，一起购物。就算没有想买的东西也可以随意逛街。","比起一直逃避仙台同学，我觉得今天做的事情很开心。这也是非常理想的周日行程。可是我不知道这是不是一般室友之间正常的距离感。","「宫城，这里。」","走下电扶梯后，我被仙台同学拉到一座玩偶堆成的小山前面。","「你喜欢这种东西吧？」","仙台同学用爽朗的语气说道。","我不晓得她究竟是怎么看我的。","除了玩偶，这层楼明明还有很多可爱的小东西或玩具。她却理所当然地把我带到玩偶堆前面，擅自认定我喜欢这种东西。这让我忍不住想问，在仙台同学心里，我究竟是怎样的人？","我没有在收集，也没有在房里摆满玩偶。","单纯看看倒是不排斥。","反正不是非得立刻回去，所以我走近玩偶，拿起几个看看又放下。往店里走去，那里也放着许多软绵绵的玩意儿。其中一个东西让我停下脚步，它的形状类似我放在房间里的鳄鱼。","那是什么啊？走近一看才发现它是面纸盒套。","说起来，厨房里的面纸盒还没有盒套。","我拿起深褐色的面纸盒套。","「那是什么？」","旁边的仙台同学看向我手里的东西。","「鸭嘴兽。」","「总觉得好像在哪里看过。牠是一种哺乳类动物吧？」","「应该是。」","我的记忆有些模糊，但鸭嘴兽好像是一种会产卵的奇怪哺乳类。","「宫城你很喜欢这种东西耶。」","「我也没有特别喜欢。」","「不喜欢也无所谓，这个满可爱的啊。」","这么说完，仙台同学从我手中拿走鸭嘴兽，抚摸它的头。","「给我，我要拿去结帐。」","我拉了下仙台同学手里那只鸭嘴兽的嘴巴。","「没关系。我去结帐。」","「为什么？」","「这个要放在厨房吧？那就是我们要一起用的东西，我会拿共用资金来买。」","仙台同学讲得理所当然，上下摆动鸭嘴兽的手。","「我又没说要放在厨房。」","「不是吗？」","「……是没错。」","「那我去结帐。」","仙台同学没等我回答就迈出步伐。","结果我只能跟在后面，鸭嘴兽也被她用「共用资金」买下来了。","我很看不惯仙台同学的这种地方。","她总是抢先完成我要做的事。","就算出声抱怨，她也绝对不会听我说话。","「那我们回去吧。」","看来今天的行程告一段落了，仙台同学明确地踏上归途。我们花费同样的时间返家。","沉默不会难以忍受。","我们没有绕路，途中也没有聊多少闲话。搭乘电车，再走一段路回到家里。","仙台同学立刻拆开刚买回来的快煮壶，泡了红茶。我坐到对面的餐桌，她把装有面纸盒套的袋子递给我。","「给你。」","「仙台同学拆啦。」","我说着便把袋子推回去。她默默地从袋中拿出鸭嘴兽，然后指向我手边的面纸盒。","「那个给我。」","「拿去。」我听话地把面纸盒递过去。但仙台同学没有接过面纸盒，她抓住了我的手。","心脏扑通一响。","仙台同学的手劲很大。","被紧紧握住的手好痛。","仙台同学什么都没说。","放在从前，她这种时候会吻我。","但她今天什么都没做。","那是当然的。","因为她和以前不一样。","仙台同学身上的裙子不是制服的格纹裙。她不再是高中生，而是我的室友。规则里没说她可以吻我。","——可是也没有一条规则说不可以。","「抱歉。」","仙台同学平静地这么说，并松开我的手。","她接过面纸盒，套上盒套。","我们没有针对接吻设下明确的规则。就算有明文禁止，仙台同学一旦不想遵守就会轻易违反规则。明明是这样，她却表现得仿佛今天什么都不做是讲好的规则。","我讨厌仙台同学的这种态度。","「嗯，装好了。」","仙台同学将装着鸭嘴兽盒套的面纸盒放在不算大的餐桌。","桌上放了装着吐司和炒蛋的盘子，还有柳橙汁。","面前摆着典型的早餐菜色，仙台同学坐在餐桌另一侧。","以前无论是念书还是吃饭，仙台同学都在我身边。所以我还不太习惯她坐在对面。","可是再过一周。","说不定得花上将近一个月。在一起吃饭的过程中，我应该会渐渐习惯仙台同学坐在我面前吧。","我在吐司上涂抹奶油和果酱，然后看向装着有色液体的玻璃杯。","「仙台同学，为什么是柳橙汁？」","「你比较想喝汽水吗？」","「我以为会是红茶。」","不管吃什么或喝什么都可以。","我没有特别坚持。","早餐是仙台同学准备的，我当然不可能抱怨，只是有一丝丝不满。因为她没有用昨天特地去买的快煮壶，而是倒了柳橙汁放在桌上。","「如果宫城你觉得早上喝红茶比较好，我明天开始就改泡红茶。」","我看向仙台同学。","对上眼了，但她没有挪开视线。","这让我松了一口气。","我不想从早上就坏了心情。","「喝不喝红茶都无所谓，可是快煮壶呢？」","「你希望我用？」","「既然不用就不需要特地去买嘛。」","「就算不是马上要用，还是需要啊。而且去买东西很开心吧？」","「不是那个问题。」","我咬下吐司，喝了一口柳橙汁。仙台同学也吃起抹上奶油和果酱的吐司。","「就是这样。不说这个了，宫城你吃完早餐要去大学吧？」","没说清楚什么时候才要用快煮壶，仙台同学就切换了话题。","「对。」","「赶时间吗？」","「没有。」","「这样啊。」","对话就此中断。我不晓得仙台同学接下来要做什么，但刻意去问好像会过度干涉她的生活。在这个迟迟无法开口的过程中，盘子和玻璃杯也被清空了。","「仙台同学，碗盘给我洗。」","如此宣告后，我从餐桌上收走两人份的盘子和玻璃杯。","「没关系啦，我来洗。」","「可是早餐都让你准备了。」","「那就麻烦你了。」","仙台同学说完便走回房间。我也迅速洗好碗盘，回到房间。虽然不赶时间，不过从这里到大学还有一段路程，所以我想提前准备。","我打理好自己，看向镜子。","果然还是希望有制服。","每天早上都要搭配服装很麻烦。真羡慕过去那个只要一套制服就能解决所有问题的自己。「唉～」我叹了一口气，拿着该带的东西打开房门。化妆完毕的仙台同学正在共用空间。","「我要出门了。」","我朝椅子上的她招呼一声，打算直接走向玄关。这时，仙台同学起身抓住我的手臂。","「宫城，等一下。」","「干嘛？」","「脸借我一下。」","「脸？」","「我帮你化妆。」","仙台同学粲然一笑。","她的心情好像特别好，大概不是什么正经事吧。","「……不用。我会迟到。」","「你刚才不是说不赶时间吗？」","「是没错，但那也不代表我有空。」","「涂个口红怎么样？你的嘴唇干干的。这点时间总该有吧？」","仙台同学的拇指碰上我的嘴唇。","指尖轻轻地压上来，仿佛在确认触感似的轻柔抚摸。","我不讨厌仙台同学的手指。","久违地透过唇瓣感受到她的指尖，其实很舒服。","「宫城，可以吗？」","移开指尖后，她这么问。","「没那么干。」","刚才照镜子的时候，我的嘴唇看起来不是很干。","「就跟你说干干的了。先坐下嘛，很快就好。」","手臂被拉扯，我也反射性地伸出手。","就像仙台同学对我做的那样，我把拇指按上她的嘴唇，指尖用力地抹过唇瓣。她唇上的口红被抹开，沾到我的手指。","「喂，宫城。」","仙台同学抓紧我的手臂，用比平常更低沉的语气开口。","「要重新补上这个，仙台同学就没时间了吧？」","「你是笨蛋吗？」","仙台同学好像很傻眼，又补上一句：「你明天有空吗？」","「没有。」","我甩开仙台同学的手，转身背对她。","「抽点时间出来啦。我会把你变得很可爱喔。」","「不用。」","「让我帮你嘛。」","「都说不用了。」","「只是化妆而已，让我帮忙又不会少块肉。宫城你真的很小气耶。」","「仙台同学你很啰唆耶。我要出门了。」","套着鸭嘴兽盒套的面纸盒放在收纳柜上。我没有抽面纸，而是直接离开饭厅前往盥洗室。我在镜子前站定，放下手里的东西并打开水龙头。","我看着拇指。","它染上和仙台同学的嘴唇一样的颜色。","镜中的自己没有干燥的嘴唇。","果然是骗人的。","染上淡淡色彩的拇指蠢蠢欲动。我用食指触碰嘴唇。","指尖流畅地滑过唇瓣来到嘴角。","拇指抖动了一下。","脑中闪过她那柔软的嘴唇，我连忙洗手。","拼命搓揉。","我把弄脏的指尖仔细地洗干净，然后踏出家门。","搭上电车，花了不少时间前往大学。","如果能住得近一点就好，但这也没办法。","我穿过校门，走进大学校园。","这间让我怀疑是否走错地方的大学也跟新的房间一样，还没成为属于我的地方。除了舞香，我有认识几个碰面就会聊上几句的对象，不过还不到能交心的程度。而且大学有很多麻烦事。","其中最麻烦的就是选课。","自己决定想上的课并安排课表。","因为必须考虑毕业学分，安排课表这件事变得超级麻烦。如果我和仙台同学读同一所大学，她应该会连同我的份一起安排好。可是她读另一间大学。","我踏进教室，环顾室内。","仙台同学当然不在这里。","我找位子坐下，无力地趴在桌上。这时，隔壁传来放东西的碰撞声，某人喊了一声「志绪理」。抬起头后，我发现是舞香。","「睡眠不足吗？」","舞香说着便坐到我身旁。我一开始也不习惯没穿制服的舞香，但现在已经习惯了。高中时期没画的淡妆，如今在我心中也成为舞香的一部分。","「没有，我有睡饱。比起这个，昨天真的很抱歉。」","我周六有打电话跟舞香说「对不起」。","可是今天还是先道了歉。","虽然跟仙台同学说那天有空，但我周日其实跟舞香有约。对于自己取消原本的约定，优先安排后来才冒出的行程一事，我充满了罪恶感。","「没关系啦。你昨天去买什么啊？」","跟一起住的人去买共用的东西。","我这么告诉舞香，然后和仙台同学一起去买东西。","「快煮壶。因为家里没有可以用来烧热水的东西。」","「现在才买？」","「前阵子忙东忙西的，一直没能去买。」","「你是跟亲戚一起住吧？」","「嗯。」","我隐瞒了室友是仙台同学这件事。","不是没有机会说，可是我不晓得该怎么解释仙台同学的事。最后只说和亲戚住在一起。","我知道总有一天得全盘托出。如果发现对方是仙台同学，舞香一定会要我解释和仙台同学成为室友的经过。然而，我心中没有这个问题的答案。","「那个人很神经质吗？」","「为什么这么问？」","「因为对方说不能找朋友到家里玩，感觉很神经质。」","住在这个家里的其实不是亲戚，而是仙台同学。如果舞香跑来玩，事情就麻烦了。","所以上大学后，我立刻编出「不能找朋友来家里玩」的规则来应付眼下的状况，并这么告诉舞香。一再说谎让我过意不去，但目前还不能让舞香知道我的室友是仙台同学。","「嗯～应该算普通吧。」","「普通喔。好吧。」","虽然舞香看起来还想说什么，但没有继续追问。","她总是这么善解人意。","我从高中时期就一直很依赖舞香，成为大学生后依然如此。","「话说回来，因为昨天志绪理没来陪我玩，我试着打了耳洞。」","「耳洞？」","听见舞香的话，我看向她的耳朵。上面有个小小的银色耳环。","「你自己打的？」","舞香出乎意料的行为让我忍不住反问，她回了一句：「对。」","她没有变得花枝招展或是改变交友性质。可是我感觉她更时髦了。虽说化妆也是其中一环，但她和高中时不一样了。","随着环境改变，舞香也跟着变了。仙台同学还是一样。不，她或许也变了，只是没有在我面前展现。这么一想，我有种被抛弃的感觉。","「意外地很适合你呢。」","我看着耳环这么说，舞香则夸张地皱起眉头。","「『意外』是多余的。」","我说自己是开玩笑的，开启「在哪里买的呀？」之类的话题。这时，教室的门被打开了。一位看起来有点凶的老师走进来，开始上课。","感觉上大学后会打耳洞的仙台同学没有打，反而是舞香打了耳洞。好像有哪里不太对。","仙台同学迟早会打耳洞吗？","不晓得。","我从高中时期就不了解她，成为大学生后更不了解了。我对在大学里的仙台同学一无所知。","以前听仙台同学提起某个朋友，我脑中就会浮现对方的长相。讲起课堂上的事情，我也会想起那个老师的脸。我以前几乎能够想像她在学校里的模样，现在却什么都想不到。","这种时候，仙台同学在做什么呢？","传个讯息就能得到答案。","可是我无法想像那个画面。","我对此感到不满。因为这种鸡毛蒜皮的小事感到不满的自己，同样让我相当不满。","真无聊。","无论是遵守应该遵守的规则的仙台同学，还是我自己。","我看着拇指。","然后用指尖抚过嘴唇。","〔本话含插图〕"]},{"t":"第3话　我和宫城之间的那道墙","p":["我朝宫城伸出手。","触碰并用手指梳开那头黑发。","顺势抚上她的脸颊，手指滑上唇瓣。","宫城没有反抗，她也没有任何反应。","平常总是嫌东嫌西地不停抱怨，今天却很温顺。把脸凑过去，她会不知所措地闭上眼睛，还真坦率。","双唇交叠，我将舌头伸了进去。","她没有推开我的肩膀或咬我的舌头。如果她突然变得积极，我可能会被吓到，但不反抗的宫城也让人觉得不舒服。要是对本人说这种话，她绝对会生气，所以我选择先留在心底。","几次接吻后，我把嘴唇抵上她的脖子，不留痕迹地让唇瓣滑过。宫城轻轻逸出一声叹息。我松开她的领带，拉下来。逐一解开衬衫的扣子，缓缓露出胸口。","白色的内衣与看似相当柔软的肌肤。","我解开所有扣子。","只要伸手触碰内衣，隐藏在底下的部分就会暴露。","心脏怦咚一跳。","本想伸向胸部的手最后摸上她的头发。在锁骨落下一吻后，宫城用力抓住我的肩膀。宫城的体温透过我的嘴唇和她的手心传来，我却不晓得那究竟是冷是热。我将手滑向宫城腰间，紧紧地按住。宫城没有拒绝或出声制止，于是我脱下那件衬衫，将她推倒。","我很清楚。","这是梦。","暑假和寒假。","在那段期间发生过的事。","由许多过去交织而成的梦境。","我们身上的是早就穿腻的制服，现实中已经不再穿了。而且来这里之前，我做过好几次这样的梦，来这里后也多次梦见。","早点醒来比较好。","可是我还想在梦里多待一会儿。","我轻轻咬上宫城的肩头。","很柔软，也能感觉到她的体温。","梦境明明如此清晰，一切却又那么朦胧。倒映在我眼中的是宫城，传来的触感也毫无疑问是宫城。但我不清楚她究竟有多柔软，也不晓得她有多温暖。所有的感官都被打开、交融在一起。","「宫城。」","我的呼唤得不到回应。","我想听她的声音，所以褪下遮住胸部的内衣。","宫城还是默不作声。","不管我用手还是嘴唇触碰，她始终不发一语。从安静到不自然的她身上，我只能感觉到清晰又暧昧的触感。","明明没有仔细触碰到足以留下记忆的程度，我却知道掌心下丰满的部分是柔软的。记忆创造出来的梦境，如我所愿地补足了所有未知的部分。","我褪下她的裙子。","宫城果然没有反抗。","我的手滑到肋骨下方柔软的腹部，抚摸腰间突出的骨头。","碰到内裤的手稍显迟疑。","我明白这是梦，但不晓得是否该更进一步。","听到她撒娇地喊着「仙台同学」，我的手继续动作。","总算听到的声音，是我所不知道的声音。在这种情况下，宫城不可能做出这种反应，她也没那么坦率。宫城或许会口吐怨言，但绝对不会用撒娇的语气叫我。这点事情我还是知道的。","就算心知肚明，我还是缓缓地将手伸进内裤。","然后。","然后——","然后————","我的手碰到铃铃作响的手机。","「……我就知道。」","「唉～」我叹了一口气，关掉闹铃。","放下手机，把掌心贴上墙壁。","宫城就在我的床舖旁边，在这面墙的另一边。","这大概就是问题所在吧。","我和宫城现在的距离太近了。","我还保有分辨什么事情可以做、什么事情不能做的理性，但无法控制梦境。","开始共同生活后，我很清楚自己不能对宫城做出我梦见的那些事。然而，若说我完全不想做那种事就是在说谎。就是因为宫城在触手可及的范围内，我才会做那样的梦。","「……太差劲了。」","这不是什么美梦。","宫城也万万想不到墙壁的另一侧有个会做这种梦的人吧。","大概是因为这样，我觉得自己做了非常糟糕的梦，忍不住想诅咒自己。","我挺起身体，又倒回床上。","不想踏出房间。","可是我必须去大学。","四月过了一半，选课也已经结束。我的课表排定，总算开始过上大学生活了。可不能从现在就养成跷课的坏习惯。","我赖床赖到说睡了回笼觉也不为过的时间，然后下定决心从床上爬起来，打开衣柜。","穿睡衣出现在共用空间感觉太随便了。也许再过一段时间，我会变得不在意打扮，直接穿睡衣出去。可是在那天到来之前，我想穿得更像样一点。","我想起借住在宫城家时的事。","我当时跟宫城借了休闲服来当睡衣。考虑到目前合租房子的情形，休闲服倒是个不错的选择。感觉只要放弃睡衣，像宫城那样改穿休闲服就不用特地换衣服了。","我从衣柜里抽出衬衫和裙子，决定近期内去买用来当睡衣的休闲服。换好衣服走出房间后，我看到宫城在做早餐。","虽然说好一起吃晚餐时要两个人一起准备，但我们没有决定由谁来做早餐。大致上都是先起来的那个人做早餐，没做早餐的那个人负责洗碗。不知不觉间形成了这样的规则。","宫城的厨艺不算好。然而，不是由自己，而是其他人准备的餐点，光是这样就让我觉得相当美味。","「早安。」","我对着宫城的背影打招呼。","「早安。」","只要说「早安」就会得到回应。这样有人帮忙准备早餐的早晨真不错。","——如果我没做梦的话。","即使不是我自己想梦见的，做了那种梦的日子还是会觉得尴尬。我没办法直视宫城的脸，也不晓得该用什么表情和她共处一室。来这里之前——高中三年级时，我们就算念同一所学校也在不同班级。只要我想避开她，在放学之前都不会和她碰见，所以能用比现在更平常的心态面对宫城。","可是现在跟那个时候不一样。","一打开房门，宫城就在那里。相当于早上到放学后，我想要在这么长的一段时间内避开宫城，几乎是不可能的事。","「你在做什么？」","心情还没整理好，但一直保持沉默也令人坐立不安。我朝看着平底锅的宫城搭话，却没有得到回应。","「宫城？」","我试着叫她的名字，但宫城依然保持沉默。这让我开始担心早餐的状况。","我现在的脸色八成不太好，可以的话不太想接近宫城。话虽如此，我还是很在意。走到她身边后，我发现平底锅里有个介于荷包蛋和炒蛋中间的东西。","「蛋黄破了？」","我问宫城，她则小声回应。","「它自己破了。」","宫城转过来面向我。","「反正不管是荷包蛋还是炒蛋，吃进肚子里都一样。没差吧？」","「是没错啦。」","我能感觉宫城的视线随着声音一起投来，可是没办法和她对上眼。","「我去洗脸。」","我转身背对宫城，走向盥洗室。身后传来「嗯」的简短回应。","我吸了一口气，吐出，再吸一口气。","专注在平常不会留意的行为上，试图平复心情。","洗好脸，再次吸气、吐气。","在我最近梦见的「那种梦」里，现实中从未发生的事情愈来愈多。如果做梦的次数就这样继续增加，感觉梦里的内容总有一天会全是虚构的事。","不能再想了。","我试图把做过的梦塞进脑中一角。没办法忘掉，只能尽可能不去在意。","双手用力拍了一下脸颊，然后走回饭厅。","「早餐准备好了。」","我顺着宫城的声音看向餐桌，上面摆着盘子和柳橙汁。蛋更接近炒蛋，蛋黄和蛋白混在一起。不只烤吐司，她还煎了香肠，上面带着恰到好处的焦痕。","就座后，对面传来一句「我开动了」。我于是跟着说「我开动了」，吃起那个像炒蛋的东西。","一起吃饭的规则以我意想不到的方式实现了。我本来只抱着「要是能一起吃晚餐就好了」的心情提议，宫城却连早餐都会和我一起吃。","「你最近有买书吗？」","我还没办法直视宫城的眼睛，随便找了个话题。","「有。」","「那随便借我一本漫画或小说吧。应该有什么有趣的作品吧？」","「什么都可以吗？」","「有趣的话。」","我咬下抹上奶油和果酱的吐司，盯着宫城的手。她扠起香肠送到嘴边。","「借你是可以，但我不知道仙台同学会不会觉得有趣。」","宫城不满的语气让我抬起视线。","一瞬间和她对上眼了，我的心跳微微加速。","如果用挑书当藉口，她说不定会让我进去房间。这个想法闪过脑中。","「那你让我直接挑。」","今天是我不太想接近宫城的日子。","不过我也不是完全没有想要接近她的念头。毕竟我很在意她的房间变成怎样，也很在意多了一些什么样的书。","「……我会挑好拿给你。」","这么说完，宫城咬下吐司。","爬楼梯到三楼。","穿越走廊来到玄关前，拿出钥匙。","结束大学课程后，我回到了早上和感觉有些不满的宫城道别的家。虽然我已经习惯这样的每一天，开门的瞬间仍会有些紧张。还住在原生家庭时，我从未有过这种感觉。","打开门锁走进屋内，玄关和走廊都笼罩在黑暗中。我开灯看向脚下。宫城放鞋子的位置空着，可见她还没回来。尽管如此，我仍试着开口：「我回来了。」没有得到任何回应。","有一点失望。","如果说出「我回来了」，我希望有人能回我一句「欢迎回来」。","早上做梦的记忆在上学期间已经淡化。宫城不是每天都会比我早到家，只是我现在可以看着她的眼睛说话，所以觉得她要是在家就好了。","「虽然我不知道该说什么。」","我低声自言自语并脱掉鞋子。","宫城没说她会晚回家，这表示我们要一起吃晚餐。我一边思考晚餐的菜色，一边走进家里。果然没有人。","「我回来了。」","我这次对着明显空无一人的饭厅喃喃说道。本来想就这样走进自己的房间，视线却停留在桌上堆放的东西。","「书？」","我凑过去看。结果不出所料，堆在那里的东西是书。有几本是我们来这里合租房子前，我在宫城房间看过的恋爱漫画续集，还有几本连我都听过作品名的少年漫画。","她说的「借书可以，但我会挑好拿给你」原来是这么一回事啊。","宫城早上比我晚出门。看着她留下的东西，我轻轻叹了一口气，把包包放在她平常坐的位置。我知道她不在家，但还是敲了敲宫城的房门。唯有「咚咚」的敲门声响起，房里没有传出任何声音。","「宫城。」","我对着房门呼唤。","当然没有回应。","我把掌心贴在门上。","我和宫城的距离比从前更近，却也比从前更远。她明明在我触手可及的位置，但我无法踏进从前能够进去的地方。","这只手的另一侧是异世界。","是不容许我踏足的世界，不晓得何时才能进去。","我想要去这扇门的另一侧。","想确认我送她的黑猫玩偶是否和以前一样放在书柜上，也想知道面纸是不是长在鳄鱼的背上。我想知道有哪些曾经在那个房间的东西还在，又有哪些不在了。","现在隔开我和另一侧的，只有这扇不算薄，但也说不上厚的门板。","只要稍微移动这只手，我就能打开门，进去房间。","非常简单。","一旦打破规则，我就能立刻知道我想知道的事。就算走进去，只要我什么都没碰，立刻出来，宫城也无从得知我有进去过。","即使打破规则，只要事情没有曝光就不算数。","宫城没发现，我做的坏事就等于从未发生过。","与此同时，我又希望被宫城发现自己有打破规则。","如果违反规则就要听从对方的一个要求。","我们有做这样的约定。如果我没遵守规则，宫城就会像合租房子之前那样命令我。正确来说，那不是命令，也跟之前不一样，可是会发生类似的事情。","「……不行吧？怎么能擅自进入别人的房间。」","就算想打破规则，未经允许就进入对方房间也太过分了。如果被宫城发现，别说惩罚了，她一定会立刻离开这个家。","我把额头靠上门板。","传出小小的一声「叩」，额头变得有些凉。","我将嘴唇凑近门板，吐出肺里的所有空气。","「我在做什么啊？」","今天的我不太对劲，都是因为做了那种梦。说「我回来了」却没听见「欢迎回来」让我有点失望，不过我或许该庆幸宫城不在家。要是她在，应该不会发生什么好事。","「宫城大笨蛋。」","我对着房门口出恶言，转身离开。","从桌上拿起写着「第四集」的恋爱漫画，坐上椅子。","即使快速翻过，我也没办法清楚回忆起前一集的剧情。我想要填补朦胧的记忆，可是第三集在隔着一扇门的另一侧，现在拿不到。","明明就在那里，却远得令人生厌。","我把恋爱漫画放回桌上，决定来看有放第一集的少年漫画。翻开手上的书，一页又一页地看下去。这比追寻想不起来的剧情有趣多了，但过去那个可以自行决定想看哪本书的时光不时掠过脑中，让我无法专心。","尽管如此，我还是看完了第二集，拿起第三集。翻到将近一半时，「我回来了」的声音让我抬起头。","「欢迎回来。」","「你在房间里看就好啦。」","宫城盯着我正在看的漫画封面。","「我觉得你会想听我说『欢迎回来』。」","「你在房间里看也能说啊。」","「可是在这里就能马上说啦，不错吧？」","宫城没有评论。她一脸厌烦地从冰箱里拿出汽水，倒入玻璃杯。然后喝了一口透明的液体，把玻璃杯放在桌上。","她看了过来，与我四目相对。","我没像早上那样回避视线，而是回望宫城。","「仙台同学。你觉得那个有趣吗？」","宫城没有明说，但她会问我有不有趣的东西大概只有我手上的漫画了。","「还好。」","「你看完之后跟我说。我会拿回去。」","这么说完，她打算走回房间。我连忙拿起刚才只有打开来翻阅，几乎没读进去的恋爱漫画。","「宫城，等一下。这个有前面的集数吗？从第一集开始。」","「有是有。」","「那借我。我忘记前面的剧情了。」","我对埋没在记忆中的漫画剧情没什么兴趣，就这么忘了也无所谓。真要看的话，从前一集开始就可以了，不需要特地从第一集开始从头翻阅。话虽如此，我可以拿这个当理由，去做我原本想做的事。","「我去拿来，仙台同学你在这边等我。」","「我跟你一起去吧，书我自己来搬。」","「咦？」","「让我进你房间啦。」","我起身来到宫城身边。","「……不要。」","稍微思考后，宫城这么说。","「为什么？」","「因为仙台同学好像会做奇怪的事。」","宫城这句话让我想起今天的梦。","我大概可以想像她口中「奇怪的事」是指怎样的事。","而我做的梦一定更胜宫城口中那「奇怪的事」，这点让我有些心痛。可是我想进宫城房间不是为了做那种事。我只是想知道，来这里前她不会阻止我进出的那个「她的空间」，如今变成什么样子。","我没有动什么歪脑筋。","没错。我想应该没有吧。","摇摆不定的心情显露在脸上。然而，因为不需要把心中的情感全盘托出，我否定了宫城的话。","「我才不会。宫城你把我当成什么了啊？」","「……室友。」","面对没有正确回答的我，她回答了正确的答案。","正如宫城所言，我们是室友。","而且如果想安稳地度过这四年，我们应该要维持单纯的室友关系。","然而，和宫城一起生活到今天，我心中开始产生疑问。选择当室友真的好吗？我对现在这个受限于名为室友的关系，还无法触碰宫城的环境充满了疑惑。","「干嘛？」","宫城用狐疑的表情看着一语不发的我。","毕业典礼那天，为了把宫城带来这里，我准备了「室友」这个新的关系。这是当时最好的选择，照理来说没有更好的答案了。","「我只是觉得跟宫城当室友感觉怪怪的。」","我似笑非笑地开口，试图让自己接受这个事实。宫城皱起眉头。","「是仙台同学叫我当你的室友耶。你要负起责任，好好当室友啦。」","「是是是。」","我尽量不带感情地回应。","「书我马上拿过来，你等一下。」","「算了。」","「『算了』是什么意思？」","「书就算了，我们来做晚餐吧。」","我没有走向宫城的房间，而是来到冰箱前。","「太早了吧？」","「我饿了啊。」","身后传来她的声音，我随便找了个理由搪塞。然后一边查看冰箱里的内容物，一边问宫城有没有想吃的菜色。","我想踏进封闭房间的愿望没有实现，唯有时间不断流逝。有着开学典礼的四月已经确实地来到尾声。","明明快放连假了，我的行程表还像一张白纸。","家人没有联络我。","我早就知道会是这样，所以根本不在意。被叫回老家也只会让我很不舒服。事到如今，父母不期望看到我回家也不是什么值得伤心的事。不如说我原本就没打算回去，这下正合我意。","我的黄金周没有「回老家」这个选项，可是也只决定了不回去。就算放假也没有特别要做的事，时间多到有剩。","这些多出来的时间，我希望有一部分能和宫城一起度过。","自那次做梦后，又过了几天。我到现在都没听宫城详细说过她连假期间的安排，只知道她跟我一样不会回老家。","重点是在这之后根本毫无进展。","我可以等开始放连假再叫她陪我打发时间，可是我不认为宫城会乖乖点头答应。","我呼出一口气。","看着站在讲台上的老师。","投影片切过一张又一张。","听着老师在教室回荡的说话声，我想起今天早上吃的荷包蛋。","宫城今天煎的荷包蛋非常漂亮，蛋黄似乎没有再擅自破掉了。也许是因为这样，她的心情比平常好。然而，我的一句失言改变了这个状况。","——不应该提起发型的事。","人家常说多一事不如少一事，我也明白这句话是对的。可是人生在世不可能只做对的事情。就像今天早上聊起发型的话题也是因为我最近没办法触碰宫城，一直想引起她的注意，才会老是多说一句不该说的话，惹得她不高兴。","拜此所赐，我还没跟她商量原本想谈的黄金周行程就出门了。","打工机会也找不到，没一件好事。","「唉～」我看着投影片叹了一口气。","上大学后，我会认真地面对必须要做的事情。","人际关系只要差不多就好。","虽然不需要维持优异的成绩，可是我想在四年内读完大学，毕业后进入一间还算不错的公司上班。现在不该思考宫城的事。这个老师不太写黑板，如果没认真听课就无法完全理解上课内容。","我暂时把黄金周的事情抛诸脑后。","专心听老师说话。","和高中时不同，九十分钟的课程很漫长。","在笔记本上振笔疾书。","三十分钟、四十分钟……时间一点一滴地过去。快满九十分钟前，这堂课结束了。","「叶月。」","阖上笔记本时，有人叫了我的名字。我抬起头，发现上大学后交到的朋友之一——澪坐在前面的位置上看着我。","「我有个好消息。」","我不期望拥有高中时那样的人际关系，所以没打算拓展交友圈。尽管如此，我还是交到几个朋友，与他们维系着可以聊些无关紧要的话题打发时间的关系。","「好消息？」","「对。所以你别一脸无趣，换上开心的笑容听我说嘛。」","「要不要笑着听你说，得看你要说什么。」","听我这么说，澪反而露出灿烂的笑容。","「叶月你在找打工机会对吧？我可以介绍一份不错的工作喔。」","耳畔响起她充满活力的声音。","我的确跟澪说过自己在找打工机会。","父母会帮我出必要的生活费，我就算不打工也能过活。可是我想要钱。","大学毕业后，我不打算回老家。","我希望能在这里找份不错的工作，但是未必能顺利找到，说不定还需要找新的住处。考虑到许许多多的「或许」可能同时发生，手上有一笔钱会比较好。所以我打算在父母还会帮忙出钱的大学时期打工存钱。","「那是怎样的工作？」","听我这么问，澪笑容满面地回答。","「家教。」","一起走出教室时，我又问道：「澪，你有在当家教？」","「我看起来像适合当家教的人吗？」","「不像。」","即使算上以前认识的人，澪也是长相特别出众的。如果戴上眼镜保持沉默，看起来倒也像个「漂亮的家教大姐姐」。而且和冰山美人的外表相反，她不仅好相处还很聪明。然而，她没有戴眼镜，有时候也会把事情想得太简单。说得好听点是当机立断，说得难听点是做事马虎，不经大脑。找澪当家教应该会很开心，但我不认为成绩会进步。","「居然答得毫不犹豫？算了。如果你有兴趣，我可以帮忙介绍。」","澪用轻快的语气说道。","「介绍学生？」","「不是。我哪有办法介绍学生啊？我要介绍的是学姐，她在找想当家教的人。」","澪的话唤起我以前教宫城念书时的记忆。","我知道那不单纯是靠我个人的力量，可是一起念书确实让她的成绩有所进步。我不敢凭这个经验就说自己适合当家教，但教人念书挺开心的。","「我如果只是问问看，不确定会答应也没关系吗？」","「没关系没关系。」","走廊上响起不晓得是不是真的没关系的明快嗓音。","「那你介绍学姐给我吧。」","还不确定要不要做。","但我有兴趣。","虽然不晓得澪的学姐是怎样的人，可是我想先了解状况。","「OK～我跟她联络看看。」","澪开朗地回应并拿出手机。跟学姐来回传了几则讯息后，她抬起头。","「学姐好像在忙。她想等有空的时候直接找叶月谈谈，我可以把你的联络方式给她吗？」","「可以啊。」","我答应后，澪三两下就把事情谈好，将学姐的联络方式加进我的通讯录。她说学姐大概三小时后打给我。不仅如此，澪还开始说明学姐的事，把她是三年级生和其他个人情报植入我的脑袋。可是等下午的课结束，我依然没收到学姐的联络。即使我已经搭上电车回家，抵达玄关前，学姐还是没有打来。","我取出钥匙打开玄关门。","灯是开着的。低头看向脚边，宫城的鞋子就在那里。","看来今天是她比较早到家。","我脱下鞋子走进屋内，本以为待在房间里的宫城就站在冰箱前面。","「我回来了。」","我对着宫城的背影这么说。","「欢迎回来。」","她似乎有出门采买，旁边放着装满食材的袋子。","「仙台同学，今天晚餐要煮什么？」","「宫城你有什么想吃的东西吗？」","「焗烤饭。」","将所有食材放进冰箱后，宫城看向这边。","「我没做过焗烤饭。还有其他的吗？」","「是仙台同学你自己问我想吃什么耶。」","「我只是问问，又没说要做。再说，你有买做焗烤饭的材料回来吗？」","「我不知道需要哪些食材，所以没买。」","「那根本没办法做嘛。」","我上网搜寻食谱，姑且先确认一下冰箱里现有的东西。里面果然没有能拿来做焗烤饭的材料。","「如果你这么想吃焗烤饭，要不要现在出去吃？」","我提出比较实际的解决方案。","「今天就算了。我都去采买回来了，你煮点什么来吃啦。」","不出所料，她冷淡地回应。","我觉得偶尔两个人一起出门也不错，可是宫城好像没那个意思。","「那明天呢？」","虽然知道她不可能答应，我还是试着询问。","「……是可以啦。」","听到这个出乎意料的答案，我看向宫城。","要去哪里？","要约几点？","我不晓得该怎么开口，决定先问她要去哪里。这时，手机响了。","「宫城，不好意思，等我一下。」","我从包包里取出铃铃作响的手机。","萤幕上显示我从澪那边听来的学姐的名字，看来对方没忘记要打电话给我。接起电话，另一头传来有些低沉的稳重嗓音。不到五分钟，我们就谈完正事了。对方挂断电话后，我向宫城道歉。","「抱歉。我明天临时有事，可以后天再去吃焗烤饭吗？」","「什么事？」","她用比电话打来前更冰冷的语气问道。","「我要去见一位可以介绍打工机会给我的人。」","「——仙台同学你要去打工吗？」","她关注的不是哪天吃焗烤饭而是我有什么事，这下又对「打工」这个词作出反应。宫城用和声音一样冰冷的眼神盯着我。","「我是想打工没错。因为我想存钱。」","不是刻意隐瞒，但我的确没有把自己想去打工的事告诉宫城。原因很单纯，就只是没机会讲。真要说起来，宫城这个人总是会在我说重要的事之前心情变差，或是从我面前消失。","「要钱的话，不是有我高中时给你的那些吗？」","宫城的语气变得更冰冷了。","「之前说过那不是我的钱。」","「就算不是仙台同学的，你也可以拿去用啊。」","这么说完，她踢了我的腿。","力道不大，只是轻轻踢在小腿前侧。但我夸张地喊痛并看向她。","宫城最近很温顺，没再踢我或是咬我，方才这一下让我有种回到从前的感觉。但我很清楚她现在对我做的行为，不是应该感到高兴的事。","我离开宫城，回到平常的座位。","「仙台同学，你要毁约吗？」","宫城不悦地开口，依然站在冰箱前面。","「对不起。」","我双手合十道歉。","焗烤饭不会跑，可是一旦错过明天，不知道什么时候才能再和感觉很忙的学姐碰面。打工原本就是我上大学后想做的事情之一，所以我才希望能改成后天再去吃焗烤饭。然而，宫城没有答应。她始终沉默不语，也没有走过来。","「无论如何都要明天去吃焗烤饭吗？」","这时候或许不该顾虑学姐，应该把宫城摆在第一。","我犹豫地看向宫城。","「……改成后天也可以，但你要接受惩罚。」","「咦？」","「我们之前有订下规则吧？毁约就要接受惩罚。」","对于我半放弃似的提问，宫城端出我记忆中不存在的规则。","「不对吧？违反我们两个共同决定的规则时才要接受惩罚，平常的口头约定不一样啊。」","「我们刚才说好要一起去吃了，那和规则没什么不同啊。」","「宫城，你要不要听听看自己在说什么？」","我觉得连这种「小约定」都算在生活公约里实在太蛮横。可是宫城似乎不打算让步，她一路走到桌子前，用明显不悦的语气继续说：","「我们没说只有在违反两个人共同决定的规则时才要接受惩罚吧？既然这样，仙台同学没有遵守刚才说好的事情，要接受惩罚也不奇怪啊。」","如果真要追究到底有没有说过，我们的确没说「只有」在违反两人共同决定的规则时才要接受惩罚。话虽如此，宫城的说词也不是毫无破绽，太不讲理了。","大概连当事人都知道自己说的话根本毫无逻辑。可是宫城会这么说就代表她认为我会接受这个不合理的惩罚。","我轻轻叹了一口气。","「这次就当作是这样吧。所以你想惩罚我做什么？」","「还没决定。」","「需要考虑那么久吗？」","「考虑久一点又没关系，我们也没有讲好惩罚的期限吧？」","我有种不好的预感。","如果给她无限的时间，宫城肯定会提出什么不像话的要求。","「明天之前决定啦。」","「办不到。」","宫城斩钉截铁地说道。","「说什么办不到，你只是不想决定吧？随便你啦，反正决定好再告诉我。」","我已经习惯听从她的指示了。","即使要接受惩罚也无所谓。","就算她叫我听从不像话的命令，我也习惯了。","所以这不是什么坏事。","我边想边站起来。","「所以今天的晚餐怎么办？」","我开口问宫城。","〔本话含插图〕"]},{"t":"第4话　不希望仙台同学忘记的事","p":["我拿起书柜上的黑猫，倒在床上。","已经到了可以睡觉的时间，但我还不困。","我摸着黑猫的头。","来到这里后一直遵守约定的仙台同学，第一次打破了约定。所以我得到命令仙台同学的权利。严格来说不是命令，这是仙台同学必须听从我一个要求的权利，也是我强行获取的权利。我扩大了规则的适用范围，因此不能说是用正当手段获得的。","我把黑猫放在胸口上。","惩罚是有次数限制的。","必须听从的要求只有一个。","只要不是太过分的事，我想仙台同学应该都会听从。过去我下的那些命令，她也几乎照单全收。叫她舔我的脚她就会舔。同理，如果叫她跟我接吻，她也会吻我吧。","可是我只能提出一个要求。","而且不知为何，仙台同学来这里后就很守规则，所以我不晓得下次要到什么时候才能再获得这个权利。这么一想，我开始犹豫到底该要求仙台同学做什么。明明是自己抢来的权利，我却想破头都不知道该叫仙台同学做什么来当作惩罚。","回想高中时期下过的命令。","还真没下过什么好命令。","我们现在是室友，应该不能再像高中时那样，也不该和那时候一样。","这样比较好。","我抓起胸口上的黑猫，让它紧靠墙壁。","鼻尖轻碰黑猫，又马上退开。","说是惩罚，也不过是个游戏。","不是该认真思考的事情。","应该更轻松、随意地用掉这个权利。","我心里很清楚，但仙台同学突然提起我不知情的打工，让我没办法以轻松或随便的态度去想这件事。","我把黑猫放在墙边，熄灯。","身体缩成一团，闭上眼睛。","既然想去打工，她应该早点告诉我啊。","在那之后我问了仙台同学，这才知道人家要帮忙介绍家教的工作。她说自己还没决定，但我想她八成会去当家教吧。","我明明不想叹气，却叹了一口气。","一旦开始当家教，仙台同学就会像教我念书时那样教某人念书。","用那样的声音，那样的距离，两人独处。","她大概不至于会和家教学生做那些我们从前做过的，念书以外的事。尽管如此，我还是不乐见这种情形。","升上大学后，我所不知道的仙台同学逐渐增加。因为她不太分享大学生活，现在的仙台同学大概有百分之五十是我不知道的仙台同学。尽管大多数的事情只要我开口问，她应该都会坦白。可是即便知道那些事，我也没办法像高中时那么了解，所以不太想问。在这种情况下，居然还要加上「打工」这个我无从得知的新生活。想到就觉得头痛。","我把黑猫拉进棉被里。","最近总算变得能好好入睡，这下似乎又要睡不着了。我开始数黑猫。","一只、两只、三只。","黑猫玩偶代替小羊高高跳起，越过栅栏。","这段时间，我脑中浮现正在打工的仙台同学。","如果开始当家教，感觉她又会变回那个总是不遵守规则的仙台同学。假如违反规则，我就能打着惩罚的名义对她下命令，可是她优先打工这件事让我很不高兴。虽然没必要把与我的约定摆在第一顺位，但我不希望她忘记。","能让仙台同学再也无法忘记约定的行为。","或许该用这样的行为来当作惩罚。","我一边数着跳过栅栏的猫，一边思考那个行为。我不晓得那究竟是什么样的行为，不过随着持续思考，意识也变得愈来愈朦胧。","在猫超过三百只，还不到四百只前。","我还没想到要叫仙台同学做什么就坠入梦乡。","然后在闹钟响起的五分钟前醒来。","到共用空间吃仙台同学准备的早餐。","她没有提起惩罚的事。","留下「今天会晚回家」这个我昨天就听过，一点都不令人开心的消息后出门了。我也收拾好碗盘，换了套衣服便走出家门。","她最好找不到打工机会。","在摇晃的电车中，我祈祷着仙台同学的不幸。","身为室友，我应该要说「希望你能找到打工机会」，却说不出口。明明是我叫仙台同学要「好好当室友」的，这让我对当不好室友的自己很失望。","即使下了电车，来到大学，心情依然郁闷。","走进教室后，我找到舞香并坐到她旁边。","「早安。」","我向她打招呼，她也回了一句「早安」。","「志绪理，总觉得好久没看到你这样一脸睡意了。」","上大学后，舞香的外表虽然改变，内在却没有变。她还是一样温柔体贴，仔细地观察周围的人。","「昨晚看书看到停不下来了。」","总不能说我是在想仙台同学的事情才睡不着。","我把身体靠上椅背，看向舞香。","她今天把比我长的头发绑成一束，可以清楚看见耳朵上的小巧饰品。","「你的耳洞是自己打的吧？」","这么询问后，我得到「嗯」的答复。","「会痛吗？」","「只有一瞬间。」","「果然会痛啊。」","「我觉得没有想像中那么痛，但还是因人而异吧。志绪理也想打耳洞吗？」","「不是，只是莫名有些在意。」","小小的饰品很可爱。","看着上大学后逐渐变得适合配戴这类饰品的舞香，我多少觉得如果只是戴耳环这种小事，要我稍微打扮一下也行。可是即使只有一瞬间，我还是怕痛。如果有不会痛的方法，我或许愿意打耳洞。话虽如此，我也没有想打耳洞到需要特地去找那种方法。","只是有点在意那个小小的饰品。","大概是因为这和高中时的记忆重合，让我想起抗拒打耳洞的仙台同学。最近不管遇上什么事情，我的脑袋都会联想到仙台同学。回过神来，我总是在想她。","「打一下嘛。耳环有很多可爱的款式，我们可以戴成对的啊。」","语毕，舞香拉了拉我的耳垂。","「嗯～」","我看着舞香的耳环。","小小的饰品停留在打在身上的洞里。","要是能像耳环一样留住约定就好了。","这样的念头闪过脑中。","可是我不能在仙台同学身上打耳洞。她几乎愿意听从我所有命令，却拒绝了打耳洞。","「如果很在意，我们一起去看看耳环怎么样？不管要不要打，只是看看也很有趣喔。你今天有空吗？」","要论有没有空，我今天的时间多到有剩。因为仙台同学要去和某个我没见过的人碰面，不会早早回家。","「我有空，去吧。」","和舞香一起玩很开心，我也不想一个人待在家里。","而且仙台同学还会跟某人一起吃饭。","我不晓得自己会不会买耳环，但我决定和舞香一起度过放学后的时光。","手上提着一个纸袋。","里面是我前天和舞香一起去买的东西。","我本想在昨天跟仙台同学去吃焗烤饭后拿给她，却没给出去。今天也一直犹豫不决，直到吃完晚餐后的现在还没交出去。","我在房里来回踱步，停在书柜前叹气。","黑猫凝视着我。","怎么办？","沉思半晌后，我走出房间来到共用空间。","仙台同学似乎在房里，没看到她。","我拿起镇守收纳柜的鸭嘴兽，搬来这里后首度敲响仙台同学的房门。","咚！咚！咚！敲到第三下时——","「我这就开门。」里头传来仙台同学的声音，然后门打开了。","「宫城，怎么了？发生什么事？」","仙台同学一脸困惑地看着我。","这也是理所当然。","明明一起租房子，我们之间的距离却非常遥远，甚至从未踏入对方的房间。","「……让我进去。我要惩罚你。」","「现在？」","仙台同学露出狐疑的表情，看着我手上的纸袋和鸭嘴兽。","「现在。不会花太多时间，如果不想让我进你房间就出来。」","我走出房间时看了一眼时钟。刚过九点，离就寝时间还早。她应该不会因为太晚而拒绝。","接下来要做的惩罚很简单。","地点选在共用空间也无所谓。","我不会对仙台同学做出过分的事，只要使用装在这个纸袋里的东西就好。","不会花多少时间。","只是一件小事，仙台同学三两下就能搞定。","「可以来我房间。」","仙台同学没有选择共用空间，说了声「进来」便敞开房门。我有些迟疑是否该说「打扰了」，最后还是默默跟在她身后走进去。","床舖和桌子。","书柜。","初次踏进的这个房间，跟我以前看过那个仙台同学的房间不同。书柜比较小，书本很少，床舖也不一样。还是高中生时，我去仙台同学房间的次数也没有多到能熟悉她的房间摆设，可是我不觉得这个新的房间是她的房间。怎么看都觉得怪，让我静不下心。","「你随便找地方坐。」","仙台同学背靠床舖坐在地上。","我不晓得该坐在哪里，于是坐到她身旁。","「宫城，所以说这只鸭嘴兽是怎样？」","仙台同学拍了拍我手里抱着的那只面纸盒套的头。","「面纸。」","「这我看就知道了。惩罚会用上吗？」","「应该会。」","「说什么应该，你到底要我做什么啊？」","「这是惩罚。」","我把带来的纸袋递给仙台同学，再把鸭嘴兽放到桌上。","「这是什么？」","「你可以打开来看。」","听我这么说，仙台同学打开了纸袋。","「宫城，这个……」","仙台同学皱起眉头，发出比平常更低沉的声音，然后取出纸袋里的东西摆在桌上。","穿耳器。","消毒水。","棉片。","全是用来打耳洞的工具。仙台同学叹了一口气。","「……不行吧？按照约定，我必须听从宫城的一个要求，但这也不代表我什么都会答应啊。」","「可是我们没有订下『不能打耳洞』的规则吧？」","「是没有。可是照一般逻辑来想，当然不能用这种会在对方身上留下永久伤痕的事情来当作惩罚啊。」","她没有生气，语气却充满无奈。不过我早就料到仙台同学会有这种反应了。","我拿起桌上的穿耳器，硬塞给仙台同学。","「没有不行。打耳洞啦。」","「就算宫城觉得可以，我也不要。」","「仙台同学怎么想并不重要。反正要打耳洞的人是我。」","「……咦？」","「没什么好疑惑的，那个是我要用来打耳洞的工具。所以仙台同学你用那个帮我打耳洞啦。」","我本来就觉得要是说想帮仙台同学打耳洞，她一定会拒绝。于是我转而思考有什么在这种情况下也能留住约定的方法。","我马上就找到答案了。","只要把约定留在我身上就好。","如果是我的身体，要怎么做就是我的自由。","就算命令仙台同学在我的耳朵上打耳洞，她应该不会拒绝。","「要接受惩罚的人是我吧？」","「对，所以要听我的。只是要你用这个在我的耳朵上开一个可以戴耳环的洞，很简单吧？」","我指着递给仙台同学的穿耳器。","「这个惩罚会不会太奇怪了？」","「才不奇怪。」","「宫城你想打耳洞吗？」","「不想。我怕痛，对耳环也没兴趣。」","其实我打不打都无所谓，但说不想打会让她留下更深刻的印象。","「那你为什么要打耳洞？」","「让仙台同学不会再忘记约定。」","「我不懂这个逻辑……到底是怎样？」","即使没有打工经验，我也清楚她一旦开始当家教就会有一些无法轻易调动的行程。与我的约定是可以轻易调动、优先顺位往后排也无所谓的事。","我知道这是我的任性，可是我不喜欢约好的行程被延后。不管仙台同学要不要当家教，我都不希望她忘记和我的约定。","所以我选择用自己来稍微加重约定的分量。","「如果亲手在别人身上打洞，你会忘不了今天发生的事吧？我要你每次看到我都想起跟我的约定。」","人能够持续记得的事情有限，不可能记住所有发生过的事。但如果做出印象深刻的行为，那件事就会持续残存在记忆中。既然这样，只要把「打耳洞」和「跟我的约定」绑在一起就好。让打耳洞这个会留下强烈印象的行为和约定连结在一起，她就没办法轻易忘记约定了。","所以必须由仙台同学来帮我打耳洞。","「我希望仙台同学能因此想起自己曾打破约定，好好反省。」","「宫城，你这话是认真的？」","「认真的。」","我说得斩钉截铁。","但仙台同学依然不肯用穿耳器。","「你自己打啦。这样搞得好像是我在强迫宫城打耳洞，我不想做那种事。」","「不行。仙台同学你就在不想打耳洞的我耳朵上打洞，然后为自己做了坏事而后悔吧。」","我想尽量放大仙台同学心中的罪恶感。","硬是在不情愿的我身上打了耳洞。","我要这件事深深刻画在她的记忆里。","「——我从来没用过这个喔。」","仙台同学一边叹气一边这么说，然后拆开穿耳器的包装，从中拿出说明书开始阅读。","「你没帮茨木同学她们打过耳洞吗？」","「没有。大家都是自己打的，宫城是第一个。」","听到这不是她已经做过好几次的事情，我松了一口气。","如果是第一次，这个行为绝对会让她留下更强烈的印象。","我姑且先跟仙台同学解说步骤。","先消毒，再做记号。","大概就像说明书上写的那样，但我还是把事先查到的资讯全部告诉她。","「先消毒对吗？」","仙台同学将我的头发撩到耳后，按照步骤消毒。接着，她像在确认一样拉了拉我的耳垂。","「你用手摸，消毒不就没意义了吗？」","我拍打仙台同学的手臂，但她没有松手。「这样很痒，别摸了啦！」我对一直摸着我耳朵的仙台同学这么说，又打了一下她的手臂。","「在打洞前，我想好好感受一下宫城现在的耳朵。」","语毕，仙台同学挪动原本摸着耳垂的手。指尖抚过耳后，爬上脖子。","感觉更痒了。","原本只用指尖碰触的手连掌心都贴了上来，她的体温传了过来。总觉得和仙台同学的距离缩短了，我于是推了下她的肩头。","「再消毒一次啦。」","「好。」","仙台同学用沾湿的棉片擦拭我的耳朵，拿起笔。","耳朵凉凉的，大概是因为消毒水吧。","「你的耳洞要开在哪里？」","被她这么问，我回答：「哪里都可以。」","「那我就擅自决定喽。」","仙台同学迟疑了一下，用笔在我的耳垂上做好记号，然后拿起穿耳器。","「……宫城，真的可以吗？」","「可以。」","很痛。","绝对会很痛。","舞香说没有想像中那么痛，但用粗针刺穿耳垂不可能不会痛。而且我无法预测那会有多痛，所以很害怕。","我紧紧闭上眼睛。","可是不管等了多久，疼痛都没有到来。","「仙台同学，你还不打吗？」","我睁开眼睛问道。","「不，我只是在想由我来打真的好吗？」","「我不是叫你动手吗？」","「真的会打出一个洞喔？」","仙台同学难得用不安的语气再三确认。","「仙台同学你很啰唆耶。赶快打啦。」","很可怕耶。","我把这句话吞回肚里。","「那我要开始了喔。」","她的话音刚落，穿耳器就碰上我的耳朵。","我闭上双眼并握紧拳头。一道不小的「啪嚓」声撼动鼓膜，耳朵处传来一阵痛楚。然而，疼痛只有短短的一瞬间，没有想像中那么痛。比起痛楚，我反而更在意耳垂上那股麻麻的感觉。","「换打这边喔。」","棉片压上来，我的耳朵又有些凉凉的。","我这次张开眼睛看着仙台同学。","一声「要打了喔」后，刚才听过的「啪嚓」声再度响起，耳上窜过一阵痛楚。","仙台同学呼出一口气，把用完的穿耳器放到桌上。","「还好吗？」","她边说边帮我刚打好耳洞的耳朵消毒。","「超级痛。耳朵现在还有点麻麻的。」","我加油添醋地形容其实没那么痛的感受，试着摸了下耳朵。手指碰到一个小小的圆形物体，耳后也有个以前不存在的东西。","「要看看吗？给你。」","我接过仙台同学递来的镜子，让镜面映照出自己的耳朵。","小小的银色饰品。","耳朵上的耳环跟舞香的不成对，但款式相似。因为这个过去不存在的饰品，我觉得自己看起来和平常不太一样。","「感觉好奇怪。」","我又摸了一下耳朵。从镜子上挪开视线后，我正好和似乎看向这边的仙台同学对上眼。","「很适合你。」","她面带笑容地说出实在不像发自内心的赞美。","仙台同学时不时会说些令人难以判断真假的话。","所以我不确定她看着耳环说出的这句「很适合你」到底是不是真的。","笑容看起来只是用来隐藏真心的假象，不能信任。再说，我又不适合戴耳环。镜中的自己感觉也在说我不适合。","因为不知道该回什么，我摸了一下耳环，再看向指尖。","「我还以为会流一点血。」","即使用手触摸刚打完耳洞的耳朵，指尖也没沾上血迹。不晓得原理为何，但就算在耳朵上开一个洞也几乎不会流血。","「这只鸭嘴兽该不会是为了应付流血的情况吧？」","仙台同学从桌上拿起长出面纸的鸭嘴兽，随手拍了拍它的头。","「基本上是。」","搜寻打耳洞的方法时，情报上都写「几乎不会流血」，舞香也这么说。尽管如此，我还是拿了面纸进来以防万一，显然是多虑了。","「宫城你这个人还满胆小又爱操心呢。」","仙台同学边说边抓着鸭嘴兽的手上下摆动。","我轻轻拍了下那小小的手。","「我才不胆小，也不爱操心。」","「打耳洞的时候你不是吓得一抖一抖的吗？」","「仙台同学你才是一脸担心害怕。」","「是没错啦。因为听说要笔直地打穿啊。」","仙台同学的视线从鸭嘴兽移向我的耳朵。",
