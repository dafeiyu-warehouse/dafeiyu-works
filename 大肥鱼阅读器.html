那时候也不准她脱我的衣服，这也没办法。我如果硬要脱，总觉得她会不准我再做更进一步的事。","「我不会脱你衣服，放开我。」","我平静地说完，她终于愿意松手。","要是现在不能继续碰她就伤脑筋了。","我还没了解她的一切。","让身体紧贴着仙台同学拱起的背。指尖爬上胸部中央，隔着衣服吻上肩头。抚过肌肤表面，慢慢地持续抚摸柔软的胸部。","「你要……摸到、什么时候……」","仙台同学的声音在不自然的地方中断。明显与刚才为止的声音不同，带着一丝煽情。我想再多听听她的声音，用掌心包覆住她的胸部。明明是自己身上也有的东西，但光是抚摸就觉得很舒服，不想让手离开这里。","「宫……城。」","仙台同学加重语气地叫我，抓住我的手腕。","她的背动了动，好像做了一次深呼吸。","「够了吧？」","我对在今天之前从未听过的声音回答「不够」。","「你摸过头了啦。」","仙台同学随着微弱的嗓音，将我的手移动到肋骨下方的位置。","没有骨头的柔软部位。","我让手爬上作为胸部替代品的腰部，捏了一下。","「好痛。」","仙台同学语带责备。","我轻咬她的肩膀，稍微施力按压腰部，汗湿的肌肤吸住我的掌心。我事到如今才意识到，从几乎毫无缝隙可言，紧密地贴着她肌肤的手掌上传来体温。我自己的身体也变得异常滚烫。","我让身体稍微退开，离开她的背。","即使如此，热气还是没有散去，留在我的体内。","我用仿佛要仔细确认的感觉，让手爬上仙台同学的身体。","从腰部滑向肋骨，将掌心贴上心窝。","好烫。","无论是背脊还是肩胛骨都好烫。即使我用力按压，让指甲陷入其中，那身柔软滑顺的肌肤也不会抗拒我的手。感受到她几乎令人融化的温度，总觉得连呼吸都变得急促。我想再多感觉她，把手挪向肚脐下方，继续下滑，碰触到牛仔裤的扣子。","只要解开这个，我就能更深入地了解仙台同学。","这么一想就有些紧张，脑中浮现自己被动时的情境，仙台同学的身影与当时的我重叠在一起。","我在这张床上——","清楚地回想起当时自己身上发生的事，意识集中在自己的腹部中央。快要起反应的身体，让我明确理解到自己接下来要对仙台同学做的，究竟是什么样的事。","我还没触碰过的部分。","仙台同学身上未知的地方。","我可以触碰到那里。","记忆中的我和仙台同学重合。记忆拖着我的身体，让我无法顺利解开扣子。","「……仙台同学，解开这个。」","「你自己解开啦。」","「我解不开。你开啦。」","我把掌心放在她的肚子上。","即使我用力按压，仙台同学也不动。把额头靠在她的肩膀上，又重新拜托她一次，说「你开啦」之后，她回了一句「……这样很羞耻耶」。","她用力握住我放在她肚子上的手。","可是在这张床上发生过的事情紧紧缠绕着我，让今天的我办不到「解开扣子」这么简单的事。这都要怪仙台同学让我留下会在这种时候回想起来的记忆，所以无论多羞耻，她都应该自己解开扣子。","「仙台同学。」","我隔着T恤吻她的肩膀。","「你这样很奸诈耶。」","轻声说完，仙台同学先用力握住我的手，接着解开牛仔裤的扣子。","「……剩下的你自己来。」","我顺着仙台同学的声音拉下拉链。","手钻进牛仔裤里，碰到内裤。","我不是不晓得接下来该做什么。","可是我很不安。","她的身体对我的手起了反应，我大概可以料想内裤里头的状况。然而，现实未必会如同我的预期。","「……宫城？」","听到她小声地呼唤，我深吸一口气并缓缓吐出，把手伸进内裤。","指尖被牛仔裤硬挺的布料给压着，一路前进。","抵达过去未曾碰触的位置，指尖被湿滑的液体包覆住。","不同于汗水，有些黏稠。","缠绕在指尖的量比想像中更多。","这让我松了一口气，同时也很震撼。","——仙台同学居然会变成这样。","我不认为自己的表现有多好，仙台同学却因为我的手，变得和过去的我一样，这让我惊讶到全身的血液简直要蒸发了。","我滑动指尖。","仙台同学的背明显起伏，看得出来她在深呼吸。","她一部分的感情紧紧沾附在指尖上，想与我融为一体。","因为我在做这种事，这一点也不奇怪。仙台同学碰我时，我也会变成这样，所以仙台同学没有出现和我相同的反应才伤脑筋。可是我不敢相信她在我的碰触下会变成这样。","手指缓慢地在湿滑的地方移动，确认仙台同学。","指尖比刚才更火热。","背部比刚才更滚烫。","我让身体紧紧贴着仙台同学，热到T恤都快烧起来了，也打乱了呼吸的节奏。我在指尖稍微用力，亲吻仙台同学的耳朵。她发出微弱的闷哼声。我想听得更清楚一些，咬了她的肩膀。","「嗯……」","仙台同学发出嘶哑难受的声音。","这和仙台同学感冒时发出的声音很相似，可是又比那时的声音更鲜活，让我也跟着难受起来。","「……舒服吗？」","不用问我也知道答案，可是人在舒服和痛苦时发出的声音太像了，让我忍不住想确认。","「很、舒服。」","仙台同学发出比平时高一些，比刚才吃的生乳酪蛋糕更甜美的声音。","「有多舒服？」","「一般来说……会问、这个吗？」","仙台同学以断断续续，但还是能让我清楚听见的声音说道。","「我不知道一般来说是怎样，你回答我啦。」","我的声音也受仙台同学影响，变得跟平常不一样。","「非常、舒服。」","「非常是多舒服？」","「非常……就是、非常。」","「用我能听懂的说法告诉我啦。」","听我这么说，仙台同学深深地呼出一口气。然后拱起背，想要远离我。所以我拉着她的T恤，再问了一次「告诉我」。她放弃挣扎地靠在我身上，小声说：","「……比自己做、更舒服。」","「咦……咦？」","「宫城……比较好。」","那是用勉强能振动鼓膜的音量说出，差点就会听漏的话语。可是我用残留在耳中，应该说残留在脑海中的形式，清楚地听见这句话。","我没想到她会这样回答，也不是想听到这种答案，所以脑袋里一片混乱。我叫了声「仙台同学」，紧紧抱住她。","脑中乱成一团，无法整理思绪。","仙台同学在这个房间里、在这张床上。","想着什么，又是用什么方式自己动手。","可是她说的「自己做」是真的吗？","我的意识集中到正抚摸着仙台同学的指尖。","黏稠的感情不断涌出，我的心脏快要停止跳动了。轻轻滑动手指，仙台同学的身体变得紧绷。尽管如此，她还是默不作声。我喊了「仙台同学」，这才听见和平时不同的，有些干哑的声音。","「宫城，你安静……地、做啦……」","在不同于平常，听起来相当痛苦的声音与声音之间夹杂着喘息，配合著她，我的呼吸也乱了节奏。","没办法顺畅呼吸。","我和仙台同学不规律的呼吸声在黑暗中响起。","无法调整急促的呼吸，手指继续按压、抚摸着仙台同学。","指尖沉溺于她溢出的液体。","光是触碰从身体面积来看仅占一小部分，用指尖触碰就够了的部分，竟能对她造成如此大的改变。也许不管触碰她的是谁，她都会变成这样，但我不愿去想还有谁能够改变仙台同学。这个身体是专属于我的，只有我能看见仙台同学的这一面。","「我看不到……让我、听听……你的声音。」","刚才叫我安静的仙台同学抓着我的手臂说。","「声音是指？」","「叫我的……名字。」","「仙台同学。」","我小声回应，呼唤她的名字。","我不想让她听见这个不像自己的声音，但叫她的名字非常舒服。可是，仙台同学不满地回我：「不、对。」","「叫我……叶月。」","那个名字。","那个称呼。","需要付出某个代价。","「不要。我不要那样叫。」","因为这不能变成专属于我的称呼，所以我不想叫。","「宫城、小气。」","这么说完，仙台同学重复呼喊我的名字。","宫城。","宫、城。","我被动地躺在这张床上时也发生过同样的事。仙台同学叫了我的名字好几次。","她的声音听起来果然很舒服。","听着听着，感觉就像被仙台同学包裹着，咕噜咕噜地沉入很深、很深的地方。","「安静。」","我把额头抵在仙台同学的背上。","「宫城。」","「不要叫我。」","「那你、堵住……我的嘴啊。」","我因为那无力但反抗的语气而让手指爬上她的嘴唇，她立刻张口咬下。虽然不痛，但被舌头碰到的指尖有如烫伤般火热。我拔出手指，仙台同学马上呼喊我的名字。","宫城、宫城、宫城。","她用夹杂着喘息的沙哑声音呼喊我。我的姓名碎裂成粉末，窜入体内，填满空隙。流入四肢百骸的姓名碎片从内侧刺着我。明明刺痛不已，却让人觉得很舒服。","叶月。","我动起手指代替不愿叫出的名字，忽强忽弱地持续抚摸。","「……嗯……啊。」","逸出的声音搔着我的耳朵，坠入体内深处。","感官强烈地连通那个周日。身体像被她触碰、觉得舒服的那个时候一样，想做出反应，无法克制地喘气。","指尖热得简直要融化了。","一旦停下缓缓移动的手指，她抓着我手臂的手就会用力，哀求似的喊我的名字。","我不知道这样的仙台同学。","用力抓着我的手只让人觉得她渴望着我。","比过去任何时刻都更火热的身体。","受到她的温度影响，我的身体深处也热了起来。那不断溢出的东西令人发狂，仿佛要将我溶解。","果然不该关灯。","要是没用毛巾蒙住她的眼睛就好了。","我很后悔。","好想知道现在只存在于我面前的仙台同学是什么表情。","我不想让她看见我的表情，可是我想知道仙台同学是用怎样的表情在呼唤我的名字。想看那个只有我能看到的表情，希望她看着我的眼睛，叫我的名字。原先占据我大半的不安情绪溶解、消失，凝聚成想知道的心情。我想知道她在想什么，又是怀着什么念头在呼唤我的名字。我想知道包含过去和未来，所有我不知道的仙台同学。希望她不要告诉任何人，只告诉我她的一切。","连同我没有问、问不出口的事情，全部。","不是今天也可以，只希望她能告诉我。","「仙台同学。」","我现在不想发出声音。","我一定会发出不想让她听到的声音。尽管如此，我还是忍不住想叫她，于是把脸埋在她的颈项，又喊了一声「仙台同学」后，她回了一声「志绪理」。被她呼喊的名字带着前所未有的热度，胸口像是被烫伤一样刺痛不已。喘不过气，用力滑动手指。","「志绪理。」","她的声音狠狠撞上我，坠入心底深处，与我同化。","声音里带着浓浓的煽情气息，让人想再多听一点。","我想要让她更舒服。","远比当时的我更舒服。","湿滑的液体缠绕上来，想把我引导过去，于是我让手指紧紧按住某一点。原先抓着我手臂的手突然用力，指甲陷入我的手臂。我使劲咬了一下她的脖子，陷入我手臂的指甲又更用力了一些，接着无力地松开。即使如此，我还是缓缓挪动手指。这时，她用粗重的语气喊了「宫城」。","「等等，停、下来。」","仙台同学断断续续地说着，一边拍打我的手臂。","「为什么？」","「你还问我——」","仙台同学话说到这里便停下，深吸一口气。然后缓缓吐气，有些困扰地说：","「一般会问这个吗？我已经不行了。」","经她这么一说，我才首度意识到不能再继续下去了。","「抱歉。」","我停手，把手从内裤里抽出来。开灯之后，只见仙台同学整个人缩成球状。我直直盯着她，可是望眼所及只有背影，看不到她的表情。","我很在意她微微起伏的肩膀，想要碰她。","正想伸出手，视线便移向自己的手指。","因为仙台同学溢出的东西，手指比我想像中更湿。","我试着摩擦手指，湿湿滑滑的。","尽管已经没有温度，溶解、消除我不安的东西，其中一部分仍以可见的形式残留下来。盯着张开的手，仙台同学的触感及声音便会重新浮现。","残留在手指上的，是仙台同学感受到的事物所遗留下来的痕迹，她说舒服想必不是谎言。想起那个周日，同样的东西弄脏了她的手指，脸颊便微微发烫。","「宫城？」","大概是因为我一直没说话，仙台同学出声叫我。我没回话，继续盯着留有她痕迹的手指。仙台同学爬起来，开始动来动去，似乎打算做什么。我有些在意地看过去，发现她解开毛巾看着我。","「宫城，等一下，你在做什么？」","仙台同学用不算生气，可是不太高兴的语气说完就跳下床。接着，她立刻抱着鸭嘴兽跑回来。","「你平常不是会马上擦干净吗？今天也赶快擦掉啦。」","仙台同学坐到床上便开始支支吾吾，抓着我的手臂擦拭手指。她残留的痕迹转眼间就被面纸吸收殆尽，丢进了垃圾桶。","「我以为宫城不喜欢弄脏手，不是吗？」","听到仙台同学有些无奈的声音，我盯着她的脸，只见她的脸颊微微泛红。衣服也凌乱不堪，让我重新意识到我们刚才究竟做了什么。","我没有回答仙台同学的问题，封住她的嘴。","我不晓得自己为什么想吻她。","可是我想触碰仙台同学的嘴唇。","轻轻碰触便退开，这次换仙台同学主动吻上来。嘴唇紧紧相贴，她的舌头钻入口腔，灵活地滑过牙齿，想逮住我的舌头，不让我逃走。一个徐缓、漫长的吻结束后，仙台同学将我推倒在床上。","「我也会让宫城觉得舒服。」","靠上床舖的同时，她对我如此呢喃，吻上我的唇。","她的肩膀还留着刚才的温度。","撬开我嘴唇的舌头也好热。","不仅是仙台同学，我也一样。身体从刚才就好热，要是像这样继续随仙台同学摆布，我恐怕会变得比之前更搞不懂自己。我推回试图缠上来的舌头，拍打她的肩膀。她的嘴唇退开，仙台同学仿佛在邀请我似的喊了「宫城」。","「不用。」","听我明确地回答，仙台同学不满地开口：","「为什么？我也想碰你。」","「现在不要。」","「那什么时候可以？」","「我不知道，总之现在不行，让开。」","现在要是再让她碰我，我觉得自己会容许她做任何事。我推开仙台同学，硬是坐起来。","「宫城。」","我无视传来的声音，爬下床站起来之后，她拉住我的T恤下摆。","「你要去哪里？」","仙台同学没有整理好凌乱的衣服就开口问我，与我四目相对。不过，她难得地主动瞥开视线，又移回来看着我。","「……我要回房间。」","「这样啊。」","听见她微小的声音后，房间落入一片沉默。我想转身背对她，可是她依然拉着我的T恤下摆，我动不了。","「那个，宫城。我——」","话说到这里就断了，我等待着她的下一句话。","然而，仙台同学在那之后便没再开口。","〔本话含插图〕"]},{"t":"第11话　我太宠宫城了","p":["宫城果然是变态。","理所当然地蒙住我的眼睛就够奇怪了，光问我舒不舒服还不够，居然要我具体说明到底有多舒服，到底有什么毛病。结束之后一直盯着手指看也很夸张，不管怎么想，宫城都是个大色狼。","躺在床上的我大叹了一口气。","内衣背扣和牛仔裤的扣子都没扣回去，简直一身凌乱。不过宫城已经不在房里，也不会被任何人看见，所以我完全不想重新整理自己的衣着。","「……早知道就不要说。」","要不是她死缠烂打地追问，我才不会说溜嘴。","我根本不需要认真回答「有多舒服？」这种愚蠢的问题。虽然的确是比我自己做来得舒服，但是特地把这件事告诉宫城的我真是个大笨蛋。即使当下没有余力思考，还是不应该说这么多。","我很在意宫城是怎么想的，可是我实在不想主动问她。要问她就表示我得再说一次自己说过的话，她要是反过来追问我一些怪问题，我也很伤脑筋。她感觉就会问我「自己做的时候在想什么？」，或是「自己是怎么做的？」这种问题。","回答这些问题太羞耻了，那也不是我能告诉宫城的事。","可是我也觉得，如果她真的来问，我应该会回答。","我很宠宫城。","我想宫城也发现这点了，只是我一定比她想得更宠她。今天也是，即使她没说那句「你一旦拒绝我，我以后绝对不会再同意你做那种事」，我也会答应她。即使宫城没说她愿意再让我碰她，我也喜欢宫城到只要她有意要做，我就会同意的程度。我甚至很高兴她愿意主动碰我。","「可是……」","她为什么说出「是我要对仙台同学做那件事」的，我可是完全想不透。","因为我认定宫城一辈子都不会主动说要碰我，所以我真的不懂。她那时候虽然说自己「只是想知道仙台同学会变得怎样」，可是她不可能在当时的情况下突然想到那种事。一定有什么别的理由，可是我如果硬要追问，宫城八成会直接回房，不会碰我。即使明天问她，我也不觉得她会回答。","尽管如此，我还是很想知道宫城为什么会采取那样的行动。说得更直接一点，我想知道藏在那个理由底下的真实想法——宫城到底是怎么看待我？","宇都宫来玩的时候，宫城说自己没有喜欢的人，可是看到今天的宫城，我忍不住会去猜测。","如果只有一次，那还可以用一时意乱情迷、冲动、好奇来当作藉口，可是我们已经是第二次做这种事了，而且今天是宫城主动要求。","不像第一次是我强行闯关。","是宫城依据自己的想法主动提出的。","如果要从中导出某个答案，再三思考其中的可能性，就会得到「宫城也喜欢我」的结论。","我翻身让掌心贴着墙壁。","身体缩成一团，闭上双眼。","直到刚刚还在我背后的东西。","宫城柔软的触感。","让人怀疑她是不是发烧了的体温。","抚摸我身体的手。","一切都好舒服。","「技术好不好」那种事根本不重要，因为对象是宫城，维系我理性的螺丝马上就溶解消失，我只专注沉浸于舒服的感觉。她带给我的这一切，虽然会让我产生宫城或许也喜欢我的念头，但我没有乐观到能轻易接受这个想法，忍不住想在导出的答案后面打上问号。","深深地叹了一口气。","她愿意对我笑就够了。还有，如果她愿意叫我叶月，我就能更有自信。","——尽管「宫城喜欢我」这种事，说不定只是任由难以抑制的欲望摆布的，我个人的一厢情愿。","「不行。这样下去会愈来愈消沉。」","认为宫城喜欢我的我与认为宫城不喜欢我的我，两者之间的战斗是后者占上风，感觉一直想下去只会得出不好的结论。","既然要想，不如想些愉快的事。","我用力闭上原本就闭着的双眼，想澈底排除眼睑感觉到的光线。","今天宫城用和平常不同的诱人声音喊了我「仙台同学」。虽然我主动的时候，宫城发出的声音更为煽情，但是今天听到的声音像是她太想叫我而出声呼唤我，觉得两只耳朵根本不够用。","她不愿意叫我叶月，可是我叫她志绪理，她也没有生气……也许有生气，只是我记不清楚了。","记忆好像很鲜明，却又有某些部分朦胧不清。不过我清楚记得她咬了我。我主动的时候她也有咬我，但是她今天也用力地咬上我的脖子。明明很痛，我却觉得非常舒服。","平心而论，想这种愉快的事比较幸福。然而，体温降下来的身体感觉又要燃烧，我赶紧睁开眼睛。照亮房间的灯光狠狠刺进我的视野。","我慢吞吞地爬起来。","得去洗澡才行。","身体的某些部位非常不舒服。","可是那是宫城触碰我的证据。我不想擦拭或是洗掉。想一直、一直留在身体上。尽管知道不可能，却还是这么想。","不晓得下次会是什么时候，所以更觉得珍贵。","我想触碰宫城，也想被宫城触碰。","我想更深入地了解宫城，也希望宫城能更深入地了解我。","希望宫城能因我而满足，也希望宫城能填满我。","现在、立刻。","「我也知道不可能就是了。」","我让背脊贴上墙壁。","轻声喊着「宫城」。","紧紧握住想要立刻触碰她的手。","即使我不能碰她，我也希望她明天早上在家。","上次起床时，宫城已经不在家了。","「……应该不至于吧。」","真的要离家出走，那也应该是我这个被迫做出羞耻发言的人。不过我没打算离家出走，即使觉得丢脸，明天还是想见到宫城。","可是宫城是怎么想呢？","这次应该没有构成她会离家出走的要素。然而，宫城时常做些意想不到的事，所以早上起来发现她已经不见人影也不是不可能。","「让我说声早安嘛。」","早上对宫城说早安，一起吃饭。","因为这是每天早上的固定流程，我不准她不在。","所以我决定早起。","如果宫城打算溜走，我就要在她溜走前逮住她。","早餐我会准备，她也不用说话，只要待在我面前就好。","即使已经决定了，我还是忍不住祈祷。","希望明天早上，宫城能像平常一样在家。","我如同昨天的决定，比平常更早起床。","说是这么说，其实是我根本没睡好。","我忍下打呵欠的冲动，打开冰箱。","起司映入眼帘，想起蔬果室里还有小番茄。像平常一样吃吐司涂果酱和奶油也不错，但是我今天想吃点不同的东西。","「吃吐司披萨好了。」","我拿出两个盘子，分别放上一片吐司。","要准备两人份的早餐。宫城今天有乖乖待在家里。","她不像有离家出走，鞋子还在玄关，房门里也有人的气息。虽然还没和她互道早安，不过只要等待，我就能和她说早安。","「——早安。」","这不算练习，但我喃喃说完便将番茄酱涂抹在吐司上，再放上起司、对半切开的小番茄和火腿。把准备就绪的吐司放进小烤箱，切高丽菜丝和小黄瓜做沙拉。将吐司披萨剩下的小番茄连同高丽菜丝和小黄瓜一起放进深盘后，小烤箱发出清脆的声响。","我差不多备好早餐了，宫城却没有走出房间。","犹豫要不要敲门叫她之后，我从小烤箱里取出上面的起司已经融化的吐司，放在盘子上。这时候要是有巴西里就好了，但是我也没办法撒没有买的东西，于是为吐司披萨淋上少许橄榄油，撒上胡椒。","我看向宫城的房门，门没有打开。","把沙拉和吐司披萨端到桌上，从冰箱里拿出柳橙汁。在玻璃杯中倒入柑橘色的液体，轻轻叹了一口气。","我不是为了一个人吃才做早餐。","吐司披萨和沙拉都是为了和宫城一起吃才做的，我站在她的房门前。","深呼吸三次。","握起拳头、张开，然后再用力握拳。","明明不是第一次敲宫城的房门，我却很紧张。","「咚」地敲了一下。","里头没有传来任何声音。","我这次稍微用力地「咚、咚」敲了两声，里头传来「什么事？」的回应。","「宫城，我做好早餐了。」","我刻意用和平常一样的语气说道。","过了十秒？还是十五秒？","或许经过更久。可是，一段时间后，宫城从房里出来了。可是她低着头，不愿意和我对上眼。我朝不愿抬起头，但总算走出房间的宫城说：「早安。」","「……早安。」","传来小小的回应，以及房门关上的声音。","宫城还是低着头不肯看我。她没有明说，但我感觉得出来，不愿抬头的她心里正想着『好尴尬』。","「抬头看这边啦。」","我对直直盯着地板的宫城说道。","「不看也没差吧。」","「看我啦。」","「为什么？」","「那是我要说的话。宫城为什么不看我？」","我不期待她会回答。","我大概猜想得到宫城不看我的原因，这也不重要。","无论是怎样的原因，她不看我就会让我心里很受伤。如果没有原因，那只会让我更受伤。「无论如何都会伴随疼痛」不是什么有趣的事。而且那就像是潮湿化脓的伤口，一想到那个疼痛会持续下去就很郁闷。","「……我不晓得。」","宫城没有扬起视线，喃喃说道。","道过早安，接下来会一起吃早餐。","昨天想的事情全都实现了。","然而，光是如此还无法满足我。","「宫城。」","我轻声叫她，伸出手。","将头发拨到耳后，触碰我选来送给她的缅栀花耳环。用拇指确认小小花朵的触感，又叫了一声「宫城」，然后吻上耳环。这时，她抓住我的T恤下摆。","我让嘴唇离开耳环，看向宫城，两人四目相对。","亲吻她的脸颊后再说一次「早安」，这次宫城用比刚才清晰的声音回了「早安」，随即低下头看着地板。","「宫城昨晚有做梦吗？」","看来她不想和我对上眼。我开口问她。","「没有。」","「我有喔。我梦到宫城紧紧抱住我。」","我讲出根本没梦到的内容后，宫城抬起头看我。","「你骗人的吧？」","「对啊，是骗你的。其实我根本没做梦。」","正确来说是我昨晚始终半梦半醒，根本没睡到足以做梦的程度。","「仙台同学每次都马上说谎。」","宫城不悦地说完又想逃避我的视线。所以，我在她低头之前夺走她的双唇。","我用力将嘴唇凑上去，甚至能感受到在柔软双唇另一侧的坚硬物体，然后退开。在宫城吸气之前又吻上她，轻咬她如软糖般充满弹性的下嘴唇。","真想就这样推倒宫城。","就算不是在床上，我也想触碰宫城，亲吻嘴唇以外的地方。","尽管我自己也明白那是不可能的。","囓咬、舔舐柔软的嘴唇。","让嘴唇紧贴到无法呼吸的程度，伸手搂住宫城的腰。顺势把她的身体拉向自己，宫城硬是结束了这个吻。","「为什么要在这时候吻我？」","她不带起伏的声音传入耳中，身体被她推开。","「因为我想吻你。」","「就这样？」","「就这样。」","宫城看着我，脸上写着大大的「不情愿」。于是我又补上一句：「你需要理由的话，我是可以说一个。」","「说一个是怎样？」","「因为宫城很可爱，这样如何？」","我露出灿烂的笑容，她用不小的力道踢了我一脚。","「不要认真地踢我啦。」","还好昨天没对宫城说我喜欢她。","假如说了，不晓得宫城还愿不愿意待在这里。即使愿意，气氛一定会比现在更尴尬，没办法接吻，也没办法自然地露出笑容。","「是仙台同学不好，说那种奇怪的话。」","「可爱一点都不奇怪吧？」","「那仙台同学也不该说出违心之论。」","「我是真的觉得宫城很可爱啊。」","我这么说，伸手想摸她的头发，结果又被踢了一脚。看来继续说她可爱，只会让我的腿上出现瘀青，于是我拉着宫城的手走到桌前。","「我做了吐司披萨，快吃吧。都要凉掉了。」","宫城听我这么说便坐到她的固定位置。","我也跟着落坐，两人异口同声地说着「我开动了」并咬下吐司披萨。","「都怪仙台同学做那种奇怪的事，凉掉了啦。」","「我只是吻你而已啊。」","喝下柳橙汁，再吃一口吐司披萨。如宫城所言，吐司披萨已经不是刚出炉热腾腾的状态，却比至今出现在餐桌上的任何食物都还要美味。我又咬了一口吐司披萨。吞下肚后，宫城吞吞吐吐地开口：","「仙台同学为什么表现得这么正常？」","「你是指什么？」","「……你都不觉得害羞吗？」","尽管从宫城口中轻声逸出的话语缺少了许多部分，我也知道她是在说昨天发生的事。","「宫城之前是因为害羞才离家出走吗？」","「现在是我在问你问题。」","发现她的语气变得强硬，我决定认真回答她的问题。","「我是觉得很害羞没错，可是我也没地方可去。」","她摸了我的身体，听见我平常不会发出的声音，还要我回答根本不需要回答的问题。虽然宫城的声音也和平常不同，可是综合来看，还是我比较害羞。一想到发生在自己身上的事，就能理解宫城之前想从我身边逃开的心情。","可是我即使害羞，还是想和宫城在一起。","「还是有愿意让你借宿的朋友吧？」","「有是有，可是待在这里比较安心。还是你觉得我不在比较好？」","「我没说那种话。」","「那你表现得再开心一点嘛。」","我没打算叫她笑或是表现得亲切友善，只是她脸上牢牢贴着「不高兴」这三个大字，我希望至少能把那三个字撕下来。","「不管我摆出怎样的表情都没差吧。」","「你要摆出什么表情都行，但我觉得稍微表现得开心一点，饭会更好吃。」","我看着感觉很不高兴的宫城，咬下吐司披萨。","宫城不愿露出开心的表情。","不仅如此还低着头。","发现她完全不肯配合，我忍不住想开口抱怨。然而，在我说话之前，对面先传来微弱的声音。","「……比起一个人吃，我觉得两个人吃比较好。」","「咦？」","「刚才的回答。你不是问我『还是你觉得我不在比较好？』吗？」","这么说完，宫城喝了一口柳橙汁。","「啊，嗯。我是有问。」","宫城突然变得这么老实，感觉很诡异。","可是我觉得现在能得到想要的答复，于是又重复一次昨天的问题。","「喂，宫城。我们暑假一起去哪里玩啦。」","桌子另一侧的宫城抬头看我。","短暂的停顿后，传来她平静的嗓音。","「仙台同学负责决定地点。」","「好，我知道了。」","我简短回应，宫城则咬下一口凉掉的吐司披萨。","〔本话含插图〕"]},{"t":"后记","p":["非常感谢各位拿起这本《我买下了与她的每周密会》第六集。","随着U35老师绘制的大学生版宫城和仙台，这次的第六集也顺利出版了。","第五集以「宫城离家出走」这起重大事件作结。相隔数月，希望大家能好好享受这两人依然令人焦急的关系。","本集的幕间故事是用「宇都宫舞香」的视角撰写。配合这点，番外篇也改变方针，分别以宫城和仙台的视角写下「那天早上」的事。尽管不同以往，我还是希望大家能接续第五集的内容，透过各种角度厘清整件事的来龙去脉。","那么，我接下来想和大家聊聊第六集发售前的一些故事。","首先，《每周密会》荣获「这本轻小说真厉害！2025」文库部门的第十四名。而且在女性角色部门，仙台拿下十九名，宫城则是二十名。","真的非常感谢各位的支持！","也诚心感谢总是将宫城与仙台画得魅力十足的U35老师、责任编辑、在各方面协助本书出版的各位。","这次女性角色部门的评选，宫城和仙台能一同上榜真是太好了。看到两人的名字感情很好地并列榜上，我就心头一暖。今年《每周密会》在女性排行榜中荣获第十三名也让我十分开心。不分年龄性别，我希望自己的故事能让读者们乐在其中，所以这对我来说是相当振奋的结果。","然后、然后。","《每周密会》参加了以GL为主题的展览——「百合展」。","本作有配合展览制作特制的周边商品，U35老师特别绘制的插图真的好可爱！这次还有被仙台抱着的黑猫（不是宫城），以及看似很喜欢宫城的三花猫。我看了忍不住嘴角上扬。重点在于那只黑猫和像野猫一样的宫城不同，牠会对仙台撒娇！","真的非常感谢U35老师创作这么出色的插图。","此外，《每周密会》登上《DRAGON MAGAZINE》二○二五年一月号的附录「幻想女主角月历」也是一件难忘的事。我完全没想过这部作品可能变成月历。","第六集发售前经历了许多事，令我惊喜连连。","延续二○二三年，二○二四年也是瞬息万变的一年。","二○二五年又会如何呢……","希望是个好年！","不对，绝对是个好年！漫画版《每周密会》的第一集即将发售，那一定会是有许多好事发生的一年。我也一定可以养猫！如果顺利养了猫，我会在X上向大家报告。我在X上会用「羽田宇佐」这个名字发布各种消息，还请大家得空时关注一下。","后记来到尾声，我依然要诚心感谢阅读第六集的各位、在网路上鼓励及支持我的各位、U35老师、责任编辑以及在各个方面协助本作品出版的各位。同时也要再度感谢我的好友N喵，你总是帮了我很大的忙。","那么，希望能在第七集的后记与各位再见！","羽田宇佐"]},{"t":"番外篇　那天早上，应该要是室友的我们","p":["【1 宫城志绪理】","所谓的夜晚是用来睡觉的，然而，我几乎没睡。","原因出在隔壁房间，我不想和创造出这个原因的仙台同学碰面。可是我不愿迎接的早晨已经到来，这样下去势必会见到她。","昨天我和仙台同学所做的不是会和室友做的事情。即使早晨来临，这个事实也没有改变，我这个人依然和仙台同学做了室友不会做的事。","怎么办？","我还不晓得自己该用怎样的表情和仙台同学说「早安」。","躺在床上的我裹着棉被，缩成一团。","和我一起搬家过来的黑猫玩偶在枕头旁边，但是我现在并不想像昨天那样吻它的额头。一旦嘴唇碰到它，我就会想起送我黑猫的仙台同学。若是和它说话，我一定会想像她回话的声音。","讨厌。","我现在不想去思考和仙台同学有关的事情。","然而，她就在墙壁的另一侧，等时间一到便会走出房间。如果是平常早上，我们会一起吃早餐，也会闲聊几句。这样一来，我根本不可能避开仙台同学，甚至无法不去想她。","我紧紧抓住棉被，用力闭上双眼。","如果可以，我想就这么溶解在被窝里。","希望自己就此消失，直到我能若无其事地面对仙台同学。","可是这比不和仙台同学见面更难，我轻叹一口气。","我曾经因为有不喜欢的课或是不想参加的活动这种无聊小事，诅咒带来早晨的太阳，却没有一次比今天更强烈。现在的我想诅咒太阳的心情已经达到了最高点。","昨天发生的事对我造成的影响就是如此深远。","叹出一口长到几乎会让我因缺氧而晕厥的气，坐起身来。拿起手机确认时间，发现已经超过四点，不久后仙台同学就要起床了。","她几乎不会睡过头。","即使我把自己关在房间里不和仙台同学碰面，等到该去大学的时间，她想必会来敲我的房门。要是我迟迟不肯走出房间，她说不定会闯进来。虽然我可以锁门，可是这种室内门锁只要有心，想从外面撬开并非难事。也就是说，无论我再怎么不情愿都会见到她。","统整到目前为止的考量，我该采取的行动只有一个。","在仙台同学起床前离开家。","这样我就不会见到她了。","我站起来，走进共用空间。","反射性地开灯才觉得不妙。","仙台同学可能起床了。要是被发现，她八成会出来问我这么早在做什么，我也必须和她见面。","我安静地走进盥洗室，悄悄地刷牙洗脸后回到房间。","换好衣服，盯着衣柜。","犹豫不决地思考我的下一步。","脑中浮现不太好的念头。","仙台同学会担心，也会给舞香添麻烦。","双手握拳再张开。","深深吸气再吐出。","拨了拨浏海，我抽出藏在衣柜深处的大包包。","「……舞香会答应我吗？」","包包是用来装行李，好让我借住在她家的。","其实我应该先和舞香联络，取得同意再这么做，但现在太早了。我打算带着行李去学校，碰面后再拜托她。","论物理上的距离，我和仙台同学一直靠得很近。","可是现在这个距离好难受。","让室友看见我从未让人看过的模样、听见我从未让人听过的声音就是这么一回事，我需要时间和距离来消化、接受这个事实。","我拿起坐在床上的黑猫玩偶，放到书柜上。","和黑猫四目相对，本想摸摸它又作罢。","「我很快就会回来。」","我向不会回话的黑猫说道，拿起行李，悄悄地离开房间。","没打开共用空间的灯。","在黑暗中放轻脚步地来到走廊，然后回头。","「我会暂时住在舞香家。」","我轻声朝着共用空间如此宣言，在玄关穿上鞋子。","有很多方法可以打发上课前的时间。","「……我出门了。」","比刚才更小声地说完，我打开玄关大门。","【2 仙台叶月】","宫城不在。","无论是起床后立刻来到共用空间时，还是在准备早餐的期间，宫城都不在我身边。","而且我现在明明在敲她的房门，她还是没有出来。","可是考虑到昨天的事，我想这也是无可奈何。","我不认为宫城在做完不是室友会做的事情之后，隔天还能若无其事地出现在我面前，所以这算是预料之中的反应。","我停下打算再次敲门的手。","凡事都有所谓的顺序，而昨天做的事显然忽视了应有的顺序。造成这个状况也是理所当然。","不管怎么想都是我的错。","可是制造契机的人是宫城。","都是因为她叫我舔她的脚，用来维持理性的螺丝才会松脱。在宫城面前，我的理性本来就会变得无法信任，所以宫城尽说些会让螺丝松脱的话，也是——","不，不对。","这不是谁对谁错的问题，我们也没有做什么坏事。只是做了一些不太适合室友这个词汇的事情罢了。","所以我们应该伴随着尴尬，回到一如既往的生活当中。","我也不晓得该怎么面对宫城，依然像这样站在这里。不过，我也理解她需要时间。","我决定独自吃掉准备好的早餐，坐上椅子。","看着前方，长叹一口气。","都怪平常会坐在那里的宫城不在，视野格外辽阔。即使尴尬，我也想和她一起吃饭，但是考虑到昨天的所作所为，勉强她也不好。她迟早会想踏出房门，我应该要等她主动出来才对。","我小声地说完「我开动了」，咬下涂抹果酱和奶油的吐司。","说不好吃是过分了些，可是它没有味道。","我没有特别计算使用的果酱和奶油分量，所以每次多少会有些落差。说是这么说，这和我至今吃过的吐司差太多了。尝不出果酱的甜味或奶油的咸味，煎好的火腿和蛋也不怎么好吃。用餐感觉是毫无意义的行为。","我决定把两人份的早餐中属于宫城的那份吐司也吃掉，机械性地操作手和嘴，将吐司吞进胃里。剩下的餐点冰进冰箱，洗碗盘。虽然在意宫城，但我没有不去上课的选项，于是回到房间做准备。","距离我吃完早餐又隔了一段时间，我走进共用空间。","宫城果然不在。","总觉得这样下去不管过多久都看不到宫城，我再度站到她的房门前。","吸气，吐气，敲三下门。","没有任何反应，我出声叫她。","「宫城、宫城。」我叫了好几声。","房间的主人迟迟不出来。","我一开始就知道。","房间里想必没有人。","我检视着那个方才赶出脑海、不愿去思考的事实。","她一定在我起床前就出门了。","我朝着先前因为不想积极确认而没有踏进的玄关走去。","——宫城的鞋子不在。","尽管心知肚明，我还是呼出体内的空气。","「果然是这样。」","我一边用手指按压太阳穴，一边走进共用空间，坐到椅子上。","为什么我没有更早起床呢？","要是在宫城出门前起床，我就来得及逮住她，和她一起吃早餐。她虽然不想见到我，可是一旦碰面，她应该就会发现其实也没那么严重。","所以我很后悔。","我想立刻见到宫城。","想知道她今天是带着怎样的表情，又是抱着什么样的想法离开这个家。","她有稍微想到我吗？","有回想起昨天的事吗？","我想知道这些听来无聊，于我而言却十分重要的事。","然而，就算问她，宫城也不会告诉我。","「唉～」我叹了一口气，回到房间。","拿起桌上的手机，传出『早安。你先出门了吗？』的讯息给宫城。过了十分钟，理所当然似的没收到回复。","我倒在床上。","感觉会弄皱衬衫和裙子，可是我使不出力，也提不起劲。","像这样待在没有宫城的家里，在这张床上比任何人更贴近她的昨天便有如一场谎言。然而，正因为不是谎言，她才会不在。","将掌心贴在宫城的头之前躺着的位置。","轻轻滑过后抓紧床单。","宫城的肌肤触感和体温都没有传来。","掌心能感觉的只有滑顺的布料。","要是昨天抱住宫城，不让她回房间——","我和宫城只是室友，我却在想这种事。","使劲将身体缩成一团。","再一口气伸展，靠着反作用力爬起来。","我又传了一则讯息给宫城。","『你大概几点回来？』","等了一段时间还是没收到回复。","再不出发去学校，我就要迟到了。","我把手机丢进包包后走出房间。","即使现在见不到宫城，晚上应该能见到。","对我们来说，昨晚发生的事是一起重大事件，但这不构成她不回家的理由。","我站在宫城的房门前。","至少回个讯息啦。","低声说出这句话，然后离开共用空间。"]}]}],"built":"2026-10-28"};
const BUILT = "2026-10-28 02:16";
const LS_KEY = "dafeiyu-reader-v1";

let st = {
  vol: 0, ch: 0, ratio: 0,
  fs: 20, lh: 200, pg: 45, wd: 40, font: "serif", indent: "2em", theme: "paper",
  secs: 0
};

/* ---------- 状态存取 ---------- */
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(st)); }catch(e){} }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    Object.assign(st, s);
  }catch(e){}
}

/* ---------- 排版应用 ---------- */
function apply(){
  const r = document.documentElement;
  r.style.setProperty("--fs", st.fs + "px");
  r.style.setProperty("--lh", (st.lh/100).toFixed(2));
  r.style.setProperty("--pgap", (st.pg/100).toFixed(2) + "em");
  r.style.setProperty("--width", st.wd + "em");
  r.style.setProperty("--indent", st.indent);
  r.dataset.theme = st.theme;
  r.dataset.font = st.font;
  document.querySelector("#fs").value = st.fs;
  document.querySelector("#fsv").textContent = st.fs + "px";
  document.querySelector("#lh").value = st.lh;
  document.querySelector("#lhv").textContent = (st.lh/100).toFixed(2);
  document.querySelector("#pg").value = st.pg;
  document.querySelector("#pgv").textContent = (st.pg/100).toFixed(2) + "em";
  document.querySelector("#wd").value = st.wd;
  document.querySelector("#wdv").textContent = st.wd + "em";
  document.querySelector("#font").value = st.font;
  document.querySelector("#indent").value = st.indent;
  document.querySelectorAll("#themes button").forEach(b => {
    b.classList.toggle("sel", b.dataset.t === st.theme);
  });
}

/* ---------- 渲染 ---------- */
function book(){ return BOOKS.books[st.vol]; }
function chap(){ return book().chapters[Math.min(st.ch, book().chapters.length-1)]; }

function render(keepRatio){
  const b = book(), c = chap();
  document.querySelector("#bookTitle").textContent = b.title + "　·　" + c.t;
  document.querySelector("#volSel").value = String(st.vol);

  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let html = "<h1>" + esc(c.t) + "<small>" + esc(b.title) + "</small></h1>";
  for(const p of c.p){
    if(p === "〔本话含插图〕") html += "<p class='noindent'>— 本话含插图 —</p>";
    else html += "<p>" + esc(p) + "</p>";
  }
  const last = st.ch >= b.chapters.length - 1;
  html += "<hr>";
  html += "<div class='chapnav'>" +
          "<button id='prev' " + (st.ch<=0?"disabled":"") + ">← 上一话</button>" +
          "<button id='next' " + (last?"disabled":"") + ">" + (last?"已经是最后一话":"下一话 →") + "</button></div>";

  document.querySelector("#page").innerHTML = html;
  document.querySelector("#prev").onclick = () => go(st.ch - 1);
  document.querySelector("#next").onclick = () => go(st.ch + 1);

  // 滚动位置
  requestAnimationFrame(() => {
    const el = document.documentElement;
    if(keepRatio){
      const max = el.scrollHeight - window.innerHeight;
      window.scrollTo(0, Math.max(0, max * st.ratio));
    }else{
      window.scrollTo(0, 0);
      st.ratio = 0;
    }
    tick();
  });
  buildToc();
  save();
}

function go(i){
  const b = book();
  if(i < 0 || i >= b.chapters.length) return;
  st.ch = i; st.ratio = 0;
  render(false);
}

function tick(){
  const el = document.documentElement;
  const max = el.scrollHeight - window.innerHeight;
  st.ratio = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  const b = book();
  const p = ((st.ch + st.ratio) / b.chapters.length) * 100;
  document.querySelector("#barFill").style.width = p.toFixed(2) + "%";
  document.querySelector("#pct").textContent = p.toFixed(1) + "%";
}

/* ---------- 目录 ---------- */
function buildToc(){
  const list = document.querySelector("#tocList");
  list.innerHTML = "";
  book().chapters.forEach((c, i) => {
    const a = document.createElement("a");
    a.className = i === st.ch ? "cur" : "";
    a.innerHTML = c.t + "<span>" + c.p.length + " 段</span>";
    a.onclick = () => { go(i); closeDrawers(); };
    list.appendChild(a);
  });
}

/* ---------- 卷选择 ---------- */
function buildVols(){
  const sel = document.querySelector("#volSel");
  sel.innerHTML = "";
  BOOKS.books.forEach((b, i) => {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = "卷 " + b.vol + "（" + b.chapters.length + " 话）";
    sel.appendChild(o);
  });
  sel.onchange = () => { st.vol = Number(sel.value); st.ch = 0; st.ratio = 0; render(false); };
}

/* ---------- 抽屉 ---------- */
function openDrawer(id){
  document.querySelectorAll(".drawer").forEach(d => d.classList.remove("open"));
  document.querySelector("#" + id).classList.add("open");
  document.querySelector("#mask").classList.add("on");
}
function closeDrawers(){
  document.querySelectorAll(".drawer").forEach(d => d.classList.remove("open"));
  document.querySelector("#mask").classList.remove("on");
}

/* ---------- 搜索 ---------- */
let searchTimer = null;
function doSearch(q){
  const res = document.querySelector("#res");
  if(!q || q.length < 1){ res.innerHTML = "<div style='color:var(--dim)'>输入两个字以上试试</div>"; return; }
  const out = [];
  outer:
  for(let vi = 0; vi < BOOKS.books.length; vi++){
    const b = BOOKS.books[vi];
    for(let ci = 0; ci < b.chapters.length; ci++){
      const c = b.chapters[ci];
      for(const p of c.p){
        if(p.indexOf(q) >= 0){
          const at = p.indexOf(q);
          const s = Math.max(0, at - 26), e = Math.min(p.length, at + q.length + 46);
          out.push({
            vi, ci,
            head: "卷" + b.vol + "　" + c.t,
            snip: (s>0?"…":"") + p.slice(s, e).replace(/&/g,"&amp;").replace(/</g,"&lt;") + (e<p.length?"…":"")
          });
          if(out.length >= 120) break outer;
        }
      }
    }
  }
  if(!out.length){ res.innerHTML = "<div style='color:var(--dim)'>没找到「"+q.replace(/</g,"&lt;")+"」</div>"; return; }
  res.innerHTML = out.map((o, i) =>
    "<div data-i='"+i+"'><em>"+o.head+"</em>"+o.snip.replace(q, "<b>"+q.replace(/</g,"&lt;")+"</b>")+"</div>"
  ).join("");
  res.querySelectorAll("div[data-i]").forEach(d => {
    d.onclick = () => {
      const o = out[Number(d.dataset.i)];
      st.vol = o.vi; st.ch = o.ci; st.ratio = 0;
      render(false);
      document.querySelector("#search").classList.remove("on");
    };
  });
}

/* ---------- 顶栏自动隐藏 ---------- */
let lastY = 0, hideTimer = null;
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  const h = document.querySelector("#top");
  if(y > lastY + 8 && y > 120){ h.classList.add("hide"); }
  else if(y < lastY - 8){ h.classList.remove("hide"); }
  lastY = y;

  clearTimeout(hideTimer);
  hideTimer = setTimeout(tick, 90);
}, {passive:true});

/* ---------- 键盘 ---------- */
window.addEventListener("keydown", e => {
  if(document.querySelector("#search").classList.contains("on")){
    if(e.key === "Escape") document.querySelector("#search").classList.remove("on");
    return;
  }
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  switch(e.key){
    case "ArrowLeft": go(st.ch - 1); break;
    case "ArrowRight": go(st.ch + 1); break;
    case "ArrowDown": case " ": window.scrollBy({top: window.innerHeight*0.85, behavior:"smooth"}); e.preventDefault(); break;
    case "ArrowUp": window.scrollBy({top: -window.innerHeight*0.85, behavior:"smooth"}); e.preventDefault(); break;
    case "t": case "T": openDrawer("toc"); break;
    case "s": case "S": document.querySelector("#search").classList.add("on"); document.querySelector("#q").focus(); break;
    case "Escape": closeDrawers(); break;
    case "+": case "=": st.fs = Math.min(30, st.fs+1); apply(); save(); break;
    case "-": st.fs = Math.max(15, st.fs-1); apply(); save(); break;
  }
});

/* ---------- 阅读时长 ---------- */
setInterval(() => {
  if(document.visibilityState === "visible"){ st.secs = (st.secs||0) + 1; if(st.secs % 10 === 0) save(); }
}, 1000);

/* ---------- 启动 ---------- */
load();
buildVols();
apply();
st.ch = Math.min(st.ch || 0, book().chapters.length - 1);
render(true);

document.querySelector("#btnToc").onclick = () => openDrawer("toc");
document.querySelector("#btnSet").onclick = () => openDrawer("settings");
document.querySelector("#tocClose").onclick = closeDrawers;
document.querySelector("#setClose").onclick = closeDrawers;
document.querySelector("#mask").onclick = closeDrawers;
document.querySelector("#btnSearch").onclick = () => {
  document.querySelector("#search").classList.add("on");
  document.querySelector("#q").focus();
};
document.querySelector("#qClose").onclick = () => document.querySelector("#search").classList.remove("on");
document.querySelector("#q").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const v = e.target.value.trim();
  searchTimer = setTimeout(() => doSearch(v), 220);
});
document.querySelector("#themes").onclick = e => {
  const t = e.target.dataset.t;
  if(t){ st.theme = t; apply(); save(); }
};
["fs","lh","pg","wd"].forEach(id => {
  document.querySelector("#" + id).addEventListener("input", e => {
    if(id === "fs") st.fs = Number(e.target.value);
    if(id === "lh") st.lh = Number(e.target.value);
    if(id === "pg") st.pg = Number(e.target.value);
    if(id === "wd") st.wd = Number(e.target.value);
    apply(); save();
  });
});
document.querySelector("#font").onchange = e => { st.font = e.target.value; apply(); save(); };
document.querySelector("#indent").onchange = e => { st.indent = e.target.value; apply(); save(); };
window.addEventListener("beforeunload", save);

function toast(msg){
  const t = document.querySelector("#toast");
  t.textContent = msg; t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 1600);
}
setTimeout(() => toast("数据构建于 " + BUILT + "　共 " + BOOKS.books.length + " 卷"), 900);
</script>
</body>
</html>
