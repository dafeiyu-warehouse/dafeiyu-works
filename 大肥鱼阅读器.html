啦。我不是怕，可是外面很吵。」","接在听起来像是藉口的话之后，她又补上一句：「刚才的话当我没说。」而我马上否定这点。","「没那回事。再聊一下吧。」","「要聊什么？」","「如果不想回答我，妳可以不要回答，但妳不想让我叫名字有什么原因吗？」","我问出在意的事情之一，算是比较无伤大雅的问题。","「因为只有朋友可以叫我志绪理。」","就觉得应该是这样。","我和宫城不是朋友。","即使预期的答案猜中了，我也不觉得开心。","「成为朋友就可以那样叫妳啊？」","面对这一点都不有趣的答案，我再度丢出问题，然而她没有回应，却叫了我的名字：「叶月——」","她几乎没用这种方式叫过我，让我的心噗通一跳。但那只是因为她在奇怪的地方断句，后面接着的是问句。","「——谁会这样叫妳？只有朋友？」","「朋友啊，再来是父母吧。宫城也可以这样叫喔。」","「我不是妳朋友，也不是父母。」","「就知道妳会这样说。」","跟早上会说「早安」打招呼一样，这种时候她会说的话早就决定好了。犹如速食店的固定套餐，否定我们是朋友的话语不曾从她口中消失。","我倒不是执着于朋友这个关系，就算她要否定也无所谓，然而心里依旧不太舒坦。","「仙台同学现在同样戴着项链吗？」","「戴着啊。」","「妳现在摸一下项链。」","「我自己摸？」","即使她曾单方面地摸过这条项链，却从来没要我自己摸，让我忍不住反问。","「对。」","「是可以啦……」","由于她说得实在太自然，我就顺理成章地照做了，但现在其实并非她该命令我的时间。然而也没什么好拒绝的，我决定遵从她的话。","隔着当成家居服的连帽T恤，我把手放在项链理应所在之处，轻轻摸了一下，接着跟她说：「我摸了。」结果她马上表示。","「不是隔着衣服，要直接摸。」","「妳有在我房间里装监视摄影机吗？」","「怎么可能？所以妳根本没有确实摸到嘛，直接摸啦。」","「摸就摸。」","我把手从宽松的连帽T恤下摆伸进去，直接触碰到项链的链条。大概是因为房间里很温暖，手和链条都不冰。我模仿宫城的行为，手指缓缓地滑过去。","无视指尖感受到的小小抵抗，我朝着坠饰的方向，连同肌肤一起摸着链条。","不会痒，但感觉不像是自己在摸。","总觉得静不下心来，我于是轻轻吐了口气。","「有好好摸吗？」","「有在摸啦。」","都是因为听得见她的声音，害我觉得有点怪怪的。","明明是自己的手指，却有种简直像是她在摸我的感觉。","有点难受。","指尖超乎必要地感觉着链条上小小的凹凸。","「真的吗？」","自手机传出的声音抚过耳朵，敲击着鼓膜。","总觉得好像连宫城的呼吸声都听得到，我用自己的声音掩盖一切。","「要传影片给妳吗？」","「不用，妳可以不用摸了。」","停下抚摸链条的手之后，仿佛不想让我开口般，她接着说。","「仙台同学，我要挂电话了。」","「好，晚安。」","这么说完后，她以小到几乎要输给风雨声的微弱音量回复：「晚安。」","我作了最近一直没作的梦。","感觉很不舒服。","会作梦的原因我知道。","因为我昨天听完宫城的声音才入睡。","梦的起因是暑假的最后一天，一如我在第二学期开始后曾作过好几次的梦。","说得具体一点，就是我梦到暑假最后一天发生的事。尽管也曾梦过现实中并未发生的「后续」，不过今天没有梦到那里。无论如何都很难说是醒来后会令人感到神清气爽的梦，因此被我分类为不太想作的梦。","那是当然的。","和原本的同班同学接吻，掀起她的T恤，直接触碰肌肤，对方也伸手摸我，尽管隔着内衣，却摸了胸——","作了这种梦，怎么有办法开开心心地去学校？","我叹了口气。","跟我抱住宫城的时候一样，只有她的触感渐渐变得薄弱。实在没想到随着感觉消失而越来越少作的梦，事到如今还会再度出现。","搞得好像我很希望那天能够重来，想继续下去似的，让人郁闷万分。就算真的那样想，她也绝不会容许我那么做，况且即使理性比玻璃更易碎，我也无法再做出那种事——应该做不到，所以除了郁闷外别无他法。","我拿起用来代替闹钟的手机看时间，萤幕上显示着差不多该开始准备，否则将会迟到的时间，但我的身体一点都不想动。","真不想去学校。","我盘算着干脆跷课去哪里好了，却又改变想法。","要是学校联络家里，事情就麻烦了。","我打开空调开关，爬出被窝。","「好冷。」","随意撩起不安分的头发，开始进行上学的准备。","刷牙、穿上制服。","打理仪容。我没吃早餐就踏出家门。","可以的话，真不想在学校遇到宫城，却又感觉这种日子偏偏会遇见她，使我的脚步变得无比沉重，然而只要往前走，即使不想，学校也会越来越近。我穿过校门，走进校内。","本以为在前往教室的途中或许会与她擦身而过，但是没有，我平安地来到自己的位子上。这种日子，我总会打从心底庆幸还好自己跟宫城不同班。","我一如往常地走到羽美奈身旁，聊些想要杂志上刊登的衣服、有帅哥演员出演的连续剧让人很失望云云，似乎有内容但又好像没有的话题。","在学校的我会比跟宫城待在一块时说上三倍之多的话。虽然对连续剧的话题没什么兴趣，可是聊衣服和饰品还满开心的。我跟羽美奈对衣服的喜好不同，却不排斥知道有新的店家开幕等情报。","尽管今天没什么兴致聊这些就是了。","情绪低迷的我上了两堂课，拿出运动服。","我不算怕冷，但冬天的体育课属于不想上的那种。","光是移动到更衣室就很冷了，体育馆和操场更冷，即使如此依旧不能跷课，只好和看起来比我更不想上课的羽美奈她们一起走出教室，走过连一丝温暖都没有的走廊，踏进更衣室，把东西放进置物柜，脱下制服外套。","一旁的羽美奈诉说着诸多对体育课的不满。我一边随便应声，一边解开衬衫的扣子。","「叶月，那是人家送妳的吗？」","正当我解开所有扣子，打算脱下衬衫之际，羽美奈向我搭话。","我马上就知道她指的是什么。身上会让羽美奈问是不是人家送的东西，除了项链外没别的了。","「什么东西？」","我装作没发现。","我不打算乖乖遵守宫城那个「绝对不能让我以外的人看到」的命令，然而被看见也很麻烦，是以一直躲避着羽美奈的视线。我今天并非睡不够，也不是太过疲劳，却因为脑中想着梦的事情而一时大意。","我看向身旁，只见羽美奈脸上的表情跟发现有趣玩具的小孩没两样。","确实很麻烦。","「这个——」","她把手伸向项链。","我反射性地想拍开她的手，但忍了下来。","这时要是拍开她的手反而奇怪。","会让事情演变得更麻烦。","「不用猜了，这是男朋友送妳的吧？」","指尖就这么刚好地碰上链条。","不管是谁的，人的手其实没有太大差别，无论温度或是触感都跟昨天自己摸链条时差不多，但她的指尖惊人地令我感到不对劲。至今为止，我从未对她的手有什么想法，现在却不想被碰。","「就说我没有男朋友了。」","我没太认真地说，半开玩笑地轻轻拍了一下羽美奈的手，她做出夸张的反应，看似惊讶地「咦～」了一声并抽开手。我连忙脱下制服，穿上运动服。","「叶月之前在学校不是都不戴这种东西的吗？真的不是男朋友送的？」","「要是有男朋友，他或许会送我，可是不存在的男朋友没办法送我吧？」","「既然如此，那是谁送妳的？」","「不是送的。麻理子，妳帮忙说句话啊。」","我向在羽美奈身旁换衣服的麻理子求救，她却坏心眼地笑了笑。","「不，那是人家送的吧？妳会戴上至今为止都不戴的东西，可见就是这么一回事。」","顺着完全没打算救我的麻理子的话，羽美奈乘胜追击。","「麻理子果然也这么觉得吧？再说这不符合叶月的喜好嘛。」","「没错没错，记得妳不喜欢链条偏长的项链吧？」","向麻理子搭话是个错误的决定，形势太不利了，我陷入难以翻盘的局势。她们的话几乎全是事实，我越是辩解，状况只会更加恶化。","我在学校不会戴饰品，比起长链条更喜欢短链条，现在戴的这条项链如果不是宫城送我的，毫无疑问不是我自己会戴的款式。","「告诉我们啦，对象是谁？我们学校的吗？」","羽美奈拉扯我的运动服。","「啊～真是的……这是祈愿项链啦。」","我想不到有什么话可以说服她们，只好随便胡诌一个理由出来。","「祈愿项链？」","麻理子以怀疑的眼神看着我。","「对，就是像个考生该有的样子，祈求能考上的东西。要是链条太短，在学校会很醒目，我才会挑了比较长的。」","「所以是谁送妳的？」","羽美奈带着诡异的笑容问我。","「真的啦。」","「今天的叶月找借口也找得太随便了吧？」","麻理子如此表示，羽美奈也接着说：「说出来反倒轻松吧？」","「比起这种事，再不赶快走就要迟到喽。」","开始嫌麻烦的我没否定找借口这点，步出了更衣室，身后旋即传来羽美奈的声音，听起来很开心地说：「她逃走了。」","尽管不讨厌她们两个，我却不太喜欢她们什么事情都要跟男朋友扯上关系这点。","我隔着运动服摸了摸项链。","宫城为什么会选这条项链呢？","基于链条长度，我在她房间里解开两颗衬衫的扣子时看得到项链，但只要扣上一颗就看不到，难道只是因为这样对她来说正好吗？或是多少觉得它有点适合我？实在让人在意。","「体育馆有够冷的，果然还是该跷课才对。」","听到羽美奈那句感觉会被老师骂的台词，我放下摸着项链的手。","彼此的关系正逐渐出现破绽。","开始在学校被人发现蛛丝马迹，相互做了去年不会做的事。尽管如此，到毕业典礼之前，我想这段关系依旧不会见光，却不知道到毕业典礼之前，我们到底会变成怎样。","我今天不想见宫城。","在作梦的日子见到宫城，会觉得自己好像做了什么坏事，有点尴尬，也因为羽美奈她们害我心情好不起来。","但宫城偏偏会挑这种日子联络我。","所以我在体育课结束后看了手机，看到她传来一如往常的讯息，一点都不惊讶。","宫城的房间可能是因为有开空调吧，即使脱掉制服外套仍有点热。","尽管如此，还是比冷得让人发抖的体育课好。我解开衬衫的第二颗扣子。","她的视线缠绕在我的指尖上。","原以为她会叫我再解开一颗扣子，结果什么都没说，端了麦茶和汽水进来，放在摊着课本和习题的桌面空隙，坐到我身旁。","她没有命令我。","静静地看着习题。","看来她不打算确认项链，我稍微松了口气。","今天我不希望她碰我。","否则梦境跟感觉似乎会连在一块，我不想要那样。","然而现在会这么想的只有我，她应该什么都没想才对。全是我的问题，与她无关。","我把梦赶出脑海，翻了一页参考书。","无论发生什么事，我都能表现得不当一回事，这同样不算什么。","喝了一口麦茶的我拿起笔。","没看参考书，而是看向身旁，结果听到宫城小声地说。","「仙台同学，假如……」","明明是她主动搭话的，话说到这里却停了下来，等也等不到下文，对话的蛋尚未孵化就要断气了，感觉实在不太舒服，所以我询问：「假如？」催促她继续说下去，她这才沉重地开口。","「这只是假设。」","「嗯。」","「……要是我跟仙台同学报考并考上同一所大学，念了同一所大学，妳打算做什么？」","她以听起来不太感兴趣的声音说着。","由于她仍看着参考书，没有抬起头，脸被头发给遮住，让人看不清楚她的表情。我望向她手边的笔记本，或许是静不太下心来吧，上面画了好几条毫无意义的线。","「之前有说过呀，妳不记得了？我应该是说如果能一起吃饭，感觉会很开心。」","要是能上同一所大学——","我确实是这么想的，但没有明确地思考过自己想跟宫城做些什么，除了一起吃饭这种现在也在做的事之外，并没有什么明确的想像。","基于个人的期望，想像她上了大学后就会突然变得率直，跟我一起逛街、出去玩，根本毫无意义，不管怎么想都觉得不会实现。要说她有可能会做的事情，唯有疏远我而已。","「若是邻近的大学呢？」","虽然不知道可能性到底多高，但或许会报考邻近大学的宫城语气不变地说，抬起头来。","「嗯，就一起吃个饭吧？」","「根本一样嘛。只有这个？」","「不然也没什么好做的啊。要做点其他的事情也行，然而妳一定会说我们不是朋友，所以不要做那些事吧。」","我大概预料得到她可能会说些什么，也猜想只要抢先说出台词，她就会无话可说。这点同样猜中了。","如我所料，宫城什么都说不出口。","我握住她放在桌上的手。","尽管没有用力握紧，她的手依旧稍微抖了一下，不过反应也就只有这样，没有生气。","今天早上作的梦所产生的尴尬刺激着罪恶感，我却不想放开她的手。","究竟是因为作了梦才想碰她？还是因为对方是宫城，才会想要碰她？我在无法判断的情况下摸了她的指尖，手指滑入她的指缝间。那只手好柔软，有点湿润，感觉好舒服。","像这样触碰她，会让我不想只局限于手，想多触碰更多地方，想知道她是否也会跟我作同样的梦。","我用力握住她的手。","她没有回握住我。","不仅如此还想溜走。","「仙台同学，这样我不能念书。」","不希望她主动碰我。","我原本的确是这样想的，但现在已经不认为自己还有那样的念头了。并非由她主动，而是由我主动的话或许就行，也有可能根本不是这样，我搞不清楚，却仍想触碰她，继续抓着那想溜走的手。","「没关系，我也不能念书。」","「才不是没关系……做这种事情很有趣吗？」","宫城露出不满的表情。","「还满有趣的。」","「感觉握着我的手一点都不有趣就是了。」","我并非无法理解她想说什么。","也不知道为什么握着别人的手自己会觉得有趣。即使如此，我依旧想碰宫城，所以这也没办法。","「有不有趣是由我决定的。况且要是在这里跟妳以外的人握手才恐怖吧，妳晚上会睡不着觉喔。」","「别说奇怪的话啦。」","她皱起眉头，从我手中溜走，脸上依然挂着一看就知道很不高兴的表情，抓起放在地板上的面纸盒。","「不如握这只手好了？」","她把套着鳄鱼盒套的面纸盒塞给我。尽管没特别想牵鳄鱼的手，但我还是握手了。","与宫城的相比，鳄鱼那个握起来实在短得不太够握的手非常柔软，虽然没有体温，却也不会很冰，所以触感还不错。可是就算握着它的手也一点都不有趣。","比起我，鳄鱼在这个房间里待了更久，宫城可能很喜欢它吧，身上连一点脏污都没有。尽管也曾看过宫城相当粗鲁地对待它，但它还是好好的。","比起恶劣的态度，我也想在某种程度上受人珍惜。","「有趣吗？」","看着抱住鳄鱼的我，宫城冷漠地说。","「好像没那么有趣。」","我摸了摸表情远比主人老实多的鳄鱼鼻尖，吻了一下。","没有体温的鳄鱼与宫城的嘴唇不同，即使吻了也不有趣。如果这是她就好了……我就是如此地摆脱不了梦境。","「别做那种事啦。」","她这么说着，抓住塞给我的鳄鱼尾巴，把它抢了回去。","「又没关系，只是吻一下鳄鱼而已。」","「有关系。」","「妳很冷漠耶，找妳也不来。」","我拍打被宫城抱在怀里的鳄鱼头，喝了口麦茶。","在音乐准备室那件事之后——说得更详细一点，是距今约一周前——我又在学校里把宫城叫了出来，可是她没有来音乐准备室。","虽然没有告诉我她不来的原因，但我大概想像得到。","想必是之前提出的交换条件不好。","显得莫名谨慎的她铁定是在防范我，觉得我可能会做出比触碰更进一步的事，才不来赴约的。","「那件事之前已经说过了吧？不是有说即使妳叫我，我也不会去吗？」","她一脸嫌麻烦的样子。","我并非第一次跟她说起这件事，所以也懂她为什么会嫌烦。","「是没错，可是妳没打算要来，就该更早联络啊。」","她没来音乐准备室的那天，过不到十分钟就联络我了，所以其实不到嫌太慢的程度，况且我本来就觉得她不会来。尽管如此，不管抱怨多少句我都觉得不够。","「我联络得已经很早了，也不想再提出交换条件。」","她说出一如预料的答案。","「感觉我对宫城做的事情根本不是什么大事嘛。」","「下次说不定就会变成大事啦。」","「不会啦。」","我不敢说自己没有邪念，却不可能做她真的很抗拒的事。","但我也知道自己毫无信用可言，即使这样说，她也不会相信我。现在我也想再多触碰她，做些会让自己失去信用的事情，然而要是再失去信用，可能就连她的手都碰不到了，所以我摸了摸在宫城怀里的鳄鱼头。","「……那妳本来找我过去是想做什么？」","她喃喃说道。","「倒没有事先决定好啦。不过……这个嘛～想要妳叫我名字吧？」","虽然知道答案会是什么，我依旧说出了小小的希望。","「名字？」","「对，叫我叶月。」","一旦照这样顺利发展下去，就算不是父母期望的大学，我也能获得想要的「大学生」身份，得以离开家人，自己在外生活。","但也就只是这样罢了。","我也觉得自己十分傲慢，却希望能多少改变不肯表态要上同一所大学，也不肯表态要念邻近大学的宫城。","——比方说，变成会叫我「叶月」的宫城。","总觉得小小的变化，会连系着巨大的变化。","「我不要叫。」","「至少叫个一次嘛。」","立刻回答这点一如预测，即使加上「一次」这个条件也没用，同样在预测的范围内。尽管如此，我想着还是可以说说看吧，所以说了，随即不抱期望地望着宫城。","她和我对上眼，又马上瞥开视线。","她低着头……","然后小声地说。","「我才不会叫妳……叶月。」","嗯，勉勉强强。","虽然很难说这样算不算数就是了。","当作她叫了我的名字应该也行吧。","早上几乎烂到底的心情也变得好多了。","我从宫城手里抢走鳄鱼，握住她的手。这次她轻轻地回握了我的手。","〔本话含插图〕"]},{"t":"后记","p":["非常感谢各位阅读《我买下了与她的每周密会～以五千圆为藉口，共度两人时光～》第三集。","本书是改写、修正网路连载版小说的内容，并加上专为成书版撰写的内容而正式出版的产物。","这次第三集也伴随着U35老师绘制的宫城和仙台发售。","而在第三集发售前，发生了一件我想告诉各位的事。","《每周密会》在《这本轻小说真厉害！2024》中上榜了。而且还——","拿下了文库部门第九名！新作部门第七名！","真的非常感谢支持我的各位！","多亏有各位，本作品才得以上榜。","也诚心感谢总是为本作品绘制精美插图的U35老师、责任编辑，以及在各方面协助本作品出版的大家。","但我完全没想到能进入十名内，所以非常惊讶。尽管因为太过高兴而吃了许多美食，导致储蓄的脂肪有了长足进展，不过今年拜《每周密会》所赐，我获得满满的幸福。","那么，幸福的其中之一——","，宫城和仙台有了声音。","注：此指日本的出版状况","这也是一件令我非常幸福＆惊讶的事。虽然想着要是哪天她们两人能有声音就好了，却万万没想到这么快就能实现心愿……而我提出的许多希望，在脚本的台词上也得到采纳，让我更是加倍感到幸福！","况且没想到居然能请到Lynn小姐饰演宫城、市ノ濑加那小姐饰演仙台。关于宫城的声音，我以个人希望的形式，把包含Lynn小姐的几位声优姓名告诉责任编辑，在人选正式定案之前都过着紧张期待的日子，结果成功地请到Lynn小姐演出我理想中的宫城。至于仙台的声音，虽然同样提出了希望的人选，但她的声音在我心中并没有明确的形象，不过这次请到市ノ濑小姐，配出了我觉得「这就是仙台！」的声音，让人非常高兴。","真的很感谢Lynn小姐、市ノ濑小姐，宫城与仙台的声音都与我心中的形象一致，耳朵实在太幸福了。由于实在太适合，要是还有机会再听到两人的配音就好了。","在第三集发售前还发生了许多事情，不过先让我稍微提一下为成书版增写的幕间和番外篇（接下来将会提及故事内容，还没看的人请先跳过这段）。","番外篇〈那不适合仙台同学〉是我原本就想找机会描写，买下项链时的宫城。因为可以了解到那条项链是基于怎样的经过才被她买下的，要是大家能感受到她这个人有多麻烦就好了。幕间〈有宫城在的房间〉则是第五话〈仙台同学很任性〉的仙台视角，能够多少理解在网路版很少触及的仙台家庭环境。","写着写着，似乎也累积到合适的页数。","虽然已经到了尾声，但我想再次道谢——阅读第三集的各位、在网路上鼓励及支持我的大家、U35老师、责任编辑、在各方面协助本作品出版的人士们，真的非常非常地感谢你们。另外还要感谢好友N，谢谢你每次都来帮我！","那么，希望能在第四集的后记与各位再见！","羽田宇佐","〔本话含插图〕"]},{"t":"番外篇　那不适合仙台同学","p":["当时我觉得那很适合仙台同学。","然而经过了一段时间，现在我不知道。","受托采买校庆物资的那天，在购物中心看到的项链夺走了我一部分的记忆容量，直到今天仍未消散。明明如此，我却无法想像仙台同学戴上那条项链的模样。","没有其他人在的房间里，我趴在放著作业的桌上。","想把那条项链赶出脑海里。","区区一条项链，居然盘据在脑海一隅，实在太嚣张了。平常明明会忘记，但在念书的空档或是睡前又会重新复苏，简直就跟僵尸一样恶劣。","——银色的链条下垂着小小坠饰的项链。","那是当我们完成跑腿的任务，提着采买到的东西移动之际看到的……正确来说是闯进了我的眼里。摆着那东西的是不适合我的杂货柜位，平常只会经过，根本不会踏进去，然而那天不同，我在平常总是会直接通过的柜位前停下脚步。","我不认为那是命运般的邂逅，眼睛却无法离开有着月亮造型的那东西，将它和仙台同学连结在一块。","感觉很适合她。","而在这种愚蠢的想法一下浮现一下消失的期间，校庆结束了，也不知道那条项链是否还在店里，可是大脑不时会重新播放这条项链的影像，拒绝从记忆中消除它的存在。","要从记忆中消除这条项链的方法，大概只有一个。","——店里没有。","简单来说，只要确认「项链已经卖出去了」的事实就好，因为没有的东西我也买不到，这样便能让这条项链从记忆中消失。","我抬起头，阖上课本，拿起放在桌上的手机。","距离开始写作业还不到一个小时。","现在仍来得及。","购物中心还没打烊。","我今天没叫仙台同学过来，所以有时间，作业等回来再写也来得及。只是要去店里确认那条项链已经不在了而已，根本小事一桩。","没错，那条项链绝对已经卖出去了。","距离我们采买准备校庆用的东西那天，已经过了好一段时间，它不可能还在架上。照理说确认已经没卖的东西毫无意义，但对我来说这件事很重要，所以跑这趟是有意义的。","总比心思一直被没有的东西给夺走来得好，一旦没有，我的心情就会舒畅许多。假使还有在卖，到时候再想该怎么办就好了。不管结果如何，都比心思受困于在已经结束的校庆前就看到的东西要好。","拉开窗帘，窗外的天色逐渐转暗，我穿上针织外套。","要是有什么状况就麻烦了，所以我还是把钱包放进包包里，踏出家门。","虽然这时间去购物中心算是有点晚，我仍慢慢地走着。","急着赶去也没意义。","只是要确认那条项链是不是卖出去了，那对我来说并非必需品，对仙台同学来说也不是，根本没必要着急。","我走在微暗的街上，和去采买校庆物资时一样踏进了购物中心，朝那条项链所在的柜位前进。","我以慢得不自然的速度一步步地走着，逐渐接近，前往项链的位置。","「……太奇怪了吧？」","项链得卖出去才行。","不该有机会买下才对，但不知为何在那里。","不该浮现的话语浮现。","怎么办？","本来没打算犹豫的，现在却陷入犹豫。","钱包里有足够买下项链的钱。","明明想说只要没有就能死心，让心情舒畅一点，却冒出既然还在卖，买下来或许也不错的思绪——这是有原因的，因为要是没有买就回去，我又会回到不断想着这条项链的日子当中。","这种事情不会一再发生。","由我买下让仙台同学戴的饰品这种事，这次恐怕就是最后一次。","这是往后绝不会再发生的事，所以就容许这一次好像也可以，况且要不要把买下的东西交给仙台同学是另一回事，即使买了，也没人规定一定要送给谁，我留着自己用也没关系。","我朝项链伸出手，又马上缩了回来。","轻轻呼出一口气。","并非因为这个适合她才买的。","如果是她，不管戴什么一定都很适合，便宜的饰品看起来也会变得很高级，就连我戴起来很俗气的东西，在她身上也会很好看才对。","既然是要给她这样的人，款式根本不重要。","买这条项链，只是要用来当成厘清彼此关系的道具。","最近的仙台同学太得意忘形了。","在学校把我叫出去，吻了我。","不打算遵守规则。","不仅如此，还一副不守规则根本理所当然的态度。尽管有很大的原因是暑假让规则变得暧昧不清，但距离那件事都过不只一个月了，我们应该回到正轨上。","我要用名为项链的锁链束缚她，让她知道谁才是下「命令」的一方。她最好回想起来，我们要共度时光必须有五千圆。","有形又可以一直戴在身上的项链，最适合拿来当成这种道具。","虽然不像耳环那样可以在身上留下痕迹，却能束缚她直到毕业典礼那天，而且只要买了，我就不用再回去过着成天挂念项链的日子。","我拿起那条在银色链条下垂挂着小小坠饰的项链。","店里有许多可爱或漂亮的东西，很难走去结帐。","要是舞香跟亚美在这里就好了，然而看到我买了平常不会戴的饰品，一定会激起她们的好奇心，抓着我追根究柢地问个清楚。","没事的。","只要付钱就能买了，跟买泡面没什么不同。我鼓起勇气踏出脚步，拿着项链到收银台前，明明想早点离开这里，却在店员问起要不要包装这种无关紧要的小事时犹豫了。这不是礼物，不过要给她的话，除了当成礼物赠送之外，好像也没有其他选择。结果我还是选了缎带跟包装纸，付了钱。","走出那间店，踏出购物中心，我来到街上。","微暗的天空已经完全抹上一片漆黑，路灯照亮了人行道。","我慢吞吞地走在先前缓缓走来的路上。","天还亮着的时候没什么感觉，不过有些凉意。","夏天结束，时值秋日。","即使白天仍会让人察觉到夏天依依不舍的余韵，但晚上早已完全感受不到半点夏天的气息。季节会转变，夏天结束后是秋天，再来是冬天。待冬天到来，有毕业典礼的春天也会随之而至。人们无法一直生活在秋天的世界里。","原本就已经很慢的步伐更慢了。","我刚买下的小盒子内容物，预定成为联系我们到毕业典礼为止的存在。","除此之外什么也不是。","等毕业典礼到来，我们就会分道扬镳，不再有交集。","要去不同的大学就是这么一回事，我们的日子将不再重叠，彼此的身影逐渐变得模糊不清，记忆也会出现缺漏。","这是理所当然的事，我也认为未来就该是这样。","我会去念大学，也会念书，却不觉得有念书就能和仙台同学考上同一所大学。真要说起来，我原本就没想过要跟她上同一所大学。","再说我往后也不想在与她的记忆上贴标签，未来不该改变。","遵守已经决定好的事。","项链只是用来补强五千圆的东西。","这样就行了。","我们之间这样正好。","然而即使有理由买，也没有理由把买回来的东西交给她。","仙台同学是从二年级的七月开始来我房间的，即使时间来到三年级的校庆，我依旧不清楚感觉能当成送项链理由的生日是什么时候。","我的脚慢慢地、慢慢地往前迈进。","里头明明没装什么重物，包包却很沉重。","没买就好了。","忍不住想叹气。","我大力甩动既轻且沉重的包包。","〔本话含插图〕"]},{"t":"特典　衬衫的扣子和宫城的视线","p":["「呼」地吐出一口气，我摸了一下依然扣得好好的、衬衫从上面数来的第二颗扣子。","但也只有摸而已，马上就放下了手。","我没办法解开平常早就解开了的扣子。","我很介意。","不介意还比较奇怪。","宫城看我看得太频繁了。","她本人或许没意识到，但她的视线紧紧缠绕在我的衬衫扣子上。","「宫城，我说啊……」","我看向不至于到紧盯着我不放，却不断将视线投向我，令我无法不在意的房间主人。","「仙台同学妳很吵耶。」","暑假结束，进入九月之后，这是我第二次放学后在这个房间里和宫城碰面。我们也差不多该恢复到原有的样子了──我是这样想的。可是宫城看着我的眼神，只让我觉得到了暑假结束后的现在，她还在介意暑假时发生的事。","「我什么都还没说耶。我只是想问妳现在在做什么而已。」","我坐在平放著作业以及参考书的桌子前，开口问坐在对面的宫城。","她今天也没有坐在我旁边。","我认为这也是我们没办法变得像以前一样的原因之一。","「……仙台同学，妳的眼睛有睁开吗？」","「我看起来像是闭着眼睛吗？」","「既然有睁开，妳用看的就知道我在做什么了吧？」","对面传来她不高兴的声音，原先投向我的视线挪往别处，改成橡皮擦飞了过来。我捡起掉在地上的橡皮擦，放回桌上。","「应该是在写作业吧。」","「既然知道就不要问我。」","「妳不会有明知道但还是想问的时候吗？」","「没有。」","随着冷漠的回应，宫城把笔在桌上，然后轻轻叹了口气，翻了一页参考书。","「仙台同学妳是怎样？」","不肯坐到我旁边的宫城用比刚才更冷淡的声音说道。","「怎样是怎样？」","「妳有什么想说的就说啊。」","「宫城才是，妳没有什么想跟我说的话吗？」","「没有。」","对于她今天第二次的「没有」，我回了句：「我就知道妳会这样说。」接着像宫城一样翻了页参考书，解开了一个问题。","虽然不到勒着脖子的程度，但我觉得很难呼吸。","我很在意在这个房间里却没有解开第二颗扣子的自己。","手下意识地移动。","感觉那只手又想去摸没办法解开的第二颗扣子，我用力握紧拳头。","原本待起来应该很舒适的房间，待起来却很不自在。","这个房间离「一如往常」的模样感觉很近，却又很远。","暑假似乎不肯轻易地变成过去，仍持续待在这个房间里。要是暑假更短一点，我们或许就能度过一个一如往常的今天了。","「喂，宫城。妳来写这个啦。」","我想转变一下心情，把我的考试题库放在宫城的面前。","「我在写作业耶。」","「又没关系，作业可以等一下再写啊。」","「这种事情我会自己决定，仙台同学妳不要管我。」","「那休息一下好了。」","宫城瞬间露出了惊讶的表情，接着立刻垂下视线看着考试题库。看到她的反应，我才意识到自己说错话了。「休息」是会让我们回想起暑假的词汇，不该说出口。","「我要写考试题库。」","宫城低声说道。","太在意不是好事。","我重新坐好，挺直了背脊。"]},{"t":"特典　仙台同学不肯醒来","p":["好安静。","不对，正确来说是有一些声响。","可是我觉得很安静。","仙台同学到刚才还一直叫我帮她贴退热贴，说这种平常不会说的话：「宫城要是感冒了，我会去照顾妳。」现在却睡得很熟。","以时间来看，大概过了十五或二十分钟吧。","说不定更久，总之在仙台同学睡着之后已经过了一段时间。而我的手依旧被仙台同学给当成了人质，不知何时才会被释放。","简单来说，就是我和仙台同学牵着手。","──静不下心来。","来看看她是无所谓，但我没料到事情会演变成这样。我既不是为了和仙台同学接吻才来她房间，也不是为了听她耍任性而来。当然，也不是来跟她牵手的。","就一点点。","只是有一点点担心她。而这份担心也已经消失了，所以我大可打道回府，然而睡着的仙台同学一直握着我的手，让我没办法回去。","「……仙台同学。」","我仍旧坐在地板上，试着小声地呼唤她。","等了也没有回应。","突然把人丢在沉默的空间里置之不理，未免太不负责任。早知道会这样，我就不听她无聊的任性要求了。","我轻轻拉动棉被。","她果然还是没有反应。","我轻轻握紧她的手。","她没有回握住我，也没有要醒来的样子。","我跪着挺直身体，看向床上。","仙台同学在睡觉。","我碰了碰退热贴，感觉到似乎还算冰凉，又不是真的很冰凉的尴尬温度。虽然帮她换一片新的好像比较好，可是要换的话，她好像会醒过来，这样吵醒她也有点可怜。一想到她感冒了，我的良心便痛得没办法采取行动。","这样我根本就不知道该怎么办才好嘛。","我用力握紧我们牵着的手，仙台同学的身体抖了一下。我反射性地想抽手，她的手却不肯放开，不仅如此，还紧紧地握住了我。","我和仙台同学无法分离。","手好热。","流出了手汗。","我开始在意起本来刻意不去在意的事。","硬是扳开她一直握着我的手。","仙台同学的嘴巴动了动。","耳边传来了一些模模糊糊、不成语句的声音。","我虽然跟仙台同学说：「妳不睡，那我就要回去了。」却没说在她睡着之后，我也会一直留在这里。","所以我可以回去。","应该说我得回去了。","该给她的东西也给她了，我在这房间里已经没有什么能做的事情。我从包包里拿出笔和笔记本。撕下一张笔记本的内页，写上「给仙台同学」之后，手便停了下来，把撕下的那张纸揉成一团，跟笔还有笔记本一起收进包包里。","我不需要留字条给她。","她醒来之后发现我不在，就会知道我回去了。","我站起来打算离开房间，又转身回去。","悄悄走到床边，撕下仙台同学头上的退热贴。然后从盒子里拿出新的退热贴，轻轻贴在她的额头上。","「我要回去了。」","我小声地对她说完后，仙台同学含糊不清地说了些什么。"]},{"t":"特典　宫城的「东西」存在感太强了","p":["我一边听老师上课，一边摸着领带上的结。","把领结系得比平常更紧，又立刻拉松。","领带的款式只有一种，男生女生都一样，是学校指定的制服的一部分，我们有义务要穿戴，领带就是这样的柬西，几乎所有学生都乖乖地在脖子上系着同样的领带。","所以我在上高中之后，也一直什么都没多想地系着领带。","可是现在不一样。","这条照理说跟羽美奈和麻理子同款的领带，从制服的一部分，只是基于义务才穿戴的东西，变成了穿戴在身上就会令人在意的东西。","因为这是宫城的领带。","就只是因为这样，让领带有了超越制服的意义。","我又摸了在宫城的命令下，和她交换的领带上的结。摸起来跟平常一样，毫无特别之处，就是一条普通的领带。","用手上的笔尾端戳了戳额头，仔细听着老师的声音。毕竟不管是不是考生，最好都要认真上课。我把黑板上的字母抄写在笔记本上。","宫城的英文不太好呢。","仿佛突然打断了教室里老师的说话声，去年的宫城浮现在我脑海中。","她看起来不像有认真在上英文课的样子。","可是今年──-","因为是考生了，她应该有认真在上课吧。","我想大概、一定是这样。","因为我没办法亲眼看到，只能用猜想的。","我真的是……为什么会去想这些？","都怪我们交换了领带，宫城在我脑中占据的部分又变得更大了，上课途中也满脑子都是杂念，无法专心。害我这个考生遇到这种事，宫城这个人实在很过分。","她也没说想要交换的理由。","虽然她的行动充满谜团是一如往常的事，我也已经习惯了，但是间接妨碍到我念书可不好玩。而且我还不知道宫城到底有没有把跟我交换的领带系在身上。","交换应该有什么理由才对，所以宫城应该要说清楚，也该让我知道她有没有系上交换后的领带。","宫城说连衬衫都要交换，结果只有我脱了衬衫，她自己却从衣柜里拿出衬衫来。既然她做了这么奸诈的事，我希望她至少拿出这点诚意来。","到现在还是不能接受只有我脱了衬衫这件事。","居然欺骗了相信她会当场脱掉衬衫的我，怎么可以有这种事？","我有很多话想对宫城说，却一直没能告诉她。","在那之后就没有和她碰面。","也没办法穿上她的衬衫。","衬衫和领带一样，是属于制服的一部分，不管是穿谁的，都没人看得出来，可是穿上衬衫，宫城就太接近我了。","我拉扯只是区区布片，却强烈地彰显出存在感的领带。","我的东西该回到我手里，宫城的东西也该回到宫城手里。","这样一直没办法专心上课下去，实在很困扰。","我用指尖用力按压太阳穴，轻轻叹了一口气。"]}]},{"vol":"04","title":"我买下了与她的每周密会 · 卷04","chapters":[{"t":"简介","p":["到了春天，这段关系就会结束了，","然而我现在仍能轻易地和她见面，也找得到见她的理由──即使是在寒假期间。","之所以想见仙台同学、想碰触她，全是因为她先打破了我们订下的规则，","所以她应该负起责任，否则我会很困扰……","可是仙台同学什么都没对我说……","到了春天，这段关系就会结束了。","就算我们考上邻近的大学，也无法维持和现在完全一样的关系。","即使如此，我仍期盼往后的未来，宫城能在身边。","现在想着这种事情，算是违反契约了吗？","我希望从她口中得到这个问题的答案。","「──宫城，你不会想跟我见面吗？」"]},{"t":"第1话　这不是在拜托仙台同学","p":["时间来到了十二月。尽管如此，也不代表生活有什么剧烈转变。","还是老样子有考试，我也依旧持续会叫仙台同学到我房里来。","今天她也听从我的命令，没问我这个月初的期末考成绩就回去了。","所以她不知道我的成绩比预期更好。倒不是希望她知道我的考试成绩，然而期中考时她明明叫我要给她看成绩，对期末考成绩却不闻不问，让人很不高兴。","追根究柢，仙台同学都特地把我叫到音乐准备室，询问有关大学的事了，却完全不问期末考成绩，感觉很不自然。因为她之前很想知道我打算报考哪间大学，又叫我跟她报考同一所大学，要是不多少在意一下我的考试结果就奇怪了。她甚至说过「如果我们上了同一所或邻近的大学，可以一起出去吃饭的话感觉会很开心」这种不知该说具体或抽象的事情。总觉得实在不像是一个说过这种话的人该有的行为。","讲是这样讲，但特地把自己的成绩告诉她，感觉也很奇怪，所以我不打算主动跟她说。","如此一来，仙台同学既没有要问我考试成绩，我也不打算把成绩告诉她，彼此的意见是一致的。也就是说没有任何问题。","真要说起来，只有我会觉得她没问我考试成绩很奇怪吧。毕竟一般来说，没人会特地去问别人的成绩，这也不是需要告诉别人的事。仙台同学会想问我的期中考成绩只是一时兴起罢了，她对期末考成绩并没有太大的兴趣。","八成是这么回事，这样想就对了。","一定是因为我把考试成绩看得太重要了。","铁定是这样没错。","我把摊开在书桌上的考卷收起来，将空调的温度往上调高了一度。寂静的夜晚里，只听得见空调出风的声音。在除了我以外没有别人的房间里，微小的声音听起来格外响亮。","我拿起桌历。","进入十二月后仅剩最后一张的桌历，不用看也知道已经用掉了比一半更多些的部分。今年只剩下大约两周，其中有一半是寒假。","我叹了口气，把桌历盖在桌面上。","今天的天气从早上开始就很晴朗，现在也没有下雨。","家里虽然没有人在，但我已经习惯一个人了。仙台同学会在放学后来到这个房间里，到了晚上便没有其他人在，这是理所当然的事。","我拿着手机，倒在床上。","寒假已经近得可以说马上就要到了。在那之前还有耶诞节，路上装饰得五彩缤纷，行人们看起来都很兴奋。亚美也说她耶诞节跟男朋友有约，那天要忘掉考试的事大玩特玩，一副很开心的样子。","我不太喜欢那种气氛。","我基本上也有安排行程，跟去年一样，耶诞节时会跟舞香一起出去玩，却也仅止于此。我们没有要交换礼物，只会普通地度过那天。即使如此，和舞香出去想必会很开心，我也很期待。","可是比不上去年。","理由我自己也明白。","因为耶诞节结束之后，我就没有什么行程了。","爸爸和平常一样几乎不会回家，我跟仙台同学也没有约。不同于改了规则的暑假，寒假的行事历一片空白，我对这点很不满。","我慢条斯理地浏览着手机萤幕。","擅自认定我很胆小的仙台同学没有打来。我知道之前她会打给我，是因为那天的风雨很大，她没打来的夜晚才是一如往常的夜晚。","要是又下雨了……","我想着这种事，一边把手机萤幕朝下，放到枕头旁边。","「——叶月。」","我下意识地说出声。","就算和舞香考上同一所大学，我与仙台同学也不会像现在这样碰面。随着毕业典礼到来，我将失去命令她的权力。即使找理由见面，也不可能一天到晚都在一起。无论上了哪一所大学，彼此的关系都会变得不同于过往。","然而现在我仍能轻易地和她见面，要找个见面的理由也不难。","即使是在寒假期间也一样。","我和她虽然不是会在耶诞节相约碰面的那种交情，却会一起念书。既然如此，在寒假期间也可以像暑假时那样一起念书。","假日不碰面的规则有跟没有一样。我们已经在暑假打破了这条规则，所以寒假也没必要继续遵守。尽管接近大考，寒假期间也不长，但应该还是可以抽出时间见个一两次面才对。考虑到暑假的状况，总觉得这种见面的频率，应该尚在可以接受的范围内。","可是仙台同学什么都没对我说。","都快放寒假了，却没说「我来教你念书」或「我们寒假也见个面啦」诸如此类的话。她明明会突然抱住我、握我的手，净做些奇怪的事情，却没说出那些我觉得她应该会说的话就回去了。","我把手伸向床边，将放在地板上的鳄鱼拉上床。","抚摸鳄鱼，握着它的手。","柔软的手不甚可靠，与人类的手截然不同。","曾被仙台同学握过手的鳄鱼面纸盒套动也不动，没有回握住我的手。","这是理所当然的事，我却觉得很无趣。","从背上长出面纸的这个玩意，就只是个面纸盒套。","不是仙台同学。","心知肚明的我仍摸了摸鳄鱼的鼻尖，把嘴唇凑过去。","接着「呼」地吐出一口气，在嘴唇碰到之前，将鳄鱼放回地板上。","无论再怎么握它的手，把嘴唇凑向它，它也不会变成别的东西。然而它的职责却因为仙台同学而改变，让人忍不住叹气。这个房间里的东西和仙台同学的关联性太过密切，成了思绪转到她身上的契机。拜此所赐，我本想沉入脑海深处，不再去思考的事情又冒了出来。","如果……","如果我说希望仙台同学寒假也能来教我念书，她会像暑假时一样来教我吗？","其实我觉得她应该主动提议才对。","既然要我跟她报考同一所或邻近的大学，做这点事是理所当然的。真要说起来，我会想碰触仙台同学，希望寒假也能跟她见面，一切的一切全是她的错，所以她应该要负起责任，否则我会很困扰。","我握着手机，钻进棉被里。","手机萤幕上显示着仙台同学的名字。","再这样下去，我没办法敲定寒假的行程。","虽然对于打破规则这件事已经没什么好犹豫的，我却不认为要仙台同学来教我念书，她就会乖乖答应。就算表示会支付五千圆，叫她来教我，总觉得她依旧会拒绝。","作为命令代价所支付的五千圆，正逐渐失去效用。","还是提个交换条件比较好吧。","例如——","我把自己就快想到，差点浮现在脑中的那个「例如」给绑上重物，沉入思绪的大海中。","「啊～～真是的。麻烦死了。」","伴随着声音，我把脑中所想的事全吐出来。","我没有现在打电话给她的理由，也没有要跟她说的事。","距离寒假还有一点时间。","不用这么着急也没关系。","仍握着手机的我，整个人缩成一团。","虽说期末考的成绩已然出炉，也快要放寒假了，但教室里并不像暑假前那样充满兴奋期待的气息，同学间出现了更多像是考生会有的对话，令人心情沉重起来的对话也增加了。不过有来上学的日子，就能叫仙台同学来我家。","不管有没有理由都无所谓。","直到不久之前，我都是当日发生了讨厌的事情，才会叫她过来。然而现在已经没差了，我会在想叫仙台同学过来的日子叫她过来。","今天也是，明明没什么特别的原因，却叫了仙台同学过来。","即使如此，总觉得我刻意避开二十四日跟二十五日，选择十二月二十三日作为我们第二学期最后一次碰面的日子，是值得夸奖的行为。","毕竟仙台同学耶诞节感觉起码会有一两个约，我也跟舞香有约在先。况且总觉得该避开可能会残留在记忆里的日子，所以选了今天。","不知道仙台同学怎么想就是了。","我端着两人份的红茶和一个盛有点心的盘子回到房间，将它们放到桌上。仙台同学一如往常地脱下制服外套，解开衬衫从上面数来的第二颗扣子。我在她身旁坐下后，她指着那些虽然都是方形，但大小、形状不一的点心开口。","「这是什么？」","「法奇软糖。」","「法奇软糖？」","「一种英国的甜点。是我爸爸带回来的。」","「好吃吗？」","大概是第一次吃吧？仙台同学迟迟未将法奇软糖放进嘴里，一直盯着它观察。","「好像是用奶油、砂糖跟牛奶做成的。」","「咦，那热量应该很惊人吧？」","「应该吧？我昨天吃了，超甜的。」","茶色的块状物看起来虽然很像牛奶糖，可是放进嘴里便会瞬间化开，比一般牛奶糖甜上十倍。然而不只是甜，同时也带着浓郁的牛奶风味，让人想一吃再吃。","「所以你今天才会准备红茶啊。」","仙台同学恍然大悟。","「你比较想喝麦茶吗？」","「只要不是碳酸饮料都好。只是因为你平常都喝汽水，我才会觉得很难得。」","这么说的她捏起一块法奇软糖后，又接着说：「也难得你会端点心出来呢。算是提前庆祝耶诞节吗？」","「不是。只是因为家里有，我才端出来的。」","「这样啊。」","还以为仙台同学会说些调侃我的话，但她没再多说什么，吃了一口法奇软糖。咽下软糖后，她惊讶地挑眉，开口说道。","「我觉得这很好吃，不过是那种绝对不能吃太多的玩意。」","她一边吹凉，一边喝了口红茶。将内容物减少了约三分之一的茶杯放回桌上后，她的手再度伸向法奇软糖。可是那只手没捏起像牛奶糖的方块，又回到了茶杯上。","「仙台同学，张开嘴巴。」","见我捏起法奇软糖，仙台同学的手放开茶杯。","「这是命令？」","「对。」","给出肯定的答复后，仙台同学莫可奈何地张开嘴。我把手里的点心拿近她。","茶色方块抵上嘴唇，我的指尖也顺势碰触到她的嘴唇，传来些许柔软的触感。","我曾经连同给她的项链，触碰过好几次她的肌肤。","而嘴唇比那柔滑的肌肤更加柔软。","尽管这让人想更仔细地品尝那份柔软，我仍将饱含大量糖分的方块塞进仙台同学嘴里。","「好甜。」","她咀嚼着点心，喃喃道出的话就跟昨天的我不禁脱口而出的感想一模一样。我看准法奇软糖消失在她口中的瞬间，又捏起一块。","「这块也吃掉。」","我将软糖抵在仙台同学的嘴唇上，她乖巧地张开嘴。","把牛奶糖色的点心塞进她口中后，我比刚才更缓慢地用指尖抚过她的唇瓣。尽管仙台同学紧闭着双唇，我却依旧没移开手指。这时她抓住我的手腕。","「宫城也吃啊。」","还不知道她嘴里的东西到底吞下去了没，仙台同学便这么说，放开我的手腕。见她似乎打算伸手去拿法奇软糖，我抢在她之前拿起一块茶色的点心。","「我自己吃。」","我昨天已经吃了不少，今天在仙台同学来之前也吃了三块，所以并不想吃法奇软糖。这些点心是为了她才端出来的。但我不想说出准备点心的原因——况且即使表示不需要，仙台同学还是会要我吃——于是自己把甜腻的点心给放进嘴里。","「好甜。」","我说出刚刚才听过的台词，喝了红茶后，仙台同学语气平静地问我。","「是说宫城耶诞节要跟宇都宫出去玩吗？」","「没错。仙台同学要跟茨木同学出去？」","「羽美奈要去约会。我是很想说自己要念书，但有跟其他女生约好了，会出去一下。」","「这样啊。」","我想不到还有什么好说的。听到我做出感觉要结束这段对话的简短回答后，仙台同学便把茶杯移到桌边，在桌子上摊开课本，代表她没有话要说了。我也没办法再多说什么。","仙台同学应该也知道等今天结束后，我们到寒假结束前都不会再碰面了，却没有问起我寒假的事。毕竟第一学期快结束之际，她对我该怎么过暑假出了很多意见，要说她是刻意没问我的也不为过。","身旁只传来翻阅课本，以及笔尖滑过笔记本上的声音。","我喝了一口红茶。","结果仙台同学终究没像暑假那时候一样，说要来当我的家教。今天看样子也不会说出这种话。","我站起身，坐到床上。","实在没自信能看着她的脸说话。","「……仙台同学寒假打算做什么？」","开口之后，我才发现声音比预期的更加小声，让人很不高兴。","「念书。」","仙台同学头也不回，说出只能以理所当然来形容的答案。","这是当然的。","毕竟快要考试了，没时间玩乐。","有时间教其他人念书的话，更该加强自己的课业——这道理我也明白，却不想让这段对话就此结束。","「除此之外，没其他要做的事情了吗？」","「没有吧？虽然我应该会跟羽美奈她们去新年参拜。」","她说出在寒假这个话题上我不太想听到的名字。","——既然有空跟茨木同学去新年参拜……","既然有空做那种事，分一点时间给我也无所谓吧？","「仙台同学，过来这里，坐到我旁边。」","「旁边？」","仙台同学回过头。","「对，坐到我旁边。你没听到吗？」","「我有听到，只是因为你的话题从寒假一下子跳到奇怪的地方。所以这是命令吗？」","「是命令。」","我清楚地表示后，她便一脸无可奈何地站了起来，坐到我身旁。仙台同学变得比刚才更靠近我，传来的体温令人心脏一震。","温度恰到好处的房间突然变得有点热，让我忍不住想调低空调的温度。","「我坐下了。然后呢？」","「闭上眼睛。」","「为什么？」","无视我要她闭上眼睛的命令，仙台同学直盯着我。","我反射性地瞥开视线，看到了在她制服胸口处闪耀的小小月亮。","「你不闭就算了。」","望着那条我命令她直到毕业典礼那天都要一直戴着的项链，我这么说。","「别把话到一半就不说了，好好命令我啊。」","「好好命令是什么意思？」","「意思是你就直说想接吻，所以才要我闭上眼睛不就得了？」","不满。","心中只有不满的情绪。","虽然我要对闭上眼睛的仙台同学做的事的确是接吻没错，然而照她的说法，听起来就好像我很想跟她接吻一样。","但不是这样的。","接下来的这个吻并非我想要，而是为了总想跟我接吻的仙台同学吻的，所以她说得并不正确。","「宫城想接吻吧？」","见我沉默不语，仙台同学便擅自认定是这样地说着，握住我的手。我扬起视线。","「不对……但你闭上眼睛。」","一定得在今天接吻才行。","毕竟下次便是寒假之后，那就没有意义了。","我抽回被仙台同学握住的手，揪住她的衬衫，代替命令地轻轻拉了手里的衬衫后，她闭上眼睛。","我缓缓把脸凑了过去。","明明在暑假主动吻她的次数早已多到数也数不清，现在却紧张得像是初次接吻。心脏剧烈地跳动着，心跳的声音仿佛比平常放大了三倍。","我在闭上眼睛之前看着仙台同学。","觉得要是不开口说话，她真的很漂亮。","修整过的眉毛，以及不算特别长，却比我长的睫毛。老爱调侃我的嘴唇娇嫩欲滴，我知道那摸起来非常柔软，指尖上仍残留着方才的触感。眼睛比起闭上，看着我的时候更好，不过她现在要是睁开眼睛，我也很困扰。","所以我在仙台同学睁开眼睛之前吻了她。","我悄悄地把脸凑近，彼此的唇瓣相互交叠，传来了比方才用手指触碰的时候更加明确的触感。","柔软、温暖，光是碰着就觉得很舒服。","让我想再多待在她身边。","可是不能就这样一直贴着她，所以我移开唇瓣，然后把脸埋进她的肩窝里。","「……寒假的时候来教我念书啦。」","虽然不敢大声说出来，我终究还是把今天想说的话给说了出口。","我不认为自己的吻具有那样的价值。然而仙台同学至今向我索吻过好多次了，所以这应该足以作为交换条件才对。","「我们不是约好了放假不碰面吗？」","耳边传来她的声音，说出口的话却一反我的预想。","「仙台同学不也打破这个规则了吗？」","「宫城也想打破规则啊？」","她轻轻拉了拉我的头发。","「才不是。」","「所以这是在拜托我喽？」","「不是。」","「那么——这表示刚才的吻既非命令也不是请求，而是交换条件？」","我讨厌明知故问的仙台同学。","「你不想来就算了。」","「我可没说不想。只是要当作交换条件的话，再认真一点吻我啦。」","仙台同学这么说完后，抱住了紧紧把额头抵在她肩上的我。","〔本话含插图〕"]},{"t":"第2话　现在的宫城会允许的事","p":["老实说，我觉得事情进展得太顺利了。","没想到宫城居然会主动吻我。","——我并未期望她做到这种地步。","抚摸着乖乖待在我怀里的宫城头发，传来洗发精的香甜气味。即使脱掉制服外套，解开了衬衫的两颗扣子，依然让人觉得热的房间，感觉又变得更热了。","「我觉得刚刚的已经很认真了啊。」","伴随着微弱的声音，她拉了拉我的衬衫。","松开手臂后，宫城从我的肩窝抬起头来。","暑假时是我主动说要当她的家教的，所以总觉得寒假应该要由她主动表示想跟我见面才对，却没想到她会用接吻作为交换条件，要我教她念书。宫城百无聊赖地说我寒假也应该要来教她念书——我原本以为顶多就是这样而已。","「不够认真啦。」","我稍微退开身体，否定宫城的话。","「哪里不认真？」","「你不知道的话，我来告诉你吧？」","我抚过她的唇瓣，将拇指稍微抵到她嘴里。","指尖先撞上她的牙齿，又碰触到更深处的舌尖。她马上推了我的肩膀一把。我默默抽手后，大概察觉到这是什么意思的宫城显得面有难色。","「……仙台同学，这是交换条件喔。」","她为求保险地这么说。","只有我一面倒地倾向她。","所以原先我才觉得应该把倾倒的自己给导正回来。但我错了，早已严重失衡的关系比起导正，还不如使它更加失衡。只要让宫城也跟我一样……不，是比我更倾倒，就不用再管什么平衡了。","「我知道。」","我这样回答后，宫城轻轻吐了口气，随即抓住我的手臂，把脸慢慢凑近过来。发现我持续与她四目相对，她便瞪着我，像是要我闭上眼睛似的。我并不想惹她生气，于是闭上双眼，马上就有柔软的东西碰上我的嘴唇，抓着我手臂的手又用力了些。","短暂停顿后，她的舌头有些羞怯地钻入我的口中，碰了一下我的舌头。","好甜。","就像刚才吃的点心。然而感到接吻很甜不过是种错觉，说不定只有我这样觉得，也怀疑是因为我不认为她会二话不说地答应用这种方式吻我，甚至接受对交换条件的附加要求，导致感觉变得不太正常。","我稍微伸出舌头。","轻轻碰上宫城的舌头。","还想再多碰触她。","却没有再发生更进一步的事情了。","她的舌头逃也似的收了回去。","「这样行了吧？」","她没看着我的眼睛，如此表示。","我的确觉得可以了。","毕竟她不会开玩笑地吻我，也不喜欢刚才那样的吻，甚至会咬我的舌头。考虑到这些，我很明白宫城做到这种程度，应该要放过她才对。","然而我不想就这样结束。","「刚刚那样好像还不够。」","总觉得今天就算再说些任性的话，她也会接受。","「我不是已经照你说的做了吗？」","「意思是你不够认真啊。」","这番话不过是在找理由，鸡蛋里挑骨头。","宫城脸上露出不满的表情，感觉也是理所当然的。","「那是照仙台同学的标准来看吧？」","「既然是交换条件，应该要遵照我的标准才对吧？」","「……或许是这样没错。」","平常在这种时候，她应该会抱怨「你太奸诈了」或「这是事后才加上的条件」，今天宫城的态度却很软弱。","寒假的时候来教她念书。","就为了实现这么无足轻重的小事，让她没办法拿出强硬的态度。","「宫城，可以吧？」","即使她说不行，我也不打算理会，所以赶在她开口说话前就堵住了她的唇。","我伸手环绕住她的腰，把她的身体搂得更近。她平常总是紧闭的嘴唇微张，我没遭遇任何抵抗，便找到了她的舌头。也没像之前那样被咬，顺利地接触到她。","明明光凭一开始的那个吻，就足以作为交换条件了，她却给了我可乘之机，事情才会变成这样。","我捕捉住她那仿佛无处可去的舌头，缠绕其上。宫城这次没有逃走，反推着我的舌头。柔软又富弹性的舌头果然很甜。稍微缩回舌头后，宫城便再度追击而至，我用比吃法奇软糖更轻的力道囓咬她的舌头。","相触的嘴唇热得仿佛快要融化。我变得不知该如何呼吸，晕眩不止。","松开宫城的嘴唇后，我推倒了她。","她意外地毫无抵抗，背部轻易地贴上床。","见我把脸凑近，她闭上双眼。我又一次深深地吻了她。","或许是认真接吻这个条件还有效吧？即使伸出舌头，宫城仍会回应我。我先是触碰她的舌头，复而退开，呼吸的节奏逐渐变得急促。","我解开宫城的衬衫扣子，松开领带。她用力推了我的肩膀，我退开脸，和似乎想说些什么的她四目相对，却什么回应也没得到。直到解开她衬衫上所有扣子，摸上她的腰之后，她才终于开口。","「这才不是接吻。」","她调整紊乱的呼吸一边说，抓住我放在她腰上的手。","「因为宫城不肯认真吻我，我把这个也加进交换条件里了。」","「你别擅作主张啦。」","我放在宫城腰上的手，随着她低沉的语气被拉开。","但我现在能够咏唱出只对今天的她有效的魔法咒语。","「你希望我寒假来教你念书吧？」","在打算扣上衬衫扣子的宫城耳边呢喃后，她便停下手上的动作。这次就算我抚上她的腰，她也没有抓住我的手。","仅限今天的魔法非常优秀。","「——事后才附加新的条件，未免太奸诈了。」","「宫城之前还不是一样？」","在音乐准备室里拥抱她之际，她同样是事后才补上其他条件的。","「是没错。可是这样太超过了吧？」","「的确，我也觉得太超过了。」","即使说客套话，宫城的语气依旧称不上好，不过她没有咬或踢我，代表应该没那么抗拒。倘若她真的想要我停手，我早就被咬被踢了。","因此就算知道太超过，我也无法停手。","「你真的很不情愿的话，我会停手。所以告诉我——你今天愿意容许到什么程度？」","暑假的时候，她容许我做了更进一步的事。","那今天呢？","我缓缓地滑动放在她腰上的手。","仿佛要由下往上地数着肋骨般抚过宫城的肌肤。她微微一颤，像是要掩饰自己的反应，伸手抓住我的肩膀，然而力道很轻，使我知道她还愿意让我更进一步。","我望着宫城，只见她双颊染上一抹淡淡的红晕。","虽然想吻她，可是一旦那么做，她似乎就会改变心意，我办不到。","跟彼此宛如浑然忘我地互相触碰的夏天不同。","由于混入了交换条件这个杂质，让我们无法像那天一样只凭着感情行事，寻找彼此的妥协点。","尽管并非刻意，我仍一步一步、一点一滴，像是探索般地缓缓触碰她。","指尖滑过那摸起来舒服得犹如丝绢的肌肤表面。","手停在她胸部下面一点的位置，我呼出一口气。","隔着内衣碰触宫城的胸部后，她的身体稍微动了动。","却没听到她叫我「住手」的声音。夏天时虽然被门铃给打断，但今天门铃没响。","心脏噗通噗通地吵个不停。","总觉得唯有掌心异常火热。","即使这是远远偏离交换条件的行为，我仍不希望遭到阻止。我还想再多触碰她的身体，于是悄悄将手绕到她背后。","宫城没有抓住我的手。","所以我解开背扣，稍稍挪开遮着她胸部的内衣，可以微微看见底下徐缓的隆起。宫城的身体僵住了。","房间的灯没有关。","空调持续吐出温暖的风，让思考变得迟缓。我犹豫着该不该抬起视线，很想知道宫城脸上现在挂着什么样的表情。可是一旦看到脸，她好像就会阻止我，让人不敢往上看。我轻吸一口气又吐出，将内衣往上推，那不大却形状漂亮的胸部立刻暴露在空气中。我在泡温泉和毕业旅行时都曾看过其他人的胸部——说来像是废话，但我当时心中没有任何想法。","然而现在不同。","我想摸宫城的胸部。","强烈地如此希望。","我猜触感应该跟自己的胸部没有太大的差别。","尽管如此还是想摸。","我缓缓地将手靠近她的胸部。","指尖感受到她的体温。","——似乎感受到了……","之所以说得这么不确定，是因为我根本来不及确认触感……不，是我还不知道自己是否真的有摸到，就被宫城给拉过去抱住了。","失去平衡的我为了撑住自己的身体，把手撑在床上而非她的胸部上。也由于她的身体几乎一点空隙都没有地紧紧贴着我，让人动弹不得。","她总会做出令我意想不到的事情。","这个房间总是很热，我今天也脱掉了制服外套，所以隔着我和宫城的只有衬衫。她的体温好近，紧密贴合得超乎必要的身体感触也传了过来。","为什么自己穿着衬衫呢？","总觉得这件薄薄的衬衫很碍事，甚至害我思考起这种愚蠢的事情。","要是没有衣服，就更能感觉到宫城的身体了。","我想直接触碰她，戳了戳她的腰之后，有个温暖且柔软的东西碰到我的脖子，紧接着又有某个坚硬的东西戳了上来。","「好痛。」","我忍不住出声。","不用确认也知道脖子上的东西是牙齿，会痛是因为宫城咬我。我想她这一下咬得应该毫不客气，证据就是我的脖子痛得像在烧。","「宫城，别这样啦。咬太用力会留下痕迹耶。」","我接连拍打她的腰，才总算从痛楚中得到释放。","「仙台同学这个大色魔，色胚、变态。」","「等等，大色魔是怎样？」","「你就是啊。我又没说你可以看，也没说可以摸。」","她的指甲用力地戳在我背上。","「等一下，这样很痛耶。」","「是仙台同学不好。我又没容许你做刚刚那种事。」","「可是——」","我差点说出「你没有反抗」，赶紧闭上嘴。","要是说出来，宫城一定会更生气。","「怎样？」","「没怎样。我不会再做什么了，放开我。」","「……真的吗？」","「真的。我绝对不会再做任何事。」","我斩钉截铁地说完后，环绕在背上的手臂才松开。","身体重获自由的我稍微离开宫城，视线自然地往下看去，就要对焦在胸部上。然而在那幅景象清楚地倒映在我眼里之前，就被宫城的手给遮住了。","「你别看，先闭上眼睛。」","她遮着我的眼睛，不高兴地说着。","「我闭上了。」","照她说的话做之后，她才放下遮住我眼睛的手。","「走远一点，背对这边。」","这时候要是睁开眼睛，感觉会被她赶出房间，我只好闭着眼睛爬起来，转身背对她。由于不想在被眼睑隔开的黑暗中四处乱动，我没走远，却看不到宫城在做什么。","或许是因为我一动也不动地背对宫城了吧？她没开口抱怨。","背后传来她动来动去的气息。即使我什么都看不到，也知道她在整理自己的仪容。","「可以了吗？」","我等了大约三分钟之后开口问她。","「不可以。你一辈子面向那边吧。」","她的心情似乎很差，身后传来冷淡的声音，还有个应该是枕头的东西打在我背上。","「都做到这种地步了，你不会再说不够了吧？一定要遵守约定喔。」","她以今天最不高兴的语气说着。","我摸了摸自己的脖子。","好痛。","脖子痛得就算留下了痕迹也不意外。","然而我现在却一心想着刚才品尝到的甜美舌尖，以及形状漂亮的胸部……这些残留在记忆里的东西。","当然，要是说我还想再接吻，想再多碰触她，绝对不会只是被咬这么简单而已，所以我没打算说就是了。","「我会遵守约定。寒假期间，你就挑喜欢的日子找我过来吧。虽然我还要去补习，没什么时间，不过会来教你念书的。」","我知道自己没有权力要求更多，也希望寒假能像暑假一样，和宫城一起念书。","「所以说宫城，我差不多可以转过去那边了吧？」","「绝对不行。你要是转过来，我这辈子都不跟你说话了。」","她像个小孩子一样，说着孩子气的话。","「可是我有件事想确认一下。」","「不要确认。」","身后传来她强硬的声音。","从语气里感觉得出她死都不会听我的话。话虽如此，但我总不能一直这样背对着她，只好说出一个可以比较自然地转过去的理由。","「宫城刚才狠狠地咬了我吧？感觉会留下痕迹，帮我看一下啦。」","「不要。」","「你要是不肯帮我看，留下了痕迹，我在学校就会说这是被宫城咬的。」","「我们不是约好在学校不能提起在这里发生的事吗？」","「的确，可是在脖子这么显眼的地方有什么痕迹的话，一定会有人问我，那我也只能回答啦。」","「……在哪里？我看看。」","宫城应该也不认为我真的会在学校说出来，却仍旧散发着一身心不甘情不愿的气息，开口问我。","「这里。」","我悄悄转向她，指出刚才被她咬的位置。稍微靠近了那么一点点的她随即小声地「啊」了一声。","「啊？」","「——有痕迹。」","尽管没露出歉疚的表情，宫城的语气却很消沉。","「果然。」","「不过我想这应该很快就会不见了。就算还在，只要扣上扣子便看不到了。」","说完，她硬是将我的衬衫扣子连最上面的那一颗都扣了起来。","「我觉得这样还是看得到。」","她咬的位置实在不太理想。","即使连最上面的扣子都扣上，大概也遮不住。","「明天早上就会消失了。」","虽然觉得宫城这话说得很随便，但我毕竟没有亲眼看到痕迹，难以断定她说得不对。是可以照镜子没错，然而就算看了，我应该也无法判断那痕迹是否会消失，所以看了想必也没意义。能做的事情唯有祈祷痕迹一如她所说的，到了明天早上就会消失。","「你要咬我是无所谓，但别咬到会留下痕迹啦。」","我「唉」地叹了一小口气，解开两颗被她扣上的扣子。","现在没有那么热，但把扣子全都扣上感觉很不自在。说到底，反正扣上扣子也遮不住痕迹，况且这里只有宫城在，所以露出来也没差。","「这都要怪仙台同学。」","宫城没看我地回答道。","「唉，是没错啦。」","不管怎么想都是我不对。","就算被她责怪，我也无话可说。","而我也能理解她刻意不看我的心情。","可是在这股难以言喻的气氛下，实在无法静下心来念书，感觉甚至比暑假后还要尴尬。心中的邪念让人变得更不自在了。","「对了。我有东西要拿给宫城。」","我受不了这沉滞的气氛，爬下床。","说有东西要给她并不是在说谎。","我从书包里拿出一个袋子——里头装着比一只手大，不过用双手就能捧着的东西——递给坐在床上的宫城。","「虽然有点早，不过这个给你。」","「……这是什么？」","「看就知道了吧？」","以红色和绿色为主的亮丽包装袋上，系着红色的缎带。","这个时期，看到这个配色还联想不到任何事情的人不多吧？即使是宫城，应该也知道我给她的东西是什么才对。","「耶诞礼物？」","「对。也算是这个的回礼。」","我拉起脖子上的链条，让她看那条有着小小月亮造形坠饰的吊坠。这是校庆结束后没多久，我从她那里收到的东西，近似于用来彰显所有权的项圈。","「我应该说过不需要回礼。」","「我记得，可是都已经买了。总之你打开看看啦。不要的话可以丢掉。」","宫城直盯着手里的袋子，都快把它给看出一个洞了，才解开缎带，抽出内容物，旋即皱起眉头。","有点像宫城的黑猫玩偶。","并非基于「她收到应该会很开心」或「好像会喜欢」这种正面的理由而选的礼物。真要说起来，比较算是凭着负面思考来选的。","尽管彼此已经相处了好一段时间，我依旧想不到适合送给她的礼物，只知道要是送太豪华的东西，她一定会退还给我。所以最后才会挑了个就算她拒绝收下，我也不会太受打击的东西。","她说不定会丢掉。","脑中甚至浮现了这种想法。","我不认为宫城是会把人家送她的东西丢掉的那种人，却不知道她会不会像对其他人那样对待我，实在没自信保证我给她的东西不会被送进垃圾桶里。","「为什么是玩偶？」","她双手拿着方才被关在袋子里的黑猫，以看似没特别高兴的表情这么说。","「我想说那只鳄鱼可能想要个朋友。」","我指着放在地板上的面纸盒套。","「不是食物吗？」","「都说是朋友了，别让它被吃掉啦。」","「因为我没有准备耶诞礼物。」","宫城从床上下来，一屁股坐到地板，把黑猫放在鳄鱼背上。从鳄鱼背上长出的白色面纸被压得皱巴巴，成了黑猫的座垫。","见黑猫没有走向悲惨的结局，找到安居之处，让人松了一口气。","「毕竟这也算是吊坠的回礼。要是你又送我礼物，反而会让事情变得更复杂嘛。」","「那不是礼物。」","她看着吊坠说道。","「好好好。」","我看向背上坐着黑猫的鳄鱼。","然而不管怎么看，都不会晓得获得朋友的鳄鱼到底高不高兴，更不会晓得宫城到底高不高兴。","反正她都收下了，就这样吧。","耶诞礼物并非需要看得那么重的东西，只是觉得好像该送个什么东西给她比较好而已。","我转念一想，坐到宫城身边。","接着便听到身旁传来微小的声音。","「不过……嗯……谢谢。」","难得听到宫城向我道谢，我直盯着她。","但她没有看我，把课本摊在桌上。","「我要念书了。」","毕竟在床上发生的事情并没有就此变成从未发生过的事，我和宫城之间仍空出了一个奇妙的间隔，不过尴尬的气氛倒是消失了。尽管如此，比起冒着可能会说错话的风险继续聊天，还是安静念书比较好。","我的视线落在课本上。","却马上就开始在意起身旁，看向宫城。","我试着伸出手，感觉到只有她周遭的气温降低了几度。","今天还是别期望更多了，最好别说出口。","我的大脑很清楚。","然而大脑连接到嘴巴的神经似乎断了。","我用笔戳了戳完全没有要看我这边的宫城上手臂。","「喂，宫城，可以在刚刚的约定上附加条件吗？」","「是说寒假的事？」","「对。说是条件，也只有一个就是了。」","「你都那样为所欲为了，我怎么可能答应你？已经够了吧？寒假根本没多少时间能见面，你加太多条件了。」","她从课本上抬起头，以带了好几根刺的语气说道，把橡皮擦丢了过来。","「寒假来这里的日子，让我吻你。」","「我从头到尾都没说你可以开条件。」","「让我说一下又没关系。」","我摸了摸理应留有痕迹的地方，把滚过来的橡皮擦放到宫城的笔记本上。","「条件就这个？」","旁边传来一道细小的声音。","「对。」","「……我说不要的话，你就不会来教我念书了吧？」","「意思是你答应了？」","「虽然不想答应，不过你会遵守约定来教我念书吧？」","用又多了两三根刺的语气说完后，她把课本翻到下一页。","尽管未曾给出明确的答复，但宫城似乎答应了我对约定的客制化要求。没想到她这么执着于寒假，我有点惊讶，还以为是自己听错了。","可是我没有再反问她。趁她尚未说出「我才不准你再多追加条件」前简短地回答：「那当然。」结束这个话题。","「想要你来教我念书的那天，我会跟你联络。」","宫城看着课本这么说。","「可以是可以，不过希望你能在前一天就联络我。」","「知道了。」","「还有，不用给我五千圆。」","「咦？」","她抬起头看着我。","「我刚刚已经收到教你念书的代价了。跟暑假的家教不一样，这次是交换条件吧？」","「……是这样没错。」","「那就这样喽。」","身旁没再传来任何声音。宫城虽然一脸不满，但似乎仍接受了这番说法。我喝下已经凉透的红茶。","〔本话含插图〕"]},{"t":"第3话　仙台同学知道的事","p":["我的枕边成了今天仙台同学给我的黑猫床舖。","毕竟一旦放在鳄鱼背上，就没办法拿面纸了，没放好的话黑猫又会滚来滚去，掉到地上。而放在桌上会妨碍念书，在书柜上也让人不好拿书。","所以我是迫不得已才把黑猫放在枕边的，并非特地选在这里。","「她说这是你的朋友，你开心吗？」","我把固定放在地上的鳄鱼拉到床上来问它。即使放在黑猫旁边，鳄鱼也没有回答我。这也是当然的，它要是开口回答就可怕了。","话虽如此……","仙台同学到底以为我是个怎样的人啊？","只不过是用了鳄鱼的面纸盒套，房间里既没有很多玩偶，我也从未说过自己喜欢玩偶，更一次都没提及喜欢猫或动物这种话。","所以我实在不知道，为什么她会送我黑猫玩偶当作耶诞礼物。","真要说起来，她看起来根本不像是会送玩偶的人。这么一想，总觉得她应该是基于什么理由才选玩偶送我的。也可能是不把我当一回事，才随便选了这个送。","不过她要是因为我给了她饰品，于是比照办理地回送饰品，我一定会退还。正由于她送的是玩偶这种不上不下的东西，我才有办法收下。","问题是这个房间里又多了个跟她有关的东西。","「就连制服，我都不知道该怎么办才好了。」","我摸着黑猫的头，一边望着衣柜。","里头放着仙台同学的制服衬衫。","在校庆前跟领带一起交换的那件衬衫，现在仍待在我的房间里。跟回到仙台同学手里的领带不同，短袖衬衫并未回到她手里，也已经没机会再穿了。结果我连一次都没穿过那件衬衫，它就这样像我的衣服似的被收在衣柜里。","可以的话，我实在很想把那会连结到某些记忆的衬衫赶出房间，却做不到。","新来到这房间里的黑猫也一样。","连接着仙台同学。","甚至染上了今天发生的那种让人想封印起来的事情，洗也洗不掉。","真不知道该拿这种东西如何是好。","我把鳄鱼放到地板上。","吐出体内的空气，闭上双眼。","今天在这张床上发生的事情虽然令人相当害羞，却不至于排斥到会禁止仙台同学再踏进这房间的程度。我死都不想让她知道自己是这样想的。","只要和她在一起，就会做出超乎预期的事情。我不否认自己也有「一点点的话没关系」的想法，却仍觉得自己太纵容她了。","不上床。","一开始明明是仙台同学这样说的，我们却不知为何持续进行这样的事。这个规则对我来说理所当然，是根本无需特别约定的事，然而不仅暑假，我们今天也做了几乎可说是违反约定的事。","其实我本来并不打算让她做到那种地步的。","如果开口抱怨，仙台同学一定会说是我自己选择容许她做到那种地步的吧？但因为有要她寒假来教我念书的交换条件在，只能纵容她。","现在回想起来，我甚至认为她绝口不提寒假的事，是为了要我主动提出交换条件。总觉得她想让我把错都推到她身上，视今天的事为无可奈何的结果，藉此整顿自己的心情。这让人很生气。","而我也搞不懂即使如此，却依旧无条件纵容她的自己。","每次做选择的都是我，她从不做选择。","她会细心地准备，让我选择。","总觉得仙台同学好奸诈。","自己定下规则，却又一脚踢开那些规则，主动接近我。","为这段关系播下种子的是支付五千圆买下她的我。而我没有要培育这颗种子，所以它原本应该只会埋在地底下，甚至不会发芽。她却为种子浇了水，栽培它。","我可没拜托她做这种事。","假如仅止于播种，彼此便能毫无抗拒地让这段关系在毕业典礼后告一段落。然而种子一旦发芽，要摘除那株幼苗就会产生罪恶感。况且幼苗越是成长茁壮，就越是让人不忍结束它的生命。","好比现在，我就已经后悔做出要在毕业典礼那天结束这段关系的决定了。","明明这么想，我对今天发生的事情却没那么后悔，只是不能接受唯有自己单方面感到害羞罢了。感觉只有我一个人吃了亏。","其实我很想打电话给仙台同学抱怨一番，但我们并非会互打电话的交情。","由于不到要睡觉的时间，打过去的话，她应该会接电话。可是考虑到今天发生的事，我实在无法只因为想抱怨这种小事而打给她。","仙台同学在那之后虽然表现得若无其事，不过我没有邀她一起吃晚餐，她也没问起晚餐的事，默默地回去了。正因她只是装出不觉得尴尬的样子，害我连寒假要叫她过来都得特别小心谨慎。","「都怪仙台同学，事情根本乱成一团了嘛。」","要是一放假就叫她过来，会变得好像我在期待什么一样，但是不叫她过来，我又不知道自己到底为什么要提出交换条件了。","我拿起放在枕边的黑猫。","本想把它往上抛，却又作罢。","我握着黑猫的手，放回原本的位置。","我早就习惯独自在家了，然而今天一旦陷入沉思，脑中便净浮现一些我不想思考的事。","这个房间现在待起来很不自在，简直不像是我自己的房间。","感觉得到明明不在这里的仙台同学气息，让人静不下心来。","我站起身，从桌上拿起手机。","想找谁说点话。想到「谁」这个字时，脑海里冒出的是仙台同学，然而我所想的「谁」指的是「谁都可以」的「谁」，并不局限于她。尽管这房间里有黑猫跟鳄鱼在，但它们都不肯陪我说话。","我拍了拍枕头，视线落在手机上。","经过短暂的犹豫后，我让手机萤幕显示出舞香的名字。","『你现在有空吗？我想跟你聊聊。』","我传讯息给舞香，收到『有空喔』的回应后，立刻打了电话过去。听到手机另一侧传来开朗的声音，我顿时安下心来。熟悉的声音安抚了我躁动不安的心情。","我并不打算提及今天在这里发生的事。","于是开始跟她聊起同样是今天，但并非在这里发生的事。","「你房间原本是这样吗？」","坐在对面的舞香把笔记本摊开，放在桌上，同时疑惑地说。","「原本就是这样啊。」","虽然我回答得理所当然，但她的感觉是对的。舞香曾来玩过一次，房间跟那时候确实有些不同。","桌子变大了，东西也变多了。","寒假第二天。今天的舞香依旧莫名敏锐。","十二月二十三日晚上，在我和舞香聊天后，仙台同学没有来过这个房间。而我和舞香一起度过耶诞节，今天也碰了面。","「咦，志绪理不是有在用电暖器吗？你去年好像说过拜托爸爸买了一台吧？」","舞香说出今年初还在房间里，但现在已然不在的东西。","我不禁心想，真亏她还记得。","去年我确实曾跟她说过这件事。","「现在没在用了。」","这个冬天，电暖器始终收得好好的，没有被拿出来使用。尽管在爸爸买给我之后，电暖器一直相当活跃，不过它应该没机会再出场了。我这么做并非为了总是觉得这房间里好像很热的仙台同学，只是认为光靠空调就能度过冬天了，才没特地拿电暖器出来。","「会冷的话，我把温度调高点吧？」","我把手伸向空调的遥控器，一边询问舞香。坐在对面的她回了我一句：「没关系。」幸好她不像仙台同学，对温度的感觉跟我比较接近，所以房间能保持在不会太热，也不至于太冷的舒适温度下。","和她在一起，不管什么时候都很舒适。","我可以表现得和平常一样。","——本来应该是这样的，我却因为她在这个房间里坐立不安。","「志绪理，你每天都有好好念书吗？」","舞香把参考书和考试题库放到桌上，开口问我。","「算有吧。」","「不愧是考生。」","「舞香也是考生啊。」","「是这样没错啦。」","我们今天原本预定要在舞香家念书，计划却彻底翻盘，变成她到我房间里来了。据说是她的亲戚突然造访，妈妈就把她给赶了出来，于是只好改来我房间办读书会。","虽然有些抗拒让她踏进留有仙台同学痕迹的房间里，然而要是表示「绝对不可以来我家」，也只会让她起疑而已。","「志绪理喜欢猫吗？」","无视于桌上放着念书用的东西，舞香感觉没什么心要念书，望着书柜。黑猫玩偶躺在她的视线前方。","「没特别喜欢。」","在舞香来之前，我把黑猫从固定放着的枕边移动到书柜上。它似乎相当中意这个临时住处，一副一直以来都待在那里的样子。","「我想也是。那是人家送你的吗？」","「是我自己买的，算是那个的朋友。」","我没说那是仙台同学送我的，指着放在桌子旁边的鳄鱼。","「这个的？」","舞香把鳄鱼这个面纸盒的守护神给拖了过去。","「对。」","「那个玩偶很可爱，可以理解你为什么想买……不过是它的朋友啊？」","她轻拍着鳄鱼的头，这么说着。","「毕竟只有它一只很寂寞嘛。」","我拿回呈现跪姿的鳄鱼，把它放到桌子底下。","「是说你遇上了什么事情吗？」","「为什么这样问？」","「问我为什么……因为上了三年级之后，你就变得很难约啊。暑假你也说很忙，几乎没跟我见面。」","这么说完后，她刻意摆出像是在闹别扭的表情。","「舞香暑假时不也说得去补习，很忙吗？」","「是这样没错，但我想说不知道你是不是发生了什么事嘛。」","「有事的是你吧？你说有事想说，是什么事？」","我们一起念书啦。","昨天晚上，舞香传来的讯息这么写着。可是我们很少在假日一起念书，况且她也没邀这种时候找来也不奇怪的亚美，只邀了我，后面还附上一句『而且我正好有点事想跟你说。』所以我认为比起念书，她的重点应该是「有事想跟我说」。","舞香曾表示寒假也得忙着补习。既然如此还特地找理由见我，可以预想她要说的是相当重要的事。","「啊～嗯，对，我的确有事要说。」","她不知为何支支吾吾的。","看她的样子，总觉得要说的多半不是什么好事，我不禁郁闷起来。","「志绪理……我可以先向你道歉吗？」","舞香有些不知所措地说。","「……是不好到让你想道歉的事？」","「我不确定，但感觉先道歉会比较好。所以对不起。」","即使要特地拿「开读书会」当藉口也想对我说的事，而且还想先跟我道歉，我实在不太想听，却又不能不听，只好问了句：「所以到底是？」催她继续说下去。","「虽然之前就问过了……你啊，跟仙台同学感情很好吗？」","「……倒是没有。你要说的是这件事？」","舞香应该尚未切入正题才对。","但作为开场白的话就已经糟透了，让我忍不住想抱住头。","仙台同学的事情是我最不想被问起，也最不想说的事。","「嗯、啊……大概是吧。」","回答得十分模棱两可的她，喝了口冰块已经融化的汽水。","然后「呼」地轻轻吐出一口气，这才娓娓道来。","「之前我不是跟你说过，在去福利社的路上跟仙台同学聊了几句话吗？因为你好像很在意那时候的事，我想说还是跟你提一下。」","十一月，我在音乐准备室被仙台同学拥抱的日子。","我从舞香那里听说她在走廊上跟仙台同学撞在一起，因此聊了几句话。","那天的事情我记得很清楚。","我曾问舞香跟仙台同学聊了些什么，当时她说她们没聊什么重要的事。不过到现在才说有话想讲，表示她有什么事情瞒着我。","我心中只有不好的预感。","「所以有什么事非要告诉我不可？」","「我们那时候聊起大学的事情，我把自己的志愿告诉仙台同学，仙台同学也跟我说了她的志愿。知道我们要报考的大学很近之后，我便顺口说了志绪理的事。」","「咦？是什么事……」","「对不起，我把你好像会跟我报考同一所大学的事情告诉仙台同学了。果然还是别告诉她比较好吧？」","舞香一脸歉疚地说。","「——没关系啊，这种事情根本没什么好道歉的嘛。虽然我跟仙台同学只说过几次话，关系没有特别好，可是我不会因为你把我的大学志愿告诉她这种小事就生气啦。」","我在说谎。","尽管没有生气，但这才不是什么「没关系」的事。","这件事当然是别告诉仙台同学比较好。","我内心大受冲击，甚至连太阳穴周遭都痛了起来。","没人知道我跟仙台同学是怎样的关系。","当然，就连舞香也不知道。","所以我没必要焦急，也无需慌张，要是表现出焦急或慌张的态度反而奇怪。只要若无其事地带过这个话题，事情就结束了。","尽管如此，我依旧加快了说话的速度，讲出来的话也像是不自然的藉口。或许是因为这样，总觉得舞香正以看可疑人物的眼神盯着我。","「不过你之前明明瞒着我没说，现在为什么突然想说了？」","我想逃离她投向我的怀疑视线，尽量用开朗的语气这么问。","「我原本觉得不说也无所谓，可是当时仙台同学问了不少关于志绪理的事，你最近又怪怪的。该说这种情况果然会让人想很多吗？所以我才想说应该跟你提一下比较好。况且我觉得你跟仙台同学好像满要好的。」","她嘴里虽然说「我觉得」，可是语气听起来更像是在怀疑我。也许是我做了亏心事才会有这种感觉，但喉咙仿佛被人给紧紧勒住，简直快要不能呼吸了。","「说过很多次了，我跟仙台同学感情没有特别好，她会问起我的事，只是因为没有其他话题好聊了吧？」","我在心里念着要冷静，一边看着舞香说道。","「或许是这样没错。可是你们两个真的——」","舞香想说些什么。","不过大概是之前一直瞒着我没说这件事，心里过意不去吧，她把到嘴边的话又吞回去，只说了：「对不起喔。」","「我们也差不多该来念书了吧？舞香，教我一下这题。」","换作是平常，我一定会说出「既然都要说了，你就说完啊」或「说到一半就不说了，这样很不舒服耶」之类的话，要她接着把中断的话说下去，今天却没做这种硬是要她把吞下去的话又吐出来的行为。","我装作那些话不存在，让她看摊在桌上的题库。她脸上虽然也挂着一副有事情想问我的表情，却没继续追究下去。可能是感受到我不想继续谈下去的心情了，她回问我：「哪一题？」视线落在题库上。","舞香很体贴。","我总是仰赖她的体贴，没多问下去的她今天也拯救了我。而我现在面对这样体贴的她，脑中想的全是仙台同学。","我们难得聚在一起念书，我也觉得自己这样很过分，可是刚才听到的事情一直盘据在脑海中，挥之不去。","仙台同学知道我的志愿。","听到这件事，我怎么可能冷静得下来？","我明明一直隐瞒着志愿的事。","明明没有告诉她。","仙台同学却知道了。","她在音乐准备室拥抱我的日子……就在那一天，她全都知道了。","舞香的声音听起来好遥远。","虽然听得到，我却不清楚她在说些什么。","我的确曾想过仙台同学说不定已经知道了。尽管如此，我仍告诉自己，那只不过是个假设，她不可能知道这件事。","然而——","结果我念书一直念得心不在焉，舞香比原本预定的还要早回去。虽然记得有跟她一起搭电梯，送她走出大楼，可是不太记得我们说了些什么。","我也没吃晚餐，独自待在房里，坐在床上。","脑袋放弃思考，唯有时间不断流逝。","等我发现时已经过了晚上九点，不过以打电话来说这时间还不算太晚。","三十秒……不，我犹豫了大约一分钟后打给仙台同学。在铃声响了两次之后，传来她有些惊讶的声音。","『真难得，宫城居然会打电话给我。』","我有事情想问你……","所以才会打给你。","你明明知道我的志愿，还一直要我说出志愿的理由。","你明明知道我的志愿，仍试图诱导我跟你报考同一所大学或邻近大学的理由。","我想知道。","我现在只觉得仙台同学是想观察我的反应并以此为乐，这让人很生气。如果她有其他理由，我想问是什么，希望她能否定我认为她只是想拿我取乐的想法。","然而总觉得在电话里，我没有办法好好问清楚。","「仙台同学，来教我念书。现在就来。」","『就算叫我现在去，但我今天已经回到家了，没办法。』","我知道。","即使打电话不算太晚，但要一个高中生出门，这时间是太晚了些。","尽管如此，我还是希望她现在就过来。我想面对面跟她说话。","「就算没办法，你也想办法过来啦。」","『明天不行吗？虽然我得去补习，要晚一点才能过去。』","「那你不用过来了。」","『如果宫城愿意让我留宿一晚，要我现在过去也可以。』","「不用。我要挂电话了。」","『我只是像平常一样开个玩笑而已啊。你今天怎么了？』","大概是因为我的语气太严肃，搞得气氛有点僵，她才会开个玩笑想缓和气氛。我能理解，现在却没那个心情笑着回应她。","「……仙台同学，你没有什么事情要跟我说的吗？」","『没有啊。怎么了，发生什么事了吗？』","仙台同学不知道我这话有什么含意，用跟平常没什么不同的语调这么说。她不晓得自己该说什么也是当然的，但这样的她让我很不满。","「没有就算了。你寒假不用来我家了。」","我有些迁怒地说完后，仙台同学的声音听来有些不知所措。","『你可以等我一下吗？我现在就过去。』","虽然觉得自己的脾气发得很没道理，然而我现在非常生气，却想马上见到仙台同学。我很气这样的自己。","「……明天来就好。」","『说真的，到底是怎么了？』","「没什么。等你补习完再过来就好，但明天一定要来喔。」","『我现在就过去。等我一下喔。』","仙台同学以超乎我想像的温柔语气这么说。","「明天再来就好。」","我尽量让心情平静下来，和缓地说完后，她接着说：『我知道了。约好了喔。』","我要说的只有这件事，于是很快就挂断电话。","尽管肚子不太饿，我还是把泡面塞进胃里。","洗过澡，躺在床上。","在睡不太着的情况下迎来了早晨。接近夜里时，门铃响起。","仙台同学来到昨天舞香来过的房间。","我准备了汽水和麦茶。我们把参考书和笔记放到桌上。","房间的温度对我来说刚刚好，但仙台同学似乎觉得很热。","我背靠着床，她理所当然地坐到我身旁。","什么都没说，只是静静地坐着。","昨天那通电话是怎么回事？你不是有话要说吗？","她大可主动问起这些问题。","然而她就只是坐在我身旁，什么都没问。来到这里之后，从她口中说出的话里，有意义的大概只有一句「抱歉我来晚了」，现在则是看着摊开在桌上的参考书。","仙台同学的确比我想的还要晚才来。因为她快九点才来，我想她是在顾虑我。之所以不提起昨天那通电话，或许也是一种体贴。","可是这样太不自然了。","如果是平常的她，一定会率先问起我昨天那通电话的事。像这样什么都不说地坐在身旁，我反而很难开口。从舞香口中听到的话不停地盘旋在脑海中。","我拿起装有汽水的玻璃杯。","玻璃杯上的水滴沾湿了掌心。","我喝了一口汽水，从鳄鱼背上抽出一张面纸擦手，看向仙台同学。","「你不问我昨天的事情吗？」","总觉得这样下去，今天的碰面会在两个人一起念书中结束。","那跟我们寒假前约好的一样，没有哪里不对，但是对今天来说，念书不过是个藉口。要是没跟她谈谈，我就不知道自己为什么要叫她过来了。","「你是指电话的事？」","身旁传来她试探性的语气。","「我以为你今天会问我这件事。」","「我只是来教宫城念书的。昨天你不也说了，要我来教你念书吗？」","仙台同学抬起头，放下手中的笔。","然后看着我。","「不过你要是有什么事情想说，我会听。你有话要说吧？」","仙台同学说得一副无可奈何。虽然不到嫌麻烦的程度，但脸上挂着兴趣缺缺的表情。","她这反应我早就看惯了才对，今天却觉得心神不宁。","大概是因为她身上穿的不是制服吧。","而是感觉到处都有在卖的针织衫跟裙子。","那身衣服要是穿在我身上会显得很廉价，可是穿在她身上，看起来就像是品质不错的东西，也很适合她。然而自从暑假结束后，我就一直没看过她穿便服，总觉得穿着便服的她无法融入这个房间，有股距离感。拜此之赐，让人迟迟提不起勇气问出该问的事情。","「……仙台同学没有什么事情要跟我说的吗？」","我用指尖拭去沾湿玻璃杯的水滴，喝下汽水。","真希望仙台同学和舞香之间发生过的事，能像汽水的气泡一样迸裂消失，只可惜天不从人愿。","「这我昨天也说过了，我没什么要说的。所以宫城要说什么？」","我是因为有话想说，才叫仙台同学过来的。","要说的话，就只有今天了。","可是在我明知如此仍无法顺利开口，沉默不语之际，仙台同学代替我先说话了。","「你要说的事情应该不是什么好事吧？毕竟你的心情不太好——不想说的话，不如就别说了吧？」","听到她比方才更沉重的声音，我吸了口气。","然后缓缓地吐出那口气，开口说道。","「仙台同学，告诉我，你在走廊上跟舞香说了什么？」","「你说跟宇都宫说了什么……是指我在去福利社的路上碰到她那时候的事？」","我似乎开启了一个仙台同学不太想谈下去的话题，她的语气有些低沉。","「对。」","「我以为之前就告诉过你了，她问了我在学校把你叫出来时的事。我没说过吗？」","我怎么可能忘记？","她在音乐准备室里也说过同样的话，我相信了她。现在才知道这段话刻意地省略了一部分内容。","「不只这些，你们还说了其他事情吧……像是我要报考的大学。」","「……原来如此。你是听宇都宫说的？」","仙台同学像是理解了一切地说道。","「我昨天听她说了——你明明知道我的志愿，为什么还要在音乐准备室里问我要报考哪所大学？你只是想观察我的反应，觉得这样很好玩吗？」","成绩变好之后，宛如要追着仙台同学的脚步般改变原本的志愿。","她一定是这样认为，打算戳破偷偷改变志愿这件事，看我惊慌失措的样子。除此之外，我想不到其他可能性。","我才没有要追着她的脚步，也早就决定好到毕业之后就不再和她见面。说穿了，她的志愿跟我的志愿很近，不过是一场巧合，只是因为我选择和舞香报考同一所大学，才造就出这个结果罢了，并非刻意造成的。","要不是这样才奇怪，是仙台同学误会了。","我希望她能说点什么。","她却什么都没说。","带着格外认真的表情，始终闭口不语。","「仙台同学，回答我啦。」","我开口催促后，传来她一如表情般认真的声音。","「——我看起来像是在拿你取乐的样子吗？」","仙台同学看着书柜。","视线前方是她带来的黑猫。","「会问你要报考哪所大学，是因为我想听你亲口说出自己的志愿。」","明明丢了个问题给我，她却没等我回答便继续说下去。","「那就用普通的方式问我啊，说你是从舞香那里听来的不就好了？」","我没有生气。然而用比较强硬的语气说完后，仙台同学的视线从黑猫移到了我身上。","「如果我那么说，你一定会说自己不会去报考宇都宫要考的那所大学吧？」","「这——」","她说得没错。","她要是说从舞香那里听说了我的志愿，我一定会说「那不是真的」或「我只是说说而已」，找理由把即将定案的志愿改成其他学校。","「你要报考哪所大学？」","仙台同学问我的方式，简直就像是学校的老师。","「我不想说。」","「告诉我啦。」","「还没决定。」","「这时期不该再犹豫了吧？你已经决定好了不是吗？要是还没决定，就跟宇都宫报考同一所大学啦。」","现在确实不该再犹豫，况且我也决定好志愿了。即使她没说，我也打算跟舞香报考同一所大学。","却不想告诉仙台同学。","假如告诉她，我自己决定的志愿就会变得像是依照她的意见决定的。我有我的想法，不想让她以为我总会照着她的想法行事，也不懂她为什么这么执着于我的志愿。","「我没必要告诉仙台同学……为什么你一直希望我跟你报考同一所大学，或是邻近的大学？我报考哪里都无所谓吧？」","尽管语气变得有些粗暴，但我没有在生气。然而仙台同学面有难色地默不作声。","为了填补这突如其来的沉默，我喝了一口汽水。","搞得好像是我不对一样，让人很焦躁。","就在我虽然不觉得冷，却想调高空调温度而朝遥控器伸出手时，仙台同学开口了。","「——宫城，你不会想跟我见面吗？」","她问出这个省略了重点的问题，声音并没有特别小声，却像是迷路的孩子在找路一样，透露着不安。我还是第一次听到她用这样的语气说话。","「我们不是约好了吗？等毕业典礼结束后，我就不会再跟仙台同学见面。」","我不想特地说出来，却仍搬出了以前的约定，推给她作为答复。","尽管的确可以顾左右而言他，不正面回答这个欠缺关键内容的问题，但她不同于平常的说话语气，让人无法不诚实地回答。","「我记得这个约定，却不是要问这个，而是想问你毕业之后不会想跟我见面吗？」","「……仙台同学呢？」","「我会想和宫城见面，也觉得要是能见面会很开心。」","我本以为仙台同学会叫我不要用问题回答问题，她却老实地回答了。","「虽然不知道宫城心里怎么想，不过我现在还满期待能来你房间的。要是以后没了这件事，我会觉得很无聊。」","她说着平常不会说的话。","想见面。","这种话谁都能说，况且就算今天这样想，明天或许又不一样了。","就像爸爸，见面的时候都会跟我约好，说他会早一点回来，跟我一起吃饭。","然而那些约定几乎都没有实现。","妈妈也说过会一直跟我在一起。","却从我面前消失了。","约定就像巧克力一样甜美，容易融化。","马上就会瓦解、消失。","等到我厌倦期待这种白费功夫的事情，已经过了好几年的时光。","而仙台同学不会遵守约定。","总是在打破跟我的约定。","所以我不相信她说的「想见面」。","她少数有遵守的约定，是跟我约好会戴着项链这件事。但她今天穿的不是制服，所以我不知道她有没有戴，也无法相信她有戴。","要是能像平常放学后那样看到项链，我或许就能相信她所说的话，却没有勇气确认，反而净说些讨人厌的话。","「你说很期待能来我房间是骗人的吧？让我付钱在放学后把你叫来这里听我的命令，怎么可能会觉得有趣？」","「我要是觉得听人命令很有趣，岂不是像变态吗？」","「那就表示你一直都很不开心吧。」","我冷淡地说完后，仙台同学皱起眉头。","「与其说不开心，不如说我一开始根本不太了解宫城啊。真要说起来，你还不是一样，一开始跟我在一起也不觉得有什么好玩的吧？」","这段只是一时兴起才展开的关系，就算没了也无所谓，所以起初我只抱持着一旦腻了，只要别再叫仙台同学过来就好的想法。但倒是不像她那样，觉得刚开始的那段时间很无趣。","「仙台同学会听我的话这点还满好玩的。」","「你这样个性很差耶。」","「仅限对你就是了。」","我有些厌烦地简短回应后，身旁传出一声叹息，紧接着是：「宫城——」语气听起来很认真。","「现在呢？你觉得跟我在一起开心吗？」","开心还是不开心。","一定得选出其中一个才行。","既然如此，尽管有附加条件，我的选择仍早就决定好了。","「……仙台同学没做什么奇怪事情的话。」","「意思是你觉得开心？」","「你要这么认为就这么认为吧。」","嘀咕着的我看向地板。","我和鳄鱼对上眼，又马上瞥开，视线落在仙台同学的脚上。","「喂，宫城，快说你就算毕业也想和我见面啦。我不会做奇怪的事。」","她要我说的话，几乎等同于要打破我们的约定。我不想在无法相信她的情况下说出这种话，况且要是说出来后有什么因此改变了，也让人很困扰。","见我沉默不语，仙台同学长叹了一口气，靠向床舖。","「那先不管要不要见面。不管是哪所大学都好，考上的话跟我说。」","「为什么非要告诉仙台同学不可啊？」","「因为我们是一起念书的伙伴啊。就算不是朋友，我们也一起念书到现在了，跟我说一声也没差吧？」","「或许是这样没错……」","「不是什么或许是，就是这样。考上的话，要跟我说是哪所大学喔。」","仙台同学理所当然地这么说，强迫我接受这个结论。","我要报考的大学早已定案，这消息也传到了她耳里。尽管表示我还没决定，但是这话她一定不会相信。既然如此，考完之后就算不告诉她，只要查一下，也马上就能知道我有没有考上。","瞒着她根本毫无意义。","「知道了……但我不保证喔。」","「嗯。」","即使没有说得很明确，我依然接受了仙台同学让步后的条件。这个结果可能让她满意了吧？她以柔和的语调回应我。","那我们来念书吧。","我认为仙台同学会这么说，伸手拿起放在桌上的笔。然而她不但没有开始念书，还动手收拾起参考书和笔记本。","「我今天就先回去了。毕竟我抵达时也晚了。」","她到达这里的时间不早了是事实。可是在要上学的那些日子，她有时候会更晚才回家。我反射性地抓住她的手臂。","「你要回去了吗？」","事情并未就此圆满落幕，也很难说解决了所有问题，不过想说的事情几乎都说完了。念书只是藉口，所以不念书也无所谓。","不过事情一办完她就要回去，这实在让人高兴不起来。","「对，我要回去了。」","想起自己为了能够在寒假叫仙台同学过来所付出的代价，我便不想这么轻易地让她回去。","再多待一下也无所谓吧？","我应该有权力要她接受这个要求。","但想行使这份权力，必须先软化她那看起来相当坚定的意志才行。","「……接吻呢？」","除了这句话，我想不到还有什么话能够留住打算站起身的仙台同学。","「接吻？」","「是仙台同学要求加上这个条件的啊。」","「我今天又没有教你念书。」","她的行径总是显得毫无道理，却在这时做出如此合理的发言，让我更用力地抓住了她的手臂。","「宫城，这样会痛。」","「你教我念书之后再回去啦。要遵守我们昨天在电话里的约定。」","「现在才开始念书的话，会弄到太晚喔。」","我松开仙台同学的手臂……","然后轻轻吸了一口气。","犹豫了一下是否该把浮现在脑中的话说出口后，我平静地告诉她。","「——要是弄到太晚，你就住下来啊。」","「咦？」","「你在电话里不是这样说了吗？说让你留宿就可以。」","因为她那样说过……","我只是实现她的心愿而已。","「我可以留宿吗？」","「反正今天我家人不在，只有我独自在家。」","「你这话会让人想歪耶。」","我说家人不在就只是字面上的意思，亦即今天爸爸也不会回来，没有其他的含意。如果听到这句话会想歪，单纯是仙台同学心术不正。","「你还是回去好了。」","我推着她的手臂要她远离我，她才回了句：「我是开玩笑的啦。」","她的玩笑都是些差劲的玩笑，以玩笑话来说太沉重了。要是把她的玩笑话当真而认真回答，反而是我会吃苦头，所以我很讨厌她这样。尽管如此，如果不谨慎一点，谁知道仙台同学会做些什么？","「……你能向我保证不会做什么奇怪事情的话，就可以住下来。」","「那不是邀女孩子留宿的时候该说的台词吧？」","「仙台同学，想想你过去的所作所为吧。要是不想教我念书，我就送你下楼。」","我说完后，仙台同学说：「我还是跟家里联络一下。」从书包里拿出手机。","〔本话含插图〕"]},{"t":"第4话　寒假的宫城心情也很差","p":["就算毕业了，我也想和宫城见面。","总觉得自己好像连一些不用说出来的话都说了。","我不知道宫城会如何解释这些多余的话，在这种气氛下也没有心情念书，所以本来是想早点回家的，却回不了家，甚至因为她说了些让人搞不懂的话，决定要在她家留宿一晚。","要是弄到太晚，你就住下来啊。","把我赶出去倒不意外，我却从未想过她会说出这种话，就连现在都仍觉得她有可能会跟我说「刚刚那些话全是骗你的」。","尽管觉得她今天叫我过来，应该是有什么事情要说才对，但八成不是什么好事，实际上也不是什么好事。","眼下还没到毕业典礼，但她就算开口要提前结束这段关系也不奇怪。","正因为怀抱着这种心理准备而来，我迟迟无法融入这个——已经和不在意我人在哪里，却很注重表面形式的父母联络过，确定要留宿在宫城家的——状况。","「仙台同学，冰箱。」","「啊，抱歉。」","我呆站着不动。听见宫城从身后呼唤，才把一直开着没关的冰箱门给关上。","比起念书，先吃晚餐吧。","并非我们有谁这样提议，只是自然而然就变成这样了。","要是身上有开关，就能瞬间切换成念书模式了。然而我们没办法立刻转换心情，两人一起来到厨房。","到这里为止都还好，但现在出现了一个问题。","那就是这个家的冰箱。","「冰箱里还是老样子，什么都没有耶。」","「有胡萝卜。」","我听宫城这么说，打开冰箱的蔬果室，只见胡萝卜寂寞地躺在宽敞的空间里。","「蔬菜只有这个？」","「还有这个。」","拿着胡萝卜转身后，宫城先是塞给我一个装着马铃薯的袋子，接着又拿出奶油炖菜的料理块，导出了晚餐的菜单。","「……没有蛋白质呢。」","我不知道她是想吃奶油炖菜才事先准备，还是家里正好有这些东西，但只有蔬菜，感觉材料不太够。","「你说的蛋白质是指肉吗？」","「对。有没有能替代的东西？」","我把胡萝卜和马铃薯放在调理台上问她。","就算没有肉也能做奶油炖菜，不过没放蛋白质的奶油炖菜有点空虚。","「这个可以吗？」","在我抽出砧板和菜刀时，宫城拿了咸牛肉罐头过来。","「你有好东西嘛。接下来我来料理就好，你可以先去坐着。」","虽然不到待在这里也只会碍事的程度，但她在准备晚餐时算不上战力。让她拿菜刀还要担心会不会切到手，让她顾锅子又怕会乱放些什么进去。比起忐忑不安地看着她，我自己一个人做比较快。","而且我今天很怕沉默。","一旦对话中断，我就会变得非常在意宫城的存在，在意得不得了。让她离我远一点，比较能冷静下来做晚餐。","我知道自己为什么不想面对沉默。","大概是因为我们不仅把想说的话都说完了，我还要在这里留宿一晚。现在只要宫城在附近，我的内心深处便会躁动不安，一心只顾着在意她在想什么，又是怎么看待这些事情的。","我想她的状况跟我也差不了多少。","一副静不下来的样子，看起来像是在寻找话题。","所以我觉得只要一小段时间就好，彼此应该稍微拉开现实中的距离。等煮好奶油炖菜后，我们想必就能恢复到比现在更接近平常的状态了。然而宫城没有走出厨房。","「你不用帮忙，去那边等我啦。」","我一边洗马铃薯一边看着客厅，用视线示意她该待的地方是那里，她却从我手里抢走了刚洗好的马铃薯。","「……我要帮忙。」","宫城不高兴的声音传来。","为什么？","我想她也觉得比起待在我身旁，远离一点比较好才对。不懂她为什么要特地说这种稀奇的话。","「你说要帮忙，打算做些什么？」","「削马铃薯和胡萝卜的皮。」","说完的她拿起菜刀，开始和马铃薯搏斗起来。","我忍不住盯着她的手。","「……干嘛？」","她发出了比刚才更不高兴的声音。","「不，没事。」","真没想到一个切高丽菜会切到手的人，会主动说要帮忙。","我拿出锅子后看向旁边，只见几颗被厚厚地削掉一层皮的马铃薯排放在那里。","「削好皮的蔬菜让我来切吧？」","「不用，我来切。」","「你可以吗？」","「仙台同学很啰唆耶。跟我说话我会分心啦。」","把马铃薯和胡萝卜交给一个要聚精会神才能切菜的人真的好吗？我开始担心起来。但要从现在的宫城手里拿走菜刀感觉不是件容易的事，我只能在一旁守望着她用危险的动作切菜的模样。","随着沉重的「咚、咚」声，一块块形状不一的蔬菜出现在砧板上。我把宫城切好的蔬菜丢进已经倒入油的锅子里拌炒，接着将咸牛肉也炒过。加水开始炖煮后，能做的事情就只剩下捞掉煮出的浮沫，沉默顿时降临。","宫城感觉有些不知所措地叫了声：「仙台同学……」接着说：「我去那边坐着等。」","「嗯。」","我独自留在厨房，看着里头少了洋葱的锅子，捞出浮沫。","宫城今天没有清楚说出她的志愿。","不过我现在知道从宇都宫那边听来的消息是真的了。","光是知道并不会改变现况，这段关系告终的日子也早就决定了。我不晓得原因，可是宫城的意志很坚定，无论我说什么，感觉都无法改变现在的状况。","然而我已经知道她也觉得跟我在一起很开心了，而且应该、大概也有一点点想在毕业后继续和我见面。","眼下我也只能把这当作是不错的收获。","我捞出浮沫，关上炉火，把奶油炖菜料理块掰成小块，丢进锅里。","料理块噗通一声掉进锅里，融化开来，将锅里染成一片白。由于没有牛奶可加，我再度打开炉火，将锅子里的东西煮沸后再继续炖煮了一阵子。这时宫城从客厅出声问我：「煮好了吗？」","「快好了。拿盘子过来。」","「好。」","宫城说完后，拿了两个装好白饭的咖哩盘来。","「白饭不用拿来啦。拿装奶油炖菜的盘子过来。」","「我拿来了啊。」","「在哪里？」","「这里。」","她把装了白饭的咖哩盘放在调理台上。","「……今天是吃奶油炖菜耶。」","「我知道，所以拿盘子过来了啊。」","我看着她拿来的咖哩盘。","从盛好白饭的盘子所能导出的答案只有一个。","「你会把奶油炖菜淋在白饭上吃吗？」","「咦？你不会把奶油炖菜淋在白饭上吗？」","「一般来说不会淋上去吧？」","「一般来说都会淋上去吧？」","我们的意见完全对不上。","不仅如此，她还用仿佛写着「是你错了」的表情看着我。","「咖哩才会淋在白饭上。奶油炖菜不会淋上去。」","「奶油炖菜跟咖哩是同一挂的啊，而且淋上去吃可以少洗一个盘子。」","「我觉得问题不在这里耶。」","「反正吃进肚子里还不都一样？」","宫城嫌麻烦地说。我拗不过她，于是两个咖哩盘并排放在吧台桌上。当然，里头装的是淋上了奶油炖菜的白饭。","「我开动了。」","她像是在吃咖哩般地吃着奶油炖菜。","「……我开动了。」","我也用汤匙舀起奶油炖菜和白饭，送入口中。虽然还是第一次这样吃奶油炖菜，不过实际吃了之后倒也不觉得有多奇怪。配合宫城的习惯没什么不好。","我并不是非要把奶油炖菜和白饭分开不可，况且这里是宫城家，对于要顺着她做事这点，我也没有意见。真要说起来，这种事根本不重要。而今天讲些不重要的事，我在心情上也会觉得比较轻松。","可是这种不重要的话题聊不了多久。","我们的对话很快就结束，只剩下汤匙碰上盘子发出的声响。","今天的沉默果然很沉重。","「宫城跨年那天也是一个人过吗？」","我一时找不到什么话题来填满沉默，只好说起无关紧要的事。","「跨年那天我家人会在家。」","「是喔？」","「记得仙台同学一月一日会去新年参拜？」","宫城像是回想起来似的说道，吃了一口奶油炖菜。","「对。你要一起去吗？」","「怎么可能去啊？你会跟茨木同学一起去吧？」","「如果不是跟她一起，你就愿意去？」","「……我不去。」","宫城冷淡地否定了我的话。","我不讨厌她这种态度。","看到她因为我开的一点小玩笑而不高兴的样子，让人更想逗弄她。虽然真的再得寸进尺害她心情变得更差，我也会后悔，所以不会那么做，但总觉得她这种反应很可爱。","然而一旦避开这个话题，我们就没什么好聊的了。寒假的行程跟考大学的事情也都没什么好说的，讲没两句话题就会结束。既然如此，我便不禁想提起明知道不要提起会比较好的话题。","「你之前都没有跟我说过可以住下来吧……今天是为什么？」","我知道宫城的话就是字面上的意思，没有其他更深的含意。","顶多就是想跟人一起吃晚餐，或是觉得年底独自在家很寂寞罢了，不可能是抱着什么期待才让我留宿的。","尽管如此，我依旧没办法完全不去在意。","正因为会忍不住对她有所期待，我才希望她能告诉我不是这样。","「……不是说了要你教我念书吗？」","「这我知道。」","「那就别问我啊。」","宫城语气冰冷地说。","寒假要来教她念书的约定。","那不过是她今天找我过来的藉口，所以就算说是为了念书，我也无法接受。可是她不肯告诉我更多原因了。","「仙台同学，等等你洗碗喔。」","宫城不知何时吃完了奶油炖菜，站起身来。","「是可以啦。」","我吃着奶油炖菜，目送迅速走出客厅回房的宫城离去。而在我洗完餐具，回到她的房间后，里头没有人在。","我莫名地放心下来，「呼」地吐出一口气，房门随即打开了。","「你先去洗澡吧。衣服穿我的休闲服应该就行了？」","走进房间后，宫城立刻打开衣柜问我。突然被她这么一问，我只给出了：「咦？啊……嗯。」这种不清不楚的答复。","「那这些你拿去，换洗衣物跟毛巾。」","我接下深蓝色的休闲服和白色的毛巾。","「你已经先放好热水了啊？」","「我吃饭前就已经先放好热水了，吹风机之类的东西那边也都准备好了。」","她虽然没在背后推我，但讲得像是要把我赶出房间一样，我只好走向浴室。","洗衣机前放着一个篮子，我把休闲服放了进去。","对耶……","说得也是……","因为我没带换洗衣物过来，当然会变成这样。","被雨淋得一身湿地造访这里的那天，我借了宫城的衣服来穿。","我也曾经在有体育课的日子忘记带运动服，向别班的朋友借来穿的经验。穿别人的衣服这种事情根本不算什么。","今天却格外在意。","我觉得自己不该在意。","休闲服不过就是布，不是该介意的东西。","由于没有带留宿需要的东西过来，借宫城的休闲服穿没什么不对劲，是理所当然的事。","会在意这种事情反而奇怪。","我拍了拍自己的脸颊，解下脖子上的吊坠。","把它放在休闲服上后，脱下衣服。","我有点介意背后而转身，看见倒映在镜子里的自己。尽管镜中只有跟平常没什么两样的自己，我却看不下去。我瞥开视线，看向洗脸台，上面放着吹风机和梳子。","这虽然是废话，不过在这里的都是宫城家的东西，不是我的。","我紧紧闭上眼睛再张开。","这里并非宫城的房间，然而也是她家的一部分，总觉得放眼望去全是不熟悉的东西，静不下心来，仿佛迷路后闯进了陌生的地方般心神不宁。我忍不住想弓起身子，轻轻呼出一小口气。","我握起拳头又张开，把头发绑起来，打开浴室的门走进去。","跟我家不同的淋浴设备和浴缸。","摆放在里头的洗发精和润发乳也不同。","加了入浴剂的热水变成乳白色。","我舀了些热水冲洗身体，再泡进浴缸里。","抱着自己的腿，环视周遭。","不行……","我明明没吃太多奶油炖菜，却觉得胃好沉重。","说什么洗澡能让人放松，根本就是骗人的。","我完全静不下心来，紧张得要命。","热水跟水泥没两样，只会让身体更僵硬，我才不相信这能让身体放松。","理由我很清楚。","因为这是宫城家的浴室，况且只有她在家。虽然这个家里除了她之外没有其他人在是稀松平常的事，但今天的状况不一样。","我用双手用力揉压太阳穴，呼出一口气。","「接下来只有要念书而已，别担心。」","也不知道这句别担心是要针对什么？总之低声说给自己听完后，我走出浴缸。","一起吃饭、洗澡、睡觉。","即使宫城不是我的朋友，这些都是只要借住在朋友家就会做的事情，不需要特别在意。像这种时候，还是赶快把该做的事情做一做比较好。","我洗干净头发和身体，走出浴室。","擦干身体，穿上借来的休闲服。","戴上吊坠后面对镜子，镜中倒映着身穿宫城衣服的我。衣服尺寸看起来刚刚好，不会太紧，也不至于太宽松。","但我就是觉得哪里不对劲。","总觉得身体并未确实地被衣服包覆住。明明只是几片布，穿在身上却好像快要冒出一股宫城就在身边的感觉。","「休闲服就是休闲服啊。」","蠢死了。","被一股只是好像快要冒出来的感觉耍得团团转也不能怎么样。","我拿起放在洗脸台上的吹风机，打开开关，开始吹起头发后，手马上就因为注意到洗发精的香味和宫城一样——这种理所当然的事情——而停了下来。温热的风伴随着扰人的轰轰声，毫无意义地持续吹在我的头发上","「……我到底是怎样啊？」","我大叹一口气。","即使是微小的事物，一旦累积起来也会变得很巨大。","我平常根本不会在意宫城的东西，现在却有这么多她的东西缠绕着，让我的脑袋逐渐被这些东西给掌控。","我把差点又要叹出的一口气给吞了回去。","动起刚才停下的手。不知道头发有没有好好吹干就回到她的房间里。","「我回来了。」","我对正在看书的宫城说，但她没有回我「欢迎回来」，默默起身打开衣柜。","「你可以拿冰箱里的麦茶喝。」","看都不看我地说完后，她拿着像是换洗衣物的东西说：「我去洗澡。」走出了房间。被留在房里的我照着她的话，从厨房里拿了麦茶回来，喝掉了大约一半，然后把玻璃杯放在桌上，站到书柜前。","上面放着我送给她的那只黑猫玩偶。","关于宫城这个人，我了解的事情虽然不多，却知道摆放在书柜上的这些书是她喜欢的东西。看到黑猫和她喜欢的东西放在一起，感觉她似乎比我想像的更珍惜这只黑猫。","我拿起玩偶，摸了摸它的头。","「太好了。」","尽管它不是一只活生生的黑猫，但比起被胡乱对待，受人珍惜当然比较好。","我亲吻黑猫的鼻尖，将它放回原处。","却没什么事情好做。","既没心情看书，也不想看电视。","我喝光玻璃杯里剩下的麦茶，将参考书和笔记本一一放到桌上，决定表现出一个考生该有的样子，把空闲时间用来念书。这样比起在房间里晃来晃去，照理说能度过一段更有意义的时光。","当我开始翻阅参考书，解开练习题之后，心情比洗澡时平静了许多。过了一会儿，宫城回到房里，我们就这样开起了读书会。","「你没化妆啊？」","她瞄了我一眼，小声地说。","坐在身旁的她除了穿着跟我款式类似，但称不上成对的休闲服外，跟平常没什么不同。是没有化妆的宫城。","「毕竟洗过澡了啊。」","念完书之后就要睡觉了，特地化妆毫无意义，而且在宫城来我家探病之际，就已经看过我没化妆的样子了。即使如此，我依旧很在意她看到现在的我，心里是怎么想的。然而她接下来就没再开口了，我无从得知她的感受。","沉默残留在彼此之间，唯有翻动书页与笔尖接触纸张的声音格外响亮。","没有称得上对话的交谈。","只有在回答宫城询问的一些小问题时有开口说话。","即使静静地不作声，也不代表注意力就很集中。不能说我完全不在意身旁的动静，宫城也很难说有在专心念书。","尽管如此，我们还是持续念书念了两个多小时。","宫城突然说：「我要睡了。」","就身为考生这点来看，念书的时间是短了些，但是在这种念不太进去的状况下继续念书也无济于事。我决定之后再补上今天念不够的份，同样收起了参考书和笔记本。","「仙台同学，跟我来。」","宫城站起身来这么说。","「是可以。不过要做什么？」","「客用寝具在其他房间里，得拿过来才行。」","她这么一说我才意识到——","虽然听起来像废话，不过这房间里只有一张床。","「……要给我睡的寝具？」","「对，你帮忙一起拿过来吧。」","「我知道了。」","这也是理所当然的。","留宿在朋友家时，对方大多会从某处搬出寝具来，想想要拿出客用的寝具并不是什么稀奇的事，宫城也不可能叫我跟她睡在同一张床上。","我跟在她身后，走出房间。","来到客厅后方的宫城打开纸拉门，走进和室。我至今为止从未看过，也从未进去过的和室里有几个橱柜，她从里面拿出了寝具。我们把那些寝具搬到房间里，铺在地上。","「我要关灯了。」","我把手机放在枕边后便听见她冷淡的说话声。我还来不及回话，房里就暗了下来。","「晚安。」","我在连夜灯都关上，一片漆黑的房间里对她说道。","「……晚安。」","传来一道微弱的回应后，声音就消失了。","房里寂静无声，简直不像是我已经来过无数次的宫城房间，待起来非常不自在。即使躺着，也有一股仿佛有什么东西紧贴在背上的异样感。我想身上穿着宫城的休闲服这点，也是内心无法平静下来的原因之一。","我紧紧闭上双眼。","黑暗溶化，与异样感融合在一起。","——尽管清楚这点，我却睡不着。","一下闭上眼睛，一下又睁开眼睛。","试着翻身改变身体面对的方向。","尽管做了各种尝试，睡意仍不肯袭来。如果我开始数羊，总觉得可以数到一万只。在我的记忆当中，自己的神经没有纤细到换了个枕头就睡不着的程度，可是今晚即使彻夜未眠也不奇怪。","我把手机拖进被窝里确认时间，结果发现距离最后一次查看手机还过不到十分钟。我坐起身来。","「你还醒着吗？」","向着可能跟我一样还没睡着的宫城搭话，却没有回应。","「宫城，你还醒着吧？」","她要是睡着，那就太奸诈了。","我抱着这种心情，更大声一点地叫她，但她果然还是没有回应。我在眼睛仍不习惯黑暗的状况下靠近床边，出声叫她。","「如果只是在装睡就起来啦。」","虽然觉得这样也该醒了，可是她不像要醒来的样子。","不可能。","我明明睡不着，她却睡着了。","我朝着什么都没说的宫城伸出手。","碰到一个软软的东西，我知道那是她的脸颊，沿着她的脸碰到与黑暗融为一体的头发，轻柔的发丝摸起来很舒服。我试着轻轻拉动像是浏海的部分，可是她完全没有要动。","「……志绪理。」","我把嘴唇凑近她的耳边低声呢喃。刚才动也不动的身体动了起来，和我拉开距离。","「不要叫我的名字。」","黑暗中响起她不悦的嗓音。","「你明明就醒着嘛。」","「我只是被你吵醒了。」","宫城说完后扭动着身体坐起来，点亮夜灯。","「我睡不着，陪我聊聊天啦。」","倒不是有什么特别想说的事情，只不过是觉得聊天总比数羊好。我没等她回复，迳自坐到床上。","「不要。这里是我的地盘，你不要坐上来。」","她以不小的力道往我的肩膀上推了一把。","「说什么地盘？又不是小学生。」","「我不管。你下床回自己的地盘去啦。」","「叫我回自己的地盘……但哪里才是我的地盘啊？」","「那里。」","宫城这么说着，指向给我睡的地舖。我乖乖站起来。","「是是是，我回自己的地盘去。」","走了一步、两步，钻进被窝里。","我跟宫城不一样。","接吻也好，触碰对方也罢，多半都是我在想。现在我也很想跟她接吻，想多触碰她。我不认为她心中完全没有这类感情，看起来却不像我这样。就算她心里有这些念头，程度一定也只有我的一半……不，绝对比那更低。","「我要睡了。晚安。」","醒着也只会让无法排解的感情逐渐膨胀而已，所以我闭上了眼睛。","「你刚才不是说睡不着吗？」","听到她跟我说话，我翻身面对床的方向。","「我的确有说，不过现在要睡了。」","「为什么这么突然？」","宫城刚才明明还拒绝陪我聊天，现在却说得像是想拦住打算睡觉的我。她要是安静不说话，我说不定还能睡着，但是一找我搭话，本来就距离遥远的睡意，这下又跑到更远的地方去了。","「我想说不要背叛你的信任。」","我闭着眼睛回答后，她马上回问：「那是怎样？」","「你是相信我不会做什么奇怪的事情，才让我留宿的吧？」","「是这样没错。」","「所以啦。晚安。」","我并不困，却仍强行结束了对话。虽然宫城出声呼唤：「仙台同学。」但我没回答，翻身背对床，接着背后便传来窸窸窣窣的声音。","我很快就感觉到身上盖着的棉被一角凹陷下去，于是从被窝里爬起来，转头看向床所在的那一侧，马上就看到了人不在床上的宫城。","「这里是我的地盘耶。」","宫城先前明明叫我回自己的地盘去，现在却不知为何缩成一团，坐在我的地盘——地舖的一角上。","「这个房间是我的领地，所以这里也是我的。」","照理来说是非法入侵的宫城，从我手中夺走了地舖的所有权，拉走我身上的棉被。如果是要我还给她，放弃棉被也无所谓，但我可没打算就这样乖乖让出地盘。","「你这样根本是作弊。真要说起来，这些事情你刚刚根本没说嘛。」","「我都已经让你住下来了，就算作弊也没差吧？」","这样说完后，她从地舖一角来到了我身旁。","摸了我的脖子。","心脏噗通地重重一跳，声音大到我甚至担心会不会被她听见。","紧贴在脖子上的手吓得我全身僵硬。","我的确想碰宫城。","却没想到她会主动碰我。","「都是仙台同学不好，谁教你要吵醒我？」","她像是在找借口似的喃喃说着，手沿着我的脖子滑动。指尖往下滑，来到了休闲服的领口，却迟疑地停了下来，没有钻进衣服里。","我抓住她的手腕。","然而她的指尖没有离开，用力按在我身上。","我抓着她手腕的手加重了力道。","「仙台同学，放开我。」","宫城以放学后在这房间里命令我的语气这么说。","我知道她想做什么。虽然不懂她为什么不肯说出自己的目的，但她一定是想确认我有没有戴着吊坠。","「我要是放手，你打算做什么？」","倘若她要求要看，我会让她看。","吊坠本来就是随着这样的约定给我的，所以我对遵守约定这件事没有异议。可是她又还没叫我让她看，况且今天没有五千圆介于我们之间，她没有权力命令我。","「我不需要告诉你。」","宫城冷漠地回答。","「那我不放。」","若是平常的放学后，我可以松手，今天却不想让她擅自确认。","「……放开我啦。」","听到她那近乎恳求的声音，我不禁放松了手上的力道。","她对我下达的是命令，不是请求。","尽管如此，刚刚的声音说是请求也不为过。","迈入寒假的现在，我不需要听宫城的命令。","当然也不需要理会她的请求。","却也觉得这倒不是我非得拒绝她不可的事情。","「唉，好啦。」","我松开抓着的手腕后，她的指尖从领口滑进衣服里，摸到了吊坠的链条。她既没有抚摸链子，指尖也没有更进一步地钻进去，而是把吊坠拉了出来。","「你有遵守约定啊。」","她以变得柔和了那么一点点的语气说完后，指尖顺着链条抚摸月亮形的坠饰。","「基本上还是有啦。」","我简短回答。她拉扯吊坠。","「……明明也有没遵守的约定。」","「反正有些有遵守就够了吧？」","「全都要遵守啦。」","「我没自信能办到。」","我想这种时候即使是说谎，也该说「我全都会遵守」比较好。","但如果说全都会遵守，不知道宫城会要我定下怎样的约定？毕竟她有时候会做或说出一些意想不到的事情，一旦塞了什么难题过来，我没自信能守住约定。现在都有几个守不住的约定了，我没办法不负责任地保证会遵守所有约定。","「我不喜欢仙台同学这种反应。」","她明显压低许多的声音传来，同时也放开了吊坠。","「我知道。」","「也不喜欢你说这种话。」","她的语气变得更不高兴。我反射性地抓住她的手臂。","我和宫城的距离没有改变。","却觉得她在远离我。","有什么和平常不一样。","尽管感觉到了那样的存在，我却不晓得那是什么。","不过我知道自己搞砸了。","即使没有自信，也该说我会守住所有约定。","就算不知道当中带有怎样的含意也无所谓，只要说出来就行了。","「我要睡了。」","她说完后，也不管手臂仍被我抓着就想站起来。我更用力地抓住她，她便以责备的语气说了声：「很痛耶。」","「等一下再睡啦。」","就这样让她去睡，总觉得她会走到离我更遥远的地方。","「不要。」","随着短短的一句话，她硬是想把我的手从身上剥下来。","宫城的指甲深深刺进我的手背，甚至让人怀疑她是不是想抓破我的皮肤。我因为强烈的痛楚而大力拉扯她的手臂，尽管不想那么粗鲁，却无法好好控制力道。宫城一下子站不稳，抓住了我的肩膀。","「这样很危险耶。」","我把气呼呼地这么说的她关在怀里。","顺着物理上拉近的距离，我将嘴唇凑了过去。","就算距离近到吐出的气息会交融在一起，她依然没有动。","所以我毫不犹豫地吻了上去。","至今为止明明不知道已经接吻过多少次了，我的心脏依旧吓了一跳，总觉得可以听见「噗通」一声。","用力将嘴唇抵上去后，那份柔软鲜明地传来。即使闭着眼睛，也能从我们相触的部分清楚地知道她双唇的轮廓。不过她立刻推了我的肩膀，比黑猫玩偶更柔软的唇瓣离我而去。","「仙台同学不是说过不会做奇怪的事情吗？」","宫城小声地说，从我怀里逃了出去。","「我刚才有教你念书，接吻不是什么奇怪的事情吧？我们约好了，这是在行使我应有的权力。」","接吻包含在我们寒假前说好要教她念书的约定内。","我今天本来是想以「不做奇怪事情」的约定为优先，不行使这份权力的。可是她也没有逃开。既然如此，再来一次也没关系吧？","我伸出手，触碰身旁的宫城唇瓣。","然而在我吻上去之前，她就抓住我的手，将我推倒在地。","由于有打地舖，我的背倒是不痛，但这可不是什么不痛就好的事。","「你现在做这种事情，就表示我可以这么做吧？」","她的声音从上方落下。","可以这么做。","我想像得到她指的是什么事。","不过那是宫城所说的「奇怪的事」。当我仍在迟疑，不知道是否该接受这个状况时，她抓住了我的休闲服下摆。","「宫城，我没说可以。」","「那你就说可以啊。」","听起来实在不像是接下来要做「奇怪的事」，十分不高兴的声音传来。尽管不期待她会说出什么甜言蜜语，但这语气未免太刺人了。","「我不要。」","今天本来就约定好不做那种事情了。","我拍打她抓着我休闲服下摆的手，跟她说：「放开啦。」然而她的手滑进了衣服里，抚摸着我的腰。","「等一下，宫城。」","「这都要怪仙台同学打破了约定。你明明说不会做奇怪的事。」","「接吻是我们约好的吧？」","我提出自己在寒假前获得的权力，她却没有停手。","指尖缓缓地沿着腰往上爬。","「刚刚根本不是该接吻的时机。真要吻的话，你在我们念完书的时候吻不就好了？」","「你又没指定时间。」","宫城停下手……","然后凝视着我。","「——仙台同学果然不可信任。」","小声地说完后，她掀起我的休闲服到胸部下缘的位置。","肚子露出来倒不是什么大不了的事情。","别说在夜灯下，就连在灯火通明的房间里都给她看过了。只是失去了衣服保护的肚子让人觉得很不放心。","她把手贴在我的肚脐旁边。","透过传来的体温，我知道她把整个掌心都按了上来。","按得甚至有些用力的手毫不犹豫地动起来。","体温缓缓地移动到肋骨最下面的位置。","感觉与其说舒服，不如说很痒，可是不到我想从宫城底下逃开的程度。总觉得就算再贴在我身上一会儿也没关系，她的手却踌躇不前，抚上一根肋骨便停了下来，不肯继续前进。","我知道她的手想前往的目的地是哪里。","应该现在就抓住并拉开她的手才对。","今天约好了不做那种事情的。","「宫城。」","我没有抓住她的手，改叫了她的名字后，从肌肤上传来的温度消失了。不过她的体温马上又流入我的体内，手往上抚摸到胸部下方。","「……有穿啊？」","她自言自语般地说着。","尽管省略了主词，我依旧很快就意识到她是在说内衣。","「有穿啊。毕竟不是在自己家嘛。」","「……可以脱下来吗？」","宫城把手放在我的胸部上，像是要试探我似的说着，然后微微地动了动，仿佛在确认形状一般。","虽说中间隔着布料，她手掌的触感跟温度还是传了过来。","不觉得舒服的我仍逸出一声叹息。","指尖碰上我的肩带，停了下来。","在得到同意之前，她似乎不打算脱下我的内衣，但我全身僵住了，完全没预料到叫我别做奇怪事情的当事人，居然会对我做奇怪的事。","必须作出回答的人是我，宫城在等待着。","我伸出手触碰她的脸颊。","用指尖抚摸她的下颚，揉捏她的耳垂。","她好像觉得很痒，呼出一口气。","「仙台同学。」","她像是在催促我回答似的呼唤。","我想让她碰我，也同样想碰她。","「可以」跟「不可以」在心中混合交融，无法分离。","「——如果宫城已经做好应有的觉悟了，那悉听尊便。」","虽然做着奇怪事情的人不是我，而是她，但这说不定也会被计算在打破约定的次数里。","如此一想，就觉得不该这样继续下去。","我想每次被计算进去，计量表的刻度就会往上爬升，一旦到达极限，宫城便会就此消失无踪。可是我看不到那个计量表，不知道自己究竟还能再打破几个约定，所以只能把选项推给她。","「觉悟是指什么？」","「你知道我这个人并不理性吧？」","我像她所做的那样，把手从她的休闲服下摆伸了进去，抚摸她的腰。","「……这是什么意思？」","「你这是明知故问吧？」","宫城什么都没说。","「我是不介意告诉你，但你觉得这样好吗？」","尽管觉得自己很奸诈，我还是问了她。","让手滑动，沿着她的背脊一路往上摸。","指尖碰到内衣。当我摸上背扣，她便吓了一跳似的挪开原本放在我胸部上的手，从我身上爬了起来。","宫城远比我要理性得多。","不仅能在沉溺于欲望之前就朝着岸边游去，还能拯救我。","「够了。」","她这么说着，坐在我旁边拉好不太整齐的衣服。","「这样的确比较好。」","我也坐起身，动手整理凌乱的衣服。","就那样继续下去，难保不会演变成她在半夜把我赶出家门的状况。如果是她，感觉真的有可能会做出这种事，所以照理说到此就好。","可是我还不想让她回床上去。","我握住在旁边的手。","「宫城。」","轻声呼唤她。宫城看着我。","我将脸凑近，吻上她的唇。","她没有捶打我的肩膀，也没有用指甲抓我。","知道她并不排斥后，我缓缓地退开脸。","「这个吻是我跟你约定的一环，也是接续刚才的吻。你要叫我别做奇怪的事吗？」","我没听到她的声音。","她什么都没说，松开了与我交握的手，抚上方才被她拉出来之后就一直垂挂在衣服外的吊坠。","「我会再行使一下自己的权力，你可别生气喔。」","还是说一声。","保险起见。","事先宣告后，我再度吻了宫城。","〔本话含插图〕"]},{"t":"第5话　仙台同学总是不体贴","p":["我们在寒假前确实有过这样的约定。","所以即使实际上应该在念完书的当下就接吻，现在并不是正确的时机，但既然仙台同学想这么做，要接吻也行，我可以网开一面，容许说出「我会再行使一下自己的权力」的她这么做。","可是她所说的「再一下」，范围实在太不正常了。","说完「你不要生气喔」之后，她又吻了我一次，然后我现在正被她亲吻第三次。我的确不介意她行使自己的权力，却觉得她该遵守自己加上的「再一下」这个条件。仙台同学一副还不够的样子，再度把脸凑了过来，明显就是亲太多次了。","在第四次被吻之前，我伸手抵住她的额头。","「仙台同学。」","在手上施力，推开她靠过来的脸。","但她拉开我的手，像是要夺走话语权般吻上我的唇。","那股我熟悉的柔软和温度传来，很快地又离开。接着我们的双唇再度紧贴在一起。","我觉得她的嘴唇很舒服。","刚才碰她的身体时，我的心脏都快要爆炸了。","因为心脏以比平常几乎快上一倍的速度跳动着，让人无法好好呼吸。","手和脸也都在发烫，总觉得我都要变得不像是我。","尽管心脏现在也跳得很快，不过跟刚才不一样，我还有余力感受从交叠的嘴唇上传来的舒适柔软和温度。","可是仙台同学再不停下来就伤脑筋了。","我推着她的肩膀，让身体远离她。","「虽说是代价，但你亲太多次了，这才不是什么再一下。」","这样说完后，她的手指抚上我的唇瓣。","「你又没有限定次数。」","「那我现在就说。」","「你说了也要下次才会生效。」","随口否定我发言的声音传入耳中，她的嘴唇又碰了上来。","一次又一次。","仙台同学行使的权力全都是仅止于轻触的吻，次数多到我连数都觉得麻烦，现在也只轻轻碰了一下我的嘴唇。她或许是体贴地要避免事情发展成「奇怪的事」，然而这很不像她的作风。","我所认识的她既强势又好色，并不体贴。","感觉她像这样只用双唇轻触的方式吻我，实在太体贴了。倒不是觉得这种舒适的吻好像少了点什么，可是这会害我变得很不对劲。","我逐渐开始觉得只是一下下的话，就算是更深入的吻也没关系。","——不行。","继续这样容许她下去，又会发展成奇怪的事情。真要说起来，她才不会毫无意义地对我体贴。","「你再继续下去的话，我真的要生气了。」","趁着她嘴唇离开的瞬间，我在下一次被吻前斩钉截铁地说道。","「又没关系，再一下下就好。」","「不好。你的再一下根本就是很多下啊。」","「小气。」","「小气就小气。住手啦。」","我拖着身体往后退，和仙台同学拉开距离，然后关上夜灯，使房里变得一片漆黑。","「睡觉了。」","我告诉她晚上该做的事情，拉动棉被。然而她太碍事了，害我无法顺利把棉被拉过来。","「既然要睡觉了，那宫城回自己的地盘去。」","不知从哪里伸来的手推着我。","「……不要。」","等放学后来我房间里的仙台同学回家之后，除了我以外还有其他人在家的日子可说是少之又少。无论天气好坏，到了晚上总是只有我一个人。尽管早已习惯没人在家，到天亮前的时间对孤独的我来说还是太漫长了。就算要做的事情只有睡觉，也曾有过不知名的东西出现在梦中，令人感到寂寞不安的日子。","这样的夜晚，难得有我以外的某人在家。","既然如此，应该要好好活用这个某人才对。","即使对方是仙台同学也一样。","而且距离越近越好。","她的肚子很温暖，嘴唇也很温暖。","再说一个人睡很冷，总觉得她可以当一下暖暖包的替代品。","我硬是把棉被往自己这边拉过来，早她一步钻进被窝里。","「等一下，你为什么要睡在这边啊？你要睡这里的话，我就去睡床上。」","传来窸窸窣窣的声音，让我知道她正打算站起来。","「不行，床是我的地盘。」","我抓住仙台同学，把她拉回来。","「就算你不睡也一样？」","「对，就算我不睡，那里也是我的地盘。这里才是仙台同学的地盘。」","「你想跟我一起睡的话，就说想跟我一起睡啊。」","「才不是那样。比起那种事情，去床上把我的枕头拿过来。」","「我看不到耶。」","在关上夜灯的房间里，一切都溶于黑暗当中，什么都看不见。","可是仙台同学来这房间的次数，已经多到她都要来腻了。","「就算看不到，你也大概知道床在哪里吧？」","「宫城真的很任性耶。」","她无奈的声音传来，气息则逐渐远去，不过很快又靠过来，有个像枕头的东西被放到了地舖上。","「你再睡过去一点啦。」","仙台同学一边推我一边说。","我伸手摸索，把枕头拉过来，留出一块空间。她拉好棉被，钻进被窝，在我身旁躺下。","「好挤。」","虽然她伴随不满的语气轻轻踢了一下我的小腿，但我再往边缘挪动就要掉出地舖了，只得转身背对仙台同学，闭上眼睛。","漆黑的房间变得更加晦暗。","就算背后出现妖魔鬼怪也不奇怪的黑暗笼罩着我。","可是今天有仙台同学在。","「你有什么目的？」","我的背随着她低沉的声音被戳了几下。","「我睡在哪里都没差吧？」","我拉扯棉被，弓起身体。","「你把棉被拉太过去的话，我会冷啦。」","尽管背后传来她的抱怨，我仍默不作声，结果她不知为何没有拉扯棉被，反而拉了我的休闲服。她的掌心贴在我的背上，即使隔着布料仍有点痒痒的，可是很温暖，感觉很舒服。","传来的体温让人回想起她藏在休闲服下的身体。","那时我认为只要触碰仙台同学，或许就能相信无法信任的她所说的话，藉此消除内心的不安，然而不安不仅没有消失，反而更为膨胀。即使亲眼看见项链，知道她有遵守约定，我也无法相信她往后会继续守着约定。","现在也是，她明明就在我身边，我碰得到她，却觉得只要转过身去，她就会像鬼怪一样消失，突然不见踪影。","一点都不可怕。","我在心中念着自己在孤独的夜晚里念过无数次的咒语。","更加拱起背部，把身体缩成一团，抓着被窝的边缘。","在我睁开又紧闭上双眼后，背上传来的体温变得暧昧不清，让我觉得房里再度只剩下自己一个人。我有些害怕，肩膀和手臂的肌肉也跟着紧绷起来。","「宫城。」","听到呼唤我的微弱声音，模糊的体温化为确实存在的温度。","这个房间里毫无疑问地有其他人在，我知道那是仙台同学。","按在我背上的手又抓住了我的休闲服。","我有种她打算叫我名字的预感，抢先开口。","「你要是叫我志绪理，我就要取消你来这里的日子可以接吻的条件。」","叫别人的名字是很常见的事情，没什么特别的。舞香和亚美都叫我「志绪理」，以前也有人这样叫我，我却觉得让仙台同学呼唤名字是件特别的事情，不希望她这样叫我。","「我叫宫城就没关系吧？」","这样说完后，她便叫了我：「宫城。」","宫城。","宫城、宫城。","一再反复呼唤的声音，使我紧绷的身体放松下来。","「仙台同学很吵耶。赶快睡觉啦。」","虽然听到她「嗯」地应了一声，她却没睡，反而摸了我的头发。","犹如要用手指梳开般抚摸着我的头发。","一而再，再而三。","我的眼皮因为她柔软的手和传来的体温变得沉重了些。我将缩成一团的身体稍微伸展开来后，她的手才随着一声轻轻的「晚安」离开。","我忘了按下闹钟。","也不记得自己有设定手机的闹铃。","反正学校在放假，没闹钟也无所谓，我也不需要早起。","可是身体自作主张地醒来动了动之后，我发现仙台同学在旁边。","「……为什么？」","我先闭上眼睛，接着又用力睁开。","看着身旁。","她熟睡的脸庞清楚地倒映在我眼中。","我以茫然的脑袋追溯记忆。","昨天她到家里来，我们一起吃了晚餐。","然后她就这样住在我家。","原因则是因为我向仙台同学表示她可以住下来。","我的记忆没错。","再继续追溯下去，便会找到我不想承认那是事实的记忆。","——仙台同学睡在我身旁的原因……","是因为我主动钻进了准备给她睡的棉被里睡觉。","「全身酸痛耶。」","大概是挤在空间不够两个人睡的狭窄地舖上睡了一晚吧，身上的关节变得相当僵硬，感觉一动就会发出喀啦喀啦的声音。我呼出一小口气后伸出手，试着轻轻拉动就在自己身旁的浏海。","「嗯——」","她动了动嘴，传来不成话语的呻吟声。","却没有醒来。","我以指尖触碰她的脸颊，一路滑到下巴尖端。","可能是睡得很熟吧？她的身体连动都没动。","「……叶月。」","试着轻声呼唤她的名字，她仍一语不发，于是我掬起一束长发拉向自己，用嘴唇轻碰那束即使违反校规却绝对不会被老师责备，偏棕色的头发。","昨天没注意到，不过她触感柔顺的头发上有着跟我一样的香味。","我让嘴唇离开发丝，稍稍靠近她。","不仅头发，她的身上也传出跟我一样的香味。","只有我知道这个穿着我的衣服，跟我有同样香味的仙台同学，总觉得说是只属于我的她也不为过，却想必没机会再看到这样的她睡着的模样了。","我伸手触碰从休闲服领口处露出的项链链条。","约定的日子正逐渐逼近。","寒假很快就会结束，等跨完年再撕下几张月历后，一转眼就到毕业典礼了。当那一天到来，高中生活便会划上句点，即使不情愿也必须展开新生活。","我轻轻吐出一口气。","指尖滑过链条上方。仙台同学的身体微微颤抖了一下，让人吓得心脏都快停了。我连忙从项链上收手，悄悄钻出被窝，小心翼翼地不发出声音，拿着要换穿的衣服走出房间，来到盥洗室。在刷完牙并换好衣服后走向厨房。","即使不打开，我也知道冰箱里有些什么，但还是打开确认了一下。里头果然几乎没有任何东西。我从冷冻库里拿出吐司，把两人份的吐司塞进烤面包机里。当我正在准备盘子和玻璃杯，还没去叫仙台同学之前，她就自己过来了。","「早安。你在做什么？」","依旧穿着休闲服的她语气仍带着一丝睡意，看向烤面包机。","「早安。看就知道了吧？」","「该不会是在准备早餐吧？」","「不用怀疑，就是在准备早餐。」","「……宫城，我下午得去补习，如果下雪了会很伤脑筋耶。」","「你要是不想吃就直说啊。」","我轻轻踢了一下讲话很失礼的仙台同学。我不谙厨艺，常常随便吃点什么就打发掉一餐，却很少不吃早餐。烤吐司这种小事我还是会做的。","「开玩笑的啦。我可以先去换衣服吗？」","她拉着休闲服的下摆，一边问我。","「不行。吐司快烤好了。」","我这么说并打开冰箱，她不知为何也跟着凑过来看。","「有果酱吧？」","耳边传来她的声音。我推开她的额头。","「有是有，但说不定已经过期了。」","「真的假的？」","「反正有奶油，没差吧？」","我从冰箱里取出装有奶油的容器给她，听见她以异常遗憾的语气说道。","「都涂上去会很好吃耶。」","「会胖喔。」","「唉，是没错啦……所以真的过期了吗？」","在仙台同学的催促下，我无可奈何地拿起果酱，确认瓶身上标示的数字。","「勉强过关。」","把果酱递给她后，我把柳橙汁也拿了出来，关上冰箱。她将奶油和果酱放在吧台桌上，烤面包机传出吐司烤好的清脆响声。我取出吐司，放在盘子上，将柳橙汁倒进玻璃杯里，端到吧台桌上。","我们并肩而座，对着称不上豪华的早餐说：「我开动了。」","彼此的声音重叠。我看向仙台同学。","早上的时候，爸爸很少会在家。","早上的时候，妈妈从没有在家过。","早上我身边有其他人在是非常难得的事。","我将奶油涂在吐司上，咬了一口之后，在奶油上又抹了一层果酱的仙台同学看着我。","「宫城也涂涂看嘛。」","果酱滑过桌面，来到我手边。我在外面的店家经常会看到同时涂了奶油和果酱的吐司，自己却没有把它们一起涂在吐司上的习惯。","奶油是奶油，果酱是果酱。","总觉得分开涂上它们的吐司就已经很好吃了。","可是仙台同学以充满期待的眼神看着我，所以我在奶油上面涂了少量的果酱后咬了一口。吐司边发出酥脆的响声，奶香和草莓味在口中扩散开来。我一口接一口地吃着，奶油淡淡的咸味和果酱的甜味恰到好处地融合在一起。","「好吃吗？」","被她这么一问，我回答：「比想像中好吃。」","早餐不过是用来填饱肚子的，只要不是讨厌的食物，我根本不在乎味道怎么样。然而这确实很好吃，我甚至觉得下次吃的时候可以再多涂一点果酱。","「太好了。」","仙台同学粲然一笑，喝下柳橙汁。","这么说来，我们暑假时一起做了法式吐司吃。除此之外，也有过好几次她在这里下厨，两人同桌吃饭的经验。回顾后我才发现，吃饭这件事已经和她有着深刻的连结，一起吃饭逐渐变成理所当然的事。没和她见面，吃饭似乎就会变得很无趣。","我喝了一口柳橙汁。","晚上，我变得会觉得跟她一起吃晚餐很美味。","早上，我也觉得和她一起吃早餐很美味。","明明已经不论早晚都独自吃饭好多年了，却因为仙台同学，害得我越来越不想一个人吃饭。过去那个视独处为理所当然的我，渐渐成了不一样的人。","装有橘色液体的玻璃杯变得空空如也，剩下的吐司也全纳入胃袋。烤得微焦的吐司和奶油、果酱混合，堵住我身体某处快要出现的空洞。","「餐具我来洗，你去换衣服吧。还有，我在盥洗室帮你准备了新的牙刷。」","我边收盘子边告诉仙台同学。","「谢谢。反正距离去补习还有一点时间，我先来帮忙洗碗吧。」","「不用。你要是不想换衣服，就这样穿着也行。」","「我去换衣服。」","她一口吃掉剩下一小块的吐司，站起身来，随即走回房间，剩下我一个人。","我收走她用过的盘子和杯子，打开温水。","以满是泡泡的海绵清洗餐具，看了看时钟。","还有几个小时。","尽管觉得从昨天仙台同学到我家以后仍未经过多久，但很快又要剩下我一个人。之所以会没来由地感到寂寞，是因为我知道昨天整晚都在身旁的某人，今晚就不在了。","她不去补习是不可能发生的事，要她今晚再住下来更是天方夜谭。我心里明白，却觉得她要回去是件极为扫兴的事。","我洗好所有餐具，关上温水。","回到房间后，等着我的是连妆都画好的仙台同学。","「反正时间还早，来念书吧。」","她在桌上打开参考书，一边说。","「我是要念书没错，不过……」","「不过？」","「今天不接吻。」","我坐到她身旁回答后，她一脸诧异。","「为什么？」","这大概是明知故问。","她昨天说那是教我念书的代价，吻了我那么多次，今天居然还想要求代价，未免也太贪心了。","「次数限制。你昨天连今天的份都用掉了。」","「我没听说有次数限制啊。所以是几次？」","「不告诉你。」","「你这是怎样？我不知道次数，不就没办法控制在次数范围内了吗？」","「我说不行就是次数用完的时候。」","我打开参考书，视线落在一排排文字上。","因为根本就没有决定次数，我没办法回答她。况且即使决定了，她也会马上打破这条规定，毫无意义可言。再加上她要是又像昨天那样吻我，感觉一定会发生什么事，所以我死都不想跟她接吻。","「你这个人真的是……自己想干嘛就干嘛耶。」","「仙台同学还不是一样。」","我没看她的脸，这么回答之后，旁边传来一句：「嗯，我是不否认啦。」对话便就此中断。彼此并未继续聊天，就这样安静地念书。时间转眼来到下午，我们一起吃了午餐。很快便到了她必须回去的时间，只听见她说：「我差不多该走了。」","「我送你到楼下。」","我对拿着大衣和包包的仙台同学说。","「外面很冷，不用啦。」","「没关系，我马上就回来了。」","见我从衣柜里拿出羽绒外套披在身上，她说：「那就到楼下。」","我们一起走出玄关，锁好门。","走在住宅大楼的通道上，搭上电梯。","穿过大厅，打开连接至户外的大门后，一股冷风咻地吹了进来，我不禁缩了缩脖子。身后传来说话声。","「好冷。」","怕热的仙台同学在喊冷。","因为吹进来的风比想像中更冷，我可以理解。外面寒冷得光是走出去几步就会想掉头回家。我看向仙台同学，只见她一脸郁闷。","呼出的气息还不至于化为白色的雾气，不过太阳跟云看起来都很遥远。天空染上了与冰山一样的淡蓝色，光看便令人打起寒颤。","「送我到这边就好。谢谢你让我留宿。」","怕冷地把手插进大衣口袋后，她又补上一句：「那我走了。」","平常我会就这样跟她道别，走回大楼里。","今天却在临行之际抓住了她的手臂。","「宫城？」","并不是忘了说什么，也没有非要告诉仙台同学的事情，只是手擅自动起来抓住她，所以我想不到该说些什么才好。明明想不到，但我无法松手，就这样盯着她。","「我补习会迟到。」","这么说着的她把手抽出口袋，握住我不肯放开她的那只手。","「你不是会迟到吗？」","我问她。她虽然回了一句：「嗯，所以我要走了。」仿佛这一秒就会迈开步伐，可是她没有走，也没有松手。","「宫城，下次见面就是明年了吗？」","她用力握紧抓着我的手。","「我是这么打算的。决定好要叫你来教我念书的日子，我再跟你联络。」","「好。」","她松开握着我的手。","仙台同学并不体贴。","这件事我再清楚不过了。她更重视念书、重视补习，根本没那么看重我，所以我又得独自待在那个家里。","「那我走了。」","仙台同学走了出去。","「再见。」","她挥了挥手回应我。","背影逐渐缩小。","我早就已经习惯独处了，但想到接下来得一个人回到原本一直有她在的房间里，就觉得非常忧郁。","新年快乐。","醒来的我看了看放在枕边的手机，舞香和亚美都传了一月一日会传的讯息过来，我也同样回传「新年快乐」给她们。","而仙台同学没有传讯息给我。","当然也没有打电话。","她不会在跨年的瞬间就打电话过来，也不会传「新年快乐」这种讯息给我。虽然我同样没有打电话或传讯息给她，却觉得她跟我联络一下也无妨吧？","我依然躺在床上，盯着手机萤幕。","铃声不会突然响起。","「倒是无所谓啦。」","仙台同学不在，不过今天我不是一个人。","爸爸难得在家，我们会一起吃饭。","我小时候很喜欢爸爸会在家的跨年夜和新年。尽管上国中之后，迎接新年不再是那么特别的活动，有人在家依旧让我很安心。而现在比起要跟爸爸吃饭，我更在意没收到仙台同学任何联络的手机。","我翻身侧躺，摸了摸放在枕边的黑猫玩偶的头，然后把手机放在它旁边，钻出被窝。","大大地伸了个懒腰后，我走出房间。","刷完牙，回房间换衣服，来到客厅。","跟爸爸说了声新年快乐，两人一起吃了早餐。","虽然觉得时间相比要上学的日子过得更快，但没什么有趣的事情，所以感觉同样漫长。在我没多想地坐到书桌前翻开参考书后，时间来到了傍晚。除了念书以外也没做什么别的事情，我就这样吃完了晚餐。","由黑猫负责看守的手机收到了不少联络，然而全是舞香或亚美发来的，不是仙台同学。","结果即使是一月一日，依旧没有发生什么特别的事。","度过除了念书外跟去年没有不同的一天，我一如去年地比平常提早一些就寝。","隔天也仍旧如此。","醒来时和去年一样，只有我独自在家，等回过神来已经是晚上了。","看看时钟，时间已经超过晚上十点。我躺在床上。","一个人待在几天前才和仙台同学一起睡过觉的房间里。","尽管不觉得寂寞，却很无聊。","我把黑猫玩偶拖过来，拉了拉它的耳朵。它没有发出「喵～」或「咪～」的叫声，反倒是手机响了。我拿起放在枕边的手机，看向萤幕，只见仙台同学传了『你现在一个人？』这种实在不像新年会传的讯息过来。我回传『是没错』给她之后，这次换成电话打来了。","铃声响了一次，我犹豫着。","要是马上就接起来，感觉好像在等她打来一样，所以我在铃声响了三次之后才起身接电话，对着手机「喂？」了一声。电话那头回了一句：『新年快乐。』","一讲起电话，她的声音就变得好近。","让人回想起我们睡在一起的时候。","那时她的声音也好近。","我握起拳头。","只是讲个电话而已，根本没什么好介意的。","「……新年快乐。」","我说出去年没对她说的节庆问候语，等她开口。她却一语不发。","「有什么事吗？」","无可奈何的我只好主动向她搭话。","『我在想什么时候才能去宫城家。』","「我不是说决定好会跟你联络吗？」","『就是因为没收到联络，我才会来问你啊。』","「没联络便表示我还没决定好。你再等一下啦。」","无论是跨年或新年第一天，都不是该叫她来教我念书的日子——我还是有这点常识的。今天才一月二日，还算在新年的范围内，不方便叫她过来，所以我实在没想到仙台同学居然会讲得一副没早点联络她是我不好的样子。","『等着等着，感觉寒假就要过完了。你现在就决定啦。』","她以擅自认定是我不好的语气这么说。","「我也有自己的行程啊。就算叫我现在就决定也没办法。」","其实我没什么特别的行程，却不想立刻做出决定。如果仙台同学打来的用意是要决定下次见面的日期，那日期一旦决定下来就没别的事了。她也会挂掉电话，一切就此结束。","我觉得可以再多跟她聊几句来打发时间。","『宫城有其他行程？』","听到她那感到意外的语气，我有些不爽。她好像认为我基本上不会有其他行程，让人很火大。","「不能有吗？」","『是没有不能啦……在那之后你做了些什么？』","所谓的在那之后，大概是指我最后一次和她碰面那天之后吧。","「没什么。」","『跨年跟新年当天也没有？』","「又没什么事要做。」","『跟朋友见面之类呢？』","「你马上就问一些父母才会问的事情耶。」","虽然爸爸不会想做这种事，不过漫画或电视上常看到父母想掌握小孩的行动。仙台同学有时候就跟这种父母一样，会想试图掌握我的动向。尽管不至于觉得她这样很烦人，可是知道我都做了些什么，根本没什么有趣的吧？","『让我问一下又不会怎么样。毕竟也没别的事情好聊啊。所以你没跟宇都宫之类的朋友见面吗？』","她以听不出到底有没有兴趣的声音问道。","「没有。这段时间大家都忙着准备大考啊。你也一样——」","我在差点要说出「没跟朋友见面吧」之际想起来了。然而还来不及说出想起来的事情，她便说出茨木同学的名字。","『我有和羽美奈她们去新年参拜，祈求能够顺利考上大学。』","听到这个不太想听到的名字，我整个人倒在床上。","朝黑猫伸出手，捏住它的耳朵。","『也连宫城的份也一起祈求喽。』","「不用帮我祈求。」","『可是你没去新年参拜吧？』","听她又擅自下定论，我摸了摸黑猫的头。","「我又不相信这些。」","『我倒也不是相信，不过这种事情就是求个心安嘛。重要的是心意。』","仙台同学看起来不像是会去祈求自己能考上的那种人，还以为她会觉得有空求神拜佛，不如多花点时间念书。倘若这样的她独自跑去帮我祈求神明，那倒是无所谓。但她不是自己一个人，而是和茨木同学去新年参拜，才顺便帮我祈求的。","我不认为她这样做有什么心意可言。","即使如此，继续否定她感觉不太好，我于是默不作声。但如此一来，我就不知道自己可以说些什么了。","『你也差不多决定好了吧？』","她再度提起差点被遗忘的下次读书会之约，接起了中断的对话。","「你后天有空吗？」","『不是明天，是后天？』","「对。」","『你不介意我傍晚才过去的话……』","「那你后天过来。」","『不挑明天的理由是什么？』","「因为正月前三天都比较忙啊。」","虽然考虑到仙台同学的家庭状况，是不是前三天好像也没差，但我多少仍有所顾虑。","『原来你会在意这种事情啊。』","「我是不在意，不过你也有自己的书要念吧？」","我这么一说，她先是回了：『是没错啦……』又补上一句：『那后天见。』随即挂断电话。刚才还很近的声音岂止是远去，根本就在刹那间消失无踪。没了说话对象的房间实在太过安静，让人心情也跟着沉重起来。","寒假很短。","后天见面之后，大概不会再有下一次了。","我和仙台同学都是考生。","如果她说是被我妨碍念书，才害她没考上大学，我也很伤脑筋。而我倒不是非要和舞香上同一所大学不可，然而比起落榜，还是希望能够考上。现在是双方都必须更加认真念书的时期。","倘若不是考生，就能更随意地叫仙台同学过来了。","假如是去年，不管叫她来几次都行。","一年前我们还遵守着假日不见面的约定，所以我没和她见面。现在却在想这种事。","寒假真的很无聊。","我大叹一口气。","把黑猫放到躺在枕边的手机上面，关了灯。","虽然这时间要睡还太早了，我仍闭上双眼。","夜晚转瞬即逝，来到早晨，我比去年更认真念书，度过了漫长的一天。","睡前手机没有响起。","没有收到讯息，也没有电话打来。","早睡早起的我把黑猫放在书柜上。等到约好的傍晚，门铃响起，我让仙台同学走进除了我之外没其他人在的家里。她说完「好久不见」后脱下鞋子，又接了一句在电话里已经说过的「新年快乐」。无可奈何的我只好也回了一句：「新年快乐。」","「你到房间里等我。」","我对脱下大衣的她这么说，走进厨房。","把饼干放到盘子上，一边思考。","两天前，我曾透过电话听见仙台同学的声音。","这样一想，总觉得她说「好久不见」似乎不太对，但以见面来看的确是「好久不见」没错，我有同感。跟一次都没和她见面的去年寒假不同。而一思考起这种事情，我的肩膀就变得好沉重，觉得她所说的「好久不见」这句话像是装了太多东西的包包。明明是句别无他意的话，却让人开始认为那是某种重要的事物。","我打开冰箱，拿出汽水和麦茶。","都是因为想得太深，才会让无关紧要的话变得有意义。明明就没什么，我何必特地去做像是在为这句话赋予意义的行为？","我分别将汽水和麦茶倒进玻璃杯，再把宝特瓶收回冰箱里。端着放有盘子和玻璃杯的托盘回到房间，只见仙台同学已经打开参考书在等我了。","我将盘子和玻璃杯放在桌上空着的位置，听到她说：「谢谢。」","高领毛衣配上牛仔裤。","仙台同学难得穿着没露出脖子的衣服，头发也没绑。像个陌生人的她看着我。","「你不坐下来吗？」","原本呆站着的我顺着这番话坐到她身旁。我没来由地摸着自己的上衣扣子时，她呼唤了一声：「宫城——」","「今天也没其他人在家吗？」","「对。」","「家人去上班了？」","仙台同学拿起一片饼干咬下。","「是没错。」","「明天呢？」","「跟今天一样。」","没什么特别的用意。","她用这种随意的口气抛出了问题。换作是寒假前，在回答完之后就结束这话题根本无所谓。然而现在不同，我不认为这是毫无意义的问题。","我抢先一步告诉她。","「……我今天可不会让你住下来喔。」","「我又不是希望你让我留宿。」","她立刻否定我的话。这次换我要问她问题了。","「那你刚刚干嘛问那些问题？」","「只是觉得好像没其他人在家才问的。」","这样说完后，她用笔尖戳了戳我的考试题库。","「你没有哪里不懂吗？」","「有是有。」","「哪里？」","我知道仙台同学想要装傻带过这件事。","就算不是希望我能让她住下来，那些问题仍具有某种意义。然而即使不死心地追问她，我依旧不觉得她会说出正确答案，只能怀着想问清楚的烦闷心情，从题库中挑出不懂的部分告诉她。","这次她没有含糊其词，为我做了清楚明确的解说。","不像学校那样一下太冷一下太热的房间待起来很舒服，而且与其听老师那令人想睡的声音，听仙台同学的声音比较好。我不觉得念书有趣，但是找她来比独自念书更有效率。","我今天就是为此才找她过来的，所以只要能解开不懂的题目就好了。","尽管如此，我依旧很在意身旁，看向仙台同学。","她的长发垂在肩上，看起来很烦。","尽管是废话，不过我看不见平常总是能看见的优美颈部线条。","头发和高领毛衣都不是什么好东西。","「要看的话不要看我，看这边啦。」","仙台同学指着笔记本。","我依言望向笔记本后，她说了句：「有什么不懂的地方就问我。」开始念起自己的书。","房间突然安静下来。","默默地动笔好一段时间，我把手伸向玻璃杯，才发现原本冰凉的汽水已经不冰了。我看着玻璃杯，里头剩下的透明液体说多不多，说少不少。","我本想去一趟厨房，想想又算了。","视线从玻璃杯移到仙台同学身上。","总觉得她长长的头发和高领毛衣都很碍事。","我想看的东西被遮住了。","「干嘛？你想休息吗？」","大概是察觉到我的视线吧，仙台同学抬起头。","「要休息是可以。不过你时间上没问题吗？」","我继续看着她的脖子问她。","「还好。不然就休息一下？」","「先吃饭好了。仙台同学也要在这里吃吧？」","「我要吃。」","她阖上参考书，说：「要吃什么？」问起晚餐的内容。我没回答她的问题，朝着她被遮起来，看不到的脖子伸出手。","指尖碰到毛衣。","可是那只手马上就被仙台同学推了回来。","「你不是说要吃饭吗？」","「还是先休息一下好了。」","「想休息的话就乖乖休息啦……还是说宫城是想要『休息』？」","她加重语气强调的词汇，让人回想起暑假。","在去年的漫长假期中，休息除了原本「小憩片刻」的意思外，有了不同的含意。我们以休息这个词作为契机，持续做着不是朋友的行为。","「我没有要『休息』，只是看不到你的脖子，有点在意。」","冬天和夏天不同。","假期很短，离毕业也不远了。","我们必须准备好前往不同的世界。","「你想看的不是脖子，而是其他的东西吧？」","仙台同学嫌麻烦地说着，把整个身体转过来面向我，然后碰触我的头发，手指爬上我的脖子。","「——你既然知道，就让我看啊。」","感觉仙台同学真的很坏心眼。","明知道我想看什么，却故意不说出来。","也不把那东西拿给我看，反倒伸手过来碰我。","她的手指缓缓滑过我的脖子，感觉很痒。","我抓住她的手，想顺势把她拉过来，但她的手很快就溜掉了。","「我没说寒假期间会听你命令吧？说到底，你觉得我会没戴吊坠吗？」","「说不定没戴啊。」","「你多信任我一点啦。」","要是可以相信，我也想相信。","如此一来，就不用想着要确认了。","也不会想要用类似项圈的东西来系着她。","她却总是做些不值得信任的事，刻意藏起我就算亲眼看到也无法相信的东西，所以我才会怀疑她。","「……你今天是故意不让我看见的吧？」","我直盯着她被毛衣遮住的脖子。","「不是。你有这么想看喔？」","「我要是说想看，你就会给我看吗？」","对我的话起了反应的仙台同学粲然一笑。","「宫城遵守约定的话，我就让你看。」","「你说的约定是什么？」","「我可以吻你吧？」","说完后，还没得到我的同意，她就解开了我上衣的一颗扣子。","「咦？」","这出乎预料的行动，让我在抓住她解开扣子的手之前先出了声。","「干嘛？」","「我没说你可以解开我的扣子。」","我向自作主张的仙台同学抗议，她的手却不听话地又解开了一颗扣子，抚上我的锁骨。","「你想看吊坠的话就乖乖别动。」","「……你打算做什么？」","「我不是说了要吻你吗？」","她搬出我无法拒绝的约定。我们刚念完书，我没办法对事前讲好的吻开口说不。","指尖沿着脖子滑向后颈。","这只手虽然不在约定当中，可是在我开口抱怨之前，吻就落在了锁骨上面一点的位置。","这样的吻也算在约定范围里吗？","在我想着这个好像很重要，又好像不太重要的事情之际，她的嘴唇触碰我的脖子，唇瓣柔软地压上来，在不同的位置落下一吻。","触碰，离开。","嘴唇沿着脖子一路往上移动。","呼出的气息痒痒的，我的颈部肌肉紧绷起来。","唇瓣温热的触感让人仿佛无法呼吸。","我不知道这样做到底好不好，又觉得这还不到需要推开她的程度。","这或许也在约定的范围内，所以我无可奈何。","反复亲吻脖子的嘴唇用力抵在靠近耳朵的位置上，我不禁抓住仙台同学的手臂。可是她毫不犹豫地使劲，用力地吸吮我的皮肤。尽管不至于痛得要大声嚷嚷，感觉却像是被针给刺了一下。","我的指甲刺进仙台同学的手臂，藉此代替推她的肩膀，结果她咬了我的脖子一口，但嘴唇很快就离开，某个湿湿的东西贴上我的耳垂。那个比唇瓣更温暖的东西一定是舌头，顺着我耳朵的轮廓轻轻舔过。","身体犹如和贴在耳朵上的舌头起了连锁反应，我的心脏内侧开始躁动不安。仙台同学吸气吐气的声音听起来格外接近，仿佛与我心跳的节奏同步。","太过靠近的体温使我的呼吸变得急促，我试着调整呼吸。","配合吸气的时机，我一把推开仙台同学的肩膀。","「这根本不是吻嘛。」","「因为宫城没叫我住手啊。」","「又不是我没说就代表你可以这么做。真要说起来，你干嘛解开我的两颗扣子？就算不解开那么多颗扣子也亲得到啊。而且你绝对有留下痕迹吧？」","我伸手抚摸被她用力吸吮过的位置，可是指尖没有长眼睛，所以不知道那边现在到底怎么样了。","「我们那时候又没有讲好要吻哪里，所以不管吻哪里，你都不能抱怨。」","若无其事地说完后，她连同我的手一起按住了想必留有痕迹的位置。","挪动指尖触碰我的耳朵，用手指梳开我的头发。","然后理所当然地把脸凑了过来，于是我又推了她的肩膀一把。","「那边那张桌子上有镜子，帮我拿来啦。」","要把没指定接吻位置这件事当成我的疏失也行，但留下痕迹这事可不能就这样算了。她自己也说过好几次，叫我不要留下痕迹，所以既然做出这种会留下痕迹的行为，那我即使命令她也不为过。","「如果你是想看痕迹，我可以跟你说没有留下痕迹啦。」","「我自己看。」","我态度坚决地说完后，仙台同学才心不甘情不愿地拿了镜子过来。","她不是第一次吻我的脖子。","却从未用会留下痕迹的方式吻过我。","我的皮肤曾经因为被咬而泛红。","不过齿痕不到一天就消失了。","「拿去。」","我接过她递来的镜子，观察自己的脖子。","在脖子上看起来不需要解开扣子的位置，清楚地留下了红色的痕迹。那个位置非常巧妙，即使扣上所有上衣的扣子也遮不住，却又不至于太醒目。","「虽然留下了一点痕迹，但可以用头发遮住吧？」","她不负责任地说。","要说能不能用头发遮住，感觉是可以没错，然而没办法完全遮住。","她是故意的。","故意在看得见的地方留下痕迹。","「这位置或许不算太显眼，但绝对会被人看见啊。」","「没那回事，遮得住啦。」","仙台同学说着毫无根据的话，像是要证明自己说得没错般拨动我的头发，试图遮住痕迹。被发尾搔着脖子感觉很痒，我拍开她的手，把镜子塞给她。","「绝对遮不住。要是被人看见该怎么办？」","「反正学校放假，没差吧？」","「我家人可能会看见啊。」","「你不是说家人今天跟明天都会因为工作不在家吗？反正痕迹大概后天就会消失了，不会有事吧？」","原来是这样啊。","我现在总算知道她在开始念书前问那些问题的含意了。","「就算家人不在，我搞不好会跟朋友碰面啊。」","「是谁说这个时期大家都在忙着准备考试的？」","「……你说这种话很没品耶。」","「还比不上宫城。」","仙台同学露出灿烂的笑容，讲出过分的话。","然后抓住我的手臂。","「可以再吻你一次吗？」","就因为她说这种不像样的话说得很顺，我阻止了打算行使权力的她。","「不行。比起那个，让我看项链啦。」","这次换她该遵守跟我的约定了。我朝她伸出手，可是在碰到脖子之前，她就先把项链从毛衣里拉了出来。","〔本话含插图〕"]},{"t":"幕间　宫城又甜又痛","p":["不管距离寒假是近是远，离开宫城家之后，我的目的地便只有一个。","就算说「我回来了」也没人会回我「欢迎回来」的家。","我慢慢走回家，脱下鞋子，对着客厅说「我回来了」之后走上二楼，踏进自己的房间，开灯，拿衣架挂好大衣，把从宫城那里收到的五千圆放进存钱筒里。","我今天知道了两件原本不知道的事情。","一是世界上有种名为法奇软糖，甜到不行的点心。","直到今天在宫城的房间里吃到之前，我都不知道有这种东西。然后我不仅被她端点心出来这件事给吓了一跳，也被这点心的甜度吓了一跳。因为平常不会端点心出来的她，难得地端出法奇软糖这个我从没吃过的东西，甚至泡了红茶，害我紧张起来，觉得可能会发生什么不好的事情。况且正因为她还附赠了「喂我吃法奇软糖」这个服务，就算发生什么事情也不奇怪。","实际上发生的却是好事。","我本想拿起存钱筒，旋即作罢。","我已经没有再放五百圆硬币到这个要是存五百圆硬币进去，可以存到一百万的存钱筒里了。里头只有我在造访宫城家前存进去的五百圆硬币，以及从宫城那边收到的五千圆纸钞。因为逐渐增加的五千圆纸钞，不会让存钱筒变重到拿起来就能感受到的程度，所以拿起来也没有意义。","在这之后，我能再把「宫城的五千圆」存进存钱筒里的次数有限。一想到这点，我总觉得这个存钱筒今后也没机会变重到我拿起来就能感受到的程度。","要是我跟她见面的次数多到能改变重量——","倒不是想存五千圆，然而我想跟宫城见面到存钱筒会变重的程度。而且在高中毕业后，我也想和她见面。","我是这么想的。","「就快放寒假了啊……」","多亏我原本不知道，今天才得知的另一件事——「宫城不惜提出交换条件，也想在寒假跟我一起念书」，原本会夺走我和她见面机会的假期，变成能见到她的假期。而且这个寒假中没有五千圆存在，完全不会影响存钱筒的重量。","我在心中反刍她今天说的那句话。","『……寒假的时候来教我念书啦。』","她压低音量告诉我的，正是我想听到的话。明明只要一脸无趣地跟我说「你寒假也该来教我念书」就好了，她却拿「接吻」当成交换条件，要我寒假去教她念书。","其实我今天原本想说，如果她没有主动提起寒假的事，就只好由我来邀她一起念书，还好没开口。虽然总觉得她即使搬出接吻作为交换条件也要约我一起念书，却连说出她的志愿是哪所学校这么简单的事情都不愿意，让人很不满，不过我对今天的她没有什么不满之处。","我把化妆镜放到桌子上，坐到地板。","让脖子出现在镜面范围内。镜子倒映出宫城给我的吊坠链条，以及今天给我的另一个东西。","「会很显眼吗？」","我在她家没照镜子，所以不太清楚，不过脖子上留下了很难判断明天到底会不会消失的痕迹。","今天留在我身上的这个齿痕，犯人是宫城，原因则是我。","这是自作自受，我仗着她没有加以阻止就得寸进尺了。在比法奇软糖更甜的吻之后，我甚至解开了她衬衫上所有的扣子，连内衣背扣都解开，会被咬也是无可奈何的事。","可是我希望她能再多想一下。","咬在就算把衬衫扣子全部扣上也遮不住的地方，实在太过分了。如果是像今天这样走夜路回家还无所谓，但考虑到依旧得去学校就称不上好。我也想留下这个痕迹，以证明今天那个「难得一见的宫城」不是一场梦，但这个痕迹要是没有消失，明天在学校不知道会被人家说些什么。","「想消除吻痕的话，是要敷柠檬吗？」","我不知道要怎么消除齿痕，但倒是知道消除吻痕的办法。虽然不知道是真是假，但羽美奈说只要把柠檬片敷在吻痕上，就能消除吻痕。","发现宫城腿上有淤青之际，我们提过这件事，所以我记得很清楚。","当时宫城说要实验是不是真的能用柠檬消除吻痕，在我的手臂上留下了痕迹。结果因为没有柠檬，我到现在依旧不知道能不能拿它消除吻痕。","从那时候开始，她就只会做些出乎我预料的事。","「该怎么办才好呢？」","尽管没有开冰箱确认过，不过我们家现在应该跟宫城家一样，没有柠檬才对。由于也听说过可以用冰敷或热敷来消除吻痕，或许可以试试其中一种方法。","我让掌心贴着宫城留下的痕迹。","就这样用力按住。","虽然想要让掌心的温度转移到齿痕上，不过我的掌心好像没那么热。碰宫城的时候感觉更热。","我还想多触碰她。","要是能触碰映在我眼中的所有地方就好了。","如果能在被她抱住之前，确认到她胸部的触感就好了。","一旦我真的做了那种事，手掌下的齿痕或许会变得比现在更凄惨，别说齿痕了，搞不好会变成流血的伤口。但那样也好，假如受伤，就能请假不去上学，要宫城来探望我，然后和她接吻——","「……念书吧。」","我放下按着齿痕的手。","净想这种事情，会梦到宫城。","一如我梦到暑假最后一天触碰的宫城般，我会梦到今天的她，然后迎接一个不太好的早晨。我可不想拖着梦境去学校，无精打采地上课。","我收起化妆镜，换上家居服。","把参考书和笔记本放到桌上。","今天宫城没问我要不要吃晚餐，所以我还没吃饭，不过现在根本没心情准备。我也没有试着热敷或冰敷齿痕，那已经不重要了。","要是明天她留下的痕迹还在，只要找她抱怨就行了。只要把她叫到音乐准备室，抱怨一大堆就好了。要是她不来，去她家找她抱怨也行。","这可以拿来当作和她见面的藉口。","「……蠢死了。」","我在笔记本上画出一只背上长出面纸的鳄鱼，又在上面打了个叉。","无论是留下伤口而非痕迹的妄想，还是跑去找宫城抱怨的想像，全都是些无聊事。","今天发生太多稀奇的事情了。","让我的心静不下来。","「玩偶现在不晓得怎么样了？」","我当作耶诞礼物送给宫城的黑猫玩偶，现在或许也过着心神不定的夜晚。","我丢下笔，跳上床躺下。","接着闭上眼睛，用指尖触碰她留下的痕迹。","我在手机闹铃响起之前就醒了。","结果昨晚因为宫城，我念书根本念不进去，也没睡好。之所以没能熟睡是因为作了梦，那也是她的错。","梦里的我，做了昨天的我做不到的事。","我这个人实在差劲透了，","吐出体内的所有空气，我钻进被窝里。","不想从床上起来。","我用手掌按着宫城留下痕迹的位置。","不知道那个痕迹怎么样了？","真麻烦。","如果发现痕迹还清楚地留在脖子上，我会想请假，却不想待在家里。说是这样说，我也不能跷课在外面晃来晃去。痕迹要是消失就没事了，但会让人觉得昨天发生的「好事」全都像是一场谎言，变得很不安。","不管有没有消失，我都无法接受。","接下来该怎么办呢？","我一边在床上打滚一边思考，然而时间并不是无限的。手机的闹铃响起，我无可奈何地钻出被窝。","深吸一口气又吐出。","将化妆镜放到桌上，看宫城留下的痕迹。","「嗯～」","变淡了。","而且变淡了很多。","虽然看得出曾经有过痕迹，却已经淡化到不仔细瞧就看不出来的程度，所以不管被谁看见，都看不出是齿痕。假如说是被虫咬的，看起来也很像那么一回事。要是我说不知道为什么会有这个痕迹，感觉大家也只会说「确实会有这种情况呢～」就不当一回事了。","我松了一口气，又有点失望。","说穿了就是一个「不上不下的结果」。我其实该为痕迹变得不显眼这件事感到高兴才对，却没办法单纯地感到高兴。我抚摸着变淡的痕迹，走向一楼。","刷牙、吃早餐。","做好去上学的准备，换上制服。","站在镜子前面，试着把衬衫最上面的扣子也扣上。","果然还是没办法遮住宫城留下的痕迹。","可是不仔细看就不会发现。","我解开一颗扣子，踏出家门。","要是做了平常不会做的事情，反而会让不显眼的东西变得醒目，还是维持平常的样子最好。所以我用一如往常的步调，走在冬天冷得让人快要结冻的上学路上，一如往常地来到学校，穿过吵闹的走廊。宫城不在。我走上阶梯，接近目的地——三班的教室。路上没有和宫城擦身而过。因为教室也没远到需要走十分钟甚或二十分钟，转眼间便抵达了三班的教室。","踏进教室前，我摸了摸变淡的齿痕。","今天这里比起吊坠更令人在意。","那明明只是普通的痕迹，照理来说也不会痛，我却觉得好痛，不必要地去彰显这里有痕迹的事实。","宫城给我的全是一些不知道该如何处置的东西——没办法用掉的五千圆、犹如项圈的吊坠，除此之外还有其他有形的物体沉睡在我家。","今天则有这个「痕迹」紧紧跟着，创造出让我满脑子只想着她的时间。","我用指尖按住痕迹，走进教室，把书包放到自己的座位上，走去羽美奈和麻理子在的位置，开口说：「早安。」","「叶月，早安。」","麻理子充满活力地回应我，接在后面的是羽美奈低沉的一句：「早。」","「羽美奈无精打采的耶。」","正确来说，她的心情看起来非常差，感觉一早开始就很难搞。","「我打算在寒假去打工的事情曝光，被我父母骂了一顿。」","她以极为不高兴的口气说着。麻理子无奈地接着说下去。","「时间点太差了吧？大考前耶。你说对吧，叶月？」","「是啊。反正考完之后你想怎么打工都行，寒假先忍耐一下吧？」","「是这样没错啦……」","羽美奈用听起来就没打算接受的声音说。","她们两人虽然看着我，却没有注意到我脖子上的痕迹。我想羽美奈接下来也不会发现，麻理子也不会发现。换作宫城的话应该会发现，却不知道会不会在走廊上碰到她。她今天要是叫我过去，我就能确定会和她见面，可是她几乎不会连续两天叫我过去。而且才刚发生过那种事情，她应该不会叫我去她家。","我的手本想触碰痕迹，结果调整了一下领带。","寒假快到了。","希望宫城早点叫我过去。","我用力抓住一直想抬起来触摸齿痕的手臂。","〔本话含插图〕"]},{"t":"第6话　跟宫城见面的理由","p":["在那之后，我就没有机会再行使权力了。","在宫城没有再叫我过去的情况下，寒假来到了最后一天。","冬天的假期太短了，很无聊。","我不疾不徐地走在天色逐渐变暗的街上。","补习完之后应该要直接回家才对，我的脚却擅自朝着不是家的方向走去，意志不在大脑而在腿上。我在不清楚目的地的情况下继续往前走。","弯过几个街角，差点撞上看起来很怕冷的行人。","虽然很想装作不知道自己正朝哪里走去，然而看惯的街景让人再怎么不情愿，也知道自己的脚打算走去哪里。走了几十公尺，我来到当初忘记带钱包，宫城给了我五千圆的书店。","我在自动门好像会有反应，但又不会打开的位置陷入犹豫。","要走进去，还是就这样转身回家？","我的成绩没有危险到需要急急忙忙赶回家念书。","「……这么说来，我好像还没买。」","我想起自己还没买羽美奈平常在看的杂志。明天就开学了，杂志没买是无所谓，不过要配合她的话题，买了还是比较好，于是我走进书店。","在宽阔的店内绕了一圈。","我也不赶时间，不需要尽快买完杂志回家。我又在书店里绕了一圈，才慢吞吞地走向杂志柜。","「她不可能在吧？」","大约一年半前——","还是二年级生的我在这里遇见宫城，在她的房间里和她缔结了以五千圆作为交换，听从她命令的契约，直到现在还是会收下五千圆，听她的命令。尽管做过一些打破约定的事，但是我们的关系从那时候开始就没变过。","说是这样说，倒也不是完全没有改变。","同样有某些部分在发生过几件事之后产生了变化，我却感觉不到这段关系的根本部分有什么巨大的改变。","这个寒假也一样。","即使代价从五千圆变成接吻，我们依然是以某物作为交换，满足自己的欲望。我不认为彼此的关系有发生大幅转变。","我在摆放杂志的书柜前停下了脚步，从封面上排列着各种浮夸文字的杂志当中拿起其中一本。","我快速地翻动书页，又把杂志放回原处。","反复做了几次同样的事情之后，我拿着羽美奈每个月都会买的杂志走向收银台。","钱包在书包里。","没有人从背后掏出五千圆钞票来帮我结帐。我自己付了钱，接过装有杂志的袋子。","看了看手机，发现没经过多少时间。","脚擅自朝着陈列漫画的书柜走去。","我漫步前行，来到塞满漫画的书柜附近后，熟悉的背影映入眼帘。虽然对方穿着我没看过的大衣，围着平常不会围的围巾，但那毫无疑问是宫城。","——我刚才特地绕了两圈，明明都没看到她。","她正在确认新书，没注意到我。","我跟踏进这间书店时一样陷入犹豫。","我不是因为想见她才来书店的。但要是向她搭话，感觉她会认为我根本就是为了见她，才会出现在这里。","偶然。","碰巧。","不是故意的。","我只是来买杂志，发现宫城也在而已。","我在心中列出好几条藉口，用力握紧装着杂志的袋子。虽然不是为了见她而来，但我确实想过她有可能会在。","我不太满意彼此现在的关系。","不像这样找一堆藉口，就不能找她说话——这个状况就让人很不满。尽管不清楚跟我的心境是否一样，但她看起来也不太满意现在的关系，否则不会想要跟我一起睡，或是三不五时便想确认我有没有戴着吊坠。假如维持跟过去一样就好，她也不会说出要我寒假去教她念书、允许我在她家留宿这些话来。","我轻轻吸了一口气。","「宫城。」","我用不至于干扰到店里其他客人挑选书籍的音量叫她。","可是她没有转头看我。","反应看起来像是有听见却刻意无视，也有可能单纯只是声音太小声，她没听到。","我的腿差点动起来，想要直接转身离去。","而我对做出这种反应的自己，以及没回头的宫城都很失望。","我知道能祛除内心不满的方法。","只要稍微改变彼此的约定就行了。","比方说，在学校也可以找对方说话。","比方说，假日也可以见面。","比方说，让我们成为朋友。","此外还有很多可以改变的事情，我却没有勇气做出选择，大幅度地改变约定。唯一有的勇气，只够我再叫一次宫城而已。","「宫城。」","以比刚才略大的音量出声呼唤后，她转过头来叫我：「仙台同学。」","「你来买漫画？」","我站到她身旁，看向她拿在手里的书。","「嗯。仙台同学呢？」","「我来买平常会买的杂志。」","我提起左手上的袋子给她看，她回了句：「这样啊。」对话便中断了。她走到离我几步远的位置，拿起几本漫画。比起她手中的漫画，我的眼睛更专注于遮住她脖子的围巾。","「那我要去结帐了。」","宫城讲得像是在说要先回家了一样，迈步前进。","我默默地跟在她身后。","「……仙台同学，我买完这个就要回家了。」","她停下脚步。","「嗯。」","「你为什么要跟着我？」","「因为你没说再见。」","我知道她想抛下我回家，却没有说出道别的话。","「再见。」","她说完后便走了出去。","我又跟在她后面","这次她什么都没说。","结完帐的她接下装了漫画的袋子，头也不回地踏出书店。我一步一步地跟在身后，传来她冷淡的声音。","「不要跟着我啦。」","「为什么？」","我询问只愿意对我展现背影的宫城。","「我不想让其他人看到我跟你走在一起。」","「不会那么容易就碰到认识的人啦。」","「我们暑假一起出去的时候，就被茨木同学看到了吧？」","「有这回事吗？」","这件事清楚地残留在记忆当中，我却故意不承认。","正如她所言，羽美奈曾看到为了玩假扮朋友游戏而一起出去玩的我们。可是今天未必会发生同样的事。","「仙台同学绝对还记得吧？你最好改掉这种马上就随口乱说话的习惯。」","「宫城太在意小细节了，凡事大概就好了啦。再说羽美奈根本不会出现在这种地方。」","「她搞不好会跑来这附近啊。」","「我想羽美奈应该在家。而且只是一起走一小段路而已，没差吧？」","「……一小段？」","她突然停下脚步，转过头来。","「一小段。」","「……只有一小段路的话，是可以啦。」","尽管不到非常乐意，但声音听起来并不排斥。我一边说：「那就走到那边为止。」一边往前走了三步，来到宫城身旁。","「仙台同学说的那边是指哪边啊？」","「那边就是那边啊。」","我根本没决定好那边是哪边，所以其实不晓得。","她也没再继续追问下去。","我们两个就这样往前走。我拉了拉从在书店时就很在意的宫城的围巾。","「你居然围围巾，很稀奇耶？」","「才不稀奇，今天很冷啊。」","今天的气温确实比平常还低，呼出的气息化为白雾。","可是就连冷到感觉会下雪的日子，她都没有围上围巾。我记忆中的她虽然曾穿过暖和的大衣，但是没有围围巾，即使冷到发抖也没有。所以「很冷」不足以构成她围围巾的理由。","「借我一下。」","我又拉了拉围巾。","她不会没来由地去做平常不会做的事。","「不要。」","「又没关系。」","「你这样拉我很难受耶。」","宫城烦躁地说，推了我的肩膀一把。见我即使如此依旧不肯放开围巾，她停下脚步，仿佛要将这座城镇的万物全都染白般，大叹了一口气。","「我来解开围巾，你放手啦。」","我乖乖地顺着她嫌麻烦的语气松手，接着她马上就解下了围巾递给我。","「……你为什么要围围巾？」","我紧盯着从围巾底下现身的高领毛衣。","「不就说了是因为很冷吗？」","「我觉得你是想遮起来。」","这样太犯规了。","平常不围围巾的她围上围巾的理由……","是为了遮住我几天前留下的吻痕。我本来想说要是没有围巾，就能看到那个现在说不定还在的痕迹了。","「已经消失了。」","一如我没说宫城想遮住什么，她也没说消失的是什么。","「真的吗？」","「真的。」","「让我看啦。」","「不要。」","她比冬天的风还冰冷的声音传入耳中，围巾从我的手中消失。她把装有漫画的袋子塞给我，重新围上围巾。然后一把将袋子抢了回去，慢慢往前走。","我们沿着我还是二年级生时，第一次和宫城一起走的路前进。","那时候沉默不语的她现在也没说话。可是和那时候不一样，我现在并不在意沉默，也不觉得刚才要是直接回家就好了。","「仙台同学打算跟我跟到什么时候？你家不在这边吧？」","听见她不满的语气，我就知道她心里想的跟我不一样了。","「我不是说了要一起走到那边吗？」","「已经到那边了。拜拜，再见。」","她随着白色的气息吐出带刺的话语。","「等一下啦。」","宫城逃也似的企图离开现场。我抓住她的手臂。","「我不等。放开我啦。」","「想要我放开你，就让我看你的脖子。」","「我不是已经说不要了吗？」","「我想看。让我看啦。」","如果已经消失了，我想再留下一次。","这次要让那个痕迹维持更久。","在学校也会被人看见。","「我绝对不要。」","宫城拍打我抓住她手臂的手。","「小气。又不是叫你脱衣服，有什么关系？」","我无可奈何地松手，心里却仍难以接受，开口抱怨起来。","「你要是在这种地方叫我脱衣服，那已经不是变态可以形容，就算被逮捕也不为过吧？不如说我帮你报警，你干脆跟警察走好了？」","「你真的很过分耶。」","无论痕迹还在不在，我们都不会改变。我知道这点小事不会改变彼此现在的关系，但依然会想，要是有什么东西发生变化就好了。不然这样下去，就算宫城跟宇都宫考上了同一所大学，她也不会跟我见面。","「仙台同学，我真的要回去了，你不要跟上来。」","「好啦。再见。」","我明明还有其他更该说的话，从嘴里说出来的话却只有这些。","「那就这样。」","宫城没说再见地挥了挥手。","我挥手回应之后，她便朝着回家的方向走了出去。","「给你。」","走进玄关后，她立刻递出五千圆给我。","寒假结束，我们以接吻为代价的关系也结束了。既然如此，便只能回到有五千圆介于我们之间的关系。","「谢谢。」","我向她道谢，捏住她递出的纸钞边缘，轻轻拉动纸钞，有种被捏住抽不动的感觉。但是稍稍施力后，五千圆纸钞很快就来到了我的手里。","我因为这张不像平常一样顺利落入手里的五千圆纸钞，叫了她的名字。","「宫城？」","「没事。」","声音听起来就是有事的样子。","她的心情从见面的瞬间开始就很糟。","然而我的心情也没多好。我原本就觉得寒假结束后她不会马上叫我过来，却没想到新学期开始都将近一周了，她还不叫我来。","「你会不会太晚才叫我过来了？」","「我什么时候叫你都没差吧？」","「的确没差，但不好。」","要是她就这样一直没叫我来，我就会在没和她见面的状况下迎接大考。","考试日期便是如此迫在眉睫。","这个时期我们都得专心处理自己的事。我在她没有叫我过来的这段时间好好念了书，这点倒是很感谢她，也觉得即使考前没跟她见面也无妨。可是这样很没意思。","而她当然也没有搬出「因为接近大考了」或「想专心念书」这些「不叫我过来的理由」联络我。","我真的觉得宫城这个人很没意思。","「我是顾虑到快接近大考了才没叫你过来的，你该感谢我。」","她讲得一副有恩于我的样子，走进房间。","「我又没拜托你顾虑这些。」","我俐落地关上门，脱下制服外套，解开衬衫从上面数来的第二颗扣子。在一如往常的位置坐下后，宫城来到我身旁。我的眼睛擅自看向她的脖子，衬衫连最上面那颗扣子都扣得好好的，脖子上看不见痕迹。","这是理所当然的。","在那之后已经过了一段不短的时间。","倘若仍留有痕迹，就表示那不是我留下的，而是其他人在她身上留下的痕迹。所以看到这个连一点伤痕都没有的脖子，应该感到开心才对，我却有些失望。","我将手伸向她的脖子。","然而在即将碰到之际，她站了起来。","「我去拿喝的过来。」","「我不用喝东西。」","「仙台同学不用，但我要啊。」","以不带起伏的语气说完后，宫城走出房间。独自留在房间里的我将参考书和题库排放在桌上，随即趴在这些书上面。","考完几个大学入学需要的考试后，约好的毕业典礼马上就要到来了。","我们所剩的时间不多。","「仙台同学在做什么？」","看来是在我毫无察觉的情况下回来了吧？从很近的位置传来宫城的声音。","「睡眠学习。」","「可是你醒着耶？」","「我在睡觉。」","我仍旧趴在桌上回答她。而她只冷冰冰地回了我一句：「碍事。」感受到她从侧边推开我的身体，我抬起头，只见参考书的另一边放着麦茶和汽水。我喝了一口麦茶后问她。","「你觉得考得上大学吗？」","「仙台同学呢？」","「我想应该没问题吧。」","考高中时，我没能考上父母期望的高中。","考大学时，我也上不了父母期望的大学。","而我依据现况选出的大学和父母的期望不同，但对学力仍有一定程度的要求。尽管补习班老师说我考得上，但要说心中没有丝毫不安，那是骗人的。","这个世界上没有绝对。","可是事到如今才来唉声叹气也无济于事，不如尽力去做自己能做的事。假如没考上第一志愿，还有其他用来避免落榜的备案——除了抱着这样的想法去努力外，我也别无他法了。","「宫城呢？」","「总会考上某一所大学吧。」","「都到这个时候了，你会不会太随便了啊？」","「毕竟我没什么信心啊。」","宫城说得很不可靠。","这样我很伤脑筋。","她一定要考上志愿才行。","要是没考上，她就会留在这里。","而就算她留下来，我也会离开这里。毕竟即使都没考上，我也打算去上不在这里的补习班，我们的未来将不再有交集。","「你有好好念书，更有自信一点啦。」","一旦说出没信心这种话，感觉能考上的学校都会考不上。虽然不知道宫城报考了哪几所大学，但要是跟宇都宫上同一所大学的选项消失就麻烦了。我希望她能用全都要考上的气势去考试。","「我又不喜欢念书。」","「你说这种话感觉会考不上啊，说点更积极正面的话啦。」","「办不到。是说你既然这么担心，就赶快开始念书啊。」","「嗯～你先下个什么命令啦。我现在没那个心情。」","总觉得很久没说出命令这个词了。","「先念书。大考快到了耶。」","她难得说出这种认真的话，握起笔，视线落在题库上。但我不想像她那样盯着题库，有太多在意的事情，想重新整理一下心情。","「先命令完再开始念书也行吧？反正迟早都得做点什么，做完之后反而比较能静下心来念书啊。」","「那告诉我一定能考上的方法。」","「真有那种方法的话，我才想知道呢。下个更实际的命令啦。」","「既然仙台同学这样说，那就自己想命令的内容啊。」","宫城从题库上抬起头，看似嫌麻烦地说着。","「我来想？」","「对，自己决定希望我命令你做什么。」","「要我想一个自己非做不可的命令，这会不会太奇怪了？」","我的确很习惯听从命令，却不习惯去思考命令，而且还是要我去想自己得服从的命令，搞得像是我有什么特殊癖好一样，让人很难接受。","「你觉得奇怪就先念书。反正在念完书之前，我会想一下要下什么命令。」","「……我现在想。」","她的提案实在太随便了。","不过这样总比她对我下一些太过火的命令来得好。","我望着冒汗的玻璃杯，一边思考。","她应该会接受，又安全的命令。","我运转着脑子，思考是否有这样的命令，视线同时离开装了麦茶的杯子。","题库。","橡皮擦。","铅笔盒。","握着笔的手。","我的视线停在这里。","「我决定好了。」","「是什么？」","「命令我帮你施个幸运魔法啦。」","我对宫城微笑，她却皱起了眉头。","大概是在想「幸运魔法」是怎样的东西吧？不过那就跟没有解答的问题一样，她不管再怎么想都不可能想出来。","「……帮我施个幸运魔法。」","认真思考了大约十秒之后，她像是死了心地说出命令。","「那这个借我一下。」","我这么说着，从她手上抽走握着的笔。","然而需要的东西不是笔，所以我把它放到桌上。她明显地有所防备。我抓住她的手腕，把她的手指凑到嘴边。轻轻吻了她的指甲前端后，被我抓着的手僵住了。","「这是可以写出正确答案的幸运魔法。你刚才叫我告诉你一定能考上的方法吧？」","为了不让她的手溜掉，我简单做了说明。","「我从来没听过这种幸运魔法。」","「单纯是你不知道而已吧？」","我在抓着她手腕的手上施力，拉向自己，然后吻上至今为止碰过我好几次的手。","手背。","指根的关节上方。","中指的正中间。","反复落下好几个吻后，她的手放松下来。","我不会对其他任何人做用嘴唇触碰他人身体的一部分这种事，只会对宫城这么做。比起用手触碰，这样更能贴近地感受到她的体温，很舒服。","我用足以感受到手背骨头触感的力道，用力地把嘴唇抵上去，轻轻吸吮。她的手想要溜走，所以我在最后吻了她的指尖，放开她的手腕。","「……这是仙台同学乱诌出来的幸运魔法吧？」","她以不管从哪个角度看都很不高兴的表情表示，看着指尖。","「就算只是乱诌的，只要有效就没问题了吧？」","其实同样是吻，我比较想吻在宫城的脖子上，留下看得见的痕迹，可是一旦做了那种事，肯定会被她赶出房间。而且她搞不好这辈子都不会再跟我说话了。","「感觉就没效。」","听见她冷淡的语气，我又再度握住她的手。","「有啦。」","说出毫无根据的话之后，我吻了她的指尖，然后将她的食指含入口中，轻咬关节，再用舌头压上指腹，顺势缓缓地滑过她的手指。这时她生气地拔出了手指。","「住手啦。」","「为什么？宫城喜欢这种的吧？」","尽管声音带刺，然而即使抓着她的手，她也没有抵抗。","我以前曾被她命令，舔过她的手指好几次。事到如今才想抵抗，我怎么可能会放过她？","我看着她。","她不肯对上我的视线，不过看起来不像生气到想赶我出去的样子。我把唇瓣贴上她的掌心——她的手臂惊讶地抖了一下——让舌头滑入她的指缝间。","「仙台同学！」","宫城难得大声地说，拍打我的手臂，用指甲抓我的制服。我因为闷痛而松手后，她从鳄鱼背上抽出面纸，擦干濡湿的手指。","我已经看过这幅景象很多次了。之前都不当一回事，今天却觉得她像是用面纸抹去我的存在，看了很烦。","说得更直白一点是很不爽。","我伸手触碰她的脖子，她微微往后退。我现在连这种小事都无法容忍，一把抱住她，以嘴唇触碰她的脸颊。","她绝对会抵抗——","我原本是这样想的，她却用手环抱住我的背。","身体超乎必要地紧密贴合。","「……宫城？」","她没回答。相对地，耳朵上感觉到她呼出的气息，坚硬的东西碰了上来。我马上意识到那是牙齿，想像得到接下来会发生什么事，可是还来不及和她拉开距离，耳朵就被咬了。","「好痛！」","我不禁喊痛，她却不肯松口，不仅如此，甚至咬得更用力，痛到我觉得耳朵都快被她咬下来了。抓住肩膀推开她后，她不高兴地开口。","「仙台同学是怎样？」","「那是我要说的话吧？你不要一不高兴就咬人啦，真的很痛耶。」","「谁教你要做奇怪的事？」","我不知道宫城所说的「奇怪的事」是指我舔她的手还是抱住她，总之她不太满意。","「即使如此，也不该狠狠咬我吧？」","「这根本不是什么幸运魔法。」","「是幸运魔法啊。而且是宫城自己叫我想命令内容的耶。」","追根究柢，是不肯自己想命令的她不对。","或许她本人也这么想吧，因此没有反驳我，气呼呼地闷不作声。","「你有什么想说的？」","我这样问她。她握起放在桌上的笔。","「要是没考上，我一定会恨死你。我可不想再念书一年准备重考。」","「那我再帮你施一次幸运魔法吧？」","「免了。」","她没看我，视线落在笔记本上。","却没有在纯白的笔记本写上任何文字。","「宫城。」","「干嘛？」","「你要认真考试喔。」","「不用你说我也会认真考。」","宫城头也不抬地说。","以随随便便的幸运魔法当作代价，换取「绝对要考上」这种话未免太沉重了，我说不出口。尽管如此，我还是希望她能考上。","接近放学时间，教室里的大家都静不下心来。","班会时间就像是早已分出胜负的消化比赛，老师看起来也很没干劲。我的视线从正在寻找该用什么话来为今天做个总结的老师，移到羽美奈身上。","相当于共通入学考的考试平安结束了。","我不知道这话有几分可信度，不过羽美奈说她写起来轻轻松松，麻理子也笑着说感觉考得还可以。而我虽然不敢说绝对没问题，却也觉得自己考得还不错。","却不知道宫城考得如何。","我在施了幸运魔法的那天之后就没再和她碰面，也没有联络，所以无从得知。一般来说这种时候多半会和朋友联络一下，说自己考得还不错或是考得很差，然而我们并非那样的关系。她对是一起念书的伙伴但并非朋友的我十分无情。","我将视线拉回黑板前。","老师环顾整间教室，把没那么重要的事情说得像是个大问题后，结束了班会时间。教室很快地变得吵闹起来，来到了放学时间。","「叶月，我今天有个想去的地方，陪我去啦。」","听见羽美奈的声音，我犹豫着该如何回答。","尽管我跟着站了起来，却没办法立刻说出「好啊」。","「咦，你该不会有事吧？」","羽美奈把书包放到我的桌子上问我，不过脸色看起来不太好。","就算慢了一拍，我也应该赶快回答「我没事，可以去」才对。即使当高中生的时间已经所剩无几，还是别惹羽美奈不高兴比较好。","我扬起嘴角，挤出笑容。","正打算说出「我没事，可以去」来安抚快要不高兴起来的羽美奈时，旁边传来了麻理子的声音。","「今天就我们两个去嘛。」","「啥～」","
