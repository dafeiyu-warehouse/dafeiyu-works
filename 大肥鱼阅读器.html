也是有可能发生的事，明明要去同一个地方却分头行动也很麻烦。","「可以啊，没关系。」","我简短回答后，宫城仍不死心。","「妳先告诉我地址，我们就可以分头过去了。这样比较好吧？」","我不知道她是在为我着想，还是单纯不想被她的朋友看到她跟我在一起的场面，但她正在为了不想跟我一起去而闹别扭。","「那样很麻烦，一起过去就好了吧？要是宫城妳迷路了，我也很伤脑筋啊。」","「有地图我就不会迷路。我会用手机开导航。我没有路痴到这样还会迷路的程度。」","「就算是这样，我还是会跟妳一起去。反正从这里过去也没多远，就算我们走在一起，路上也不会遇到任何人吧？」","至今为止，我在家附近遇过的熟面孔也就只有宫城。即使是她的朋友，我们应该也不会在路上遇到吧？","我收拾好桌上的东西，抓住宫城的手腕，然后拖着她走出了房间。","「要走大概二十分钟喔，可以吗？」","我一边在玄关穿鞋一边问她。","「好远。」","「很近啦。」","走快一点的话十五分钟就能走到了，没那么远。","我们搭上电梯，移动到大厅。踏出住宅大楼，慢慢往前走之后，宫城过一会儿也跟了上来。我停下脚步，等她跟上。","「途中可以绕去便利商店一下吗？」","我问走到我身旁的宫城。","「可以啊。」","「那走吧。」","我配合著宫城的步调朝家里前进，免得走太快把她抛在后头。","两个人一起走在我平常独自走的路上虽然有股新鲜感，但是并不开心。不用想也知道目的地很糟。对我来说没有比暑假期间的自己家更糟的地方了。","我们就这样慢慢地走了一阵子。","途中绕去了离我家约五分钟路程的便利商店，买了瓶装绿茶和汽水。","我会绕路过去的理由很单纯。","我不想让家人知道我带了人回家。","我不想让家人看到我拿着两人份的玻璃杯。","可是走完这段没什么遮蔽物的路，我还是得拿点茶水招待宫城才行。","我就只是因为这样的理由，拿着便利商店的提袋。","「在这里。」","我在觉得吸了汗水的T恤贴在背上很不舒服的同时，在自己家前面停下了脚步。看向宫城，只见她什么都没说，用看着什么稀有东西的眼神望着我平凡无奇的家。","我从书包里拿出钥匙。","然而在我用钥匙开门前，大门就打开了。","时机不好。","运气不好。","日子不好。","我不知道哪个才对，但是母亲表情冷漠地从玄关走了出来。我家这个目的地果然不是什么好地方。","「午安。」","宫城发出了与平常不同，一听就知道她很紧张的声音，低头行了个礼。","这种时候如果是一般的母亲，应该会回一句「午安」问候对方，说些「妳们慢慢玩」之类的话吧？可是我母亲什么都没说，只有形式上对宫城点头致意了一下，就从我们面前走了过去。","尽管我觉得这样对打了招呼的宫城很过意不去，却什么都做不到。","「抱歉，妳别在意。」","我目送母亲的背影离去后向宫城道歉，她一脸不知所措地点了点头。","说不定会撞见我父母。","我虽然有想过这个可能性，但没想到真的会撞见，害我忍不住想对说要来我家的宫城抱怨个两句。但那不过是在迁怒，而且是我决定要带她过来的。","「进来吧。」","我在气氛变沉重前打开了玄关的大门，一道微弱的声音追在我身后。","「打扰了。」","我们两人脱了鞋子走上楼梯，在并列于走廊上的两扇门前停下脚步。","「妳等我一下，我先进去收拾房间。」","「妳是房间里乱成一团的那种人吗？」","「不是，但还是想收一下。」","我没那么喜欢打扫，不过我的房间也不乱。尽管如此，要让宫城踏进我没预料到会有人要来的房间里，我还是想先检查一下。","我让宫城等在门外，进了房间。","我关上房门，视线看向书架和床铺，这时我看到了放在五斗柜上的存钱筒。","那里头装了我从宫城那里收到的五千圆纸钞。虽然这不是什么被她看到会出问题的东西，但考虑到内容物，我还是不想让她看到。","总之我打开了空调，从袋子里拿出宝特瓶放在桌上，接着把存钱筒收进了衣柜里。我再度环视房内一周后，开门请宫城进来房里。","「妳随便坐。」","「妳房间很大耶。」","走进房里的宫城这么说，坐到床上。","「宫城妳房间也很大啊。」","我的房间是满大的，不过应该还是宫城的房间比较大。","「刚才那是妳妈妈？」","宫城没看我，一边看着房间一边说。","「对。」","「那没其他人在家了吗？」","真麻烦。","让人踏进自己的私人领域，会伴随而来的各种问题。","尽管我是在明知这很烦人的前提下叫了宫城过来，但还是冒出了这果然很麻烦，以及我都没问宫城这些问题，她干嘛问我之类的想法。","所以我才讨厌。","我觉得这样的自己也很烦，于是忽视宫城的话，把手伸向桌上，拿起装有汽水的宝特瓶递给宫城后，背靠着床坐在地板上。我打开瓶装绿茶的盖子，这时宫城像是在催促我地叫了声：「仙台同学。」","「我想应该有人在吧？」","我没看向不死心地要我回答的宫城，随口答道。","「妳说有人在，是谁在？」","宫城简直就像在自己的房间里一样坐在我的床上，但她或许是静不下心来吧，前后摆动着双腿。","「一个聪明能干的姐姐。」","正在念大学的姐姐开始放暑假后马上就回来了。我今天虽然没看见她，不过她应该在房间里。","「在隔壁房间？」","「对。」","「妳们年纪差几岁？」","我知道宫城没有恶意。比起想问这些问题，她应该只是下意识地说出正好想到的事情，想填满我们之间的沉默罢了。但这些都不是什么好问题。","「宫城妳很啰唆耶。」","我喝了一口绿茶，把宝特瓶放回桌上。接着转身面向宫城，抓住她正在摆动的右脚。她从短裤下伸出的腿连膝盖都暴露在外，我吻了上去，然后顺势让舌头爬上她的肌肤。","「我没有叫妳做这种事。」","我装作没听到，褪去她的袜子。","才刚打开的空调还没发挥作用。","可能是因为很热吧，我可以若无其事地做出没被命令的事。我将舌头贴上她的脚背，一路舔到脚踝处，她柔软的肌肤比平常更湿润，有汗水的味道。","「别舔了啦。」","宫城语气强硬地说，用宝特瓶推我的头。我一把抢走冰凉的宝特瓶，放到地板上。我抚摸她的小腿肚，温柔地吻上她的胫骨后，头上又传来了她的抗议声。","「我又没命令妳舔我的脚。」","「妳等等就会命令我了吧？」","「才不会。放开我的脚。」","「我不要。」","宫城明明可以补上一句「这是命令」，却只叫我放开她，没说这是命令，也没做出明显的抵抗。只不过是请求的话语不足以制止我的行为，我用力抓住她的脚踝，咬了她的脚拇趾。","「仙台同学，这样很痛。」","宫城还是一样很啰唆，但没有再问多余的事了。她没踢我，也没下命令叫我住手。","做着这种事的时候，我总会觉得，我跟宫城好像都很期望可以这么做。","比起她追问我一些无聊事好多了。","原本只是这样的行为感觉快被不同的行为给取代，于是我又更用力地咬了她的脚拇指。","「就说很痛了。」","她的音量出乎我预料地大声，让我松了口。","「妳不要那么大声啦。隔壁会听到。」","我们家的墙壁是没那么薄，这也不是隔壁能听到的音量，可是这内容被人听到我会很困扰，所以才先警告她。","「那都要怪仙台同学吧？妳别这样我就不会叫了。」","「那妳命令我做点什么啊。」","我看着宫城这么说之后，她用不高兴的眼神盯着我。然而她什么都没说，所以我的舌头再度攀上刚才留下的齿痕，嘴唇又贴上了她的脚背好几次。我用指尖抚摸她的脚跟，从脚踝开始，舔着她胫骨上的皮肤。她没有开口抱怨。我一边感觉着皮肤下的硬物，一边让舌头滑过她的肌肤，吻了她的膝盖下方后，宫城抽回了腿。","「过来这里。」","我听见她细小的声音。","「这是命令？」","「对。」","我照宫城所说的坐到她身旁看着她后，她的指尖碰了我的嘴唇。然而沿着我的嘴唇轮廓轻轻摸过之后，她马上就想收手了。我抓住她的手。","我不知道她犹豫着要不要碰我的理由是什么，但我不喜欢这样的宫城。","「妳还有其他想命令我做的事吧？说出来啊。」","「妳放手的话我就说。」","「好。」","我放开她的手之后，宫城缩回手臂。然后她稍微迟疑了一下，食指又慢慢地碰了我的嘴唇。","「……舔我的手指。」","我想这一定不是她真正想命令我做的事。不过我什么都没问，伸出舌头舔上宫城的指尖后，她把手指塞进了我的嘴里。她的指尖接触到我的舌头，我轻轻咬着手指第二关节附近的位置，让舌头缠上企图探索我口腔内部的手指后，手指的动作停了下来。柔软的舌头抵上手指，缓缓滑过。她的手指舔起来当然不美味，却也不难吃。只是在我继续用舌头舔舐后，宫城抽出了手指。","她没有取消要我舔她手指的命令。","我追着她的动作凑上前去，舔舐她的指尖，舌头抵着她的肌肤，一路舔舐到指根处。嘴唇吻上她的手背，从手腕开始缓慢又轻柔地往上舔过去。","「妳这样舔感觉很不舒服。」","宫城虽然这样说，想把手抽走，我却吻了上去，舌尖用力抵着她的肌肤。","「仙台同学！」","她在出声的同时硬是把手抽走。","「我不是叫妳不要那么大声吗？妳忘了？」","我反问她。宫城不悦地回我说：「我才没有大声。」想要站起来，我抓住她的手臂。","只要我一大意，宫城就会试图逃离我。","而我的任务就是要抓住逃走的宫城。","今天也一样。","我把宫城推倒在床上，让她哪里都去不了。","「让开。」","虽然这是理所当然的反应，不过宫城生气地说。","「我不要。」","「妳不让开就拿卫生纸给我。我想擦手指。」","「妳安静一下啦。」","脑中浮现出用吻来堵住她的嘴这种愚蠢的想法，马上被我甩开了。我被宫城在看的那些漫画给带坏了。不过那也证明了我去过她家好几次，看过好几次她买的书，让我忍不住想叹气。","如果是在一年前，我绝对不会有这种念头，也不会推倒宫城。真要说起来，平常会推倒人的一直都是宫城，不是我。","「妳做这种事，不算违反规则吗？」","宫城又开始说些烦人的话。","我在她开口说下一句话之前，咬上了她的脖子。","我用力一咬，原本想开口抗议的宫城静了下来。","但那也只维持了非常短暂的时间，她马上又开始吵闹起来。","「仙台同学，这样很痛。」","她推着我的肩膀出声抗议，但我没有松口。","「我不就说很痛了吗？别咬我啦。」","「宫城妳还不是会做这种事。」","我抬起头，看着宫城的脖子。","被我咬的地方红了起来，尽管对她很抱歉，可是宫城也不对啊。就算位置不一样，她之前也对我做过好几次类似的事。虽然我也做过，宫城却不懂得适可而止，所以她比较过分。","每当痛楚和痕迹增加，我想着宫城的时间也会随着增加。","要是宫城也能多少体会一下我的心情就好了。","「……是没错。」","宫城不干不脆地说，用手按住脖子。","可能还会痛吧，她动手摩挲着那里。","我在她身旁躺下。","和宫城两个人躺在床上。","之前也有过这样的情境，不过那是在宫城家。宫城躺在我的床上，感觉很奇妙。","「仙台同学，很挤耶。」","宫城的语气中满是不悦，在说话的同时用力地推我。","「这是我的床。不要推我，会痛。」","「我才痛好不好？」","宫城这样说完后，爬起来踢了我的腿。","「我知道。」","毕竟宫城曾在我身上留下过好几次痕迹，也咬过我。我最清楚那究竟有多痛。","我基本上还是满后悔的。","我明明不是为了做这种事才让她进我房间的，事情却演变成这个样子。要是以后的我想起宫城曾待在这张床上的事，一定会诅咒现在的我。","「下星期开始认真念书吧。」","我面对奇怪的方向，犹如要修复感情地般对宫城说。她也悄悄地回我一句：「我觉得那样比较好。」","〔本话含插图〕"]},{"t":"第5话　暑假期间的仙台同学很不讲理","p":["我送妳到半路上。","我一说要回家，仙台同学就开口这样说，我拒绝了她。外面天色还很亮，我也记得路，所以没道理要让她送我。就算一起走在路上，我跟她也无话可说。","我们前往仙台同学家的路上也几乎没说话。","一个人回去心情会比较轻松。","而且想到今天发生的事，我就觉得很尴尬。","所以我说了好几次我要自己回去，然而不知道为什么，我拖着沉默的气氛，和仙台同学走在回去的路上。","明明怕热还硬要出来。","我不知道我何时失去了她突然给我的命令权。她无视我说这是命令的话，选择跟我一同踏出家门。","我用走在身旁的仙台同学听不到的音量，轻轻叹了口气。","我会要仙台同学带我去她家，是因为她实在太恣意妄为了。","她一副既然是暑假，她想做什么都可以的样子，未经我同意就新增规则，做她想做的事。我想说既然这样，我也可以给她出个难题才对，才会命令她带我去我连在哪里都不知道的她房间。","仙台同学都是在怎样的房间里生活的呢？","我也是有一点点感兴趣。","反正她一定会拒绝我。","我很后悔自己抱着这种想法，随意下了那样的命令。","在我今天所看见的事物当中，有仙台同学不想让人看见的事。那是她一直隐瞒着，往后应该也会继续隐瞒下去的事。","仙台同学感觉就是个受到家人宠爱的孩子。","我原本对她有着这样的印象，可是那样的仙台同学只存在于我的想像中。毕竟我们在玄关碰巧遇见她妈妈时，她妈妈连看都不看女儿一眼就出门了，仙台同学脸上的表情也很复杂。","马上就感觉得出她们关系不太好的气氛。","那样的气氛确实存在于她们之间。","我搞砸了。","虽说是为了避免沉默，但我觉得我今天说太多话了。结果就是那样。","现在仙台同学闭口不语。","我也像是在弥补之前说太多话的份，没有开口说话。","我要是为了自己太多话的事道歉，心情应该多少会轻松点吧，但我道歉的话，仙台同学绝对会生气。所以我只能默默走在她身旁。","就算并肩走在路上，我们之间也只有沉默，所以跟一个人走没什么差别。","我不敢看旁边，始终低头看着地上。","西沉的夕阳拉出的影子落在人行道上。","我们踏着徐缓的步调，映在眼中的景色也缓缓流逝。","「宫城，妳的感想是？」","回程路上，我第一次听到身旁传来一如往常的声音，突然地打破了沉默。","「感想？」","我看着仙台同学，不懂她问我这话是什么意思。","「妳想到我房间看看对吧？」","我配合她那仿佛已经忘了今天发生的事般开朗明快的语气回答。","「才不是，我只是想转换一下心情而已。」","「好好好。就当作是那么一回事吧，不过至少说说对我房间的感想嘛。」","仙台同学的房间里没有过多的装饰，也不是东西少到让人觉得很空虚无趣的房间。我觉得最适合的形容词就是「非常普通的房间」。跟我的房间没什么差别。","唯有书架不一样。","排列在书架上的书大多是考试题库或参考书，上面没有仙台同学偶尔会看的那些茨木同学会喜欢的杂志。但是我觉得指出这点不太对，给出了无伤大雅的答案。","「感觉是很常见的房间。」","「那是怎样？妳原本以为是怎样的房间啊？」","「更像女高中生的感觉？」","「啊～那种感觉啊。」","「因为妳在学校给人的印象就是那样啊。」","仙台同学虽然不是花枝招展的那一型，在学校还是很醒目，给人一种闪闪发光的感觉。她房间里就算放满可爱或流行的东西，我也不讶异。","「不是房间的感想也无所谓，妳没有其他什么要说的吗？」","可能是我的回答无法满足她吧，仙台同学又催促似的问我。","在那之后，我拿了书架上的书来看。尽管我不是两手空空地来，但我没带讲义也没带习题，除此之外也没别的东西了，所以看书是我唯一的选择。然后仙台同学也看起了书。","也就是说，我们度过了一段跟平常没有任何不同的时光。","「又没发生什么足以让我有感想的事情。」","「嗯，说得也是。」","仙台同学随口回答，停下了脚步。","我也停下来站在原地后，她把食指伸了过来，在碰到我的脖子前停住。","「妳这里没事吧？还有点红红的。」","推倒了我的仙台同学一点都没有手下留情。","她狠狠咬了我的脖子，我甚至以为自己要被她咬到流血了。我曾经被她咬过好几次，然而这次仍是那之中最过分的。","「那时候很痛啊，现在还在痛。」","我这样回答后，仙台同学的手摸了那个应该变红了的位置。","其实已经不痛了。","但那里仍像是残留着痛楚一般阵阵抽痛。","「也是，因为我是故意弄痛妳的。」","仙台同学用格外认真的表情说道。","别学我啦。","我差点脱口说出这句话，赶紧闭上嘴。","我重新体认到自己至今为止做了多过分的事情，呼出一口气。","我拿开仙台同学摸着我脖子的手。","没事的。","这种事情根本不算什么。","现在或许还红红的，可是不痛，也不会留下痕迹。","一切很快就都会消失不见了。","「仙台同学真变态。」","「或许是吧？」","平常总会否认的仙台同学给出了肯定的答复。","进入暑假之后，就尽是发生一些打乱我步调的事。","我所知的仙台同学懂得掌握分寸，也不会推倒别人。就算会做些脱离命令范畴的事，那些事情也不具有什么重要的意义。","用舌头触碰肌肤。","舔这个行为也不过就是这样。我却觉得仙台同学在那个时候，打算赋予这个行为更多的意义。","——不，那是我的错觉吧？","这一切都不是什么大事，到明天就会忘记了。不管是去仙台同学家，还是在那里发生的事，都会沉入记忆之海中，不会留下任何感情。全都是我想太多了。","「走吧。」","仙台同学随着仿佛会消失在城镇喧嚣声中的这句话，迈开步伐。","去她家的时候也一样，我不知道自己该走多快。","我无法决定和其他女生一起走的时候会自然而然定下来的步伐大小。","跟她并肩而行比较好吗？还是稍微跟她保持距离比较好？","我明明因为犹豫不决而走得很慢，仙台同学却走在我身旁。","从离开她家之后，我们就一直并肩走在路上。","无论去程还是回程都一样。","我们走路的步调没有改变。","我在不知该用什么速度和步伐的状况下走着。也不知道这是她平常走路的速度，还是配合著我的步伐。","就只是看着街景缓缓地转变。","我觉得再走快一点应该会比较轻松。","不过想到我可能没机会再像这样跟仙台同学一起走在路上了，我就无法加快脚步，让这景色转变的速度变得更快。","七月结束，步入八月。","在那之后仙台同学一直认真地当家教。我也很认真地念书，所以大多数的作业都写完了。跟她一起念书的时间虽然称不上开心，但感觉还不坏。不过我是觉得步调可以再放慢一点。","照理来说可以不用急着写作业了。","不管是解题还是写报告，我都已经腻了。","但仙台同学依旧没有偷懒，一直在教我功课。证据就是今天桌上也放着课本和参考书，还打开了她为了尽到家教的职责而带来的考试题库。","仙台同学会到这房间来的原因，大概在她家。","我想，我去她家的那天所看到的就是答案吧。","那也无所谓。不管是基于怎样的理由，她只要有遵守约定到这里来就好了。我却很在意，原先订下了假日不碰面这条规则的仙台同学，就算要改变这条规则，也要在暑假期间到这里来的原因。","即使在家里发生了什么事，也不想连假日都到这里来。","那应该是过去的她所得出的答案。","所以去年暑假她没有来这里。","寒假和春假她也没有试图要改变规则。","原本明明是这样的，现在是为什么？","这疑问始终残留在我心中。","说不定是发生了什么让她不想待在家里，纵然得改变自己订下的规则，也要到这房间来的事情，也或许是有其他的原因。虽然我也曾想过，在去她家回来的路上，要是我们就那样两个人一直走下去，我搞不好就会知道那些我不知道的事，可是路不可能永远延续下去。一定会在某处迎来终点。我没办法和仙台同学一直一起走下去。","「宫城，妳的手停下来了。」","难得没编也没绑头发的仙台同学用笔戳了戳我的手臂。","「我只是在休息。」","我看了一眼空调的开关，喝了一口因为念书念了好一段时间，冰块已经全部融化了的汽水。水水的碳酸饮料滑过喉咙，落入胃袋。实在称不上冰凉的汽水虽然不好喝，但对现在的我来说正好。","「宫城，这房间很冷吧？」","仙台同学以手托腮，看着我。","「现在不冷。」","「因为妳穿着长袖？」","身上穿着短袖衬衫搭配短裤这种凉爽打扮的仙台同学这么说。","「是这样没错。」","「那就表示妳会冷吧？」","房里响起了她有些低沉的嗓音，旋即消失。","我害仙台同学想要保密的事曝光了，才会配合她调整房间里的室温。像冰块融化后被稀释的汽水一样，藉此来稀释我的罪恶感。为了舒缓这么做而感受到的寒冷，我在T恤外面套了一件长袖的衬衫，所以现在是没有冷到我会想抱怨的程度。","「妳这样顾虑我，让人很不爽耶。」","仙台同学抓着我的衬衫袖子说道。","她一定发现这件衬衫的意义了。","「我干嘛要顾虑妳？」","「……」","她没有回答我。","说出这房间的室温为什么正好是仙台同学会觉得舒适的温度，等于是旧事重提，又要把在她家发生过的事情给挖出来谈。既然她不想被我多问些什么，就不可能会回答我。","我们双方都有不想说的事情，将这些藏在心里，过着同样的时间。","正因为我知道自己不该毫不客气地叫仙台同学让我看她藏在心里的秘密，才会意识到她什么都没问我。","至今为止，她一直都是这样。","这个家里总是没有人在的事。","我可以持续给她五千圆的事。","她从没问我那些我八成不想说的事情。","所以我也没太深入地去问过关于仙台同学的事。","——虽然之前我搞砸了。","问了她不想被人问起的事，我应该要好好反省，所以我现在没有继续追问她沉默不语的原因。","「就算有点热，我也不会怎样啊，把温度开高一点如何？」","仙台同学指着放在桌上的遥控器。","「既然我都配合仙台同学了，妳高高兴兴地接受不就好了？」","「妳果然是在顾虑我嘛。」","「就说不是了。」","我冷淡地说完，视线又落到习题上。","接着仙台同学便调高了空调设定的温度。","「仙台同学，妳今天调高温度的话会热耶。」","「会热妳就脱啊。」","这带有既视感的发展让我看向身旁。","记得放暑假前，我们也曾经针对空调的设定温度有过类似的对话。","那时候我调高了仙台同学调低的设定温度。","「就这么办。」","我身上的薄衬衫本来就只是用来调节温度的。反正里面还有穿T恤，我二话不说就脱下了衬衫。","「那仙台同学妳怎么办？」","「我没热到非得要做点什么的程度啊。」","「妳就会说谎。」","「我没差，可以配合宫城。」","仙台同学说完之后，又把温度调高了一度。","「我是无所谓，但仙台同学妳会热吧？」","「不会啊。」","这不可能。对我来说不冷也不热的温度，对仙台同学来说应该很热才对。如果是平常，她就会开口抱怨，要我调低空调的温度。她大概已经在心里决定好这段对话的终点了，我正被诱导到那里去。我想只要我没说出仙台同学决定好的台词，房间的温度就不会改变，这段对话也不会结束吧。","进入暑假后，主导权就一直握在仙台同学手里。","这让我很不满。","然后现在我摸不透她的目的这点，也成了不满的事项之一。","谁要陪她玩啊？","我解开方才写到一半的题目，填满习题上空白的栏位。","「宫城。」","叫我要认真念书的当事人伸手过来，阖上了放在我面前的习题。","照仙台同学的想法去做非我本意。可是就这样放着不管，她只会变得很烦人，不会让事情变得有趣起来，这也是事实。","「仙台同学，妳其实很热吧？衣服脱了会比较凉快喔。」","我开口说出我猜她想要我说的话。","「妳想要我脱，就来脱我的衣服，或是命令我脱啊。」","「我又没有权力可以命令妳。」","仙台同学口中突然冒出一句她非要我说的话，但我否定了那句话。","「妳都配合我调整房间的温度了，我让妳有命令我的权力。」","进入暑假后，仙台同学就很不讲理。","她的行为像是她成了掌控这房间的人，擅自决定所有的事情。说什么让我有那个权力？一副高高在上的样子，而且我现在得到这份权力也只觉得困扰。仙台同学给我的权力，不是我买来的权力。","我用五千圆买的是家教。","在暑假期间特别让仙台同学来教我功课。","和平常放学后不同，五千圆换来的就只有这件事。","要是我乖乖收下她说要给我的权力，最后一定会被她耍着玩。","就算等着我的是这样的未来，也没什么好奇怪的。","「妳不命令我吗？」","仙台同学开口问我，像是在等待早已决定好的答案。","她就在我只要伸手就能轻易碰触到的距离。和下雨那天一样，只要我想，就能解开她衬衫上的扣子。","我打算伸出手，又放弃了。","我的掌心湿答答的，宛如被雨淋湿了一样。我盯着仙台同学。","「……我命令妳，妳就会脱吗？」","「妳命令看看啊？」","仙台同学粲然一笑。","然而那笑容就跟注定会被丢弃的传单一样轻薄，我猜不透她在想些什么。仙台同学的话就像是迷宫。乍看之下有很多条路可以选，然而只有一条路会通往出口。","尽管不情愿，我还是说出了她准备给我的台词。","「那这是命令，脱衣服。」","仙台同学穿着类似她在暑假第一次来到这房间时穿的衣服，她毫不犹豫地解开衬衫的扣子。","一颗、两颗、三颗。","她连底下的扣子也全解开了，准备脱下衬衫。","「等等，等一下啦。」","我反射性地拉起快从她肩上滑落的衬衫。","「宫城，不要抓我头发啦，很痛。」","仙台同学用沉稳的声音和表情说道。","我的手里的确除了衬衫之外还有她的头发。但这种事不过是小问题，我说出更大的问题。","「妳为什么要脱？」","「是宫城妳命令我脱的吧？」","「是这样没错，但那是仙台同学妳硬逼我命令妳的啊。」","「就算是这样，妳还是下了命令。」","仙台同学甩开我的手，打算脱下衬衫。","我下了命令。","不过我只是说出仙台同学准备好的台词而已，没想到她真的会脱。我并不想要仙台同学脱衣服，也不想看她的裸体。我没有这样想。明明是这样，我的心脏却猛烈运作起来，仿佛可以听见血液流动的声音。我从她身上别开视线。","那个配合我的步伐，走在我身旁的仙台同学不在这里。","她看起来就像在全速奔跑着。","「妳为什么不看我这里？」","就算被她这么问，我也无法看她。","「一般来说，没人会在别人脱衣服的时候盯着人家看吧？」","「宫城妳至今为止有做过什么符合一般常识的事吗？」","「妳这是怎样？是想叫我看吗？」","「也不是这样，只是看妳突然别开视线，感觉有点不爽。总之妳面向这里啦。」","我就算无视她的话也无所谓。可以要对方听令的人是我，仙台同学的话不是命令。我只要一直不看仙台同学就行了。这样一来，她就会放弃这种愚蠢的行为，恢复成平常的样子。所以我没必要看仙台同学。我心里明明这么想，视线却移向了仙台同学。","「被人这样注视，很难脱耶。」","「我才没有注视妳。」","「妳有。妳根本猛盯着我看嘛。」","「仙台同学，妳意见很多耶。」","我这样说完后，仙台同学笑着说：「是啊。」脱下了解开所有扣子的衬衫。","她的肩头缓缓地暴露出来。","在我的视线前方，仙台同学上半身还穿着的东西只剩下内衣。","我虽然没打算注视着她，却无法别开目光。","空调的温度是设定在几度啊？","我觉得有点热，脑中浮现出一些无关紧要的事。","仙台同学把手上的衬衫丢在地上，觉得发丝很烦人地撩起了头发。","我差点觉得这模样很美，握紧了汗湿的双手。","今天的气温从早上开始便超过了三十度，也就是所谓的酷暑日，热到要是打开窗户，有可能会因为外头的热气觉得自己快死了。即使是这样，要是把空调的设定温度调得太低，对我来说又太冷。可是今天的室温维持在仙台同学会觉得舒适的温度。她在那之后虽然调高过空调的温度，但温度应该也没高到可以在房里只穿着内衣的程度。尽管如此，仙台同学依旧脱了衣服。","我只觉得她是在来到这房间之前热到脑袋秀逗，脑袋里头的东西全融化了，变得怪怪的。她进入暑假之后就一直怪怪的，但今天是她到目前为止表现得最怪的一天。","实在太搞不懂她，感觉连我都要变得怪怪的了，我讨厌这样。","脑中天旋地转，头昏脑胀。","为什么仙台同学要做这种事？","我很想知道，却又觉得自己不能知道。","我觉得自己该说点什么比较好，但找不到可以说出口的话。","我的视线紧黏在仙台同学身上。","——要说是水蓝色，感觉又更蓝一点的浅蓝色内衣。","跟之前看到的白色内衣给人的印象不同。","上面有精致蕾丝的内衣可以说相当可爱。虽然我觉得跟仙台同学的形象有一点落差，但很适合她。","她的胸部不算大，不过比我有料。视线稍微往下移动后，只见她的腹部结实紧致得恰到好处，有优美的腰线。","我没想要上下打量她。","然而我的目光却离不开她。","我希望自己的心跳声吵到仿佛连仙台同学都听得见这件事，只是我的错觉，不然就太奇怪了。","「那么换宫城妳了。」","「咦？」","突然听到她叫我的名字，我看着仙台同学的脸。","「宫城妳也脱啊。妳很热吧？」","我知道传入我耳中的这番话发自仙台同学，可是我完全无法理解。感觉像是某个遥远国度的语言，在我听来只是毫无意义的声音。","「宫城。」","我动弹不得，仙台同学口中唤着我的名字，拉近我们之间的距离。","好近。","可以清楚看见她平常总是被衣服遮着所以看不见的部分，让我反射性地推了仙台同学的肩膀，仙台同学却依然离我很近，抓住了我的T恤下摆。在她的手指碰到我的腰时，不停在我脑中翻滚的话语有了意义，我终于理解她刚才在说什么了。","「我又不热，不需要脱。」","我强硬地说完，把仙台同学的手推回去。","她要脱衣服是她家的事，我希望她不要把我也一起拖下水。","「有需要。好啦，快点。」","仙台同学不死心地说，毫不客气地把手伸了过来，然后再度抓住我的T恤下摆，企图往上拉。","「等、等一下，仙台同学。」","我急急忙忙地想拉开仙台同学的手，却怎样都拉不开。不仅如此，我的衣服下摆还被她掀了起来，露出半截肚子。","我没预料到会发生这种事。","就算我脱了仙台同学的衣服，也没想到她会来脱我的衣服。我也从没想像过被她脱衣服的情境。真要说起来，我的命令是「脱衣服」，而不是「脱我的衣服」。","我抓起面纸盒，敲打仍抓着我T恤下摆的仙台同学的头。接着只见面纸盒套的鳄鱼晃动着，同时传来她夸张地喊痛的声音。","「不过就是脱个衣服，又没什么大不了的。妳在学校也换过衣服啊。」","仙台同学放开我的T恤下摆，摸了摸被我打的地方之后把头发往上撩。","「这又不是在换衣服。被人脱衣服跟换衣服才不一样。」","「宫城妳太爱计较这些小事了啦。」","「才没有，是仙台同学妳太随便了。」","「老爱计较这些小事，会秃头喔。」","仙台同学拉拉我的浏海，说：「这种事情就是要一鼓作气啦。」又抓住了我的T恤下摆。","「我就说不要了。」","我「啪」一声地打了她的手背。","「妳不想让我脱妳衣服的话，那宫城妳自己脱啊。」","「我真的搞不懂事情为什么会变成这样。」","仙台同学不时会做出一些我从未预想过的事情。突然跑来我家，或是突然跑来教室，让我吓一大跳。","我觉得进入暑假后，她这个倾向又变得更明显了。","完全不顾虑我的感受，尽是做些令人想不透的事情。","「假如我说，我是为了脱妳的衣服才脱的，这样妳能理解吗？」","仙台同学一派轻松地说完后看着我。","「……妳是开玩笑的吧？」","「妳觉得我像在开玩笑吗？」","我觉得这应该要是个玩笑。","即使脱了我的衣服，仙台同学身上也不会发生什么好事。而且我身材也没多好，看了也没什么好玩的。","然而她看起来不像是在开玩笑。","「总之妳不脱的话，我就帮妳脱。」","在我开口说些什么之前，她仍抓着我衣服下摆的手便掀起我的T恤。","「要让妳脱我不如自己脱。」","我抓住仙台同学的手腕，如此宣言。","不管我怎么说，她都不像是会改变心意的样子。如果我除了让她脱或是自己脱之外没有其他选择，那我只能选后者了。","「好。」","仙台同学随着简短的回应，放开了我的T恤。","我垂下视线，轻轻呼出一口气。","我缓缓抬起头，虽说是理所当然，但上半身只剩下内衣蔽体的仙台同学就在我眼前。然后我也正打算要脱掉自己的T恤。","这不可能发生的情境令我头晕目眩。","这种事情除了愚蠢之外，没别的词可以形容了。","我其实可以不用听仙台同学的话。","我只要现在站起来，说我要去拿什么东西过来，走去厨房，就不用陪她做这种无聊事了。","「宫城，还是我来帮妳脱吧？」","可能是感受到我在犹豫了吧，仙台同学用不小的力道抓住了我的手臂。","她脸上挂着灿烂的笑容，却一点都不温柔。我只感觉到她没打算让我溜掉的意念。","「我会自己脱，妳转头看别的地方啦。」","「为什么？宫城妳不也看我脱了吗？」","「那是仙台同学妳叫我看，我才看的。」","「就算是这样，妳还是看了啊，所以我觉得我也有权力看妳。」","「没有那种权力，妳看别的地方啦。」","我拉开她抓着我手臂的手，推着仙台同学的身体，让她转过去面向床铺。可是她马上又转回来看着我。","「宫城妳未免想太多了吧？」","听到她那调侃我的语气，以及仿佛认定我想逃避她的视线这件事带有特别意义的发言，我一口气脱下了T恤。","盛夏的午后，在自己房间里只穿着内衣。","光听这段叙述，那不过是日常生活中的一幕罢了，然而由于和我一样上半身只穿着内衣的仙台同学在场，让事情变得没那么单纯。","视线好刺。","仙台同学可能是觉得哪里很有趣吧，她直盯着我看。","尽管不是裸体，我还是没办法静下心来。","我很想遮住自己的身体，但我要是去遮，感觉又会被她调侃，所以我想遮也不行。","既然要给她看，如果我穿的是更可爱一点的内衣就好了。","我今天穿的是常见的白色内衣，当然也不是以会在人前脱衣服为前提才挑这套的。","「我是脱了……不过接下来要干嘛？」","我尽量装作若无其事地说完后，看向仙台同学，只见她一瞬间很伤脑筋似的皱起眉头，但马上又嘴角上扬地摆出笑容，手滑顺地抚过我的腰。","「仙台同学，不要做这种事啦。」","她在没有东西隔着的状态下摸我的那只手让我觉得很痒，我虽然想抓住她的手臂，但在我抓住之前，她就戳了戳我的腰。","「仙台同学妳做什么啦？」","我拍开仙台同学的手，按着自己的腰。","「很软，摸起来很舒服。」","「妳这样很让人生气耶。」","「给我摸一下又不会死。」","「不好，不要碰我。」","「那只看不碰就行了吧？」","我不知道她这个结论是从哪里来的，但仙台同学毫不客气的视线又投到了我身上。","「那也不行。」","我看仙台同学是无所谓，但被她看就不一样了。","继续做这种事情，我会一直被仙台同学的步调给牵着走。","「宫城，妳的脸有点红耶。」","仙台同学的手缓慢且温柔地抚上我的脸颊，接着手掌像是要夺走我的体温一般贴了上来。就只是这样的小事，我的心跳却变得好大声，好像快忘了怎么呼吸。我一把拉开她的手。","「如果我脸有红，那是因为觉得丢脸。我的身材又不像仙台同学那么好。」","「女生稍微有点肉比较可爱喔。」","「我真的很讨厌仙台同学妳这种地方。」","「那也有喜欢的地方喽？」","「没有。」","我立刻回答，转向旁边。","我就这样抱膝而坐，仙台同学打了一下我的手臂。","「妳稍微想一下嘛。这样我很受伤耶。」","她的语气比说出的话更轻快，我实在不觉得她有受伤。","可是我没看她，不知道仙台同学是用怎样的表情说出这些话的。","「我还满中意宫城的说。」","身旁传来她开朗明快到了感觉有些刻意的声音。","「仙台同学，妳是因为太热，脑袋烧坏了吧？」","「搞不好喔？宫城妳照顾我一下啦。」","「我不要。是说妳不要靠过来啦。」","她未经同意就靠过来撞上我的肩膀，我不禁开口抗议。","我没说她可以零距离地跟我靠在一起。","我们之间需要保持适当的距离，现在的距离明明就太近了，仙台同学却不肯离开。我们犹如肩膀相连般地紧靠在一起，她长长的头发搔着我的手臂。","「我脑袋烧坏了，动不了。」","「这笑话一点都不好笑。」","我这样说，看向仙台同学，只见她一副觉得很扫兴的样子。","「妳多少笑一下嘛。」","「仙台同学，这样很热，还有很重。」","不是我的身体。","仙台同学那肩膀与我的肩膀相连的身体，已经不只温暖，甚至让我觉得很烫。","我至今从没经历过有其他人脱了衣服坐在我身旁，还紧贴着我到两人的体温会交融在一起的情况，不知道跟别人会是什么感觉。也因为我所知的只有仙台同学，我不知道这算不算是正常的体温。","「说人家很重太失礼了吧？」","「才不失礼。我要穿衣服，让开啦。」","我推了推仙台同学紧靠着我的肩膀，她却勾住我的手，让身体接触的面积又变得更多了。","「仙台同学，刚刚那是命令，照我说的去做。」","「今天的命令是叫我脱衣服，所以已经结束了。」","「妳干嘛擅自订下这种规则啊？」","「反正是暑假，稍微自由一点嘛。这样比较有趣吧？」","「我不喜欢暑假，这样也不有趣。」","「就一天发生这种事也没关系吧？」","「才不好咧。」","她的手臂缠着我的手臂，我无法逃开。","仙台同学的手臂碰着我的腰。我觉得这种平常不会接触的部分，现在却紧贴在一起的状态，绝对不是什么好事。我就算跟舞香她们也不会做这种事。","不过仙台同学和我的体温合而为一的感觉还不错。","「对了，宫城。虽然是下个星期的事，不过妳盂兰盆节有什么行程吗？」","「没有。」","我没必要特地照实告诉她。","盂兰盆节期间，只有一天爸爸会在家，除此之外还有一天跟舞香她们有约。我想即使是仙台同学，也不会连盂兰盆节都说要念书，所以不说也没差。","「那盂兰盆节也要念书喔。」","仙台同学这么说，像是要把体重全压在我身上，往我这里靠了过来。","「仙台同学，我就说很热了。」","我擅自认定盂兰盆节不用念书，安排了行程。明明只要把这件事告诉她就没事了，我却不想说。事情的优先顺序被她的体温搅得一团乱。","跟舞香她们的约提前就好了。","这周末她们两个应该都有空才对。","「没关系，我也很热。」","「妳那是怎样啊？」","听了我的话，仙台同学说了句：「因为是夏天吧。」根本不能算是回答。","我觉得自己听见了比平常更吵的心跳声，但是我分不清楚，那究竟是我的心跳声，还是仙台同学的心跳声。","〔本话含插图〕"]},{"t":"第6话　如果对象是宫城，我想做的事","p":["打开装有家居服的五斗柜后，宫城的衣服映入眼帘。","那是在放春假之前，我的制服被泼了一身汽水后她拿给我替换，我一度要还给她的上衣。","结果宫城没收下，那件衣服成了我的东西。我丢不掉，也没有穿，那件衣服就这样一直被我收着，无处可去。","我轻轻摸了摸那件上衣。","因为我打算还给她而清洗过，上面没有宫城的痕迹。","我闭上眼，再度张开眼睛后，拿起坦克背心，走向浴室。","由于是周五晚上，就算是已经过了晚上十一点的现在，客厅的灯依然亮着。我静静穿过走廊，进浴室洗澡。比起悠哉地泡澡，我选择早点洗好离开浴室，从冰箱里拿了一个宝特瓶，回到房里。","我看向放在桌上的手机。","我一边回复几则传来的讯息，一边让瓶装绿茶流进胃里。喝了半瓶之后，我拿着手机躺到了床上。","我本来没打算去想的，今天发生的事却浮现在脑海中。","——我在宫城面前脱了衣服，然后强迫宫城脱衣服的事。","我把手机放到枕头旁边，大叹了一口气。","每周和宫城碰面三次本身不是什么坏事。","我在假日会想跟朋友见面，也会和朋友出去玩。一旦交情变好，会这样想也是理所当然的。在假日和宫城见面，也可以说是类似的感觉。我跟她虽然接吻过，但这种程度的事还在容许范围内。反正我的嘴唇已经碰过宫城的身体很多次了，宫城也一样碰过我很多次。","所以没关系。","可是脱衣服或是脱对方衣服，就违反规则了。","我觉得我在下雨那天做了错误的选择。","我应该要拍开宫城打算脱下我制服的手，说：「妳是傻了吗？」然后一口拒绝她。都怪我接受了那个打破规则的行为，造成的影响才会一直残留到现在。","我躺在床上，一边看着天花板一边叹气。","在这房间里推倒过宫城的我早就在诅咒自己了，现在也仍旧诅咒着自己。然后这诅咒正缓缓地覆盖住我的心，差点就要扭转我的感情。","脱了宫城的衣服，触碰她。","觉得自己快要思考起更进一步的事情，我挥去脑中的想法。","「这不太妙吧？」","我不应该作这种想像。","在宫城来过这个房间后，浮现在我脑海里的尽是些不能跟其他人说的事情。","例如我当时要是就那样顺势吻她就好了。","或是如果在她身上留下不会消失的痕迹就好了。","我一直在想这些无聊事，直到现在。","这样的我根本就不像我。","我应该是一个做事更得要领，也很擅长跟人相处的人。上了高中以后，我就在还不错的位置过着愉快的校园生活。到毕业前我都打算过着这样的每一天，若是我想实现这一点，那我现在对宫城抱有的感情就只会碍事。","『我还满中意宫城的说。』","我本来是不想对她本人说这种话的，但我的确很中意她。因为她当面说没有任何喜欢我的地方，我才反射性地说出口，不过我也只是比起其他人更中意她一点罢了，没什么问题。","然而实际上并不是这样。","我比自己所想的更中意宫城，无法控制自己对她的感情。","所以我今天试着想让自己变回自己应有的样子。","我重重地叹了一口气。","用起来不顺的智慧型手机只要重新启动，就会像没出过任何问题一样地正常运作。我想我只要像那样重新启动自己就行了吧。","因为我表现得像是脱衣服这件事情别有用意，气氛才会变得很奇怪。既然这样，只要表现得跟普通的日常生活一样就行了。","让宫城命令我，像在学校换衣服那样，若无其事地脱掉衣服。","欺骗自己，蒙混过去。","就算很难让自己的感情产生一百八十度的大转变，我还是可以找到折衷的办法去整理。只要更接近去年那个认为无聊的命令或讨厌的命令，全都只是用来打发时间的玩意，只会把一周中的几个小时卖给宫城的我就好了。","我原本是这样想的。","结果进行得不顺利就是了。","她要脱我衣服也可以，命令我自己脱衣服也行。","我准备给宫城的选项有两个。而她如同我所想的一样，命令我脱了衣服。","我很习惯隐藏情绪。掩盖自己的心情并巧妙地应对眼前的状况，是我最擅长的事。所以我面不改色地在宫城面前脱了衣服。可是光这样还不够，理性被抛下，只有感情仍持续催促着我行动。拜此所赐，连宫城都脱了。","不对，刚刚这说法不正确。","正确来说，是我无法阻止自己想要脱掉宫城衣服的心情。我知道即使自己摆出若无其事的表情，我的邪念也不会消失，唯有想要再多触碰宫城的感情持续残留在我的心里。","我现在也一边后悔，一边想着诸如宫城好软、两人身体碰在一起的部分好舒服之类的事，真是没救了。我的思绪完全梳理不开，缠绕成一团，一直在连接不该连上的部分。","我一直觉得自己变得不像是自己，感觉很恶心。","不是隔着衣服，而是直接触碰。","我还想对宫城——","我不记得自己过去曾对人有过这样的感情。","不会想对其他人做，但如果对象是宫城，我就会想做的事情正逐渐增加。明明是夏天，无处可去的感情却像雪一样不断降下、堆积，没有融化。","「该说还好今天是周五吗？」","假设隔一天马上又要和宫城碰面，我现在的心情太沉重了。","我的确对她有兴趣，却希望停留在我觉得那个房间待起来很舒服的程度。毕竟我早已经决定好，毕业后要离开家去念外县市的大学，我也不想改变自己的未来。","可是我也没特别想当个冰清玉洁的人，觉得生活中有些刺激也不错。如果我没再跟宫城有更深的牵扯，单纯享受在那个房间度过的时光里清澈纯净的部分，应该不要紧吧？","我觉得这是谬论，也觉得自己的想法很支离破碎。","然而一旦扯上宫城，我就没办法好好统整自己的想法。我到现在还是无法掌握宫城这个人，所以越想就越不知道自己该做些什么。","真要说起来，宫城也有不对，尽是下些奇怪的命令。","她总爱说一些什么，让我没办法继续当那个既温柔，做事又很得要领的自己。","所以我觉得放过那一点点小矛盾也无所谓才对。","而且她最近会莫名地顾虑我，让我在那边待起来很不舒服。","这个家的状况与宫城无关。","她要是不表现得一如往常，就等于是在给我机会去做类似今天那样的事。","我把责任转嫁到她身上，看着隔开这间房间与隔壁房间的墙壁。","我会这样一直去想某个人，除了在隔壁房间的那个人以外，这还是头一遭。在父母变得明显地只疼爱姐姐之后，我有好一阵子满脑子都只想着姐姐。","虽然和那时候的自己不同，但我就像是看着当时的自己一样烦躁。","「啊～真是的。明明在放暑假，我的情绪却嗨不起来。」","我拿起手机，看了看时间，已经超过凌晨一点了。","羽美奈的话应该可以吧？","她都会熬夜，既然放假，她这时间应该也还醒着才对。我觉得自己该转换一下心情，打给了羽美奈。电话铃声响了一次、两次，在响第五次的时候，传来了不像半夜会有的活泼声音。","「真难得妳会这时间打来耶。」","「我睡不着啊。羽美奈妳现在方便讲电话吗？」","「我打电话过去，结果我男朋友睡了，现在正闲着没事。」","我没有非要跟羽美奈说的事。","我想她一定也是只要能打发时间，不管对象是谁都好。尽管如此，我们应该一样有着还是想跟比较聊得起来的对象说话的欲望。于是我们开始闲聊起来。","不同于宫城的声音，让我的心情平静了些。","明明没有动脑，只是把想到的事情滔滔不绝地说出口而已，对话却比我跟宫城讲话时还能一直延续下去，气氛也很热烈。可是要说开不开心，那就很难说了。因为我与羽美奈上周才见过面，对话内容仿佛过去重演，都是些类似的话题。","「是说今年啊，叶月妳很难约耶？补习班有那么忙吗？」","一定会用补习班来称呼考生冲刺班的羽美奈这么说，丝毫不掩饰她内心的不满。","我去年暑假跟她碰面的次数是今年的两倍，她会抱怨也是无可奈何。","「算是吧？行程排得很满。」","考生冲刺班很忙是事实，几乎占据了我暑假所有的行程。再加上我还要去宫城家，所以又更忙了。","羽美奈说着她想去那里，也想去这里的各种希望，在手机的另一头叫我空出时间给她。我也不管实际上到底空不空得出时间，还是跟她说：「我知道了。」然后心情又好起来的羽美奈像是突然想到似的说了。","「对了，妳作业写完了吗？」","「差不多都写完了。」","「那借我抄啦。」","「好啊，明天拿给妳吗？」","「妳说的明天是指今天吗？」","经羽美奈这么一说，我才想起现在时间已经超过凌晨一点了。","「啊，对，今天。」","「好啊，就今天。啊，我还想顺便去一个地方。」","羽美奈说了个感觉抄作业这件事才会变成顺便的地点。","我也不是想跟她碰面。","如果是去年，我想自己应该会更开心一点。","提不起劲。","不过跟人碰面感觉比较能转移注意力，所以我和羽美奈约好了要见面。","今天醒来的感觉比平常更神清气爽。","至于原因，我不用想也知道是羽美奈。","结果别说周六了，我连周日都被她拖着到处跑，累得连想些多余事情的空档都没有，熟睡了一晚。我虽然没打算要连续出去玩两天，但我想就是因为我把宫城的事情塞到脑袋的角落里去了，才能好好睡上一觉。","拜此所赐，我能像平常一样去上补习班，也能到宫城家来。","只要忽视那微乎其微的尴尬，就没有任何问题了。","实际上，我跟宫城都没有提及周五的事。宫城说是家教费，给了我五千圆之后，就默默在桌上摊开了习题，我也专心地把习题的答案写到笔记本上。","于是现在，在这房间里的是一段平稳的时光。","我们都明白，周五的事情只是藏在习题里，唯有在解题的期间会变成不曾发生过的事。虽然原本就没那么热烈的对话持续停摆，老是陷入沉默，但那些都是枝微末节的小事。不过是沉默多了点，不会这样就导致世界末日到来，我们的关系也不会迎向末日。","我是觉得有点太安静了，但总比太吵好。","我拿起桌上的玻璃杯，让冰凉的麦茶流进胃里。宫城似乎不再顾虑我了，今天的室温对我来说有点热。","我虽然希望她再调低个两度，但我决定不说。","毕竟还是比待在外面凉快，我也不希望周五发生的事情再度重演。","「仙台同学。」","宫城毫无预兆地叫了我。","「干嘛？」","「妳周日有到车站前面吗？」","「有是有。妳干嘛问这个？」","我从习题上抬头看向宫城，只见她也看着我。或许是邪念都在来这里的路上被热死人的太阳给烧得一干二净了吧，就算宫城在我身旁，我今天也没那么在意她。","「因为我看到妳跟茨木同学一起走在路上。」","听到宫城这句话，我把差点说出口的「那妳叫我一声就好啦」给吞了回去。","我们不是那样的关系。","「宫城妳是跟宇都宫出去？」","我找了其他话来说。","「对，我跟舞香她们有约。」","「妳们做了什么？」","「去买东西。」","在刚开始放暑假，我问她要跟宇都宫去哪里时不肯回答我的宫城，现在老实地告诉了我答案。","「那仙台同学妳们去做了什么？」","「跟妳们一样，陪羽美奈去买东西。」","「玩得开心吗？」","不知道是写题目写到腻了，还是已经受够沉默了，宫城问了我她平常不会问的问题。","「还行。」","我简短回答后，她用疑惑的眼神看着我。","我不知道宫城那天看到的我是什么模样，但我应该没有露出会被她用那种眼神看着的表情。我在羽美奈面前不会摆出一副觉得无趣的样子。「还行」这话也有一半是真的，任羽美奈摆布虽然很累，但也有开心的部分。","「我才想问，宫城妳那天玩得开心吗？」","特地去否定宫城的视线也很麻烦，于是我问了关于她周日行程的问题。","「我们不会做不开心的事。」","「是喔，妳们买了些什么？」","「很多东西。」","「很多东西是什么东西？」","「买什么都没差吧？」","宫城会回答问题的奖励时间似乎已经用完了，话题就此结束。不过她昨天好像真的玩得很开心，语气没有那么冷淡。","我跟宇都宫不太熟，但我知道她跟宫城感情很好。我没听说过她们实际上认识多久，交情有多好，不过我觉得她们应该是很好的朋友吧。","那大概是现在的我所没有的人际关系。","我有的全是盘算过后的人际关系，多少有点羡慕她们。没必要去想的事情也跟着浮现在脑海中。","如果是宇都宫，一定可以不带任何念头地触碰宫城吧。","我很清楚，抓住朋友却要加上「不带任何念头」这个注解，是很奇怪的事。如果是朋友，就不需要这样的注解。会觉得邪念消失了只是我的错觉，就是因为有一半没被烧掉，我才会去想这种事。","——烂透了。","我丢开手上的笔，趴到桌上。","额头撞上桌子，发出了「咚」的沉重响声，但我不在意。","「妳突然干什么啊？」","我听到宫城惊讶的声音传来，但我无视她的反应，依然趴着问她。","「妳有不懂的地方吗？有就跟我说，我会教妳。」","「除了仙台同学突然趴下的理由之外，倒是没有什么不懂的地方。」","「那妳继续写习题。」","「妳到底是怎么了啊？」","「我只是对自己有点幻灭。」","要是我放着现在的自己不管，感觉又会再重蹈周五时的覆辙，让我厌恶起自己。","我没想到自己的理性如此不能信任。以前我一直觉得宫城是个难搞的人，自己现在却成了比她更难搞的人。","「不要说些让人搞不懂的话，认真念书啦。」","宫城说了感觉平常会是我在说的话。","「我上午有认真念书过了。」","「那是在说补习班吧？在这里也认真念书啦。」","要是认真念书就能从这份无聊的执念中获得解脱，要我多认真念书都行。但我不认为有用。总觉得在大热天底下跑出去散步还比较能转换心情。","「对了，宫城。妳家有吐司吗？」","我坐起身，看向身旁的她。","「吐司？」","「对，还有牛奶和鸡蛋。」","「都没有。有的话又怎样？」","「妳不想吃法式吐司吗？」","「不想吃。」","「我想吃。」","宫城立刻回答，我也立刻回答她。","我们不是能邀对方去散步的交情，我也不能无缘无故地一个人跑出去，所以我只要随便找个理由就好了。","我只是想转换一下心情。我觉得自己只要从外面回来，就能什么都不想地在宫城身旁继续解题了。","虽然她几乎不会在这个房间里拿食物出来，但偶尔两个人一起吃个点心也不错。","「我去买材料回来，妳等我一下。」","因为宫城想不想吃不是问题，我站起来，拿起包包。","「别管什么法式吐司了，好好念书啦。」","装着鳄鱼盒套的面纸盒随着她不悦的声音飞了过来。我接住面纸盒，把鳄鱼放回它原本该在的地方。","「真难得宫城妳会说这种话。」","「因为仙台同学突然开始做起什么，最后都会惹出麻烦，我只是希望妳别做。」","「妳这样说，听起来好像我老是在惹麻烦一样。」","「妳是啊。」","「我才没有，今天只是要做法式吐司而已。」","尽管我没打算告诉宫城，不过我就是为了避免惹出麻烦，才要做法式吐司的，所以拜托她不要阻止我。","「那我去去就回。宫城妳要一起去吗？」","我做出不会改变心意的宣言，顺便加上一句让宫城会想放我一个人出去的魔法咒语。","「我不要。想去的话妳自己去。」","她说出了我预料中的台词，视线落到了习题上。","「那妳等我一下。不好意思，要拜托妳锁门。」","可以的话，我并不想在盛夏时跑到外头去。","在没有云朵遮住太阳的天空下，走在没有风的路上简直是地狱。","但现在我有必要前往宛如蒸气室的街上。","我抛下宫城走出玄关，搭上电梯。","穿过一楼大厅踏出户外，我的额头上立刻渗出汗水。","只要吃了甜食，心情就会好起来了。","这说法虽然没有根据，我却深信不疑，走在被太阳照耀着的人行道上。","这种行为很像宫城呢。","我一边寻找阴影，一边叹气。","行动没有一致性，一旦发生了什么事就逃跑。","或许是跟她在一起久了吧，我逐渐变得像宫城一样。我不想承认自己越来越像她。我想把这当成是巧合，只有今天罢了。","我用力按压太阳穴，把宫城从脑袋里赶跑。","吐司、鸡蛋、牛奶。","我虽然没问，不过她家总不会没有砂糖吧？","我为了完成简单的采买，加快了脚步。","走路的速度一变快，额头上渗出汗水的速度也变快了。","我身上的T恤也吸收了更多汗水。","好热。","热到我对宫城抱有的那些不像我的心情应该要融化的程度。","要被做成法式吐司的吐司或许也跟我一样，在想着很热的同时被煎得金黄酥脆吧。我思考着这种蠢事，没走去便利商店，而是去了更远的超市，买了需要的东西，然后回到有宫城在的住宅大楼，请她帮我打开楼下的门锁，搭上电梯。","还满单纯的。","因为我没绕去其他地方，就是直接前往目的地，买了需要的东西，再直接回来而已，所以也没在外面待上一小时还是两小时那么久。不过光是这样，就能让我的心情有不小的转变了。","外面很热，脑袋与其说冷静，不如说反而更热了，不过我已经达成了甩开邪念这个目的，所以没问题。","「我买回来了。」","我请宫城帮我打开玄关大门，对她说道。","「我又没拜托妳买。」","她语气不悦地回我。","「虽然妳没拜托我，不过稍微休息一下嘛。」","「仙台同学妳擅自跑出去买东西了，所以我一直在休息啊。」","说完后，宫城走回了房间。我提着超市的提袋追着她进去，只见宫城坐在床上，正在看漫画。","「宫城，法式吐司怎么样？」","「妳可以用厨房。」","「不是啦，我的意思是说，我要做法式吐司，所以要不要两个人一起吃点心？」","即使我简单明了地提议，宫城依然不为所动。","既然这样，我只能来硬的了。","我把超市提袋放到地上，拿走宫城手上的书，发现那是一本我没见过的漫画。","她说去买东西，就是这个吗？","我想她昨天跟宇都宫她们出去逛街购物，买回的很多东西之一就是漫画吧？","「仙台同学妳自己吃啊。」","说完之后，宫城从我手里抢回漫画，继续看了起来。","不管怎么看，她的心情都算不上好。","「啊，宫城，妳该不会讨厌法式吐司吧？」","我突然跑出去买东西。","无视宫城叫我认真念书的发言。","我想这大概是她心情不好的原因吧，但我说了更无伤大雅的理由。","「……」","宫城看也不看我这里。","「妳干嘛不说话？」","「……我没吃过，所以不知道。」","「原来有没吃过法式吐司的人啊。」","我没有瞧不起她的意思。","这是我单纯的感想。","不过在宫城耳里听起来似乎不是这样，我听见她低沉的声音传来。","「我绝对不吃。」","「这没什么好闹别扭的吧？我教妳怎么做，妳来帮忙啦。」","「我不要帮妳，妳自己做。」","「这算是课外教学啦。」","「妳又马上就乱说这种话。」","宫城从漫画里抬起头，露出不满的表情。","「那我做好之后端过来，宫城妳在这里等我。」","我没力气跟她抬杠下去。","反正我也没有非要跟宫城一起做不可的理由。要是两个人一起下厨，搞不好我才转变的心情又会恢复原状。就算她不来帮忙，我依旧可以做法式吐司。不仅如此，说不定她不在，我还做得比较快。我们一起做炸鸡块的时候也没发生什么好事。那时候她划伤了手指，我喝了从她伤口流出来的血。","「我借用一下厨房喔。」","我对坐在床上的宫城说完，提着超市提袋准备走出房间，她却拉住了我的T恤下摆。","「干嘛？」","「我跟妳一起去。」","我不知道她在其他人面前是什么样子，可是在我面前的宫城总是很不老实。今天也是闹别扭闹了半天，结果还是说要跟我一起去厨房。我想就连她说不要吃的法式吐司，到了最后她也一定会吃。","既然这样，一开始就默默跟我来不就好了？","她真的很难搞。","然而像这样对话，就觉得她是一如往常的宫城，我也是一如往常的我。感觉比我们在念书的时候更能维持住普通的自己。","我走过短短的走廊，前往厨房。然而宫城没有走进厨房，而是坐到了客厅的吧台桌前。","「宫城，来这边。」","我叫了感觉完全没打算要帮忙的宫城。","「为什么？」","「妳是来帮忙的吧？」","我明知道不要叫她比较好，嘴巴还是自作主张地动了起来。","不过应该不会发生什么事才对。","我已经找回理性了。","「不是。仙台同学妳自己做啦。」","「别说那么多了，来帮忙啦。就算不擅长下厨，妳还是可以帮忙把蛋打散吧？难道妳连这种事情都不会？」","我从超市提袋里拿出牛奶跟蛋，看着宫城。她噘起嘴，一脸不高兴的样子。","「我做就行了吧？」","宫城粗声粗气地说，走进了厨房。","「我可以自己拿餐盘那些东西出来吗？」","「随便妳用。」","我照她所说的，随便拿了几个需要的用具出来，打了一颗蛋到调理盆里。","「这个先帮我搅拌好。」","我把料理筷递给宫城，才发现了一件很重要的事。","我忘了买要用来煎吐司的奶油。","我打开冰箱看了看里面，看到有个盒子里装着颜色很恐怖，快死掉的奶油。我问宫城那是什么时候买的，她虽然模糊地回答说：「是不久之前买的。」可是以不久之前才买的奶油来说，这奶油实在不像还活着。尽管如此，我还是选择相信宫城，给出下一个指示。","「加一大匙砂糖进去，跟牛奶一起仔细搅拌。」","我把装有砂糖的容器，跟已经倒进量杯里量好分量的牛奶递给宫城后，把吐司放在砧板上。","对半切开就好了吧？","虽然也可以切成比较好入口的四分之一大小，不过我决定今天对半切开就好，拿起了菜刀。我切开第一片吐司，看了看旁边，发现宫城还在加砂糖。","「宫城，停。」","「干嘛？」","「妳加太多砂糖了吧？妳加了几匙？」","「大概三匙？」","「我应该有说只要加一匙吧？」","「甜一点比较好啊。」","「不好，不要乱改分量。」","两匙还好说，三匙实在太多了。","但我也没办法把已经加进去的砂糖给捞出来，所以又打了一颗蛋到盆里，打算靠增加蛋液的量来稀释过多的砂糖。我把牛奶的量也改成两倍，加进刚才打的蛋里面之后，宫城又想再加砂糖进去。","「等一下，宫城。」","我抓住她那企图加一堆砂糖，量多到会让人胃食道逆流的手腕。","「妳等等要命令我还是怎样都行，照我的话做啦。」","「我没有想命令妳做的事。」","「有吧，一定有什么。」","「那妳把这个喝下去。」","宫城不高兴地说，指着加了大量砂糖的蛋液。","「妳说什么傻话？」","就算砂糖的量正常，蛋液也是要用来泡吐司，不是可以直接拿来喝的东西。","「所以我就说我没有要命令妳做的事啊。偶尔换仙台同学妳来下命令怎么样？为了感谢妳做法式吐司，我让妳有命令我的权力。」","「那我只要命令妳别乱改砂糖的分量就结束了吧？根本没有意义。」","「我可以听妳三个命令。这样我们就能和平地做法式吐司了吧？」","她果然还想再捣蛋。","要找我不下命令就不肯乖乖听话的宫城来帮忙做法式吐司，还不如全都由我自己来做。","「妳说三个，妳是想当神灯精灵吗？」","我从宫城手里抢走调理盆，搅拌蛋液。","「神灯精灵听的不是命令，而是愿望吧？仙台同学妳才是，说什么傻话啊？」","宫城果然是笨蛋。","她下的命令虽然是命令，但我就算下了命令，那也一定不会是命令。我不认为宫城会乖乖听命于我，所以我下的命令就跟愿望没两样。而且神灯精灵会实现我的愿望，但我就算向宫城许愿，她也未必会帮我实现。","「我说啊，妳要帮忙就不要提什么命令，老老实实地帮忙啦。妳要是不想帮忙，就去那边坐好。」","我觉得这样做很没礼貌，但还是拿料理筷指着客厅。","可是宫城没有要去客厅。","「仙台同学还不是会擅自订新的规则，没差吧？」","「是这样没错。」","「赶快下命令啦。」","宫城转过来面向我，说得像是在命令我一样。","我不能接受。","为什么应该要听我命令的宫城这么趾高气昂？","真要说起来，就算可以下三个命令，我想要宫城做的事情，也只有别乱改砂糖的分量、也别乱改牛奶的分量、用小火煎吐司这些事情而已。而且这也不是我非要宫城做不可的事。","那我该命令她做什么才好？","我的视线落到黄色的蛋液上。","我想要宫城做的事。","我想对宫城做的事。","不是没有，但我觉得不是该在这里命令她的事。","那除此之外还有什么？","我放下调理盆和料理筷，转过去面向宫城。","「下什么命令都可以吗？」","「可以啊。」","「那妳就这样站着别动。」","「咦？」","「我叫妳别动。」","「我知道，然后呢？」","宫城好像以为我会命令她帮忙做法式吐司，带着疑惑的表情看我。","「闭上眼睛。」","「……妳想做什么？」","我明明命令她别动了，宫城却往后退了半步。","「安静听我的话。」","「妳说安静，这是命令？」","「对，命令。妳说会听我的三个命令吧？」","宫城皱起眉头瞪着我。她好像想抗议，喊了我一声：「仙台同学。」但她马上闭嘴，慢慢阖上眼。","宫城绝对不会听我的话。","我本来是这样想的，所以有些失望。她应该已经预料到接下来会发生什么事了，我还以为她会更强烈地反抗。","我伸手触碰难得乖乖听话的宫城脸颊。","就算我滑动手指，宫城也没有动。","理应被盛夏的太阳给烧去的不合理感情仍未燃烧殆尽，我无法阻止自己。只是去买个东西这种短时间内就能找回的理性不过是一时的，三两下就瓦解了。","我像宫城缓缓闭上的眼睛一样，缓缓靠近她。我也闭上眼睛，她从我的视野中消失，我们的双唇交叠后，我觉得自己仿佛能清楚看见我应该看不见的宫城，就这样用力地把嘴唇贴了上去。","心跳的声音比平常更急促。","我还没有习惯跟宫城接吻到可以若无其事接吻的程度。尽管如此，第二次接吻——如果要正确计算我碰到她嘴唇的次数，那是第三次——果然还是很舒服。我明明只是碰上她柔软的嘴唇，我瓦解的理性就像是奶油一样的逐渐融化。","我不讨厌接吻。","我还想再多碰触她。","就算暑假期间发生了这样的事情也无所谓。","我欺骗自己，告诉自己接吻也不是什么了不起的事。","我用舌尖触碰宫城的唇。我仿佛要撬开她紧闭的唇般伸出舌头后，宫城的手推了我的肩膀一把。那力道出乎意料地大，让我的唇一度离开她的，但我又再度吻了上去。","我温柔地触碰她，用舌尖舔着她的唇。","我没有做更多事了，宫城却毫不留情地咬了我的嘴唇。这次换我推开了宫城的肩膀。","好痛。","我用指尖摸了自己的嘴唇后，传来湿湿的触感。我看向手指，上面沾有红色的液体。","「又不是第一次了，不用做到这种程度吧？」","被她咬的地方传来阵阵刺痛，让我的声音变得尖锐起来。","「跟是不是第一次没有关系。我都已经听了妳三个命令，是仙台同学妳不好，随便乱来。」","宫城不高兴地说。","我不知道她所谓的乱来是指我想伸舌头进去，还是我舔了她的嘴唇。不过我只有吻上她嘴唇的时候，她没有抵抗，所以我想接吻这件事情本身应该不包含在乱来里面才对。","「妳也稍微控制一下力道嘛。」","我只说了无论如何都想告诉她的事。虽然我还有几句想说的话，但我就算说了，宫城也只会跟我抱怨。","「有镜子吗？」","我有点在意伤口有多深，问了不知道地雷到底在哪里，很难搞的宫城。虽然没有流很多血，可是刚才那一下很痛，我的嘴唇现在也还在痛。居然会使劲全力咬这种地方，宫城这个人真是有毛病。","「要看伤口的话，我帮妳看。」","「我自己看就好。」","「这里没有镜子。」","宫城这么说，把脸凑近我。","到了非常近的距离。","那距离以看伤口来说实在太近，我本想开口问她：「妳要干嘛？」然而在那之前，宫城就像猫还是狗一样，舔了我的嘴唇。","这突如其来的动作让我连出声都忘了，伸手推了宫城。","「我只是帮妳消毒。」","宫城说得像是在找藉口，她退离我身边后又继续说道。","「血的味道好怪。」","「那当然吧？而且我之前也说过了，舔伤口不能消毒。」","我在这里舔过宫城的血，所以很清楚血是什么味道。","和我自己的血一样，宫城的血也一点都不美味。宫城她自己在舔之前，应该也早就明白这点了。这样不卫生，也不是会让人想主动去做的事。所以我不懂宫城为什么会想舔我的血，然而她又靠了过来。","「等一下，宫城。」","我制止了想把身体靠过来，嘴唇也跟着靠过来的宫城。","我为什么要制止她？","我在自己也搞不清楚的状态下，抓住了宫城的肩膀。","「明明是仙台同学妳主动诱惑我的。」","既然妳主动诱惑了，那我就回应妳。","宫城的话也可以这样解释，让我很惊讶。","我至今为止的确是一直在做诱导宫城的行为，可是在她说之前，我都没去思考过这件事。","「……意思是妳想再跟我接吻一次？」","我问了她也没回应。","我主动拉近距离后，宫城虽然小声地说了：「我来。」我仍就那样把嘴唇抵了上去。","宫城的嘴唇触感伴随着些许痛楚，鲜明地传了过来。","既柔软又温暖，感觉很舒服。","痛楚并未消失。","我的嘴唇还是一样传来阵阵刺痛，有点热热的。","相触的嘴唇触感却覆盖了痛楚。","如果只有双唇相触，那宫城也会老老实实的，我在经历了比刚才长了那个一点点的吻之后，让嘴唇离开了她的唇。","「……仙台同学妳很色耶。」","宫城喃喃说道，用怨恨的眼神看着我。","「宫城妳还不是想接吻，我们一样吧？」","「才不一样。」","宫城语带反抗地如此断言后，朝我伸出手。","她的指尖碰上我的伤口，慢慢抚摸着。","「那里会痛。」","像是对我的话起了反应，指尖用力地压了我的伤口。","我因为强烈的刺痛感而皱起眉头。","光就物理上的距离而言，我和宫城比起之前更常接近彼此了。但我们之间仍有着无法填补的距离。","宫城是不是到现在还想看我不高兴的表情呢？","她的手指还在继续摸着我的嘴唇。","感受到她持续带给我的痛楚，让我思考起这件事。","〔本话含插图〕"]},{"t":"第7话　仙台同学光会做些多余的事","p":["仙台同学不会用能以开玩笑来带过的方式接吻。","我们第一次接吻的时候也是这样。","如果是双唇相接那种程度的吻，还可以说只是闹着玩，以此为藉口蒙混过去，可是她都会用不容辩解的方式接吻。如果只是双唇相接就结束的吻，那接吻也无所谓，她却想要更胜于此的吻。","「宫城，会痛。」","没把命令用在做法式吐司上，而是用在接吻上的仙台同学开口抱怨，但我的手指依然没有离开她的嘴唇，也不认为有需要拿开。","仙台同学的舌头碰到我的嘴唇时，我觉得浑身不对劲，完全无法静下心来。","她的体温想要混进我的身体里，我的脑袋深处逐渐发烫。","那样的吻不是我们该有的吻，于是我咬了仙台同学的嘴唇。她那种不是开玩笑的吻，会唤醒我放进上了锁的盒子里，沉入内心深处的情感，所以我没办法接受。","仙台同学嘴唇上的伤口比我想像中的还要深，不过这是她自作自受。","我在压着伤口的手指上施力。","仙台同学的表情变得难看起来，原本只是在忍耐痛楚的她瞪着我。","感觉好久没看到仙台同学带着反抗的眼神了。","看到仙台同学这种唯有在这个家里才会露出的表情，我就能沉浸在仿佛得到了某种稀有物品般的优越感之中。而且只有我能让她露出这种表情的事实，也会令我的情绪高昂起来。","——直到不久之前都还是这样的。","然而现在，在我内心某处也有个不想让仙台同学露出这种表情的我存在。","这太奇怪了。","不好的是想用太超过的方式接吻的仙台同学，就我的立场而言，就算稍微回敬她一下也无所谓。不管她露出怎样的表情都不重要。","我用指甲压她的伤口。","指尖被黏稠的血液给沾湿，仙台同学抓住了我的手腕。","「就说会痛了。」","我的手随着这句话被她粗鲁地从伤口上拉开。","我看看指尖，发现上面沾有仙台同学的血，她的嘴唇上也一样沾着血。我舔了一下沾在指尖上的血，跟舔仙台同学嘴唇的时候味道一样，并不美味。","「不要舔，去洗手啦。」","仙台同学这么说，想要打开水槽的水龙头。我制止了那只手，抓住她的手臂。","「手我等等再洗。」","「那妳现在要做什么？」","暑假期间的仙台同学很嚣张。","我明明打算主动吻她的，她却在我吻她之前，用理所当然的表情吻了我。不过只是接吻这种小事，她要做倒也无所谓，但每次都是仙台同学自由地想做什么就做什么，我觉得太不公平了。","这里是我家，三个命令也早就结束了，我也可以像她那样去做我想做的事才对。","「接吻。」","我没打算等仙台同学答复。","我朝她走近一步，由我主动把脸凑过去。","我没有闭上眼。","映在我视野中的仙台同学逐渐靠近。就算这样，我仍没闭上眼睛。仙台同学似乎败给我的毅力，闭上了眼睛。我缓缓把嘴唇叠上她的。","随着温暖的体温，应该是血的液体弄脏了我的嘴唇。","传来的黏稠触感有点恶心，不过嘴唇相触这件事本身很舒服，跟她吻我时几乎一样舒服。我用力把嘴唇抵上去后，仙台同学的身体稍微往后缩了一下，可能是伤口会痛吧？","嘴唇不管跟身体的哪里碰在一起，除了柔软程度不一样之外，触感应该没有太大的不同，然而嘴唇和嘴唇相触时，心跳却会加速，身体也会变得热起来。","我不知道是不是跟谁接吻都会有一样的感觉。","我也不想知道。","不过我知道跟仙台同学接吻之后会怎么样了。","我抓着她的T恤，用力把嘴唇压上去。嘴唇比刚才沾上了更多血，和比任何地方都柔软的嘴唇紧贴在一起。可是仙台同学马上就退开了。","「妳动作再温柔一点啦，我嘴唇很痛耶。还有妳这样会拉松我的T恤，放开。」","仙台同学这么说，拍了一下我的手背。","我什么都没回应她，洗完手之后开始搅拌蛋液。仙台同学也没责怪没有回话的我，开始切起吐司，厨房里只有料理筷咖咖咖地撞上调理盆的声音。","我的心脏还跳得有点快。","我持续看着黄色的液体，却也没办法一直保持沉默。","「这个要怎么办才好？」","我不知道黄色的液体怎样才算完成，抬起头问仙台同学。","「已经可以了。等等只要把吐司泡进去再煎过就好，所以宫城妳到另一边去吧。」","把本来在客厅的我叫来帮忙的仙台同学，说得像是要把我赶出厨房。","也太不负责任了吧？","我是很想抱怨我特地过来帮忙，她却把我赶回去这这件事。不过继续待在厨房里实在很尴尬，而且她要是叫我煎吐司那也伤脑筋。","我老实地听从仙台同学的指示，离开了厨房。","我坐到吧台桌前等待后，甜蜜的香气随着煎东西滋滋声一起飘散而来。没多饿的肚子仿佛在催促食物似的动了起来，我探出身体往前看，看到煎出了焦痕的吐司。然后在等了比想像中更久的时间后，法式吐司上桌了。","「因为有某人不听话，我不知道好不好吃。总之妳吃吃看。」","仙台同学把刀叉放到我前面，坐到我旁边。我们没有刻意要一起说，但两句「我开动了」重叠在一起，我和仙台同学瞬间看了彼此一眼。","我用叉子固定住长得很像煎蛋卷的吐司，把吐司切成小块。将金黄色的方块放入口中后，外酥内软的吐司带来了鸡蛋与奶油交融而成，感觉有些怀念的味道。","「第一次吃法式吐司的感想如何？」","仙台同学看着我。","「比我想像的还甜。」","「那要怪宫城妳吧？因为妳加了一大堆砂糖进去。」","仙台同学对此很不满地说。","「嗯，可是我觉得还满好吃的。」","这不是在说谎。","虽然感觉上的确有点太甜了，不过初次吃到的法式吐司，可以分类到我喜欢的食物里。","炸鸡块也是，煎蛋卷也是。","仙台同学做给我吃的东西都很好吃。说不定连我讨厌的食物，她都能做得很好吃。","「那就好。」","从身旁传来她像是松了一口气的声音。","仙台同学下厨做料理给我吃的时候，我只要说好吃，她总是会发出这样的声音。明明不必顾虑我的反应，但她好像还是有点在意。","我又吃了一口法式吐司。我咀嚼柔软的吐司，吞入胃袋后，听见刀叉碰到盘子发出的响声，往旁边一看，只见仙台同学用手捂着嘴。","「妳没事吧？」","我不用问也知道她为什么捂着嘴。","法式吐司碰到伤口了。","我想应该是这么回事，不过会受伤是仙台同学自找的，我没必要为此感到不安。只是她的表情看起来实在很痛，让我忍不住问了她有没有事。","「不要把人家咬到流血啦。」","仙台同学皱起眉头，瞪着我看。","「是仙台同学不好，做了会让人想咬妳咬到流血的事情。」","「妳明明就不讨厌接吻。」","「我也没特别喜欢啊。」","「哦？」","仙台同学对我投以疑惑的语气和眼神。","我把法式吐司放进嘴里，仿佛要逃离她的声音和视线。我慢慢咀嚼，等到奶油的香气从口中消失后，跟她说了一句我想说的话。","「从后天开始，妳表现得再普通一点啦。」","「所谓的普通是？」","「不要做奇怪的事。」","如同仙台同学所言，我不讨厌接吻，假如对象是仙台同学，要接吻也可以。","只是我觉得那不是接下来该继续做好几次的事情。","我们不是这世上所说会接吻的关系，也没预计要发展成那样的关系。这个暑假单纯是特例，等第二学期开始，我们照理来说又会过着和第一学期一样的每一天。","而且要是又发生这样的事，我觉得我会渐渐无法踩煞车。因为我不讨厌，没自信能维持普通的状态。我知道这样拖拖拉拉地持续做出这种行为，到最后一定会出事。","「奇怪的事是什么事？」","仙台同学用叉子叉起法式吐司。","「奇怪的事就是奇怪的事啊。」","「妳说清楚啊。妳想叫我别吻妳对吧？」","「妳既然知道，就不要再做这种事了。如果真要做，看是要念书还是聊天都好，做这种事情好吗？不喜欢的话，这里也有书和游戏，妳可以随便找点什么来打发时间吧？」","我粗声粗气地说完，从仙台同学的盘子里抢了一块法式吐司。我一口吃下去之后，仙台同学灿烂地笑着说了。","「宫城，妳知道吗？会一起做那种事情的人啊，就是所谓的朋友喔。」","客厅里响起她开朗到显得有些刻意的声音，仙台同学站起身，说：「我去拿饮料。」她走向厨房，只有声音从稍远的位置传了过来。","「不过宫城要是想跟我做那种像是朋友之间会做的事情，那我从后天开始会那样做就是了。」","仙台同学很快就回来了，在桌上摆了两个玻璃杯。","「我也不是想跟妳做像是朋友会做的事。」","「是吗？如果妳觉得普通一点比较好，那玩个假扮朋友游戏就好啦。既然这样，我们不如就像朋友那样，两个人一起去看个电影吧？」","仙台同学摆出我在学校经常看到的笑脸，喝下麦茶。","我从她的语气就知道她不是认真的。","我怎么可能去啊？","仙台同学认定我会这么说。","所以我绝对不说。","「……好啊。我们去看。」","「妳说电影？」","「对，明天或是周四去吧。」","虽然不是在假扮朋友，但我曾把仙台同学当朋友那样对待过。","闲聊一些无关紧要的小事，一起玩游戏。","我曾试着跟她做一些我跟朋友会做的事。","到最后我还是没跟仙台同学变成朋友就是了。","但这次或许会有不一样的结果。那时候只有我这么做，这次仙台同学却也会跟我一起玩这个「假扮」朋友的游戏。我并不是想跟她当朋友，然而这说不定能成为让我们快要扭曲的关系复原的契机。","「为什么是明天或周四？」","仙台同学问得犹如在刺探些什么。","「要玩假扮朋友游戏的话，挑妳不用当家教的日子比较好吧？」","「说得也是。那就约周四吧。」","仙台同学用我在这个家里从未见过的笑容说道。","这也不对，那也不对。","我把衣服一件件摊在床上沉吟，又收回衣柜里。尽管我已经持续做这件事做了三十分钟，还是无法决定要穿什么衣服。","我也知道不过是衣服，不需要花这么多时间来挑。","昨天仙台同学来当家教时，我们虽然没决定要看哪部电影，但说好了要去的地方。","那是我们平常不会去，同一所学校的学生也不会去的地方。","我们立刻决定好的碰面地点就在那样的地方，必须搭电车过去。毕竟没人知道我跟仙台同学会在放学后碰面，我们暑假有见面的事情也是秘密。由于不能去有可能会撞见熟人的地方，我才刻意选了一个比较远的地点。","走去车站，搭电车。","就单纯为了看一场电影而言，这路程很花时间。就算是这样，因为我们是约在下午碰面，所以还有时间。","「这样就行了吧？」","衬衫配牛仔裤。","我拿起前阵子跟舞香她们碰面时穿的衣服。","没必要为了去见仙台同学而这么认真。","不要在那边想半天，赶快决定下来就好了。","我迅速换上衣服，把拿出来的衣服收好，烦恼着要不要绑头发，拉开了窗帘。看向窗外，外头是一片耀眼夺目的阳光。","感觉很热。","因为脖子好像会晒伤，我没绑头发，改涂了防晒乳。看了一下时钟，现在要出门还有点太早了。","我叹了口气。","尽管答应了仙台同学是当作开玩笑才说出口的提案，但我的心情好沉重。我是有想看的电影，却不知道她会不会想看。即使仙台同学有想看的电影，我也不知道我会不会想看。","我不清楚那些假如是她的朋友应该就会知道的「关于仙台同学的事」","喜欢的电影、音乐类型，或是喜欢的食物。","我从没问过如果是她的朋友，感觉理所当然会知道的那些事情。","我长长地呼出一口气，然后「啪」的一声，轻轻拍了自己的脸颊。","今天只是要玩「假扮朋友游戏」而已。","不是什么难事。","只要像我跟舞香她们相处那样跟仙台同学相处就好了。就算想看的电影不同，应该也能找到妥协方案，至今为止，我和舞香她们也是这样在兴趣、嗜好上互相磨合的。","「虽然还有点早，不过算了。」","我拿起包包，走出住宅大楼。","走不到十分钟我就开始流汗，沾湿了衬衫。夹杂在车辆行驶声的蝉叫声害人感觉更热，烦死了。","我逃进大楼的阴影下，停下脚步。","这么说来，仙台同学家离我家并不远。既然目的地一样，说不定我们会搭到同一班电车。","我没想要寻找她的身影，却看了看周遭。","她怎么可能会在啊？","我在心里喃喃自语，为了搭平常不会搭的电车而穿过剪票口。不管是在闷热的月台上，还是没多凉的车厢里，都没出现熟悉的面孔。经过几站之后，我下了车。在车站里朝着我们约好要当成碰面地点的奇怪雕像前面走去。不过在我走近奇怪雕像前，「假扮朋友游戏」的对象便进入了我的视线范围内。","远看也知道是仙台同学的那个人，和到我家来时的她无论是服装还是气质都不一样。","仙台同学穿着的长裙和无袖衬衫很常见，不是什么特别的款式，但很适合她。而且或许是因为外貌吧，她看起来相当醒目。","要不是跟她有约，她绝对是我不会主动过去搭话的那一型。就算有约在先，我也觉得很难开口叫她。我敢说我们即使同班也不会变成朋友，也一定不会在同一个小圈圈里。印象比较贴近我们刚升上二年级，还没变成这种关系前的仙台同学就站在那里。","可是我也不能不去叫她。","我咽下到嘴边的叹息，往前走三步后，和仙台同学对上眼。在我走近之前，她先朝我走了过来，叫了：「宫城。」并朝我挥手。","「抱歉，让妳等很久了吗？」","我其实没有迟到。距离我们约好的时间大概还有十分钟，所以我不需要道歉，不过我想既然是朋友，说声抱歉比较好吧，就还是说了。","「我上完考生冲刺班直接过来，结果有点太早到了。」","我不知道她等了几分钟，但仙台同学笑着说：「别在意。」接着由上到下打量了我一番之后说了。","「宫城跟在家的时候没什么差别耶。」","「毕竟不需要做什么改变。」","「这样啊。」","「仙台同学平常的穿着都是这种感觉吗？」","之前我看到跟茨木同学在一起的仙台同学时，可能是因为距离隔得很远，总觉得跟她现在的穿着感觉不太一样。","我只是没来由地有点在意，才试着问她，不过在不同日子作不同打扮倒不是什么稀奇的事，好像也不是需要特地问的事情。可是她抓着自己的裙子，表情看起来认真到不行。","「是这样没错，很奇怪吗？」","「不会啊。我只是问一下而已。」","「那就好，总之我们走吧。」","仙台同学让裙摆轻柔地飞扬起来，迈开脚步。目的地不用说，当然是电影院。我们在车站里走了一小段路，搭上电梯。电梯往上爬了几层楼之后，我们走出电梯，张贴在墙上的海报映入眼帘。","「妳有想看的电影吗？」","仙台同学边看着海报边问我。","「基本上是有。」","「有喔？是哪部片？」","我说出原作是我家书柜上有的某部恋爱漫画的国产片片名。","「啊～那部片啊。羽美奈之前曾说她想看。」","「茨木同学想看？」","「因为她好像喜欢跟女主角演对手戏的演员。」","「这样啊。」","我犹如喃喃自语般地回答，想接着问：「仙台同学也喜欢那个演员吗？」却又把这句话给吞了回去，说出在这个场合最自然的台词。","「仙台同学妳有想看的电影吗？」","「有。」","我从这么回答的她口中听见的，是我现在最不想听到的电影片名。","「妳想看那部片喔？」","「很适合夏天吧？宫城妳看恐怖片OK吗？」","不OK。","仙台同学说想看的电影，是以学校为舞台，所谓的B级恐怖片。她看起来实在不像是会看这种电影的人。而我连恐怖片的广告都不想看。真要看这部电影的话，我现在就想转身回家了，可是我如果跟仙台同学说我不想看，她一定会揶揄我，所以我不想说。","「……」","「咦，宫城妳是不敢看恐怖片的那种人吗？」","看我没说话，仙台同学开口问我。","「与其说不敢，应该说我想看其他片。」","「妳是那个对吧？到了晚上就觉得说不定会有妖怪跑出来，不敢去厕所的那种人。」","「才不是。」","「不是的话，要看恐怖片吗？」","仙台同学愉快地说。","事情演变成这样，我死都不愿意说我不想看。然而照这样发展下去，真的要去看恐怖片的话我也很头痛。","「……这世上不可能有幽灵，但厕所里说不定会有手伸出来啊。」","背后有什么东西。","尽管知道什么都没有，但是一个人在家，有时候就是会冒出这种感觉，让我害怕起来。像这种时候，我觉得就算有什么东西从厕所里跑出来也不奇怪。","「宫城妳家人好像都很晚才回家是吧？」","与其说很晚，不如说不太常回家，我却不想特地说出这种事而闭口不语。这时仙台同学轻笑着说了。","「好啊，就看宫城想看的电影。毕竟妳要是晚上去不了厕所就伤脑筋了嘛。」","「妳根本是在嘲笑我吧？」","「才没有。我只是觉得妳好像小孩子，很可爱。」","「妳果然是在嘲笑我嘛。」","「就说没有了。只是我记得宫城妳喜欢好结局？但这部片不是好结局吧？」","我想看的电影是恋爱片，在原作漫画里，女主角死了。虽然故事结尾就像仙台同学所说的，称不上是好结局，不过女主角和单恋的男生在一起了，不是那种看完后会让人心情很差的结局。","然而现在比起电影结局，我更介意仙台同学的记忆力。","我确实有在她面前说过不是好结局的恋爱小说很无聊，但只说过一次。","「真亏妳记得耶。」","「因为我还没看完妳就泄露剧情，我怀恨在心。」","仙台同学用分不清她是在开玩笑还是认真的语气说道。","「结果妳还是看完了啊。」","「是啦。所以电影就算不是好结局也没关系吗？」","「毕竟就算不是好结局，我还是喜欢那部作品。」","「那我们去买票吧。」","仙台同学对我微笑后转身。","今天的她比平常更常笑。","因为是朋友。","就算这是原因，但都怪跟昨天不同的仙台同学，就连电影已经开演了，我的心还是静不下来。","到片尾名单正好两小时。","我直到最后的最后都没有站起来，看完了片尾名单。","我旁边的仙台同学直到最后也没有站起来。","我跟不看片尾名单就走的人合不来。有时候在片尾名单的最后还会有彩蛋，而且我也想要享受电影的余韵，所以我觉得仙台同学是会跟我一起坐到最后的人真是太好了。","尽管一开始没办法专心看电影，不过随着时间经过，我也就不在意身旁的仙台同学了。反正在看电影的期间，不管是谁在旁边，都不需要说话，只要面向前面就好。拜此所赐，虽说是从途中开始，但我可以专心地跟上电影的剧情。","「宫城，妳觉得好看吗？」","在影厅的灯亮起来的同时，仙台同学微笑着向我搭话。","「很好看。」","我简短回答，站起身。","电影没有忠实地照着原作的内容去呈现，不过我觉得做出来的成果很不错。然而我不知道仙台同学是怎么想的。我不记得自己有听她提过她觉得好看的电影，所以没办法推测这剧情合不合她的喜好。","「仙台同学妳呢？」","我边走边问她。她表情没变地说了。","「很好看。」","「真的吗？」","她没表现得一脸无趣，口气也不像在说谎。然而仙台同学的态度让我觉得不太对劲，于是我又反问了她一次。","「真的啦。我觉得很好看喔。」","仙台同学用开朗的语气举出几个场景，陈述她的感想。接着又说了一次好看之后停下脚步。","「接下来要怎么办？要去别的地方吗？」","仙台同学在电影院前为了决定接下来要往哪走，询问我的意见。","「别的地方是什么地方？」","我们没讲好看完电影之后的行程。","因为我想都没想过，只好反问她。","「像是去逛街，看看衣服之类的。」","「我跟仙台同学的品味不合。」","「要逛的话，可以挑宫城妳喜欢的去看喔。」","「我也没有想看的衣服。」","衣服我只有要衣柜里的那些就够了。又没有什么想要的衣服，就算跟仙台同学去看衣服，我也觉得逛不了多久。","「那要去吃点什么吗？」","仙台同学带着柔和的笑容看我。","「是可以，要吃什么？」","「吃点简单的东西好了。妳想吃什么？」","「仙台同学妳决定。」","「这个嘛……宫城妳喜欢吃甜食对吧？」","挑仙台同学喜欢吃的就好了。","我叫她决定地点是包含了这层含意，却好像没传达给她。仙台同学想要配合我的喜好来决定目的地。","这没什么不好。","假如对象是舞香她们，我应该就会老实告诉她们我想吃什么。","可是就算现在的仙台同学这样对我说，我也不觉得高兴。","我知道理由是什么。","是因为仙台同学异常温柔，一直在笑。","在这里的仙台同学，跟我在学校看到的仙台同学一样。","笑嘻嘻的，用开朗的语气说话。","现在的她感觉是我们刚升上二年级时，连话都没有说过的同班同学，是连对我这个人有没有印象都不知道的同班同学。我在约好要碰面的地点看到的仙台同学给我的印象没有错。","这样的仙台同学，不是我认识的仙台同学。","「抱歉。吃东西还是算了。」","我以车站月台为目的地开始往前走。","「等一下，宫城，妳要去哪里？」","如果这里是我的房间，我应该会听到她语带不满的声音，从身后追上来的却依然是温柔的语调。","恶心。","胃在翻腾，感觉快把午餐吃的东西给吐出来了，我加快脚步。","「我要回去了。」","我没回头地告诉她。","「已经要回去了？太快了吧？」","「并不快。」","只会一味配合我的仙台同学无聊透顶。","就算跟这样的仙台同学待在一起，也一点都不好玩。","「那我可以去宫城家吗？反正还有时间。」","仙台同学这么说，抓住了我的手臂。我回过头，只看到脸上依然挂着笑容的她。","「要是宫城妳不想让我去，我就不去，不过我们回程可以一起走吧？」","「为什么？」","「妳还问我为什么，就算我不去宫城家，我们也是要搭同样的电车，回去的方向到途中都一样啊。那一起回去不就好了？我们今天是『朋友』吧？」","仙台同学好像还在玩「假扮朋友游戏」，抓着我的手臂不肯放开。","她说的倒不是什么怪事。","我家和仙台家意外地近，既然要回去，一起走很合理。可是一起回去的话，我们特地选在远处碰面，避免撞见熟人的安排就没有意义了。","「是没错，但被人看到就麻烦了。」","「反正盂兰盆节期间大家都去亲戚家了，不会碰巧撞见谁啦。」","仙台同学不负责任地如此断言，拉着我的手臂。","「说不定会撞见啊。」","今天的确是盂兰盆节，却也不是每个人都会去亲戚家。","「就说不会碰到了，一起回去啦。」","仙台同学说完后就拖着我往前走，我不得已，只好走在她身旁。","我觉得现在的她比刚才那个一点主见都没有的仙台同学像样多了。","有点强硬地要别人接受自己的意见。","我虽然不喜欢她的这种态度，但总比像个人偶的仙台同学好。我是这么想的，然而她脸上的笑容还在，所以我还是觉得不太舒服。","仙台同学边走边找了些话题。","不管我有没有应声，她都会继续说些什么，在月台等电车的期间、搭上电车之后，她都不断地在跟我说话。","电车「喀当、喀当」地在轨道上行进。","景色掠过窗外，离家越来越近。","耀眼的街景和苍翠的绿意接连流逝，逐渐变为熟悉的景色。我应该不讨厌仙台同学的声音，然而我明明有听见，却听不进去。她的声音与车内无数的杂音交融、消失。","电车抵达月台后，仙台同学下了车，我也下了车。","我们走到被高楼大厦围绕的大街，在熟悉的路上前进。","在去仙台同学家回来的路上，我以为再也没有机会并肩同行的她一直走在我身旁。可是话一直聊不起来，我也不想聊。","我讨厌这种气氛。","我的嘴随着心情一起变得沉重，没办法顺畅地开合。硬是想说话，空气就会形成看不见的膜，贴上来封住我的嘴。我想仙台同学也觉得跟心情不好的我在一起很无聊吧。","然而她一直走在我身旁，没有在途中就与我分开。","「结果妳一直跟到我家来了嘛。」","我端了冰麦茶给一脸理所当然地出现在我房里的仙台同学，走到坐在桌前的她身旁坐下，喝了口汽水。","「妳想把朋友赶回家吗？」","「妳还在玩假扮朋友的游戏啊。」","「我们今天一整天都是朋友吧？」","背靠着床坐在地上的仙台同学仍挂着笑容说道。","像个好人，感觉很讨厌。","我想仙台同学也已经发现装成朋友没有意义了。「假扮朋友游戏」再怎么样都只是个「游戏」，不会变成事实。","「仙台同学，妳真的觉得刚才的电影好看吗？既然妳说我们是朋友，就跟我说真话。」","电影的感想根本不重要，可是我不想要她对我说谎。继续玩假扮朋友游戏虽然没有意义，但她要说我们是朋友的话，至少可以回答我这个问题吧？","我看着仙台同学。","到刚才为止都一直在说话的她轻轻吐出一口气。","「……我看得出导演就是想弄哭观众，所以有点出戏。觉得漫画比较好看。」","仙台同学没对上我的视线，但用温柔的语气说了。","跟我今天听到的每个感想都不同的这番话，我不认为她是在说谎。说是这么说，这仍不是能令我满意的答案。","「这样可以了吗？」","仙台同学只有嘴角在笑地看向我。","觉得好看的电影类型不同。","这在我跟舞香她们去看电影的时候也曾经发生过，所以我跟仙台同学对电影的喜好不同也无所谓。","问题是她的态度。","始终带着微笑的仙台同学，有种莫名的隔阂感。","「我觉得我果然没办法跟仙台同学当朋友。」","我抓住今天一直在心里飘荡的话，说出口。","我以为我只要和她一起做些和朋友会做的事，就算当不成朋友，或许也能重建我们之间快要倒塌的关系，但那只是我的错觉。","跟装成是朋友的仙台同学在一起也不开心，我也不想跟这样的仙台同学在一起。而且我没有想恢复我们快要扭曲的关系，到不惜选择跟这样的她在一起的程度。她却依然在做无谓的努力。","「才过不到半天而已，妳就已经得出结论了啊？」","仙台同学温和地说，喝了口麦茶。","「就算再过几个小时，也不会有什么差别吧。」","「妳是哪里不满意？」","「全部。现在的仙台同学感觉很恶心。」","「妳也不用说到这种地步吧？」","仙台同学最后「唉～」地大叹了一口气，把玻璃杯放到桌上。","「明明是宫城妳说想玩假扮朋友游戏，我才回应妳的要求耶。」","「我才没有提出这种要求。」","「妳约我去看电影，就等于是提出要求了吧？」","「可是一开始说不如去看个电影的人是仙台同学啊。」","「宫城妳也说了要去看啊。」","仙台同学恨恨地说，躺到床上。她没有躺成大字形，但还是很不像样，裙子感觉会皱掉。","「仙台同学，不要在别人的床上滚来滚去。裙子会掀起来喔。」","「只要宫城妳不做什么奇怪的事，我的裙子就不会掀起来。」","她毫无干劲的回答传来，从床上伸出的手臂重重地打在我身上。就算我说她碍事，碰到我肩膀的手臂仍一动也不动。我抓住她那放松无力的手臂。","从无袖衬衫底下露出的手臂完全没晒黑，白得惊人，实在不像是每周会在大太阳底下走来我家三次的人。我看向她白皙美丽的手臂前方，虽然不太显眼，但指甲上涂了指甲油。","我很在意，要是我碰她的身体，她会不会像平常那样抗议，或是露出不高兴的表情，于是把手放到了仙台同学的肩膀上。我将指尖从上手臂一路滑到手腕，看了看她。在我的视线前方，仙台同学什么都没说，依然是一脸毫无干劲的样子。","我把脸凑近比手腕略高一点的位置。","就这么吻上去之后，头被她推了一把。","「是宫城妳说不要做奇怪的事情的。」","仙台同学发出心情很差的声音，瞪着我。","看到她这副模样，我觉得自己终于见到我认识的仙台同学了。","果然还是这样的仙台同学比较好。","我明明确实有这样的感觉，但看到她不高兴的样子，却又有种宛如针扎的刺痛感在体内扩散开来。我继续抓着她的手臂，求助似的加重了手指上的力道。","「碰一下又没关系。」","我语气不变地向她搭话。","「与其说碰，妳刚刚那是要亲吧？宫城妳会对朋友做这种事情吗？」","「我不会对朋友做，可是仙台同学不是朋友。而且假扮朋友游戏已经结束了。」","就在身边，假日也会碰面。","每周会闲聊好几次的我们，成为朋友也不是什么怪事。然而是开始的方式不对吗？还是至今为止共度的那些时间错了呢？我会称仙台同学为朋友的世界没有到来。","我再次把嘴唇凑近她的手臂。","可是这次在我的嘴唇碰到她之前，她拉了我的头发。","「我说啊，倒不是说只要不是朋友，就什么都能做好吗？」","仙台同学口气强硬地说完后，不客气地打了我的额头一下。那个沉稳又温柔的她不知道上哪去了，看不到半点影子。","「我觉得只要仙台同学说我做什么都可以，那就没问题了啊。」","我说没问题，根本是在说谎。","即使再三重复这种行为也不会有好事，会踩不了煞车，这些事情我都很清楚，我却无法反抗想要触碰仙台同学的欲望。追根究柢，仙台同学要是乖乖回自己家，事情就不会演变成这样了。就是因为她理所当然地出现在我房间里，才会变成这样。","我咬了她的手臂来代替叹气。","「宫城，很痛耶。」","我明明没有咬得很大力，仙台同学却夸张地喊痛，还补上一句：「我没说妳做什么都可以。」","「那妳赶快说可以啊。」","「暑假宫城没有权力命令我。」","嫌麻烦地说完后，仙台同学爬了起来，然后以床代替椅子坐下，抚慰着被我咬出的痕迹。","「进入暑假之后我也有命令过妳啊。」","「那是特例。今天我没给妳那种权力。」","「只要有权力就可以了？」","不管是要得到命令的权力，还是这副模样的仙台同学，我都知道该怎么做。所以我站起来，从放在包包里的钱包中取出五千圆纸钞，拿到仙台同学面前。","「这样就行了吧？听我的命令。」","「不是只要给我五千圆，就能解决任何问题耶。而且我已经收过妳的五千圆了。」","「那是家教的份。这是我接下来要命令妳的份，妳收下。」","她不愿意接受我的说词，我虽然想硬把五千圆塞给她，她却不肯收。不仅如此，她还踢我的腿，清楚地说了：「我不需要。」","我坐到仙台同学旁边，把无处可去的五千圆钞票放在我们两人之间。","「仙台同学，听我的话。」","这其实是不在我们规则里的行动，所以她当然可以拒绝我。实际上，仙台同学的确没有收下我的五千圆。放在床上的五千圆纸钞一直被我和仙台同学夹在中间，无所适从地躺在那里。","可能没办法了。","在我死了心地朝五千圆伸出手时，仙台同学刻意要引人注意似的大叹了一口气，然后蹬了地板，发出「咚」的一声。","「——虽然不是要做什么都可以，不过妳那么想碰我的话，就碰啊。」","她放弃挣扎地说，转身面向我。","她没有指定我可以摸的地方，还有可以摸她的方式。","我静静地摸了她的脸颊。","没听到她说不行或是讨厌的声音。我用指尖一路摸到她的下颚，然后用同样的方式摸了她的嘴唇。我试着把脸凑近，她也没有开口抗议，所以我就这样把嘴唇叠了上去。","可是我只有轻轻碰一下，马上就退开了。我连交叠的唇有多柔软、多温热都不知道地看着仙台同学，听见她不满的声音。","「我觉得妳刚刚那样不叫碰。」","「妳没说只能用手碰妳。」","「妳真的很让人生气耶。」","尽管她的语气也可以解释成在生气，她却仍坐在床上没动。没有逃离我身边，继续坐在那里。","所以我又用嘴唇碰了一次仙台同学。","她不是朋友，所以就算接吻也没关系。","这或许是诡辩，但仙台同学也吻过我好几次了，所以我想她也没资格抱怨。而且讨厌的话，她只要逃开就好了。","我比刚才更用力地把嘴唇叠上去，确认她嘴唇的触感。","比任何人都更贴近我的仙台同学的嘴唇，跟几天前一样柔软。","明明有走在太阳底下，应该也混了些汗水的味道才对，她身上却传来好闻的洗发精香味。","嘴唇和嘴唇紧贴在一起。","我不懂这么简单的事为什么会让人觉得舒服。而且我也不知道，我变得更想触碰、接近仙台同学的原因是什么。","再一下下。","我继续行使可以触碰她的权力。","我抓住仙台同学的手，把嘴唇又更加紧贴上去。比起柔软，更能感觉到她的体温。我让嘴唇离开她后，她用枕头打了我的头。","「这个，不能由我主动吗？」","仙台同学抱着枕头看我。","「不行，因为仙台同学会做些多余的事。」","只是接吻的话还没关系，可是她不是这样。我命令她，她也会企图做些超出命令范围的事。真要说起来，仙台同学根本不该问我这种多余的问题。她该做的事情是拒绝我。","如果她想安稳地度过所剩无几的暑假，就该这么做。仙台同学却说得像是要把接吻这件事纳入日常生活的一部分。","「不做多余的事就可以？」","「今天不行。」","「这意思是如果不是今天，改天或许就可以？」","「仙台同学妳很烦耶。」","我把脸凑过去，仿佛要堵住就光会乱说些废话的仙台同学的嘴。","「宫城。」仙台同学叫了我的名字。","然而我没回话，吻了她。","〔本话含插图〕"]},{"t":"幕间　下雨天的宫城对我做的事","p":["今天原本应该是阴天的。","我一手拿着伞，看着校舍玄关的另一侧。","气象预报只是在预测未来的天气变化，不是绝对准确的情报，所以我并没有因为外面在下雨而吃惊。毕竟梅雨季还没结束，原本是阴天的预报变成了雨天，也不过就是这么回事。我其实想说可能会发生这种事而带了折伞出门，所以没有任何问题。","——本来应该是这样的。","今天就算手上有伞，我也不想走出学校。","校舍玄关外和校舍内是截然不同的世界。","放学后，在我等被老师叫过去的羽美奈时下起的雨，仿佛挟着莫大的恨意，狠狠淋湿了整座城镇。区区折伞感觉根本派不上用场，令人不禁犹豫是否该走出校舍。走到外面绝对会淋湿。先不提有父母开车来接她的麻理子，但和带伞来的男朋友一起走回去的羽美奈，应该已经淋得一身湿了吧？","「该怎么办才好呢？」","如果接下来的目的地是自己家那就好了。不管淋得多湿，只要冲个澡，换套衣服就没事了。但我接下来必须去的地方是宫城家。虽然只要跟她说一声，不管是浴室还是衣服她应该都会借我，可是我不想跟她借。毕竟她八成不会二话不说就借我，命令的内容感觉也会变得很不像话。","我稍微犹豫了一下之后，拿出了手机。","雨下太大了，我今天没办法过去。我打出这条讯息，但在传出去前又删掉了。","传讯息是宫城该做的事，不是我该做的。","没人会说欢迎回来的家，和有态度冷淡，却会端麦茶出来给我的宫城在的家。","哪边待起来比较舒服，不用想都知道。","我想被雨淋湿说不定只是无关紧要的小事。","我收起手机，决定等到了宫城家之后再去思考衣服的问题。我撑开伞，走出校舍玄关。如我所料，折伞根本派不上用场。用打翻整桶水来形容是太夸张了点，但是让人不想走在外头的大雨淋湿了我。","雨实在下得太大了。","尽管如此，我的双脚还是没朝着自己家前进。我加快脚步，走向会用领带把我绑起来，叫我舔她脚的宫城的家。我对听从她命令这个规则没什么不满，却无法理解即使被大雨淋了一身湿，还要去找她的自己。","在看不清楚前方的滂沱大雨中，我逐渐接近宫城住的住宅大楼。","制服好冰。","虽然现在是七月，但穿着湿透的制服，依然会觉得夏天是非常遥远的季节。","最近的我们正朝着不好的方向前进。","想回头的话就要趁现在。","现在还来得及。","我心里明明这么想，双脚却不肯放慢速度。","等我回过神来，我已经收了伞，站在宫城住的住宅大楼大厅里，机械性地按下门铃。不高兴的宫城打开了大厅的门锁，我搭上电梯。湿透的制服上衣黏在身上，感觉很不舒服。我忍着没叹气，在六楼出了电梯，走进宫城家之后，一道毫无起伏的声音迎接我。","「妳没带伞吗？」","「看就知道我有带了吧？抱歉，不过妳可以借我一条毛巾吗？」","「妳进来吧。我借妳衣服，妳去里面换。」","宫城在玄关理所当然地说道。","「这样会弄湿妳家走廊的喔？」","无论是谁来看都知道我浑身湿透了。我脱下鞋子往前走一步，就会在走廊上留下一个湿答答的脚印。走两步就会有两个。我应该会留下很多脚印，制服也会滴水。即使用毛巾擦过制服，说不定还是会弄湿走廊，但有擦总比没擦好。","「没关系。弄湿也只要擦干就好了。」","宫城看着我，表情过度认真地说。","「不好啦。借我毛巾。」","「那我拿毛巾跟衣服过来，妳在这里换衣服如何？」","「在这里？」","「在这里。反正这里除了我之外没其他人，也不会有人过来。而且就算用毛巾擦过，衣服也不会干。仙台同学穿着制服进来的话，还是会弄湿走廊跟房间吧。」","她说得没错。","毛巾只不过是一种心理安慰。即使手脚只要擦一擦便能暂时解决问题，但湿透的制服就算用毛巾擦过也毫无帮助。跟她借了毛巾，我也顶多就是不会留下脚印而已。","这些事情我都明白，但我之所以不想照做，是因为她的话不全是对的。","这里是宫城家的玄关，玄关不是脱衣服的地方。而且除了宫城之外没有其他人，也不会有人过来的这个家里，有宫城在。在我眼前，有个正在看着我的宫城。","「我会先回房间」或是「我会先离开这里」之类的……","既然要叫我在这里换衣服，我觉得宫城应该补上这些话才对，她却没说，而且她看起来像是刻意不说那些话的。在我眼中看来，宫城很坚持「自己要待在这里」，让我不想照着她的话做。","「我没有在玄关脱衣服的嗜好。」","宛如要否定宫城的话语，我如此表示。","「妳担心会弄湿走廊的话，就在这里脱啊。」","「借我毛巾。」","我清楚地告诉她我现在的期望。","宫城以前也解开过我的衬衫扣子好几次，不过那不是我自己解开的，所以没关系。可是今天不一样。我得凭着自己的意志，解开衬衫的扣子，脱下制服才行。而且还是在宫城也在的这个地方。","明明不是命令，却得在看起来很坚持要待在这里的宫城面前脱下制服这件事，跟在学校换衣服不一样。这会让换衣服这件单纯的事具有别的意义，于是我看着她，用眼神否定了她的意见。","「我去拿过来，妳在这边等我。」","不知道她是死心了还是有其他在意的事，宫城这样说完后，就为了拿毛巾过来而走进她的房间。","「……制服，该怎么办才好呢？」","毕竟穿着很难过，我是很想换掉。","我知道自己其实该顺从宫城要借我衣服的好意，就算她人在这里，我也只要换衣服就好了。会介意要凭自己的意志主动脱衣服这件事反而比较奇怪。","要是没下雨就好了。","如果是好天气，宫城就不会叫我脱掉制服。我不会觉得又湿又冷的制服很不舒服，也不用试着去挖出藏在她话语背后的用意了。","「啊～真是的。」","我拿下绑在头发上的发圈。","就算接吻，我们之间也没出现多大的变化。虽然她舔了我的耳朵、用领带绑住我，说什么「因为仙台同学很下流」这种话，但也就只有这样罢了。","只是这些事情单方面地累积在我这个人被命令的人身上，让我的意识有一点点被牵着走。我明白，我太在意了，是我放大了那些不用在意也无所谓的事。","我持续想着这些去想也是白搭的事，这时宫城从房里走了回来，随着一声「拿去」把浴巾递给了我。","「谢谢。」","我道谢并接过她递来的东西，擦拭头发。","「仙台同学，妳的制服怎么办？」","宫城直盯着我问。","看来她没有不看我这个选择。","「我用毛巾擦过就好了。」","「才不好。」","「宫城妳很不死心耶。」","「我借妳衣服穿，妳脱掉啦。」","「……妳就那么想要我脱吗？」","「没错。这样下去妳会感冒。」","在被撑伞也没用的大雨淋湿的情况下走到这里。","湿掉的制服也没脱下来。","我想就算我已经感冒了也不奇怪。","「妳不要动。」","宫城抓住我的手，静静地说。","她的视线紧黏在我湿透的制服衬衫上，不用说我也知道她想要做什么。","「这是命令？」","我这样一问，她理所当然地回我：「对，命令。」","接下来会发生的，八成是与换衣服相去甚远的行为吧。","我觉得我应该要甩开宫城的手。","在玩寻找橡皮擦这个蠢游戏的那天，我应该对宫城说了要把「不能脱我衣服」这条项目加进规则里，所以我只要说这是违反规则的行为就好了。这样一来我就可以无视「不要动」这条命令。","可是我没有开口，宫城松开了抓着我的手。我重获自由的手也没有推开宫城，自然地垂下。我明明没说可以，她的手却解开我的领带，然后解开了衬衫上我还没解开的第二颗扣子。","我有理由可以接受她的命令。","继续穿着湿透的制服会感冒，所以要换衣服。","这没有什么不对，是正确的行为。","「我没带可以换穿的衣服过来。」","我看着没从我身上别开视线的宫城，向她说道。","为了证明这是正确的，需要替换用的衣物。","脱下湿透的制服之后，我必须穿上干衣服才行。","「我刚刚就说了，我的衣服借妳穿。」","宫城的手碰上我平常在这个家里不会解开的第三颗扣子。","她脸上的表情看起来不是很开心。","这个状况和这样的她都不好玩。说是这样说，被命令的我也无法抵抗。","宫城的手缓缓解开第三颗扣子，朝着第四颗扣子移动。","我很犹豫该不该提出不能脱我衣服这条新规则，但我想起了这条规则还处在模糊地带的事。实际上我只有叫她加进规则里，并未得到她的同意。所以我不阻止她的手也没关系。脱掉湿透的制服是理所当然的事。我没办法在别人家的玄关脱掉制服，宫城只是在帮忙我而已，她是在做正确的行为。","这行为没有哪里不对。","在我确认行为的正当性时，宫城的手已经解开了所有扣子，打开了我的衬衫。她的视线仍看着我，紧黏在我被雨淋湿的身体上。","无所谓。","我跟宫城同班过，有在同一个地方换过衣服。虽然我没有她以前穿着怎样的内衣，或是身材怎么样的记忆，但有这样的过去在，所以只是内衣被她看见也没什么大不了的。明明会去在意这件事还比较奇怪，我却在寻找就算给她看也不要紧的理由。","今天的我脑袋不太正常。","可能是因为下雨了，也或许是因为宫城在看我。说不定是身体着凉了，让我无法做出正确的判断。","宫城的手碰上了我的内衣肩带。","她顺势微微挪动了我的肩带，让我的身体瞬间僵住。","我觉得我应该要阻止她。可是她命令我不准动，所以我不能动，而且我不仅制服，连内衣都淋湿了，所以就算被她脱掉，我也无可奈何。","没错，这是无可奈何的事。","我吸了一小口气后吐出。","但宫城的手没有继续挪动我的肩带，也没有脱下我的内衣，就这样收回了。","「妳不抵抗吗？」","宫城都做到这种地步了，还在说这种靠不住的话。","「是宫城妳命令我不准动的吧？」","「妳反抗一下如何？」","「妳如果打破我们的约定，我就会反抗。」","「原来这不算违反规则啊？」","「要不是我制服全湿，我就会揍妳了。」","下雨，制服湿了。","放着不管会感冒。","我有很好的理由不去遵从那条不确定到底有没有追加上去的暧昧规则。","「表示这次是特例？」","「对。毕竟这样穿着我会感冒。」","「但我还没给妳五千圆。」","宫城真没骨气。明明是她下命令决定要做什么的，她却在寻找可以用来逃避的话语。","「妳打算不给我吗？」","「等等给妳。」","听完这犹如藉口的台词后，宫城的掌心贴到了我的胸上。","好温暖。","可是很奇怪。","宫城那只温暖了我的手明明是贴在我凉透了的身体外侧，身体里却好热，热得像是她直接碰到了我的心脏一样，让我想逃离现场。但是我没有挪动身体。我的身体宛如跟宫城的手紧黏在一起，动弹不得。只有心脏动得比平常更快。","「仙台同学好冰。」","宫城喃喃说道。","「因为我淋得一身湿啊。」","我回了句理所当然的话，盯着看着我的宫城。她仿佛没注意到我的视线，用手摸了我的脸颊、嘴唇，又收了回去。","我们正在远离所谓「正确的行为」。","脱掉湿透的制服这个行为，还可以套用这是为了避免我感冒的说词。可是更进一步的行为就无法解释了。宫城超乎必要地凝视着我，以及用手触碰我的脸颊和嘴唇，这些都不是正确的行为。","宫城给我的理由消失了。","所以我觉得我必须阻止宫城，不应该接受她。我明明这样想，却因为宫城摇摆不定，害我也受到影响，跟她一样摇摆不定，继续容许她的行为。","如果是用领带绑住我的手这种过分的命令，我就能开口抗议。假如她毫不犹豫地脱掉我的内衣，我也会说我才没办法陪她玩这些，早就回家了。","然而就因为她没做这些事，反而暧昧地下了命令，迟疑地停下了手上的动作，我才会被她给牵着走。","现在也是，明明停下来就好了，我的手却违背我的意志伸向宫城，抚上她的脸颊。","「宫城好温暖喔。」","这是不正确的温暖。我冰凉的身体应该要继续让它凉下去，这样一来，我体内发烫的部分也会冷却下来。我都知道，但我的手还是继续触碰着宫城，犹豫着该不该像她所做的那样，抚过她的嘴唇。","宫城的手碰上、抓住我的手。","我被她一把拉了过去，她的脸近在咫尺。","我们四目相对，我大概知道她想做什么。","若是我就这样闭上眼，两人的嘴唇便会碰在一起。","宫城又靠近了一点。","映在我眼中的她靠得太近，让我看不清她的全身，但有一件事我很清楚。","宫城明明在家，却穿着制服。","她总是这样。","我没看过宫城身上穿着制服以外的衣服。","我想在这个家里看到不同于平常的她。","比方说跟我一样，解开领带，衬衫的扣子也全都解开了的宫城。","现在这个只有我被脱衣服的状况太不公平了，所以她最好变得跟我一样，脑海中浮现出这种愚蠢的念头。","不知道是不是我不好的念头传达给她了，宫城松开我的手，往后退开，然后又打开了我的衬衫。","宫城呼出一小口气。","她的唇碰上了我的胸口，用力地吸吮，我和宫城的体温交融。雨似乎冲走了我的理性，让我想再多碰触温暖的宫城，我抓住了她的肩膀。","——不行。","就在我这么想，同时想把宫城的身体拉得更近的时候，她的唇从我身上离开了。","宫城的指尖碰上方才嘴唇触碰的位置，轻柔地抚过后用力地按压，那里恐怕留下了跟她以前留在我手臂上一样的红色痕迹。而她正在用指尖确认那个痕迹。","我想宫城也知道，但这和她留在我手臂上的吻痕不同。就算痕迹消失，也会在心里留下不会消失的污渍。不只我，大概、一定也会留在宫城心里。那污渍会作为尽管有些模糊地带，仍称不上有遵守规则的这个行为所带来的报应，持续残留着。","宫城又把脸凑近过来。","嘴唇贴上我的肌肤，我在抓着她肩膀的手上施力。","「妳不是要脱我衣服吗？」","宫城像是对我的声音起了反应，抬起头。","「因为我觉得痕迹不会留很久。」","她没回答脱衣服这个问题。我该为此感到安心，实际上也松了一口气，内心某处却有些失望，我把因为思绪迷失方向而差点脱口而出的叹息给吞了回去。","「这种的马上就会消失了，无所谓。」","我这样说完后，宫城一脸尴尬地离开我身旁。","「我去拿衣服过来。」","随着微弱的声音，宫城转身背对我。","她的背影让我想起了我在书店里遇见宫城的那一天。","我在感觉好像会下雨的那天所看到的宫城的背影，虽然和今天的背影不同，但我在看到她背影的那天，得到了「宫城的房间」这个容身之处。","那我今天得到了什么呢？","——还是别去思考比较好。","我用力抓紧了敞开的衬衫。"]},{"t":"第8话　不是朋友的宫城做的事","p":["和宫城玩了假扮朋友游戏，跑去她家，跟她接了吻。","我昨天做的事情就这些，宫城给我的五千圆钞票在存钱筒里。五千圆是接吻的代价。而且以代价而言，五千圆太多了。","我不需要。","在接吻后我虽然这样说了好几次，宫城却不肯退让。她硬塞给我的五千圆钞票让存钱筒稍微变得重了一点点，我今天在没有睡好的情况下，便来到了宫城家。","简单来说就是因为睡眠不足，脑袋无法运转。","虽然不到会想打瞌睡的程度，但我的眼皮好沉重，于是躺在宫城床上。闭上眼睛后，我却在意起平常不在意的宫城的味道，本来应该很困的脑袋清醒过来。","我真的觉得很烦。","睡不着的理由有很多。","就算把这些理由都说出来，也无法解决睡眠不足的问题，所以我不会一条条列出来，不过大致统整起来就是宫城的错。就连念书到一个段落，正在休息的现在，我也因为她而无法小憩片刻。由于房间的主人不在，我没人可以抱怨，只能在床上翻身。","宫城现在应该在厨房，在空了的玻璃杯里倒入汽水和麦茶。","自从我告诉她我讨厌喝汽水后，宫城就像是只记得住一件事的傻瓜，每次都准备麦茶给我。她从没问过我有没有其他想喝的东西，或是我喜欢喝什么。我们已经相处超过一年，到现在都还在一起，我是觉得她可以对我更感兴趣一点吧？不过我也没问过宫城这些事情，所以我跟她可能也是半斤八两。","我紧闭双眼，竖耳倾听，可以听见走廊上的脚步声。","接着很快就传来了开门声，耳朵里响起宫城无奈的嗓音。","「仙台同学，妳不要睡觉啦。」","「我醒着。」","我依然占据着她的床铺回答，听见应该是她将玻璃杯放到桌上时发出的硬物碰撞声。","「妳眼睛没张开啊。」","「我在休息，不张开眼睛也没关系啦。」","我翻身背对着声音传来的方向，弯起身体。","「仙台同学，起来啦。」","声音从比我想像得更近的位置传来，一只手轻轻地贴上我的脸颊。","我睁开眼，只见宫城坐在床前。","虽然昨天也是这样，但是说我们当不成朋友的宫城会轻率地碰我。","明明总是一副心情不好的样子，还这么恣意妄为。","昨天的宫城好像看我很不顺眼，打算抛下我就回家。也不管是她说要玩假扮朋友游戏，我都在配合她，不想惹得她不高兴。我到现在还是不知道我是哪里做错了。","以前宫城有对我说过我们不是朋友，可是她这次不仅对我说了类似我们往后也不可能成为朋友的话，甚至还说我很恶心。","这实在让我不太高兴。","她这个当事人看起来完全不在意也让我很生气。然而朋友这个词太不适合我们了也是事实。","要我说是哪里不适合，我也很难说。","气氛、距离，感觉一切的一切都偏离了朋友。","朋友这个词看起来就像是最接近又最遥远的东西，没有办法完美地嵌入我们之间。没有地方可以容纳这片似乎太小，感觉又太大了的拼图。","「习题还没写完。」","宫城静静地说，手从我的脸颊滑到了脖子上。在我说这样会痒之前，停在了我的锁骨上，用手掌轻轻地压着那里。","「妳先写。」","「我有地方不懂啊。」","自己开口提了习题的事，宫城却依然面向着我不动。该写的习题在她身后的桌上。她看的方向不对。","我跟宫城如果没在书店碰面，别说当朋友了，连话都说不上吧。我应该连像这样被她碰的机会都没有，就会毕业了。","她本来就不是会跟我成为朋友的类型。尽管如此，我原本还是觉得如果我跟她的关系能定调为朋友，那会是最好的结果。然而到了现在，我认为我们已经不可能迎来那样的结果了。","我把手叠放在宫城放在我锁骨上的手上。","「干嘛？」","因为宫城用低沉的声音这么说，打算把手抽走，我用力握紧那只手问她。","「妳现在有觉得心跳加速吗？」","「……现在？」","「对，现在。」","「……现在是没有。」","「现在没有？」","「仙台同学妳呢？现在有觉得心跳加速吗？」","「应该没有吧。」","她在我身旁虽然会让我意识到她的存在，但我现在并没有心跳加速到会觉得心脏很吵的程度。顺带一提，我也不会想跟宫城手牵手走在街上。可是对于宫城的身边成了我的容身之处这件事，我没有任何不满，也不觉得有哪里不对劲。","我放开宫城的手，用指尖碰了碰她的嘴唇。","「妳今天也想要接吻吗？」","我静静问她，她也静静地回答我。","「……我不能这样想吗？」","「这个嘛，谁知道呢？」","这是正确的。","这是不对的。","要是所有事情都能分到其中一边就好了，但这世上有无法分类的东西。而存在于我和宫城之间的事物，绝对是无法分类的比较多。","无法漂亮地用颜色来划分，带着混浊色彩的回答过于暧昧，很不稳定。如果硬是去划分感觉会坏掉，就此消失，让我很害怕。既然这样，比起去分类，放着不管还比较好。而且就算我回答「妳不能这样想」，宫城也不会听我的话。","「宫城。习题妳哪里不会？我教妳。」","我爬起来，看向桌上。","教完宫城说她不会的问题之后，预习新学期的课程内容，今天该念的份就念完了。","我想着这些事情打算下床，宫城却早我一步站起来，从书桌里拿了某个东西出来。","「拿去。」","宫城没好气地说，拿了一张五千圆钞票给我。","看来习题后面要怎么写似乎不重要了。我坐到床边，看着宫城。","「我不需要。」","「妳收下。」","「妳觉得只要给我钱就可以了对吧？」","「我觉得没错啊。」","宫城的话「既正确的又是错误的」，无法分类。","要维系我们之间的关系的确需要五千圆。但是暑假不需要这五千圆。我已经用家教费的名义收她五千圆，再多就太多了。","「妳如果有想命令我的事情，就命令我啊。反正我最近也没怎么教妳念书，就当作家教费里面包含了命令我的权力吧。」","说她已经不需要我费心了听起来好像有点嚣张，不过宫城对我说「这题我不会」的次数明显减少了。她新学期的成绩应该会变好。","「这个跟那个是两回事，所以妳收下。」","宫城一副理所当然的样子，把五千圆钞票放在我的大腿上。","这张五千圆跟暑假前的五千圆不同。","照事情的走向来看，跟昨天的五千圆是同一种。","在命令后会发生的事情多半是接吻，只是接吻的话，我不需要这五千圆。直接包含在家教费里，我在心情上会觉得比较轻松。我觉得她特地付的这五千圆，会让没什么大不了的事变成大事。","「我不需要。」","我态度强硬地说完后，只见宫城眼神闪烁。","我看出她眼中的不安，大叹了一口气。","她八成是觉得她都做到这种地步了，不希望被我拒绝吧。","我把放在大腿上的五千圆对折再对折，先放到了床上。","「我收下了，妳命令我吧。」","我用不带起伏的语气说完后，宫城露出了安心的表情。","反正她也做不出什么大不了的事。","明明会嚣张地命令我，宫城却有着胆小的一面。","「那么……」","宫城这话像是命令的发语词，她直盯着我看，然后过了一会儿，说出了「不要动」这个我已经听过好几次的命令。","我就知道。","接下来会发生在我身上的事情，一定跟我预想的一样。","「宫城。」我开口叫她，看着她。","已经到了该说是傍晚的时间，从窗外射进来的光线还是很亮。","看就知道太阳仍用接近中午的难受高温照耀着城镇。","「窗帘不用拉起来吗？」","窗帘有没有拉起来不过是小事，我不认为会有人盯着住宅大楼的某间房里看。可是今天我连这种小事都会在意。","「妳不要说话。」","宫城嫌麻烦地说，拉起窗帘，打开了房间里的一盏灯，然后站到以床代替椅子坐着的我面前。","我必然得抬头看着她，宫城伸手摸了我的头发。她用手梳了梳我没编也没绑的头发，接着一脸没自信地把嘴唇凑了上来。","这就是她让我搞不懂的地方。","之前明明理所当然地把脸凑过来，今天看起来却很犹豫要不要靠近。明明硬是塞给我五千圆，做好了要接吻的准备，却表现得优柔寡断，像是第一次要接吻一样，实在太奇怪了。","「妳闭上眼睛啦。」","我看着犹如在家门前徘徊的野猫，不敢一鼓作气地吻我的宫城，她便粗鲁地这么说。见我即使如此仍没闭上眼，宫城便用手掌遮住了我的眼睛。明亮的房间一下子变暗，柔软的触感落在嘴唇上。","跟昨天一样。","有些干燥的嘴唇轻轻碰上，接着就马上和遮住我眼睛的手一起离开了。","嘴唇相触的时间真的非常短暂，记忆中只留下了跟泡芙一样轻飘飘的触感。我和宫城已经接吻过好几次了，她却只会用这种轻触即止的方式吻我。应该说我若是做了更进一步的事，她就会表现得很排斥。之前她就咬了我。然而她明明是这种态度，却会用不满足的表情看着我。现在也是。","「宫城。」","我叫了她的名字并伸出手，但在我碰到她之前，她就下了命令。","「妳就这样坐着别动。」","宫城这么说，坐到我身旁。不过就算她没下这种命令，我也不会逃走。","「要我坐着是无所谓，妳要做什么？」","她没回答我的问题，但像是要取代回答一样地摸了我的大腿。","早知道我就不要穿什么短裤过来。","她轻轻移动的指尖令我后悔，要是我挑的是其他衣服就好了。","毫无滞碍地滑过我肌肤上的手，感觉不像有什么更深的意图。类似医生在摸患者那种事务性的摸法。尽管如此，一旦被摸，我还是会很在意她的手。","大概介于不舒服和痒痒的之间。","我的大脑是这样理解宫城的手所带来的感觉。","她的手从大腿一路滑往膝盖。","我抓住了宫城毫不客气地继续抚摸我的手。","「我应该有叫妳不要动吧？」","她压抑着感情这么说，甩开我的手。","「这样很痒，我没办法。」","我告诉她我没遵从命令的原因后，宫城皱起眉头。","她一脸不满地看了看我，摸上我的膝盖。","果然还是有种好像不舒服，又好像痒痒的，但说不上究竟是哪一种的感觉，于是我抓住了宫城的手腕。她可能不高兴我这么做吧，宫城甩开我的手，一下子凑过来。拜此所赐，我连闭上眼睛都来不及，就感觉到了她的嘴唇。","她的手搂住了我的腰。","我身体一颤地闭上眼后，她贴上来的嘴唇触感变得更为清晰。相连的部分热得仿佛快要融化，让人几乎要失去理性。","先不提这种命令到底是好还是不好，我对接吻没有意见。不过我觉得我不太喜欢被动地让她吻我。","跟主动吻她的时候相比，让她吻我时，我会变得更想碰宫城，有种自己在做坏事的感觉。虽然都一样舒服，但总觉得心情静不下来。","我用力握紧宫城的手臂后，她的嘴唇退开。我像是追过去似的把脸凑了过去，她却用手掌捂住了我的嘴。","「仙台同学，妳不要擅自乱动啦。」","我把她的手用力剥下来，开口问她。","「我可以问妳一个问题吗？」","「不行。」","「妳为什么想要接吻？」","我无视立刻回答的宫城，直接问她。","「我不是说了不行吗？」","她虽然用低沉的声音回话，感觉没打算要回答我，却停顿了一下，又一副这种事情还用我说的样子，小声地补上一句。","「妳要是不想跟我接吻，逃开就好了啊。」","「宫城妳下了命令，所以我逃不掉。」","「那意思是妳不想接吻吗？」","「妳觉得是这样吗？」","「是仙台同学妳说要提出问题前，得先回答问题的吧。」","她把我以前说过的话给搬了出来。","「那我回答妳。妳不要下命令，直接吻我看看啊。」","「意思是叫我自己去试，确认答案？」","「没错。」","我知道。","这种时候宫城绝对会逃避。","所以她不会吻我。","「晚餐妳做点什么来吃吧。」","如我所料，宫城像是要转移话题，小声地说。","明知道答案还这样，真是没骨气。","在做法式吐司的那天，宫城主动想接吻时我没有逃开，那就是答案，我并不讨厌和宫城接吻。","「不接吻了吗？」","「我肚子饿了。」","「我是觉得要吃晚饭还太早了。」","我试图抓住一直在转移话题的宫城，她却犹如要逃离我似的站了起来。","「早点吃又没关系。」","宫城斩钉截铁地说完，走出房间。这样一来我也只能跟在她身后走去厨房。接着我为了照她的话做晚餐而打开冰箱，确认里面有些什么。","「冰箱里只有蛋耶。」","我对坐在吧台桌旁的宫城说。","「不是空的就好了吧？」","「应该说宫城妳平常到底都吃些什么过活啊？」","「吃我晚上会拿出来给妳吃的那些东西。」","「……我想也是。」","毕竟我打开过好几次的冰箱里几乎没有任何食材，我也不觉得那只是巧合。我在这个家里吃过晚餐再回去的日子，她拿出来的都是调理包或冷冻食品这种不用费功夫料理的东西。而且宫城不擅长下厨，也没打算要精进厨艺。","尽管窥见了她称不上健康的饮食生活，但到目前为止我也没看过宫城身体状况不好的样子。我不知道她往后是否同样能常保健康，不过这并非我该干涉的问题。虽然我是觉得要我偶尔做饭给她吃也不成问题，可是宫城很少像今天这样希望我做饭。","我考虑到冰箱里的食材和以前做过煎蛋卷这件事，从没那么多的选项中挑了蛋包饭。","我把平底锅放到炉上，打开炉火加热，再倒油进去。","我是觉得要是再有些配料就好了，然而没有的东西我也变不出来，只能乖乖用从冰箱里拿出来的番茄酱炒饭。","我用做法式吐司时用过的快死掉的奶油把鸡蛋做成蛋包，放到番茄酱炒饭上。只是我好像把蛋包煎得太熟了，就算有模有样地用菜刀划开，蛋包也没有漂亮地摊开。","算了，反正吃进肚子里都一样。","我对隔着吧台桌望着厨房的宫城说：「做好了喔。」之后，把盘子和汤匙端了过去。","尽管觉得现在吃晚餐太早了点，我还是在她身旁坐下。「我开动了」这句话的声音重叠在一起，屋里响起汤匙碰到盘子时发出的碰撞声。我一口又一口地吃着蛋包饭，吃了约三分之一后看向身旁。","「是说宫城妳家一直都没人在，妳父母都什么时候回来？」","我小心不要涉入太深地试着问了一件我很在意的事。","「还没回来。」","她很小声地回了我一个有些答非所问的答案。","她至今为止都没说，表示这是她不想被人问起的问题，于是我只回了句：「这样啊。」便结束了这个话题。","既然她不想回答，我也不想多加追问。","我只是有一点想知道，宫城害怕一个人在家，担心可能会有什么东西跑出来的夜晚要到几时才会结束。","我用汤匙捞起失败的蛋包饭。","我并不期待我那些许的好奇心会得到满足。","我看着宫城默默吃着蛋包饭的样子，将汤匙送入口中。","今年的暑假感觉比去年更短。","一周里约一半的天数。","我想原因就出在我每周会去三次宫城的房间。","跟我和羽美奈她们共度的时间相比，我和宫城待在一起的时间更多。去年的这个时候我根本想不到会发生这种事。我不可能预想到，会有即使得改变在我第一次来宫城房间那天订下的「假日不碰面」的约定，也要来她房间的未来存在。","我阖上课本，说出在不知不觉间，已经成了我们共通暗号的话。","「要休息吗？」","「嗯。」","宫城简短回答后站了起来。","在我做了蛋包饭那天后过了将近两周，我们就像是煞车坏了的脚踏车一样，持续做着朋友不会做的行为。","「给妳。」","宫城拉上窗帘，拿了五千圆钞票给我。","这不是我想主动收下的东西，然而不知从何时开始，收下这五千圆被加进了规则里，所以我说了：「谢谢。」接过那五千圆。","我们没办法成为朋友。","我们不该两个人一起去看电影，搞得我们不得不承认这个事实。当不成朋友，变成了不清楚究竟是什么的关系这件事，成了我们触碰彼此的免死金牌。","就算我们在这个房间做的事情变多了，念书这个已经加进暑假里的行程依然存在。我们需要家教这个表面上的理由来改写假日不碰面的约定，持续在念书。","我们也不是每次碰面都会做这种事。","不休息的日子就是不做这种事的日子。","休息的日子就是会做这种事的日子。","我们没有说好，却顺水推舟地发展成这样了。我们其中一方会说出暗号。","我把接过的五千圆钞票收进钱包里，在床铺上坐下。宫城固定会坐的位置在我身旁，今天她也理所当然地坐到了我旁边。","虽说是朋友不会做的行为，我们也没做什么夸张的事。仅止于双唇相触的吻，犹如在碰骨骼标本一样稍微碰碰身体，这样就结束了。而且都是由宫城主动，因为她说不行，我不能主动做这些事。","真的没什么大不了的。","我没再穿短裤来这房间里就是了。","「仙台同学，转过来。」","我看着轻轻拉着我手臂的宫城，她又加了一句：「闭上眼睛。」我没理由要反抗她，便乖乖地照她的话做。","世界变暗之后过了几秒钟——","柔软的东西碰上我的嘴唇后又离开。","比起等待接吻的时间，接吻本身的时间更短。我睁开眼睛，听到她不满地说：「我没说妳可以睁开眼睛。」又被她吻了一次。","尽管两人双唇交叠已经成了理所当然的事，然而我现在仍旧不知道宫城想接吻的原因。","「妳眼睛就这样暂时闭着。」","这样说完，宫城便犹如小狗或小猫凑上来嬉闹那样反复地吻着我。","我越是觉得透过嘴唇传来的体温很舒服，就越是觉得我们在做不好的事情。我也不是想追求什么纯洁正派的关系，只是想到放在钱包里的五千圆钞票，便会觉得心里蒙上一层阴霾。","即使如此，碰上我的嘴唇感觉还是很舒服。我抓住宫城的手臂。","她的嘴唇退开，我睁开眼睛。","我追上去似的拉着她的手臂，让她的嘴唇接近我后，她别过头去。可是我就这样把嘴唇贴到宫城的脸颊上，结果腿被她踢了一脚。","「我已经说过好几次，叫妳别多做些有的没的了。还有，我没说妳可以睁开眼睛了。」","「是这样吗？」","「对。」","宫城语气强硬地说，瞪着我。","能下命令的权力在宫城手里，我没有那个权力。","「这种事情谁来做都行吧？又没差。」","我放开宫城的手臂，随口说道。","我并不乐意收下那五千圆，没办法老实地一直遵从宫城的命令。我数度违背她的命令，像这样被她给瞪着。","「一点都不好。」","我听到她开口否定我的说词，语气听起来却没那么不高兴。","我想这种事情也包含在休息的范围内。","这是打发时间的一环。","之所以会有不休息的日子，是因为宫城心里也有罪恶感吧。","这种事只会发生在暑假期间。","下周就会结束了。","不管是暑假，还是这样的行为。","等新学期开始，我们理应又会开始过着和第一学期一样的日子。","现在是因为时间太多了，事情才会变得不对劲。我们只是不知道该怎么跟不是朋友的对象，打发这段光是用来念书太过漫长的时间，","「仙台同学妳没在反省吧？」","宫城看着我，喃喃说道。","「我有啊。」","「妳就会说谎。等我一下。」","宫城站起来，打开衣柜。","她从里头翻翻找找地拿出什么东西后，转向我这边。","「我要过去了，妳转身背对我。」","说出这话的宫城手上拿着领带，我知道接下来会发生什么事。宫城手里那条我熟悉的制服领带，八成不会用在正确的用途上。","「妳等等要去学校？」","我没转身，开口问她。","「我不会没事跑去学校，而且要用这个的不是我，是仙台同学。」","「原来下这种命令也行啊？」","在暑假前的五千圆，是宫城用来买下我放学后的时间，命令我的代价。可是她在看完电影之后开始会给我的那种五千圆，带有不同的意义。命令后会发生的事可能是接吻，或是碰我的身体，我以为今天宫城也会用命令我的权力，来对我做那样的事情。","「妳说这种是什么意思？」","「用领带绑人的命令。」","「不管是哪种命令，都一样是命令吧？既然知道我要做什么了，妳就赶快转过去。」","走回我身旁的宫城打了一下我的肩膀。","「妳没打算换个使用方式吗？」","「妳不喜欢领带的话，我下次准备绳子怎么样？」","「那就免了。」","我们没有严格订定过命令可以包含哪些内容。","我虽然不想被她绑起来，还是坐在床上背对宫城，把手伸到背后。毕竟我收了五千圆，事到如今我也不认为自己能拒绝她。而且我要是继续做无谓的抵抗，感觉她真的会去准备绳子。这不是什么值得感激的事情，不过宫城在莫名其妙的地方下决定很果断。","被她拿特地准备的绳子绑起来，这我可笑不出来。好像要开始搞什么奇怪的色情玩法一样，很讨厌。而且宫城感觉会毫不犹豫地做出这种事，更是讨厌。","「明明就不用做到这种程度吧？」","我向宫城搭话，她正在用领带捆住我的手腕。","「因为仙台同学妳太不可信了。」","随着这句话，我感觉到缠在手腕上的领带被拉紧，捆住了我的手。可是宫城没有说已经可以了，也没叫我转过去。","我在被她命令之前转身面向她。","「我还没说妳可以转过来。」","宫城语调平板地说完后站起身，这次打开了五斗柜，然后拿了一条薄毛巾过来，站在我面前。","「妳还想做什么？」","「闭上眼睛比较好喔。」","宫城回了个答非所问的答案，拿手上的毛巾蒙住了我的眼睛。我反射性地闭上眼睛，毛巾压迫着眼球地缠绕上来。","「这也未免太过分了吧？」","为了不让我乱做其他事情，所以剥夺我的自由。","这想法我个人是不乐见，不过可以理解。","我却有点抗拒连视觉都落入宫城的掌控当中。","「谁教我不做到这种程度，仙台同学就不反省。」","「我有在反省了。」","「已经太迟了。」","宫城斩钉截铁地说完，用力绑紧蒙住我眼睛的毛巾。","「等一下，妳绑太紧了。」","我出声抗议，毛巾稍微松开了一点。尽管如此，我还是无法睁开眼睛，依然什么都看不到。","手腕被绑起来这还在我的预料范围内，但我没想到她会连我的眼睛都蒙住。我虽然思考了一下这算不算犯规，但我不太确定。不过我知道，自己也只能接受现况。","「宫城，不要做什么奇怪的事情喔。」","我为求保险起见地说。从身旁传来她的声音。","「我只会做跟平常一样的事。」","宫城虽然说得很笃定，却没有什么能证明她的话。一旦失去视觉，就会觉得什么都不可靠，我无法信任应该跟刚才一样站在我身旁的宫城。","「妳可以转过来了。」","我把身体转向声音传来的方向。","这虽然是废话，但我看不见宫城。","因为看不见应该看得见的东西，害我突然觉得这个房间里只剩下我一个人。我内心不安起来，想伸出手，却只让领带更深地陷入手腕，无法动弹。","「宫城。」","没人回应。","黑暗吞没了本来只有要念书的暑假，也吞没了应该在我身旁的宫城。","她一个人度过的夜晚也是这么暗吗？在我想着这种无关的事情时，应该是手的东西贴上我的脖子，我感觉到她的体温。","知道宫城好像就坐在我旁边，让我莫名地安心。","在看不见一切的黑暗当中，体温在我的脖子上爬行。","感觉不出有其他意图的手事务性地往下移动到我的锁骨处。","我以为她会做些不同于平常的事，然而就如同她本人所说的，她好像只打算做些跟平常一样的事。就算捆住双手、蒙住眼睛，宫城做的事情依然没变。我想她正和平常一样地触碰着我。","但我不觉得跟平常一样。","因为我失去了视觉。","我想原因出在这里。","宫城理应和平常一样的手，感觉却像是在吸取我体温似的蠢动着。方才让不安变成安心的手，带给了我不属于这其中任一边的感觉。缓缓移动的温度让我觉得很痒，想要拍开宫城的手，却受到领带的阻碍而没办法这么做。","「宫城妳很变态耶。」","我像是要逃开爬上肌肤的温度，呼出一口又细又长的气。","绑住对方的手，蒙住对方的眼睛。","居然对原本的同班同学做这种事情，我觉得宫城的癖好真的很奇特。虽然她之前就有绑过一次我的手，可是现在比那时候更不正常。","「妳安静。」","我听见她冷漠的声音，手停在了我的锁骨上。","「想要我安静的话，宫城妳就说点什么啊。」","「我不要。」","宫城冷淡地说道。","她真的很小气。","说话又不会害她少块肉，稍微动一下嘴也无所谓吧？一直不说话我反而静不下来。","然而宫城不肯开口。","她就这样沉默地让手滑动着。","我隔着布料感觉到她的体温。","她把手放在锁骨下方，心脏上方一带的位置。","除了付我五千圆，下达会导向接吻的命令这个不道德的行为之外，宫城是个守规矩的人。接吻也只是轻轻碰一下，只会抚摸我的身体表面。而且每次都马上就结束了，时间短到感觉根本不值五千圆。","我以为今天也会是这样。","宫城却没有停手。","像是嘴唇的东西碰上我的脸颊。","放在我心脏上的手缓缓移动，抚上我的肩头。脸颊表面感觉到的温度离开，这次换脖子感觉到了温热的气息。","接着马上就有什么柔软的东西贴上了我的脖子。","好几次、好几次、好几次。","脖子随着小小的声响不断被她吻上，我的意识集中到那里。与其说舒服，更像是有蒲公英的种子黏在那里一样，感觉痒痒的。只有宫城触碰的地方令人在意，逐渐发烫。好像她正在对我做什么特别的事一样，让人无法保持平静。","因为眼睛被毛巾给蒙住，被迫失去光明，让我的感觉变得更为敏锐。","她带来的感觉比平常强烈了好几倍，我简直无法承受那些至今为止我都接受了的事情。","我就算想推开宫城也无法推她，只能让获得自由的唇代替失去自由的手发声。","「宫城，妳够了喔。」","她似乎没打算要回答，温度仍未离开我的脖子。","我想说既然这样，朝应该是宫城的腿所在的位置踢了一脚后，一直反复吻我的唇终于离开了。","「好痛。」","也不管我只是轻轻踢而已，宫城夸张地说道。","「妳打算做到什么时候？」","「我没必要回答妳。」","随着她冷淡的语气，一股温度贴上了我的脖子。","从那股温度的尺寸和柔软度来判断，我知道那是她的手。","指尖抚摸着我的下颚，四处摸索，犹如在寻找我的血管。","我有点想看她现在是什么表情。","我碰她的时候，宫城曾露出过难以言喻的表情。最近次数虽然变少了，但我很在意现在她脸上是不是也挂着那样的表情。","然而我一方面也觉得，可以的话我不想看到她那样的表情。","我差点冒出眼睛被蒙住或许也是件好事的念头，但我马上就后悔了。","宫城的嘴唇碰上我的脸颊，手抚过耳朵，轻柔地滑过我的肌肤。","比起她的表情，我又开始在意起她的嘴唇跟手指。","她明明用很单纯，没有其他意图的方式摸我，手和嘴唇却比刚才更给我一种痒痒的感觉。我虽然试着动了动被领带绑住的手腕，想制止宫城的手，可是解不开束缚着我的布条。宫城的手仿佛在测试我的理性，持续移动着。","从脖子到肩膀。","抚摸我的手臂，爬上我的腰。","爬到身上的手往下来到大腿，隔着布料继续抚摸着我。","介于不舒服和痒痒的之间。","宫城的手带给我的感觉就像这样，之前也都一直是这样。然而不知不觉间，一股不应出现的感觉开始企图闯入这两者之间，我严肃地对不肯停手的宫城说道。","「宫城，住手。」","这绝对不妙。","就算她摸我的方式就像是事务性动作，我也觉得不能再让她继续这样摸下去，宫城却似乎没打算要停手，继续抚摸着我。","「已经够了吧？妳有说不会做奇怪的事，妳忘了吗？」","「这不是奇怪的事，我做的事情跟平常一样啊？」","「妳在做奇怪的事。」","「我没有。」","宫城如此断言。","她所做的事情的确跟平常一样。只是我们对「奇怪的事」定义不同而已。但我不打算跟她讨论「奇怪的事」的定义，也没办法说出我会拜托她停手的理由。","「那我换个说法，妳再做下去就违反规则了，这样妳懂了吗？」","我这样问她后，宫城停下了手上的动作。","「我又没脱妳衣服，只是摸妳而已耶？」","「是没错，但还是违反规则了。妳再继续下去我真的会生气喔。」","我们的规则不只有不能脱衣服。","我们也说好了不能施暴、不能上床。","我虽然会听她的命令，但我不是来卖身的。","所以她再继续下去，就违反规则了。","「妳根本就已经生气了啊。」","「妳这样想的话就快点住手。」","我知道她现在做得一副理所当然的行为，最后会导向什么结果。而宫城自己也知道吧。","既然我们双方都知道接下来会发生什么事，我们就不该走到那一步。虽然我进入暑假后，也做过脱宫城的衣服或是吻她这种不把规则当一回事的行为，但我认为还是该守住最后的堡垒。","「那就到这里。」","宫城这么说，抓住我的肩膀。","妳这不是还在碰我吗？","在我开口抗议之前，柔软的东西碰上我的脖子。在我意识到那是嘴唇的同时，她轻轻咬了我一下，接着立刻就退开了。可是领带跟毛巾都没解开。我的身体依然没能重获自由。","「既然结束了，就帮我解开啊。」","「转过去背对我。」","我照着宫城的话做，她解开了绑着我手腕的领带。","「剩下的妳自己解开吧。」","我听见她冷淡的说话声。宫城的气息离我远去。","我自己解开了蒙住眼睛的毛巾，伸手去拿桌上的麦茶，然后重新坐回床边，对着背对我，正在把领带收回衣柜里的宫城开口抱怨。","「宫城妳这变态，色胚。」","「仙台同学妳很吵耶。」","「那要怪宫城妳做了奇怪的事。」","「我没有。仙台同学妳才奇怪。」","宫城语带不满地说，坐到桌前。","我把毛巾丢向她，大声宣言。","「以后不准再做这种事了。」","「这种事是什么事？」","「绑住我或是蒙住我的眼睛。」","「妳又擅自新增规则。」","「这不是规则，但是禁止妳再这么做。」","「既然不是规则，那我就算做了也没关系吧？」","我不知道她是不是认真地想再做同样的事，却觉得如果是宫城，她很有可能会这么做，害得我眼前一黑。","这可一点都不好玩。","要是之后再发生好几次类似今天这样的事，那就头痛了。","「有关系。」","我清楚地告诉她，一口气喝光麦茶。","暑假就快结束了。","所剩无几的假期应该要风平浪静地划下句点，我也是这么打算的。","如果只是休息一下，那倒无所谓就是了。","〔本话含插图〕"]},{"t":"第9话　和仙台同学做这种事也无所谓","p":["我倒不是有什么要做的事。","我没有该去，也没有想去的地方，不过舞香用暑假最后的周日为由，约了我出门。","我们四处闲晃，逛了几家店，反复争论着一些讲来讲去也没有结论的事情，到上了高中之后来过好几次的咖啡厅，聊些无聊事。","是个没有什么事值得一提的周日。","舞香手里的刀叉发出碰撞声，在我的眼前切着松饼，和去年没什么差别的暑假让我松了一口气。我只要独处，脑子里就尽是想着仙台同学，所以舞香来约我真是救了我一命。","「唉～明天暑假也要结束了啊。志绪理，妳作业写完了吗？」","舞香唉声叹气，同时把松饼送进嘴里。","「写完了。」","「是成为考生之后改过自新了吗？我记得妳去年一直到最后都还在赶着写作业吧？」","「毕竟都三年级了，我想说还是稍微认真点吧。」","其实是因为仙台同学每周会来我家三次。","这种事又不能说，于是我说了个藉口，将枫糖浆淋在法式吐司上。","我吃了一口，法式吐司的表面明明很酥脆，里面却软绵绵的，像布丁一样软。咽下之后，枫糖浆不会过甜的味道残留在口中。","「这么说来，我也是第一次看到志绪理妳点法式吐司耶。妳一直做些稀奇的事情，地球会毁灭的喔。」","「妳说得太夸张了啦，我以前也有提前写完作业过啊。而且不管是谁，都有可能会吃法式吐司吧？」","「是这样没错啦，但妳之前不是有说过妳不太喜欢法式吐司吗？」","「我发现到它的美味之处了。」","虽然没有吃过，以前却下意识地认定自己不会喜欢的法式吐司，其实是一种很合我胃口的食物。","我不想说这都是仙台同学的功劳，但法式吐司成了我觉得像这样在店里点来吃也不错的食物。然而看着盘子上金黄色的吐司，也会唤醒与法式吐司相关的记忆。我把叉子刺进表面煎得有些焦痕的吐司。","泡过蛋液的吐司和仙台同学的嘴唇。","这两者究竟是哪个比较软？这种根本不重要的事情浮现在脑海中。总觉得吃起来应该很甜的法式吐司，混着我不可能感觉到的血的味道。","咬下的嘴唇很柔软，流出了比我想像中更多的血。","那鲜红的液体用手摸起来湿湿滑滑的，用力压了伤口之后，仙台同学瞪了我。","连结着法式吐司的记忆太过鲜明，甚至让我觉得仙台同学就在附近。","「我果然还是该点松饼才对。」","我看着放在对面的盘子，将法式吐司送入口中。","「那要不要跟我换一半？反正我也想吃法式吐司。」","「嗯。」","我点头答应舞香的提议，拿法式吐司和她换了松饼后，她又说：「这很好喝耶，妳要喝一口吗？」推荐了她的苹果茶给我。我说：「先不用。」拒绝了她，吃了一口一样柔软，却和法式吐司的口感跟味道都不一样的松饼。","「对了，明天要不要也约出来碰面？毕竟是高中最后的暑假的最后一天，一起去做点什么吧。」","舞香像是突然想起来地这么说，把法式吐司吃进嘴里。","「嗯～我有约了。」","「亚美也说要去约会，大家是不是太难约了点啊？」","「真要这样说，舞香妳今年也几乎都要去补习啊，比去年还难约吧？」","「那我也没办法啊。是说志绪理妳都做了些什么？感觉妳今年很忙耶。」","「是没有到很忙啦，只是家里有些事。」","因为有些事的详细内容几乎全是仙台同学，我不希望她多问下去。可是舞香说了：「有些事是什么事？」用催促我继续说下去的眼神看我。","「有些事就是有些事。」","「很可疑喔～而且妳今年几乎都没跟我们说妳暑假过得怎样。」","「才不可疑咧。」","我又吃了一口松饼，想要带过这个话题。","不管是暑假还是寒假，要寻找长假期间有谁待在我身边的记忆，都必须潜入很深的地方寻找才行。我就是如此地缺乏有人陪在我身边的记忆。","然而今年暑假有将近一半的时间，我都跟仙台同学在一起。","那意思是比起家人和朋友，更常跟我在一起的人是她。说是这样说，但我们几乎所有的时间都在念书，没有做什么奇怪的事——本来应该是这样的。","教人功课的一方跟受人指导的一方。","我们本来应该要守着这样的立场度过暑假，也丝毫没打算做不能告诉其他人的行为。","然而试着去回顾，我们却度过了完全不同的暑假。","我们之间的关系正在急速崩解。","「咦～妳真的没有什么事情瞒着我吗？」","「没有那种事啦。」","我这样告诉舞香，同时回想起我蒙住仙台同学的眼睛，绑住她手腕的事。","我想那是暑假期间，我最没办法开口告诉其他人的事。","违反规则的行为。","我没想要做那种事，事情却好像变成了那样。","我只是绑住她、蒙住她的眼睛而已，只是因为想摸她所以摸了她而已，又不是心有邪念。应该没有才对。我只是为了做些会在意她的目光而不敢做的事情，才会用上毛巾，领带也是为了让她不要妨碍我。而且我也只是比平常摸得稍微久了一点点，但我觉得自己可能做得太过火了。","虽说这之间也不算有什么因果关系，不过下一次仙台同学来的时候，我们没有休息。","「啊～我还想再放一个星期的假。」","听见舞香仿佛绝望了的声音，我看向她。","「真的延长一周，等到最后一天妳又会说想再放一周吧？」","「那当然。志绪理妳想再放个两周吗？」","「我不用放那么久。暑假能照正常时间结束就好了。」","「既然志绪理不要，那给我好了。」","「好啊，都给舞香。」","「妳真大方耶……那相对地，妳想要什么东西？」","「这又不是什么交换条件。我只是不需要放更多的暑假了。」","「这话里一定有鬼，妳绝对会事后才来跟我要些什么。」","舞香开玩笑地说。","我是真的不需要更多的暑假了。","明天。","明天一结束，就要开学了。","我已经可以想见，要是暑假就这样持续下去，我们一定会打破不能打破的规则。倘若事情演变成那样，我一定没办法跟仙台同学继续相处下去。","剩下一次。","只要能平安无事地度过那一次就好了。","我没那么聪明灵巧，能够顺利修复打破的规则，所以我应该努力不要去打破规则才对。","「反正暑假八成不会延长，我们今天接下来要做些什么好呢？」","舞香一边用叉子叉起法式吐司，一边问我。","「嗯～」","我把仙台同学从脑袋里面赶出去，提了几个点子。","在那之后，我们做了几件我提议的事，也做了一些不同于提议的事，然后各自回家。","回到家里，吃晚餐。","我在洗完澡之后立刻钻进被窝里。闭上眼睛，不知不觉间失去了意识，在闹钟响之前醒来。我不算睡得很好，但也不至于睡不着，所以脑袋还算是清楚。","我穿上跟之前一样的衣服，在一样的时间吃午餐。看着我刚买回来的书，等仙台同学传讯息来。还不到一个小时，我就收到了她传来的讯息，门铃响起。","不做跟平常不一样的事。","我轻轻吐出一口气后，开门让仙台同学进来。","「太多了吧？」","我在玄关把暑假最后的五千圆拿给仙台同学，她开口抗议。","「不会。」","「这周只有今天这一次而已，不用给我啦。」","「就算只有一次，家教就是家教。妳不收的话就回去。」","我冷淡地说完后，仙台同学盯着那张五千圆钞票。接着说了：「谢谢。」把五千圆收进钱包里，走进房间。我去厨房端了汽水和麦茶进来，一如往常地放在桌上。","没有什么不同。","跟平常一样。","坐到仙台同学旁边，打开课本和习题也一样。","没有做什么不一样的事。","今天结束后，我们就不会像这样一起度过不是放学后的时间了。这么一想，我便觉得有些寂寞了起来。","我看着仙台同学。","觉得她的头发很碍事。","她今天的头发没编也没绑，整头放了下来，所以我不太知道她究竟是用怎样的表情在过这暑假的最后一天。要说我有什么知道的事，只有她很认真地看着课本。","无聊。","我想看仙台同学的脸而伸出手。可是在我碰到她碍事的头发之前，仙台同学就转头用狐疑的表情看着我。","「别看我这边，认真念书啦。」","她这么说，用笔戳了戳我的眉间。","额头附近痒痒的，我反射性地把她的手连着笔一起推了回去。","我付了她五千圆。","然而对于我现在想做的事情，我还没有付那五千圆，所以不该做那种事，而且最好别再做了。","我明明知道，却还是碰了仙台同学。","一点点，真的只有一点点，把脸朝她凑了过去。","我的嘴唇当然也跟着凑近，可是在我碰到她之前，她就用笔敲了我的额头。","「宫城，我觉得现在要休息还太早了，但妳想要休息了吗？」","她问我的语气很平静，声音不带高低起伏。","从她的表情上也看不出情绪。","我没有要休息。","我觉得不能那么做。","我明明这么想，却答不出「我没有要休息」。","「宫城，明天就要开学了，先预习一下啦。」","仙台同学用笔尖指着课本。","「……要五千圆的话，我等一下给妳。」","我没打算要说的话脱口而出。","我不该给她五千圆，也不要跟她接吻比较好。当然，往后也一样。而仙台同学也该拒绝我的要求，她应该会拒绝我。考虑到未来，我们必须平安无事地度过今天才行。","我把自己也心知肚明的事情一条条列出来，想要说服自己，内心却又有某个我想要否定这一切。","「妳以为等等给我，我就会放过妳？」","仙台同学这么说完后，把笔放在桌上。","「妳要是觉得现在给妳比较好，我就现在给。」","我的身体照着顺畅地说出口的话动了起来。","但在我打算起身时，仙台同学拉住了我的手。","「不管是等等给还是现在给，都已经太迟了。」","她为什么说已经太迟了？","我想说出口的话被柔软的唇给堵住。那是在我完全没想到的时机发生的吻，「噗通」，我的脑袋里响起了心跳声。","为什么？","一个疑问浮现在脑海当中，在还没消失前，她的嘴唇便离开了。","「我没有下这种命令。」","我嘴里说着并非我原先想问的话，看着仙台同学。","「我知道。」","「既然知道，就不要擅自做这种事。」","「那是命令？」","「是命令。」","「是喔？可是我没收到五千圆，所以宫城不能命令我。」","「所以我就说，我给——」","「我刚刚就说已经太迟了吧？」","仙台同学的声音打断了我说到一半的话，她还抓着我手臂的手指加重了力道。我的手臂好痛。我本想出声抗议，仙台同学却先开口了。","「宫城妳最好再多思考一下自己在做什么事。」","我没有时间去思考她这话是什么意思。","原本存在于我和仙台同学之间的距离被她拉近为零，双唇交叠。她用力地靠上来，我的身体往后倾。我不是被她推倒的，也没打算自己躺下去，然而等我回过神来，我的背已经贴着地板了。","「妳可别咬我喔。」","在我的视线前方，仙台同学用异常认真的表情这么说。","她一把脸凑近，我马上便知道她这句话表示的是什么意思了。","在嘴唇相触之前，她的长发就先碰到了我的脖子和脸颊，搔得我痒痒的。","我伸出手，把遮住视线的头发撩到仙台同学的耳后。在我闭上眼睛之前，我们的嘴唇便重合在一起，立刻有个跟嘴唇有着不同柔软触感的东西碰了上来。我不用确认就知道那是她的舌尖，那撬开了我的唇，钻进口腔里。","不懂客气为何物的舌头在我的嘴里滑动。","有着合适软硬度的那个东西触碰我的舌头，湿滑的感觉仿佛被放大，传到了脑内。我可以明确感觉到仙台同学身体的一部分就在我的体内，尽管不觉得恶心，但也不觉得舒服。","如果是以前，我应该会毫不犹豫地咬下她乱动的舌头，仙台同学的话却成了制止我的安全装置，让我无法咬她。","我觉得喘不过气，抓住仙台同学的衣服后，她的嘴唇退开。","「我觉得不能做这种事。」","我像是要她远离我似的推着她的肩膀，用微弱的声音说着。","「我也这么觉得。」","仙台同学没有说「妳明明没反抗还说这种话」。相对地，她的脸又凑近过来。见到她和说出的话完全不同的行动，我比刚才更大声地说了。","「仙台同学。」","「这种时候叫我叶月啦。志绪理。」","「我不会那样叫妳，妳也不要这样叫我。」","「宫城妳真的很小气耶。」","仙台同学夹杂着叹息声说道，然后又理所当然地把脸凑了上来。","「……妳还要继续？」","我没说不行，反而抛了句暧昧不清的话给她。","「都是因为宫城妳想做那种事。」","「那种事是什么事？」","我明知故问。","「妳刚才不是想接吻吗？」","仙台同学用指尖抚摸我的嘴唇。","在我们之间有个不能踏入的领域。那原本有条非常清楚明白的界线，却在迈入暑假后变得非常模糊不清。而我们现在正要踏进那个领域。","「宫城。」","她用认真到如果是平常，我可能会笑出来的语气叫我。","她没有明说要做那种事。","不过我知道接下来要做那种事。","仙台同学的脸逐渐靠近，再度给了我一个深吻。","我们的舌头犹如视线交会般交缠、重叠。比过去更能感觉到仙台同学轮廓的吻，比刚才还要舒服。","十秒？二十秒？","还是过了一分钟？","在我搞不清楚过了多久的情况下，她的唇离开我的，我也主动回吻她。","我对这个没有五千圆介入的吻不抱任何疑问。明明应该要感到奇怪，却自然得令人惊讶，仿佛嘴唇交叠是件理所当然的事。","我揪紧仙台同学的衣服。","我用力把嘴唇抵上去，再慢慢退开。","我睁开闭着的眼睛，只见仙台同学的呼吸变得很急促，我的呼吸也一样很不规律。","就算想调整也没办法调整好。我想仙台同学也一样吧。","「我的背好痛。」","我放开抓着的衣服说道，藉此掩饰变得短促的呼吸。","「这点小事妳忍耐一下。」","我虽然觉得她这话很过分，但仙台同学说得没错。","要是去床上，我们说不定就会改变心意。我们跟这种行为就是如此地无缘。","我想，想回头的话就是现在了。","只要推开仙台同学的肩膀，坐起来，看看课本，就能当作这一切没发生过。","暑假的最后一天。","八月三十一日感觉是会一直残留在记忆里的日子，不适合做这样的事。","我想今天这个日子一定会被贴上标签，犹如纪念日般地残留在我的脑袋里。","这我都知道。","可是既然这是许多偶然重叠在一起，从我的一时兴起开始的关系，那我想应该也可以基于偶然和一时兴起，做这样的事情吧——一定、大概……可以吧。","仙台同学的嘴唇碰上我的脖子。","嘴唇抵上来，轻轻地咬着。","她的唇明明以前也碰过一样的地方，感觉却不一样。","我浑身一颤，想要逃跑，但又想更接近她。","她的舌尖触碰到我，让我的意识集中在那一点上。脖子上传来的湿滑感觉让我无法冷静。嘴唇宛如在我脖子上爬行似的移动，朝着锁骨前进。并且不时轻咬或用力吸吮我的肌肤，仿佛在做确认。","开了空调的房间应该很凉爽，我却觉得好热。","每个行为都带来鲜明的感觉，我能清楚感受到仙台同学正在触碰哪里。","她呼出的气息和落下无数次的吻，让我口中逸出至今从未发出过的声音。那不是该让仙台同学听到的声音，我连忙咬住嘴唇。","一瞬间，仙台同学的动作停了下来。","我抬起头，与她四目相对。","我本以为她会对我说些什么，但仙台同学什么都没说。她就这样默默地掀起了我的T恤。","我的腰直接感受到了仙台同学的体温。","我没打算要直接用她的名字叶月来叫她，却也不想阻止她差不多要往上移动的手。","原来真的有所谓的气氛啊。","我一边和仙台同学接吻，一边茫然地想着。","例如比平常更生硬的声音。","呼吸的方式。","不同于命令的吻。","些微的差异逐渐累积，让人意识到我们现在在做的是特别的事。","她滑进T恤里的手理所当然地融入我的身体。指尖从腰来到肋骨，缓缓地抚摸着胸部下缘。她的手使我的理性逐渐溶解，不再迟疑，将自己任由这双手摆布。并像她一样把手滑进衬衫里，直接抚摸仙台同学的背。","「宫城，这样很痒。」","仙台同学难得地用快承受不住的表情看着我。","「我也觉得痒啊。」","我们知道在越过这股搔痒感、越过令人浑身发毛的不舒服感觉之后，会有舒服的事情发生。","我让指尖轻轻滑过她的背脊。一路往上摸到大约在背部中央的位置时，听到仙台同学微弱的喘息声，心脏一跳。","「妳那样摸，很痒。」","仙台同学像是在掩饰地说着，接着将手放到了我的胸部上。","我的内衣还在身上。","明明还在，我却有种她直接触碰着我的感觉，脸颊发烫起来。","是小还是大。","我至今为止从没在意过这种事，但我有点在意仙台同学是怎么想的。不过就算看她的脸，我也只知道她的脸颊有点红，无从得知她的想法。","她的手从肌肤上滑过，试图钻到我的背后。","我稍微抬起肩膀后，仙台同学的手便绕到了我的背后，然而在那只手解开背扣之前，门铃响了。","突如其来的发展，让我们的呼吸和动作都停了下来。","仙台同学没看向门铃，看着我。","她没说话。","在短暂的停顿后，门铃又响了一次。","「……妳在意吗？」","仙台同学问我。","「没差。反正一定是推销。」","「不用确认一下吗？」","「那仙台同学妳确认啊。只要看一下监视萤幕，就知道是不是推销了。」","她只要稍微转个头，看看监视萤幕，就能知道在楼下按门铃的人是谁了。然而就像仙台同学看着我一样，我也继续看着仙台同学。","「不去应门一下不知道吧？哪边我都无所谓喔。」","我马上就听懂仙台同学这句话的意思了。","要就这样继续下去，还是去应门。","她要让我去做选择。","平常不会一再响起的门铃，今天却执拗地响个没完。","仙台同学说我遇到事情总是马上就会逃避，但是仙台同学自己也老是在逃避做出选择。她每次都会把选择权推到我身上。","想都不用想。","只要我站起来去应门，那就结束了。我不可能在跟按门铃的人说完话之后，再回来说：「那我们继续吧。」","「宫城。」","听到她平静的声音，我推了她的肩膀一把。","「仙台同学真没骨气。」","这么说的我也跟仙台同学没两样，不可能有什么骨气。我顺着被门铃唤回的理性坐起来。整理身上凌乱的衣服，按下应答的按钮，让响个不停的门铃安静下来。对讲机传来在一楼大厅那侧的人说话的声音，我听了内容后，果然是无聊的推销。","我深吸一口气，再吐出来。","做了个简单的深呼吸，转身后，只见仙台同学背靠床铺坐着，正在看漫画。","「是推销。」","「这样啊。」","我只得到了冷淡的回应。","看到她没转头看我这边，我有点想看她的脸。","「仙台同学。」","「干嘛？」","她虽然有回话，但视线依然朝下。","「没事。」","看着不愿面对我的仙台同学，我脑中想着还想再多触碰她，也还想再被她触碰这种事，在感觉不会再发生这种事情的午后，感到些许的后悔。","〔本话含插图〕"]},{"t":"第10话　我今天也尽是想着宫城","p":["尴尬。","我和宫城之间的气氛只能用这个词来形容了。","暑假的最后一天，我摸了至今为止没摸过的地方，听到她发出我从未听过的声音。说是这样说，但我不过就是摸了她的胸部，也没真的听到多少声音。","尽管如此……","尽管如此还是很尴尬。","明明只是摊开课本在写作业而已，我们却过着像是得看对方脸色行事的时间。","「说点什么话啦。」","我把橡皮擦丢向始终保持沉默，不肯开口说话的宫城。","我在那之后第一次过来，房间里的气氛很怪，让人坐立难安。","「仙台同学妳自己开口说话不就好了？」","宫城冷淡地说，把橡皮擦丢了回来。我拿起从对面一路滚过来的橡皮擦，擦掉我根本不想擦的字。","宫城今天刻意坐在我对面，而不是旁边。","夏天并不会随着暑假一起告终。","就算那天结束了，我们的夏天仍在继续，就算步入九月，天气依旧很热。不管是昨天还是今天，冰棒都很好吃，也需要开冷气。","不知该说是幸或不幸，这个房间现在维持着不至于会让人开口抱怨的温度。不会发生我以太热为由要宫城脱衣服的事，我也不会脱下自己的衣服。当然，我既没有碰宫城的身体，也没有机会碰。","新学期开始都已经过好几天了，我却不知道是有什么毛病，居然在想这种理所当然的事。","我今天没有跟宫城做那种事。","也没有发展出那样的气氛。","这也是当然的。","毕竟我们不是那种会上床的关系，根本不太会产生那样的气氛。","——那又是为什么？","我不否认自己当时想做那种事，也不意外自己心中有那种欲望。性欲这种东西不管是谁都会有，我想宫城心里一定也有吧。所以我觉得想做这件事情本身并不是什么怪事。","该在意的是，我是对宫城产生了这种欲望。","「妳干嘛看我这边啊？」","宫城用比平常更冷淡的声音说。","这话还伴随着冰冷的视线，感觉实在不太好。因为她的语气跟视线都像是刻意营造出来的，我知道这不是需要在意的事，却仍有一定的重量压在我的心上，让我的情绪都要消沉起来了。","「我不能看妳吗？」","我尽量用不带起伏的语调问她。","「不能。」","「那我不看。」","我让视线落到课本上。","帮我写作业。","要是她下了这种命令，我还可以藉此转移注意力，可是宫城自己在写作业。我也一样该写作业，却始终无法专注在一条条列在眼前的题目上。每当我回过神来，就会发现自己在反刍记忆中的宫城。","就算我能容许这样的自己，也很难接受这个事实。","我完全没料到，我会那么清楚地意识到自己对宫城的欲望。","我的手上还残留着宫城胸部的触感。","我用力握紧右手。","我握到掌心会留下指甲痕的程度之后张开手，抬起头，把橡皮擦丢到宫城那边去。","「我果然还是想看。我可以看妳吗？」","「妳不是已经在看了吗？不如说妳干嘛特地问这种事啊？」","「因为宫城妳叫我别看。」","「那种事情怎样都好，仙台同学妳认真写作业啦。」","「可以看妳的话，我就认真写。」","橡皮擦没被丢回来。","宫城一脸显然很不高兴的样子。","「我刚刚已经说过不可以了吧？」","「妳没说不可以，妳说不能。」","我特地纠正她。宫城皱起了眉头，然后带着一看就知道她在生闷气的表情站起来，从书柜上拿了一本漫画过来。","「妳要是不想写作业，就拿这个去看。」","她把漫画放到桌上。","「这是我昨天才买的，所以仙台同学还没看过。」","看来她的意思是叫我要看就去看漫画，别看她的脸。","我觉得会做出这种反应的宫城很可爱。","然而应该没有会让人产生性欲的要素才对。","宫城是个随处可见的普通女孩，没什么特别之处。去年是同班的不起眼朴素女孩，现在是隔壁班的不起眼朴素女孩。不对，正确来说，她虽然不起眼又朴素，但是个比普通人更怪一点的女孩子。普通人才不会下舔脚这种命令，也不会咬人咬到流血的程度。","这样一想她还真糟。","会对这种人产生性欲的我，脑子里一定是少了两、三根用来锁住理性的螺丝。","我应该不会再有那种感觉了。","我虽然会想碰宫城，可是碰了也不会演变成那样。我是这么相信的。我不想去思考脑袋里少了螺丝的原因，也没必要知道。真要说起来，就算我想碰她，她也坐得离我异常地远。","「妳不看吗？」","宫城把橡皮擦丢了过来。","「我下次来的时候看。」","「下次是什么时候？」","「那要由宫城妳决定吧？」","「是没错。」宫城说完后阖上了课本，却马上又开始翻起课本，小声地说了。","「……我以为仙台同学今天不会过来。」","她没头没尾地抛出无视话题走向的一句话。","只有翻动课本的声音在房里响起又消失，像是要消除突然出现的短暂沉默。","「妳为什么会这么想？」","「因为做了那种事。」","「宫城妳才是，我还以为妳不会再叫我过来了。」","今天，宫城叫了我过来。","我很意外。","就算新学期开始了，宫城也不会联络我。","我原本是这样想的。","「因为妳没有打破约定。」","她阖上刚才一直在翻的课本。","仔细想想，那件事以未遂告终。我们没做到最后，所以不算有打破不上床的约定吧。","「那妳不坐在我旁边，坐在那里的原因是？」","我不愿放过今天初次成立的对话机会，问了她我在意的事情。","「因为仙台同学不值得信任。」","被她斩钉截铁地这么一说，我在心里同意她的话。","对于我不值得信任这点，我无法反驳。可是宫城也没拒绝我。我虽然很想这样说，然而一旦说了，宫城八成又会沉默不语，所以我把这话给吞了回去。","「写作业啦。」","宫城难得说了认真的话。但比起填满笔记本的空白栏位，我的脑袋尽是想着宫城。我的眼睛只想映出她的身影，不肯看向课本。","我用手指转了一圈笔。","宫城像是要把我赶出视线范围外地打开课本，在笔记本上疾笔振书。因为她眼里没有我，专心盯着课本和笔记本，她当然没有转向我这边。","我又转了一次笔。","这次笔从我手指上掉了下来，发出喀啦的声音。可是宫城依旧没有抬头。","「妳要写作业的话，过来这边啦。」","我敲了敲身旁空着的位子，叫宫城过来。","「我不要。」","宫城没抬头地回答我。","「那我过去妳那边。」","「不行。」","「那是命令吗？」","我反问之后，宫城抬起了头。","「是命令。」","被她语气强硬地这么一说，我便无法移动了。","既然这是命令，那也没办法。我老实地放弃，看着课本。","我总是被命令这句话给拯救。我做过好几次要宫城命令我，藉此把选择权推给她的事。自己也拿命令当理由，垂头丧气地退下。实际上我就像宫城说的一样，没骨气。","就像那时候我没有勇气决定性地改变我们两人的关系，现在我也没有即使忤逆宫城的话，也要去她身旁的勇气。恐怕宫城也没有勇气到我旁边来。所以今天才会有这段距离出现在我们之间。","「仙台同学，这里我看不懂。」","「哪里？」","我看向用冷漠的语气叫我的宫城，她用笔尖指着摊开的课本。","「这里。」","「我从这边不方便看耶。」","我知道宫城指的地方是哪里。","也知道那是怎样的问题。","上头写满数字的课本就算从反方向看也没什么大问题，却能够成为填满身旁空位的契机。宫城却默默地把课本转向了我这边。","「宫城真小气。」","我一边在与我无冤无仇的课本上涂鸦一边抱怨后，涂鸦马上就被擦掉了。","「我哪里小气？」","「就是这种地方很小气。」","「不要说这种莫名其妙的话，快教我啦。」","「好好好。」","我态度随便地回答她，看向课本。我在笔记本一角写上公式，向她说明解题方法后，宫城带着似懂非懂的表情，在纸上接连写上数字。","那一天，要是就那样继续下去……","我在这几天里虽然想像过无数次，却又觉得那是应该仅止于想像的事。","我是没有「既然没在交往，就不能做那种事」这种清纯的想法，不过真的做到最后的话，我们就不会像这样一起写作业了。这样一想，便觉得应该要好好夸奖前几天没做更多的自己。比起只有一次的肉体关系，像这样在这个房间里念书或是看漫画，绝对比较开心。我这样告诉自己。","「这样对吗？」","得出答案的宫城抬起头。","「对。」","我看了写在笔记本上的文字，这么告诉她之后，她的视线又立刻落回课本上。","「所以说宫城，其他命令呢？」","我出声问她，想把她的注意力从课本上扒下来，但她没回话。带着不高兴的表情闭口不语。","我想像得到宫城不肯开口的理由。","倘若随便下命令，等于是把暑假的事情又重新翻出来吧。她的命令原本只会要我朗读小说、写写作业，做这种无伤大雅的事，却在不知不觉间成了危险的东西，要是像平常那样命令我，听起来就像是在要我继续做暑假那件没做完的事。说是这样说，但只下了别过来这种程度的命令，不下点其他命令的话，五千圆便无处可去了。","不需要再给我五千圆了。","我也可以这么说，但要是说了不需要，就会失去来这里的理由，所以我不想说。","在我的视线前方，宫城翻着课本，仿佛在寻找该说出口的话，可是答案不可能会写在课本上。她依然没扬起视线，用低沉的声音说了。","「写完作业就回去。」","「妳真的要把这个当成命令？」","「真的。」","嘴上这样说的宫城，那张脸上不管怎么看都不像写着「真的」。我们已经相处好一段时间了，所以我知道，宫城只是因为自己必须说点什么才行，才说了很像有那么一回事的话而已。","「下点别的命令啦。」","「为什么仙台同学要命令我啊？」","「毕竟作业一下就写完了。」","老师出的作业没那么多。不用一个小时就能写完了，以我平常从这里回去的时间来看，算是很早就要回去了。","「妳真的要用刚刚那个当命令吗？」","我大概料想得到宫城会下其他的命令，但还是加减问她一下。","「……帮我弄头发。」","宫城小小声地说着。","「头发？」","「妳之前不是说妳会帮我弄头发吗？」","之前——我之前说过的话。","我顺着宫城的话追溯自己的记忆，马上就找到了想找的东西。在五月接吻之后第一次碰面的那天，我在看为了羽美奈而买的杂志时，说过这样的话。","「妳想要我帮妳弄成怎样的发型？」","就算我记得自己对宫城说了什么，记忆里却完全没有刊登在那本杂志上的女孩子的长相或是发型。可能是因为我对为了配合羽美奈的话题而买的杂志没有兴趣，不会把上头的资讯长时间地留在我的记忆里吧。","「只要不做什么奇怪的事，怎样都好。」","「什么意思嘛。」","「总之妳弄得好看点就对了啦。」","她虽然丢了个很随便的要求过来，本人却一动也不动。","她依然坐在对面，看着我。","「宫城，妳过来这边。」","我既然没有超能力，手也不可能伸长，宫城要是不动，我就碰不到她的头发。这种事情她应该也很清楚才对，然而她却没有要站起来的意思。","「妳觉得这样我有办法碰到妳的头发吗？」","由我过去宫城那边也可以，可是我知道她一定不会给我好脸色看。","「宫城。」","我又再叫了她一次，这次她一脸心不甘情不愿地站了起来，来到我旁边，在离我稍远的位置坐下。","可以不用那么防备我吧？","我什么都不会做好不好？我在心里叨念着，从书包里拿出梳子。","「背转过来。」","我稍微靠过去，拍了拍宫城的肩膀后，她吓得身体一震。不过她还是老实地把背转了过来，我摸着她长度稍微过肩的头发。这次她倒是没有再吓到了，但我从背影就能感觉得出她有多紧张。","好难下手。","宫城如同她所说的不信任我，她周遭的气氛紧绷得不得了，连我都跟着紧张起来了。","「妳的头发很漂亮耶。」","我想说这样或许能多少舒缓一下紧张的气氛，用很老套的话来赞美她。说是这样说，但我这也是实话，她的一头黑发轻柔飘逸，可以轻松地用手梳开。","可是宫城没回话。","这也没办法，我只好默默地梳开她的头发。","我果然还是想不起杂志上的女孩到底是什么发型，宫城的要求又很模糊，不够明确。我放弃仰赖记忆，也放弃回应她的要求，捞起宫城的头发，开始编成不同的发型。","「妳在绑辫子？」","挺直了背脊的宫城把半张脸转向我这边。","「对。换其他发型比较好吗？」","可爱的发型要多少就有多少。","我也可以从手机里存的图片中寻找适合宫城的发型，却仍继续把宫城的头发绑成辫子。","「什么发型都好……不过之前妳给我看的杂志是更不一样的发型。」","宫城嘴上说什么都好，听起来却不像是什么都好的样子。","「我会帮妳弄得很可爱啦。」","我不想说我已经不记得杂志上的女孩是什么发型了。","因为绑成辫子，感觉可以摸宫城的头发摸比较久。","我更不想说我在想着这种事。","「不可爱也无所谓。」","宫城面朝前地回答我，然后又继续说了：「我说啊……」","「什么事？」","「我以后也会找仙台同学过来，命令妳。」","「我知道。」","「那到毕业前，我要是找妳，妳就像之前那样过来。」","命令的期限第一次被明确地划分出来。","我原本也觉得自己只会来这个房间直到毕业为止。我一直认为这样刚刚好，但我试着把剩下的时间给实际说了出来。","「也就是还有大约半年的意思？」","「对。在那之前，仙台同学放学后的时间都有一部分是属于我的。」","宫城理所当然地说完后，紧绷的气氛稍微缓和了些，大概把紧紧贴在背上的紧张两个字撕了三分之一下来。","我解开绑好的辫子，又重新绑一次。","宫城坐着，没开口抱怨。","她轻柔飘逸的头发摸起来果然很舒服。","跟宫城床上的香味同样的味道搔着我的鼻腔。我像是受到那个跟我、羽美奈或是跟麻理子她们都不一样的洗发精香味给吸引，更靠近了宫城一点。","「半年啊……真短呢。」","我喃喃自语似的吐出这句话。","指尖继续绑着她的头发。","「是啊。」","宫城用不带感情的声音说道。","〔本话含插图〕"]},{"t":"后记","p":["非常感谢各位阅读这本《我买下了与她的每周密会～以五千圆为藉口，共度两人时光～》第二集。","本书是将网路连载小说的内容改写、修正，并另外加上专为出版品版本撰写的内容后，正式出版的产物。","虽然除了「第二集」之外，我用了跟第一集同样的文章做开头……但这是第二集，第二集！是让人想出声念出来的词汇呢。拜许多读者们阅读了第一集之赐，第二集才有机会发售。我非常开心。真的很高兴。","。","注：此指日文版","那么，关于幕间和番外篇，和第一集一样，是因应出版计划而增写的内容（因为接下来会提及故事内容，还没看的人请先跳过这一段）。","番外篇〈在仙台同学的放学后变成五千圆之前〉，是基于责任编辑「写去换钞的宫城的故事如何？」的提案应运而生。在开会讨论的时候提到「去换钞的宫城很可爱」，我也是这么想并写出番外篇的，结果变成了那样的宫城——各位有觉得宫城可爱吗？","幕间〈下雨天的宫城对我做的事〉，是我想要补足的第3话〈我不知道这样的仙台同学〉的仙台视角。由于可以得知下雨那天仙台在想些什么，希望各位能和宫城视角对照着来看。","除了新撰写的内容外，还有改写、修正，有许多要处理的事，连一刻都不得闲，不过在这样忙碌的日子当中，有件非常令我高兴的事。要说那是什么事，那就是——","第一集再版！","第二个想让人出声念出来的词汇。","拜各位读者们的支持所赐，第一集再版了。真的很感谢各位。在我收到样书，看到版权页的时候，实在是感动万分。要再版的事是责任编辑透过电话通知我的，不过突然的来电加上手机上显示着责任编辑的名字，我当时还想说「发生什么事了吗？」吓了一大跳，这件事就是秘密了。","说到感动，我在第一集发售后造访书店时也非常感动。","我常去的书店有书！","呃，书店里有书是理所当然的事，不过我是因为看到自己的书被陈列在书店里而感动。那时候的我大概成了一个形迹可疑的危险人物吧？","写着写着，似乎也累积到了合适的页数。","最后在此诚心地感谢阅读了第二集的各位、在网路上鼓励及支持我的各位、U35老师、みかみてれん老师、责任编辑、在各个方面协助本作品出版的各位，真的非常非常地感谢您们。然后我还要感谢我的好友N。这次也承蒙你在各方面的协助。","那么，希望能在第三集的后记与各位再见！","羽田宇佐","〔本话含插图〕"]},{"t":"番外篇　在仙台同学的放学后变成五千圆之前","p":["我很高兴下午不用上课。","可是也有不满上午有纪念活动要参加的学生，现在抓着我桌子的亚美便是其中之一。明明早上就已经结束活动，只剩下回家而已了，她却依然站着，慷慨激昂地发表长篇大论。","「创校纪念日还要来学校，这根本是诈欺吧？我觉得明年直接改成放假比较好啦。」","她大力摇着我的桌子说：「妳也这样想对吧？」征求我的同意。我面对激动的亚美，陈述了被她遗忘的事实。","「就算明年改成放假，我们也已经毕业了，没有意义啊。」","「啊，对喔。」","听到亚美愣愣地出声，舞香感慨地接着说。","「能在没有例假日的六月放一天假是很令人高兴，但毕业后才有假可放也没用啊。」","两位朋友来迎接悠哉地坐在位子上的我，但她们对创校纪念日的感想似乎有点落差，不像亚美那么执着于放假的舞香想改变话题似的拍了一下手，看着我们。","「我等等有个地方想去，妳们有空吗？」","「我是有空啦。」","我把视线移到舞香身上回答后，亚美也笑嘻嘻地说：「我也有空。」","「那陪我去买防晒乳吧。」","「好啊好啊，可以顺便绕去书店吗？我想买参考书。」","亚美那无谓地充满活力的声音，让我想起自己有本在意的漫画。舞香总说是夏季穿衣必备品的防晒乳先不提，那本漫画感觉很有趣，所以能买的话我是想去买。","反正我有钱——","想到这里，我忽然想起有个东西剩得不多了。","「对不起，我想起来我还有事。妳们两个去吧。」","「咦～志绪理妳也一起来嘛。到刚刚都没想起来的事情，就别管了啦。」","亚美大声说道，舞香也接着说。","「妳说有事，是要去哪里？」","「与其说要去哪里，不如说我忘记我跟爸爸约好了要碰面。」","「咦？妳爸爸今天休假吗？」","舞香惊讶地说。","「啊～不是休假，是正好因为工作会到这附近来，他说有东西要顺便拿给我。」","我跟爸爸其实没有约，爸爸也没有那种时间。这不过是藉口，我只是不想说我要做的事——去银行。","要给仙台同学的五千圆纸钞所剩无几。因为我早就决定好，不能用五张千圆钞，也不能拿一张万圆钞让她找，要用一张五千圆纸钞来买下她放学后的时间，所以我需要去换钞。","老实说，我觉得换钞很麻烦。","如果可以不用去，我也不想去。","然而五千圆纸钞是种妳以为钱包里有，钱包里却没有的东西。对我来说是必须定期取得的钞票。","「这样啊。那就没办法了。」","舞香遗憾地说，亚美接着说了：「真想去看看志绪理的爸爸。」这不是我乐于听到的发言，于是我委婉地拒绝了亚美。","「也没什么好看的。」","虽然我说跟爸爸约好了是藉口，但就算不是藉口，我爸爸也没什么值得给人看的地方。","「那我拿我存的压岁钱来付参观志绪理爸爸的费用。」","「什么跟什么啦？亚美，妳为了看志绪理的爸爸，打算付多少钱？」","「大概一千圆？」","「总觉得这金额很不上不下耶。」","舞香这样说完后，亚美一副真没想到妳会这样说的样子，接着说了。","「有一千圆不就可以买一本书了吗？换成是我，可以拿到一千圆的话，要我给人看一个还是两个爸爸都行，我什么都愿意做。」","亚美斩钉截铁地说。我对她产生了疑问，开口问她。","「能拿到一千圆的话，妳真的什么都愿意做吗？」","「……要看内容而定。」","看到亚美突然没了气势，舞香笑了出来，可说是理所当然地吐槽她：「那就不算什么都愿意做了嘛。」","嗯，我想也是。","亚美很老实。对高中生来说，一千圆虽然算是不小的金额，但人是不会愿意为了区区一千圆就任人使唤的。当然会有觉得可以去做跟不能去做的事。","可是，如果那不是一千圆的话呢？比方说——","「欸，亚美。如果我说要给妳五千圆，妳就什么都愿意做吗？」","我看着亚美，向她提问。","比一千圆更重，又比一万圆更轻。","假如是这样的金额，她会怎么做呢？","「这个嘛～」","亚美装模作样地说，清了清喉咙，然后张开双手断言。","「志绪理会成为神。」","她这完全出乎我预料的答案让我相当傻眼。似乎跟我一样傻眼的舞香用受不了她的语气说道。","「亚美的神会不会太廉价了啊？是说妳这样根本不算有回答嘛。」","「又没关系。再说五千圆很不上不下耶？想要人家什么都愿意做的话，说个一万圆啊。反正只是假设嘛。」","「那十万圆呢？」","金额因为亚美和舞香而变得越来越高。我的问题就这样被她们越扯越远，往奇怪的方向发展。等我意识到的时候，她们已经在讨论自己想要的东西了。但五千圆的事仍盘据在我脑中。","就连拿来假设都被说不上不下的五千圆，以一张纸钞来说也很不上不下，没什么存在感。就连会给我过多零用钱的爸爸也很少会放五千圆纸钞给我，只有偶尔才会出现在我的钱包里。","所以我在书店遇到仙台同学的那一天，钱包里有五千圆纸钞是个巧合。","那天不知道为什么我钱包里有张五千圆纸钞，所以我替仙台同学付了钱。","不过巧合不会长久持续下去。","自从我开始会给仙台同学五千圆后，我手上原有的几张五千圆逐渐消失，很快就用光了。于是我除了利用买东西找回的钱累积五千圆纸钞外，也特地去查了将一万圆纸钞或一千圆纸钞换成五千圆纸钞的方法，得知了换钞机的存在。而且我也顺便得知这东西意外地不方便，只能在午休时跑去银行，或是像今天这样，学校比较早放学的日子才有办法用。","仙台同学给了我不知道也无所谓的知识，让我为此烦心。","把碰巧来到我手里的五千圆纸钞装进信封里，只用累积起来的份叫她来说不定比较好，但我没办法这么做。","「我差不多该走了。」","我拿著书包站起来。","「到半路上都一起走吧。」","舞香这么说。我们三个一起走出了学校，走了大概五分钟左右后，我和她们两个道别，就这样走去了银行。","我用ATM领了钱，排队等着使用有不少人在排的换钞机。过一会儿之后轮到了我，放入换钞机里的钱变成了五千圆纸钞，回到我的手上，被我收进钱包里。","一开始不太懂的操作，如今也很熟练了。","我可以毫无感慨地往返银行。","不过我不时会想。","如果我在书店付的钱不是五千圆纸钞，而是千圆钞和零钱——","即使是仙台同学，也会跟亚美今天的答复一样，依据内容决定是否要听从我的命令吧。说不定她根本就不会到我家来。假设是一万圆纸钞，我想仙台同学也不会来我家，会在学校硬把钱还给我。","假如事情变成那样，我就不用把五千圆纸钞收进信封里，也不用换钞了。","我走出银行，传了一如往常的讯息给仙台同学。","我没等她回复，就朝着家里走去。","我没有绕去书店。","故意在人行道的砖瓦里挑颜色比较深的砖瓦来走。","书包里传来手机收到讯息的提示音。我拿出手机看着萤幕，看到仙台同学传了讯息过来，知道我刚换回的五千圆纸钞成了必要的东西。","今天我该下怎样的命令才好呢？","五月和仙台同学接了吻，六月咬了她的耳朵。","在那之后我仍旧不知道要下什么命令才好，就这样找她过来，继续过着六月。要说有什么我明白的事情，只有我跟仙台同学需要五千圆。","我虽然不是仙台同学的神，但只要给她五千圆，她就会听我的话。","五千圆是五张一千圆集合起来的产物，有一万圆一半的价值。","尽管价值不会变得更高，也不会变得更低，用来买仙台同学放学后的时间却刚刚好。只是那五千圆，一定要是「五千圆纸钞」才行。","我加快了脚步。","不管要下怎样的命令，我都得在仙台同学抵达前到家。","我到家后大约过了十五分钟，门铃响了。","我透过监视萤幕确认是仙台同学后，打开了大厅的门锁。她很快就来到了玄关前，我打开大门。","「妳今天来得很早耶。」","我没多想地说了无关紧要的话。","「我是觉得没有特别早啦。」","仙台同学也说得无关紧要，脱下鞋子。我没等她就走回了房间。仙台同学也马上跟了进来，把书包放在床铺附近，解开制服衬衫从上面数来的第二颗扣子。","「拿去。」","我把放在桌上，刚换回来的五千圆纸钞拿给她。","「谢谢。」","仙台同学把那张钞票收进钱包里。","她表现得若无其事。","仿佛这是没有意义的重复性行为。","五千圆的交易是我们今天约定的开端，也是我们一切的开端，但也没有别的意思了。我明明这么想，却有一点点在意起从钱包里消失的五千圆的下落。","〔本话含插图〕"]},{"t":"电子书特典　和宫城同行之后","p":["把仅在暑假的短短几小时内来过我家的宫城送到半途中后，我走在回程的路上。没了需要配合走路步调的对象，我也失去了前进的动力。","虽然一个人走脚步很沉重，觉得家离自己好远，我还是用和宫城同行时的速度往前走。","我没必要送她回去。","然而我还是想送宫城。","所以我和宫城一起踏出了家门。虽然她说了好几次要独自回去，是我自己选择要走在她身旁的，我现在却很后悔。","认为果然该把她送到家比较好的我，和认为既然这样，那干脆别送她，在家门前和她道别就好的我正在争执不休，分不出个胜负。我想这是因为不会邀朋友来家里玩的我，居然做出了让宫城进我房间这种怪事。","不管选了哪边，我应该都会像现在这样后悔，所以这是一场毫无意义的争执，但我还是无法不去思考这些事。","那时候要是妈妈没出来，就会有不一样的结果了。","宫城不会变得那么多话，我也不用为了让她闭嘴而推倒她。真要说起来，只要我遵守不在假日和她碰面的规则，事情就不会变成这样了。","这一切的起因，都是因为我改变了那个明明不改也无所谓的规则。","追根究柢就是这么一回事，所以这让我的心情很低落。把后悔的范围扩大不是什么有趣的事，我也知道别这么做比较好，但这种日子就是会很想后悔。","我「唉」地叹了一口气，抚摸自己的脖子。","我记得我把宫城推倒在床上后，咬了这附近。","像是要留下痕迹一样，很用力、很痛。","我用指尖压了压，手指被流下的汗给沾湿，感觉很恶心。","可是我刚刚摸宫城的脖子时，并不觉得恶心。还觉得可以再多摸一下。","我握紧方才摸过宫城的手。","尽管我觉得如果回想起在咬完宫城后，她就在我床上的事，我一定会诅咒自己，但我已经在诅咒自己了。暑假期间的我老是做得太超过。一直在做些平常我根本不会做的事。","「好热。」","太阳还没下山。","太阳照耀着城镇，也照耀着我。","就算到了傍晚也没变得比较凉。","夏天的暑气夺走了我正常的判断能力。反省与后悔全都被夏天给融化了，不管是明天还是后天，我也一定会继续朝着不好的方向前进。","「快快变凉吧～……唉，怎么可能这样就变凉？」","我喃喃自语，加快了脚步。","要是我一直用和宫城同行时的步调走，根本到不了家。既然我需要配合步调的对象已经不在了，我就该用自己的速度前进。虽然我不急着回家，只是在外面待久了很热，让我很想念空调。","身上流出汗水。","我又再加快了速度，毕竟我只送宫城送到半途中而已，转眼间就到家了。我打开家门，走入屋内。","「我回来了。」","我这句话说得还满大声的。","照理说应该有人在家，但没人回应。","一向如此，不是什么需要在意的事。","可是今天我很介意明明有人在家，却像是没人在一样的那股寂静。"]},{"t":"实体书特典　暑假的仙台同学很不认真","p":["我不懂她这是什么意思。","仙台同学突然说：「我只是对自己有点幻灭。」便抛下做到一半的习题，跑出去买做法式吐司的材料了。","无法理解。","原本应该当我家教的人，却丢下学生出去买东西，我觉得这实在太扯了。","让原本握着的笔随意在桌上滚动，我走向玄关。","仙台同学当然不在。","我锁上她出去后就那样开着的门锁，回到房间。","目光飘向仙台同学放在桌上的笔记本，只见上面满是漂亮的字迹，我握起笔，在她的笔记本上画了吐司。","虽然说只限暑假，但仙台同学是我的家教，是要教我念书的人。","我知道自己根本不可能理解她放弃教我念书，突然想做法式吐司的原因。","尽管如此，我还是无法不去想她，因为我认为在课业上远比我认真的仙台同学抛下念书这件事，是件非比寻常的大事。再说她明明怕热，却离开开着空调的房间而跑到外面去，太奇怪了。","绝对有什么内情。","法式吐司不过是藉口。我想她八成是为了做些无聊事，跑去做准备还是干嘛去了吧。","「毕竟她总是马上就会做些变态的事。」","上次她来当家教之际，我明明没要求她，她却脱了衣服，甚至连我的都脱了。这次也打算做法式吐司这种我根本没拜托她做的事，所以我觉得她一定不会做什么正经事。","我像刚才仙台同学所做的那样丢下笔，趴到桌上。","额头贴在桌面上。","凉凉的很舒服。","可是也就只是这样，仙台同学的心情仍是一团谜；不知道她到底会不会做的法式吐司味道也是一团谜。","「也太让人搞不懂了。」","我没吃过所谓的法式吐司。明明是煎过的面包却软呼呼的，看起来实在不好吃。尽管我没特别想要念书，可是她擅自跑去买食材，打算做我不想吃的东西，也让我很头痛。","我抬起头，在自己的习作簿上画了蛋。","我想就算阻止仙台同学，她也一定会做法式吐司要我吃。","要是……","如果……","我吃了之后觉得好吃，这件事应该会残留在记忆里吧。","这不是什么好事。","「……真的很让人不爽耶。」","我拿起橡皮擦，用力擦掉刚刚画的蛋。","仙台同学还没回来。","她没说自己什么时候会回来，也没说这一趟出去要花几分钟。","仙台同学的大脑八成是变成了融化的冰淇淋或是类似的东西吧。我觉得她应该稍微冷静一下，让大脑凝固比较好，却不想为了仙台同学调降房间的温度。所以等她回来之后，把她的头塞进冰箱的冷冻库里好了。","我轻轻呼了口气，站起身来，走到书架前瞪着漫画，代替瞪不到的仙台同学。"]}]},{"vol":"03","title":"我买下了与她的每周密会 · 卷03","chapters":[{"t":"简介","p":["暑假结束后，一切就会恢复原状了。不管是变得模棱两可的规则，","还是我和仙台同学之间的距离──我原本是这么想的，","然而只有她依旧很奇怪，开始说起「跟我考同一所大学如何？」这种话。","即使她这么说，但我既没有毕业后还要跟她在一起的理由，对她的将来也不感兴趣。","没错，我完全、丝毫没有兴趣。","暑假结束后，会聊起未来的出路是极其自然的事。","好比说我试着向宫城提议，问她要不要跟我上同一所大学。","我当然知道宫城没想过那样的未来。","尽管如此，要是她愿意思考一下和我在一起的未来──我心里如此期待着。","我可能真的很狡猾吧。"]},{"t":"第1话　都怪仙台同学害我睡不着","p":["我没打算要一直盯着看。","只是没来由地看着而已，没有别的意思。可是仙台同学没有解开她制服衬衫上面算来的第二颗扣子。","一如往常的放学后、一如往常的房间。","唯有仙台同学不一样。","虽然她在学校只会解开衬衫最上面的扣子，不过到我房间里之后，总是会连第二颗扣子都解开，简直就像是有这条规则存在。然而今天第二颗扣子依旧扣得好好的。","静不下心来。","若要追究她没解开扣子的原因，我想应该得归咎于我们经历了一个「做了不同于以往行为的暑假」。","假日不碰面。","定下这条规则的仙台同学自己更改规则，在暑假以「家教」的身份来到我家。","改变的这条规则，创造了我以每周三次的频率与仙台同学碰面的暑假，甚至创造出除了念书这个目的以外的事情。","跑去仙台同学家、和她玩假扮朋友游戏、下了太过火的命令。","我们本来应该只是要一起念书而已，却做了许多平常不会做的事。","「今天的命令是什么？」","我听到她从宽得足以让我们并肩而坐的桌子另一侧这么说，抬眼望向她。","在这之前，来到这房间里的仙台同学和今天一样，没有解开上面数来的第二颗扣子。可是在暑假结束，进入九月后我们第一次碰面的那天，她有解开。","由于仙台同学有时会解开扣子，有时不会解开，我再怎么介意这件事也毫无意义。之前我也没说什么，选择忽视。然而她持续这么做，感觉就像还在介意暑假时发生的事，使我始终无法坐到仙台同学身旁。","毕竟在新学期开始后，我们已经像这样碰面了三次，差不多该让仙台同学变回平常的样子了。","「解开扣子。」","我说出命令，得以让不同于以往的仙台同学，变回一如往常的她。","「扣子？」","「衬衫的扣子。」","「宫城妳这色胚。」","她抛出预料之外的答复，但我想那是因为语意没有正确传达出去。她八成误会了。","「不是那个意思。」","我开口纠正仙台同学的误会。","「那个意思是什么意思？」","「妳不用全部解开。真要说起来，我说解开扣子就以为是要全部解开的人才色吧。」","「我可没说以为妳要命令我全部解开喔。」","「妳没说，但心里是这么想的吧？」","接着补上一句后，仙台同学这才承认：「是没错。」接着又继续说。","「如果不是全部，我要解开几颗扣子才行？」","「一颗，解开上面数来的第二颗扣子。」","「……为什么非得解开不可？」","「仙台同学之前来这里时，都会解开第二颗扣子啊。」","「妳要是希望我解开，就别一直盯着我。」","「我没有。」","「我之前来的时候明明就有。」","「我没有。」","我纠正仙台同学不正确的发言。","我才没有「一直盯着她」。","之前应该也没这么做才对。","「哎，既然妳这么坚持，要我当作没有也行。所以只要解开一颗扣子就好了吗？」","仙台同学看着我，再三确认地说道。","明明就算我说解开两颗，她也不会解开。","从上面数来的第三颗扣子是会变动的，有可以解开跟不可以解开的时候，不知道今天是哪一种日子？不过我既没想要她解开，也不觉得她会解开。","「虽然不知道仙台同学想解开几颗扣子，但没必要解开到两颗或三颗。」","「那就好。」","尽管口气随意，她依旧没有要解开扣子。","「这是命令，赶快解开。」","说完后，一直扣着的扣子总算解开了。","「这样就行了吗？」","「可以。」","仙台同学和在学校时不同，穿着连从上面算来第二颗扣子都解开的制服衬衫，这才是我平常会在这个房间里看到的仙台同学，却觉得还是有哪里不对劲，看起来跟暑假前不一样。我不该凝视着她，却无法别开视线，仿佛在玩大家来找碴的游戏，直盯着她瞧。","「干嘛？」","耳边传来她狐疑的声音。","这种时候她的反应倒是一如往常。","找不出到底哪里不对劲，感觉很不舒服。","「要我再帮妳弄头发吗？」","她对沉默不语的我这么说，让人有点在意。","进入
