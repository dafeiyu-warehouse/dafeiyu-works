责怪她。","既然如此，只能说那件我原本打算做，却没能实现的事了。","「就算仙台同学不来找我，我也会自己回去。」","「什么时候？」","「明天。」","最后没能付诸实行，但我确实想过。","「你没有通知我啊。」","仙台同学喃喃说道。","她果然没有看我。","一直低着头前进。","语气不像在生气，但还是不肯看我。","我也无法直视仙台同学，所以她不把头转向这边的确让我松了一口气。同时，我也对不看我的她有些失望。","「在我通知前，仙台同学就来了。」","「你有打算通知就早点传讯息啊。我一直在等你。」","「……对不起。」","我总算说出这句刚离开舞香家就该马上传达的话。但仙台同学没有看我，只是瞪着地面回应：「我也要说对不起，把我和宫城的事告诉了宇都宫。」","以她来说，这个语气充满不安。","我原本以为只有自己尴尬，但仙台同学或许也有同样的感受。对话能延续下去一定是因为舞香像路灯一样照亮我们。多亏有她开朗地从旁推动，事态才不至于变得无法挽回。","「……你为什么特地跑来学校找我？」","我知道这么做是出于关心，但还是忍不住询问。","「我刚才也说过了，因为你不回来啊。」","仙台同学压低声音，喃喃说道。","她依然低着头，我没办法清楚辨识她脸上的表情。如果抓住她的手臂大叫一声「仙台同学」，她说不定会转过来。然而，一旦设想她依然不看这边的情况，我就提不起勇气。我们朝车站走去，甚至不清楚夜空中是否有闪烁的星星。","「你也不必问舞香吧？」","我没有看仙台同学，兀自吐出心中的不满。随即传来她平静的嗓音。","「谁教我找到宫城前就先遇见宇都宫，这也没办法吧？我的确感到愧疚，可是当时没有余力去顾及这些。既然找不到宫城，我只能问宇都宫了。」","「……除了住在一起，你还讲了什么？」","「我在书店跟宫城借钱的事。另外，宇都宫先前不晓得我们住在一起，所以有问同住的原因。我只回答我们是朋友，详细的事情叫她问你。所以宇都宫可能会问你一些问题吧。」","仙台同学讲出非常不负责任的话，又向前走了两步。","我反射性地抓住她的衣服。","被舞香质问我和仙台同学的关系算是自作自受，可是我没想到仙台同学会不做任何解释，把说明工作全丢给我。","「与其说舞香『可能』会问我，不如说她刚才就要我之后解释为什么会跟仙台同学住在一起。我要怎么说？」","「你高中时没跟宇都宫提过什么吗？」","领先两步的仙台同学就这样任我抓住她的衣服，继续前进。","「怎么可能。我们约好不能把放学后的事告诉其他人啊。」","「宇都宫以前就怀疑我们可能是朋友耶。你其实有提过什么吧？」","「仙台同学有把我们之间的事告诉朋友吗？」","「就算没约好也不可能说出去吧。」","说出与我内心想法完全一致的话，仙台同学大大叹了一口气。","然后停下脚步。","我放开她的衣服。","两步的距离好遥远，令人不安。","我明明没有叫「仙台同学」，她却看着我。","路灯下，一如往常的端正五官映入眼帘。没有最近常出现的笑容，但她的表情和升上大学时没什么不同。看着这样的仙台同学，「待在她身边是理所当然的日子」似乎又回来了。","「下次见到舞香的时候，我该说什么？」","我将肩上的大包包取下，换成手提。轻轻甩动，让包包撞上仙台同学。","「老实说你是用五千圆下令，我们才会住在一起。如何？」","「我怎么可能这样说。」","「那就坚称我们成为朋友的契机是你在书店借钱给我啊。」","仙台同学换上更开朗的语气说道，随后迈开步伐。路灯照亮两步之外的她，感觉格外明亮。","「如果说我们是朋友，高中时跟舞香说我和仙台同学没特别好的事该如何解释？」","「就说我们在学校没有交集，难以启齿啊。」","「仙台同学是不是觉得这不是你要面对的问题，所以随便乱说？认真想啦！舞香不至于生气，但如果随便乱说，我不晓得她会做何反应。」","「生气的话就向她道歉啊。只要好好道歉，宇都宫就会原谅你吧？」","「我会道歉，也觉得她会原谅我。可是我不晓得瞎掰的理由能不能说服她。」","如仙台同学所言，诚心道歉应该能换取舞香的谅解。即使是胡诌的理由，只要舞香觉得我不希望别人深究就不会强迫我说。无论如何，她终究会原谅我。至今为止都是这样。","可是我说了太多关于仙台同学的谎言。她平常或许不会强行挖掘我的秘密，这次就不确定了。","「你就告诉她，是我不想让羽美奈她们知道自己和宫城交好，不准你说出去。」","「那样仙台同学就变成坏人了。」","「没关系，就让我当坏人。」","语毕，仙台同学微微一笑，仿佛不当一回事。","这种时候还挤出笑容，太奸诈了。","总是很温柔的仙台同学看起来更温柔了。","让人想一直待在她身边。","「有关系。」","我停下脚步，用包包打仙台同学。","她却没有停下。","「没关系。这样就能构成高中时隐瞒她的理由吧？至于我们感情变好的经过、成为室友却瞒着她没说，诸如此类的琐事就之后再想吧。」","走在前方不远处的仙台同学语调轻快。","我一直望着那道背影。","「宫城，不要停下，快点走啦。」","仙台同学在十步之外的位置停下，转头看来。","对上她的视线，我的心脏「怦通」一响。","「仙台同学，你为什么对我这么好？刚才我也说过，即使你不来找我，我也打算明天就回家啊。」","「真的吗？」","「我本来打算通知你。」","「就算有收到通知，我可能还是会去找你喔。」","不带起伏的声音传来。","我不懂这句话的意思。","「为什么？」","「——因为我等不到明天。如果我这么说呢？」","「再多等一天又没差。」","「我想见宫城，没办法再多等一天。」","仙台同学用认真到不自然的嗓音说道，朝我走来。","一步、两步、三步。","慢慢接近，停在我面前。","「你就会说谎。」","听到我不强硬却也不算柔和的回应，仙台同学状似困扰地笑了。","淡淡的微笑溶入抹去黑暗的灯光，令人动弹不得，仿佛刚刚做了非常过分的事。","她真的很担心我。","从她传来的讯息就能看出。","可是，仙台同学不可能想见我到无法再多等一天。","不必回顾过往，我也知道自己从未做过会让她想见我的事。我总是在说任性的话，数度想要疏远她。这次也偷偷地溜走。","仙台同学居然想见我这种人？太奇怪了。","「还比不上宫城。」","仙台同学露出常见的笑容。","「时间不早了，赶快回家吧。」","我听见她温柔的声音。","尽管如此，双腿还是没有动作。","「再不走，我会牵你的手强制拖行喔。」","仙台同学说完便迈开步伐。","我默默地目送那道背影。她很快又转过身。","「宫城，走啦。」","「不走的话，你不是会来牵我的手吗？」","「不要说这种孩子气的话，自己走啦。」","仙台同学叹了口气，沿路折返。经过短暂的犹豫，她握住我手上的包包提把。","她没牵我的手，可是包包变轻了。","仙台同学向前走，我也像要追赶远去的包包般挪动双腿。","「你一直没回来的原因是？」","走在我身旁的仙台同学淡淡询问。","「……只是觉得碰面很尴尬。」","「我想也是。」","「对不起。」","小声道歉后，我听见仙台同学用平时的语气叫了声：「喂，宫城。」然后像平常那样看着我。","「干嘛？」","「一起去买耳环吧。」","「仙台同学要戴的？」","「宫城要戴的。我会帮你买个可爱的。」","仙台同学的语气柔和，拉着我的包包。","「不需要。」","「这是惩罚。毕竟你没有遵守『外宿时要事先联络』的规则。乖乖让我送你耳环吧。」","「我有联络啊。」","「那个不算联络。如果我没有主动联络，你一定会一声不吭，干脆不回家吧？」","「……什么时候去？」","我不想让仙台同学买给我。然而，是我违规在先，只能接受她的提议。","「挑宫城想去的日子就好。」","温柔的声音消失在夜空中。","仙台同学的脚步徐缓。","配合她的步调慢慢走，总觉得连时间的流逝都慢了下来。","〔本话含插图〕"]},{"t":"第3话　想接近宫城","p":["不提周日发生的事。","我们没有做这样的约定。不过周四从宇都宫家回来之后，我跟宫城都未曾提起彼此共度的那段「不属于室友」的时光。我们都明白，若想像过去一样共同生活，这不是一个能随意触及的话题，所以周五周六都没有提起。","可是，今天无法忽视。","距离那个周日刚好过了整整一周。","我们在共用空间里享受新的周日。","「我要喝茶，你要吗？」","我朝乖乖坐在桌子另一侧的宫城搭话。","「热的还是冰的？」","「你想喝哪一种？」","「冰的。」","「那我去倒麦茶。」","我起身准备两个玻璃杯，分别放入三颗冰块。将麦茶从冰箱取出，倒入杯中，制造出一种清凉的声音。","「给你。」","我将其中一个玻璃杯放在宫城面前，坐回自己的椅子。","「谢谢。」","宫城平静地说，喝下一口麦茶。","「宫城今天不打算出门吗？」","「我昨天说过了，没有要出门。」","听起来不太高兴。","反复询问的确是我不对，但宫城采取的行动跟想像中不一样，令我忍不住再三确认。","既然她选择逃离，回家还是会避开我吧。","正因为这么想，我以为宫城会说要和宇都宫出去，随便找个理由在周日一早出门。她却待在共用空间。没有回房间，而且毫无怨言地坐在我面前。","我也不是完全不觉得尴尬。","有时候，我甚至比以前更不晓得该说什么。宫城大概也一样。从宇都宫家回来后，我们的对话有过几次不自然的中断。尽管如此，宫城仍没有逃走。我们像从前那样度过周五周六。今天也一起吃早餐，刚刚甚至还吃了午餐。","「话说回来，你和宇都宫后来怎样？」","宫城前两天都没提到宇都宫。","她应该有在学校见到宇都宫。一旦碰面，宫城就必须说明我们的关系。这么一来，她应该会向我抱怨几句，例如「都是仙台同学害我遇到这种事」。然而，她什么都没说。","我猜可能发生了什么令她难以启齿的事，所以之前没有问。但我果然很在意跟自己有关的事最后如何解决。","「没怎样啊。」","宫城用怎么听都不像没怎样的语气说。","「真的没怎样就好，不过你是怎么向宇都宫说明我们的关系？」","「我说自己以借钱一事为由，拜托仙台同学教我念书。可是这件事说来有些丢脸，才对外保密。至于没坦承我们住在一起，是因为这么一来我连高中时的事都得全盘托出，所以瞒着她。」","「你想了一个还算合理的说法呢。」","「我也不愿意说谎，可是我不得不做。」","「结果呢？」","尽管有些加油添醋，我确实有教宫城念书。这不仅能说明她放学后的行踪，宫城的成绩变好也是佐证。","可是作为隐瞒的理由又稍嫌薄弱。","「……就算你这么问，我也不知道该说什么。」","「宇都宫相信了吗？」","「……勉勉强强。迟早得更仔细地对她说明……虽然我不晓得该从何说起。」","比起拿钱办事的我，花钱命令我的宫城大概更难开口吧。","「总之，她愿意接受这个理由就好了吧。」","这充其量是缓兵之计，但现在只能仰赖宇都宫的温柔了。","「不好。」","「为什么？」","「……舞香说她想来玩。」","从她沉重的口吻和内容推测，这正是宫城没主动提起宇都宫的理由，也是宇都宫选择接受的原因。即使说词中不乏疑点。","「就让她来啊？」","要她不深究的交换条件。","如果那个条件是来这里，那就让她来玩啊。","「不行。她也想跟仙台同学聊聊。」","「那有什么关系？我也想跟她聊聊。」","「……仙台同学想跟舞香聊天吗？」","「她好像满有趣的，我们说不定很合得来。」","高中时没有发现，不过宇都宫应该是聊过就能建立良好关系的类型。即使不是，我也想更郑重地向她道谢，感谢她帮我带回宫城。","「你会跟她变成朋友吗？」","宫城稍微压低声音，直直盯着我看。","她的眉间没有堆起皱纹，视线却相当刺人。","「说不定喔。」","我们念同一所高中，曾经是同班同学。而且，考虑到我的室友宫城和她是朋友，我没道理不和她当朋友。当然，这要看宇都宫想不想和我当朋友。既然说想来这里玩，表示她至少觉得可以和我交好吧。","「仙台同学。」","宫城的语气强硬。","这不是什么好现象。","感觉她会说出我不想听的话。回问「怎么了？」，宫城便清楚地说：","「舞香是我的朋友。」","我当然知道，用不着特别强调。","宇都宫可以说是宫城最好的朋友。","不希望自己的好友被抢走。","我能理解这种心情。","理解归理解，能否在心里消化又是另一回事。","宫城是如此重视宇都宫，甚至不许我和她产生交集。这个态度让我现在十分焦躁。","「我不会抢走她啦。」","尽量用开朗的语气回应，不让宫城察觉我内心的感情。","拿起因水珠而变得潮湿的玻璃杯，喝下半杯麦茶。","冰冷的液体流过喉咙，降低体温。","被水珠沾湿的手也冰冰凉凉的。","然而，大脑无法冷却。","过去从宇都宫身上感受到的那份无法理解的感情。","明明知道这份感情叫什么，却一直佯装不知。","我在嫉妒宇都宫舞香。","我不愿发现自己在嫉妒最亲近宫城、最常和宫城见面的人。而这份感情往后将如影随形地跟着我。正因为明白宇都宫是个好人，这个事实才让人郁闷。","都怪我察觉了对宫城的感情，过去装作没发现的事才接连浮现眼前。","我轻轻吐出一口气。","「重视朋友」是理所当然的事。","我试着说服自己，却没能平息心中的动荡。","再吐出一口气，然后看向宫城，理所当然似的与她四目相对。","那天一起回来后，宫城似乎经常盯着我。以前明明不是这样。","「仙台同学，我想喝麦茶。」","宫城小声地说。闻言，我看向玻璃杯，这才发现杯里只剩冰块。我起身打开冰箱，拿出宝特瓶，走到宫城身旁，将麦茶倒入空空如也的玻璃杯。","我们都有点在勉强自己。","平常这种时候，宫城早就回房间了。她今天却没有离席，一直和我待在一起。我也一样，比起什么宝特瓶，我更想触碰宫城，却没有碰她。","将宝特瓶放回冰箱。","不知该如何是好。","就算变得比从前更亲密，我们依然是室友。因为我已经决定为需要「室友」二字的宫城保留这个代名词。再说，尽管维持得很勉强，没有改变的关系也令我安心不少。同时，一股焦躁难耐的情绪油然而生。","心情还是乱成一团，不清楚自己究竟想怎么做。即使试着整理，我也不知该从何下手。唯一明白的是，我很高兴宫城还愿意跟我待在一起。","我很珍惜这段逐渐回归的日常，不想破坏它。","这点毋庸置疑。然而，就算是室友，我也想靠近宫城一点。","我坐回自己的椅子，喝了口麦茶，开始思索该如何延续对话。","我们从前就缺少能炒热气氛的话题。交集变少的现在更是无话可说。","不同的大学，不同的朋友。","彼此无法共度的时光。","中断的对话还是没能延续，眼里只映出没减少的麦茶和沾满水珠的玻璃杯。","宫城自己说想喝，却没有喝第二杯麦茶，只是保持沉默。","我们过着看似一如往常，实则有些不同的周日。","「对了，什么时候去买耳环？」","我抛出一个不算理想，但应该和宫城讨论的话题。","虽然在意宇都宫，但我想稍微转移注意力。再说，这个约定从周四以后就悬而未决，如果还要顾虑时机，一辈子都不用谈了。","「还没决定。」","回应的同时，宫城以指尖抹去玻璃杯上的水珠。","「这样啊。」","「什么时候去都可以吧？」","「可以啊。宫城有想要的款式吗？」","「不是仙台同学要帮我选吗？」","「我是打算帮你选，但还是想参考当事人的意见。」","于我而言，耳环非常特别。它能让我记住与宫城的约定。","由于耳洞是我帮忙打的，耳环就像「宣告宫城属于我」的印记。就算她换掉当初那副耳环，新的耳环仍具备特殊的意义。","所以，我不想用钱包里父母给的钱，而是用自己打工赚来的薪水买给她。","「……没有特别想要的。仙台同学选你喜欢的吧。」","冷淡的回应一如预期，但我不打算听她的。","宫城不会真的想要我打工的薪水无法负担的高价品。即使她说想要，我也会买给她。我就是如此希望宫城的耳垂上能戴着我买的耳环，才想问问她有没有喜欢的款式。","听说我准备动用打工的薪水，她一定会拒绝。我也不打算告诉她就是了。","「那让我看一下耳环。」","「为什么非得给你看？」","「可以当作挑选时的参考啊。」","宫城的耳环今天也被头发遮住，看不见。就算知道她的耳环款式，我还是想看。","「去买的时候，我会给你看。」","我不期待她能好好回答，可是这个答案太无趣了。","犹豫片刻，我站了起来，慢慢地把手伸向宫城。","然而，手碰到她的头发前，宫城便往后退开。椅脚发出「喀」的声音。我在碰到她之前就停下，失去目标的手最后落在桌面。我按住自己的手。","换作宇都宫，想必能不费吹灰之力就看到她的耳环。","介意这种事的同时，盘据心中的情感也逐渐膨胀。","想触碰宫城。","如果是不久前的我，早就碰到宫城，把她的头发拨到耳后，甚至盯着耳环了。但上周的记忆太过清晰，令我心生徬徨。再说，宫城的反应未免太大了。","「用不着吓成这样吧？」","我的语调轻快，朝她微微一笑。","不想让看似平静无波的气氛变得沉重。","可是，总觉得再这样下去，我将一直无法触碰宫城。","「我不会做奇怪的事。」","诚实地传达自己的想法，并缓缓伸出手。","宫城没有躲开。","碰到了她的头发。","时隔一周，我的手带着「想碰她」的意志感受着宫城。在宇都宫家时也有抓住宫城的手臂，不过我当时一心想着要带她回家。","碰到的明明是宫城的一小部分，心跳声却大到仿佛会被她听见。我很惊讶自己会因为这点小事而紧张。手指滑过那柔软的头发，将其拨至耳后。抚摸耳环，感受这银色物体有多坚硬后，手指爬上耳垂。","宫城原本想抓住我的手，却又作罢。","视线交会，她没有开口抱怨。","她没抓住我应当被抓住的手，没用不高兴的声音拒绝我，好像为「触碰」这个发生过无数次的行为赋予了不同以往的意义。","仗着宫城没有反抗，我的手愈发放肆。","原本抚摸耳垂的手滑向脖子。","指腹微微用力，抵着喉咙一路向下。只是触碰她光滑的肌肤便舒适不已，上周的记忆跟着被唤醒。一想起宫城那时的声音，胸口就变得好难受，盘据脑海的宇都宫慢慢消失。","缓缓地碰触锁骨。","沿着锁骨轻抚时，宫城的身体微微颤抖，终于抓住我的手。","「不要摸耳朵以外的地方啦。」","她紧紧抓住我的手臂。","「我知道。」","我就这么任由宫城拉开我的手。","看着乖乖坐在椅子上的宫城。","她没有要站起来，也没有瞪我。","我的心跳明显加快。","变化非常细微，但仍不同以往。","我们就像从夜晚转为早晨的天空颜色，一点一滴地改变。可是，我心中抱持某种想超越这股变化，迎接剧烈变动的念头。","就算发生那样的事，生活还是一成不变。那也表示「发生变化的契机」根本不存在。话虽如此，只要不改变，宫城就读大学的期间都会以「室友」的身份待在这里。若是勉强去改变，宫城说不定又会逃走，就此一去不返。","想要改变，又不想改变。","一想到改变后的情况，我就无法采取行动。","「我差不多要回房间了。」","心情仍摇摆不定时，宫城用冷淡的语气说道。","「等一下啦。」","「不要。」","「为什么？」","「感觉仙台同学会做什么奇怪的事。」","宫城站起来。","我在她回房间前抓住那只手臂。","「奇怪的事是指什么？」","「你把手放到胸前，摸着良心想想啊。」","如果是要我把手放到宫城的胸前，我倒是愿意仔细想想。","思考这种蠢事时，耳边传来她不悦的声音。","「仙台同学，放开我啦。」","我放开宫城的手臂，牵住她的手。","「不是这样。」","心中一片雪亮，但我不要宫城就这样回房间。","我的心情和宫城的心情没有交集。","尽管如此，我们仍待在一起。这全得归功于周日时保留了「室友」这个代名词。于我而言，这是一个绑手绑脚，迟早会消失的词汇。同时却犹豫着是否该让它立刻消失。我只想回到「能做以前那些行为的关系」。说得直截了当一点，希望至少能吻她。然而，现在要这么做就需要勇气，堪比向陌生人搭话的勇气。","沉吟半晌，我从「现在的宫城」也会同意的几种行为里选择其中一项，吻上她的指尖。","宫城吓了一跳，那只手紧张得僵住。","我的嘴唇缓缓退开。","「宫城，这是奇怪的事吗？」","她没有回应，但也没有逃走。","我对「宫城仍在面前」一事感到安心，吻上第二指节。","手指微微颤抖。","将嘴唇用力贴上，比起柔软的皮肤，我更能感觉坚硬的骨骼。这时，宫城用比骨头更生硬的声音喊了声「仙台同学」。","不要得寸进尺。","就算不是嘴唇，我还是吻了她，应该满足了。","心里这么想，我却无法克制地让舌头爬上她的手指。这时，宫城摸了我的头发。","那只平时会抓住头发，用力拉扯的手没有动静。我谨慎地吻上她的手背。","从前在宫城的命令下，我做过几次类似的行为。","这对我们来说没什么大不了。","移开唇瓣，然后再次吻上。","用舌尖舔舐光滑的肌肤时，宫城试图抽回手臂。","以前明明强硬地下令，多次要我做出这种行为，哪有今天不行的道理。我用力抓住她的手，轻轻囓咬指尖。","没听见她的声音。","像上周日那样微弱也没关系，但愿她能发出一点声音。","轻咬手指，仿佛要让牙齿陷入皮肤。舌尖同时也抵着指腹。我就像要饮下从伤口溢出的鲜血般轻轻吸吮她的手指。这时，宫城踢了我的腿。","「够了吧？」","那低沉的嗓音使我释放她的手指。","抬头一看，宫城的眉间堆起皱纹。","「果然做了奇怪的事。仙台同学总是立刻想到色色的事。」","「你觉得刚才那样很色吗？」","「我不能这么想吗？」","「宫城命令我做过好几次耶。」","不仅命令我，宫城自己也主动做过。没想到至今经历过无数次的事情会在今天这种情况下，被宫城用「很色」来形容。","类似的话，她其实说过很多次。可是在今天这样的日子，这话听起来就像在说宫城也跟我一样，会将刚才的行为和上周日联想在一起。","「你很烦耶。」","宫城不满地抱怨，踩了我的脚尖。","由于力道集中在一点，这一下满痛的。","「以后别再这么做比较好吗？」","我将被踩的脚从她脚底下抽出来，同时开口问道。","「你有确实反省就好。」","语毕，宫城迳自走回房间，看都不看我一眼。","〔本话含插图〕"]},{"t":"第4话　仙台同学选择的距离","p":["我比以前更常待在共用空间。","准确来说，我刻意地增加和仙台同学共处的时间。","即使迈入六月，这点仍未改变。","「宫城，吃完饭要干嘛？」","仙台同学一边用叉子卷起晚餐的明太子义大利面，一边问我。","「我想喝点东西。」","「那我去泡红茶。」","自那之后——做过室友不该做的事情之后，我变得很难踏进仙台同学的房间。仙台同学也没有找我去她房间。她平时都待在共用空间，不会立刻回房。因此，如果想跟她在一起，我待在共用空间的时间自然会增加。","我慢慢地把义大利面卷上叉子，吞下最后一口。","我不想大幅改变在这里的生活。","我想继续和仙台同学一起生活，继续当她的室友。","若想实现这个愿望，我就不能一味逃避。即使多少觉得尴尬，只要待在一起，我们应该能逐步恢复原本的状态。再说，待在仙台同学身边虽然让我静不下心，离开她也一样。所以我除了待在她身边也别无他法。","「我来洗碗吧。」","看到仙台同学的盘子空了，我离开座位。","「谢谢，拜托你喽。」","我收拾两人份的碗盘，拿到流理台。","真希望周日的事像水一样哗啦哗啦地流走。可是，我不觉得和仙台同学之间的事会如此轻易地流逝。愈想忘记，我就愈在意那天的事。","仙台同学碰了哪里，用怎样的声音在我耳边呢喃。","记忆再次苏醒。","仙台同学过去曾碰触我、亲吻我无数次，所以无论是手的触感还是唇瓣的触感，我都能轻易回想。","即使没我这么严重，仙台同学也同样在意周日发生的事。如果双方都耿耿于怀，迟迟不肯放下这件事，我们将无法以室友的身份度过这四年。","希望早点恢复原状。","周日的事已经成为过去式。","我逐一清洗锅碗瓢盆。","盘子被洗得干干净净，锅中也不存在丝毫污垢。","把晚餐用到的所有器皿清洗干净，坐回椅子。","「仙台同学，我洗完了。」","「那我去泡红茶。」","仙台同学说完便站了起来。","我们没有说好饭后一定要喝红茶。两人一起去买的快煮壶偶尔会派上用场，有时候会喝柳橙汁或麦茶。昨天则吃了冰。实际内容会随着当下情境而改变。","喝什么或吃什么其实不重要。","坐在这里本身就有意义。","「久等了。」","仙台同学的声音传来。她将马克杯放在我面前。","「谢谢。」","我喝了一口红茶，看向对面的仙台同学。","那张脸和昨天、前天或是更久以前相同。","她应该是刻意不做改变。","只有若无其事地生活才能缓解我们之间的尴尬气氛，所以仙台同学用平常的态度和我相处。可是今时不同以往，我常常意识到两人之间的距离感，因而非常在意。","她以前明明无所顾忌地接近我，现在却不那么做。","我盯着仙台同学是想知道她在想什么。然而，我总是看不透她的内心。","能一眼看清的事物有限。","遇见不理解的事情，最好开口问。","尽管心里明白，我还是开不了口，只能看着她。","仙台同学表现得很正常，却明显有哪里不同的原因。","我想知道。","然而，说出这个疑惑势必得提及那天发生的事。","「仙台同学的生日是哪一天？记得在八月？」","我问起自己仍不知道的某件事，代替真正想知道的事。","和仙台同学认识这么久，我却连她是八月几号出生的都不晓得。生日不是什么重要情报。可是，就算是这种事也好，只要能多多了解仙台同学，我或许能得知一部分自己真正想知道的事。","「是没错，但你怎么突然问这个？」","「毕竟快八月了，我只是刚好想到。」","。","注：夏末秋初是落叶的季节，日本使用的和历将八月份称为「はづき」，汉字写作「叶月」","「八月二十三。在八月下旬，还有一段时间。宫城的生日呢？」","「九月二十五。」","之前一直没告诉她，但我今天老实地回答了。","如果不需要回答仙台同学的问题，比起生日，我其实更想知道她家人的事。","我没打算评论仙台同学的家庭环境，却非常在意她的家人。","尽管如此，我仍没有向仙台同学问起她的家人。因为我清楚记得，去年暑假提到这件事惹得她很不高兴。再说，要是她反问同样的问题，我也不能拒绝回答。生日是无所谓，可是我不太想说家人的事。","「二十五号是处女座吗？还是天秤座？」","「天秤座。」","简短回答后，仙台同学意有所指地看着我。","「这样啊。人家都说天秤座善于社交……」","「怎样？」","「没什么。我只是在思考『善于社交』的定义。」","仙台同学轻笑道。","从这反应看来，她不认为我是善于社交的人。","星座占卜不过是随便说说。","如果星座占卜的结果属实，天底下大概只有十二种个性的人。换成血型，更是只会有四种类型。","「仙台同学相信这类占卜吗？」","「不相信……可是如果占卜结果只有好事，相信也无妨。」","仙台同学粲然一笑，喝了一口红茶。","那之后，我们开启一些无从判断是否有意义的话题。聊着聊着，马克杯也空了，于是请她帮我泡第二杯红茶。又过了一段时间，我起身离开座位。","「我差不多要回房间了。」","收完马克杯，我这么说。仙台同学也来到我身旁。","「宫城。」","用温柔的声音呼唤我，抓住我的手。","然后亲吻指尖。","或许是同意过一次，我晚餐后打算回房时，她都会吻我的手。有时只有嘴唇轻触，有时会舔舐手指或手背。无论是何种触碰方式，我都没有说她以后还能继续这种行为。可是，我也没有理由阻止，便随她去做。","这点小事无所谓。","因为从前做过无数次。只是仙台同学现在没有命令也会擅自这么做。","湿润的东西抵住第一指节。","看来她今天不打算单纯亲吻。","舌头带着胜过嘴唇的热度紧紧地贴上手指，滑向第二指节。逐渐被弄湿的手指和舌头的触感，接起了周日的记忆。","没事。","不要紧。","随着微弱的声响，在第一指节和第二指节间落下一吻。","舌尖又攀上手指。","总觉得自己的手变得比仙台同学的体温更火热，我拉了拉她的浏海。","「够了。」","话音刚落，仙台同学便亲吻我的手背，抬起头。","这种时候，我都会感受到与仙台同学之间的距离。","选择逃离这里，先拉开距离的人是我。","在我自己缩短距离前，仙台同学就来接我了。这次应该换我主动拉近距离，如此心想时，我试着增加和她相处的时间。可是，我不晓得自己的做法对不对，有时觉得这么做反而拉开了距离。","换成过去的仙台同学，才不会只吻我的手就罢休。她最近总是在奇怪的时机收手，跟以前不一样，害我很在意。如果想表现得一如既往，这种时候也该比照办理啊。","从舞香家回来之后，仙台同学做事就很不干脆。","我转身背对她，走回房间。","来到坐在书柜上的黑猫面前，盯着自己的手。","即使被仙台同学触碰，它也没有任何改变。","那就是我的手。","将嘴唇抵上手指。","跟被仙台同学触碰时不一样。","我从鳄鱼背上抽出一张卫生纸把手指擦干净，然后倒在床上。","「志绪理，你周日有空吗？我有想看的电影。」","舞香隔着桌子坐在对面，吃完南蛮鸡就看着我。","——偏偏是周日。","我在心中叹了一口气。","虽然不想说，我却不能瞒着她。","「……抱歉，我那天跟仙台同学有约了。可以改下周吗？」","生意很好、不少人来吃晚餐的家庭餐厅里，我的回答仿佛融入了此起彼落的交谈声。","一提到仙台同学，舞香似乎会顺势搬出「要来我家玩」的话题，所以我不想说出她的名字。话虽如此，我实在不想再欺骗舞香。","「可以是可以。你要跟仙台同学去哪里？」","「买东西。」","我停下正在吃炸鸡块的手，老实回答。","「是喔～原来你们会一起去逛街啊。」","不晓得她脸上的笑容究竟是开心还是不怀好意，舞香看起来非常愉快。","「是啊。」","「感觉你们的喜好差满多的，要去买什么？」","「耳环。仙台同学要帮我选。」","我这个周日要履行和仙台同学的约定。那是从舞香家回去途中，仙台同学提出的惩罚，也是我迟迟未履行的约定。这件事也不好一直拖下去，于是我决定这周日和她一起外出。","「这样啊。也是，你打耳洞已经一个月了嘛。不过志绪理居然跟仙台同学好到能请她帮忙选耳环，好神奇喔。」","舞香看着我被头发遮住的耳朵说道。然后，仿佛正好想到这件事，又补上一句：","「话说回来，去你家玩的事情怎么样了？」","果然躲不开这个话题。","我咽下差点逸出口中的叹息，还是忍不住想叹气。只好喝一口乌龙茶再开口回答。","「啊～嗯，仙台同学说可以。」","仗着舞香没问就故意忘记的这件事，现在终于给出答复。","「太好了，我一直很想看看志绪理的房间。什么时候去都可以吗？」","「可以等下个月吗？」","「会不会隔太久了？」","「早一点比较好吗？」","舞香来之前，我还需要一点时间。","我和仙台同学过着一如既往的生活，却不是真的回到原有的相处模式。下个月也不见得能恢复，但应该会比现在更像「室友」。","「没关系，就下个月。」","舞香接受了我的提议，似乎没有急着想来玩。","「那就下个月。我也会先问问仙台同学哪天方便。」","「好。我哪天都可以喔。」","她轻松的回应让我安心许多，张口咬下最后的炸鸡块。","仙台同学做的炸鸡块比较好吃。","我边想边吞下有点咸的鸡肉。","「志绪理，你喝的是什么？」","清空碗盘并放下筷子时，舞香指着我面前的玻璃杯。","「乌龙茶。」","「给我喝一口。」","「……好啊。」","「还是算了。」","说想喝乌龙茶的舞香立刻撤回前言，拿着自己的玻璃杯离席。然后去饮料吧装了姜汁汽水回来。","「你说想喝，结果装的不是乌龙茶喔？」","「我不是想喝乌龙茶才这么问。」","「那刚才为什么叫我给你喝一口？」","「志绪理你啊，不喜欢跟别人共喝一杯饮料吧？」","舞香咧嘴一笑。","「也没有不喜欢。」","「是吗？但你从高中时就很少要别人分你一口，或是主动分别人喝啊。」","舞香说得没错。","我不喜欢和别人共饮。","可是，发现一直拒绝会让气氛变得尴尬后，我就没有次次拒绝。","「我不在意喔，志绪理不喜欢的话就不用勉强。」","舞香开朗地说着，喝下姜汁汽水。","「……我的确不太喜欢，但也没有讨厌到完全无法接受。」","「那仙台同学呢？」","「咦？」","「没有啦，假如对象换成仙台同学，你好像不在意呢。我看仙台同学之前来家里的时候很自然地喝了志绪理的果汁，志绪理后来也喝了。」","这么说来，仙台同学在舞香家喝了我喝到一半的柳橙汁，而我把剩下的柳橙汁解决才回去。","这件事没有糟糕到必须消除舞香的记忆，但也不需要特别向她展示这一幕。因为舞香可能留下「仙台同学对我来说有别于其他人」的印象。","仙台同学并不是什么特别的人。","我不介意和她共饮是因为我们之间曾经存在「命令」。而我们触碰对方的程度，早已让共饮变成无关紧要的小事。","「当时是因为仙台同学突然出现，害我没反应过来。」","姑且给出一个还算合理的理由，但我不确定这样能否解释我们为什么自然地共饮一杯果汁。虽然不想说谎，我却无法诚实回答。","「这样啊。」","舞香显然半信半疑。","「对了，舞香。你后来还有跟仙台同学联络吗？」","我换了个话题。尽管转换方式只能用「唐突」来形容，总好过继续刚才的话题。","「联络过好几次喔。为志绪理的事向我道谢之类的，仙台同学真的很重视礼节耶。」","仙台同学没说自己有和舞香联络。","她的确不需要特别报备，可是这让我不太高兴。比起舞香，我更希望从仙台同学口中得知这件事。","产生这种想法不是什么好事。","我现在很想知道仙台同学在我不知道的地方做了什么，可以的话甚至想限制她的行动。我有意识到自己从高中就有这种倾向，但最近变得更严重了。","我喝下一口乌龙茶。","倾听舞香说话。","我不晓得她究竟在不在意，但舞香没有再提起共饮的事。话题从仙台同学转移到大学生活。","天南地北地聊了几十分钟后，我向舞香道别。","一边思考仙台同学的事，一边跟着电车摇晃。离开车站，踏上归途。","仙台同学要打工，会晚点回家。","本以为我和舞香在一起就不会去想仙台同学，结果脑中尽是仙台同学。在意她会和学生聊什么、用什么样的表情说笑，诸如此类。","不该是这样的。","顺着楼梯爬上三楼，打开家门，脱下鞋子。","仙台同学还没回来。","回到自己房间，从书柜抽出三本漫画。","坐上床，翻阅手中的漫画。","都是看过的漫画，不用多久就翻到最后一页，所以我又拿新的过来。正在看第六本时，一阵敲门声传来。我放下漫画，打开房门。仙台同学就站在门外。","「欢迎回来。」","「我回来了。我想泡红茶，你要喝吗？」","「要。仙台同学不吃饭吗？」","「我打工前有简单吃一点，不打算再吃了。」","仙台同学说完便转身去泡红茶。我走出房间，坐到自己的固定座位。过了一会儿，仙台同学将马克杯放到我面前，在对面坐下。","「谢谢。」","我先道谢，接着告诉她今天和舞香说好的事。","「仙台同学，舞香下个月会来玩。」","「下个月吗？感觉还很久耶。」","和舞香在家庭餐厅的发言相去不远，我忍不住用粗鲁的语气回话。","「才不会，转眼就到了。哪天可以？」","「除了我要打工的日子都行。宫城决定就好。」","仙台同学没确认自己的行程，一派轻松地回应后喝起红茶。","都怪舞香说了奇怪的话，害我很在意仙台同学的马克杯。","嘴唇碰上，喉咙微动，移开嘴唇。","然后将马克杯放在桌上。","如果是其他人喝过的饮料，我完全不想碰。换成仙台同学就没关系，而且从不在意。我不晓得自己为何事到如今才察觉这件事，可是看着仙台同学面前的马克杯，胸口深处便开始躁动不安。","——不要深思比较好。","仙台同学原本和我毫无交集，如果没有在书店巧遇，如果她没有忘记带钱包，我们不会发展成这种关系。正因为开始的方式绝无仅有，她才会和其他人不同。仅此而已。","「干嘛？杯子上写了什么有趣的东西吗？」","仙台同学抓住马克杯的握把，让杯子在桌上转一圈。","「我只是觉得红茶很好喝。」","我将还有点烫的红茶一饮而尽，站了起来。","「宫城？」","「我今天很累，先回房间了。」","「等一下啦。」","见我打算回房，仙台同学起身抓住我的手。","嘴唇快碰到指尖前，我开口叫住她。","「仙台同学。」","「什么事？」","仙台同学紧紧盯着我，我也笔直地看回去。","和高中时别无二致的长发绑成公主头，两侧编成辫子固定在脑后。当时觉得和「学校」这个场合格格不入，比起黑色，更接近棕色的头发，现在非常适合成为大学生的她。她过去总是穿着略短的制服裙，不需要穿制服后，大多选择较长的裙子。衬衫一如高中时期，几乎不扣上第一颗扣子。不同的是，她现在常穿衬衫以外的上衣。","仙台同学感觉和以前一样，却又充满相异之处。","「把手给我。」","视线落在被她握住的手上。听我这么说，仙台同学有些不悦地回应：","「要我放开你？」","「我要你放开我的手，然后把你的手给我。」","「……是可以啦。」","仙台同学松开我的手，将自己的手搭上我伸出的手掌。","这点倒是跟高中时一样。就算不是命令，她也会听我的话。","我将唇瓣贴近仙台同学的手背。","轻轻碰触时，她的手用力抖动，真的吓到我了。这反应不像厌恶，却代表了一种拒绝，让我反射性地松手。","我也不是非得主动碰她。","只想试着再接近她一点。","「对不起，我只是吓到了。」","仙台同学慌张地说，把手伸到我面前。见我迟迟没有动作，她又补上一句「没事的」。","我牵起那只手，用牙齿咬住她的指尖。仙台同学没有动。","我加重力道，仙台同学的手因紧张而变得僵硬。咬到能感受那僵硬指尖的骨头，我才放开她的手。","「很痛耶。」","听她低声抱怨，我看向她的手指，上面留下齿痕。我用指尖滑过齿痕，仙台同学则紧紧握住我的手。","「宫城，你还记得周日的约定吧？」","「我记得。不要选奇怪的耳环喔。」","「我会选可爱的啦。」","这么说完，仙台同学轻轻笑了。","对我来说，六月既不是春天也不是夏天。","穿春装太迟，穿夏装又感觉太早，就是这样一个不上不下的季节。我总是为穿着而烦恼。","唯一能确定的是，这个季节不适合穿我在毕业典礼后买的那件带有春天气息的裙子。结果，我的打扮跟平常没两样——棉质上衣加牛仔裤。","就算是周日，我也不用特地穿「裙子」这种会令人忆起那天的衣服。这或许是恰到好处的选择。","「宫城，你有看到喜欢的吗？」","面对眼前一字排开的耳环，仙台同学不负责任地说道。","她带我来一间似乎有贩售进口杂货的店。比起饰品，其他商品显然更多。尽管如此，店内仍有款式齐全的耳环。","仙台同学说「如果宫城有看到喜欢的就买那个，先看看吧」，我也大致扫过一遍，但无法立刻做决定。","真要说起来，明明是仙台同学要帮我选，应该由她来决定吧。","「哪个都行，仙台同学帮我选啦。」","「真的哪个都行吗？」","「嗯，可以喔。」","原本想着，要是被她带去全是高价品的店里，我只需要掉头回家。然而，面前陈列的耳环大多价格亲民，就算她买来送我也不至于产生罪恶感。","「那这个如何？」","仙台同学讲得像她从一开始就选好了，将银色的耳环递给我。","「……别的比较好。」","我的眉间大概挤出了皱纹。","这副耳环不便宜，但也没那么贵。","可是问题不在这里。","是款式。","「你不喜欢这种吗？」","「与其说不喜欢，不如说它太可爱了。」","我手中的是小小的花朵型耳环。看向耳环原本的位置，商品介绍的小纸片上写着「缅栀花」，说明这副耳环是以那种花为设计原型。","戴上这副耳环，耳上仿佛多了一朵盛开的花，很可爱。但不适合我。","「会吗？这个造型简约，不至于太可爱啊。」","「别的比较好。」","「这样啊。那这个呢？」","仙台同学指着一副金色耳环。","那副耳环特别大，设计和价格我都不喜欢。","「我不喜欢这么张扬的。你故意选了我讨厌的款式吧？」","「是宫城你说哪个都行叫我帮你选的耶。我已经选了，所以你从这两种里挑喜欢的吧。」","仙台同学愉快地说完后看着我。","我确实有叫她「帮我选」，也在她问我「哪个都行吗？」的时候回答「都可以」。如果说我死都不要从中选一个，还任性地闹脾气，她应该会挑其他款式。但我们已经是大学生了，在店里吵吵闹闹的也很丢脸。","「……这个。」","我将小小的花朵耳环递给仙台同学。","「我去结帐，你在这里等我。」","仙台同学轻快地说完便走向收银台。","我目送她的背影离去，摸了摸自己的耳朵。","指尖碰到的，不是她在这里帮我挑的耳环，而是仙台同学第一次为我戴的耳环。一想到要换成新的耳环，不免有些寂寞。","我无意识地看向架上陈列的耳环。","我对耳环本身不感兴趣，没有「果然比较想要这个」的款式。既然没办法自己找到喜欢的款式，戴仙台同学帮忙选的就好。","「久等了。」","漠然地凝视耳环时，仙台同学拍了下我的肩膀。","「耳环呢？」","她似乎心情很好。手上没有应该结完帐的耳环，想必收在包包里。我以为她会立刻拿给我。","「回家再给你。比起那个，要不要再去哪里逛逛？」","「不用。」","「那去吃饭？嗯～还不到吃晚餐的时间。」","如果是平常的仙台同学，多半会接连提出点子，决定一个新的目的地。她今天却干脆地抛出一句「那回家吧」便迈开步伐。我们没有绕路，顺着来时的路折返，傍晚时抵达家中。","我打开冰箱，将麦茶和汽水倒进玻璃杯。","「我拿进房间喔。」","仙台同学讲得理所当然，将我原本想拿去共用空间餐桌的玻璃杯放上托盘。","「你说房间，是指仙台同学的房间？」","「对。我要给你耳环。」","「不能在这里给吗？」","「你讨厌来我房间吗？」","不讨厌，可是那个周日后，我就没有走进仙台同学的房间。她的房间与那天发生的事息息相关，令我的心跳微微加速。","我不是想抹去自己的记忆，也接受了那天的事，害羞的情绪却迟迟无法淡去。说是这么说，要是选择逃避，我不仅这辈子都无法踏进仙台同学的房间，也会被她发现我还在介意那个周日发生的事。","「……是可以啦。」","听我小声回应，仙台同学笑着端起托盘。","我替空不出手的她开门，走进房间。","床舖映入眼帘，我在一个尴尬的位置停下脚步。","仙台同学好奸诈。","她当时是单方面地触碰我，应该没有我这么害羞。","果然应该叫她在共用空间给我。","「先坐下嘛。」","仙台同学将玻璃杯放到桌上后拍拍我的肩膀。可是我不想坐。","「耳环呢？」","「我帮你戴上。」","仙台同学拉着我走到桌前，硬要我坐下，自己也坐在旁边。","「我自己戴。」","「付钱的人应该有戴耳环的特权吧？还是你有什么不想让我帮忙的理由？」","「就是不想。」","感觉会想起周日的事，所以不想让她碰我的耳朵。","理由就这么单纯。","可是我不想说。这么做仿佛在说自己非常在意周日的事。","「没什么特殊原因就让我帮你戴啦。」","仙台同学说出意料中的台词，同时把手伸过来。我拍开她的手。","「先让我把原本的耳环拿下来。」","仙台同学再次伸手前，我已经摘下耳环，将它放到桌面。摸了摸缺少饰品的耳垂，莫名感到不安。","「可以帮你戴了吗？」","仙台同学从包包里取出小袋子，看向这边。","「可以。」","「你要自己拿出来吗？」","「全都让仙台同学做啦。」","「好。」","随着这轻快的语调，她从袋里取出耳环。","仙台同学的手碰到我，将头发拨到耳后。","心脏怦通一跳，我紧握双拳。","没戴耳环的耳垂被那道视线刺痛，让我有些喘不过气。","我第一次向仙台同学展现没戴耳环的耳垂。或许是这个原因，即便自己看过很多次，我还是静不下心。给她看这个小小的耳洞又不是什么大事，却像某种特别的行为。","方才碰到头发的那只手抚上耳朵。","她确认似的触碰耳垂后侧——耳环后扣先前的位置。我抓住仙台同学的手臂。","「你不是要帮我戴耳环吗？」","「是啊。我只是有点在意。」","「在意什么？」","「宫城没戴耳环的耳垂。我当时打出的洞原来长这样啊～」","仙台同学感慨地说着，随即放开我的耳朵。","「仙台同学不是第一次看到耳洞吧？」","高中时，茨木同学她们也有打耳洞。所以对仙台同学来说，耳洞应该不怎么稀奇。","「是没错，但我第一次看宫城的。」","「不用看，赶快帮我戴啦。」","「好好好。」","仙台同学拿起耳环，缓慢而谨慎地戴上我的耳垂。微微碰到脸颊的手和正在触碰耳后的指尖都痒得我快受不了。忍耐了一会儿，接连传来扣上耳环的清脆声音。仙台同学收回双手。","「戴好喽。」","她说着「拿去」便递来镜子。镜中的我耳朵上开出小小的花朵。银色耳环戴起来比想像中更不醒目，让我安心不少。这个款式果然太可爱了，不过还在我能接受的范围。","「很适合你。」","仙台同学摸着耳环，平静地说道。","我没有回应，迳自道出之前错过时机而没说出口的话。","「……谢谢你买耳环给我。」","「不客气。」","「仙台同学为什么不打耳洞？」","推开仙台同学打算继续摸我耳朵的手臂，问出一个从以前就很在意的问题。","还是高中生时，她以违反校规为由，不肯让我帮忙打耳洞。现在已经没有校规了。","「没什么特别的理由。嗯～如果有什么值得纪念的事，或许能打个耳洞吧。」","仙台同学提出和当时不同的说法，然后直直盯着我。","「我可以再靠近一点吗？」","我默不作声，仙台同学稍微拉近距离。","「让我仔细看看你的耳环。」","她的手没等我回应就触碰耳朵，指尖再度抚上耳环，轻拉耳垂。","被她触碰的地方好烫。","紧绷地挺直背脊，脖子到肩膀的肌肉都变得僵硬。","身体微微后退时，仙台同学靠得更近了，甚至吻上我的耳朵。","她小声地叫了「宫城」。","我没有回应，她又在耳边叫了一次。","被她以轻柔的嗓音呼唤，感觉有点痒。","耳朵再度被亲吻，记忆仿佛连通了那个周日。","她握住我的左手，与我十指交缠。","牙齿抵上我的耳朵，轻轻囓咬。不需要靠这么近，仙台同学的身体却紧紧贴上来，夹杂着呼出的气息，再度呼喊我的名字。","「仙台同学，等一下。」","我推了推她的肩膀。","可是，仙台同学没有退开。","手指爬上我的脖子，嘴唇也紧追在后地攀附上来。体温缓缓地在肌肤上流动，实在太舒服了，几乎要打乱我的呼吸。感觉脖子和肩膀的交界处被舔舐，我这次用力推开仙台同学的肩膀。","「你讨厌这样吗？」","仙台同学的语气平静。","「你太得寸进尺了。」","我松开与她交缠的手指，掌心按住脖子。","「宫城。」","「干嘛？」","「这副耳环很适合你，你要一直戴着它喔。」","看她依依不舍地伸出手指，我反射性地后退。这次，她没有凑上来，我差点绷紧的身体随即放松。","「反正没有其他想戴的耳环。就算你不说，我也打算一直戴着。」","我摸了摸自己的耳朵，喝下一口汽水。","〔本话含插图〕"]},{"t":"幕间　宇都宫舞香的困惑","p":["大学校园里有各式各样的人。","学生和教授。","还有其他学校的人。","正因为是这样的地方，即使遇见意想不到的人也不奇怪。但机率非常低，几乎不可能。实际上，至今从未发生这种事。我甚至没有「巧遇同一所高中但不熟的同学，与对方打好关系」的经验。换句话说，戏剧性的邂逅不是那么常见。","所以我很惊讶。","仙台同学居然会出现在这所大学。","我盯着手机。","里面存放仙台同学刚才给我的联络资料。","「舞香？」","旁边的志绪理出声呼唤，我于是扬起视线。","「志绪理，什么事？怎么了吗？」","「我才想问你怎么了……舞香从刚才就一直瞪着手机，发生什么事了？」","的确发生了什么。","但我现在不能告诉志绪理。","要等仙台同学来家里，我才能说出刚才遇见仙台同学的事，以及当时的决定。现在得专心面对即将开始的课程。","「我来这里途中不小心弄掉手机。担心是不是摔坏了。」","别说摔坏，我根本是怀着「绝对不能弄掉」的心情紧紧握着它走来教室。然而，我不能说自己在想仙台同学的事，只能说谎。","「咦？没事吧？难道摔坏了？」","「好像没事。比起这个，志绪理，你今天打算怎么办？」","「早上也说过了，希望你能再让我住一天。」","「好。」","「抱歉。」","志绪理一脸歉疚，我则笑着说：「别在意。」","「谢谢。」","我看着明显松了一口气的志绪理。","让她借住是无所谓。","我反而不在意这点。","不过……我其实受到很大的打击。","用绳子绑住，拉起逐渐下滑的心情，我将叹息吞回肚里。","和亲戚合租房子。","志绪理一直以来都这么告诉我。这套说词其实存在不少可疑之处，我也不意外她其实是和亲戚以外的人合租房子。可是——","没想到对方是仙台同学。","我和志绪理是非常要好的朋友，高中时总是在一起。不对，「总是」可能不够贴切，但我们一起行动的时间就是长到让人想这么形容。她却没有向我说实话。","追根究柢，光「志绪理和仙台同学是朋友」这事就对我造成不小的冲击。","去年，我碰巧有机会与仙台同学交谈，还问她和志绪理是不是朋友。当时，她否认了。那不过是在各种微小的异样感累积下愈发怀疑，令我耿耿于怀又没有确切证据的疑问，所以我接受了仙台同学的答案。","我不是真的相信她。","也并非完全不信。","就当作是那么一回事。","结果今天才知道——她们果然是朋友。这个事实让我无法整理刚才从仙台同学那边听说的各种情报。现在的心情就像打扫完房间又踢倒了垃圾桶，得重新清理。","一度调整好心情，决定接受对方说词的心中，猜疑的幼苗正生长茁壮。我无法克制地用怀疑的眼光看待一切。","「……舞香。舞香，我在叫你。」","肩膀被「咚」地敲了一下，将我拉回现实。","「啊，抱歉。我没听见你说话。」","看着什么都不告诉我的志绪理。","「没关系啦。不过你还好吗？我看你一直恍神，该不会身体不舒服？」","「没事、没事。」","「……应该是我害的吧？」","志绪理艰难地挤出这句话，然后看着我。","「咦？」","「毕竟我突然跑去你家，还赖着不走。」","「啊～没有啦。不是志绪理的错喔。」","微笑的同时，我的心独自飞向高中时期。","降落在我和志绪理一起读书的去年寒假。","我当时问志绪理是不是跟仙台同学处得不错。","「没有」。她的答案和仙台同学如出一辙。","但她们其实从那个时候就很好，现在还是合租房子的室友。","「真的吗？」","志绪理不安地追问。","我当时应该更仔细地打听。","要她倾吐真相。","可是，就算问她——","不行。","我目前的状态不适合继续思考。","「一个人在家也很无聊，幸好有志绪理。不觉得有点像跟人合租房子吗？」","「有吗？」","「有啊。对了，跟人合租房子到底是什么感觉啊？」","我用突然想到的语气开口，收起拿在手上的手机，把身体转向志绪理。","「咦？怎么突然问起合租房子？」","「没来由地有点在意呢。我想知道你都怎么和亲戚相处。告诉我嘛～当作以后的参考。」","「舞香想跟人合租房子吗？」","「之后说不定会喔。」","「很普通。没做什么特别的事。」","志绪理的语气平淡。","志绪理在借宿期间几乎没有提起合租生活。我不认为能从她口中问出什么，也没打算逼问。她为什么不愿意说出真相？为什么隐瞒她和仙台同学是朋友的事？","两人似乎起了口角，所以这些都要等志绪理今天和仙台同学谈完、言归于好再说。","——我心里明白。不过这种程度的问题，希望她不要跟我计较。","「既然住在一起，你跟那位亲戚应该感情不错吧？」","身为好友却被蒙在鼓里的芥蒂和不小的好奇心促使我开口。","即使将获得的情报碎片拼在一起也不会组出正确的模样。问出不完整的资讯，大脑只会擅自补足不知道的部分，导出错误的答案。所以现在的对话只能当作参考。","「还好。」","「我不晓得志绪理有感情好到会吵架的亲戚。你都没有提过这件事。」","「也没机会说啊。」","「这样啊。那个人很像志绪理吗？」","「为什么觉得我们很像？」","「因为是亲戚，我才想说可能很像。」","「我觉得不像。」","传来她清晰的声音。","「对方是怎样的人？」","「嗯～我想想……满温柔的，留着长发。」","「你的说明是不是太随便了？」","「因为就是这样啊。」","「是喔。真想见见她。」","「有机会的话。」","志绪理好像有些困扰，她接着说：「对了，关于老师今天出的作业。」显而易见的转移话题。我忍住想再刺探一二的心情，如此回应：「作业怎么了？」","「我有个地方不太懂。」","听起来没什么自信。","亲戚的话题就到此为止吧。","我们共度了漫长的时光，聊过大大小小的事，但这不代表我们知晓彼此的一切。每个人都有不愿倾吐的秘密，不需要强行揭穿对方无论如何都想隐瞒的事。","凡事都有「理由」。","不能说的理由。","不想说的理由。","正因为志绪理是我最好的朋友，我更应该尊重她的「理由」。","志绪理不是会说谎伤害他人的女孩。","所以，我应该等她。","「啊，老师来了。」","听见志绪理的话，原本机械式回应的我说了句「剩下的晚点再说」便转身面向教室前方。","当了快两个月的大学生，五月也接近尾声。明明逐渐习惯了这个充满新事物的环境，今天九十分钟的课程却很漫长。迟迟看不到终点。","我看着几乎不提合租室友的志绪理。","和高中时不同，她正在认真听课。","还有其他变化。","现在被头发遮住的那副看不见的耳环也是。","她高中时没有戴耳环。","以前没打耳洞的我现在也戴着耳环，这点并不稀奇。可是，邀请还没打耳洞的志绪理和我戴成对的耳环时，她没给出正面回应。本以为抱持这种态度的志绪理突然想打耳洞是交了男朋友，现在想想，说不定是受到仙台同学的影响。仙台同学的耳朵上也戴着——有吗？我被仙台同学出现在这所大学的事实吓了一跳，实在没印象。回忆起仙台同学高中时的形象，她就算有戴耳环也不奇怪。可是我连她今天的穿着都想不起来。","我从志绪理身上挪开视线，看向前方。","不行。","愈是提醒自己别多想，我就愈在意志绪理和仙台同学的事。","说到底，这两人的交集少之又少，我完全不懂她们为什么合租房子，所以忍不住想回顾过去。","然而，我找不到能串起过去和现在的关键元素。","仙台同学表示，她和志绪理住一起是因为两人是朋友。但她还是没有解释自己高中时为何撒谎说她们不是朋友，感情好到能一起住的契机又是什么，只是向我打听志绪理的事。","还有很多让我介意的点。","想解决这一切，与其向仙台同学追究，逼问坐在隔壁的志绪理还比较快。","——虽然我不打算这么做。","我叹了口气，压下想趴在桌上的冲动。","现在还在上课。","我挺直背脊，瞪着老师。","再怎么想也只是原地打转，不会有进展。头晕目眩地倒下前，我从志绪理和仙台同学的事情上抽离思绪，专心上课。","时间的长度不会变。","为了不思考多余的事，我竖耳倾听老师的讲课声。","结束学校漫长的一天，我和志绪理在家庭餐厅吃晚餐，然后一起回家。","打开玄关门，边说「我回来了」边走进屋内。志绪理那句「我回来了」也随后跟上。","我很喜欢这种感觉。","我不曾与人合租房子，不清楚实际情形。可是一想到有某个人和我待在同一个空间，喜悦之情便油然而生。这当然是因为和我在一起的人是志绪理。如果对象是她，合租房子或许也不错。我不禁冒出这样的想法。","对我来说，志绪理就是如此重要的朋友。","正因为如此，我希望她不要隐瞒「室友是仙台同学」的事实。","「志绪理，你要喝点什么吗？」","我看向地毯上的志绪理，她回了一句「我想喝柳橙汁」。","「我去倒，你坐着吧。」","从冰箱里取出柳橙汁，倒进玻璃杯，再将玻璃杯放到桌面。","「谢谢。」","志绪理朝我微微一笑。","在她对面坐下，闲聊着无关紧要的话题时，手机发出震动。我看向萤幕，是仙台同学传来的讯息。上面写着『我快到了，没问题吗？』。","「等你结束打工再来我家如何？」我今天对仙台同学做出邀请。这是为了让志绪理和仙台同学言归于好，也是我今天必须完成的最大任务。","她们在逃避。","志绪理一直借住在我家，不肯回去和仙台同学合租的那个家。仙台同学说自己有家教的打工，要我转告志绪理「早点回家」，不肯来我家。","无论是志绪理还是仙台同学，我都有很多想问的问题和想说的话。但还是先让她们俩见面，一起回家比较好。","我传了一句『没问题，等你来。』回复仙台同学，将视线从手机移向志绪理。","「志绪理，你真的不回去吗？」","「嗯。」","「跟你吵架的人应该也很担心喔。」","开口的同时，脑中也浮现仙台同学的表情。","〔本话含插图〕"]},{"t":"第5话　不想让宫城知道","p":["即使某天发生了特别的事，它也会随时光流逝埋没在过去当中。","那个令我难以忘怀的周日也一样。","我的确有刻意将当时的记忆收藏在心中某个不起眼的角落，和宫城过着毫无变化的每一天。这种如盖印章般重复不变、日复一日的生活不是我想要的，可是这么做能让我们的关系更接近原本的模样。","话虽如此，我的生活也不是一成不变。","「老师，大学生活开心吗？」","本来在写作业的花卷妹妹抬起头。","「普普通通吧？花卷妹妹在学校过得开心吗？」","我不晓得自己算不算好老师。可是，无论是家教的打工还是「老师」这个称呼，我都习惯了。我也掌握了与花卷妹妹的相处方式，不像刚开始那么紧张。在努力保持不变的日常当中，作为家教的我正逐渐改变。","「很开心。甚至想继续留在国中。」","花卷妹妹做出考生不该有的发言，夸张地叹了一口气。","「真希望能一直当国中生。待在现在的班级很开心。」","「高中说不定也很开心喔。」","「老师读高中时开心吗？」","我没能考上志愿的高中。","后来，我靠着聪明的处事态度让自己度过还不错的校园生活。充其量是「还不错」。这点却因为与宫城共度将近一半的高中生活而改变了。","「就结果而言很开心吧。」","「结果……意思是过程不开心吗？」","「过程也很开心喔。所以我才觉得花卷妹妹可能也会很开心啊。」","我笑着回应。","「我也知道『说不定会很开心』，但还是更喜欢现在～」","花卷妹妹又叹了一口气，继续说道：","「老师觉得高中生活的哪个部分很开心？」","花卷妹妹不是会兴奋地大声喧哗，或打开话匣子就停不下来的人，但她喜欢聊天。只要回答她的问题，对话就不会中断，和总是默不吭声的宫城差多了。","「嗯～这个嘛～」","开心的点有些难以启齿，令我一时语塞。","我不能说出自己和宫城之间的种种。即使说了，那也不是她听完会说「感觉很开心耶」的内容。","「这个反应，莫非是有交往对象？」","听见这兴致勃勃的发问，宫城的脸理所当然似的闪过脑海。我将它赶出脑袋，然后在脸上堆起笑容。","「我知道了。花卷妹妹觉得国中生活很开心是因为有交往对象吧？」","「我没有那样的对象。」","花卷妹妹立刻回答。","「这样啊。如果有那样的对象，你要立刻告诉老师喔。」","闲聊算是休息的一种，也能缓和气氛。在念书途中插入短暂对话能转换心情，让她等下更专心。换作平常，我会再陪她聊一下，可是这个话题不能再延续下去了。","「差不多该继续了吧？」","我结束对话，督促她继续写作业。","花卷妹妹简短地回了声「好」，低头看向笔记本。","笔尖滑过洁白的纸张。","自那之后，我像平常一样指导她到指定的时间，离开花卷妹妹家。","走到车站，搭上电车。","想起和花卷妹妹的对话。","「交往对象」这个词不适用于高中时的我和宫城。现在也不适用。至于往后是否适用，还是个未知数。","我不想用自己对宫城的喜欢来合理化周日的行为。这个想法没有改变，可是这样一来，我反而不晓得该何时表白。感觉不管是今天说还是明天说，她都会将「喜欢」这个词视为一个装饰品。用来妆点过去，正当化我的种种行为。","我看不到自己能正确传达心意的未来。","所以，「交往对象」这个词仿佛在遥远的彼端，跟我毫无瓜葛。比起成为宫城的恋人，我更不愿放开至今累积的这段关系。","时间让我变得胆小，也让我意识到自己可能因为表白而失去多少事物。","电车停下，又继续行驶。","重复同样的事，慢慢接近目的地。","摇晃的电车里，不稳定的未来倒映在车窗上，随即消失无踪。","我和宫城的目的地在哪里呢？","甚至不确定我们是否朝同样的方向前进。","我离开停停走走的电车。","在路灯照耀下踏上归途，爬上楼梯，打开大门。宫城的鞋子在玄关。走进共用空间，只见桌上放着一张便条纸。","『可以吃布丁。』","打开冰箱，两颗布丁坐镇该地。我没碰布丁，拿出蔬菜和猪肉下锅拌炒。用简单的晚餐填饱肚子后，我来到宫城的房门前。","轻敲三下，房间主人露面了。","「欢迎回来。你吃布丁了吗？」","「我回来了。正准备要吃，所以来叫你。」","听我这么说，宫城老实地走出房间，坐上椅子。我拿出两人份的布丁和汤匙后跟着落座。","「我开动了。」","异口同声。","撕开封膜，用汤匙舀起布丁送入口中。","Q弹的布丁比想像中更甜。","我看向宫城，她正一口一口地享用布丁。","看起来心情很好。大概是觉得好吃吧？","像这样和宫城在一起，我知道她不讨厌我。然而，不讨厌不等于喜欢。真要说起来，宫城根本不相信我的话。「喜欢」这个词或许连「合理化周日的行为」都办不到。","想让宫城相信我的话非常困难。我甚至觉得，如果问她要不要跟我交往，她一定会不假思索地拒绝。现在也是，如果我说「你看起来心情很好呢」，她一定会用「才没有」反驳。","宫城就像一只戒心很重的野猫，不喜欢变化。","「喜欢」的情感会大幅改变彼此的关系。若是告诉现在的宫城，恐怕一切都会告终。","我们不能再当室友，宫城也会从我面前消失。","既然如此。","如果事情会演变成那样。","干脆什么都别说。","持续过着如盖印章般一成不变的生活，我就能用室友的身份触碰宫城。关系不会改变。相对的，我也不会失去任何东西。","即使对现状不满，我也能抽出埋没于过去的记忆来观赏，藉此忍耐。我不会为了「交往对象」这个词去承担可能失去一切的风险。","我将黄色的块状物送入口中，咽下肚后问道：","「宫城，这个布丁是在哪里买的？」","「附近的便利商店。」","「我下次想吃杏仁豆腐。」","「自己买啊。」","「你很小气耶。」","只要不说「喜欢」，我们就能像这样聊着没营养的废话。","这样就很开心了。","我们持续进行这没意义的对话，一边吃着布丁。","清空容器后又聊了一会儿。对话中断时，我站了起来。","走到宫城身旁。","宫城依然坐着，我用手指梳过她的头发。碰到耳朵后，她微微扭动身体，似乎觉得有点痒，同时抓住我的衣服。","指尖爬上她的耳朵，碰到坚硬的物体。那东西是小小的花朵造型。碰到它，我就觉得自己在宫城心中占据了特别的地位。就算只有我这么想也无所谓。","将嘴唇凑近她的脸颊。","轻轻碰触便退开。","只要维持现状，我就能像这样亲吻她。","拇指滑过她的嘴唇。","宫城仰头看我，身体似乎想逃开。","视线交会。","我用力握紧双拳，心跳渐渐加速。再这样下去，触碰宫城之前，心脏可能会先迸裂。","我主动闭眼，吻上她的唇。","仅仅一瞬间。","轻轻触碰便立刻退开。","睁开眼睛后，宫城依然在我面前。","「明天换仙台同学买布丁以外的东西回来。」","宫城说完便放开我的衣服。","「好。」","忍耐一下就好。","最重要的是，宫城现在愿意待在这里。","我有遵守约定。","一起吃布丁的隔天，我买了杏仁豆腐当作「布丁以外的东西」，和宫城分享。便利商店的杏仁豆腐很普通，没有好吃到让人想推荐给大学同学。然而，和宫城一起吃就感觉特别美味，所以我隔天晚上又买了同样的东西。","在没有家人的家里和不是家人的宫城一起吃东西，无论什么都很美味。","平淡无奇的日子就这么过去。现在，我独自在房里轻声叹息。","明明是难得的周六晚上，天气却很差。","我稍微拉开窗帘，看向窗外。风势强得有如台风过境，雨水也激烈地打在窗上，唯有路灯寂寞地伫足窗外。就算有僵尸在路上走也不奇怪。现在出门说不定会遇到什么鬼东西。","胆小的宫城听到这话八成会生气吧？我如此心想，一边拉上窗帘。","「来看一部电影吧。」","根据天气预报，明天也会下雨。早起也无事可做。","我打开放在桌面的平板，戴上耳机看起恐怖片。","背靠床舖，盯着还投射出和平世界的萤幕。","太适合这样的夜晚了。","真希望能邀宫城一起看。可是给她看恐怖片绝对会被记恨一辈子。而且，宫城应该不会在这种深夜来我房间。","我明明一直待在原地，三十分钟后还是觉得口渴。","停下持续播放的影像，去共用空间倒了一杯麦茶才回房间。这时，窗外传来轰隆隆的沉重声响，显然是雷声。我喝了点麦茶润喉，稍微拉开窗帘，远方的天空闪过一道光。","「宫城是不是怕打雷啊？」","追溯过往的记忆，她高中时说过不喜欢雷声。","看了看时钟。","已经超过正常的就寝时间。","如果她睡了，没注意到雷声，我过去只会吵醒她。这么一想就觉得还是别去观察状况比较好。","可是我很在意宫城。","在房间里转了一圈。","我今天梦到了不想梦见，却又希望梦见的宫城。","过去含糊不清的部分变得鲜明清晰。如此梦境令我对宫城的房间望之却步。做那种梦的早晨，我没有再逃避她的眼睛，但还是会坐立难安。","外面断断续续地传来低沉雷声。","我犹豫了几分钟。","最后觉得没有不去的选择，来到宫城的房门前。","深呼吸两次。","敲了一下门。","宫城没出来。","果然睡了吧？","我应该回自己房间，可是一想到她或许还醒着，双腿便僵在原地。我很担心，想看看她。心中『还是别见面吧』的念头也未曾消散。踏出房间前明明犹豫过，如今又开始迟疑。我比刚才更用力地敲门。","一次、两次。","等了一会儿，宫城没有出来应门。","打算放弃回房时，门开了。","「……仙台同学，你还没睡吗？」","宫城穿着长袖T恤和棉质运动裤，面上不带睡意。她的语气稍显嫌弃，边说边探出头。","「我在看电影。外面在打雷，你还好吧？」","「还好。」","「你之前不是说讨厌雷声？」","「……我的确讨厌，但不是害怕。」","宫城的表情与平时无异。即使外头轰隆作响，她的脸色也分毫未改。","「这样啊。那就好。」","我松了一口气，又有点失望。","将矛盾的心情藏进内心深处，对宫城道了声「晚安」。这时，落雷打在附近的尖锐声响传来。宫城伸手抓住我的手臂，然后立刻放开。","真希望她再碰我一会儿。","要是雷声更大，她说不定会抓着我的手不放。","明明担心地过来探望，脑中却充满不正确的念头。我朝宫城搭话。","「你没事吧？」","如果问她「你会怕吗？」，宫城一定会说不怕，甚至闭门不出。","「太大声了，我只是被吓了一跳。」","「要来我房间吗？」","宫城没有回应。","好像在堤防我。","「你睡不着的话，要不要来看电影消磨时间？」","为表示刚才的邀约并非别有用心，我又补充说明。宫城小声地说「要」，接着走出房间。虽然是我主动邀约，但还是很惊讶她会老实地出来。我挪动脚步，宫城也跟着走进我房间。两人背靠床舖并肩而坐，宫城伸手拿起被我随意搁在桌上的平板。","「你刚才在看什么？」","宫城在我回答前就按下播放键。连接平板的耳机微微传出引人发毛的音乐，她急忙停止开始动作的画面。","「在看奇怪的影片要先说啊。」","宫城踢了我的脚踝。","太不讲理了。","又不是我的错。","「宫城没等我回答就开始播了啊。再说，那也不是奇怪的影片，是恐怖片。」","「恐怖片就是奇怪的影片啦！谁知道你会在这种天气看恐怖片？」","「因为是这种天气才要看吧？你不觉得超有气氛吗？」","「感觉会有什么东西从窗户爬进来，很恐怖耶。」","听起来像真心话，宫城说完就抱住双腿。","她缩起身体抱膝而坐的模样，就像害怕人类的野猫。我很想说「没事的」，伸手摸摸她。但如果真的伸出手，她恐怕会像猫一样逃走。","「宫城挑你想看的电影吧。」","我这么说。她没有看平板，反而盯着我。","「仙台同学，你暑假会回家吗？」","「我不会回去。宫城呢？」","「我也不打算回去。」","「这样啊。」","对话中断。","宫城没有找想看的电影，原本抱膝的双手掌心平贴在地板。","「……仙台同学为什么不回家？」","「嗯～大概是因为比起家里，待在这里比较自在吧？反正父母也不担心我。宫城呢？你家人不会担心吗？」","「说不定会担心。」","「……那你不用回去吗？」","回去比较好。","这时候应该这么说，可是我不想说。","「回去也没有意义……暑假期间，家人几乎不在家。」","宫城难得提起家里的事。","我们都不太谈自己的原生家庭。","「家人」不是我会想主动提起的话题，宫城大概也一样。就算问她，宫城也从未正面回应。不晓得她为什么突然聊起过去总是回避的话题，但看她愿意透露一些应该不想说的事，我感觉自己更接近宫城了。","看向那双黏在地上的手。","就这样伸出自己的手。","还没碰到，宫城已经转身面对我。","「仙台同学。」","她出声呼唤，我则静静等候。","然而，宫城没有继续说下去。","一副欲言又止的样子，却始终紧闭双唇。","「想说什么就说啊。」","「……向我保证你不会做奇怪的事。」","宫城轻声回应。","「奇怪的事是指恐怖片？」","「不是。你是明知故问吧？」","我明白。","宫城口中「奇怪的事」是会出现在我梦里的情节。不用她说，我也不打算那么做。我不是完全不想重现梦境，但如果现在试图重现，宫城一定会离开我房间。我不要她离开。","「我保证。对耳环发誓就好吧？」","宫城轻轻点头。","我把宫城的头发拨到耳后，将嘴唇凑过去。","「我现在不会做那种事。」","在她耳边呢喃，亲吻花朵造型的耳环。嘴唇接着来到耳朵下方，牙齿抵住她的脖子。洗发精的甜美香气真好闻。缓慢、轻柔地囓咬她的脖子时，宫城伸手推我。","「你不是说不会做奇怪的事？还有『现在不会做那种事』是怎样？」","「我刚才做的不是奇怪的事，是对耳环发誓的一环。你也没说一辈子都不可以吧？所以我说『现在』不会。」","「仙台同学，你怎么每次都立刻说那种蠢话啊？」","「不就是因为我很蠢吗？」","「……算了。」","宫城一副受不了我的样子，说完便靠上床舖。","「可以牵手吗？」","没有回应。","宫城默默拿起桌上的平板，主动把肩膀靠过来。","这个距离能感受到她的体温，令我安心不少。看向平板的萤幕，原来的恐怖片已经消失，变成一部几年前的国片。","「外面稍微静下来了呢。」","我没看她，迳自说道。","不时传来轰隆轰隆的低沉声响。然而，我没再听到仿佛会打破墙壁的尖锐声音。","「雨呢？」","「还在下吧？你打算怎么办？」","要回房间吗？","我不想这么问。","想把宫城关在这个房间。","「什么意思？」","「没事。当我没说。」","「仙台同学，可以看这部吗？」","宫城指着平板上的画面。听我回答「可以」，她拔下方才一直接着的耳机，按下播放键。","肩膀是宫城主动靠过来的。","可是她没有牵我的手，所以由我来牵。","她没有抱怨，我们就这么牵着手看电影。","我很想增加彼此的接触面积，但要是画蛇添足，连相依的肩膀和牵起的手都可能离我而去。我只好老实地盯着画面。","这是常见的爱情片，不算无聊，但要说有趣似乎又少了点什么。尽管如此，宫城仍一语不发地专心观赏。我也跟她一起看着平板里头动来动去的人影。回过神来，轰隆轰隆的雷声消失了，唯有时间静静地流逝。","「等这部片播完，你还要看其他的吗？」","盯着即将播放片尾名单的画面，我如此问道。","没有回应。","我看向身旁，发现她闭着眼睛。以眨眼来说未免太久了。看了将近两小时的电影，她会想睡也很正常。","差不多该让宫城休息了。","可是这个房间里只有我的床能睡，我也不认为宫城会乖乖躺在我床上。如果对她说「去睡觉吧」，宫城大概会离开这里。","我想继续看着宫城，不要叫她。","希望她一直待在这个房间。","说是这么说，我也不能放着快睡着的宫城不管。","「宫城，你困了就去睡觉吧。」","我将空着的手伸向平板，触碰萤幕。主角以一个奇怪的姿势停住了。身旁传来带着浓浓睡意的嗓音。","「还不用。」","「你已经半梦半醒了耶？」","「才没有。我醒着。」","「你能撑到这部电影播完吗？」","「……我要回房间了。」","得到预料中的回复，我在宫城起身前用力握紧她的手。","「我还记得约定喔，你睡我的床啦。」","「不用。我回自己房间。」","就算睡眼惺忪，宫城还是有明确回应。","我理解她不想睡在这里的心情，却也不想让她回去。不晓得该怎么挽留，我只好更用力地握住宫城的手。","「……仙台同学说的『现在』到什么时候？」","我对耳环发誓「不会做奇怪的事」时，有加上「现在」这个前提。然而，宫城似乎不允许我含糊带过。","一旦答错，宫城就会离开这个房间。于是我谨慎地挑选用词。","「直到宫城离开这个房间。」","牵着的手逃开了。","可是宫城没有站起来。","「我会继续看电影。」","听我补上这句，身旁传来微弱的声音。","「到什么时候？」","「到早上。」","「……床借我睡。」","宫城喃喃说道，随即躺上原本靠着的床舖。","宫城碰了我的床。","那张我用自己存的钱买来的床。","闭上双眼的宫城仿佛被我的「特别」精心包装，让人想感受她的体温。","宫城占据了我的视野，没有能容纳平板的缝隙。","原本想伸出手，发誓时亲吻的耳环却在此时映入眼帘。","我关上大灯，打开小夜灯。","将耳机接上平板，按下播放键。停在奇怪姿势的主角开始动作，故事也进入尾声。可是我很在意身后的宫城，无法跟上剧情发展。电影只是持续播映。我的意识几乎都集中在背后，身体动弹不得。","不能去在意。","明明这么想，我却办不到。","背部肌肉变得异常敏感。","当我轻吸一口气，打算缓缓吐出时，某个东西碰到我的背。拿下耳机回头一看，原来是我的枕头。而我以为睡着的宫城坐在床上。","「仙台同学。」","「什么事？」","「你真的记得约定吗？」","宫城似乎想再次确认。","「放心，我记得。」","我希望她能睡得更安稳，于是清楚地回答。然后，她轻声呢喃：","「……你可以用半张床。」","「照宫城的逻辑，这个房间应该是我的地盘吧？」","「可是这张床是我的地盘。」","「为什么？」","我忍不住反问。宫城则用枕头打我。","「是仙台同学说我可以睡吧？既然这样，床就是我的地盘，是我要借一半给你用。」","我刚才说她可以睡的床，不知不觉间似乎变成宫城的所有物了。","「床舖的所有权」只是小事。比起这个，我更惊讶宫城居然让我睡在她旁边。","「我真的可以用半张床吗？」","「不想用就继续看电影啊。」","宫城无情地说完就背对我躺下。","「我也要睡了。」","我关上平板的电源。","宫城占据靠墙的半张床，而我钻进剩下的空间。","「很挤耶。」","背后的她动了动，发出不满的声音。","主动让出半张床却开口抱怨。这的确是宫城会做的事，可是我不能接受。","「毕竟是单人床啊。要我买张双人床吗？」","这张床非常重要，我不打算买新的，这句话却脱口而出。","「不用。反正我不会再睡这里。」","或许是清醒多了，她的咬字很清楚。","「那我每天晚上都来说恐怖故事吧。」","「要是做那种事，我这辈子都不会再跟你说话。」","「开玩笑啦。」","就算我立刻收回前言，宫城仍缩起身体，用力扯过棉被。这样一来，我自然盖不到被子。现在别说冷，我甚至觉得有些热，不盖棉被也无所谓。可是宫城的背影埋在棉被里，根本看不见，这样太无聊了。","比起棉被，我更想看宫城的背影、触碰她。更进一步来说，我想掀开棉被和T恤，伸出手直接触碰宫城。","可是我不能打破约定。","如果打破对耳环发誓的约定，宫城真的会生气。","尽管如此，我还是想碰到她的身体，哪里都好。于是稍稍掀起棉被，抓住宫城的T恤。","「仙台同学，你不睡吗？」","传来她低沉的声音。","「还不困。宫城，转过来。」","「为什么？」","「我想吻你。」","我说出宫城多半不会同意的话。","「现在不要。」","她立刻做出意料中的回应，否定的态度却比我想得更温和。我隔着T恤轻轻碰触她的背。","「你很小气耶。」","「小气就小气。」","宫城完全不打算转过来，身体仍缩成一团。我用指尖点了下她的背，宫城就用格外认真的语气叫我：「仙台同学。」","「什么事？」","「……耳环。」","对话中断了。","「耳环怎么了？」","「有什么含意吗？」","宫城用不竖起耳朵就会听漏的音量说道。","「含意是指？」","「这副耳环是以缅栀花为原型设计的吧？」","她用问题回答我的问题。","「对啊。」","「我去查了它的花语。」","「写了什么？」","「……高雅、内向的少女。」","「很适合宫城啊。」","「你明明不是这样想。」","听见那不悦的语气，我收回搭在她背上的手，吐出一口气。","我早猜到宫城可能去查缅栀花的花语。这样的对话也在意料之中。","「反正耳环是用来提醒我『不要忘记约定』的东西，没有别的意思，你不需要在意。还是说，你觉得耳环有什么含意比较好？」","「……没有就算了。」","宫城低声说道，接着陷入沉默。","看她没继续追问，我松了一口气。","宫城说得没错。耳环的确具备某种含意。","但不是花语，而是照着缅栀花设计的耳环本身。","祈求重要的人能获得幸福。","戴在宫城耳朵上的耳环具有这样的含意。","我觉得小小的花朵造型耳环不错，正查询相关资讯时，发现缅栀花造型的夏威夷风饰品具备如此含意，所以决定选这个来妆点宫城的耳朵。","然而，我不想让宫城知道这副耳环有其他含意。","「你把它当成护身符就好了。」","我讲得若无其事，拉回被抢走的棉被，盖在自己身上。","只要我知道那副耳环的含意就够了。","一旦得知其中的含意，宫城绝对不会继续戴。","——即使被她发现，我也打算装傻到底。","「宫城，你很困吧？差不多该睡了。」","「仙台同学也睡啊。」","「不用你说我也会睡。」","得知耳环的含意后，我也想过。","我能接受宫城不喜欢我，却不能接受宫城喜欢上其他人。","宫城现在似乎没有喜欢的对象。","如果她喜欢上某个人，那个人必须是我。","可是，假使未来的某天，宫城喜欢上我以外的人。","我的心胸没有宽大到能给予祝福。所以，当我无法祈求宫城的幸福时，希望耳环能代替我祝福她。同时，我也希望宫城像缅栀花的花语那样，是个即使喜欢上某人也没有勇气告白的内向少女。","我拉了拉宫城的T恤。","「晚安。」","轻声说完，她也小声地回了句「晚安」。","〔本话含插图〕"]},{"t":"第6话　可以再信任仙台同学一点","p":["黑猫不在。","我伸手摸索，寻找应该在枕边的玩偶。","半梦半醒的身体不听使唤，简直就像被人用胶带固定在床上。我一边与不肯睁开的眼睛搏斗，一边挪动沉重的手。然后碰到某个明明很硬，摸起来却轻柔滑顺的东西。那显然不是玩偶的触感，而且非常巨大。","不清楚那是何物的情况下，我稍微用力抓住那个东西。","掌心明确地感觉到温度。","好像还传来微弱的呻吟。","——床上有某个不是玩偶的奇怪东西。","我猛然睁开刚才始终睁不开的眼睛。","「……咦？」","在我眼前的不是黑猫，是不应该存在的仙台同学。","而且很近。","身体没有靠在一起，可是稍微伸出手就能碰到她的脸颊。看来我抓住的是她的头。","滑动手指，梳过她的发丝。","长发宛如要从指尖溜走般轻轻滑落。","闭着的双眼没有睁开。","这么说来，我好像睡在仙台同学的房间。","天候恶劣、刮着强风的夜晚。","我讨厌这样的夜晚。天候恶劣或刮着强风的日子总会发生恐怖的事，连续剧和漫画都这么说。所以我很害怕，觉得一直醒着会发生什么。","可是现在不像以前那么讨厌了。","原因就在眼前。","「……仙台同学。」","我低声呼唤，触碰她的脸颊，轻轻捏了一下。","尽管身体扭了一下，仙台同学还是没有醒来。","无论是怎样的夜晚，我过去都是一个人。昨天光是想到家里还有某个人，我就安心多了。我也不喜欢打雷，却没有怕到会躲进被窝。","所以我本来打算独自撑过这个夜晚。","本来是这样的，仙台同学却来了。","比起知道墙壁的另一侧有人，那人陪在身边更安心。","我滑动放在她脸颊上的手，手指爬上她的唇瓣。","这是碰触过我无数次的嘴唇，也曾经在这张床上碰触我。","记忆轻易地复苏，我差点从床上跳起来，却忍着没有起身。","自那之后，又过了好一段时间。即使回想起那天的事，我也希望自己能表现得泰然自若。持续在意下去，那个周日会被划分在日常生活之外，变成一个特别的日子。","不应该将那天视为需要保存下来的重要回忆，也不能留在日历上。","应该尽量保持平常心。","我闭上双眼，让浮上的记忆沉入脑海深处。","我昨天鼓起勇气选择留在这个房间，但也不想抢走床舖，害床舖的主人整晚没得睡，所以仙台同学才会睡在我旁边。","没事的。","我睁开眼睛看着仙台同学。","她睡得香甜，似乎一脸幸福。","比起「漂亮」，缩在床边的仙台同学更适合用「可爱」来形容。","我又捏了一下她的脸颊。","她果然没有醒。","由于我昨晚迟迟无法入睡，有点羡慕睡得如此香甜的仙台同学。毕竟这是仙台同学的床，她能熟睡也是理所当然，可是仔细想想又觉得她能睡得这么事不关己也很奇怪。","真要说起来，需要勇气的场合之所以无谓地增加都是仙台同学的错。","——总觉得很不爽。","我把手指稍微伸进仙台同学的嘴里。指尖碰到牙齿，她的手有些抗拒地动了动。听见她充满睡意地说了句「干嘛？」，我缓缓将手指伸进她为了出声而张开的口中。","指尖碰到温热的舌头，稍微按压便被她轻轻咬了一下。手指沿着比舌头更坚硬的牙齿滑动后，她咬合的力道变得比刚才更强，我抽出手指。","「不要用奇怪的方式叫人起床啦。」","仙台同学难得皱起眉头说道。","「我又不是想叫醒你，是仙台同学自己醒来的。」","「发现有人把手指伸进自己的嘴巴里，一般来说都会醒吧？既然要叫人起床就用正常一点的方式啦。」","那道声音比平常更含糊，最后还「呼啊～」地打了个呵欠。我轻轻拉扯她的浏海，只见她一副厌烦的模样，随手把头发往上拨，闭上双眼。","「仙台同学，你还要睡喔？」","「我很困。」","「你都醒了，起来啦。」","「办不到。」","她简短地回答，不肯睁开眼睛。","我伸手摸仙台同学的耳朵。","「宫城也睡啦。」","我的手随着她的喃喃自语被拨开。","代替回答，我再度伸手触摸仙台同学的耳朵。","顺着轮廓确认耳朵的形状。","让指尖滑动，捏住和我不同、上面什么都没有的耳垂。比脸颊更冰凉的耳垂软软的，摸起来很舒服。即使我反复揉捏，仙台同学也没有睁开眼睛。我把手指稍微伸进耳朵，她便抓住我的手臂。","「这样很痒。」","我在这张床上说同样的话时，仙台同学没有停手。","我用力拉她的耳朵。","如果现在亲吻这里会怎样？","我在意起这种事，旋即将这段理所当然地夺走思绪的记忆压回脑海深处，松开手。然后撑起上半身，吻上仙台同学的脖子。","她的身体微微一颤。","甜美的香气搔着我的鼻尖。","她身上总是有好闻的味道。","仿佛在试味道般地舔过脖子，接着用力咬下。牙齿不仅感受到柔软的肉，甚至咬到了底下比较硬的部分。这时，她拍打我的肩膀。我放轻嘴上的力道，让舌头抵上她的皮肤。这次她用力推了我的肩膀。当我无可奈何地抬起头，仙台同学差点摔下床舖，我连忙伸手抓住她的T恤。","用力拉向自己。","仙台同学的身体在T恤被拉长变形之前回到床舖，瘫软无力地趴着。","「你为什么要用这种特殊的方式叫人起床啊？」","仙台同学摸着我刚才咬过的地方说道。","「反正闲着没事。」","「用咬人来打发时间很奇怪耶。」","「你不起床吗？」","「不要。」","「那我要回房间了。」","仙台同学摸着脖子的手突然停下动作，从原本趴着的姿势转过来面向我。","「再多睡一下嘛？你今天没别的行程吧？」","这次换她拉扯我的T恤。","「没有是没有。」","不用拉开窗帘就知道外面的天气很差，即使有行程，我也哪里都不想去。可是就这样和仙台同学在床上度过也不太对。","「别担心。我还记得昨天的约定。」","在我离开这个房间前，她不会做奇怪的事。","仙台同学昨天是这么向我保证。","而我还没有离开房间。","仙台同学总是打破约定。然而，对耳环发誓的事尽管不够确实，她都会遵守。","这点令人安心不少。","让我比之前更能够信任仙台同学。","耳环是特别的。","或许正如她所言，是类似护身符的东西。","我摸了摸耳环，回复仙台同学：","「最多再三十分钟。」","「不能再一小时吗？」","仙台同学稍微凑过来，我伸出手，用不至于把她推下床的力道抵着她锁骨一带。","「三十分钟。」","「那就三十分钟。」","仙台同学平静地说完便闭上双眼。","问我究竟是困还是不困，答案当然是肯定的。","可是问我闭上眼睛能否马上入睡，那就不好说了。","实际上不管过了多久，睡魔仍没有袭来。","尽管答应她一起睡回笼觉，我这段时间只是闭眼躺在床上。仙台同学马上就睡着了。即使戳她也没有醒，摸她也一声不吭。","我仰头望着天花板，叹了口气。","过了十分钟？还是二十分钟？","我在闭上眼睛之前没有看时钟，所以无从得知，但是我的睡魔似乎被仙台同学吸收了，导致我毫无睡意。追根究柢，她离我太近了，让我很在意，就算想睡也睡不着。","我生气地踢了熟睡中的仙台同学一脚。","「起来啦。」","「已经三十分钟了吗？」","仙台同学依然闭着眼睛，用带着睡意的声音问道。","「不知道。」","我只知道现在快十一点了。","「……既然不知道，再睡一下啦。」","「你为什么会这么困？」","「因为昨天晚上一直睡不着。」","仙台同学缓缓睁开眼睛看着我。","「你刚才明明睡得很熟。」","「我只是因为太晚睡才会睡得很熟。」","「你为什么睡不着？」","「天晓得？大概是床舖太小了吧？」","她用怎么听都是随便说说的语气回答我。","「我肚子饿，要起来了。仙台同学自己睡吧。」","其实我并没有饿到想立刻吃点什么。可是我也没办法在睡不着的情况下安心地躺在这张狭窄的床上，才决定起床。","「宫城，你要吃东西吗？」","「要。」","「那我也起来吃吧。」","仙台同学「呼啊～」地打了个呵欠，坐起身来。接着早我一步爬下床，大大地伸懒腰，看向时钟。","「这时间有点尴尬，你要吃早餐还是午餐？」","直到刚刚都和床舖融为一体的仙台同学开口问我。","说要吃早餐感觉太晚，吃午餐又太早了。这个时间不管选哪个都不太对，不过真要选的话，我想选可以少准备一次的选项。","「午餐。」","我简短地回答，爬下床舖。","「我来准备，宫城你慢慢来。」","「我要帮忙。」","「那换好衣服之后一起做饭？」","我点头答应仙台同学的提议，走向盥洗室刷牙洗脸。回到房间换好衣服之后来到共用空间，身着长裙的仙台同学已经开始备料了。","和穿着长袖T恤配牛仔裤的我形成对比。","我觉得那身打扮很适合她。","「要做什么？」","我走到仙台同学身旁问她。","「煎维也纳香肠和蛋。宫城负责吐司。」","我照她说的将吐司放进烤面包机里。在我拿出餐具，准备果酱和奶油的过程中，蛋和维也纳香肠也煎好了。我们将装有柳橙汁的玻璃杯和盘子端到桌上后就座。","「我开动了。」","两道声音重叠在一起。","我将奶油和果酱抹上吐司，咬着维也纳香肠的仙台同学则看着我。","「宫城今天还打算做什么？」","「不做什么。」","「既然这样，继续看昨天的电影啦。」","「那部片也没那么有趣，不用看了。」","我没有事先规划行程，和仙台同学共度周日也不是不行，可是我不想继续看那部电影。说是这么说，也没有其他提案就是了。我吞下一口吐司，喝起柳橙汁。","「反正没有其他行程，看一下也无所谓嘛。即使不有趣也能打发时间吧？」","「也许吧。」","「那就这么决定。吃完午餐继续看电影。」","仙台同学理所当然地填满我周日的行程。虽然很想抱怨她过于强硬的作风，我也认为就是需要拿出强硬的态度，我们才能像以前那样共度周日的时光。","一直心存芥蒂会让我们很难继续当室友，所以仙台同学像今天这样，我还比较好跟她相处。如果她太顾虑我，我反而会介意，搞得自己很累。","「宫城好像途中就睡着了，你还记得自己看到哪里吗？」","「我没睡。只是稍微打瞌睡。」","「那你还记得内容吗？」","「大概记得。」","我们聊着没那么有趣的电影，清空了盘子和玻璃杯。然后两个人一起收拾餐具，走进仙台同学的房间，像昨天那样坐着。","「从这里开始可以吗？」","身旁正在操作平板的仙台同学开口问道。等我回了声「嗯」，画面上开始播映昨晚的电影后续。我们连同片尾名单，看完进入尾声的电影。","「怎么样？」","被她这么一问，我老实回答。","「……果然不太有趣。」","「一开始是宫城说要看这部片耶？」","「是这样没错，可是很无聊。」","我让身体往后靠着床舖，仙台同学开始操作平板。","「你还有什么想看的片吗？」","「没有了。」","「那要做什么？」","「不做什么也无所谓吧？」","「可是什么都不做也是闲着啊。」","尽管嘴上这么说，仙台同学还是放下平板，往后靠着床舖。","「如果宫城想出门，要我在下雨天出门也行。」","「我死都不要出门。」","「既然这样，宫城负责想想有什么事可以拿来打发时间啦。」","「那玩游戏呢？」","「我不会。」","仙台同学的语气中充满抗拒。","高中一起玩游戏的时候，她表现得不太好。毕竟她不像会主动去玩游戏的人，就算要打发时间，她大概也不想玩。","「那就无事可做啦。」","「也不是没有。」","仙台同学似乎话中有话。","「……什么事？」","「你转过来。」","她没有针对我的问题回答。","我有不太好的预感，但还是把身体转向她。然后她抓住我的手。总觉得神经一路通到指尖，我看着被她抓住的手。听到她喊「宫城」并抬起头，她便堵住了我的嘴唇。","可是马上就退开了。","我对在这个房间里接吻是有一些意见，但如果只是这种程度，倒也不是不行。这是以前做过无数次的事情，要是夸张地反抗，反而显得我很在意。","所以这种程度无所谓。","仙台同学很快地又凑上来，舔舐我的嘴唇。","我反射性地往后缩，但舌头闯入口中。我试图把未经许可便侵入我地盘的仙台同学赶出去，她却轻易地夺走原本属于我的空间。","那天以后，我们就没有像这样接吻。","明明没有特地去唤醒，周日的记忆却擅自跳出来。我将那画面逐出脑海，温暖柔软的东西便深深探入，缠住我的舌头。比嘴唇更生动的东西灵巧地动着，夺走原本属于我的体温，将仙台同学的体温传递给我。交融的体温使我的脑袋呈现一片空白。","我抓住仙台同学的衣服。","往自己的方向拉过来，用不至于会造成伤口，但也不算小的力道咬了她的舌头。仙台同学稍微从我身上退开，又立刻靠近。然后宛如在报复似的轻咬我的嘴唇。","强势的作风很符合仙台同学的形象，可是不需要在这时候发挥她的强势。","「如果要做的是这种事，大可不必。」","我放开抓着的衣服，推开她的身体。","「你讨厌接吻吗？」","她抛来意想不到的问题。","「与其说讨厌，应该说这不是现在该做的事。」","「那表示你不讨厌对吧？」","「仙台同学，你现在是怎样？不是说好不会做奇怪的事吗？」","「如果你是指昨天的约定，期限只到你离开房间为止吧？你刚才出去过，所以约定已经失效了。」","我记得约定的内容。","仙台同学会这么说也在我预料之中。尽管如此还是搬出昨天的约定，是因为我抱持着即使过期，她说不定还是愿意遵守约定的想法。真的不行就算了。假如已经失效，只要再订下新的约定就好。","「那再向我保证一次。」","不管碰上什么状况，只要仙台同学愿意向耳环发誓就没关系。","「好啊。」","语毕，仙台同学和接吻时一样靠近我，在我耳边呢喃。","「作为交换，宫城，我要再等一下才能向你保证。」","「再等一下是怎样？」","「我不会做奇怪的事。」","仙台同学做出牛头不对马嘴的回应，随即亲吻耳环，接着是脖子。","被她触碰的地方异常滚烫。","她轻推我的肩膀，把重心移到我身上。","在我推开仙台同学的身体前，背脊就先碰到床舖。她的手掀起我的T恤下摆，溜了进来。","「仙台同学！」","我大声叫她。","她明明有听到，手却按在我的腰上，顺势抚摸肋骨下方。我隔着衣服按住她的手。","「你这只手是怎样？」","「你讨厌被我碰吗？」","她用问题回答我的问题。","「要是我说讨厌呢？」","「我就不会再碰了。」","又来了。","这种时候，仙台同学总是逼我做出选择。抛出问题，要我说出她心中早已决定好的答案。","「……我现在不想让你碰，所以让开。你差不多该遵守约定了。」","我伸手推仙台同学。","可是她的身体一动也不动。","我用会留下指痕的力道狠狠抓住她的肩膀。","「宫城，猜拳。」","「咦？」","突然冒出一句不像推倒我的人该说的话，让我松开抓着她肩膀的手。","「要开始喽。剪刀、石头……」","「等一下。」","「布！」","我还没做好心理准备，仙台同学就出了布，我则慢一拍地出了剪刀。","「既然宫城赢了，我就让开吧。」","仙台同学如此说道，接着干脆地退开。我拉下刚才被掀起的T恤，坐起身来。","「还有，我会遵守约定。」","仙台同学粲然一笑。","「……如果我输了，你打算怎么办？」","「我也不晓得耶～」","从她的话语中，我不晓得自己要是输了会怎样。","可是仙台同学没有不准我慢出，就算我猜拳输了，她最后还是会遵守约定。","——我有这种感觉。","我高中时曾经去她家探病。","现在成为大学生，我不需要再去探病了。","要论起原因，是因为她就在隔壁房间，就算不特别说要去探病，也可以过去看看她的状况。应该说，不看也不行。","「你这是遭天谴，谁教你老是做奇怪的事。」","我坐在仙台同学的床边，把冰凉的毛巾放在她的额头上。她的脸色比平常更红润。","「宫城好过分。」","「你吃药了吧？」","「吃了。」","从躺在床上的她口中传出沙哑的声音。","距下雨那晚之后又过了几天，仙台同学的体温超过三十八度。","她早上就看起来很不舒服。","虽然没有咳嗽，但她说喉咙会痛，气色也不太好。尽管如此还是说自己没事。出发前往大学的她，在我回来时已经瘫软无力地倒在房里。现在不至于毫无血色，却与「健康」二字相去甚远，病恹恹地躺在床上。","我不是医生，所以无法断定，不过她怎么看都是感冒了。","「仙台同学很容易感冒耶。」","「我哪有那么常感冒。」","「你高中的时候不也因为感冒而请假了吗？」","「那时候宫城跑来探病，还吻了我呢。」","「我才没有。是仙台同学你擅自吻我的。」","我并没有特地将这件事留存在记忆当中，不过我还记得自己很在意请假没来学校的仙台同学，跑去探病那天的事。那一天，她叫我帮忙在额头上贴退热贴，让我靠近她，趁机吻我。","仙台同学这个人即使感冒，也不能对她掉以轻心。","「我那时候本来想把感冒传染给宫城，可惜没有成功。」","「……你还要做那种事吗？」","「不会。我不希望宫城感冒。」","仙台同学虚弱地说出不同于高中时的话，咳了几声。","「你为什么会感冒？」","「我开着空调就睡着了。」","「昨天有热到需要开空调吗？」","听我这么问，原本面向天花板的仙台同学稍微转身看向我。湿毛巾从她的额头上滑落，我重新把毛巾放在她的太阳穴上。","「……好像有吧？」","传来她虚弱无力的声音。","「即使会热，也该关掉空调再睡啦。」","「我有在反省了。」","低声说完，仙台同学又开始咳嗽。","我知道她怕热，可是昨天没有热到需要整晚开着空调睡觉。虽说将近七月，晚上还是没有那么热。","「话先说在前头，我可不会煮粥之类的喔。」","即使不说，她大概也明白我在这种情况下派不上用场，不过为求保险起见，还是先说一声。和仙台同学一起住之后，我开始能煮出称得上料理的食物了，但还是做不出能给病人吃的食物。","既然身体状况变得这么差，她应该要在我从大学回来之前跟我联络。如果知道她的病情加重，我就会买点东西回来。","「不用煮。我怕你烫伤。而且你要是烧焦锅子，我也很伤脑筋，所以你什么都别做。」","「被你这么说感觉很不爽。」","实际上，我要是去煮粥，的确有可能烫伤自己或是烧焦锅子。可是被仙台同学直接点破就让人很生气。","「反正我也没有食欲，你真的什么都不用做。」","「我去买点什么回来。买优格或是即食调理包的粥就可以了吧？」","我虽然不会下厨，买个东西还不成问题。而且我也想买退热贴回来取代放在她额头上的毛巾。尽管能做到的事情不多，我也不能对病人置之不理。要是不吃点东西，别说恢复健康了，她的病情只会更严重。","「不用。」","「你有什么想吃的东西就说，我去买回来。」","「没有，所以你暂时待在这里。」","她睁开疲惫的眼睛低声说道。接着又马上说：「抱歉。刚才的话不算数。」撤回了几秒前的发言。","「为什么刚才的话不算数？」","「我不想把感冒传染给你。你回房间啦。」","和先前不同，她用清楚明确的声音说道。","的确，如果和仙台同学共处一室，我被传染感冒的机率会提升。可是我踏进这个房间以后马上就打开门窗让空气流通了，而且我离开这里也没有别的事情好做。我不介意吃调理包或泡面当晚餐，所以马上就能解决。教授指派的作业也没那么多。","「反正闲着也是没事，我会多待一会儿。晚点再去买东西。」","与其在自己的房间里在意卧病在床的仙台同学现在状况如何，待在她身边比较好。","「回去啦。你会感冒。」","我又听见高中时的仙台同学不会说的话。","「我是不会感冒的那种人。仙台同学睡着前，我都会待在这里。」","「……这表示你在担心我吗？」","「看到你生病不舒服，我多少还是会担心。」","这次换我说出了高中时的自己不会说的话。","我今天一直在比较过去跟现在。","成为大学生、成为室友之后再重新回顾还是高中生的过去，可以找到许多与那时相似却又不同的地方。","「赶快睡觉。」","我轻轻拍了一下棉被的边角。","「宫城这么温柔，感觉很恶心。」","「仙台同学你很烦耶。闭嘴睡觉啦。」","「等我睡着，你就可以回房间了。」","「好。」","我回话后，仙台同学缓缓闭上眼。","过了一段时间，床上传来入睡后的平稳呼吸声，我将她额头上的毛巾翻面。","今天的仙台同学真的病恹恹的，让人无法置之不理。毕竟她那难受的模样，不用碰也知道在发烧，虽然不像运动时那么喘，呼吸却很急促。","虚弱到不管我做什么都无法抵抗的样子。","她在这种状况下也不会做奇怪的事，所以无须向耳环发誓。","可以静静地陪在她身旁。","我靠着床舖坐下。","尽管我说闲着没事才待在这里，仙台同学睡着以后，我也没事做。","我拿起被搁置在地上的流行杂志，随手翻阅。马马虎虎地翻过一张又一张的轻薄书页后，我发现平稳的呼吸声里混入一声苦闷的呻吟。","我有点在意，看向床上的仙台同学，发现毛巾从她额头上滑落。还是去买个退热贴吧。","「……没事吧？」","我没打算叫醒她，不过还是将毛巾放在桌上，问了一句。正想着她应该不会回话的时候，床上传来她含糊不清，不晓得在说些什么的声音。","她大概睡得很浅。","这种时候要是持续对她说话，她会梦到我吗？","「仙台同学。」","我试着在她耳边轻声呼唤。","传来分不清楚是「嗯」还是「唔～」的声音。","「仙台同学。」","「……嗯。」","她果然对我的声音有反应。尽管觉得这不是该对病人做的事，可是她会乖巧回应，于是我叫了她好几次。虽然有点同情她，但我难得看见如此可爱的仙台同学。","而且——","我知道自己这时不应该有这种想法，可是人痛苦呻吟的声音，和感到舒服时发出的愉悦呻吟声十分相似。再加上仙台同学的呼吸急促，更让我有这种感觉。","应该是地点的问题。","在这个地方想那种事没什么好奇怪的，再说，我曾经很好奇她会发出怎样的声音，脑中才会浮现这些邪念。我明白自己面对病人这么想非常过分，却无可奈何。","我试着将——做了室友之间不会做的事的——那个周日沉入记忆深处，同时又频繁地打捞起来，反复确认那一天。","拜此所赐，我开始会思考这些过去根本不会想到的事。","竟然挑在这种时候，实在太差劲了。","可是这一定是因为那个周日在我体内创造出新的思考回路，让我更容易想起仙台同学。仙台同学原本就经常闯入并占据我的思绪，现在又因为那个莫名其妙的思考回路，害我比以前更常想起她。我实在不能接受。不过这也不是需要特地叫醒仙台同学，向她抱怨的事。","她是病人。","「我要回房间了喔。」","我知道即使她有听见，也只是听到而已，没办法理解这句话的意思，却还是告诉她，站了起来。","继续待在这个房间，我似乎会开始想一些更不应该的事。","还是去买东西，让脑袋冷静一下比较好。","「……你要去哪里？」","握住门把时，身后传来说话声。","回头一看，仙台同学正看着我。","「去买东西。我马上就回来。」","刚才明明在睡梦中也会回话，她这次却什么都没说。","「仙台同学，你有什么想说的就直说。」","「路上小心。」","仙台同学平静地说。","我走到她身旁，坐在床边。","「宫城，你这样会被我传染。赶快走啦。」","「……我说过，等仙台同学睡着我才会回房间。」","「我到刚才为止都在睡吧？」","「可是现在醒了啊。」","「你要是感冒了，我可不管喔。」","「如果真的感冒了，你再负责照顾我。」","我重新坐回地板，朝床上说道。","「嗯。」仙台同学随着一句简短的回应，伸手触碰我的头发。","我可以拍开她的手，但是她在发烧。我无法对病人做那么过分的事，只能任由那只手抚摸我的头发。","照顾病人真的、真的很麻烦。","想抱怨个一句都不行。","所以这也无可奈何。","这只手停下来前，我都会待在这个房间。","〔本话含插图〕"]},{"t":"第7话　宫城眼中的我","p":["感冒不是什么好事。","必须向学校请假，和完全不理会我、只是在家的妈妈待在同一个屋檐下。即使感冒，妈妈也不会费心照顾我，所以就算在同一个家，我们也几乎见不到面。这个事实依然令人郁闷不已。","可是现在不一样。","妈妈不在。在的是宫城。","感冒卧病在床，处于半梦半醒之间。","像这种时候，以前的我总是无法逃离负面思考的掌控，但是有宫城在，我便不会去想那些不好的事。她陪在我身边直到入睡，为我赶走恶梦。尽管宫城像只不肯亲近我的野猫，那天却让我尽情地抚摸她亮丽的黑发。","现在已经康复，她大概不会再让我摸了。","「这么说来，不晓得那只猫在不在？」","我放慢走路速度，环顾四周。","我曾经在像今天这样从大学回家的途中，在离家不远的地方遇见猫。","猫当然是指动物的猫，不是宫城。","我比较希望巧遇宫城，不过猫也不错。我不是原本就喜欢猫的人，只是有一个跟野猫相似的室友，才会特别留意。","在、不在、在。","我边走边左顾右盼，发现三花猫在路边理毛。这只猫不一定会出现，所以今天的运气不错。","「喂～三花～」","我在猫咪附近蹲下来。","「今天要让我摸吗？」","换作宫城，她八成会说「我死都不要」。如此心想时，我伸出手，三花猫「喵～」地叫了一声，让我抚摸牠的背。去大学途中没看到的这只猫似乎是野猫，不过有遇见的时候，牠大多会让我摸。即使不让我摸，也不会伸出爪子来攻击我。","和宫城简直是天差地远。","三花猫像我感冒那天的宫城一样乖乖地让我抚摸。我以前觉得宫城像野猫，然而，这对野猫而言太失礼了。就算没有感冒，野猫也会让我摸，友善多了。","虽然宫城应该只会对我这么不友善。","说是这么说，她的态度并不冷漠，也有体贴的一面。","感冒会这么快康复全要归功于宫城的照顾。","多亏宫城难得地跑来照料我，隔天就退烧了。她对病人很温柔，我甚至希望感冒能一直不要好。","「她要是对健康的我也那么温柔就好了。」","不能对其他人说的事情，对猫就说得出口。","我对着不同于宫城的友善猫咪说话，慢慢摸了牠的背好几次。看来今天的三花猫心情不错，摸了摸牠喉咙下方，牠便一个翻身，露出白色的肚子。","「服务精神这么旺盛啊？」","我抚摸牠软绵绵的肚子。","不晓得是不是有人在喂养，三花猫的毛皮光滑柔亮，摸起来很舒服。","这么说来，摸宫城的肚子也会觉得很舒服。她那不至于过瘦，也没有过多脂肪的肚子会用恰到好处的柔软触感接纳我的手。","真希望她能让我没事就摸一下。","在我动着歪脑筋时，猫或许是察觉到这件事，从我手里溜走了。","「人别有居心的时候，连猫都感应得到啊。」","看不见三花猫的身影后，我起身继续踏上归途。不到五分钟便回到家，打开玄关门。共用空间的灯关着，但宫城的鞋子在家。走到她房间前轻轻敲门，宫城马上就出来了。","「我回来了。要不要做晚餐？」","听我这么问，宫城点点头。","我们决定以冷冻烧卖作为今天晚餐的主角。我将带出门的东西放回房间。回到共用空间后，看到宫城已经在准备中式豆芽菜沙拉的材料。我负责切小黄瓜和火腿，请宫城帮忙烫豆芽菜。趁着把烧卖放进微波炉里加热的时候，将中式沙拉的材料丢进盆里调味。","料理转眼间便完成上桌。我们一起吃了晚餐。","饭后也是两人一起收拾碗盘，泡好红茶后到我房间。宫城背靠着床舖坐下。我将两个马克杯放到桌上后，坐到宫城身旁。","打开空调，把设定温度调高一度。","气温随着时间接近七月逐渐升高。然而，宫城还是经常抱怨这个房间太冷。难得她现在会主动来我房间，我不介意妥协个一度。","我拿起马克杯，喝了一口红茶。","坐在我身旁的宫城也乖乖地喝着红茶。即使是野猫一般的宫城，吃饭或喝东西的时候还是满温驯的。我差点像摸三花猫时一样朝宫城伸出手，连忙再咽下一口红茶。要是碰到她身体的任何地方，她八成会生气地竖起毛发咬我。","「宫城。」","「干嘛？」","「如果我现在叫你让我摸肚子，你会让我摸吗？」","「我死都不要。」","宫城把马克杯放回桌上，用怎么听都很不高兴的语气说道。","「我想也是。我只是说说而已。」","我本来就不觉得她会让我摸。","我没打算做宫城排斥的事，也不抱期望。尽管如此，还是希望她对我的态度至少能像三花猫那样友善。","「仙台同学是变态。不要突然说奇怪的话啦。」","说完，宫城稍微拉开距离。","「这阵子，附近不是有一只猫吗？」","我也不希望宫城像三花猫那样逃走，于是开始解释我之所以被骂变态的原因。","「猫？我没看过。」","「咦？我回家路上不时会遇见一只三花猫，你没看过吗？」","「没看过。那只猫跟肚子有什么关系？」","「因为那只三花猫让我摸了牠的肚子，所以我才在想宫城会不会也让我摸。」","「听不懂你在说什么。我又不是猫。既然猫愿意让你摸肚子，你去摸猫啊。」","像野猫的宫城否定自己是猫。","「嗯，是没错啦。可是猫又不是随时都在。」","我并不是想用宫城来代替猫。","说穿了，如果她不是宫城，我才不想摸。","其实摸的地方也不一定要是肚子。","「仙台同学愿意让我摸肚子的话，我可以考虑一下。」","「可以啊。」","我认真地回答宫城玩笑似的发言。","「咦？」","「作为交换，我也可以摸宫城的肚子吧？我的肚子随你摸。」","「你果然是变态。离我远一点啦。」","宫城皱起眉头，推了我的肩膀一把。","明明是她自己提出交换条件的，却对我这么过分。","回想宫城至今的种种言行，她才适合「变态」这个称号。我可没有叫她舔我的脚，也不曾绑住她的手腕。","宫城到底把我当成什么啊？","我很在意自己在她心中究竟是怎样的人。可是问她「你是怎么看待我的？」，她一定会回答「变态」，所以我决定提出应该可以得到具体答案的问题。","「喂，宫城。有什么像我的动物吗？」","「你怎么突然问这种问题？」","「刚好想到啦。反正也没有其他话题，你回答我嘛。」","「狗。」","宫城冷淡地说。","我不认为这句简短回应是她仔细思考后的结果。","「为什么觉得是狗？」","「因为会听我的命令。」","果然是这种单纯的理由吗？","我过去几乎都有乖乖服从宫城的命令，她会举出这种听话的动物也不奇怪，但是这答案很没意思。","「你说的狗，是指小型贵宾犬或是柯基那种吗？」","「不是。你为什么觉得是那种可爱的狗？」","「可爱的比较好啊。」","「仙台同学不是那种可爱的狗，是更大的狗。」","「大是指大型犬？」","「对。」","「比如哪种狗？」","我能理解她为什么觉得我是狗，可是没想到会是大型犬。我毕竟不算高大，所以很在意宫城想像的是哪种狗。可是她什么都没说。","「没有特定的犬种吗？」","我又问了一次，宫城才无可奈何地回答。","「脸和身体很细的狗。」","她的讲法太笼统，我听完也不晓得那是哪种狗。","难道有什么身型纤瘦的狗狗造型角色吗？","「我没办法想像耶。有那种狗吗？」","「有。我之前在电视上看过。」","「这样形容很笼统，讲得具体一点啦。」","「平板借我。」","我听话地把放在桌上的平板递给她，宫城便开始上网搜寻。没过多久就说「这个」，把画面秀给我看。我探头过去看她手里的平板，画面上的是某种大型犬，不是黄金猎犬或哈士奇这些我知道的品种。","那种大型犬的确如宫城所言，脸和身体都很细。","耳朵是垂下来的。","腿非常长，毛也很长。蓬松的毛几乎全白，也有某些部分是茶色的。看了一下品种，上面写着「俄罗斯猎狼犬」，可是我从未听过。","「总觉得这种狗很像贵族耶，我是这样的吗？」","这种狗与其说可爱，不如说漂亮，有股高贵的气息。看过这个，我绝对不敢跟宫城说她像野猫。甚至开始觉得我那样想很过分。","「我只是看体型。仙台同学比我高啊。」","我的确比宫城高，可是用狗来比喻，应该是中型犬的尺寸。我没有高到能比拟大型犬，也不认为自己像俄罗斯猎狼犬。","「即使比宫城高，也只差四、五公分吧？」","「仙台同学多高？」","「一百六十三公分。宫城呢？」","「一五七。」","「只差六公分，我觉得不至于大到像大型犬啊。」","「很大啊。」","宫城喃喃说道，关掉平板上的俄罗斯猎狼犬图片。然后仿佛在找借口似的说：「我只是觉得有点像。」","我拿起马克杯，看着里头剩不到一半的液体。","红茶表面浮现刚刚看过的俄罗斯猎狼犬。","我不清楚宫城究竟在想什么。","无论是她立刻讲出俄罗斯猎狼犬还是说我像那种狗的原因，我都不懂。虽然很想解开心中的疑惑，可是我知道在她说出「很大」这种随便的回答之后，即使继续追问，她也绝对不会告诉我。而且她现在之所以会在我身旁，是因为还有「喝红茶」这件事要做，一旦喝完，她就会回房间。","宫城不会没事跑来我房间。","所以我慢悠悠地喝了口红茶，将马克杯放回桌上。","「宫城喜欢动物吧？」","我不晓得她的红茶还剩下多少，不过在我喝完之前，她应该不会离开。","「没有特别喜欢。」","「是吗？可是你很了解狗耶。像我根本不知道俄罗斯猎狼犬。你的面纸盒套也是选鳄鱼或鸭嘴兽。」","我把从厨房移居到我房里的鸭嘴兽面纸盒套拉过来，摸了摸它的头。这时，宫城从旁边伸手过来抽出一张面纸。","「狗跟面纸盒套都只是碰巧罢了。」","我无法从冷淡的语气中得知她是不是真的只是碰巧知道俄罗斯猎狼犬，又碰巧选了动物造型的面纸盒套。可是，如果不喜欢，她应该不会记得这么详细，或是选择相关造型的面纸盒套。","「那你没有喜欢的动物吗？比方说狗？」","「还好。仙台同学呢？」","我放下马克杯，看着像猫的宫城回答：","「我可能比较喜欢猫吧？」","「这样啊。因为你像狗，我还以为你会说喜欢狗。」","宫城又抽出一张面纸，将两张面纸揉成一球小纸团。","「我不认为自己有那么像狗。」","「我觉得很像。」","斩钉截铁地说完，宫城将手里的纸团投向垃圾桶。","咚。","纸团撞上垃圾桶后弹开，在地板上愈滚愈远。","「仙台同学，去捡回来。」","宫城指着那球纸团，讲得理所当然。","「我才不做这种事。」","「没差。我也只是说说。」","宫城冷淡的声音传来，她却动也不动。纸团当然也不会自己动，那团白色物体就这么躺在地上。","「宫城，把垃圾好好地丢进垃圾桶啦。」","「仙台同学想丢的话，自己去丢啊。」","宫城看都不看我一眼，似乎心情不太好。","不管怎么看，宫城都没打算自己捡起那团面纸。虽然不想和她玩忠犬与主人的扮家家酒，我还是心不甘情不愿地起身，捡起她丢出去的白色纸团。","「拿去。」","我将面纸揉成的球递给她，问宫城：「满意了吗？」","「还没。」","纸团才刚到她手里，又被放在地上。","「所以你还有其他想要我做的事吗？」","「握手。」","宫城仿佛完全将我当作一条狗，下令后朝我伸手。","蠢死了。","我没必要陪她玩。","才这么想，我又马上改变心意。","我顺从指示伸出右手，放在宫城的掌心。然后抓住她的手用力一拉。轻忽大意的宫城倒向我。我顺势将她拥入怀中。","「你可以再命令我喔。」","心跳声因为拉近的距离与传来的体温而放大，但我选择忽视。","「我没有其他想做的事了。再说刚才的也不是命令。放开我啦。」","宫城的声音明显充满抗拒，还伸手推我，不过我没打算放开她。","「那和命令没两样吧？除了放手，你说什么我都会听，所以命令我啦。」","别说开口命令我了，宫城根本默不吭声。","我只想继续维持现在的距离，她要不要命令我倒是无所谓。宫城犹豫不决的这段时间，我可以继续与她紧紧相依，感受彼此的体温。","「宫城。」","我在耳边呼唤她的名字，随即传来微弱的说话声。","「……那让我摸你的肚子。」","语毕，宫城在我同意前就隔着衣服摸了我的肚子。出乎预料的行为让我反射性地推开自己刚才主动抱住的宫城。然而，她的手依然紧紧抓着我的衣服。","「这命令是怎样？」","「你刚刚自己说愿意让我摸肚子的。」","宫城不悦地拉扯我的上衣。","在刚才宫城说「仙台同学愿意让我摸肚子的话，我可以考虑一下」时，我的确回答了「可以啊」。但我没想到那句话是认真的，也没想过她是会认真说出这种话的人，所以吓了一跳。不过如果交换条件还算数，让她摸一两下肚子也无所谓。","「要是我也可以摸你的肚子，那就随你摸。」","「只有我可以摸你的肚子。你不准摸我的。是仙台同学自己说我可以命令你的，所以你要听我的话。」","不是用交换条件的方式，而是要我遵照后来提出的命令行事，可见她真的是个自我中心又幼稚的人。","我没必要听从这个命令。","我心里明白。","却没办法拒绝宫城。","「……算了，你想摸就摸。」","这就像高中时期留下的习惯，无论宫城是对是错，最后我总是会接受她所说的话。","而且宫城这人没什么骨气。","她一定只会摸个两下就停手。","「宫城，你打算怎么办？」","我开口问她。宫城放开我的衣服，接着缓缓将手伸进衣服里，反复把掌心按在我的肚子上，仿佛小朋友在摸玩偶。","虽然多少觉得她把我当成一条狗，我还是很高兴看到宫城对自己感兴趣。","「好玩吗？」","我问低着头的宫城，她用有些低沉的语气回应：","「还好。」","和冷淡的嗓音相反，她的手仍不断地触碰我的肚子。手放在腰上感觉有点痒，传来的触感和体温又让人觉得很舒服。","本以为马上就会收回的手迟迟没有离开，继续摸着我的肚子。本来有如在摸玩具的动作，渐渐变得像是在抚摸高级的布料。","指尖沿着腰侧往上滑动，轻轻抚过肌肤表面的感触已经胜过搔痒，仿佛要唤起另一种感觉。","我们的距离没有改变。","保持着一小段距离，只有宫城的手紧贴着我。","手一度伸到胸部下方，又立刻往下滑向肚脐处。","「……你的摸法是不是有点色啊？」","宫城摸我的方式让我脑中用来维持理智的那颗螺丝逐渐松脱，愈来愈想做她多半不希望我做的事。我不介意她继续摸，可是这对宫城来说可不妙。","「才不色。」","强硬地说完，宫城原本放在骨盆上方的手又动了起来。我抓住在肌肤上滑动的那只手，她便顺势按住我的肚子。","「宫城。饭后被按着胃很不舒服耶。」","虽然不至于反胃，但我也不想被继续按着。","「既然这样就放开我。」","听话地松手后，她又继续用同样的方式摸我。","我很在意宫城此时在想什么。","宫城是不是也像我触碰她时那样，觉得很舒服或是想再多摸一下？而且我也想知道她为什么会想碰我。","可是我没有余力发问。","宫城的手来到比胃更上面的位置，碰到我的内衣下缘。手停在那里没动，她应该没打算再往上摸。不过，我还是应该在螺丝完全松脱前阻止宫城。","「宫城，那边不是肚子。」","我这次隔着衣服用力抓住她的手。","「你自己说我可以摸你肚子，现在是怎样？」","她不悦的声音传来。","「你无论如何都想继续摸的话，我可以让你摸，但接下来会怎样我可不晓得喔？」","「什么意思？」","「就是我可不管宫城会怎样的意思。」","宫城低着头，没有转过来面对我。我轻扯她的头发。","原本不肯看我的宫城抬起头，与我四目相对。","我的嘴唇凑过去，像狗那样舔了她的脸颊。","「这样下去我的理性会消失。」","我在她耳边呢喃并松开手，她的手急急忙忙地从我的衣服里逃出来。","「变态。我要回房间了。」","所作所为比我更适合「变态」一词的宫城拿起放在地上的鸭嘴兽打我。","「等一下啦。我还没有喝完耶。」","我慢慢喝下冷掉的红茶。","宫城只用面纸擦干脸颊，没有逃离我身边，也没要我对耳环发誓。可是她又低头瞪着地板，我无从得知她脸上挂着什么样的表情。","「仙台同学。」","「什么事？」","「……我是哪种动物？」","宫城小声说道。","「嗯～猫吧？」","我决定不说是野猫。","「猫？为什么？」","「因为宫城很怕冷。如果有暖桌，感觉你会整天都窝在里面。」","说出安全的理由后，我开口提议：","「等冬天到了，要买暖桌吗？」","「完全不需要。」","宫城立刻回答。","听到预料之中的答案，我喝光马克杯里的红茶。","「真的有猫吗？应该说我想回家了啦。我又不是非要看到那只猫不可。」","周日午后，出门才十五分钟左右，宫城却用只能以「不满」来形容的语气这么说。","是我以「找猫」为由把宫城带出来，她从一开始就不想出门。","「急着回去也没别的事情好做啊。再走一下嘛。」","走在行道树落在步道的影子底下，我激励宫城。","我们漫无目的地闲逛，可是无论是路边还是车底下都没看到三花猫。","虽然我本来就觉得牠应该不在。","我都是在大学回来的路上看见三花猫，不晓得牠周日的这个时间会不会出现。","「一下是多久？」","「一下就是一下。」","即使时间多到有剩，宫城没事也不会和我一起出门。除非有非买不可的东西，不然她不会和我去逛街购物。如果不是有什么想吃的东西，她也不会提议要出门吃饭。","需要理由才能一起出门。","所以为了满足我偶尔想和宫城出门的欲望，我刻意编了个理由，那就是出来找不时会在附近看到的三花猫。","真希望我们不用理由也能一起出门。","如果我是宇都宫，想必没有理由也能和宫城一起出门。然而，我不是宇都宫，也不想变成宇都宫。","抬头仰望天空。","太阳耀眼得不像梅雨季还没结束的样子。走在甚至没有风会吹动行道树的街上，的确会感觉与其出来外面，不如待在家里，但我还想再享受一下这段时光。假如在盛夏时节，说不定会被太阳晒干，晕倒在路上，不过现在没有那么热，我决定继续找猫。","「仙台同学明明说只会在附近找一下。你这个骗子。」","宫城说完就用力推了我的肩膀一把。","我之前都是在离家不到五分钟的地方看见三花猫。","因为找过附近之后又一直往前走，我们现在确实在比「附近」更远的地方。","「我是有这么说。可是难得打扮得这么可爱，稍微走远一点也没关系吧？」","今天天气晴朗，室外很热，穿裙子比较凉快。","在我的强烈建议下，宫城和我一样穿裙子。没能帮她化妆是有些遗憾，不过成功让她穿上可爱的衣服，某种程度上也算心满意足了。","「这是仙台同学叫我穿的耶。」","「是没错啦。再往前走一点有间家庭餐厅，要去吗？」","「不要。很热，我想回家了。」","尽管没有皱起眉头，语气却相当粗鲁。","看来她是真的想回家。我觉得宫城很小气。","「那不要去家庭餐厅，再找一下啦。那只猫很可爱，而且牠心情好的时候会让人摸。」","宫城想回去，但我还不想。","「真的有猫吗？」","「有啦。」","我想猫应该不在这附近。","这里离我之前看到猫的地方有段距离。","也不是我平常会看到猫的时间。","猫说不定有在这一带出没，也或许会在比较早的时间出来活动，只是可能性很低。","我觉得自己很缺德。","要宫城来找几乎不可能找到的猫。","可是这点缺德行为应该还在可以接受的范围内。","虽然很难说有好好克制自己，我还是多少有在忍耐，扮演普通的室友。毕竟我平时都很尊重宫城的意愿，偶尔享受一下这种小插曲也无妨吧。","「对了，宫城。俄罗斯猎狼犬也会在街上散步吗？」","我问明显放慢脚步的宫城，让她没办法再继续说「我要回家」。","「我觉得会。但你为什么问这个？」","「因为我这辈子还没在路上看过俄罗斯猎狼犬。」","「我也没看过。」","「这样啊。」","对话就此结束，我看向车道另一侧。那里没有在路上散步的俄罗斯猎狼犬，也没有三花猫。","为了封住宫城的「我要回家」，我开始思考有什么事情适合开启话题。想过几个大学或家里的事情后，我说出刚才浮现在脑中的名字。","「宫城，宇都宫什么时候要来？」","「……还没决定。」","宫城用微乎其微，几乎会被不知哪里传来的孩童嬉闹声盖过的音量说道。","「已经七月了，赶快决定啦。」","「仙台同学之前不是说『哪天都可以』？」","什么时候都不可以。","或是我希望宇都宫不要来。","宫城的语气仿佛希望我这么说，不过我没打算回应她的期待，开口说出如果硬要分类，想必会被归类在宫城听到会很遗憾的话。","「虽然哪天都可以，不过下周日比较好吧？毕竟我们七月下旬都有考试。」","「好。我会再跟舞香讨论。」","宫城立刻回答，一副我的意见根本不重要的样子。","不过就算她不想采纳我的意见，考虑到七月下旬的考试，日期多半会落在下周日。尽管如此，宫城选择尊重宇都宫的意见还是让我心里不太舒坦。即使明白宫城会以朋友为重，这依然不是什么愉快的事。","「定案之后再告诉我。」","我拉起有如沉入水底的石头般一路沉向阴暗处的心情，往前踏出一步。","右、左、右。","交互伸出双腿，慢慢前进。","宫城走在我身旁。","身上那件颜色清爽的裙子随着她的脚步摇曳。","无关款式，宫城只要穿她想穿的衣服就好。但可以的话，我想看到她穿裙子的腿。我本来不是有恋足癖的人，可是因为宫城的命令而喜欢上腿也不奇怪。","「仙台同学，你在看什么？」","腿。","如果这样说，她八成会踢我。","「人行道的磁砖。」","我扬起视线，回答一个接近腿的地方。","「好看吗？」","「满好看的。」","——比起去思考宫城和宇都宫的事。","我把真正想说的话关在心里，看向前方。","总不能一直盯着她的腿。","可是看前面也很无趣，于是我转头看向宫城，她的手臂配合脚步前后摆动，只是不像列队行进时那么大幅度。","「对了，宫城。」","「干嘛？」","「要不要牵手？」","我戳了戳宫城正在动的手臂。","「不要。」","「为什么？」","「因为很热。」","「那回家后就可以牵吗？」","「我不是这个意思。」","她的回答不出我所料，不过宫城要是做出意料之外的回答感觉也很怪，所以这样就好。","「反正猫不在，回家吧。」","「你不是要再找一下吗？」","「毕竟待在凉一点的地方比较舒服，早点回家也不错。」","可惜没能让宫城看见比她温驯友善的三花猫，但是继续找下去八成也找不到猫。我选择踏上回家的路。","「随你高兴。」","她冷淡的声音传入耳中。","我加快脚步。","宫城也用同样的速度走在我身旁。","想早点回家。","即使在家里牵手也不会有任何改变就是了。","〔本话含插图〕"]},{"t":"第8话　仙台同学与三花猫","p":["果然没有。","从大学回家的这段路上，我总是会在不至于被视为可疑人物的范围内左顾右盼，可是从来没看过仙台同学说的那只三花猫。","「……喂～猫咪～」","我试着小声呼唤。","虽然怀疑附近根本没有猫，但是她拿这种事情来骗我也没有意义。这就表示猫其实躲在某个地方。我没找到是因为那只猫不想让我看见。","总觉得很不爽。","愿意出现在仙台同学面前，却不让我看见，太过分了。","我加快脚步。","沿着楼梯爬上三楼。","打开玄关门，脱下鞋子。","仙台同学的鞋子不在。","共用空间当然没有人。","仙台同学还有家教打工那种事要忙，大多是我比较早回到家，所以我已经习惯打开门之后看不到任何人了。","从小就是如此。","玄关门的另一侧，无论我怎么看，爸爸都不在那里。","家里空无一人不知从何时开始成了理所当然。即使说「我回来了」也没人回话，这成为对我而言的理所当然。直到开始找仙台同学来，我的家一直是没有人在的家，我也过着早就忘记待在家里会寂寞的生活。","然而，现在独处的时间一长，便会感到寂寞。","仙台同学深入我的生活，甚至让我回想起已经遗忘的词汇。","她带来的感情是忘掉比较好的感情，不时会令我感到烦躁。","我叹了一口气，走进自己的房间。","拿起悠哉地坐在书柜上的黑猫玩偶，倒在床上。","今天是没有家教打工的日子，仙台同学会比较早回来。","一想到她可能会摸完三花猫再回来，心里就有些浮躁。","我摸了摸黑猫的肚子。","和仙台同学的触感不同。","在我手里的是玩偶，仙台同学是人类。","她有体温，身体里面塞的也不是棉花。把手放上去，她的肚子就会随着呼吸起伏，若是用力按压，她也会开口抱怨。比摸玩偶有趣多了。","如果她还愿意让我摸，我还想再摸。","说是这么说，就是因为在那之后一直没机会实行，我才会在这里摸玩偶的肚子。","我用力按压黑猫的肚子。","里面没有按下去会发出声音的机关，所以黑猫只是弯起身体，什么事都没发生。即使动作轻柔地抚摸，它的表情也和平常一样。","「真无聊。」","我把黑猫放在自己的肚子上，抚摸玩偶的头。","仙台同学说她喜欢猫。","自从听说这件事，我思考过好几次，她之所以选猫的玩偶当成圣诞礼物送给我，是否有什么含意？","……怎么可能啊。","我从床上看向长久以来陪伴我的鳄鱼面纸盒套。","黑猫是这只鳄鱼的朋友。","我记得仙台同学是这么说的。","就是这样，玩偶只是玩偶。即使原本有别的含意，我也不可能事到如今才问她圣诞礼物的事。","和仙台同学在一起，想知道的事情便与日俱增。但也不过如此。想知道的事情几乎无从得知。反而是不想知道的事情一点一滴地装进我的脑袋。","仙台同学比起狗更喜欢猫，甚至会特地出门找猫。","仙台同学的肚子摸起来比以前摸的时候更舒服。","这些非我所愿的新情报虽然没什么大不了，却能有效抑制我因无从得知其他情报而产生的烦躁感。","我坐起身。","今天有必须完成的作业。","大学生给人一种总是在玩耍的印象，实际上并非如此。升上二年级或三年级也许会有所改变，不过现在身为一年级生，要做的事情比我想得更多。我本来还想着要随便偷懒度过大学四年的生活，真是大错特错。","不能这样一直赖在床上。","我毫无干劲地拿出笔记型电脑，打开电源。将资料摆在桌上，开始敲击键盘后，还不到三十分钟，仙台同学柔和的嗓音便随着敲门声传来。","「宫城，你在吗？」","我起身过去打开房门。开口前，仙台同学便抢先说：「我回来了。」","「欢迎回来。」","「我饿了，要不要早点做晚餐？」","「好啊。」","许多想问的事情仍埋藏在喉咙深处，嘴里说出的只有一如往常的家常话。","我走进共用空间，靠近站在桌边的仙台同学。","「宇都宫会照预定的时间来玩吗？」","「嗯。」","舞香约好要来玩的日子经我再三拖延后订在后天，周日下午她会来到这个家。","说穿了，舞香和仙台同学待在同一个空间里并不是我乐见的情况。看到她们在一起，某种难以言喻的情绪便有如将颜料挤进水中般，在我心中扩散开来。可是这件事上个月就讲好了，事到如今也不好反悔。","「仙台同学绝对不可以说什么奇怪的话喔。」","我事先警告不晓得会做什么的仙台同学。","虽然我不认为她会在舞香面前碰我，但她可能会说多余的话。","「我怎么可能说啊。放心，我不会说什么给宫城添麻烦的话啦。」","「仙台同学嘴里的『放心』最不可信任。」","「既然这样，要我对耳环发誓吗？」","这么说完，仙台同学轻轻触碰我的耳朵。","像是在按摩耳垂的手指弄得我好痒，我伸手推她的肩膀。可是，手指没有离开。","「不用现在。」","「为什么？」","仙台同学的手指抚过耳环，滑动到耳后。总觉得那只手上带有不同于发誓的含意，心跳声变得格外响亮。我明白自己太在意她了，意识却逐渐集中到耳朵。","我明明说了不用发誓，仙台同学却把嘴唇凑向我的耳朵。温热的气息吹抚在耳朵边缘，我用力踢了她的脚。","「很痛耶。」","仙台同学放开我的耳朵，后退一步。","「我就是想踢到你会痛。」","「轻一点啦。」","「我要是踢得轻一点，你就不会松手吧？」","「是没错，可是不用发誓吗？」","「仙台同学要是现在发誓，等舞香来的时候，你就会说已经过期失效了吧？周日再说。」","无论是誓言的内容还是时间，都由我来决定。对仙台同学太掉以轻心，她就会擅自增减誓言的内容。","「你还是老样子，一点都不信任我耶。」","仙台同学语带不满地说道，打开冰箱。","「要是真的有猫，我可以多信任你一点。」","我的确比以前更信任她，但也不是在各方面都能信任她。","「你说的猫，是附近那只三花猫？」","冰箱门「啪」地关上。","「没错。谁教我到现在都没看过。」","「……真的有猫喔？」","或许是觉得我在怀疑她，仙台同学有些不知所措地看着我，然后说：「晚餐吃蛋包饭好了。」","迈向车站的脚步无比沉重。","理由很简单，因为那里是我跟舞香约好碰面的地点。","我想转移注意力，试着寻找三花猫，可是到处都找不到。","明明没打算走太快，转眼间却抵达了车站。就在我没别的事情好做，茫然地等待时，舞香的声音传来。","「志绪理，你等很久了吗？」","「我才刚到。」","我对着和平常一样，却又有哪里不同的舞香微笑。","小小的心型耳环和可爱的裙子。","今天的她比在大学时更用心打扮。她在学校当然也很注重穿着，不过今天还是打扮得比平常更漂亮。","「我都说你可以不用来接我了。」","「反正很近，你不用在意啦。」","车站到我们家的这段路没有复杂到会迷路，不过我还是觉得来接她一下比较安心。我说了句「走吧」，便和舞香一起往前走。","「你是不是没什么精神啊？」","我边走边应和舞香的话，身旁传来她明显很担心的声音。","「只是因为天气很热。」","我不能说出真心话，只能随便找个理由搪塞她。","一想到舞香要来我和仙台同学合租的家，我就很紧张，心情也很沉重。","「仙台同学今天在家吧？」","刻意走在建筑物阴影下的舞香看着我。","「在啊。她干劲十足地说要煎松饼。」","因为舞香想见她，所以仙台同学在家里等我们。而舞香比平常更注重打扮恐怕也是因为仙台同学。","还是高中生时，仙台同学是一个与我们截然相反，感觉十分遥远的人。","要去的地方是我家，但那同时也是仙台同学的家，所以舞香会精心打扮也不奇怪。","「松饼？仙台同学厨艺很好吗？」","「我觉得算好。」","仙台同学做的饭总是很好吃。","就算吃的人不是我，大概也会有同样的感想。","可是我有一点点不想让舞香吃。而且舞香八成是为了仙台同学才特别打扮这件事也让我有点不是滋味。我也觉得自己心胸狭隘，但是又不晓得该如何妥善地处理这份心情。舞香是我重要的朋友，我也希望她往后一直是我的朋友。明明是这样，我心里却有那样的想法，不禁讨厌起自己。","「一想到有人在做这种准备，我就有种要去作客的感觉，好兴奋喔。」","舞香开心地说。","我应该要和她一样开心，却发现自己办不到。光是挤出笑容，装出高兴的样子就用尽全力了。","「不是要去作客的感觉，今天的舞香真的是客人啊。所以让我们好好招待你吧。」","「那我就不客气了。」","传来她雀跃的声音。","闲话家常时，我们也不曾放慢脚步。一步又一步，离家愈来愈近。","因为是朝着家的方向走，愈来愈近也是理所当然。要是能变远就好了。我能感受到一股平常不存在的重力，简直像有什么东西在拉扯我的脚。","我今天已经要仙台同学对耳环发誓「不会说奇怪的话」了，照理来说不需要那么担心。舞香平常就不会做出让人困扰的发言，所以不需要担心。然而，我今天不敢保证。只要扯上仙台同学，她就莫名地敏锐，让我很不安。","没事，绝对不会有问题的。","我有如在念咒语一般在内心复诵。这时，舞香停下脚步说：「是猫耶。」","「猫？」","「你看，在那边。」","舞香伸出食指，指着前方不远处的阴影处。","我看向她指的位置，那里的确有一只猫，而且不管怎么看都是三花猫。","「原来真的有猫啊。」","「你说『原来真的有』是什么意思？」","「仙台同学说过附近有猫，可是我从来没看过。之前我们特地出来找的时候也没看到。」","「你和仙台同学一起找？」","被舞香反问，我才意识到自己说了多余的事。","不对，说出来也无所谓。","仙台同学看起来不像会特地出来找猫的人，但这是实际发生过的事。告诉舞香也不会造成任何困扰。","这只是普通的对话罢了。","我明白。","可是在舞香面前提起我跟仙台同学之间经历过的事，我的思绪就会乱成一团。和仙台同学一起去找猫明明不奇怪，我却莫名心虚。","「对。上周日仙台同学突然说要去找猫。」","我尽量用若无其事的态度说。","「志绪理平常都会和仙台同学做这种事吗？」","舞香没等我回话就半蹲下来，轻声对猫说：「来。」可是猫没有过来，依然懒散地躺在阴影下。","我看着猫，继续说着无关紧要的话题。","「没有。之前只是碰巧。因为我没看过这只猫。」","那只猫应该不是对我的声音起反应，耳朵却抖动一下。","「总觉得你们感情很好耶。是说那样根本就是约会嘛。」","「我怎么可能和仙台同学约会啊。而且我也不觉得约会时会跑去找猫。」","我稍微提高讲话的音量，原本躺在人行道上的猫像是因此爬了起来，接着一溜烟儿地跑走了。","「啊～走掉了。」","舞香唉声叹气地说。猫经过我们身旁，跑向远方。","「我本来想摸摸牠的。」","我们随着舞香遗憾的叹息继续往前走。","那只猫明明愿意给仙台同学摸，却不想给我们摸。","看来牠比我想得更小气。","态度真差。","我脑中想着这种事时，舞香又看着我说：「是说刚才聊的那件事。」","「你不觉得『假日出门找猫』很像同居情侣用来打发时间的约会吗？」","猫逃走了，离家也愈来愈近，明明可以顺势换个话题，舞香却又提起刚才的事。我不太想继续聊这个，可是硬要改变话题又像是有什么不可告人的事，只好回答她。","「不觉得喔。如果同居人说要去找猫，舞香认为这样算约会吗？我觉得这就只是去找猫而已，不算约会耶。」","「如果是同居情侣一起去，不管是找猫还是干嘛，都算是约会吧？」","舞香立刻回答，随后又补上一句「我没有那种对象就是了」。","「即使是这样，我和仙台同学也只是合租房子而已，并不是同居情侣。」","听我这么说，舞香似乎接受了这个说法，回了句「说得也是」，然后仿佛突然想起似的继续说：","「对了！志绪理。说起约会，亚美说她和男朋友分手了吧？」","仙台同学的话题就此结束，我们聊起独自留在故乡的朋友亚美，继续往前走。从遇见猫的地方走不到五分钟就到家了，我打开玄关门。脱下鞋子，和舞香一起走进共用空间后，我看见仙台同学拿着调理盆站在那里。那个模样与我出门前别无二致。","「我回来了。」","我对她这么说，她也回我一句「欢迎回来」。","今天的仙台同学穿着女用T恤和裙子，尽管简约，还是有经过仔细搭配。简单来说，她和舞香一样打扮得很漂亮。一想到她明明在家却打扮成这样是因为舞香要来，心里果然很不是滋味。可是我也不能把这种心情表现出来，只好用开朗的语气说道：","「你现在才要煎松饼吗？」","「对。因为刚煎好的比较好吃，我在等你们回来。」","仙台同学边打蛋边说，接着对舞香说了句「好久不见」。","「真的好久不见了。距离那起离家出走事件也有好一阵子呢。」","舞香感慨地说，仙台同学哈哈大笑。","「你那时候真的帮了大忙呢。又发生离家出走事件的话再拜托你了。」","「那才不是离家出走。我只是暂时借宿在舞香家而已，不要讲成奇怪的事件啦。」","真是太令我心寒了。","那件事根本不足以被称为事件。我本来只打算去朋友家避难一下，很快就回来。她们却夸大其辞，把小事讲成大事，还讲得很开心。","「这是伴手礼。」","热热闹闹地聊了一段时间后，舞香递给仙台同学一个小纸袋。","「谢谢。你不用这么客气啊。」","「不是什么了不起的东西啦。只是普通的饼干，你们再一起吃吧。」","舞香看着我，咧嘴一笑。","我很想说我才不要和仙台同学一起吃，我要独吞，但舞香都这么说了，我也无可奈何。","「谢谢。」","我没多说什么，只是向她道谢。","「我接下来要煎松饼，你们先去房间里聊吧？」","「咦？我们一起帮忙啦。」","舞香看着正拿着调理盆搅拌内容物的仙台同学。","「我一个人做就行了。宇都宫想看看宫城的房间吧？而且宫城在这里只会碍事，帮我带走她。」","仙台同学讲话实在太失礼，我拼命忍下那股反射性地想踢她的冲动。如果是高中时期，我可能真的只会碍事，但我现在比以前有用多了。","「那志绪理我就带走喽。哪个是你房间？」","本想至少抱怨个一句，可是舞香拉着我的手臂，我只好带她去房间。","「这间。」","我应付不了她们的联手攻击。","她们不知道为什么默契十足。","明明没有事先演练，却合作无间。","「小了一点，但感觉和高中时差不多呢。」","舞香走进房间就立刻说道。","「因为除了大型家具，其他东西我都原封不动地搬来了。」","「鳄鱼也在啊。」","「对啊，我带来了。你先随意找个地方坐吧。」","我对舞香说道。她本来正在观察这个称不上宽敞的房间，听我这么说便坐到我对面。","我已经和她聊过好几次和别人同住在一个屋檐下的大小事，如今还能激起舞香好奇心的只剩仙台同学了。所以只要仙台同学不在场，我们聊的自然是跟在大学时没两样的话题。","真希望松饼永远都不要煎好。","然而，那是不可能的。","叩、叩。","我们聊到一个段落，门外便传来两道轻微的声响。","那是仙台同学的敲门声，于是我先走出房间。","「松饼煎好了，要怎么办？」","空气中飘散着香甜的气味，仙台同学平静地问我。","我不想让仙台同学进我房间。","这是因为我不希望今天成为仙台同学首度踏进我房间的那一天。如果要让从未进过我房间的她进来，最好不要是有舞香在的今天。","可以的话我想在共用空间吃，又担心舞香会觉得不对劲。","我正思索着该怎么办，舞香就打开房门探头出来。","「怎么了？」","「她说松饼煎好了。」","我还没整理好思绪，把情况原封不动地转告舞香后，她想必以为要在我房间吃，回了句「那我帮忙端过来」。","怎么办？","又不能叫她不要端。","我一时语塞地看向仙台同学。这时，她好像突然想到什么，开口说：「对了。」","「宇都宫，你要不要也来我房间看看？」","「我是很想，不过真的可以吗？」","「可以啊。松饼就在我房里吃吧！」","仙台同学粲然一笑。","〔本话含插图〕"]},{"t":"第9话　希望宫城告诉我的事","p":["「总觉得跟想像中不太一样。我本来以为会是更有女大学生气息的房间。」","走进房间，宇都宫说出我似乎曾在哪里听过的台词。","「宫城以前也说过类似的话。」","宇都宫对我的印象多半还是高中时那个配合羽美奈行事的我，难怪她会跟第一次看到我房间的宫城有类似的感想。毕竟我现在即使在大学里也不太做表面工夫，可以的话还是希望能重新改写我在她心中的印象。","「类似的话？志绪理说了什么？」","「我说了什么啊？」","宫城有些困惑地说，将盛装自己那份松饼的盘子和装有冰红茶的玻璃杯放到桌上后坐下。","自己的份自己端。","我们是如此决定的，所以我和宇都宫也同样拿着盘子和玻璃杯走进房间，放到桌上。然后我坐在宫城的斜对面，宇都宫则坐在我对面。","「你去年暑假来我家的时候，不是说你以为会是更有女高中生气息的房间吗？」","我说出宫城想必不希望我说出来的事。","宇都宫知道我和宫城从高中时期就有密切来往。而且告诉她的说法是我当时有在教宫城念书，所以我们就算有去过彼此的家里也不奇怪。","谎言愈多，愈容易出现矛盾。","比起不自然的隐瞒，不如讲些就算说出来也不会惹出大问题的事。","看了看宫城，她正用不满的眼神盯着我，但我选择无视。","「既然你们感情好到会去彼此家里玩，早点跟我说就好了嘛。」","「确实。要是早点说，就能更早三个人一起吃松饼了。宫城你说是不是？」","「是啊。」","宫城尴尬地笑了笑，问：「可以吃松饼了吗？」我也没打算让她继续困扰下去，对两人说：「在凉掉之前赶快吃吧！」之后，她们也纷纷开口：「我开动了。」","「啊～松松软软的。好好吃喔。」","宇都宫吃了一口松饼，从对面露出灿烂的笑容。","「谢谢。你觉得好吃真是太好了。」","我也小声地说「我开动了」，用刀切开松饼。","「虽然听志绪理说过，不过仙台同学厨艺真的很好耶。你很喜欢下厨吗？」","「也不算喜欢啦。不过宫城有这样说喔？」","厨艺很好。","我不晓得宫城是这样看待我。","追根究柢，我从来没有听宫城好好讲过她对我的看法。同理，我也是最近才知道她觉得我像俄罗斯猎狼犬，没听过比较具体的说法。","「志绪理在来这里的路上告诉我的。」","「是喔？她平常明明不太说这种话耶。」","我看向斜前方的宫城，她虽然没有皱起眉头，脸上却挂着说太阳穴在抖动也不为过的怪异表情。","「我说过很多次好吃啊。」","宫城语气粗鲁地反驳，宇都宫则轻笑出声。","她没有否定自己说过我厨艺好。宇都宫说的大概是实话。","宫城在朋友面前夸奖我。","这么一想就觉得很不可思议。","我带着轻飘飘的心情，将松松软软的松饼送入口中。","柔软的松饼配上枫糖浆的甜味，令人心情愉悦。我又吃了一口松饼，看向宫城。她也在吃松饼，可是没说好吃。说一下又不会死。","我们一边聊起某间店的圣代很好吃，或是最近买了些什么，一边吃着松饼。宫城对宇都宫露出我在高中时看过的笑容。就在我因为那个不会对我展露的笑容而停下吃松饼的动作时，宇都宫开口说：","「对了。仙台同学没有交往对象吗？」","她突然抛出我和宫城独处时绝对不会出现的话题。","「没有。宇都宫呢？」","「我也没有。志绪理呢？」","「你也知道我没有啊。干嘛问我？」","「顺口问一下嘛。」","宇都宫笑着说道。","今天的主角这么开心是件好事，可是我总觉得她的开心是用宫城的寿命换来的。对我的心脏也不太友善。","「不需要这么顺便。」","宫城轻声叹气，喝下一口红茶。","我没和宫城聊过这种话题，感觉很新鲜，但是一想到她可能会说出我不想听到的答案，多少有些紧张。话虽如此，脑中依然浮现想问的问题。","平常没有机会问的事。","要是问了，会觉得早知道就别问的事。","这样的问题在我的脑中不停打转。","「那喜欢的人呢？」","想问的事情不是透过我，而是从宇都宫的嘴里冒出来，我的心脏怦通一跳。","「这你也知道吧？没有。」","宫城立刻回答。","听见预料中的答案，我松了一口气，同时感到失望。她没有喜欢的人，就表示我连是那个人的可能性都没有。我心里明白，却还是不想听到「没有」这个答案。说是这么说，她要是回答「有」，我也不认为那会是我，还是会消沉地猜想她喜欢的人究竟是谁。不管答案为何，我都会很失落，所以这是不要知道比较好的答案。","「仙台同学没有喜欢的人吗？」","宇都宫直直盯着我。","嗯，照这个话题走向，她当然会问我。","伤脑筋。","要是回答「有」，事情会变得很麻烦，可是我也不想在宫城面前回答「没有」。","「宇都宫呢？」","总之，我用问题回答了问题。","假如对象是宫城，她这时候一定会抱怨，但跟我还不熟的宇都宫多半不会这么做。","「没有。」","「这样啊。你平常都会和宫城聊这些吗？」","「也没有，只是有点在意像这样跟人合租房子，有交往对象的时候该怎么办。」","「我和宫城有事先拟订一些规则，不过还没讨论过有交往对象时该怎么办。这方面的规则或许也该先决定好呢。」","我不希望迎来「必须用上这种规则的那天」，所以不需要拟订。可是我也不能对宇都宫说这种话。勉强让话题延续下去并征求宫城的同意后，她回了句「是啊」。","「果然有规则啊。」","宇都宫大概接受了这套说词，感慨地说道。对话就此中断。","我看向宫城，她正在吃剩下的松饼，接着像突然想到什么似的站起来。","「我去一下厕所。」","宫城这么说。一副要逃离宇都宫的样子。","我能理解她的心情。","照这样下去，宫城大概又会被流弹波及。","「慢走。」","让这个话题延续下去，我和宫城可能都会受重伤，于是我没多加阻拦，目送宫城离去。","现在只剩下我和宇都宫。","该聊些什么呢？","我试着寻找无伤大雅的话题，一边把旁边的鸭嘴兽面纸盒套拉过来，摸摸它的头。这时，宇都宫「啊」了一声。","「这感觉会出现在志绪理的房间耶。仙台同学喜欢这种类型的东西吗？」","「因为这只鸭嘴兽是宫城挑的。」","我拍了拍面纸盒套的头。","「原来是这样，难怪有志绪理的感觉。」","高中时期看过好几次的鳄鱼面纸盒套浮现在我的脑海中。我不晓得那个面纸盒套现在是否还在宫城的房间里。不过从刚刚还在宫城房里的宇都宫随口说出「有志绪理的感觉」这点来看，她应该有看到宫城房里的鳄鱼。","我没有特殊理由就无法踏进宫城的房间，尽管希望能亲眼看看里面的状况，这也无可奈何。宇都宫没有做错什么事，我也不知道鳄鱼是不是真的还在。","「你们两个比我想得更要好呢。」","宇都宫看着鸭嘴兽，又补上一句「比如房里有这种东西」。","「以合租室友来说是不错啦。」","「说得也是。毕竟你们是合租室友，感情自然好。」","宇都宫说完，喝下大约半杯冰红茶后看向我。","「仙台同学比想像中更随和呢。该怎么说，高中时总觉得你难以亲近……」","「因为羽美奈在旁边吧。」","「嗯，算是吧。」","果然。","不论好坏，羽美奈都相当醒目，所以有部分同学会和她保持距离。我觉得她算好相处的类型，可是她不守校规，是老师眼中的问题学生。跟她在一起，其他人不敢找我搭话也不奇怪。","「仙台同学之前是教志绪理念书吗？」","也许是觉得自己在讲羽美奈的坏话，宇都宫换了个话题。","「对啊，算是报答我在书店里忘记带钱包时，她借我钱的恩情。本来没打算教那么久，不过我身边没有宫城这种类型的朋友，觉得很有趣。」","「啊～的确。茨木同学她们和志绪理完全是不同的类型。」","「我也会在宫城房间里看漫画。毕竟她有不少羽美奈那边没有的漫画。」","「志绪理的房间里确实有很多漫画。」","宇都宫笑着说道。","我当时觉得宫城的房间待起来很自在，几乎看完了房里所有的漫画和小说。现在也会看她房里的书，但那是宫城拿来我房间，而不是我直接从书柜上挑的。","「你们就是因为这样才好到会合租房子啊。」","「一个人住外面也不太安心。虽然我没想到她会说自己跟亲戚住在一起。」","「我也没想到志绪理会和仙台同学住在一起。」","宇都宫用开朗的语气补上一句「吓了我一大跳」，接着轻轻呼出一口气。","她欲言又止地看着我，又垂下视线。","连同刚才呼出的份，宇都宫深深地吸了一口气，这才平静地开口：","「……说实话，听到志绪理跟仙台同学住在一起，我受到了很大的打击。志绪理从来没跟我提过这件事，让我有种被排挤在外的感觉。虽然我自己也觉得这样想有点幼稚。」","宇都宫尴尬地哈哈笑了几声，歉疚地对我说：「对不起喔，讲这种奇怪的话。」","「我不觉得幼稚喔。要是同样的事情发生在我身上，我也会觉得朋友好像被人抢走了。」","幼稚的人其实是我。","自己说宇都宫可以来玩，却无法真诚地欢迎她。主动建议宇都宫去宫城的房间，这番话却不是发自内心。","可以的话，我也想像宇都宫一样诚实说出自己的心情，但是不行。无论是我无法真诚欢迎她来家里玩，还是没能发自内心建议她去宫城房间的原因，我都不能告诉她。我不可能在这时候说出我甚至没有告诉当事人的这份心意。","作为交换，我开口讲出原本就打算趁宇都宫今天来玩时对她说的话。","「是说关于称呼，叫我叶月就好。」","虽然宫城坚持不肯叫我的名字，可是我的朋友几乎都叫我叶月。所以我希望宇都宫也这样叫我。总觉得藉由改变称呼，我们的关系会变得比现在更亲昵。","——简单来说，我想要和宇都宫交好到我不会嫉妒她的程度。","尽管这么做很功利主义，但我认为这是个好方法。","理由当然也不仅如此。","我本来就觉得跟她应该很合得来，有机会成为朋友。而且宇都宫愿意对我说出真心话，也让我再次觉得想和她交朋友。","「嗯～」","宇都宫短暂沉吟后，挺直背脊。","「毕竟志绪理也没有直呼你的名字，在志绪理改变称呼前，我还是叫你仙台同学吧？倒是仙台同学可以直接叫我名字。」","看到她为此认真思考，一本正经地这么说，我也诚实回应。","「在宇都宫叫我叶月前，我也先叫你宇都宫吧。」","「那就这么办。」","宇都宫拍了一下手，结束这个话题。接着开口叫我：「仙台同学。」","「什么事？」","「我们能当朋友吗？」","「当然。」","我这么回答后，宇都宫也说：「太好了。」，下意识地相视而笑。这时，宫城打开房门走进来。","「你们两个在聊什么？」","宫城坐在我斜前方，交互看着我们。","「在聊宫城的秘密……如果是这样就好了。不过我们只是在聊我高中时为什么会教宫城念书之类的事情啦。」","我笑着回答，宫城仍投来狐疑的视线，开口问宇都宫：「舞香，是真的吗？」","「真的、真的。只是在闲聊而已啦。」","说完，宇都宫开心地笑了。","三个人一起去吃饭，两个人一起回家。","我现在正在自己的房间里接受宫城的质问。","因为约两小时前还在这个房间里的宇都宫已经不在，宫城板着一张脸。","「你到底跟舞香说了什么？」","她用在宇都宫面前几乎不会发出的低沉声调问我。","「你是指哪件事？」","「我去厕所的时候，你们两个说了什么吧？」","宫城用额头上仿佛写着「我很在意」的表情看着我。","光看就知道她心情很差。","刚才她坐在我斜前方，现在坐在我身旁，所以我很清楚。她浑身带着尖锐的气息，在旁边都感觉得到。我很高兴宫城理所当然地待在我身边的日常生活又回来了。然而，要面对心情恶劣的宫城可不是值得高兴的事。","「没聊什么啊。宇都宫不也说了吗？」","我们真的只有闲聊。","要对方叫自己的名字。这在即将成为朋友的人之间是常见的话题，没什么好隐瞒的。我觉得不该把宇都宫吐露的真心话说出来，不过除此之外都是普通的闲聊。我们也没有约好不能告诉宫城。","可是一旦告诉宫城，她的心情多半会变得更差。","「一定是骗我的吧？你们聊了其他的事。」","「你是在怀疑宇都宫吗？」","「我是在怀疑仙台同学。」","宫城说得斩钉截铁。","单方面遭到怀疑实在太不合理了。我知道要比诚信，自己绝对赢不了宇都宫，但她对我的态度未免太差了。","「只有聊这只鸭嘴兽是宫城选的，还有为了感谢你借我钱，我才教你念书这些事。我们有约好不提奇怪的事，所以我没有说任何宫城不希望我说的事。」","如果可以轻描淡写带过，我不想说得太详细。","因为宫城似乎不希望我和宇都宫感情变好，要是把我们的对话原封不动地转述，她可能会觉得我太亲近宇都宫，搞不好还会以为我想抢走她的朋友。我不想特地讲出这些大可不必让她知道的事，避免招来误解。","「真的吗？」","「真的。宫城觉得我说了什么？」","「我不希望你说的事。」","「那是怎样的事？」","「你这是明知故问吧？」","我们高中时期的所作所为，宫城应该都希望瞒着宇都宫。然而，这不仅限于宫城，我也这么想。","「你不用担心，我说的都是很普通的事。你真的很在意就去问宇都宫啊。」","听我这么说，宫城垂下视线。","不晓得在想什么，她不愿意抬头看我。","我根本没说什么会引人怀疑的事，不过从宫城的角度来看，也许是我跟宇都宫太过亲昵，她才会这么介意。我没打算从宫城身边抢走宇都宫，可是就像宇都宫感觉到的一样，宫城说不定也觉得「只有自己被排挤在外」。","「——仙台同学，转过来面对我。」","方才沉默不语的宫城把身体转向我，伸手拉我的手臂。","「我是面对着你啊。」","我从刚才开始就一直看着宫城。","可是她不满地皱起眉头。","「好好转过来啦。」","她又拉了一次我的手臂，于是我不只头，把整个身体都转过去面向宫城，问她：「这样可以了吗？」然而，她没有回话，也没放开我的手臂。","「宫城？」","我呼喊她的名字时，宫城依然抓着我手臂的那只手微微用力，把脸凑过来。","她大概要吻我。","我立刻预想到将会发生在自己身上的事，闭上双眼。紧接着，某个柔软的东西触碰到我的嘴唇。本以为会是甚至来不及感受体温的吻，抵上嘴唇的却是湿润的东西。","真难得。","无论是宫城主动吻我，还是她想把舌头伸进来。","房间里的温度明明没变，可是身体好热。","尽管「为什么？」、「怎么会？」这些疑问闪过脑中，我的身体仍擅自选择去感受宫城。我轻启双唇，她似乎在这一瞬间有些犹豫。经过短暂的停顿，宫城的体温缓缓传入我的体内。","舌尖与舌尖相触、交融。","那个柔软湿润、含蓄地动着的物体宛如为我量身打造，与我融为一体，带来舒服的感受。从交叠的双唇、在口腔内探索的舌头，每一个接触的部分传来的温度缓缓在我的体内溶解。","我想要更深刻地感受宫城而动起舌头。她抓着我手臂的手用力，舌头和嘴唇随即抽离。尽管如此，我还想再和她接吻。打算把脸凑过去时，我听见她不悦的声音。","「告诉我，你们两个到底说了什么？」","啊啊，对喔。","我忘了。","宫城没事不会主动吻我。","「……这是交换条件？」","我说出她刻意省略的话。","「你要这么想也无所谓。」","她以前也曾以接吻为代价。我们不是第一次这样接吻，甚至做过更进一步的事。再说，即使是交换条件，我还是很高兴宫城愿意主动吻我。","所以这个吻不需要是特别的。","可是我觉得刚才这个吻不是一般的吻。","能提出交换条件的对象有两个，宫城却选择了我。","「你不问宇都宫，选择问我的原因是什么？」","听我这么问，宫城的视线落在地板上。","假如有原因，我想知道是什么，她却沉默不语，于是我继续说下去。","「不管是要请她吃饭还是怎样都好，你大可去问宇都宫吧？不如说，如果对象是宇都宫，即使不提出交换条件，她也会告诉你吧？」","「谁知道。舞香说不定不会告诉我啊。」","宫城看着我，自言自语似的喃喃说道。","她的藉口根本不成立。","只要宫城认真拜托，宇都宫一定会告诉她。假如宇都宫真的不肯说，到时候她再来问我就好了。根本不需要一开始就选择我。","因为她想吻我。","我不禁认为她是基于这个理由才选择先问我。虽然八成是我想得太美了，我还是忍不住这么想。","我正试图从她「不找宇都宫，而是选择我作为提出交换条件的对象」这件事中寻找更深层的意义。即使不尽相同，我也希望宫城心中怀有类似的感情。","「仙台同学，告诉我啦。」","我不要。","不仔细、清楚、确实地用足以说服我的说法来解释选择我的原因，我就不说。","可是我要是真的这么说，宫城一定会说「算了」。","「那再吻我一次。」","即使是筹码也无所谓。","我想要宫城再主动吻我一次。","「我会吻你，所以你先向耳环发誓，说你绝对会告诉我。」","「好啊。」","我伸手碰宫城的耳环。用拇指抚摸缅栀花，如此宣告：「只要宫城再吻我一次，我就会说。」","「这样可以吗？」","让手顺着耳垂抚过她的脸颊并这么问，宫城便把脸凑过来。","我主动闭上双眼，她的嘴唇立刻与我的重叠。","尽管没有提出附加条件，柔软的东西仍窜入我的口腔。","只是向耳环发誓，宫城就会乖乖吻我。","真希望宫城一直这么听话。","我也知道这很难。","但我想随心所欲地和宫城接吻。","她的手碰到我的腰。","稍微靠近，用力地将嘴唇抵上来。","可是，嘴唇比刚才的吻更快离开。","「仙台同学，我吻完了。」","宫城公事公办地说。","我和宇都宫的对话中还没有告诉宫城的部分，只有宇都宫的真心话和我希望她能叫我的名字这两件事。即使没约好要保密，我还是不该擅自说出宇都宫的真心话，何况，我也不打算说。如此一来，必然只剩下一个选项。","可是这感觉会引来宫城的误解，所以我不想说。","我想随便蒙混过去。","就算只是一时的，我也无法忍受宫城误会我要抢走宇都宫而疏远我。她可以不喜欢我，但我不希望她讨厌我。","「仙台同学。」","宫城严肃地叫了我的名字。","「今天我去接舞香，和她一起走回来的路上，看到了仙台同学说的三花猫。我知道仙台同学说的话是真的，也觉得可以再多信任你一些，所以你好好遵守刚才的约定啦。」","听到她格外认真的语气，我轻叹一口气。","即使不多，我也不想失去稍微增加的信任。","「只是讨论了一下称呼方式。」","「称呼方式？」","「对。我跟她说可以直接叫我叶月就好。」","「……舞香同意了吗？」","宫城直直盯着我问道。","「你今天在那之后，有听到宇都宫叫我叶月吗？」","「没有。」","「就是这么回事。她说宫城也没直呼我的名字，所以在宫城叫我叶月之前，她也会叫我仙台同学。」","我这么说完，宫城便陷入沉默。","她或许是在思考些什么，一度垂下眼皮看着地面，又把视线挪回我身上。然后，她平静地开口：","「……意思是仙台同学会叫她舞香吗？」","「我今天一直叫她宇都宫吧？聊起这件事时，我也表示在她改口叫我叶月之前，我都会叫她宇都宫——总之，宫城想知道的事情就只有这样。除此之外，我们真的只有聊一些高中时期的事。」","我在宫城开始胡思乱想前结束这个话题。","要是讲太久，我说不定会讲出自己觉得没什么，对宫城而言却相当重要的话。","「喂，宫城。」","我往后靠着床舖。","「干嘛？」","「叫我叶月啦。」","我知道她八成不会答应，还是抱持姑且一试的心态问她。","「我如果叫你叶月，舞香也会这样叫你吧？」","「是没错。」","「……我会叫你仙台同学。」","经过短暂思考，宫城明确地表示。","〔本话含插图〕"]},{"t":"第10话　想再多触碰仙台同学","p":["考试将近，书本上的知识却读不进去。","我只是坐在桌前，满脑子都是还没结束家教打工、迟迟未归的仙台同学。","看了眼时钟，早就过了该吃晚餐的时间。","我走出房间来到共用空间。","虽然不怎么饿，我还是决定煮奶油炖菜。拿出菜刀和砧板，将红萝卜、马铃薯、洋葱削皮切块。","如果是去年，与其自己费时费力地煮奶油炖菜，我一定会选择现成的调理包，但现在不一样。和仙台同学一起生活后，我开始觉得做些简单的料理也不错，而且与其去思考一些无谓的事，还不如下厨。","奶油炖菜只要把材料切一切，简单炒过再加水炖煮就好。","不用思考该怎么调味，做出难吃成品的机率也很低。","在砧板上把蔬菜切成一口大小。","我早已习惯独处，可是一个人很无聊。碰到仙台同学要打工的日子，她回来之后也一样无聊。这是因为仙台同学时常提起那位我从没见过的学生，我根本不认识那个人，听了也没意思。","真要说起来，她平时都在，却又时不时会像这样不在家，完全打乱了我的生活节奏。都怪仙台同学不早点回来，我连切菜这么简单的事情，都差点切到自己的手指。","我停下正在切马铃薯的手。","要是我就这么没切到马铃薯，而是切到自己的手指。","伤口深到血流不止。","——仙台同学会怎么做呢？","我叹了口气。","仙台同学不可能因为我切伤手指这种小事就辞掉打工。我知道不管仙台同学在哪里做些什么都与我无关，可是自从舞香来玩之后，我就变得比以前更想要干涉仙台同学。","「早知道就吃调理包。」","我明明是想避免自己胡思乱想才跑来下厨，结果尽想些无谓的事。然而，我也不可能事到如今才改吃调理包，只好继续切完剩下的蔬菜和鸡肉，丢进锅里拌炒。","加水炖煮，心不在焉地捞掉煮出的浮沫。","关火后放入白酱料理块，再打开炉火，一边加热一边搅拌，避免烧焦。","倒入牛奶，瞪着锅子。","特地煮的奶油炖菜不该是一个人吃的料理。我无论如何都会想起不在家的仙台同学。后悔地想着果然该吃调理包的时候，感觉会和我分享打工生活的仙台同学回来了。","「我回来了。」","我站在锅子前回她「欢迎回来」，仙台同学就像狗一样用力嗅闻空气中的味道，朝我走来。","「宫城这边传来好香的味道。」","「不是我，是锅子。」","「你煮了奶油炖菜？」","仙台同学站在我身旁。","距离近得可以接吻，我不禁看着她的脸。","这种时候都是仙台同学吻我。不过我应该也可以主动吻她，如果是现在，我只要稍微靠过去就能吻她。","由谁主动？要在什么时候？","我不记得我们有制定这样的规则，所以我大可直接吻她，不需要理由。","「宫城？」","听见仙台同学的呼唤，我才把视线从她的脸移回奶油炖菜上。","不用仔细想也知道，如果我没有任何理由地突然吻她，她一定会有意见。再说，我也不想没来由地吻她。只是莫名觉得这样的距离适合接吻，不吻她也无所谓。","我只是在舞香造访之后变得有点奇怪。","「你不用靠得这么近，光闻味道就知道我在煮奶油炖菜吧？」","我推了一下仙台同学的肚子。","「我只是想看有没有我的份。」","仙台同学退开两步后说道。","「我才不会煮一人份的奶油炖菜。」","「这样啊。快煮好了吗？」","我用一句「好了」回答她明快的提问。","「我去放这个，等我一下。」","仙台同学向我展示包包，朝自己的房间走去。","我关上炉火，拿出两个盘子添饭，淋上奶油炖菜。仙台同学很快就回来，帮忙把奶油炖菜和汤匙端上餐桌。","「我开动了。」","我和仙台同学异口同声地说完，吃下一口奶油炖菜。","明明使用同样的材料和料理块，我煮的却没有仙台同学煮的好吃。尽管吃进肚子里都一样，既然要吃，还是选好吃的比较好。","「宫城的厨艺变好了耶。很好吃。」","仙台同学的声音响起。","「……谢谢。」","我礼貌性地道谢。","可是仙台同学不管吃什么都会说好吃。","我想即使我煮得不好吃，她八成也会说好吃。就算是难吃的失败品，她也会全部吃完。我并不讨厌仙台同学这样的个性，但还是想听听她的真心话。","我不会要求她时时刻刻都说真话，只是不希望她敷衍带过某些事。","——例如舞香来的那一天。","虽然已经问出她们两个聊了些什么，我还有其他在意的事。","那天，在舞香问有没有喜欢的人时，仙台同学没有给出答案。因为只有她没回答，这个问题一直残留在我的脑海中。我和仙台同学平时不会聊这种话题，所以在那之后我也没有机会问出她的答案。","这不是需要追问到底的事，但只有仙台同学没回答太奸诈了。我都回答了，即使现在才说也无妨，她应该要回答才对。可是没有回答就表示她可能有喜欢的人。","「仙台同学。」","她喜欢谁都无所谓，但是不需要更多像打工那样优先于我的事情。只是我也明白，即使我不需要，只要仙台同学认为有必要，我也无可奈何。假如真的有那个人，我至少要知道对方是怎样的人。","「什么事？」","仙台同学咽下奶油炖菜，看着我。","喜欢的人这种事情大家都会聊，我不仅会和舞香，也会和亚美聊。明明是这种可以跟任何人聊的简单话题，我却像是要说一件非常难以启齿的事情，一句话哽在喉头，就是说不出来。","「下次换你煮奶油炖菜。」","嘴里说出不同于心中所想的话。","「好啊。」","她轻快地回应。","这不是非要现在问的事情。","只是舞香聊起这个我们平常不会聊的话题，事情才会变得不对劲。","我用不会被仙台同学听到的音量，小声地叹了一口气。","桌上放着生乳酪蛋糕和冰红茶。","时不时会买饭后甜点回来的人是仙台同学，她背靠着床舖，坐在我的斜前方。","「为什么买蛋糕？」","我摸着住在仙台同学房里那只鸭嘴兽的脑袋。其实在我房间吃也可以，可是饭后根本没机会开口，我就来她房间了。","「考完试了，庆祝一下。」","仙台同学这么说完便接着说「我开动了」，拿起叉子切下蛋糕的尖端，送入口中。","「考试结束是很开心没错，但有需要吃蛋糕庆祝吗？」","「即使不需要，有个理由的话，吃起来感觉会更好吃嘛。」","「单纯是仙台同学想吃蛋糕吧？」","「哎呀，是没错。反正这很好吃，宫城你也吃嘛。」","她展现灿烂的笑容，所以我也说着「我开动了」，吃下一口蛋糕。","湿润滑顺的生乳酪和底部的饼干在口中融为一体。","仙台同学之前也买过这间店的生乳酪蛋糕，吃起来有明显的酸味，口感清爽。即使刚吃过晚餐，这蛋糕依然美味到要我吃下两块或三块都没问题。","「仙台同学，你喜欢生乳酪蛋糕吗？」","今天纸盒里只有两块生乳酪蛋糕。","上次里面装着四块蛋糕，仙台同学把生乳酪蛋糕和草莓鲜奶油蛋糕给我，吃了剩下的起司蛋糕和草莓塔。","「喜欢啊。」","「那生乳酪蛋糕跟一般的起司蛋糕，你比较喜欢哪一个？」","「都喜欢。宫城你喜欢生乳酪对吧？」","「是没错啦。」","我当时问仙台同学在这四个蛋糕中比较喜欢哪个，她的回答是「草莓塔和起司蛋糕」。从今天她只买了生乳酪蛋糕来看，我认为和起司蛋糕相比，她应该更喜欢生乳酪蛋糕，但仙台同学总是不说实话。","「除了乳酪蛋糕，宫城还有什么喜欢的蛋糕？」","她像平常一样，没有给我明确的回答。","你到底喜欢那一个？","即使我用问题回答她的问题，仙台同学恐怕只会再重复一次「都喜欢」。","我至少要了解她喜欢的蛋糕类型，不过这也不是需要打破砂锅问到底的事。","「不会太甜的。」","我咽下感觉只会是白费工夫的话，回答她的问题。","「的确，太甜的蛋糕吃到一半就会腻呢。」","说完，仙台同学大口喝下冰红茶。","无论什么事情，套在她身上都会变得很困难。就连喜欢哪种蛋糕这种常见的问题都问不出答案。喜欢的对象这个朋友们聚在一起就会聊到的话题，我依然不晓得她的回答。唯有「想知道」的欲望如气球般不断膨胀，我却无法将装满疑问的气球递给她。","「对了，宫城。」","仙台同学像是突然想到似的拍了一下手，继续说下去。","「暑假你打算怎么办？你没有要回去吧？」","「是没有要回去，不过我还没决定好要做些什么。」","考完试就放暑假了，我的行程表仍是一片空白。","假期明明比高中更长，却没有要做的事。","「既然这样，要不要一起去哪里玩？你没有要和宇都宫出去玩吧？」","仙台同学自然地搬出舞香的名字。","她们两个在那之后似乎变得比之前更要好。无论是跟哪个人说话，都会不时跳出另一个人的名字。","「你为什么觉得我不会跟舞香去玩？」","「因为我听宇都宫说她暑假会回老家。她当时是说会在那边待上很长一段时间，还是她改变计划了？」","「……没有。她要九月才会回来。」","我在这个房间里看到的仙台同学和舞香感觉十分亲昵，即使说这两人是认识多年的朋友也不奇怪。而且她们好像很合得来，所以我本来觉得舞香可以成为我们的共同朋友。可是我不知道她们的感情好到会和对方讨论暑假的行程。","「这样啊。那表示你有很多时间喽？」","仙台同学粲然一笑。","我的确有时间。","要我暑假和她出去玩也不是不行，但是我不想老实地答应她。那是因为我很介意舞香的事。对我而言，面对能理所当然地掌握我朋友行程的仙台同学，就像吃了太甜的蛋糕，感觉很不舒服。","我想知道。","她和舞香有多亲密，两人都聊了些什么。","我没听说她们两个有私下碰面，在那之后她们有一起出门吗？","我想要知道。","可是我问不出口。我不该过度干涉仙台同学的人际关系，也知道我问这种问题很不自然。","我将眼前的生乳酪蛋糕切下一大块，大口吃下。清爽的酸味在口中扩散开来。本来轻盈顺口的生乳酪，现在吃起来却又甜又腻，感觉会让人消化不良。","「宫城，我们暑假一起去哪里玩啦。」","舞香是我的朋友，即使她和仙台同学变得要好，这点也不会改变，可是心中的另一个我又希望她们不要太亲近。","「我没有安排，可是我哪里都不想去。」","「你也太不喜欢出门了吧？」","「天气那么热，不需要特别跑去外面吧？」","我想说的不是这个。","仙台同学和舞香走得太近，害我过度在意每一件事，什么都做不好。想问又问不出口的问题一直在脑袋里打转，让我说不出真正要说的话。","这都是仙台同学不好。","都怪她那么亲昵地提起舞香，才会变成这样。","舞香是我最要好的朋友，是特别的朋友，所以我希望仙台同学不要太接近舞香。这样下去，舞香可能会被仙台同学抢走，我不想看到那种事情发生。","不对。","至今，舞香不管跟谁在一起，我都没有在意过。","但仙台同学一介入，我就无法整理自己的心情。","我——","不想看到仙台同学被舞香抢走。","我希望她们两个不要再走得更近了。","不管她们走得多近，变得多要好，也不过如此。仙台同学不会触碰舞香，更不会吻她。同样的，舞香也不会触碰仙台同学或是吻她。我和舞香不同。我才是仙台同学的室友，只有我可以和仙台同学住在一起。我心知肚明，但仙台同学关注的对象只是稍微转移到其他人身上，我便感到不安。","「算了，既然宫城这么说，在家里看电影也可以啦。」","仙台同学的声音传来，打断我的思绪。","我不想看她的脸，让视线移动到她的盘子上。生乳酪蛋糕已经消失了。","我也拿叉子叉起蛋糕。","分次将蛋糕送入口中，吞进胃袋。","明明是在吃蛋糕，我却觉得嘴里含着的是土。","「你有什么想看的电影吗？」","她体贴的柔和嗓音传入耳中。","我现在的脸色八成不太好。眉间想必堆起了皱纹，眼神可能也很凶恶。","「仙台同学决定就好。」","我冷淡地说完，喝下一口冰红茶。","该回自己房间了。","我清空盘子，放下叉子。","可是在我起身前，仙台同学握住了我原本放在桌上的手。","「宫城，蛋糕不好吃吗？」","仙台同学的问题和行为完全没有关联性。这时候大可不必这么做，她却伸手过来握住我的手。","她总是做些动机不明的事。","而且不管有没有理由，仙台同学的身体都柔软又温暖，非常舒服。只要触碰仙台同学，我就会感到安心，知道她关注的对象依然是我，也不会去在意舞香。","所以我想触碰仙台同学。","不能是其他人。","可是我不想让她成为「特别」的人。","只要室友这个关系是「特别」的就好。","我们约好在大学毕业之前一起合租房子，这是没有和其他人做过的约定。可是我们的「特别」有到毕业为止这个期限。高中时我们也用毕业当期限做过约定，但我不认为这次的约定和那次一样。要是让她这个人本身变成「特别」的，我可能无法从大学毕业。","约定是用来遵守，不是用来打破的。凡事也没有永远，总有一天会结束。","即使撤除毕业这个期限，也绝对会迎来结束的那一天，所以我们应该遵守约定。","「我要回房间了。」","我试着抽回被她握着的手，想要站起来，她却不肯松手。我瞪着仙台同学，她则回以笑容。","「再待一下嘛。都考完试了，可以悠哉一点啊。」","「我不是说要回房间吗？放开我。」","「你说你会再多待一下，我就放开你。」","仙台同学不是第一次说这种坏心眼的话，可是我希望她今天别这样。","像这样继续和她牵手，我将变得不再是自己。","「我不要。」","我比刚才更用力地抽手。","「宫城，这样很危险。你会弄倒玻璃杯。」","嘴里这么说，仙台同学还是不打算放手。她无端牵着我的那只手比刚才更用力，我能更强烈地感受到她的体温。清楚传过来的温度引诱着我，让我更想触碰仙台同学。","「仙台同学。」","我呼喊她的名字，她仍不放手。","既然如此——","我跪在地上。","既然她没有任何理由牵起我的手，还没来由地一直牵着不放，我接下来要做的事情也不需要任何理由。","我让自己的嘴唇与仙台同学的交叠。轻轻挤压后，体温揉合著比手更柔软的触感传了过来。仙台同学很快地把嘴唇用力抵上来，我则逃避似的别开脸。然后她立刻松开刚才还牵着我的手。","「刚才的吻是要我放手的意思吧？」","仙台同学如此断言。","我并没有要用这个吻当作交换条件，可是我也没打算特地纠正她。既然仙台同学认为这是有理由的吻，就当作是那么回事。","「是没错，但不是这样。」","「什么意思？」","我深吸一口气后吐出，移动到仙台同学身旁。","「我之前在这个房间里答应了仙台同学的请求对吧？」","「你说的请求是指？」","仙台同学一脸困惑。","「你拜托我同意你接下来要做的事，你忘了吗？」","那件事正是让舞香得知我和仙台同学是室友的契机，我可不准她说忘了。我还清楚记得那天和仙台同学在这个房间里做的事，想必一辈子都不会忘记。","「……我记得。」","仙台同学难得小声地说。","「那个，你还没有还我。」","虽然无法问出想知道的事情，但我可以触碰仙台同学。因为我们一直以来都像这样触碰彼此。","「『没有还』是指什么？」","听到仙台同学的声音，我挪开与她交会的视线，呼出一口气。我没办法直视她继续说下去。","「我那时候答应了仙台同学的请求，所以这次换仙台同学听我的了。」","我想知道的那股欲望连接到意想不到的地方，打开了我自己也没料到的开关。可是将我导向那个思考回路的是握住我的手不放的仙台同学，都怪她不赶快放开我的手。","「你希望我再做同样的事？」","「不对。是我要对仙台同学做那件事。我想知道仙台同学会变得怎样。告诉我啦。」","就像仙台同学触碰我，如果我也那样触碰仙台同学。","要是仙台同学让我听见她不会让任何人听见的声音。","即使她和谁感情变好，即使她优先其他事物，我可能也不会像现在这么不安。","我知道自己不该用这种态度触碰仙台同学，却无法克制。","「……你这是经历了怎样的心境变化啊？」","仙台同学试探性地问道。","「刚才就说了。我只是想知道仙台同学会变得怎样。你要是不想答应就拒绝我啊。只是你一旦拒绝我，我以后绝对不会再同意你做那种事。」","仙台同学嚣张地盘据在我的中心，我的心思有如被卷入漩涡中心的树叶般朝她而去。既然我无法将她赶出去，也逃不出这个漩涡，希望她至少能满足我想要触碰她、听她声音的欲望。","我和仙台同学四目相对。","她用格外认真的表情看着我。","我没打算让她拒绝。","而且仙台同学多半不会拒绝。尽管如此，我还是忍不住想像她拒绝的画面。她明明可以赶快说点什么，却迟迟不开口，害我的手快开始颤抖了。","「仙台同学，你的回答呢？」","我开口催促一直保持沉默的她。然后，她叫了声「宫城」。","「照你刚才的说法，如果我没拒绝，表示宫城愿意再让我做同样的事喔，你知道吗？」","「……我知道。」","我明白自己说了什么。","也没打算撤回前言。","要是能得到今天的仙台同学，我不介意拿未来的自己当筹码。","「你知道就好。」","传来她柔和却坚定的声音。","她连眼睛都没有眨，就这么凝视着我，让我很想移开目光。可是逃离仙台同学的视线会让我接下来要做的事情变成非常不好的事，所以我不能闭眼，也不能移开视线。","「意思是你同意我这么做吗？」","我再次向她确认，她回我「是这样没错」。","如果是最近的仙台同学，这时候就算对我微笑也不奇怪，今天却没有笑。脸上依然挂着认真的表情。这让气氛变得很凝重，仿佛接下来要做的是一件意义重大的事。所以我希望她表现得和平常一样。这种时候才摆出诚恳的表情实在太奸诈了。","「那么，这是交换条件，去拿两条毛巾来。」","我用不大不小的音量，对以为刚才的吻是交换条件的仙台同学说道。","「咦？等一下。我刚刚问你接吻的交换条件是不是要我放开你的手，你说不是对吧？所以我以为交换条件的对象是你接下来要做的事，难道不是吗？」","「接下来要做的事是之前我答应仙台同学的请求之后你欠我的，所以不是交换条件。毛巾才是。」","「……原来如此。所以你想拿毛巾做什么？」","「你别管我，拿来就对了。」","「宫城是变态。」","仙台同学的声音和语气都跟平常一样，唯有表情不同。我没办法从那双直直看过来的眼眸读出她的心声。","「我什么都没说，也还没做任何事耶。」","「至今为止，你拿毛巾不是要绑住我的手，就是要蒙住我的眼睛。」","「既然你知道答案，就不要特地问我啊。」","如果仙台同学的表情和平常不一样，只要遮住那张脸就好了。我看不到自然就不会在意。再来是限制住她的行动。这样一来，我就能依照自己的想法去做。虽然会加剧内心的罪恶感。","「算了，我去拿。」","仙台同学无奈地说完便站了起来。","她挪动修长的双腿。","穿着牛仔裤而不是裙子的她走到五斗柜前，拿着白色的毛巾回来。","「来，请用。」","把毛巾放在我头上后，仙台同学坐到床上。我的视线自然地追着她，毛巾从头上掉了下来，我在落地前一把抓住那个白色物体，这才发现只有一条。","「另一条呢？」","「你只有吻我一次，所以是一条。要拿来做什么是你的自由。」","「你这样太奸诈了。」","「宫城才奸诈吧？」","仙台同学用脚尖戳了戳我的腰。","和平常相反。","命令她舔脚时，我总是坐在床上，仙台同学坐在地板上。然而，今天坐在床上的是仙台同学，坐在地板上的人是我。","我抓住仙台同学的脚踝。","腿被牛仔裤包裹，几乎没有裸露在外的部分。扬起视线就能看见从短袖T恤的袖口中伸出的手臂。","她穿的不是制服，也没有穿裙子，我却觉得自己现在正看着与她平时的视角相去不远的景象。我没打算舔她的脚，只是有种不可思议的感觉。","「宫城，你决定好要怎么用了吗？无法决定的话，也可以干脆不用喔。怎样？」","仙台同学的声音从头上传来，我毫不犹豫地回答。","「闭上眼睛。我要蒙起来。」","「你原本为什么想绑住我的手？」","没闭上眼睛的仙台同学开口问我。","「让仙台同学在我行动的时候不会做奇怪的事。」","「我不会做任何事，你放心吧。那蒙眼睛呢？」","因为仙台同学的表情和平常不一样。","我不能这么说，于是回答了另一个理由。","「只是因为我不想被你盯着看。」","「一般来说，那是我的台词吧？通常都是被动的那一方不想被盯着看啊。」","「是谁的台词都没差吧？」","「那你为什么不想被我看？」","「你很啰唆耶。」","仙台同学原本就话很多，今天又特别爱追问。再继续说下去，什么都不用做了，所以我决定站起来，拿毛巾蒙住她的眼睛。可是在毛巾碰到仙台同学前，她抓住我的手腕。","「你可以蒙住我的眼睛，不过在那之前笑一下。」","仙台同学温柔地说完，对着我微微一笑，一副要我照做的样子。","「不要。」","「不笑的话就吻我。」","她大概不觉得我会笑，马上抛出下一句话。","我没道理拒绝她。","缓缓把脸靠近后，仙台同学闭上双眼。我凝视她端正的五官，接着触碰比手里握着的毛巾更柔软的嘴唇。可是在感觉到那滑嫩的触感及体温前，我便离开她的双唇，用毛巾蒙住她的眼睛。","「什么都看不见。」","「你看得见就麻烦了。」","我轻轻碰了她的肩膀一下，仙台同学便躺到床上。我坐到她身旁，关上灯，把遥控器放在床上。","「……仙台同学，转过去面对那边。」","「那边是哪边？」","「墙壁那边。」","已经蒙住眼睛也关了灯，所以不管仙台同学面向哪里，我都没办法清楚看见她的脸，她也没办法看见我的
